<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atendimento Lola · inbox (teste)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#eceff1;--panel:#fff;--line:#eaedf0;--line2:#f0f2f4;--line3:#eef0f2;
    --neutral:#f2f4f6;--chatbg:#efe9e1;
    --ink:#101d24;--ink2:#7d8b93;--ink3:#9aa5ad;--thumb:#c9ccd1;
    --brand:#a4242f;--brand-tint:#fbe9ea;--green:#1f8a5b;--green-vivid:#25d366;--green-tint:#e7f6ee;
    --sans:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --serif:"Fraunces",Georgia,serif;
    --shadow:0 8px 24px rgba(16,29,36,.1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px}
  ::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--thumb);border-radius:20px}
  button{font-family:inherit;cursor:pointer}
  .app{display:flex;flex-direction:column;height:100vh;overflow:hidden}

  .topbar{height:64px;flex-shrink:0;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;gap:16px}
  .tabs{display:flex;align-items:center;gap:4px;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:11px;border:0;background:transparent;color:#4b5760;font-size:13.5px;font-weight:600;white-space:nowrap}
  .tab i{font-size:17px;color:#66727a;font-style:normal}
  .tab.active{background:var(--brand-tint);color:var(--brand);font-weight:700}
  .top-right{margin-left:auto;display:flex;align-items:center;gap:14px;flex-shrink:0}
  .top-div{width:1px;height:30px;background:var(--line)}
  .userblock{display:flex;align-items:center;gap:9px}
  .ub-av{position:relative;width:38px;height:38px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px}
  .ub-av .dot{position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;background:var(--green-vivid);border:2px solid #fff}
  .ub-nm{font-size:13px;font-weight:700;line-height:1.1}.ub-rl{font-size:11px;font-weight:500;color:var(--ink2)}
  .menu-back{display:inline-flex;align-items:center;gap:5px;background:var(--neutral);border:0;color:#54656f;font-weight:600;font-size:12.5px;padding:8px 12px;border-radius:11px}

  .workspace{flex:1;display:flex;overflow:hidden;min-height:0}
  .col-list{width:372px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .list-head{padding:18px 20px 12px;flex-shrink:0}
  .lh-row{display:flex;align-items:flex-start;justify-content:space-between}
  .lh-title{font-size:19px;font-weight:800;letter-spacing:-.01em}
  .lh-title-m{display:none;font-family:var(--serif);font-weight:600;font-size:26px;color:var(--brand)}
  .lh-sub{font-size:12px;font-weight:500;color:var(--ink2);margin-top:2px}
  .compose{width:36px;height:36px;border-radius:11px;border:0;background:var(--neutral);display:grid;place-items:center;color:#54656f;flex-shrink:0}
  .search{margin-top:12px;display:flex;align-items:center;gap:9px;background:var(--neutral);border-radius:12px;height:42px;padding:0 13px}
  .search svg{width:18px;height:18px;color:#8a949c;flex-shrink:0}
  .search input{border:0;background:transparent;outline:0;font:inherit;font-size:13.5px;width:100%;color:var(--ink)}
  .search input::placeholder{color:#9aa5ad}
  .filters{display:flex;gap:6px;margin-top:12px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .fchip{flex:0 0 auto;font-size:11.5px;font-weight:600;padding:6px 11px;border-radius:20px;border:0;background:var(--neutral);color:#5a666e;white-space:nowrap}
  .fchip.active{color:#fff;font-weight:700}
  .waitbar{margin:8px 12px 0;padding:8px 12px;border-radius:11px;background:#fdecec;border:1px solid #f3c7c7;color:var(--brand);font-weight:700;font-size:12.5px;cursor:pointer}
  .waitbar.on{background:var(--brand);color:#fff;border-color:var(--brand)}

  .list{flex:1;overflow-y:auto;padding:4px 10px 12px;min-height:0}
  .convo{display:flex;gap:12px;padding:12px;border-radius:15px;cursor:pointer;align-items:flex-start}
  .convo:hover{background:#f7f8f9}.convo.active{background:#f4f6f7}
  .avw{position:relative;flex-shrink:0}
  .circ{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700}
  .selo{position:absolute;right:-2px;bottom:-2px;width:18px;height:18px;border-radius:50%;border:2.5px solid #fff;display:grid;place-items:center}
  .selo svg{width:11px;height:11px;display:block}
  .cbody{flex:1;min-width:0}
  .crow1{display:flex;align-items:baseline;gap:8px}
  .cname{font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  .ctime{font-size:11.5px;font-weight:600;color:var(--ink3);flex-shrink:0}.ctime.unread{color:var(--brand)}
  .crow2{display:flex;align-items:center;gap:8px;margin-top:2px}
  .cprev{font-size:13px;font-weight:500;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  .badge{flex-shrink:0;min-width:19px;height:19px;padding:0 6px;border-radius:20px;background:var(--brand);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
  .crow3{display:flex;align-items:center;gap:6px;margin-top:7px;flex-wrap:wrap}
  .pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
  .mtabs{display:none}
  .mtab{flex:0 0 auto;font-size:12px;font-weight:600;padding:6px 12px;border-radius:20px;background:var(--neutral);color:#5a666e;border:0;white-space:nowrap}
  .mtab.active{background:var(--brand-tint);color:var(--brand);font-weight:700}
  .tag{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--neutral);color:#6a7681}
  .empty{padding:30px 16px;text-align:center;color:var(--ink3);font-size:13px}

  .col-chat{flex:1;display:flex;flex-direction:column;background:var(--chatbg);min-width:0;min-height:0}
  .chat-head{height:70px;flex-shrink:0;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 20px}
  .ch-back{display:none;border:0;background:transparent;color:var(--brand);padding:4px;margin-left:-4px}.ch-back svg{width:24px;height:24px}
  .ch-info{flex:1;min-width:0}
  .ch-line1{display:flex;align-items:center;gap:8px}
  .ch-name{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chpill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .chpill svg{width:11px;height:11px}
  .ch-sub{font-size:12.5px;font-weight:500;color:var(--ink2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ch-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
  .ch-ic{width:38px;height:38px;border-radius:11px;border:0;background:transparent;display:grid;place-items:center;color:#54656f}.ch-ic:hover{background:var(--neutral)}
  .ch-save{display:none;border:0;background:transparent;color:var(--brand);padding:6px}.ch-save svg{width:24px;height:24px}
  .btn-det{display:inline-flex;align-items:center;gap:7px;background:var(--neutral);border:0;border-radius:11px;padding:9px 13px;font-size:13px;font-weight:600;color:#3f4b52}.btn-det svg{width:17px;height:17px}

  .messages{flex:1;overflow-y:auto;padding:26px 8%;display:flex;flex-direction:column;gap:10px;min-height:0;background-image:radial-gradient(rgba(164,36,47,.05) 1px,transparent 1px);background-size:22px 22px}
  .daysep{align-self:center;background:rgba(255,255,255,.75);color:#8a7f72;font-size:11px;font-weight:600;padding:4px 12px;border-radius:20px;margin:2px 0 4px}
  .msg{max-width:74%;padding:9px 13px 7px;border-radius:16px;box-shadow:0 1px 1.5px rgba(0,0,0,.08)}
  .msg .who{font-size:12.5px;font-weight:700;margin-bottom:2px}
  .msg .tx{font-size:14px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
  .msg .hr{font-size:10.5px;font-weight:600;color:#8a97a0;text-align:right;margin-top:3px}
  .msg .file{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.04);border-radius:9px;padding:7px 9px;font-size:12.5px;font-weight:600}
  .msg.in{align-self:flex-start;background:#fff;border-radius:16px 16px 16px 5px}
  .msg.out{align-self:flex-end;background:#fae7e3;border:1px solid #f4d9d2;border-radius:16px 16px 5px 16px}
  .msg.out .who{color:var(--brand)}
  .msg.bot{align-self:flex-end;background:#fdf3e6;border:1px solid #f2ddbf;border-radius:16px 16px 5px 16px}
  .msg.bot .who{color:#b07a2a;display:inline-flex;align-items:center;gap:6px}
  .autoflag{background:var(--brand-tint);color:var(--brand);font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:5px}

  .composer{flex-shrink:0;background:var(--panel);border-top:1px solid var(--line);padding:12px 22px 16px;position:relative}
  .comp-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
  .sendas{font-size:12px;font-weight:500;color:var(--ink2)}.sendas b{color:var(--brand);font-weight:700}
  .bottoggle{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:#4b5760}
  .switch{width:38px;height:22px;border-radius:20px;background:#cdd3d8;position:relative;transition:.18s;flex-shrink:0}
  .switch.on{background:var(--brand)}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.18s}.switch.on::after{left:18px}
  .quick{display:flex;gap:7px;margin-bottom:9px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}.quick::-webkit-scrollbar{display:none}
  .qchip{flex:0 0 auto;font-size:12.5px;font-weight:600;color:#3f4b52;background:var(--neutral);border:1px solid var(--line);border-radius:20px;padding:6px 12px;white-space:nowrap}
  .qchip.mine{border-color:var(--brand);background:var(--brand-tint);color:var(--brand);font-weight:700}
  .inputrow{display:flex;align-items:flex-end;gap:10px}
  .field{flex:1;display:flex;align-items:flex-end;gap:8px;background:var(--neutral);border-radius:15px;min-height:50px;padding:9px 13px}
  .field svg{width:21px;height:21px;color:#7a858c;flex-shrink:0;margin-bottom:2px}
  .field textarea{flex:1;border:0;background:transparent;outline:0;resize:none;font:inherit;font-size:14px;line-height:1.4;max-height:120px;color:var(--ink)}
  .field textarea::placeholder{color:#9aa5ad}
  .send{width:50px;height:50px;flex-shrink:0;border-radius:15px;border:0;background:var(--brand);display:grid;place-items:center;box-shadow:0 5px 14px rgba(164,36,47,.28)}.send svg{width:22px;height:22px;color:#fff}

  .libpop{position:absolute;bottom:150px;left:22px;width:300px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:8px;display:none;z-index:30;max-height:300px;overflow-y:auto}
  .libpop.show{display:block}
  .libpop .h{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink2);padding:6px 8px 4px;font-weight:700}
  .libpop .it{display:flex;align-items:center;gap:9px;padding:8px;border-radius:9px;cursor:pointer}.libpop .it:hover{background:var(--neutral)}
  .ficon{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;font-size:14px;flex-shrink:0;color:#fff}.f-pdf{background:#d6453d}.f-img{background:#2d8a6b}

  .empty-chat{flex:1;display:grid;place-items:center;color:var(--ink2);font-size:14px;text-align:center;padding:0 30px}

  .backdrop{position:fixed;inset:0;background:rgba(16,29,36,.22);z-index:40;display:none}.backdrop.show{display:block}
  .drawer{position:fixed;top:0;right:0;height:100vh;width:344px;background:var(--panel);z-index:41;box-shadow:-12px 0 40px rgba(16,29,36,.14);transform:translateX(100%);transition:transform .22s ease;overflow-y:auto;padding:16px 20px 30px}.drawer.show{transform:translateX(0)}
  .dr-x{position:absolute;top:14px;right:16px;width:34px;height:34px;border-radius:50%;border:0;background:var(--neutral);display:grid;place-items:center;color:#54656f}.dr-x svg{width:18px;height:18px}
  .dr-top{display:flex;flex-direction:column;align-items:center;text-align:center;padding:22px 0 6px}
  .dr-av{width:80px;height:80px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:30px}
  .dr-name{font-size:17px;font-weight:700;margin-top:12px}.dr-contact{font-size:12.5px;font-weight:500;color:var(--ink2);margin-top:2px}
  .dr-add{width:100%;height:42px;border-radius:12px;border:0;background:var(--brand);color:#fff;font-size:13.5px;font-weight:700;margin-top:16px}.dr-add.saved{background:var(--green)}
  .dr-sec{margin-top:22px}
  .dr-label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-bottom:10px}
  .dr-chips{display:flex;flex-wrap:wrap;gap:8px}
  .dr-chip{font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:20px;border:1px solid var(--line);background:#fff;color:#5a666e}
  .dr-catnew{border-style:dashed}
  .dr-drow{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line3);font-size:13px}.dr-drow span{color:var(--ink2);font-weight:500}.dr-drow b{font-weight:700}
  .dr-bot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;font-size:13px;font-weight:600;color:#4b5760}

  .qredit{position:fixed;inset:0;background:rgba(16,29,36,.35);z-index:60;display:none;align-items:center;justify-content:center;padding:16px}.qredit.show{display:flex}
  .qredit .box{background:#fff;border-radius:18px;box-shadow:var(--shadow);width:100%;max-width:420px;max-height:86vh;overflow-y:auto;padding:16px 16px 22px}
  .qredit-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .qredit .h{font-family:var(--serif);font-weight:600;font-size:19px}
  .qredit .close{width:30px;height:30px;border-radius:50%;background:var(--neutral);border:0;display:grid;place-items:center;color:var(--ink2);flex-shrink:0}
  .qredit-sub{font-size:12px;color:var(--ink2);margin:3px 0 14px}
  .qr-item{border:1px solid var(--line);border-radius:13px;padding:11px 12px;margin-bottom:10px}
  .qr-item .qi-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .qr-item .qi-nm{font-weight:700;font-size:13.5px}
  .qr-item .qi-acts{display:flex;gap:6px;flex-shrink:0}
  .qr-item .qi-acts .ic{width:30px;height:30px;border-radius:9px;background:var(--neutral);border:0;display:grid;place-items:center;font-size:13px}
  .qr-item .qi-acts .ic.del{background:#FBEAE7}
  .qr-item .qi-pv{font-size:12.5px;color:var(--ink2);margin-top:5px;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere}
  .qr-item input.tt{width:100%;border:0;border-bottom:1px solid var(--line);font:inherit;font-weight:700;font-size:14px;padding:2px 0 6px;margin-bottom:8px}
  .qr-item input.tt:focus{outline:none;border-bottom-color:var(--brand)}
  .qr-item textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:13px;resize:vertical;min-height:54px;background:var(--neutral)}
  .qr-item .row{display:flex;justify-content:flex-end;gap:6px;margin-top:8px}
  .qr-item .mini{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 12px;font-size:12px;font-weight:700}
  .qr-item .mini.save{background:var(--brand);border-color:var(--brand);color:#fff}
  .qr-add{background:var(--brand);color:#fff;border:0;border-radius:13px;height:46px;width:100%;font-weight:700;font-size:14px;margin-top:2px}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;font-size:13px;font-weight:600;padding:11px 18px;border-radius:11px;opacity:0;transition:.25s;z-index:80;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media(max-width:640px){
    .topbar{display:none}
    .col-list{width:100vw;border-right:0}
    .col-chat{width:100vw;position:fixed;inset:0;z-index:20;transform:translateX(100%);transition:transform .2s ease}
    body.chat-open .col-chat{transform:translateX(0)}
    body.chat-open .col-list{display:none}
    .list-head{padding:20px 18px 10px}
    .lh-title{display:none}.lh-title-m{display:block}.lh-sub{display:none}
    .mtabs{display:flex;gap:6px;overflow-x:auto;margin-top:12px;padding-bottom:2px;-webkit-overflow-scrolling:touch}
    .mtabs::-webkit-scrollbar{display:none}
    .ch-line1{flex-wrap:wrap;gap:6px}
    .chpill,.pill{flex-shrink:0}
    .search{height:44px;border-radius:13px}
    .circ.big{width:52px !important;height:52px !important;font-size:19px !important}
    .cname{font-size:16px}.cprev{font-size:14px}.ctime{font-size:12px}
    .chat-head{height:auto;padding:14px 14px 12px}
    .ch-back{display:block}.btn-det{display:none}.ch-ic{display:none}.ch-save{display:block}
    .messages{padding:20px 16px}.msg{max-width:80%}
    .composer{padding:10px 14px 30px}.comp-top{margin-bottom:8px}
    .field{border-radius:22px;min-height:46px}.send{width:46px;height:46px;border-radius:50%}
    .drawer{width:100vw}
    .libpop{left:14px;right:14px;width:auto;bottom:150px}
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <button class="menu-back" onclick="voltarMenu()"><i class="ph" style="font-style:normal">‹</i> Menu</button>
    <div class="tabs">
      <button class="tab active" onclick="toast('Você já está no Atendimento')">💬 Atendimento</button>
      <button class="tab" onclick="toast('Contatos: em breve nesta versão de teste')">Contatos</button>
      <button class="tab" onclick="toast('Bot: em breve nesta versão de teste')">Bot</button>
      <button class="tab" onclick="toast('Arquivos: use o 📎 no chat por enquanto')">Arquivos</button>
      <button class="tab" onclick="toast('Transmissão: em breve nesta versão de teste')">Transmissão</button>
      <button class="tab" onclick="window.open('https://calendar.google.com/calendar/u/0/r','_blank')">Agenda</button>
    </div>
    <div class="top-right">
      <div class="top-div"></div>
      <div class="userblock">
        <div class="ub-av" id="ubAv">BI<span class="dot"></span></div>
        <div><div class="ub-nm" id="ubNm">Bianca</div><div class="ub-rl" id="ubRl">Admin · online</div></div>
      </div>
    </div>
  </div>

  <div class="workspace">
    <div class="col-list">
      <div class="list-head">
        <div class="lh-row">
          <div>
            <div class="lh-title">Conversas</div>
            <div class="lh-title-m">Conversas</div>
            <div class="lh-sub">WhatsApp · Google · Instagram · inbox unificado</div>
          </div>
          <button class="compose" title="Nova conversa">✎</button>
        </div>
        <div class="mtabs">
          <button class="mtab active">💬 Atendimento</button>
          <button class="mtab" onclick="toast('Contatos: em breve nesta versão de teste')">Contatos</button>
          <button class="mtab" onclick="toast('Bot: em breve nesta versão de teste')">Bot</button>
          <button class="mtab" onclick="toast('Arquivos: use o 📎 no chat por enquanto')">Arquivos</button>
          <button class="mtab" onclick="toast('Transmissão: em breve nesta versão de teste')">Transmissão</button>
          <button class="mtab" onclick="window.open('https://calendar.google.com/calendar/u/0/r','_blank')">Agenda</button>
        </div>
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>

<script>

function avColor(s){ let h=0,str=(s||'?'); for(let i=0;i<str.length;i++) h=(h*31+str.charCodeAt(i))>>>0; return AVCOL[h%AVCOL.length]; }

let convos=[], msgsByConvo={}, activeId=null, filter='todas', waitOnly=false;
let msgMatchIds=null, searchTimer=null;
let catList=[]; // {id,label,cor}
let myReplies=[], qrEditingId=null, qrSeeding=false;
let biblioteca=[];

/* ===== tempo ===== */
function isToday(d){const n=new Date();return d.getDate()===n.getDate()&&d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear();}
function isYesterday(d){const y=new Date();y.setDate(y.getDate()-1);return d.getDate()===y.getDate()&&d.getMonth()===y.getMonth()&&d.getFullYear()===y.getFullYear();}
function fmtTime(iso){ if(!iso) return ''; const d=new Date(iso); if(isToday(d)) return d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); if(isYesterday(d)) return 'Ontem'; return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}); }

/* ===== selos ===== */
function seloSvg(k){
  if(k==='wa') return '<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 0 0-8.5 15.2L2 22l4.9-1.3A10 10 0 1 0 12 2zm5.1 14.2c-.2.6-1.2 1.1-1.7 1.2-.4.1-.9.1-3-.6-2.6-1-4.2-3.6-4.3-3.8-.1-.2-1-1.4-1-2.6s.6-1.8.9-2.1c.2-.2.5-.3.7-.3h.5c.2 0 .4 0 .5.4l.7 1.6c.1.1.1.3 0 .4 0 .2-.1.3-.2.4l-.3.4c-.1.1-.2.2-.1.4.2.2.6.9 1.2 1.4.8.7 1.5 1 1.7 1.1.2.1.3 0 .4-.1l.6-.8c.1-.2.3-.2.5-.1l1.4.7c.3.1.5.2.5.3.1.1.1.6-.1 1.1z"/></svg>';
  if(k==='google') return '<svg viewBox="0 0 24 24"><text x="12" y="17" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" font-family="Manrope">G</text></svg>';
  return '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="4.5" y="4.5" width="15" height="15" rx="4.5"/><circle cx="12" cy="12" r="3.4"/><circle cx="17" cy="7" r="1.1" fill="#fff" stroke="none"/></svg>';
}
function seloTint(k,color){
  if(k==='wa') return '<svg viewBox="0 0 24 24" fill="'+color+'"><path d="M12 2a10 10 0 0 0-8.5 15.2L2 22l4.9-1.3A10 10 0 1 0 12 2z"/></svg>';
  if(k==='google') return '<svg viewBox="0 0 24 24"><text x="12" y="18" text-anchor="middle" font-size="16" font-weight="800" fill="'+color+'" font-family="Manrope">G</text></svg>';
  return '<svg viewBox="0 0 24 24" fill="none" stroke="'+color+'" stroke-width="2"><rect x="4.5" y="4.5" width="15" height="15" rx="4.5"/><circle cx="12" cy="12" r="3.4"/></svg>';
}
function avatarHtml(c,big){
  const sz=big?52:46;
  return '<div class="avw"><div class="circ'+(big?' big':'')+'" style="width:'+sz+'px;height:'+sz+'px;font-size:'+(big?19:17)+'px;background:'+c.corAvatar+'">'+esc(c.iniciais)+'</div>'+
    '<span class="selo" style="background:'+CH[c.canal].cor+'">'+seloSvg(c.canal)+'</span></div>';
}
function statusPill(id){ const s=ST[id]; if(!s) return ""; return '<span class="pill" style="color:'+s.cor+';background:'+s.cor+'18">'+s.label+'</span>'; }
function chPill(k){ const ch=CH[k]; return '<span class="chpill" style="color:'+ch.fg+';background:'+ch.bg+'">'+seloTint(k,ch.fg)+ch.label+'</span>'; }

/* ===== filtros ===== */
function renderFilters(){
  const wrap=document.getElementById('filters'); wrap.innerHTML='';
  const chips=[{k:'todas',label:'Todas',cor:'#a4242f'}].concat(Object.keys(CH).map(k=>({k,label:CH[k].curto,cor:CH[k].cor})));
  chips.forEach(c=>{ const b=document.createElement('button'); b.className='fchip'+(filter===c.k?' active':''); b.textContent=c.label; if(filter===c.k)b.style.background=c.cor; b.onclick=()=>{filter=c.k;renderFilters();renderList();}; wrap.appendChild(b); });
}

/* ===== espera +1h ===== */
const ESPERA=60*60*1000;
function isWaiting(c){ return (c.status==='nao-respondido'||c.status==='nao-lido') && c._ts && (Date.now()-new Date(c._ts).getTime()>ESPERA); }

/* ===== carregar conversas ===== */
async function loadConversas(){
  const { data, error } = await sb.from('wa_conversas').select('*, wa_contatos(*)').order('ultima_mensagem_em',{ascending:false,nullsFirst:false}).limit(500);
  if(error){ console.error(error); toast('Erro ao carregar conversas'); return; }
  convos=(data||[]).map(row=>{
    const ct=row.wa_contatos||{};
    const k=canalKey(row.canal);
    const name= ct.nome || ct.instagram_handle || ct.telefone || ct.wa_id || 'Sem nome';
    return {
      id:row.id, contato_id:row.contato_id, canal:k,
      name, iniciais:(name||'?').trim().charAt(0).toUpperCase(), corAvatar:avColor(name),
      contato: k==='wa'?(ct.telefone||ct.wa_id||''):(k==='google'?'via Google':('@'+(ct.instagram_handle||'').replace(/^@/,''))),
      status:row.status||'nao-respondido', cat:row.categoria||null,
      unread:row.nao_lidas||0, hora:fmtTime(row.ultima_mensagem_em||row.created_at),
      salvo:!!ct.salvo, bot:!!row.bot_ativo, preview:row.ultima_mensagem||'',
      _ts:row.ultima_mensagem_em||row.created_at
    };
  });
  renderList();
}

function renderList(){
  const box=document.getElementById('list'); const q=(document.getElementById('searchInput').value||'').toLowerCase();
  const ww=document.getElementById('waitWrap'); const waiting=convos.filter(isWaiting).length;
  ww.innerHTML = (waiting||waitOnly) ? '<div class="waitbar'+(waitOnly?' on':'')+'" onclick="toggleWait()">⏰ '+waiting+' esperando há +1h'+(waitOnly?'  ·  ver todas':'')+'</div>' : '';
  const arr=convos.filter(c=>{
    if(waitOnly&&!isWaiting(c)) return false;
    if(filter!=='todas'&&c.canal!==filter) return false;
    if(q){ const hit = c.name.toLowerCase().includes(q)||(c.contato||'').toLowerCase().includes(q)||(c.preview||'').toLowerCase().includes(q)||(msgMatchIds&&msgMatchIds.has(c.id)); if(!hit) return false; }
    return true;
  });
  box.innerHTML='';
  if(!arr.length){ box.innerHTML='<div class="empty">Nenhuma conversa com esses filtros.</div>'; return; }
  arr.forEach(c=>{
    const el=document.createElement('div'); el.className='convo'+(c.id===activeId?' active':''); el.onclick=()=>openConvo(c.id);
    el.innerHTML=avatarHtml(c)+
      '<div class="cbody">'+
        '<div class="crow1"><span class="cname">'+esc(c.name)+'</span><span class="ctime'+(c.unread?' unread':'')+'">'+esc(c.hora)+'</span></div>'+
        '<div class="crow2"><span class="cprev">'+esc(c.preview)+'</span>'+(c.unread?'<span class="badge">'+c.unread+'</span>':'')+'</div>'+
        '<div class="crow3">'+statusPill(c.status)+(c.cat?'<span class="tag">'+esc((catObj(c.cat)||{label:c.cat}).label)+'</span>':'')+'</div>'+
      '</div>';
    box.appendChild(el);
  });
}
function toggleWait(){ waitOnly=!waitOnly; renderList(); }
function onSearchInput(v){ renderList(); clearTimeout(searchTimer); const q=(v||'').trim(); if(q.length<2){ msgMatchIds=null; return; } searchTimer=setTimeout(()=>msgSearch(q),260); }
async function msgSearch(q){ try{ const { data }=await sb.from('wa_mensagens').select('conversa_id').ilike('conteudo','%'+q+'%').limit(3000); msgMatchIds=new Set((data||[]).map(r=>r.conversa_id)); renderList(); }catch(e){ console.warn('busca msgs',e); } }

/* ===== abrir conversa ===== */
async function openConvo(id){
  activeId=id; const c=convos.find(x=>x.id===id); if(!c) return;
  document.body.classList.add('chat-open');
  if(c.unread){ c.unread=0; sb.from('wa_conversas').update({nao_lidas:0}).eq('id',id).then(()=>{}); }
  document.getElementById('chatHead').innerHTML=
    '<button class="ch-back" onclick="backToList()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>'+
    avatarHtml({corAvatar:c.corAvatar,iniciais:c.iniciais,canal:c.canal})+
    '<div class="ch-info"><div class="ch-line1"><span class="ch-name">'+esc(c.name)+'</span>'+chPill(c.canal)+statusPill(c.status)+'</div>'+
    '<div class="ch-sub">'+esc(c.contato)+'</div></div>'+
    '<div class="ch-actions">'+
      '<button class="ch-ic" onclick="reloadThread()" title="Atualizar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.5 9a9 9 0 0 1 14.9-3.4L23 10M1 14l4.6 4.4A9 9 0 0 0 20.5 15"/></svg></button>'+
      '<button class="ch-save" onclick="saveContact()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg></button>'+
      '<button class="btn-det" onclick="openDrawer()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg> Detalhes</button>'+
    '</div>';
  document.getElementById('botSwitch').classList.toggle('on',c.bot);
  document.getElementById('composer').style.display='';
  renderQuick();
  document.getElementById('messages').innerHTML='<div class="empty-chat">Carregando…</div>';
  await loadMessages(id);
  renderList();
}
async function loadMessages(id){
  const { data, error } = await sb.from('wa_mensagens').select('*').eq('conversa_id',id).order('created_at',{ascending:true}).limit(500);
  if(error){ console.error(error); }
  msgsByConvo[id]=(data||[]).map(r=>{
    const isIn=r.direcao==='in'; const kind= isIn?'in':(r.autor_tipo==='bot'?'bot':'out');
    const file=(r.tipo&&r.tipo!=='text'&&r.midia_url)?{tipo:r.tipo,nome:(r.conteudo||''),url:r.midia_url}:null;
    return { kind, who:r.atendente_nome||(kind==='bot'?'Bot Lola':currentAgent), texto:r.conteudo||'', hora:fmtTime(r.created_at), file };
  });
  if(activeId===id) renderThread(id);
}
function renderThread(id){
  const m=document.getElementById('messages'); const list=msgsByConvo[id]||[]; m.innerHTML='';
  if(!list.length){ m.innerHTML='<div class="empty-chat">Nenhuma mensagem ainda.</div>'; return; }
  const sep=document.createElement('div'); sep.className='daysep'; sep.textContent='HOJE'; m.appendChild(sep);
  list.forEach(msg=>{
    const d=document.createElement('div'); d.className='msg '+msg.kind;
    let who='';
    if(msg.kind==='out') who='<div class="who">'+esc(msg.who||currentAgent)+'</div>';
    if(msg.kind==='bot') who='<div class="who">'+esc(msg.who||'Bot Lola')+'<span class="autoflag">AUTO</span></div>';
    const body=msg.file?fileHtml(msg.file):'<div class="tx">'+esc(msg.texto)+'</div>';
    d.innerHTML=who+body+'<div class="hr">'+esc(msg.hora)+'</div>';
    m.appendChild(d);
  });
  m.scrollTop=m.scrollHeight;
}
function fileHtml(f){
  const url=(f.url||'').toString(), t=(f.tipo||'').toLowerCase();
  if(/^https?:\/\//i.test(url)&&(t==='image'||t==='imagem'||t==='img'||t==='sticker')) return '<a href="'+esc(url)+'" target="_blank" rel="noopener"><img src="'+esc(url)+'" style="max-width:220px;border-radius:12px;display:block"></a>';
  return '<div class="file">📄 '+esc(f.nome||'arquivo')+'</div>';
}
function reloadThread(){ if(activeId) loadMessages(activeId); }
function backToList(){ document.body.classList.remove('chat-open'); }

/* ===== enviar ===== */
function onComposerKey(e){ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendMsg(); } }
async function sendMsg(){
  const inp=document.getElementById('composerInput'); const txt=inp.value.trim(); if(!txt||!activeId) return;
  inp.value=''; inp.disabled=true;
  try{
    const r=await fetch(SB_URL+'/functions/v1/wa-send',{method:'POST',headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY},body:JSON.stringify({conversa_id:activeId,texto:txt,atendente_id:ME.id,atendente_nome:currentAgent})});
    const j=await r.json().catch(()=>({}));
    if(j&&j.ok){ toast('Enviado como '+currentAgent+' ✓'); }
    else if(j&&j.fora_da_janela){ toast('⚠️ Fora da janela de 24h — só com modelo aprovado'); inp.value=txt; }
    else { toast('Não enviou: '+((j&&j.erro)?'erro da Meta':'verifique a conexão')); inp.value=txt; }
  }catch(e){ console.error(e); toast('Falha ao enviar'); inp.value=txt; }
  inp.disabled=false; inp.focus();
  await loadMessages(activeId); await loadConversas();
}
async function toggleBot(){
  const c=convos.find(x=>x.id===activeId); if(!c) return; c.bot=!c.bot;
  document.getElementById('botSwitch').classList.toggle('on',c.bot);
  await sb.from('wa_conversas').update({bot_ativo:c.bot,updated_at:new Date().toISOString()}).eq('id',activeId);
  toast(c.bot?'Bot reativado nesta conversa 🤖':'Você assumiu — bot pausado');
}

/* ===== categorias ===== */
function catObj(id){ return catList.find(c=>c.id===id)||null; }
async function loadCategorias(){ const { data }=await sb.from('wa_categorias').select('*').order('ordem',{ascending:true}); catList=(data||[]).map(c=>({id:c.slug,label:c.nome,cor:c.cor||'#7a6f67'})); }
function slugify(s){return (s||'').toString().normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'').slice(0,40);}
async function addCategoria(){ const nome=prompt('Nome da nova categoria:'); if(!nome||!nome.trim())return; const slug=slugify(nome); if(!slug){toast('Nome inválido');return;} const cores=['#1f8a5b','#a4242f','#3a6ea5','#c98a1e','#8a63c4','#1a67d2']; const cor=cores[catList.length%cores.length]; const { error }=await sb.from('wa_categorias').insert({slug,nome:nome.trim(),cor,ordem:catList.length+1}); if(error){toast('Essa categoria já existe (ou erro)');return;} await loadCategorias(); renderDrawer(); toast('Categoria criada ✓'); }

/* ===== drawer ===== */
function openDrawer(){ renderDrawer(); document.getElementById('backdrop').classList.add('show'); document.getElementById('drawer').classList.add('show'); }
function closeDrawer(){ document.getElementById('backdrop').classList.remove('show'); document.getElementById('drawer').classList.remove('show'); }
function renderDrawer(){
  const c=convos.find(x=>x.id===activeId); if(!c) return; const dr=document.getElementById('drawer');
  const stChips=STORDER.map(k=>{ const s=ST[k], sel=c.status===k; const style=sel?('background:'+s.cor+';color:#fff;border-color:'+s.cor):('color:'+s.cor+';background:'+s.cor+'14;border-color:'+s.cor+'26'); return '<button class="dr-chip" style="'+style+'" onclick="setStatus(\''+k+'\')">'+s.label+'</button>'; }).join('');
  const catChips=catList.map(cat=>{ const sel=c.cat===cat.id; const style=sel?'background:#a4242f;color:#fff;border-color:#a4242f':''; return '<button class="dr-chip" style="'+style+'" onclick="setCat(\''+cat.id+'\')">'+esc(cat.label)+'</button>'; }).join('')+'<button class="dr-chip dr-catnew" onclick="addCategoria()">+ Nova</button>';
  const nmsg=(msgsByConvo[c.id]||[]).length;
  dr.innerHTML=
    '<button class="dr-x" onclick="closeDrawer()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>'+
    '<div class="dr-top"><div class="dr-av" style="background:'+c.corAvatar+';box-shadow:0 8px 22px '+c.corAvatar+'55">'+esc(c.iniciais)+'</div>'+
      '<div class="dr-name">'+esc(c.name)+'</div><div class="dr-contact">'+esc(c.contato)+'</div>'+
      '<button class="dr-add'+(c.salvo?' saved':'')+'" onclick="saveContact()">'+(c.salvo?'✓ Salvo nos contatos':'+ Adicionar aos contatos')+'</button></div>'+
    '<div class="dr-sec"><div class="dr-label">Status do atendimento</div><div class="dr-chips">'+stChips+'</div></div>'+
    '<div class="dr-sec"><div class="dr-label">Categoria</div><div class="dr-chips">'+catChips+'</div></div>'+
    '<div class="dr-sec"><div class="dr-label">Dados</div>'+
      '<div class="dr-drow"><span>Canal</span><b>'+CH[c.canal].label+'</b></div>'+
      '<div class="dr-drow"><span>Mensagens</span><b>'+nmsg+'</b></div>'+
      '<div class="dr-drow"><span>Atendente</span><b>'+esc(currentAgent)+'</b></div></div>';
}
async function setStatus(k){ const c=convos.find(x=>x.id===activeId); if(!c)return; c.status=k; await sb.from('wa_conversas').update({status:k,updated_at:new Date().toISOString()}).eq('id',activeId); renderDrawer(); openConvo(c.id); toast('Etiqueta: '+ST[k].label); }
async function setCat(id){ const c=convos.find(x=>x.id===activeId); if(!c)return; const novo=c.cat===id?null:id; c.cat=novo; await sb.from('wa_conversas').update({categoria:novo,updated_at:new Date().toISOString()}).eq('id',activeId); renderDrawer(); renderList(); }
async function saveContact(){ const c=convos.find(x=>x.id===activeId); if(!c||c.salvo)return; c.salvo=true; await sb.from('wa_contatos').update({salvo:true}).eq('id',c.contato_id); renderDrawer(); toast(c.name+' salvo nos contatos ✓'); }

/* ===== respostas rápidas pessoais ===== */
const QR_DEFAULTS=[ // 5 modelos de exemplo — ficam dentro de "Minhas respostas" (cada atendente edita as suas)
  {titulo:'👋 Saudação',texto:'Olá! Aqui é a '+(ME.name||'Equipe Lola')+', da Lola 💚 Como posso te ajudar?'},
  {titulo:'✅ Reserva confirmada',texto:'Prontinho, sua reserva está confirmada! Qualquer coisa é só chamar por aqui 🌿'},
  {titulo:'⏰ Horário',texto:'Nosso time atende todos os dias, das 9h às 18h. Já registrei sua mensagem e retornamos no próximo horário útil 💚'},
  {titulo:'🎉 Eventos',texto:'Que legal seu interesse em fazer um evento com a gente! Já vou te passar as opções de pacotes 🎉'},
  {titulo:'📄 Vou enviar proposta',texto:'Vou montar uma proposta e já te retorno, tá? 🙌'}
];
function myKey(){ return (ME&&ME.id)?String(ME.id):('nome:'+((ME&&ME.name)?ME.name:'Atendente')); }
async function loadMyReplies(){
  const key=myKey();
  const { data, error }=await sb.from('wa_respostas_rapidas').select('*').eq('atendente_id',key).order('ordem',{ascending:true}).order('created_at',{ascending:true});
  if(error){ console.warn('respostas',error); myReplies=[]; renderQuick(); return; }
  if(QR_DEFAULTS.length&&(!data||!data.length)&&!qrSeeding){ qrSeeding=true; await sb.from('wa_respostas_rapidas').insert(QR_DEFAULTS.map((r,i)=>({atendente_id:key,titulo:r.titulo,texto:r.texto,ordem:i}))); qrSeeding=false; return loadMyReplies(); }
  myReplies=data||[]; renderQuick();
}
function renderQuick(){
  const q=document.getElementById('quick'); if(!q) return; q.innerHTML='';
  const mine=document.createElement('button'); mine.className='qchip mine'; mine.textContent='⚙️ Minhas respostas'; mine.onclick=openQrEditor; q.appendChild(mine);
  const lib=document.createElement('button'); lib.className='qchip'; lib.textContent='📎 Arquivos'; lib.onclick=toggleLibPop; q.appendChild(lib);
}
function useReply(id){ const r=myReplies.find(x=>x.id===id); if(!r) return; insertQR(r.texto); closeQrEditor(); }
function insertQR(t){ const i=document.getElementById('composerInput'); i.value=t; i.focus(); }
function openQrEditor(){ qrEditingId=null; renderQrEditor(); document.getElementById('qrEditor').classList.add('show'); }
function closeQrEditor(){ document.getElementById('qrEditor').classList.remove('show'); renderQuick(); }
function renderQrEditor(){
  const list=document.getElementById('qrList'); list.innerHTML='';
  if(!myReplies.length){ const e=document.createElement('div'); e.style.cssText='color:var(--ink2);font-size:13px;padding:4px 2px 12px'; e.textContent='Você ainda não tem respostas. Toque em “＋ Nova resposta”.'; list.appendChild(e); }
  myReplies.forEach(r=>{
    const it=document.createElement('div'); it.className='qr-item';
    if(qrEditingId===r.id){
      const ti=document.createElement('input'); ti.className='tt'; ti.value=r.titulo||''; ti.placeholder='Título (ex: 👋 Saudação)';
      const ta=document.createElement('textarea'); ta.value=r.texto||''; ta.placeholder='Texto da resposta…';
      const row=document.createElement('div'); row.className='row';
      const cancel=document.createElement('button'); cancel.className='mini'; cancel.textContent='Cancelar'; cancel.onclick=qrCancel;
      const save=document.createElement('button'); save.className='mini save'; save.textContent='Salvar'; save.onclick=()=>qrSave(r.id,ti.value,ta.value);
      row.appendChild(cancel); row.appendChild(save); it.appendChild(ti); it.appendChild(ta); it.appendChild(row);
    } else {
      it.style.cursor='pointer'; it.title='Tocar para usar esta resposta'; it.onclick=()=>useReply(r.id);
      const top=document.createElement('div'); top.className='qi-top';
      const nm=document.createElement('div'); nm.className='qi-nm'; nm.textContent=r.titulo||'(sem título)';
      const acts=document.createElement('div'); acts.className='qi-acts';
      const ed=document.createElement('button'); ed.className='ic'; ed.textContent='✏️'; ed.onclick=(e)=>{e.stopPropagation();qrEdit(r.id);};
      const dl=document.createElement('button'); dl.className='ic del'; dl.textContent='🗑️'; dl.onclick=(e)=>{e.stopPropagation();qrDel(r.id);};
      acts.appendChild(ed); acts.appendChild(dl); top.appendChild(nm); top.appendChild(acts);
      const pv=document.createElement('div'); pv.className='qi-pv'; pv.textContent=r.texto||'';
      it.appendChild(top); it.appendChild(pv);
    }
    list.appendChild(it);
  });
}
function qrEdit(id){ qrEditingId=id; renderQrEditor(); }
function qrCancel(){ qrEditingId=null; renderQrEditor(); }
async function qrSave(id,titulo,texto){ titulo=(titulo||'').trim()||'Resposta'; texto=(texto||'').trim(); await sb.from('wa_respostas_rapidas').update({titulo,texto}).eq('id',id); qrEditingId=null; await loadMyReplies(); renderQrEditor(); toast('Resposta salva ✓'); }
async function qrDel(id){ if(!confirm('Excluir esta resposta pronta?'))return; await sb.from('wa_respostas_rapidas').delete().eq('id',id); qrEditingId=null; await loadMyReplies(); renderQrEditor(); toast('Removida ✓'); }
async function qrAdd(){ const key=myKey(); const ordem=myReplies.length?Math.max(...myReplies.map(r=>r.ordem||0))+1:0; const { data }=await sb.from('wa_respostas_rapidas').insert({atendente_id:key,titulo:'Nova resposta',texto:'',ordem}).select().single(); await loadMyReplies(); qrEditingId=data?data.id:null; renderQrEditor(); }

/* ===== biblioteca (popup Arquivos) ===== */
const libCats=[{id:'pacotes',label:'Pacotes de eventos',icon:'🎉'},{id:'cardapio',label:'Cardápio / Menu',icon:'🍽️'},{id:'ambiente',label:'Fotos do ambiente',icon:'📸'},{id:'precos',label:'Tabela de preços',icon:'💲'},{id:'outros',label:'Outros',icon:'📂'}];
async function loadBiblioteca(){ const { data }=await sb.from('wa_biblioteca').select('*').eq('ativo',true).order('ordem',{ascending:true}); biblioteca=(data||[]).map(b=>({id:b.id,nome:b.nome,cat:b.categoria||'outros',tipo:(b.tipo==='imagem'||b.tipo==='img')?'img':'pdf',meta:[(b.tipo||'').toUpperCase(),b.tamanho].filter(Boolean).join(' · '),url:b.url})); }
async function toggleLibPop(){
  const p=document.getElementById('libpop');
  if(p.classList.contains('show')){ p.classList.remove('show'); return; }
  await loadBiblioteca();
  let html='<div class="h">Enviar dos Arquivos</div>';
  if(!biblioteca.length) html+='<div class="it">Nenhum arquivo ainda.</div>';
  libCats.forEach(cat=>{ const items=biblioteca.filter(b=>b.cat===cat.id); if(!items.length)return; html+='<div class="h">'+cat.icon+' '+cat.label+'</div>'; items.forEach(b=>{ html+='<div class="it" onclick="sendFile(\''+b.id+'\')"><div class="ficon f-'+b.tipo+'">'+(b.tipo==='pdf'?'📄':'🖼️')+'</div><div><div style="font-weight:600;font-size:13px">'+esc(b.nome)+'</div><div style="font-size:11px;color:var(--ink2)">'+esc(b.meta)+'</div></div></div>'; }); });
  p.innerHTML=html; p.classList.add('show');
}
function sendFile(id){ const b=biblioteca.find(x=>x.id===id); if(!b)return; document.getElementById('libpop').classList.remove('show'); document.getElementById('composerInput').value=b.nome+(b.url?'\n'+b.url:''); toast('Arquivo no campo — confira e envie'); }

/* ===== toast ===== */
let tt; function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('show'),2600); }

/* ===== identidade ===== */
function applyAgentUI(){ const a=document.getElementById('ubAv'); if(a){ a.innerHTML=(currentAgent||'?').charAt(0).toUpperCase()+'<span class="dot"></span>'; } const nm=document.getElementById('ubNm'); if(nm) nm.textContent=currentAgent; const rl=document.getElementById('ubRl'); if(rl) rl.textContent=(ME.role?ME.role:'Atendente')+' · online'; const san=document.getElementById('sendAsName'); if(san) san.textContent=currentAgent; }
function refreshPortalUser(){ const pu=getPortalUser(); if(pu&&pu.name){ ME={id:pu.id||null,name:pu.name,role:pu.role||null}; currentAgent=pu.name; applyAgentUI(); loadMyReplies(); return true; } return false; }
function voltarMenu(){ try{var p=window.parent; if(p&&p!==window){ p.postMessage({lola:'voltar-menu'},'*'); return; } }catch(e){} try{history.back();}catch(e2){} }

/* ===== realtime ===== */
function subscribeRealtime(){
  try{ sb.channel('inbox-teste-rt')
    .on('postgres_changes',{event:'*',schema:'public',table:'wa_mensagens'},(p)=>{ const cid=p.new&&p.new.conversa_id; if(cid&&cid===activeId) loadMessages(activeId); loadConversas(); })
    .on('postgres_changes',{event:'*',schema:'public',table:'wa_conversas'},()=>{ loadConversas(); })
    .subscribe();
  }catch(e){ console.warn('realtime indisponível',e); }
  setInterval(()=>{ loadConversas(); },20000);
}

/* ===== init ===== */
applyAgentUI(); renderFilters();
if(!refreshPortalUser()){ let n=25; const t=setInterval(()=>{ if(refreshPortalUser()){clearInterval(t);} else if(--n<=0){ clearInterval(t); loadMyReplies(); } },600); }
loadCategorias().then(()=>{ loadConversas().then(()=>{ if(convos.length){ openConvo(convos[0].id); document.body.classList.remove('chat-open'); } }); });
subscribeRealtime();
</script>
