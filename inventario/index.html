<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventário · Equipe Lola</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/duotone/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --cream:#FBF7F1; --card:#FFFFFF; --border:#ECE3D9; --fio:#EFE6DC;
  --vinho:#A82A2A; --vinho-deep:#7E1E1F;
  --ink:#2A1A17; --ink2:#5A463E; --muted:#8A7A72; --rotulo:#B79A8E;
  --alerta:#B5302E; --alerta-bg:#FBEAE7;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Hanken Grotesk',sans-serif;background:var(--cream);color:var(--ink);font-size:15px;min-height:100vh}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:.92rem;color:var(--ink);background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:10px 12px;outline:0;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--vinho)}
.wrap{max-width:1020px;margin:0 auto;padding:0 14px 60px}
.hdr{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--fio)}
.hdr-ic{width:40px;height:40px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--border);color:var(--vinho);border-radius:13px;font-size:1.15rem;position:relative;border-style:solid}
.hdr-tit{flex:1;min-width:0}
.hdr-tit h1{font-family:'Fraunces',serif;font-weight:600;font-size:1.25rem;color:var(--vinho);line-height:1.15}
.hdr-sub{font-size:.7rem;font-weight:600;color:var(--muted);margin-top:1px}
.pills{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.pills::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;font-size:.78rem;font-weight:600;padding:8px 13px;border-radius:10px;border:1px solid var(--border);background:#fff;color:var(--ink2);white-space:nowrap;min-height:38px}
.pill.on{background:var(--vinho);color:#fff;border-color:var(--vinho)}
.pill.u-ccmq{color:#C0392B}.pill.u-mac{color:#2C7A4B}.pill.u-central{color:#2C5AA0}
.pill.u-ccmq.on{background:#C0392B;color:#fff;border-color:#C0392B}
.pill.u-mac.on{background:#2C7A4B;color:#fff;border-color:#2C7A4B}
.pill.u-central.on{background:#2C5AA0;color:#fff;border-color:#2C5AA0}
.searchrow{display:flex;gap:8px;margin-top:10px}
.grouphdr{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--rotulo);font-weight:600;margin:16px 2px 8px;display:flex;justify-content:space-between;align-items:baseline}
.grouphdr.alerta{color:var(--alerta)}
.feed{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:760px){.feed{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:10px 12px;display:flex;gap:11px;align-items:center;cursor:pointer;text-align:left;width:100%}
.card.alerta{border-color:#F0C8C0}
.card.inativo{opacity:.55}
.thumb{width:48px;height:48px;border-radius:11px;background:#F7EFE6;display:flex;align-items:center;justify-content:center;color:var(--rotulo);flex-shrink:0;font-size:1.25rem;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.c-body{flex:1;min-width:0}
.c-nome{font-size:.92rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-meta{font-size:.72rem;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-meta .qb{font-weight:700}
.qb-ccmq{color:#C0392B}.qb-mac{color:#2C7A4B}.qb-central{color:#2C5AA0}
.mini{font-size:.62rem;font-weight:700;padding:2px 7px;border-radius:8px;flex-shrink:0}
.mini.u-ccmq{background:#FBE4E0;color:#C0392B}.mini.u-mac{background:#E6F3EA;color:#2C7A4B}.mini.u-central{background:#E6EEF8;color:#2C5AA0}
.mini.u-multi{background:#EFE6DC;color:#8A7A72}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:600;font-size:.85rem;border-radius:13px;border:1px solid var(--border);background:#fff;color:var(--ink2);padding:0 16px;min-height:44px}
.btn-primary{background:var(--vinho);color:#fff;border-color:var(--vinho)}
.btn-primary:hover{background:var(--vinho-deep)}
.btn-sm{min-height:38px;font-size:.8rem;padding:0 13px}
.fab{position:fixed;right:16px;bottom:18px;z-index:40;box-shadow:0 10px 26px -12px rgba(168,42,42,.5)}
.empty{padding:28px 12px;text-align:center;color:var(--muted);font-size:.85rem}
.ov{position:fixed;inset:0;background:rgba(42,26,23,.32);z-index:90;display:none;align-items:center;justify-content:center;padding:12px}
.ov.show{display:flex}
.sheet{background:var(--cream);border:1px solid var(--border);border-radius:18px;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;padding:14px 16px 20px}
.sh-hd{display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--fio);padding-bottom:10px;margin-bottom:12px}
/* 21/07 (Bianca: "não tem botão de salvar") — em tela baixa o rodapé do formulário
   ficava escondido no fim da rolagem. Agora só os CAMPOS rolam; o Salvar fica fixo. */
#formBody{display:flex;flex-direction:column;overflow:hidden}
#formBody .sh-scroll{overflow-y:auto;min-height:0;flex:1}
#formBody .sh-ft{display:flex;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--fio);flex-shrink:0}
.sh-tit{font-family:'Fraunces',serif;font-weight:600;font-size:1.15rem;flex:1;min-width:0;line-height:1.2}
.lab{font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--rotulo);font-weight:600;margin:12px 0 5px}
.foto-big{position:relative;width:100%;height:180px;border-radius:13px;background:#F7EFE6;display:flex;align-items:center;justify-content:center;color:var(--rotulo);flex-direction:column;gap:5px;overflow:hidden;cursor:pointer;border:1px solid var(--border)}
.foto-big img{width:100%;height:100%;object-fit:cover}
.foto-troca{position:absolute;right:8px;bottom:8px;display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:600;background:rgba(42,26,23,.62);color:#fff;border:none;border-radius:10px;padding:7px 11px;backdrop-filter:blur(2px)}
#ovFoto{background:rgba(20,12,10,.82);z-index:120}
#ovFoto img{max-width:94vw;max-height:88vh;border-radius:12px;object-fit:contain;box-shadow:0 20px 60px -20px rgba(0,0,0,.6)}
.kv{background:#fff;border:1px solid var(--border);border-radius:13px;padding:2px 13px;font-size:.82rem}
.kv-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--fio)}
.kv-row:last-child{border-bottom:none}
.kv-row span:first-child{color:var(--muted);flex-shrink:0}
.kv-row b{font-weight:600;text-align:right;min-width:0;overflow-wrap:anywhere}
.kv-uni{display:flex;align-items:center;gap:7px}
.acoes{display:flex;gap:7px;margin:13px 0}
.acoes .btn{flex:1;padding:0 8px}
.mov-row{padding:9px 2px;border-bottom:1px solid var(--fio);font-size:.8rem}
.mov-row:last-child{border-bottom:none}
.mov-sub{color:var(--muted);font-size:.72rem;margin-top:1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
/* bloco de quantidade por unidade (form) */
.uni-edit{background:#fff;border:1px solid var(--border);border-radius:12px;padding:2px 12px;margin-top:2px}
.uni-eline{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--fio)}
.uni-eline:last-child{border-bottom:none}
.uni-ename{flex:1;display:flex;align-items:center;gap:8px;font-weight:600;font-size:.88rem}
.dotu{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.d-ccmq{background:#C0392B}.d-mac{background:#2C7A4B}.d-central{background:#2C5AA0}
.uni-qin{width:84px;flex:0 0 auto;text-align:center;padding:8px 6px}
.uni-etot{display:flex;justify-content:space-between;align-items:center;padding:10px 2px 3px;font-size:.85rem}
.uni-etot b{font-family:'Fraunces',serif;color:var(--vinho);font-size:1.05rem}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;font-size:.85rem;font-weight:600;padding:11px 18px;border-radius:13px;z-index:200;opacity:0;transition:.25s;pointer-events:none;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%)}
.stats{display:flex;gap:7px;margin-top:12px}
.stat{flex:1;background:#fff;border:1px solid var(--border);border-top:3px solid var(--st,#8A7A72);border-radius:13px;padding:8px 11px;cursor:pointer}
.stat b{font-family:'Fraunces',serif;font-weight:600;font-size:1.1rem;color:var(--st,#8A7A72);display:block;line-height:1.15}
.stat span{font-size:.64rem;font-weight:600;color:var(--ink2)}
.stat.on{box-shadow:inset 0 0 0 1.5px var(--st,#8A7A72)}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <button class="hdr-ic" onclick="voltarMenu()" title="Menu"><i class="ph-duotone ph-caret-left"></i></button>
    <div class="hdr-tit">
      <h1>Inventário</h1>
      <div class="hdr-sub" id="hdrSub">louças · utensílios · equipamentos</div>
    </div>
    <button class="hdr-ic" onclick="focarBusca()" title="Buscar"><i class="ph-duotone ph-magnifying-glass"></i></button>
  </div>

  <div class="pills" id="uniPills"></div>
  <div class="stats" id="catStats"></div>
  <div class="searchrow"><input type="search" id="q" placeholder="🔍 Buscar item, marca, local…" oninput="render()"></div>

  <div id="lista"><div class="empty">Carregando inventário…</div></div>
</div>

<button class="btn btn-primary fab" onclick="abrirFormNovo()"><i class="ph-duotone ph-plus"></i> Novo item</button>

<div class="ov" id="ovFicha" onclick="if(event.target===this)fecharOv('ovFicha')"><div class="sheet" id="fichaBody"></div></div>
<div class="ov" id="ovForm" onclick="if(event.target===this)fecharOv('ovForm')"><div class="sheet" id="formBody"></div></div>
<div class="ov" id="ovAcao" onclick="if(event.target===this)fecharOv('ovAcao')"><div class="sheet" id="acaoBody" style="max-width:420px"></div></div>
<div class="ov" id="ovFoto" onclick="fecharOv('ovFoto')"><img id="ovFotoImg" src="" alt=""></div>
<div id="toast"></div>

<script>
var SB_URL="https://mvjbsdpfjhywhaonvpfl.supabase.co";
var SB_KEY="sb_publishable_VMJzYe1AwL9zEoFs-ljUIw_OOkDpqhy";
var sb=window.supabase.createClient(SB_URL,SB_KEY);

var UNIDADES=['Lola CCMQ','Lola MAC','Cozinha Central'];
var CATS=[{k:'louca',nome:'Louças',cor:'#9A6B1E'},{k:'utensilio',nome:'Utensílios',cor:'#4858A8'},{k:'equipamento',nome:'Equipamentos',cor:'#0F766E'}];
var ITENS=[], FUNI='', FCAT='';
/* _fichaKey: item aberto na ficha. 'g:'+chave-de-grupo p/ louça/utensílio · 'eq:'+id p/ equipamento */
var _fichaKey=null;
var _GRUPOS_RENDER=[];   // grupos exibidos na última renderização (p/ onclick por índice)
var _formFoto=null;      // arquivo de foto escolhido no formulário (novo/editar), enviado ao salvar
var _fichaFotoUrl='';    // foto do item aberto na ficha (p/ ver ampliada)

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function norm(s){return String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2400);}
function fmtDT(iso){try{var d=new Date(iso);var p=function(n){return String(n).padStart(2,'0');};return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear();}catch(e){return '';}}
function voltarMenu(){try{var pp=window.parent;if(pp&&pp!==window){pp.postMessage({lola:'voltar-menu'},'*');return;}}catch(e){} try{history.back();}catch(e2){}}
function focarBusca(){var q=document.getElementById('q');if(q){try{q.scrollIntoView({behavior:'smooth',block:'center'});}catch(e){}setTimeout(function(){q.focus();},120);}}
function meuNome(){try{var pp=window.parent;if(pp&&pp!==window&&pp.__portalUser&&pp.__portalUser.name)return pp.__portalUser.name;}catch(e){}try{return localStorage.getItem('reg_quem_sou')||'';}catch(e){}return '';}
function uniCls(u){u=String(u||'');return u.indexOf('CCMQ')>=0?'u-ccmq':u.indexOf('MAC')>=0?'u-mac':u.indexOf('Central')>=0?'u-central':'';}
function uniDot(u){return uniCls(u).replace('u-','d-');}
function uniShort(u){return ({'Lola CCMQ':'CCMQ','Lola MAC':'MAC','Cozinha Central':'Central'})[u]||u||'—';}
function uniIdx(u){var k=UNIDADES.indexOf(u);return k<0?99:k;}
function catObj(k){return CATS.find(function(c){return c.k===k;})||{k:k,nome:k,cor:'#8A7A72'};}
function logAtv(acao,item,detalhe){try{sb.from('lola_atividades').insert({quem:meuNome()||null,acao:acao,alvo_tipo:'inventario',alvo_id:null,alvo_titulo:String(item&&item.nome||'').slice(0,120),detalhe:detalhe||null}).then(function(){},function(){});}catch(e){}}
function regMov(itemId,tipo,qtd,origem,destino,motivo){return sb.from('lola_inv_mov').insert({item_id:itemId,tipo:tipo,quantidade:qtd||null,origem:origem||null,destino:destino||null,motivo:motivo||null,quem:meuNome()||null});}
function getRow(id){return ITENS.find(function(x){return x.id===id;});}

async function load(){
  var r=await sb.from('lola_inv_itens').select('*').order('nome',{ascending:true});
  if(r.error){document.getElementById('lista').innerHTML='<div class="empty">Erro: '+esc(r.error.message)+'</div>';return;}
  ITENS=r.data||[]; render();
}

/* ===================== AGRUPAMENTO ===================== */
/* Louça/utensílio (rastreio 'quantidade') do MESMO nome+categoria viram 1 grupo,
   somando as unidades. Equipamentos ('individual') continuam item a item. */
function grupoKeyDe(i){return norm(i.nome)+'|'+i.categoria;}
function buildGrupos(){
  var map={},order=[];
  ITENS.forEach(function(i){
    if(i.rastreio==='individual')return;
    if(i.ativo===false)return;
    var key=grupoKeyDe(i);
    if(!map[key]){map[key]={key:key,categoria:i.categoria,rows:[]};order.push(key);}
    map[key].rows.push(i);
  });
  return {map:map,list:order.map(function(k){return map[k];})};
}
function getGrupo(key){var g=buildGrupos().map[key];return g||null;}
function grupoInfo(g){
  var info={nome:g.rows[0].nome,categoria:g.categoria};
  ['subcategoria','marca','modelo','fornecedor','cor','medida','obs','nf_num','nf_url','foto_url','referencia'].forEach(function(f){
    for(var k=0;k<g.rows.length;k++){var v=g.rows[k][f];if(v!=null&&v!==''){info[f]=v;break;}}
  });
  info.estoque_minimo=g.rows.reduce(function(m,r){return Math.max(m,r.estoque_minimo||0);},0);
  info.total=g.rows.reduce(function(s,r){return s+(r.qtd||0);},0);
  info.qtd_em_uso=g.rows.reduce(function(s,r){return s+(r.qtd_em_uso||0);},0);
  /* SOMA por unidade: várias linhas do mesmo item na mesma unidade viram 1 total. */
  var byU={};
  g.rows.forEach(function(r){var u=r.unidade;if(!byU[u])byU[u]={unidade:u,qtd:0,rows:[]};byU[u].qtd+=(r.qtd||0);byU[u].rows.push(r);});
  info.porUnidade=byU;
  info.unidades=Object.keys(byU).map(function(u){return byU[u];})
    .filter(function(x){return x.qtd>0;})
    .sort(function(a,b){return uniIdx(a.unidade)-uniIdx(b.unidade);})
    .map(function(x){return {unidade:x.unidade,qtd:x.qtd,rows:x.rows,local:(x.rows[0]||{}).local};});
  return info;
}

/* ===================== RENDER ===================== */
function renderUniPills(){
  var labels={'':'Tudo','Lola CCMQ':'CCMQ','Lola MAC':'MAC','Cozinha Central':'Central'};
  document.getElementById('uniPills').innerHTML=[''].concat(UNIDADES).map(function(u){
    return '<button class="pill '+uniCls(u)+(FUNI===u?' on':'')+'" onclick="FUNI=\''+u.replace(/'/g,"\\'")+'\';render()">'+esc(labels[u]||u)+'</button>';
  }).join('');
}
function contaCategoria(k){
  if(k==='equipamento')return ITENS.filter(function(i){return i.rastreio==='individual'&&i.ativo!==false&&(!FUNI||i.unidade===FUNI);}).length;
  return buildGrupos().list.filter(function(g){return g.categoria===k&&(!FUNI||g.rows.some(function(r){return r.unidade===FUNI&&(r.qtd||0)>0;}));}).length;
}
function renderCatStats(){
  document.getElementById('catStats').innerHTML=CATS.map(function(c){
    var n=contaCategoria(c.k);
    return '<div class="stat'+(FCAT===c.k?' on':'')+'" style="--st:'+c.cor+'" onclick="FCAT=FCAT===\''+c.k+'\'?\'\':\''+c.k+'\';render()"><b>'+n+'</b><span>'+c.nome+'</span></div>';
  }).join('');
}
/* meta textual de um grupo (louça/utensílio) */
function grupoMeta(info){
  if(info.unidades.length<=1){
    var u=info.unidades[0];
    var p=['qtd '+info.total];
    if(info.estoque_minimo)p.push('mín. '+info.estoque_minimo);
    if(u&&u.local)p.push(esc(u.local));
    return p.join(' · ');
  }
  var brk=info.unidades.map(function(u){return '<span class="qb qb-'+uniCls(u.unidade).replace('u-','')+'">'+esc(uniShort(u.unidade))+' '+u.qtd+'</span>';}).join(' · ');
  return 'total <b>'+info.total+'</b> · '+brk;
}
function grupoCardHTML(g,idx){
  var info=grupoInfo(g);
  var abaixo=info.estoque_minimo>0&&info.total<info.estoque_minimo;
  var foto=info.foto_url?('<img src="'+esc(info.foto_url)+'" loading="lazy" alt="">'):('<i class="ph-duotone ph-fork-knife"></i>');
  var meta;
  if(abaixo){meta='<span style="color:var(--alerta);font-weight:700">'+info.total+'</span> de mín. '+info.estoque_minimo;}
  else{meta=grupoMeta(info);}
  var badge;
  if(info.unidades.length<=1){var u=info.unidades[0]||g.rows[0];badge='<span class="mini '+uniCls(u.unidade)+'">'+esc(uniShort(u.unidade))+'</span>';}
  else{badge='<span class="mini u-multi">'+info.unidades.length+' locais</span>';}
  return '<button class="card'+(abaixo?' alerta':'')+'" onclick="abrirGrp('+idx+')">'
    +'<span class="thumb">'+foto+'</span>'
    +'<span class="c-body"><div class="c-nome">'+esc(info.nome)+'</div><div class="c-meta">'+meta+'</div></span>'
    +badge
  +'</button>';
}
/* card de equipamento (individual) — comportamento antigo */
function metaEquip(i){
  var parts=[];
  if(i.num!=null)parts.push('nº '+i.num);
  if(i.num_serie)parts.push('série '+i.num_serie);
  if(i.local)parts.push(i.local);
  if(i.status==='manutencao')parts.push('⚠️ em manutenção');
  if(i.status==='descartado')parts.push('descartado');
  return parts.join(' · ')||'equipamento';
}
function equipCardHTML(i){
  var foto=i.foto_url?('<img src="'+esc(i.foto_url)+'" loading="lazy" alt="">'):('<i class="ph-duotone ph-plug"></i>');
  return '<button class="card'+(i.ativo===false?' inativo':'')+'" onclick="abrirEq('+i.id+')">'
    +'<span class="thumb">'+foto+'</span>'
    +'<span class="c-body"><div class="c-nome">'+esc(i.nome)+'</div><div class="c-meta">'+esc(metaEquip(i))+'</div></span>'
    +'<span class="mini '+uniCls(i.unidade)+'">'+esc(uniShort(i.unidade))+'</span>'
  +'</button>';
}
function render(){
  renderUniPills(); renderCatStats();
  var q=norm(document.getElementById('q').value);
  var G=buildGrupos();
  var grupos=G.list.filter(function(g){
    if(FCAT&&g.categoria!==FCAT)return false;
    if(FUNI&&!g.rows.some(function(r){return r.unidade===FUNI&&(r.qtd||0)>0;}))return false;
    if(q){var blob=norm(g.rows.map(function(r){return [r.nome,r.subcategoria,r.marca,r.modelo,r.local,r.fornecedor,r.obs].join(' ');}).join(' '));if(blob.indexOf(q)<0)return false;}
    return true;
  });
  var eqs=ITENS.filter(function(i){return i.rastreio==='individual';}).filter(function(i){
    if(FCAT&&i.categoria!==FCAT)return false;

      h+='<div class="grouphdr" style="color:'+c.cor+'">'+c.nome+' · '+gs.length+'</div><div class="feed">'+gs.map(function(g){return grupoCardHTML(g,idxOf[g.key]);}).join('')+'</div>';
    }
  });

  if(inativos.length){algo=true;h+='<div class="grouphdr">Descartados · '+inativos.length+'</div><div class="feed">'+inativos.map(equipCardHTML).join('')+'</div>';}
  if(!algo)h='<div class="empty">Nenhum item com esses filtros.</div>';
  document.getElementById('lista').innerHTML=h;

  var nAbaixo=G.list.filter(function(g){var info=grupoInfo(g);return info.estoque_minimo>0&&info.total<info.estoque_minimo;}).length;
  document.getElementById('hdrSub').textContent=(totGrp+totEq)+' itens · '+(nAbaixo?nAbaixo+' abaixo do mínimo':'tudo em ordem');

/* Redimensiona a foto no navegador. Se a imagem não decodificar (ex.: HEIC de
   iPhone no desktop, arquivo grande/corrompido), NÃO falha calado: manda o arquivo
   original como reserva. cb recebe (blob, contentType, extensão). */
function comprimir(file,cb){
  var done=false;
  function fim(blob,ctype,ext){ if(done)return; done=true; cb(blob,ctype,ext); }
  function original(){ var ext=((file.name||'').split('.').pop()||'jpg').toLowerCase(); if(ext.length>5)ext='jpg'; fim(file, file.type||'image/jpeg', ext); }
  try{
    var img=new Image();var rd=new FileReader();
    rd.onerror=original;
    rd.onload=function(){
      img.onerror=original;
      img.onload=function(){
        try{
          var MAX=1280,w=img.width,h=img.height;
          if(!w||!h){return original();}
          if(w>MAX||h>MAX){var r=Math.min(MAX/w,MAX/h);w=Math.round(w*r);h=Math.round(h*r);}
          var cv=document.createElement('canvas');cv.width=w;cv.height=h;
          cv.getContext('2d').drawImage(img,0,0,w,h);
          cv.toBlob(function(b){ if(b)fim(b,'image/jpeg','jpg'); else original(); },'image/jpeg',0.82);
        }catch(e){ original(); }
      };
      img.src=rd.result;
    };
    rd.readAsDataURL(file);
    setTimeout(function(){ if(!done) original(); }, 9000); // trava de segurança
  }catch(e){ original(); }
}
/* Sobe uma foto pro Storage e devolve a URL pública (ou null se falhar). */
function subirFotoStorage(seedId,file){
  return new Promise(function(resolve){
    comprimir(file,async function(blob,ctype,ext){
      try{
        var path='itens/'+seedId+'-'+Date.now()+'.'+(ext||'jpg');
        var up=await sb.storage.from('inventario').upload(path,blob,{contentType:ctype||'image/jpeg',upsert:true});
        if(up.error)throw up.error;
        resolve(sb.storage.from('inventario').getPublicUrl(path).data.publicUrl);
      }catch(e){ resolve(null); }
    });
  });
}
function fichaRows(){
  if(!_fichaKey)return [];
  if(_fichaKey.indexOf('eq:')===0){var i=getRow(parseInt(_fichaKey.slice(3),10));return i?[i]:[];}
  var g=getGrupo(_fichaKey.slice(2));return g?g.rows:[];

async function uparFoto(inp){

  try{
    var ids=rows.map(function(r){return r.id;});
    await sb.from('lola_inv_itens').update({foto_url:url,updated_at:new Date().toISOString()}).in('id',ids);
    rows.forEach(function(r){r.foto_url=url;});

async function uparNF(inp){

/* subtrai `qtd` distribuído entre as várias linhas da unidade; devolve a linha principal (p/ registrar o mov) */
async function tirarDaUnidade(rows,qtd,agora){
  var ordered=rows.slice().sort(function(a,b){return (b.qtd||0)-(a.qtd||0);});
  var rest=qtd;
  for(var k=0;k<ordered.length&&rest>0;k++){
    var r=ordered[k];var take=Math.min(r.qtd||0,rest);
    if(take>0){await sb.from('lola_inv_itens').update({qtd:(r.qtd||0)-take,updated_at:agora}).eq('id',r.id);rest-=take;}
  }
  return ordered[0];
}
async function confirmarAcaoGrupo(tipo,btn){
  var g=getGrupo(_fichaKey.slice(2));if(!g)return; var info=grupoInfo(g);
  var origem=(document.getElementById('acOrig')||{}).value;
  var pu=info.porUnidade[origem];
  var disp=pu?pu.qtd:0;
  var qtd=parseInt((document.getElementById('acQtd')||{}).value||'0',10);
  if(!qtd||qtd<1){toast('Diga a quantidade.');return;}
  if(qtd>disp){toast('Só tem '+disp+' em '+uniShort(origem)+'.');return;}
  var motivo=(document.getElementById('acMotivo')||{}).value||'';
  if(tipo!=='mover'&&!motivo.trim()){toast('Diga o motivo.');return;}
  if(btn){btn.disabled=true;btn.textContent='Salvando…';}
  var agora=new Date().toISOString();
  try{
    if(tipo==='mover'){
      var destino=document.getElementById('acDest').value;
      if(destino===origem){toast('Escolha unidades diferentes.');if(btn){btn.disabled=false;btn.textContent='Confirmar';}return;}
      var principal=await tirarDaUnidade(pu.rows,qtd,agora);
      var puD=info.porUnidade[destino];
      if(puD&&puD.rows.length){await sb.from('lola_inv_itens').update({qtd:(puD.rows[0].qtd||0)+qtd,updated_at:agora}).eq('id',puD.rows[0].id);}
      else{var novo=await sb.from('lola_inv_itens').insert({nome:info.nome,categoria:info.categoria,subcategoria:info.subcategoria||null,unidade:destino,local:null,marca:info.marca||null,modelo:info.modelo||null,referencia:info.referencia||null,fornecedor:info.fornecedor||null,cor:info.cor||null,medida:info.medida||null,rastreio:'quantidade',qtd:qtd,estoque_minimo:info.estoque_minimo||0,foto_url:info.foto_url||null,criado_por:meuNome()||null}).select('id').single();if(novo.error)throw novo.error;}
      await regMov(principal.id,'transferencia',qtd,origem,destino,null);
      logAtv('moveu',{nome:info.nome},qtd+' un · '+uniShort(origem)+' → '+uniShort(destino));
      toast('✓ Movido');
    } else if(tipo==='quebra'){
      var pr=await tirarDaUnidade(pu.rows,qtd,agora);
      await regMov(pr.id,'quebra',qtd,origem,null,motivo);
      logAtv('registrou quebra em',{nome:info.nome},qtd+' un · '+uniShort(origem)+' · '+motivo);
      toast('Quebra registrada');
    } else if(tipo==='descarte'){
      var pr2=await tirarDaUnidade(pu.rows,qtd,agora);
      await regMov(pr2.id,'descarte',qtd,origem,null,motivo);
      logAtv('descartou',{nome:info.nome},qtd+' un · '+uniShort(origem)+' · '+motivo);
      toast('Descarte registrado');
    }
    fecharOv('ovAcao'); await load(); reabrirFicha();
  }catch(e){toast('Erro: '+(e.message||e));if(btn){btn.disabled=false;btn.textContent='Confirmar';}}
}
/* ações de equipamento (individual) — comportamento antigo */
function abrirAcaoEquip(tipo){
  var i=getRow(parseInt(_fichaKey.slice(3),10));if(!i)return;
  var titulos={mover:'Mover pra outra unidade',quebra:'Registrar quebra',descarte:'Registrar descarte'};
  var h='<div class="sh-hd"><div class="sh-tit">'+titulos[tipo]+'</div><button class="hdr-ic" onclick="fecharOv(\'ovAcao\')"><i class="ph-duotone ph-x"></i></button></div>'
    +'<div style="font-size:.85rem;color:var(--ink2);margin-bottom:4px">'+esc(i.nome)+' · '+esc(uniShort(i.unidade))+'</div>';
  if(tipo==='mover'){h+='<div class="lab">Pra onde</div><select id="acDest">'+UNIDADES.filter(function(u){return u!==i.unidade;}).map(function(u){return '<option>'+esc(u)+'</option>';}).join('')+'</select>';}
  if(tipo!=='mover'){h+='<div class="lab">Motivo</div><input type="text" id="acMotivo" placeholder="'+(tipo==='quebra'?'Ex.: quebrou na lavagem':'Ex.: sem conserto, fim de vida')+'">';}
  h+='<div style="display:flex;gap:8px;margin-top:16px;justify-content:flex-end"><button class="btn btn-sm" onclick="fecharOv(\'ovAcao\')">Cancelar</button><button class="btn btn-primary btn-sm" onclick="confirmarAcaoEquip(\''+tipo+'\',this)">Confirmar</button></div>';
  document.getElementById('acaoBody').innerHTML=h;
  abrirOv('ovAcao');
}
async function confirmarAcaoEquip(tipo,btn){
  var i=getRow(parseInt(_fichaKey.slice(3),10));if(!i)return;
  var motivo=(document.getElementById('acMotivo')||{}).value||'';
  if(tipo!=='mover'&&!motivo.trim()){toast('Diga o motivo.');return;}
  if(btn){btn.disabled=true;btn.textContent='Salvando…';}
  var agora=new Date().toISOString();
  try{
    if(tipo==='mover'){
      var destino=document.getElementById('acDest').value;var origemU=i.unidade;
      await sb.from('lola_inv_itens').update({unidade:destino,updated_at:agora}).eq('id',i.id);
      await regMov(i.id,'transferencia',null,i.unidade,destino,null);i.unidade=destino;
      logAtv('moveu',{nome:i.nome},uniShort(origemU)+' → '+uniShort(destino));toast('✓ Movido');
    } else if(tipo==='quebra'){
      await sb.from('lola_inv_itens').update({status:'manutencao',updated_at:agora}).eq('id',i.id);i.status='manutencao';
      await regMov(i.id,'quebra',null,i.unidade,null,motivo);logAtv('registrou quebra em',i,motivo);toast('Quebra registrada');
    } else if(tipo==='descarte'){
      await sb.from('lola_inv_itens').update({ativo:false,status:'descartado',updated_at:agora}).eq('id',i.id);i.ativo=false;i.status='descartado';
      await regMov(i.id,'descarte',null,i.unidade,null,motivo);logAtv('descartou',i,motivo);toast('Descarte registrado');
    }
    fecharOv('ovAcao'); await load(); reabrirFicha();
  }catch(e){toast('Erro: '+(e.message||e));if(btn){btn.disabled=false;btn.textContent='Confirmar';}}
}
function abrirManut(){try{var pp=window.parent;if(pp&&pp!==window&&typeof pp.openManutencoes==='function'){pp.openManutencoes('equip');return;}}catch(e){}window.open('/manutencoes/?page=equip','_blank');}

/* ===================== FORM (novo / editar) ===================== */
function abrirFormNovo(){abrirForm({});}
function abrirFormGrupo(keyEnc){abrirForm({grupo:getGrupo(decodeURIComponent(keyEnc))});}
function abrirFormEquip(id){abrirForm({row:getRow(id)});}

function uniEditBlock(qtdPorUni){
  var min=(qtdPorUni&&qtdPorUni.__min)||0;
  var h='<div id="fQtdWrap"><div class="lab" style="margin-top:2px">Quantidade por unidade</div><div class="uni-edit">';
  UNIDADES.forEach(function(u){
    var qv=qtdPorUni&&qtdPorUni[u]!=null?qtdPorUni[u]:0;
    h+='<div class="uni-eline"><div class="uni-ename"><span class="dotu '+uniDot(u)+'"></span>'+esc(u)+'</div>'
      +'<input class="uni-qin" type="number" min="0" inputmode="numeric" data-uni="'+esc(u)+'" value="'+qv+'" oninput="recalcTotal()"></div>';
  });
  h+='</div><div class="uni-etot"><span>Total no inventário</span><b id="fTotal">0</b></div>'
   +'<div class="grid2" style="margin-top:8px"><div><div class="lab">Estoque mínimo (total)</div><input type="number" id="fMin" min="0" value="'+min+'" inputmode="numeric"></div><div></div></div></div>';
  return h;
}
function recalcTotal(){
  var t=0;document.querySelectorAll('#formBody .uni-qin').forEach(function(el){t+=parseInt(el.value||'0',10)||0;});
  var b=document.getElementById('fTotal');if(b)b.textContent=t+' un';
}
function abrirForm(o){
  o=o||{}; var grupo=o.grupo||null, row=o.row||null;
  _formFoto=null;
  var editandoEquip=!!(row&&row.rastreio==='individual');
  var info=grupo?grupoInfo(grupo):null;
  var base=editandoEquip?row:(info||{});
  var catAtual=editandoEquip?row.categoria:(info?info.categoria:'louca');
  // categorias oferecidas: grupo existente -> só louça/utensílio; equip -> equipamento; novo -> todas
  var cats=CATS;
  if(grupo)cats=CATS.filter(function(c){return c.k!=='equipamento';});
  if(editandoEquip)cats=CATS.filter(function(c){return c.k==='equipamento';});
  var titulo=(grupo||editandoEquip)?'Editar item':'Novo item';
  var qtdPorUni={};
  if(grupo){grupo.rows.forEach(function(r){qtdPorUni[r.unidade]=(qtdPorUni[r.unidade]||0)+(r.qtd||0);});qtdPorUni.__min=info.estoque_minimo||0;}
  else qtdPorUni.__min=0;

  var h='<div class="sh-hd"><div class="sh-tit">'+titulo+'</div><button class="hdr-ic" onclick="fecharOv(\'ovForm\')"><i class="ph-duotone ph-x"></i></button></div>'
    +'<div class="sh-scroll">'
    +'<div class="lab">Foto</div>'
    +'<div class="foto-big" id="fFotoBox" onclick="pedirFotoForm()" style="height:150px">'+(base.foto_url?('<img src="'+esc(base.foto_url)+'" alt="">'):('<i class="ph-duotone ph-camera" style="font-size:1.5rem"></i><span style="font-size:.68rem">toque pra adicionar foto</span>'))+'</div>'
    +'<input type="file" id="fFotoInput" accept="image/*" style="display:none" onchange="escolherFotoForm(this)">'
    +'<div class="lab">Categoria</div><select id="fCat" onchange="formCampos()">'+cats.map(function(c){return '<option value="'+c.k+'"'+(catAtual===c.k?' selected':'')+'>'+c.nome.replace(/s$/,'')+'</option>';}).join('')+'</select>'
    +'<div class="lab">Nome</div><input type="text" id="fNome" value="'+esc(base.nome||'')+'" placeholder="Ex.: Prato raso Ø27 branco">'
    +uniEditBlock(qtdPorUni)
    +'<div id="fEquipWrap" style="display:none"><div class="grid2"><div><div class="lab">Unidade</div><select id="fUniEq">'+UNIDADES.map(function(u){return '<option'+((editandoEquip?row.unidade:'Lola CCMQ')===u?' selected':'')+'>'+u+'</option>';}).join('')+'</select></div><div><div class="lab">Local / setor</div><input type="text" id="fLocalEq" value="'+esc(editandoEquip?(row.local||''):'')+'" placeholder="Ex.: Bar, Cozinha"></div></div>'
    +'<div class="grid2"><div><div class="lab">Número</div><input type="number" id="fNum" value="'+esc(editandoEquip&&row.num!=null?row.num:'')+'" inputmode="numeric"></div><div><div class="lab">Nº de série</div><input type="text" id="fSerie" value="'+esc(editandoEquip?(row.num_serie||''):'')+'"></div></div></div>'
    +'<div class="grid2"><div><div class="lab">Marca</div><input type="text" id="fMarca" value="'+esc(base.marca||'')+'"></div><div><div class="lab">Modelo</div><input type="text" id="fModelo" value="'+esc(base.modelo||'')+'"></div></div>'
    +'<div class="grid2"><div><div class="lab">Tipo (subcategoria)</div><input type="text" id="fSub" value="'+esc(base.subcategoria||'')+'" placeholder="Ex.: Copos e taças"></div><div><div class="lab">Nº da nota fiscal</div><input type="text" id="fNF" value="'+esc(base.nf_num||'')+'"></div></div>'
    +'<div class="lab">Observações</div><textarea id="fObs" rows="2">'+esc(base.obs||'')+'</textarea>'
    +'</div>'
    +'<div class="sh-ft" style="justify-content:'+((grupo||editandoEquip)?'space-between':'flex-end')+'">'
    +((grupo||editandoEquip)?'<button class="btn btn-sm" style="color:var(--alerta)" onclick="excluirAtual()"><i class="ph-duotone ph-trash"></i> Excluir</button>':'')
    +'<span style="display:flex;gap:8px"><button class="btn btn-sm" onclick="fecharOv(\'ovForm\')">Cancelar</button><button class="btn btn-primary btn-sm" onclick="salvarForm(this)"><i class="ph-duotone ph-check"></i> Salvar</button></span></div>';
  var fb=document.getElementById('formBody');
  fb.innerHTML=h;
  fb.dataset.mode=grupo?'grupo':(editandoEquip?'equip':'novo');
  fb.dataset.gkey=grupo?grupo.key:'';
  fb.dataset.eqid=editandoEquip?String(row.id):'';
  abrirOv('ovForm'); formCampos(); recalcTotal();
  if(!grupo&&!editandoEquip)setTimeout(function(){var n=document.getElementById('fNome');if(n)n.focus();},120);
}
function formCampos(){
  var eq=document.getElementById('fCat').value==='equipamento';
  document.getElementById('fQtdWrap').style.display=eq?'none':'';
  document.getElementById('fEquipWrap').style.display=eq?'':'none';
}
function pedirFotoForm(){var f=document.getElementById('fFotoInput');if(f)f.click();}
function escolherFotoForm(inp){
  var f=inp.files&&inp.files[0];if(!f)return;
  _formFoto=f;
  try{var box=document.getElementById('fFotoBox');var u=URL.createObjectURL(f);box.innerHTML='<img src="'+u+'" alt="">';}catch(e){}
}
async function salvarForm(btn){
  var fb=document.getElementById('formBody');
  var mode=fb.dataset.mode, gkey=fb.dataset.gkey, eqid=fb.dataset.eqid;
  var nome=(document.getElementById('fNome').value||'').trim();
  if(!nome){toast('Dê um nome ao item.');return;}
  var cat=document.getElementById('fCat').value, eq=cat==='equipamento';
  var shared={nome:nome,categoria:cat,
    subcategoria:(document.getElementById('fSub').value||'').trim()||null,
    marca:(document.getElementById('fMarca').value||'').trim()||null,
    modelo:(document.getElementById('fModelo').value||'').trim()||null,
    nf_num:(document.getElementById('fNF').value||'').trim()||null,
    obs:(document.getElementById('fObs').value||'').trim()||null,
    updated_at:new Date().toISOString()};
  if(btn){btn.disabled=true;btn.textContent='Salvando…';}
  try{
    if(eq){
      // ---- caminho equipamento (individual, 1 linha) ----
      var p=Object.assign({},shared,{rastreio:'individual',
        unidade:document.getElementById('fUniEq').value,
        local:(document.getElementById('fLocalEq').value||'').trim()||null,
        num:parseInt(document.getElementById('fNum').value||'',10)||null,
        num_serie:(document.getElementById('fSerie').value||'').trim()||null});
      if(mode==='equip'&&eqid){
        var eid=parseInt(eqid,10);
        var u=await sb.from('lola_inv_itens').update(p).eq('id',eid);if(u.error)throw u.error;
        if(_formFoto){var fu=await subirFotoStorage(eid,_formFoto);if(fu)await sb.from('lola_inv_itens').update({foto_url:fu}).eq('id',eid);}
        logAtv('editou',{nome:nome});
        fecharOv('ovForm'); await load(); _fichaKey='eq:'+eid; reabrirFicha(); toast('✓ Salvo');
      } else {
        p.criado_por=meuNome()||null;
        var r=await sb.from('lola_inv_itens').insert(p).select('id').single();if(r.error)throw r.error;
        var nid=r.data.id;
        await regMov(nid,'entrada',null,null,p.unidade,null);
        if(_formFoto){var fu2=await subirFotoStorage(nid,_formFoto);if(fu2)await sb.from('lola_inv_itens').update({foto_url:fu2}).eq('id',nid);}
        logAtv('cadastrou no inventário',{nome:nome});
        fecharOv('ovForm'); await load(); _fichaKey='eq:'+nid; reabrirFicha(); toast(_formFoto?'✓ Item cadastrado':'✓ Item cadastrado — adicione a foto');
      }
      return;
    }
    // ---- caminho louça/utensílio (quantidade por unidade) ----
    var minTot=parseInt((document.getElementById('fMin')||{}).value||'0',10)||0;
    var qtdPorUni={};
    document.querySelectorAll('#formBody .uni-qin').forEach(function(el){qtdPorUni[el.dataset.uni]=parseInt(el.value||'0',10)||0;});
    var totalGeral=UNIDADES.reduce(function(s,u){return s+(qtdPorUni[u]||0);},0);
    if(totalGeral<=0){toast('Coloque a quantidade em pelo menos uma unidade.');if(btn){btn.disabled=false;btn.innerHTML='<i class="ph-duotone ph-check"></i> Salvar';}return;}
    var grupo=(mode==='grupo'&&gkey)?getGrupo(gkey):null;
    var existentes={};
    function _add(r){(existentes[r.unidade]=existentes[r.unidade]||[]).push(r);}
    if(grupo){grupo.rows.forEach(_add);}
    else{ITENS.forEach(function(r){if(r.rastreio==='quantidade'&&r.ativo!==false&&norm(r.nome)===norm(nome)&&r.categoria===cat)_add(r);});}
    var fotoGrupo=(grupo?grupoInfo(grupo).foto_url:null)||null;
    for(var k=0;k<UNIDADES.length;k++){
      var u2=UNIDADES[k], q=qtdPorUni[u2]||0, exs=existentes[u2]||[];
      var body=Object.assign({},shared,{rastreio:'quantidade',estoque_minimo:minTot});
      if(q>0){
        if(exs.length){
          // consolida: total na 1ª linha, zera as duplicadas da mesma unidade
          var u1=await sb.from('lola_inv_itens').update(Object.assign({},body,{qtd:q})).eq('id',exs[0].id);if(u1.error)throw u1.error;
          for(var j=1;j<exs.length;j++){var uj=await sb.from('lola_inv_itens').update(Object.assign({},body,{qtd:0})).eq('id',exs[j].id);if(uj.error)throw uj.error;}
        } else {
          var ins=Object.assign({},body,{unidade:u2,qtd:q,local:null,foto_url:fotoGrupo,criado_por:meuNome()||null});
          var nr=await sb.from('lola_inv_itens').insert(ins).select('id').single();if(nr.error)throw nr.error;
          await regMov(nr.data.id,'entrada',q,null,u2,null);
        }
      } else if(exs.length){
        for(var j2=0;j2<exs.length;j2++){var uz=await sb.from('lola_inv_itens').update(Object.assign({},body,{qtd:0})).eq('id',exs[j2].id);if(uz.error)throw uz.error;}
      }
    }
    logAtv((grupo?'editou':'cadastrou no inventário'),{nome:nome});
    var novaKey=norm(nome)+'|'+cat;
    if(_formFoto){
      toast('Enviando foto…');
      await load();
      var g2=getGrupo(novaKey);
      if(g2){var ids2=g2.rows.map(function(r){return r.id;});var fu=await subirFotoStorage(ids2[0],_formFoto);if(fu)await sb.from('lola_inv_itens').update({foto_url:fu}).in('id',ids2);}
    }
    fecharOv('ovForm'); await load();
    _fichaKey='g:'+novaKey; reabrirFicha();
    toast(grupo?'✓ Salvo':'✓ Item cadastrado');
  }catch(e){toast('Erro: '+(e.message||e));if(btn){btn.disabled=false;btn.innerHTML='<i class="ph-duotone ph-check"></i> Salvar';}}
}
async function excluirAtual(){
  var fb=document.getElementById('formBody');
  var mode=fb.dataset.mode, gkey=fb.dataset.gkey, eqid=fb.dataset.eqid;
  if(mode==='equip'&&eqid){
    var i=getRow(parseInt(eqid,10));if(!i)return;
    if(!confirm('Excluir "'+i.nome+'" de vez? Se saiu de uso, prefira "Descartar" (fica no histórico).'))return;
    try{var d=await sb.from('lola_inv_itens').delete().eq('id',i.id);if(d.error)throw d.error;
      logAtv('excluiu do inventário',i);fecharOv('ovForm');fecharOv('ovFicha');await load();toast('Excluído');
    }catch(e){toast('Erro ao excluir');}
    return;
  }
  var g=getGrupo(gkey);if(!g)return;var info=grupoInfo(g);
  if(!confirm('Excluir "'+info.nome+'" de TODAS as unidades ('+g.rows.length+' registro'+(g.rows.length>1?'s':'')+')? Se saiu de uso, prefira "Descartar".'))return;
  try{
    var ids=g.rows.map(function(r){return r.id;});
    var d=await sb.from('lola_inv_itens').delete().in('id',ids);if(d.error)throw d.error;
    logAtv('excluiu do inventário',{nome:info.nome});
    fecharOv('ovForm');fecharOv('ovFicha');await load();toast('Excluído');
  }catch(e){toast('Erro ao excluir');}
}

load();
</script>
