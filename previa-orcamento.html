<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Template · Proposta de Orçamento Lola</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#FFEFEA;--vinho:#A82A2A;--gold:#C49955;--ink:#4A3F3B}
*{box-sizing:border-box}
body{margin:0;background:#E9E1DA;font-family:'Poppins',sans-serif;color:var(--ink)}
.bar{background:#FFF9EC;border-bottom:1px solid #F0DFB8;padding:10px 16px;font-size:13px;position:sticky;top:0;z-index:30;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar .txt{flex:1;min-width:240px}
.bar b{color:var(--vinho)}
.bar button{background:var(--vinho);color:#fff;border:none;border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer;font-family:inherit}
.bar button.g{background:#fff;color:var(--vinho);border:1px solid #E8CFC7}
[contenteditable]{outline:none;border-radius:4px}
[contenteditable]:hover{background:rgba(196,153,85,.10)}
[contenteditable]:focus{background:rgba(196,153,85,.18);box-shadow:0 0 0 2px rgba(196,153,85,.45)}
.pg{width:210mm;min-height:297mm;background:var(--cream);margin:16px auto;position:relative;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.18);padding:20mm 16mm}
.logo{position:absolute;top:18mm;right:14mm;width:60mm}
.predio{position:absolute;bottom:-4mm;right:8mm;width:66mm;opacity:.15}
.selo{position:absolute;bottom:10mm;left:10mm;width:38mm;opacity:.9}
h1{font-size:26px;color:var(--gold);margin:0;font-weight:700;letter-spacing:-.3px;max-width:60%}
.mes{color:var(--gold);font-weight:600;font-size:12px;margin-top:2px}
.cols{display:flex;gap:9mm;margin-top:16mm;position:relative;z-index:2}
.col{flex:1;min-width:0}
.col.r{padding-top:32mm;text-align:right}
.sec{margin-bottom:8mm;position:relative}
.sec h3{font-size:17px;color:var(--vinho);margin:0 0 1px;font-weight:700}
.sec .ssub{font-size:11px;color:var(--vinho);font-weight:400;margin-bottom:6px}
.item{margin-bottom:6px;position:relative}
.iname{font-size:12.5px;color:#3E3330}
.idesc{font-size:10.5px;line-height:1.45;color:#6B5C57}
.idesc:empty:before{content:'descrição…';color:#C9B8B1}
.valores{margin-top:2mm}
.valores h3{font-size:19px}
.valores .pax{font-size:12px;color:var(--vinho);font-weight:500}
.valores .tot{font-size:15px;font-weight:700;color:#3E3330;margin-top:2px}
.valores .rod{font-size:9.5px;color:#8A7A72;margin-top:6px}
h2{font-size:23px;color:var(--gold);font-weight:700;margin:0 0 8px}
ul{margin:0 0 12mm;padding-left:16px}
li{font-size:11px;line-height:1.6;margin-bottom:4px;position:relative}
li::marker{color:var(--vinho)}
.x{position:absolute;top:0;right:-16px;width:16px;height:16px;line-height:14px;text-align:center;border:none;background:none;color:#D9B4AE;cursor:pointer;font-size:14px;font-family:inherit}
.x:hover{color:var(--vinho)}
.col.r .x{right:auto;left:-16px}
.add{background:none;border:1px dashed #DCC7BE;color:#A6928A;border-radius:8px;font-size:10.5px;padding:3px 9px;cursor:pointer;font-family:inherit;margin-top:2px}
.add:hover{border-color:var(--vinho);color:var(--vinho)}
.tools{margin-top:4px}
@media print{
  body{background:#fff}.bar,.x,.add{display:none!important}
  .pg{box-shadow:none;margin:0;page-break-after:always}
  [contenteditable]:hover,[contenteditable]:focus{background:none;box-shadow:none}
  .idesc:empty:before{content:''}
  @page{size:A4;margin:0}
}
@media(max-width:800px){
  .pg{width:100%;min-height:auto;padding:14mm 9mm}
  .cols{flex-direction:column;gap:0}.col.r{padding-top:0;text-align:left}
  .logo{width:38mm;top:9mm;right:7mm}.selo{width:28mm}.predio{width:46mm}
  h1{max-width:100%;font-size:22px}
  .x{right:-2px}.col.r .x{left:auto;right:-2px}
}
</style></head><body>

  <div class="txt"><b>Template editável — dados de exemplo.</b> Clica em qualquer texto e escreve por cima. O <b>×</b> remove, o <b>+</b> adiciona.</div>
  <button class="g" onclick="reset()">↺ Restaurar</button>
  <button onclick="window.print()">🖨 Gerar PDF</button>
</div>

reserva é feita com o pagamento de entrada correspondente a 30% do valor total, o restante no dia via pix ou transferência", "Número de convidados precisa ser confirmado com antecedência mínima de 7 dias e não há desconto em caso de não comparecimento", "O prazo para a solicitação de cancelamento do evento e devolução do valor já pago é de no mínimo 15 dias antes do evento"], "regrasTitulo": "regras gerais - Casa de Cultura Mario Quintana", "regras": ["É proibido tocar nas obras de arte.", "Não é permitido correr na Casa de Cultura.", "Bolsas pequenas são permitidas, desde que estejam visíveis.", "É proibido o consumo ou o porte de bebidas e alimentos nas galerias. Nas demais dependências da CCMQ é permitido o consumo de água apenas.", "Crianças devem estar sempre acompanhadas de seus responsáveis.", "Não é permitido o ingresso de visitantes com animais, exceto cão-guia para pessoas com deficiência visual.", "É permitido fotografar, porém não é permitido o uso de flash nas galerias. ATENÇÃO: Em algumas exposições, não será permitido fotografar por questões de direitos autorais. Nestes casos, isso SEMPRE estará informado no acesso às respectivas exposições. Não é permitido fotografias ou filmagens com fins comerciais, realizadas por equipes profissionais ou amadoras, sem autorização prévia da Direção.", "A Casa de Cultura reserva-se o direito de impedir o acesso de pessoas cuja conduta apresente risco à segurança das obras em exposição ou que possa perturbar o bem-estar dos demais visitantes ou colaboradores.", "É proibido tomar chimarrão nas dependências da Casa.", "A solicitação de utilização de qualquer espaço da CCMQ, incluindo corredores e áreas de passagem, deve ser encaminhada para avaliação. Exceções são os estabelecimentos comerciais (restaurantes, livraria) que têm gerência sobre seus espaços.", "Os responsáveis por atividades ocorrendo na CCMQ irão zelar pela conservação e limpeza dos espaços, seu mobiliário e equipamentos. Qualquer dano ao patrimônio da CCMQ deverá ser ressarcido.", "Não serão pendurados, pregados ou afixados cartazes, banners, quadros ou similares, nem serão utilizadas fitas adesivas ou qualquer material colante ou perfurante nos espaços da CCMQ.", "Caso seja utilizado aparelho de som, o volume não deverá interferir nas demais atividades da CCMQ, além de ser respeitado o horário de silêncio a partir das 22h.", "Não é permitido utilizar fogos de artifício, explosivos, material inflamável, projeção em papéis ou executar outras ações potencialmente geradoras de chamas.", "O horário de funcionamento da CCMQ é de terça-feira a domingo, das 10h às 20h. Clientes e/ou participantes de eventos no Lola Bar, ao deixarem o estabelecimento após às 20h, devem se dirigir diretamente ao andar térreo para saída da CCMQ.", "Não é permitido fumar nos espaços da CCMQ (Lei nº 9.294/1996)."]};
let D=JSON.parse(JSON.stringify(BASE));
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function secHTML(lado,si,s){
  return '<div class="sec">'
    +'<button class="x" title="remover seção" onclick="delSec(\''+lado+'\','+si+')">×</button>'
    +'<h3 contenteditable oninput="D.'+lado+'['+si+'].t=this.innerText">'+esc(s.t)+'</h3>'
    +'<div class="ssub" contenteditable oninput="D.'+lado+'['+si+'].s=this.innerText">'+esc(s.s)+'</div>'
    + s.i.map((it,ii)=>'<div class="item">'
        +'<button class="x" title="remover item" onclick="delItem(\''+lado+'\','+si+','+ii+')">×</button>'
        +'<div class="iname" contenteditable oninput="D.'+lado+'['+si+'].i['+ii+'].n=this.innerText">'+esc(it.n)+'</div>'
        +'<div class="idesc" contenteditable oninput="D.'+lado+'['+si+'].i['+ii+'].d=this.innerText">'+esc(it.d)+'</div>'
      +'</div>').join('')
    +'<div class="tools"><button class="add" onclick="addItem(\''+lado+'\','+si+')">+ item</button></div>'
  +'</div>';
}
function render(){
  document.getElementById('titulo').innerText=D.titulo;
  document.getElementById('mes').innerText=D.mes;
  document.getElementById('colEsq').innerHTML=D.esq.map((s,i)=>secHTML('esq',i,s)).join('')
    +'<button class="add" onclick="addSec(\'esq\')">+ seção</button>';
  document.getElementById('colDir').innerHTML=D.dir.map((s,i)=>secHTML('dir',i,s)).join('')
    +'<button class="add" onclick="addSec(\'dir\')">+ seção</button>'
    +'<div class="sec valores"><h3 contenteditable>valores</h3>'
    +'<div class="pax" contenteditable oninput="D.pax=this.innerText">'+esc(D.pax)+' pax</div>'
    +'<div class="tot" contenteditable oninput="D.total=this.innerText">'+esc(D.total)+'</div>'
    +'<div class="rod" contenteditable oninput="D.rodapeValor=this.innerText">'+esc(D.rodapeValor)+'</div></div>';
  document.getElementById('regrasTitulo').innerText=D.regrasTitulo;
  ['infos','regras'].forEach(k=>{
    document.getElementById(k).innerHTML=D[k].map((x,i)=>
      '<li><button class="x" onclick="delLi(\''+k+'\','+i+')">×</button>'
      +'<span contenteditable oninput="D.'+k+'['+i+']=this.innerText">'+esc(x)+'</span></li>').join('');
  });
}
function addItem(l,si){D[l][si].i.push({n:'Novo item',d:''});render();}
function delItem(l,si,ii){D[l][si].i.splice(ii,1);render();}
function addSec(l){D[l].push({t:'Nova seção',s:'subtítulo',i:[{n:'Novo item',d:''}]});render();}
function delSec(l,si){D[l].splice(si,1);render();}
function addLi(k){D[k].push('Novo texto');render();}
function delLi(k,i){D[k].splice(i,1);render();}
function reset(){if(confirm('Voltar ao texto original?')){D=JSON.parse(JSON.stringify(BASE));render();}}
render();
</script>
</body></html>
