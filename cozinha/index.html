let _ftTab='todos',_ftBusca='';


function editarDestinos(ficha, onSave){
  if(!podeMexer(ficha.cozinha)) return;   // idem PP: mudar destino é mudar a ficha
  const DESTS=[
    {k:'ccmq',label:'CCMQ',cor:'#AA2B2B'},
    {k:'mac',label:'MAC',cor:'#166534'},
    {k:'eventos',label:'Eventos',cor:'#c47700'},
  ];
  const selecionados=new Set(ficha.destinos||[]);
  const btns=div('fl_ gap2 mt2');
  DESTS.forEach(d=>{
    const b=document.createElement('button');
    b.type='button';
    function render(){
      const sel=selecionados.has(d.k);
      b.style.cssText='padding:8px 16px;border-radius:50px;border:2px solid '+d.cor+';cursor:pointer;font-family:Manrope,sans-serif;font-size:13px;font-weight:700;transition:all .15s;'+(sel?'background:'+d.cor+';color:#fff':'background:#fff;color:'+d.cor);
      b.textContent=(sel?'✓ ':'')+d.label;
    }
    render();
    b.addEventListener('click',()=>{
      selecionados.has(d.k)?selecionados.delete(d.k):selecionados.add(d.k);
      render();
    });
    btns.appendChild(b);
  });
  mkModal('🏷️ Destinos de '+ficha.nome,[
    div('tss mb2','Selecione onde esta ficha é utilizada:'),
    btns,
  ],async()=>{
    await db('lola_fichas_tecnicas','PATCH',{destinos:[...selecionados]},'?id=eq.'+ficha.id);
    ficha.destinos=[...selecionados];
    onSave&&onSave();
  });
}

function modalRevisarFicha(tipo,item){
  const tabela=tipo==='ft'?'lola_fichas_tecnicas':'lola_preproducoes';
  const reload=tipo==='ft'?
    ()=>db(tabela,'GET',null,'?select=*&ativo=eq.true&order=nome.asc').then(d=>{_ft=d;drawFT($('#ft-t'));}) :
    ()=>db(tabela,'GET',null,'?select=*&ativo=eq.true&order=nome.asc').then(d=>{_pp=d;drawPP($('#pp-t'));});
  if(item.revisar){
    const ov=div('ov');const mo=div('mo');
    mo.addEventListener('click',e=>e.stopPropagation());
    ov.addEventListener('click',e=>{if(e.target===ov)ov.remove();});
    mo.appendChild(div('mh',[el('h3',null,'\u26A0\uFE0F Pendente de revis\u00E3o \u2014 '+item.nome),btn('xb','\u2715',()=>ov.remove())]));
    const mb=div('mb');
    const motEl=document.createElement('div');
    motEl.style.cssText='background:#fef3c7;border:1.5px solid #fcd34d;border-radius:10px;padding:12px 14px;font-size:13px;color:#92400e;margin-bottom:16px';
    motEl.innerHTML='<strong>Motivo:</strong> '+(item.revisar_motivo||'N\u00E3o informado');
    mb.appendChild(motEl);
    mo.appendChild(mb);
    mo.appendChild(div('mf',[
      btn('btn bg','Fechar',()=>ov.remove()),
      btn('btn bv','Marcar como revisado',async()=>{
        await db(tabela,'PATCH',{revisar:false,revisar_motivo:null},'?id=eq.'+item.id);
        item.revisar=false;item.revisar_motivo=null;
        ov.remove();reload();
      }),
    ]));
    ov.appendChild(mo);document.body.appendChild(ov);
  } else {
    const motivo={v:''};
    const inpMot=document.createElement('textarea');
    inpMot.className='fi';inpMot.rows=3;
    inpMot.placeholder='Descreva o motivo da revis\u00E3o (obrigat\u00F3rio)...';
    inpMot.style.cssText='width:100%;resize:vertical;min-height:80px';
    inpMot.addEventListener('input',e=>motivo.v=e.target.value);
    mkModal('\u26A0\uFE0F Marcar para revis\u00E3o \u2014 '+item.nome,[
      div('al ali mb3','Explique o motivo. Isso ficar\u00E1 vis\u00EDvel para toda a equipe.'),
      fgrp('Motivo da revis\u00E3o',inpMot),
    ],async()=>{
      if(!motivo.v.trim()){alert('O motivo \u00E9 obrigat\u00F3rio.');throw new Error('vazio');}
      await db(tabela,'PATCH',{revisar:true,revisar_motivo:motivo.v.trim()},'?id=eq.'+item.id);
      item.revisar=true;item.revisar_motivo=motivo.v.trim();
      reload();
    });
  }
}

function _ftCmv(x){ return (!x.preco_venda||x.preco_venda<=0)?null:(x.custo_por_porcao/x.preco_venda*100); }
/* Limite de CMV — regra da Bianca (16/07): 50% só pra PRODUTO PRONTO (comprado
   feito, sem nenhuma manipulação, tipo torta fatiada). Preparo da casa: 30%.
   Antes o app usava 30% pra tudo e acusava as tortas à toa. */
function _ftLim(x){ return (x&&x.produto_pronto)?50:30; }
/* CMV compacto da lista: só bolinha + %. O aviso "revisar ficha" vira etiqueta ao lado do nome. */
function mkCMVCompacto(preco_venda,custo,lim){
  if(!preco_venda||preco_venda<=0) return span('ft-num vazio','—');
  const cmv=custo/preco_venda*100, alto=cmv>(lim||30);
  return div('fl_ aic gap2',[
    el('span',null,null,{style:'width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0;background:'+(alto?'#B5302E':'#2C7A4B')}),
    el('span','bold',cmv.toFixed(0)+'%',{style:'color:'+(alto?'#B5302E':'var(--vd)')})
  ]);
}
function _ftOrdena(f){
  const s=_ftSort;
  if(s==='nome') return f.sort((a,b)=>(a.nome||'').localeCompare(b.nome||'','pt'));
  if(s==='cmv')  return f.sort((a,b)=>{const A=_ftCmv(a),B=_ftCmv(b); if(A==null&&B==null)return 0; if(A==null)return 1; if(B==null)return -1; return B-A;}); // maior CMV primeiro
  if(s==='preco')return f.sort((a,b)=>(+b.preco_venda||0)-(+a.preco_venda||0));
  if(s==='custo')return f.sort((a,b)=>(+b.custo_por_porcao||0)-(+a.custo_por_porcao||0));
  if(s==='editado')return f.sort((a,b)=>String(b.editado_em||'').localeCompare(String(a.editado_em||'')));
  return f;
}
function drawFT(w){
  if(!w){ const rc=document.getElementById('rec-t'); if(rc) return drawREC(rc); return; }
  w.innerHTML='';
  let f=_ftTab==='todos'?[..._ft]:
    _ftTab==='pre'?_ft.filter(x=>x.categoria==='pre'||x.categoria==='pre-producao'):
    _ftTab.indexOf('beb_')===0?_ft.filter(x=>x.cardapio===_ftTab.slice(4)&&x.categoria==='bebida'):
    _ft.filter(x=>x.cardapio===_ftTab&&x.categoria!=='bebida');
  /* "No Lola a gente não precisa ver as fichas técnicas da central" (Bianca, 17/07).
     Sem escape: a lista é só da sua cozinha. Filtro SÓ na lista — o `_ft` global segue
     inteiro pra não quebrar nada que dependa dele (regra #6). */
  f=f.filter(_daMinhaCozinha);
  if(_ftBusca) f=f.filter(x=>x.nome.toLowerCase().includes(_ftBusca.toLowerCase()));
  f=_ftOrdena(f.slice());
  /* Inativos (fora do menu) sempre no fim da lista, seja qual for a ordenação (Bianca, 07/08). */
  f=[...f.filter(x=>x.no_menu!==false), ...f.filter(x=>x.no_menu===false)];
  // barra de ordenação
  const sortBar=div('ft-sort no-print');
  sortBar.appendChild(span('ft-sort-lb','Ordenar por'));
  FT_SORTS.forEach(s=>{
    const b=el('button','ft-sb'+(_ftSort===s.k?' on':''),null,{html:s.l+(_ftSort===s.k&&s.k!=='nome'?' <i class="ph-duotone ph-arrow-down"></i>':''),
      onclick:()=>{_ftSort=s.k;drawFT(w);}});
    sortBar.appendChild(b);
  });
  w.appendChild(sortBar);

  /* 07/08 (Bianca): tirou o banner "Revisar ficha técnica — CMV acima do limite" do topo.
     As fichas acima do limite já aparecem em vermelho na própria lista (bolinha, % e a
     etiqueta "revisar ficha"), então o aviso em cima virou redundante. */
  if(!f.length){w.appendChild(em('ficha',_ftBusca?'Nenhuma ficha encontrada':'Nenhuma ficha aqui'));return;}

  const DEST_COR={ccmq:'#C0392B',mac:'#2C7A4B',central:'#2C5AA0',eventos:'#9A6B1E'};
  const DEST_LBL={ccmq:'CCMQ',mac:'MAC',central:'Central',eventos:'Evento'};

  const tbl=div('ins-tbl');
  const hd=div('ft-hd');
  hd.innerHTML='<div>Ficha</div><div style="text-align:right">Custo/porção</div><div style="text-align:right" class="ft-hd-pv">Preço venda</div><div style="text-align:right">CMV</div><div class="ft-hd-ed">Editado</div><div style="text-align:right">Ações</div>';
  tbl.appendChild(hd);

  f.forEach(x=>{
    const semPreco=!x.preco_venda||x.preco_venda<=0;
    const cmv=semPreco?null:(x.custo_por_porcao/x.preco_venda*100);
    const dataEd=x.editado_em?new Date(x.editado_em).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}):null;

    const lim=_ftLim(x);
    /* 18/07: selo de destino saiu (a aba de cardápio já diz onde). Entrou ATIVO/INATIVO
       no menu: inativa fica esmaecida (.inat) + etiqueta cinza. */
    const row=div('ft-row'+((!semPreco&&cmv>lim)?' alerta':'')+(x.no_menu===false?' inat':''));

    // ficha: nome + selos + revisar
    const nome=div('ft-nome');
    nome.appendChild(span('ft-nome-t',x.nome));
    /* 19/07 (Bianca): clicar no nome abre a EDIÇÃO (quem não pode editar cai na
       visualização) — e o botão VER saiu, o editar mostra a mesma coisa. */
    nome.style.cursor='pointer'; nome.title='Abrir a ficha';
    nome.addEventListener('click',()=>{ podeMexerAqui()?modalFicha(x):verFichaFT(x); });
    if(x.no_menu===false){ const s=span('ft-sel','INATIVO'); s.style.background='#8A7A72';
      s.title='Fora do menu atual — edite a ficha pra reativar'; nome.appendChild(s); }
    if(x.revisar){
      const rv=span('ft-rev'); rv.innerHTML='<i class="ph-duotone ph-warning"></i> revisar';
      rv.title=x.revisar_motivo||''; rv.addEventListener('click',()=>modalRevisarFicha('ft',x));
      nome.appendChild(rv);
    }
    if(x.produto_pronto){
      const pp=span('ft-pronto'); pp.innerHTML='<i class="ph-duotone ph-package"></i> produto pronto';
      pp.title='Comprado feito, sem manipulação — o limite de CMV dele é 50%';
      nome.appendChild(pp);
    }
    /* 07/08 (Bianca): saiu a etiqueta vermelha automática "revisar ficha" (CMV alto).
       Ficava duplicada com a etiqueta "revisar" manual. O CMV acima do limite já
       aparece em vermelho na coluna CMV (bolinha + %), então não precisa de etiqueta.
       Sobrou só a etiqueta "revisar" manual, que se tira dentro da ficha. */
    row.appendChild(nome);

    /* No desktop estes 4 são colunas do grid (o .ft-mob é display:contents).
       No celular viram uma linha de valores com rótulo. */
    const mob=div('ft-mob');
    mob.appendChild(div('ft-num',[R(x.custo_por_porcao)]));                 // custo/porção
    const pv=div('ft-num pv ft-pv'+(semPreco?' vazio':''));
    pv.textContent=semPreco?'sem preço':R(x.preco_venda);
    mob.appendChild(pv);                                                     // preço venda
    const cmvCel=div('ft-cmvcel'); cmvCel.appendChild(mkCMVCompacto(x.preco_venda,x.custo_por_porcao,lim));
    mob.appendChild(cmvCel);                                                 // CMV
    mob.appendChild(div('ft-ed',[dataEd?((x.editado_por||'—')+' · '+dataEd):'—']));
    row.appendChild(mob);
    // ações
    const acts=div('ft-acts');
    acts.appendChild(el('button','ins-sb'+(x.revisar?' warn':''),null,{html:'<i class="ph-duotone ph-warning"></i>',title:x.revisar?(x.revisar_motivo||'Revisar'):'Marcar para revisar',onclick:()=>modalRevisarFicha('ft',x)}));
    /* 19/07: botão VER (olhinho) removido — o clique no nome abre editar/ver. */
    if(podeMexerAqui()){
      acts.appendChild(el('button','ins-sb',null,{html:'<i class="ph-duotone ph-pencil-simple"></i>',title:'Editar',onclick:()=>modalFicha(x)}));
      acts.appendChild(el('button','ins-sb del',null,{html:'<i class="ph-duotone ph-trash"></i>',title:'Excluir',onclick:async()=>{
        if(!confirm('Excluir '+x.nome+'?'))return;
        await db('lola_fichas_tecnicas','PATCH',{ativo:false},'?id=eq.'+x.id);
        _ft=await db('lola_fichas_tecnicas','GET',null,'?select=*&ativo=eq.true&order=nome.asc');
        drawFT($('#ft-t'));
      }}));
    }
    row.appendChild(acts);
    tbl.appendChild(row);
  });
  w.appendChild(tbl);
}

/* 22/07 (Bianca): "a separação retirou a conexão do que é usado em que prato" —
   mapa PP → pratos (fichas técnicas), com 1 nível de PP dentro de PP. Usado na
   lista de Receitas ("🍽️ vai em ..."). */
async function _carregaUsosPP(){
  if(window._ppUsos) return window._ppUsos;
  try{
    const [fti,ppi]=await Promise.all([
      db('lola_fichas_tecnicas_itens','GET',null,'?select=ficha_id,preproducao_id&preproducao_id=not.is.null&limit=10000'),
      db('lola_preproducoes_itens','GET',null,'?select=preproducao_id,sub_preproducao_id&sub_preproducao_id=not.is.null&limit=10000')
    ]);
    const ftNome={}; (_ft||[]).forEach(f2=>{ ftNome[f2.id]=f2.nome; });
    const direto={};
    fti.forEach(r2=>{ const n=ftNome[r2.ficha_id]; if(!n) return; (direto[r2.preproducao_id]=direto[r2.preproducao_id]||new Set()).add(n); });
    const usos={};
    Object.keys(direto).forEach(k=>{ usos[k]=[...direto[k]]; });
    ppi.forEach(r2=>{ const viaPai=direto[r2.preproducao_id]; if(!viaPai) return; const arr=(usos[r2.sub_preproducao_id]=usos[r2.sub_preproducao_id]||[]); viaPai.forEach(n=>{ if(!arr.includes(n)) arr.push(n); }); });
    window._ppUsos=usos;
  }catch(e){ window._ppUsos={}; }
  return window._ppUsos;
}
function drawLixo(w, ppL, ftL, c){
  w.innerHTML='';
  let rows=[];
  (ppL||[]).filter(_daMinhaCozinha).forEach(p=>rows.push({t:'pp',o:p}));
  (ftL||[]).filter(_daMinhaCozinha).forEach(x=>rows.push({t:'ft',o:x}));

function _resizeImg(file, cb){
  try{
    var r=new FileReader();
    r.onload=function(){
      var img=new Image();
      img.onload=function(){
        var w=img.width,h=img.height,max=1100;
        if(w>max||h>max){ if(w>h){h=Math.round(h*max/w);w=max;} else {w=Math.round(w*max/h);h=max;} }
        var c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        cb(c.toDataURL('image/jpeg',0.72));
      };
      img.src=r.result;
    };
    r.readAsDataURL(file);
  }catch(e){console.error('resize',e);}
}
function _thumbFromDataUrl(dataUrl, max, cb){
  try{
    var img=new Image();
    img.onload=function(){
      var w=img.width,h=img.height;
      if(w>max||h>max){ if(w>h){h=Math.round(h*max/w);w=max;} else {w=Math.round(w*max/h);h=max;} }
      var c=document.createElement('canvas'); c.width=w;c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
      cb(c.toDataURL('image/jpeg',0.6));
    };
    img.onerror=function(){cb('');};
    img.src=dataUrl;
  }catch(e){cb('');}
}
function _thumbP(dataUrl,max){ return new Promise(function(res){ _thumbFromDataUrl(dataUrl,max,res); }); }
function buildFotosWidget(fotos){
  /* 07/08 (Bianca): foto grande (capa) + miniaturas embaixo. Clicar numa miniatura
     a torna capa; a capa abre em tamanho cheio. */
  var wrap=document.createElement('div');
  var cover=document.createElement('div'); cover.className='fv-cover';
  var thumbs=document.createElement('div'); thumbs.className='fv-thumbs';
  var fileInp=document.createElement('input'); fileInp.type='file'; fileInp.accept='image/*'; fileInp.multiple=true; fileInp.style.display='none';
  function openPick(){ fileInp.click(); }
  function render(){
    cover.innerHTML=''; thumbs.innerHTML='';
    if(!fotos.length){
      var e=document.createElement('div'); e.className='fv-cover-empty';
      e.innerHTML='<i class="ph-duotone ph-image"></i><span>Adicionar foto</span>';
      e.addEventListener('click',openPick); cover.appendChild(e);
      return;
    }
    var im=document.createElement('img'); im.src=fotos[0];
    im.addEventListener('click',function(){window.open(fotos[0],'_blank');});
    cover.appendChild(im);
    var badge=document.createElement('span'); badge.textContent='capa';
    badge.style.cssText='position:absolute;left:9px;bottom:9px;background:rgba(255,255,255,.9);color:#5A463E;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:50px';
    cover.appendChild(badge);
    var rm=document.createElement('button'); rm.type='button'; rm.className='fv-rm'; rm.innerHTML='<i class="ph-duotone ph-x"></i>';
    rm.addEventListener('click',function(){fotos.splice(0,1);render();});
    cover.appendChild(rm);
    for(var idx=1; idx<fotos.length; idx++){ (function(i){
      var t=document.createElement('img'); t.className='fv-thumb'; t.src=fotos[i]; t.title='Usar como capa';
      t.addEventListener('click',function(){ var f=fotos.splice(i,1)[0]; fotos.unshift(f); render(); });
      thumbs.appendChild(t);
    })(idx); }
    var add=document.createElement('button'); add.type='button'; add.className='fv-addmini'; add.innerHTML='<i class="ph-duotone ph-plus"></i>';
    add.addEventListener('click',openPick); thumbs.appendChild(add);
  }
  fileInp.addEventListener('change',function(){
    var files=Array.prototype.slice.call(this.files); this.value='';
    files.forEach(function(f){ _resizeImg(f,function(d){ fotos.push(d); render(); }); });
  });
  wrap.appendChild(cover); wrap.appendChild(thumbs); wrap.appendChild(fileInp);
  render();
  return wrap;
}

async function modalFicha(item){
  if(!podeMexer(item?item.cozinha:APP_COZ_ID)){ alert('Você vê esta ficha, mas não altera as fichas desta cozinha.\nSe precisa mudar, fale com a Bianca.'); return; }

  const _tabCard=_tabBeb?_ftTab.slice(4):(['ccmq','mac','eventos','central'].includes(_ftTab)?_ftTab:'ccmq');
  const _defCat=item?.categoria||(_tabBeb?'bebida':'prato');
  let f={nome:item?.nome||'',cardapio:item?.cardapio||_tabCard,categoria:_defCat,rendimento_qtd:item?.rendimento_qtd||1,rendimento_un:item?.rendimento_un||'porção',preco_venda:item?.preco_venda||'',meta_cmv:item?.meta_cmv||30,modo_preparo:item?.modo_preparo||'',observacoes:item?.observacoes||'',e_preparo:!!item?.e_preparo,produto_pronto:!!item?.produto_pronto,no_menu:item?(item.no_menu!==false):true};
  // Custo fixo do banco — não zera ao editar preço de venda
  let custoTotalFixo=parseFloat(item?.custo_total||0);
  let custoPorcaoFixo=parseFloat(item?.custo_por_porcao||0);
  const ings=[];
  const iw=div(null);
  const custoResEl=div('custo-box');
  let precoInp=null,metaCmvInp=null,_precoSug=0;

  // Carregar ingredientes existentes se estiver editando
  if(ed && item?.id){
    try{
      const existentes=await db('lola_fichas_tecnicas_itens','GET',null,
        '?select=*,lola_insumos(id,nome,custo_por_unidade,unidade_compra),lola_preproducoes(id,nome,custo_por_unidade,rendimento_un)&ficha_id=eq.'+item.id);
      existentes.forEach(it=>{
        const isIns=!!it.lola_insumos;
        ings.push({
          tipo:isIns?'insumo':'prep',
          id:isIns?it.lola_insumos.id:it.lola_preproducoes?.id,
          qtd_bruta:it.qtd_bruta,
          qtd_liquida:it.qtd_liquida,
          fc:it.fc,
          custo_unitario:it.custo_unitario,
          custo_total:it.custo_total,
          unidade:it.unidade,
        });
      });
    }catch(e){console.error('Erro ao carregar itens da ficha:',e);}
  }

  function calcTotais(){
    const ct=ings.length>0?ings.reduce((t,ig)=>t+parseFloat(ig.custo_total||0),0):custoTotalFixo;
    const qtd=parseFloat(f.rendimento_qtd||1);
    const cpp=ings.length>0?ct/qtd:custoPorcaoFixo;
    const pv=parseFloat(f.preco_venda)||0;
    const cmv=pv>0?(cpp/pv*100):null;
    const meta=parseFloat(f.meta_cmv)||33;
    _precoSug=meta>0?cpp/(meta/100):0;
    const _lim=f.produto_pronto?50:30;
    const cmvCor=cmv==null?'':(cmv<=_lim?'var(--vd)':'#dc2626');
    custoResEl.innerHTML=somaIngredientesHTML(ings)+'<div class="fl_ jb mb3"><span>Custo total</span><strong>'+R(ct)+'</strong></div>'+

      (cmv!=null?'<div class="fl_ jb mb3"><span>CMV atual <span style="font-size:10px;opacity:.6">(limite '+_lim+'%)</span></span><strong style="color:'+cmvCor+'">'+cmv.toFixed(0)+'%</strong></div>':'')+
      '<div class="fl_ jb"><span>Preço sugerido (CMV '+meta+'%)</span><strong class="tv">'+R(_precoSug)+'</strong></div>';
  }

  // Lista unificada: insumos + pré-prods em ordem alfabética com prefixo
  function mkOptsUnificada(){
    const ins=_ins.map(i=>{
      // Determinar unidade de uso baseada na unidade_compra e unidade_custo
      const uc=i.unidade_custo||'kg';
      let unUso;

      else if(['g','ml'].includes(i.unidade_compra)) unUso=i.unidade_compra;
      else if(i.unidade_compra==='kg') unUso='g';   // compra em kg → usa em g nas receitas
      else if(i.unidade_compra==='L') unUso='ml';   // compra em L → usa em ml nas receitas
      else unUso=i.unidade_compra||'un';             // un, cx, etc
      return {v:'ins:'+i.id,l:i.nome,custo:i.custo_por_unidade,un:unUso,tipo:'insumo',srcId:i.id};
    });

        const curVal=(ig.tipo==='insumo'?'ins:':'pp:')+ig.id;
        if(o.v===curVal)opt.selected=true;
        sel.appendChild(opt);
      });
      sel.addEventListener('change',e=>{
        const val=e.target.value;
        if(!val){ig.id='';ig.custo_unitario=0;ig.custo_total=0;ig.unidade='g';ig.tipo='insumo';rebuildI();return;}
        const opt=optsAll.find(o=>o.v===val);
        if(!opt)return;
        ig.tipo=opt.tipo;
        ig.id=opt.srcId;
        ig.custo_unitario=opt.custo;
        ig.unidade=opt.un;
        // Atualizar badge
        tipoBadge.textContent=ig.tipo==='prep'?'PP':'Ins';
        tipoBadge.className='bq '+(ig.tipo==='prep'?'bce':'bc');
        tipoBadge.style.cssText='font-size:10px;padding:2px 8px;border-radius:50px;font-weight:700;white-space:nowrap;flex-shrink:0';
        calcItem(idx);
        // Atualizar label de unidade
        unEl.textContent=ig.unidade||'g';
      });

      // Unidade selecionável — SEMPRE todas (g/kg/ml/L/un...) + a atual
      const unSel=el('select','fi',null,{style:'width:100%;min-width:0;padding:6px 2px;font-size:12px'});
      _ingUnits(ig).forEach(u=>{const o=el('option',null,u,{value:u});if(u===ig.unidade)o.selected=true;unSel.appendChild(o);});
      unSel.addEventListener('change',e=>{ig.unidade=e.target.value;calcItem(idx);});

      const qbI=finp('',ig.qtd_bruta!=null&&ig.qtd_bruta!==''?String(ig.qtd_bruta).replace('.',','):'',v=>{ig.qtd_bruta=(v||'').replace(',','.');calcItem(idx);},'text');qbI.setAttribute('inputmode','decimal');
      qbI.style.cssText='width:100%;min-width:0;text-align:center;padding:6px 4px';
      qbI.placeholder='Qtd';

      const fcI=finp('',ig.fc!=null?String(ig.fc).replace('.',','):1,v=>{ig.fc=(v||'').replace(',','.');calcItem(idx);},'text');fcI.setAttribute('inputmode','decimal');
      fcI.style.cssText='width:100%;min-width:0;text-align:center;padding:6px 4px';fcI.placeholder='FC';fcI.title='Fator de correção';
      sel.style.cssText='width:100%;min-width:0';

      const ctEl=span('bold tv',R(ig.custo_total||0));
      ctEl.style.cssText='white-space:nowrap;text-align:right;font-weight:800;color:var(--v);font-size:14px';
      /* 21/07 (Bianca): mostrar também o PREÇO DO INSUMO (por kg/L/un), não só
         o custo proporcional da quantidade usada na ficha. */
      const puEl=span(null,'');
      puEl.style.cssText='white-space:nowrap;text-align:right;font-size:10.5px;font-weight:600;color:var(--ts)';
      const ctWrap=div(null,[ctEl,puEl],{style:'display:flex;flex-direction:column;align-items:flex-end;min-width:64px;flex-shrink:0'});
      (function(){ if(!ig.id) return; const s0=ig.tipo==='insumo'?_ins.find(x=>x.id===ig.id):_pp.find(x=>x.id===ig.id); let u0; if(ig.tipo==='insumo'){u0=s0?.unidade_custo||'kg';} else {const r0=s0?.rendimento_un||'g';u0=r0==='g'?'kg':r0==='ml'?'L':r0;} puEl.textContent=R(parseFloat(ig.custo_unitario)||0)+'/'+u0; })();

      // Atualizar também o unSel quando seleciona um ingrediente
      sel.addEventListener('change',()=>{
        unSel.innerHTML='';
        _ingUnits(ig).forEach(u=>{const o=el('option',null,u,{value:u});if(u===ig.unidade)o.selected=true;unSel.appendChild(o);});
      });

      function calcItem(i){
        const src=ings[i];
        const ql=(parseFloat(src.qtd_bruta)||0)/(parseFloat(src.fc)||1);
        src.qtd_liquida=ql;
        // Buscar unidade de custo do insumo/prep para converter corretamente
        const srcObj=src.tipo==='insumo'?_ins.find(x=>x.id===src.id):_pp.find(x=>x.id===src.id);
        let unCusto;
        if(src.tipo==='insumo'){unCusto=srcObj?.unidade_custo||'kg';}
        else{const ru=srcObj?.rendimento_un||'g';unCusto=ru==='g'?'kg':ru==='ml'?'L':ru;}
        src.custo_total=calcCustoItem(src.qtd_bruta,src.fc,src.unidade||'g',src.custo_unitario,unCusto);
        ctEl.textContent=R(src.custo_total);
        puEl.textContent=src.id?(R(parseFloat(src.custo_unitario)||0)+'/'+unCusto):'';
        calcTotais();
      }

      const rm=btn('btn bd bxs','✕',()=>{ings.splice(idx,1);rebuildI();calcTotais();});
      iw.appendChild(div('ir',[tipoBadge,sel,qbI,unSel,fcI,ctWrap,rm]));
    });
  }
  rebuildI();calcTotais();

  const _autorFt={v:ME||item?.editado_por||''};
  const nomeEditFt=finp('',_autorFt.v,v=>{_autorFt.v=v;});
  nomeEditFt.placeholder='Seu nome...';
  const descEd=el('input','fi',null,{type:'text',id:'ft-descricao-edicao',placeholder:ed?'Ex: ajustei gramatura do croissant de 80g para 110g':'Nova ficha'});
  /* 18/07 (Bianca): "aqui não precisa mais a etiqueta de onde é servido e sim se o
     preparo está ou não no menu". O mkDestinosSelector SAIU do modal — a tela já é
     separada por aba de cardápio. `destinos` fica intacto no banco (PP/insumo usam
     os deles nos Pedidos); só não se edita mais por aqui. Entra a pílula ATIVO/INATIVO
     (coluna nova lola_fichas_tecnicas.no_menu, default true). */
  const destSelectorFT=document.createElement('div');
  destSelectorFT.style.cssText='display:flex;gap:8px;flex-wrap:wrap;align-items:center';
  const _mkFlagPill=(get,set,label,cor,title,extra)=>{ const b=document.createElement('button'); b.type='button'; b.title=title;
    const paint=()=>{ b.style.cssText='padding:7px 16px;border-radius:50px;font-size:12.5px;font-weight:800;cursor:pointer;border:1.5px solid '+cor+';background:'+(get()?cor:'#fff')+';color:'+(get()?'#fff':cor); b.textContent=(get()?'✓ ':'')+label; };
    b.onclick=()=>{ set(!get()); paint(); if(extra)extra(); }; paint(); return b; };
  (()=>{ const b=document.createElement('button'); b.type='button';
    b.title='Está no cardápio atual? INATIVA fica esmaecida na lista, mas continua com custo, receita e histórico.';
    const paint=()=>{ const on=f.no_menu!==false;
      b.style.cssText='padding:7px 16px;border-radius:50px;font-size:12.5px;font-weight:800;cursor:pointer;border:1.5px solid '+(on?'#2C7A4B':'#8A7A72')+';background:'+(on?'#2C7A4B':'#fff')+';color:'+(on?'#fff':'#8A7A72');
      b.textContent=on?'✓ ATIVO no menu':'INATIVO — fora do menu'; };
    b.onclick=()=>{ f.no_menu=!(f.no_menu!==false); paint(); }; paint(); destSelectorFT.appendChild(b); })();
  destSelectorFT.appendChild(_mkFlagPill(()=>f.e_preparo,v=>f.e_preparo=v,'Pré-preparo','#7A4FA3','Entra no Pedido à Central em todas as unidades'));
  destSelectorFT.appendChild(_mkFlagPill(()=>f.produto_pronto,v=>f.produto_pronto=v,'Produto pronto','#9A6B1E','Comprado feito, sem manipulação (ex.: torta fatiada) — limite de CMV vira 50%',()=>calcTotais()));

  let fotos=[]; if(ed && item?.id){ try{ const _fr=await db('lola_fichas_fotos','GET',null,'?ficha_id=eq.'+item.id+'&order=created_at.asc'); fotos=(_fr||[]).map(function(x){return x.foto;}); }catch(e){} }
  const fotosWidget=buildFotosWidget(fotos);
  precoInp=finp('',f.preco_venda,v=>{f.preco_venda=v;calcTotais();},'number');
  metaCmvInp=finp('',f.meta_cmv,v=>{f.meta_cmv=v;calcTotais();},'number');
  mkModal(ed?'Editar ficha':'Nova ficha técnica',[
    /* 07/08 (Bianca): redesign V3 - modal 920px em 2 colunas. Esquerda: foto grande +
       resumo de custo. Direita: campos + ingredientes em fios. Toda a logica (finp,

    (()=>{

        const txt=document.createElement('div');
        txt.style.cssText='flex:1;min-width:180px;font-size:12.5px;color:#7A5A12';
        const strong=document.createElement('strong');
        strong.innerHTML='<i class="ph-duotone ph-warning"></i> Pendente de revis\u00E3o. ';
        txt.appendChild(strong);
        txt.appendChild(document.createTextNode(item.revisar_motivo?('Motivo: '+item.revisar_motivo):'Sem motivo informado.'));
        const okb=btn('btn bv bsm','\u2713 Marcar como revisado',async()=>{
          okb.disabled=true; okb.textContent='...';
          try{
            await db('lola_fichas_tecnicas','PATCH',{revisar:false,revisar_motivo:null},'?id=eq.'+item.id);
            item.revisar=false; item.revisar_motivo=null; rb.remove();
            try{ _ft=await db('lola_fichas_tecnicas','GET',null,'?select=*&ativo=eq.true&order=nome.asc'); drawFT($('#ft-t')); }catch(e){}
          }catch(e){ alert('Erro: '+e.message); okb.disabled=false; okb.textContent='\u2713 Marcar como revisado'; }
        });
        rb.appendChild(txt); rb.appendChild(okb);
        reviewBanner=rb;
      }
      const autorWrap=(()=>{
        const w=div('fl_ aic gap2');
        w.style.cssText='margin-top:4px;padding:10px 14px;background:var(--rt);border-radius:10px;border:1.5px solid var(--rb)';
        if(ME){
          _autorFt.v=ME;
          w.innerHTML='<span style="white-space:nowrap;font-size:12px;font-weight:700;color:var(--v);flex-shrink:0">\u270D\uFE0F Alterando como:</span>'
            +'<b style="font-size:13px;color:var(--tx)">'+_uEsc(ME)+'</b>'
            +'<span class="tss" style="margin-left:auto;font-size:11px;color:#8A7A72"><i class="ph-duotone ph-lock-simple"></i> vem do seu login</span>';

        const inpA=el('input','fi',null,{type:'text',placeholder:'Seu nome (obrigat\u00F3rio para salvar)','data-autor-ft':'',style:'flex:1;border:1.5px solid var(--rb)'});
        if(_autorFt.v)inpA.value=_autorFt.v;
        inpA.addEventListener('input',e=>{ _autorFt.v=e.target.value; inpA.style.borderColor=e.target.value.trim()?'var(--vd)':'var(--rb)'; });
        w.appendChild(lbl);w.appendChild(inpA);
        return w;
      })();
      const colL=div('fv-l',[
        el('div','fv-seclbl','Foto do prato'),
        fotosWidget,
        el('hr','dv'),
        el('div','fv-seclbl','Resumo de custo'),
        custoResEl
      ]);
      const ingHead=div('ing-cols',[
        el('span',null,''), el('span',null,'Ingrediente'),
        el('span','r','Qtd'), el('span','r','Un'), el('span','r','FC'),
        el('span','r','Custo'), el('span',null,'')
      ]);
      const colR=div('fv-r',[
        ...(reviewBanner?[reviewBanner]:[]),
        div('fg2',[
          fgrp('Nome do prato',finp('',f.nome,v=>f.nome=v)),
          ...(ed?[fgrp('\uD83D\uDCDD O que foi alterado',descEd)]:[]),
        ]),
        div('fg4',[
          fgrp('Categoria',fsel('',['prato','sobremesa','bebida','produto_evento'],f.categoria,v=>{f.categoria=v;})),
          fgrp('Pre\u00E7o de venda (R$)',precoInp),
          fgrp('\uD83C\uDFAF Meta CMV (%)',metaCmvInp),
          fgrp(' ',btn('btn bg bsm','\u21A7 Sugerido',()=>{if(_precoSug>0){f.preco_venda=_precoSug.toFixed(2);if(precoInp)precoInp.value=f.preco_venda;calcTotais();}})),
        ]),
        div('fg3',[
          fgrp('Rendimento (qtd)',finp('',f.rendimento_qtd,v=>f.rendimento_qtd=v,'number')),
          fgrp('Unidade rendimento',fsel('',['por\u00E7\u00E3o','un','kg','L','pessoa'],f.rendimento_un,v=>f.rendimento_un=v)),
          fgrp('\uD83C\uDFF7\uFE0F Situa\u00E7\u00E3o no menu',destSelectorFT),
        ]),
        el('hr','dv'),
        div('fl_ jb aic mb3',[
          el('strong',null,'Composi\u00E7\u00E3o do prato',{style:'font-size:15px;font-family:Fraunces,serif;font-weight:600'}),
          btn('btn bg bsm','+ Ingrediente',()=>{ings.push({tipo:'insumo',id:'',qtd_bruta:'',qtd_liquida:0,fc:1,custo_unitario:0,custo_total:0,unidade:'g'});rebuildI();})
        ]),
        ingHead,
        iw,
        el('hr','dv'),
        fgrp('\uD83D\uDCDD Modo de preparo',el('textarea','fi',f.modo_preparo||'',{oninput:e=>{f.modo_preparo=e.target.value;},rows:'3',placeholder:'Passo a passo do preparo...',style:'width:100%;resize:vertical;min-height:60px;font-family:inherit'})),
        fgrp('\uD83D\uDDD2\uFE0F Observa\u00E7\u00F5es',el('textarea','fi',f.observacoes||'',{oninput:e=>{f.observacoes=e.target.value;},rows:'2',placeholder:'Observa\u00E7\u00F5es sobre a receita...',style:'width:100%;resize:vertical;min-height:46px;font-family:inherit'})),

      if(inpA){inpA.style.borderColor='#dc2626';inpA.focus();inpA.placeholder='⚠️ Obrigatório!';}
      throw new Error('Informe seu nome antes de salvar.');
    }
    const ct=ings.reduce((t,ig)=>t+parseFloat(ig.custo_total||0),0);
    const ct2=ings.length>0?ings.reduce((t,ig)=>t+parseFloat(ig.custo_total||0),0):custoTotalFixo;
    const cpp2=ings.length>0?ct2/parseFloat(f.rendimento_qtd||1):custoPorcaoFixo;
    const descricaoEd=document.getElementById('ft-descricao-edicao')?.value||'';
    const p={nome:f.nome,cardapio:f.cardapio,categoria:f.categoria,no_menu:f.no_menu!==false,e_preparo:!!f.e_preparo,produto_pronto:!!f.produto_pronto,rendimento_qtd:parseFloat(f.rendimento_qtd),rendimento_un:f.rendimento_un,preco_venda:parseFloat(f.preco_venda)||null,custo_total:ct2,custo_por_porcao:cpp2,modo_preparo:f.modo_preparo||null,observacoes:f.observacoes||null,editado_por:_autorFt.v||null,editado_em:new Date().toISOString()};
    /* QUEM FAZ — mesma regra da pré-produção. Nova nasce na cozinha do app;
       editando, mantém a de quem já era dona. */
    p.cozinha = (ed && item && item.cozinha) ? item.cozinha : APP_COZ[0];

    let fid;
    if(ed){
      await db('lola_fichas_tecnicas','PATCH',p,'?id=eq.'+item.id);
      await db('lola_fichas_tecnicas_itens','DELETE',null,'?ficha_id=eq.'+item.id);
      fid=item.id;
      // Salvar histórico
      await db('lola_fichas_historico','POST',{
        ficha_id:item.id,
        editado_por:_autorFt.v||'Não informado',
        editado_em:new Date().toISOString(),
        descricao:descricaoEd||'Ficha editada',
        snapshot:{nome:f.nome,custo_total:ct2,custo_por_porcao:cpp2,preco_venda:parseFloat(f.preco_venda)||null,ingredientes:ings.length}
      });
    }else{const[nv]=await db('lola_fichas_tecnicas','POST',p);fid=nv.id;}
    for(const ig of ings){
      if(!ig.id)continue;
      await db('lola_fichas_tecnicas_itens','POST',{ficha_id:fid,insumo_id:ig.tipo==='insumo'?ig.id:null,preproducao_id:ig.tipo==='prep'?ig.id:null,unidade:ig.unidade||'g',qtd_bruta:parseFloat(ig.qtd_bruta)||0,qtd_liquida:parseFloat(ig.qtd_liquida)||0,fc:parseFloat(ig.fc)||1,custo_unitario:parseFloat(ig.custo_unitario)||0,custo_total:parseFloat(ig.custo_total)||0});
    }
    try{ await db('lola_fichas_fotos','DELETE',null,'?ficha_id=eq.'+fid); for(const _fo of fotos){ await db('lola_fichas_fotos','POST',{ficha_id:fid,foto:_fo}); } }catch(e){console.error('fotos',e);}
    _ft=await db('lola_fichas_tecnicas','GET',null,'?select=*&ativo=eq.true&order=nome.asc');
    drawFT($('#ft-t'));
  },'mo moxl mo-ficha');
  }catch(e){alert('Erro ao abrir ficha: '+e.message);console.error(e);}
}

let _conUN='ccmq';
async function pgCont(c){
  c.appendChild(ld());
  try{
    _cat=await db('lola_catalogo_central','GET',null,'?select=*,lola_estoque_minimo(*)&ativo=eq.true&order=nome.asc');
    const hist=await db('lola_contagens','GET',null,'?select=*&order=created_at.desc&limit=6');
    c.innerHTML='';
    c.appendChild(div('abar no-print',[
      mkTabs(['ccmq','mac'],_conUN,t=>_conUN=t),
      btn('btn bp bsm','▶ Iniciar contagem',()=>iniciarCont(c)),
    ]));
    if(hist.length){
      c.appendChild(el('strong',null,'Histórico de contagens',{style:'font-size:13px;color:var(--ts);display:block;margin-bottom:10px'}));
      c.appendChild(div('tw',mkTable(

        hist.map(h=>[DBR(h.data_contagem),bq(UL[h.unidade]||h.unidade,UB[h.unidade]||''),bq(h.status,h.status==='finalizado'?'ben':'bpd')]),
        [null,null,null]
      )));

    }
  }catch(e){c.innerHTML='<p style="color:red;padding:20px">'+e.message+'</p>';}
}

async function iniciarCont(c){
  const[nv]=await db('lola_contagens','POST',{unidade:_conUN,data_contagem:TD(),status:'rascunho'});
  const qtds={};_cat.forEach(x=>qtds[x.id]=0);
  c.innerHTML='';
  c.appendChild(div('al alw mb3',['Contagem em andamento — '+DBR(TD())+' — '+UL[_conUN]+'. Preencha as quantidades encontradas.']));
  const tbody=el('tbody');
  _cat.forEach(item=>{
    const min=item.lola_estoque_minimo?.find(e=>e.unidade===_conUN)?.quantidade_minima||0;
    const inp=el('input','fi',null,{type:'number',step:'0.01',min:'0',value:'0',style:'width:100px'});
    const stEl=el('td','eok','OK');
    const pdEl=el('td','tss','—');
    inp.addEventListener('input',()=>{
      const q=parseFloat(inp.value)||0;qtds[item.id]=q;
      if(q>=min){stEl.textContent='OK';stEl.className='td eok';}
      else if(q>=min*.5){stEl.textContent='Baixo';stEl.className='td ebx';}
      else{stEl.textContent='Crítico';stEl.className='td ecr';}
      const p=Math.max(0,min-q);
      pdEl.textContent=p>0?'+'+p+' '+item.unidade:'—';
      pdEl.style.color=p>0?'var(--v)':'var(--ts)';
    });
    const tr=el('tr');
    [el('td',null,[el('strong',null,item.nome)]),el('td',null,item.unidade),el('td',null,String(min)),el('td',null,[inp]),stEl,pdEl].forEach(td=>tr.appendChild(td));
    tbody.appendChild(tr);
  });
  c.appendChild(div('tw mb3',el('table',null,[
    el('thead',null,el('tr',null,[['Produto','Un.','Mínimo','Encontrado','Status','Pedir'].map(t=>el('th',null,t))])),
    tbody
  ])));
  c.appendChild(div('fl_ jb aic no-print',[
    btn('btn bg','Cancelar',()=>nav('contagem')),
    btn('btn bv','✓ Finalizar e gerar pedido',()=>finCont(nv.id,qtds,c)),
  ]));
}

async function finCont(cid,qtds,c){
  const iP=_cat.map(item=>{
    const min=item.lola_estoque_minimo?.find(e=>e.unidade===_conUN)?.quantidade_minima||0;
    return{catId:item.id,qtd:Math.max(0,min-(parseFloat(qtds[item.id])||0)),item};
  }).filter(i=>i.qtd>0);
  for(const[catId,qtd]of Object.entries(qtds)){
    const ci=_cat.find(x=>x.id===catId);
    const min=ci?.lola_estoque_minimo?.find(e=>e.unidade===_conUN)?.quantidade_minima||0;
    await db('lola_contagem_itens','POST',{contagem_id:cid,catalogo_id:catId,quantidade_encontrada:parseFloat(qtd)||0,quantidade_minima:min});
  }
  await db('lola_contagens','PATCH',{status:'finalizado'},'?id=eq.'+cid);
  if(iP.length>0){
    const vt=iP.reduce((t,i)=>{const pr=_conUN==='ccmq'?i.item.preco_ccmq:i.item.preco_mac;return t+(i.qtd*pr);},0);
    const[ped]=await db('lola_pedidos','POST',{unidade:_conUN,status:'solicitado',data_pedido:TD(),valor_total:vt});
    for(const i of iP){const pr=_conUN==='ccmq'?i.item.preco_ccmq:i.item.preco_mac;await db('lola_pedidos_itens','POST',{pedido_id:ped.id,catalogo_id:i.catId,nome_item:i.item.nome,quantidade:i.qtd,unidade:i.item.unidade,preco_unitario:pr});}
    alert('✅ Contagem finalizada!\nPedido gerado com '+iP.length+' itens.\nTotal: '+R(vt));
  }else{alert('✅ Estoque OK — nenhum pedido gerado.');}
  nav('pedidos');
}

async function gerarPedidoDeContagem(contagemId){

    '?contagem_id=eq.'+contagemId+'&pedido=gt.0&select=*,lola_estoque_itens!estoque_item_id(nome,unidade,categoria,fornecedor),lola_insumos!insumo_id(nome,unidade_custo,unidade_compra,categoria,fornecedor_padrao)');
  if(!itens.length){alert('Nenhum item com pedido nesta contagem.');return;}
  // Prefere o cadastro único de Insumos; cai pro item de estoque legado
  const _pi=it=>{const ins=it.lola_insumos,es=it.lola_estoque_itens;return{
    nome: ins?.nome||es?.nome||'—',
    unidade: (ins?(ins.unidade_custo||ins.unidade_compra):es?.unidade)||'—',
    fornecedor: (ins?ins.fornecedor_padrao:es?.fornecedor)||'—',
    categoria: ins?.categoria||es?.categoria||'outros'
  };};

  // Agrupar por categoria
  const grupos={};
  itens.forEach(it=>{

  const ov=div('ov');const mo=div('mo mol');

    span('scl','Total de itens a pedir'),
    div('bold tv mt2',totalItens+' itens em '+Object.keys(grupos).length+' categorias'),

  Object.entries(grupos).forEach(([cat,gItens])=>{

    t.textContent=(CONT_CATS[cat]||cat)+' ('+gItens.length+' itens)';
    mb2.appendChild(t);
    mb2.appendChild(div('tw mb2',mkTable(
      ['Produto','Un','Qtd pedido','Fornecedor'],
      gItens.map(it=>{const pi=_pi(it);return[
        el('strong',null,pi.nome),
        pi.unidade,
        el('span','bold tv',N(it.pedido,1)),
        el('span','tss',pi.fornecedor),
      ];}),
      [null,'tr','tr',null]
    )));
  });

  const mf=div('mf',[
    btn('btn bg','Fechar',()=>ov.remove()),
    btn('btn bp','🖨️ Imprimir lista',()=>{
      const w=window.open('','_blank');

  mo.appendChild(mb2);mo.appendChild(mf);
  ov.appendChild(mo);ov.addEventListener('click',e=>{
    // Só fecha se clicar exatamente no overlay, nunca em filhos (selects, dropdowns)
    if(e.target===ov&&!mo.contains(e.target))ov.remove();

    // Agrupado por dia

    Object.entries(porData).sort(function(a,b){return b[0].localeCompare(a[0]);}).forEach(function(ent){
      var data=ent[0],dItens=ent[1],dataFmt;

  chosenBtn.addEventListener('click',function(){chosen.style.display='none';searchInp.style.display='block';searchInp.focus();renderList('');});

  // ---- Qtd + Unidade ----

  unSel.addEventListener('change',function(e){f.unidade=e.target.value;});

    var b=el('button',null,o.l,{type:'button'});
    var paint=function(){var sel=f.destino===o.v;b.style.cssText='min-height:40px;padding:9px 15px;border-radius:50px;border:1.5px solid '+(sel?'var(--v)':'var(--rb)')+';cursor:pointer;font-family:Manrope,sans-serif;font-weight:700;font-size:13px;'+(sel?'background:var(--v);color:#fff':'background:#fff;color:var(--tx)');};
    b._paint=paint;paint();
    b.addEventListener('click',function(){f.destino=(f.destino===o.v?'':o.v);Array.prototype.forEach.call(destRow.children,function(x){if(x._paint)x._paint();});});
    destRow.appendChild(b);
  });
  destGrp.appendChild(destRow);mb.appendChild(destGrp);

  // ---- Quem produziu ----
  var respInp=el('input','fi',null,{type:'text',value:f.responsavel,placeholder:'Nome de quem produziu'});
  respInp.addEventListener('input',function(e){f.responsavel=e.target.value;});
  mb.appendChild(fgrp('Quem produziu',respInp));

  // ---- Observações ----
  var obsInp=el('textarea','fi',null,{placeholder:'Validade, lote, detalhes…'});
  obsInp.value=f.observacoes;obsInp.rows=2;obsInp.style.cssText='width:100%;resize:vertical';
  obsInp.addEventListener('input',function(e){f.observacoes=e.target.value;});
  mb.appendChild(fgrp('Observações',obsInp));

  // ---- Foto ----
  var fotoGrp=div('fg');fotoGrp.appendChild(el('label','fl','Foto da produção'));
  var fotoPrev=el('div',null,null,{});fotoPrev.style.cssText='margin-top:8px';
  function paintFoto(){
    var src=_novaFoto||f.foto_url;fotoPrev.innerHTML='';
    if(src){
      var im=el('div',null,null,{});im.style.cssText='width:100%;max-width:230px;height:155px;border-radius:14px;border:1px solid var(--rb);background:#F1EFE8 center/cover no-repeat;background-image:url(\''+src+'\')';
      var rm=el('button',null,'Remover foto',{type:'button'});rm.style.cssText='display:block;margin-top:8px;background:#fff;border:1px solid var(--rb);border-radius:10px;padding:8px 13px;font-size:12px;font-weight:700;color:#B5302E;cursor:pointer';
      rm.addEventListener('click',function(){_novaFoto=null;f.foto_url='';paintFoto();});
      fotoPrev.appendChild(im);fotoPrev.appendChild(rm);
    }

  var fileInp=el('input',null,null,{type:'file',accept:'image/*'});fileInp.style.display='none';
  fileInp.addEventListener('change',function(){var file=fileInp.files&&fileInp.files[0];if(!file)return;_resizeImg(file,function(durl){_novaFoto=durl;paintFoto();});});
  var addFotoBtn=el('button',null,null,{type:'button',html:'<i class="ph-duotone ph-camera" style="font-size:18px"></i> Tirar / escolher foto'});
  addFotoBtn.style.cssText='display:inline-flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--rb);border-radius:12px;padding:11px 15px;font-family:Manrope,sans-serif;font-weight:700;font-size:14px;color:var(--v);cursor:pointer;min-height:44px';
  addFotoBtn.addEventListener('click',function(){fileInp.click();});

  mb.appendChild(fotoGrp);paintFoto();

    }catch(e){alert('Erro: '+e.message);saveB.textContent='Salvar';saveB.disabled=false;}
  });
  mf.appendChild(saveB);mo.appendChild(mf);

  ov.appendChild(mo);
  ov.addEventListener('click',function(e){if(e.target===ov)ov.remove();});
  document.body.appendChild(ov);
}

function _delProducao(reg,parentOv,onSave){
  var ov=div('ov');var mo=div('mo');mo.style.maxWidth='360px';
  mo.addEventListener('click',function(e){e.stopPropagation();});
  mo.appendChild(div('mh',[el('h3',null,'Excluir produção?'),btn('xb','✕',function(){ov.remove();})]));
  var p=el('p',null,'Remover o registro de “'+(reg.item_nome||'')+'”? Essa ação não pode ser desfeita.');
  p.style.cssText='padding:4px 2px;color:var(--ts);line-height:1.5';
  mo.appendChild(div('mb',[p]));
  var mf=div('mf');
  mf.appendChild(btn('btn bg','Cancelar',function(){ov.remove();}));
  var delB=btn('btn','Excluir',null);delB.style.cssText='background:#B5302E;color:#fff;border:0';
  delB.addEventListener('click',async function(){
    delB.textContent='Excluindo...';delB.disabled=true;
    try{
      if(reg.foto_url){try{var pth=reg.foto_url.split('/producao/')[1];if(pth)await fetch(SB+'/storage/v1/object/producao/'+pth,{method:'DELETE',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY}});}catch(_e){}}
      await db('lola_producao_central','DELETE',null,'?id=eq.'+reg.id);
      ov.remove();if(parentOv)parentOv.remove();if(onSave)onSave();
    }catch(e){alert('Erro: '+e.message);delB.textContent='Excluir';delB.disabled=false;}
  });
  mf.appendChild(delB);mo.appendChild(mf);
  ov.appendChild(mo);ov.addEventListener('click',function(e){if(e.target===ov)ov.remove();});
  document.body.appendChild(ov);
}

/* 19/08 (Bianca): DESCARTES — planilha de insumos jogados fora (vencido/estragado/quebra/
   sobra). Cada descarte grava um movimento origem_tipo='descarte' que DÁ BAIXA no saldo
   (carregarSaldoInsumos subtrai) e guarda o custo perdido. Só CCMQ por enquanto. */
const DESC_MOTIVOS=[['vencido','Vencido'],['estragado','Estragado / deteriorado'],['quebra','Quebra / derramamento'],['sobra','Sobra de produção']];
function _descMotLb(k){ const base=String(k||'').split(' · ')[0]; const m=DESC_MOTIVOS.find(x=>x[0]===base); return m?m[1]:(base||'—'); }
let DESC_ST=null;
async function pgDescartes(c){
  c.appendChild(ld());
  try{
    const [insumos, movs]=await Promise.all([
      db('lola_insumos','GET',null,'?select=id,nome,categoria,unidade_custo,custo_por_unidade&ativo=eq.true&order=nome.asc'),
      db('lola_ccmq_estoque_mov','GET',null,'?origem_tipo=eq.descarte&select=id,insumo_id,qtd,unidade,custo_total,origem_ref,data,criado_por&order=data.desc,criado_em.desc&limit=500')
    ]);
    const insById={}; insumos.forEach(i=>insById[i.id]=i);
    DESC_ST={insumos, insById};
    c.innerHTML='';
    const note=div(null); note.style.cssText='background:var(--rf);border:1px solid var(--rb);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:12.5px;color:var(--ts);line-height:1.5';
    note.innerHTML='<i class="ph-duotone ph-info" style="color:var(--v)"></i> Registre o que foi <b>jogado fora</b> (vencido, estragado, quebra, sobra). Cada descarte <b>dá baixa no saldo</b> do estoque e guarda o custo perdido.';
    c.appendChild(note);
    const bNovo=btn('btn bp','＋ Novo descarte',()=>modalNovoDescarte(()=>pgDescartes(c)));
    bNovo.style.cssText='margin-bottom:12px;font-weight:700';
    c.appendChild(bNovo);
    const mes=(TD()||'').slice(0,7);
    const doMes=movs.filter(m=>String(m.data||'').slice(0,7)===mes);
    const custoMes=doMes.reduce((s,m)=>s+(+m.custo_total||0),0);
    const resumo=div(null); resumo.style.cssText='font-size:12px;font-weight:800;color:var(--v);text-transform:uppercase;letter-spacing:.05em;margin:2px 0 10px';
    resumo.textContent=movs.length+' descarte(s) · '+doMes.length+' no mês · perda no mês '+R(custoMes);
    c.appendChild(resumo);
    const listBox=div(null); c.appendChild(listBox);
    if(!movs.length){ listBox.appendChild(div('tss',null,{style:'padding:16px',html:'Nenhum descarte registrado ainda.'})); return; }
    const tbl=el('table',null,null,{style:'width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--rb);border-radius:14px;overflow:hidden;table-layout:fixed'});
    const th='font-size:10px;text-transform:uppercase;letter-spacing:.03em;color:var(--ts);font-weight:800;text-align:left;padding:8px;background:var(--rf);border-bottom:1px solid var(--rb);white-space:nowrap;overflow:hidden;text-overflow:ellipsis';
    tbl.innerHTML='<colgroup><col style="width:52px"><col><col style="width:74px"><col style="width:92px"><col style="width:78px"><col style="width:32px"></colgroup>'
      +'<thead><tr><th style="'+th+'">Data</th><th style="'+th+'">Insumo</th><th style="'+th+';text-align:right">Qtd</th><th style="'+th+'">Motivo</th><th style="'+th+';text-align:right">Perda</th><th style="'+th+'"></th></tr></thead>';
    const tb=el('tbody');
    movs.forEach(m=>{
      const ins=insById[m.insumo_id]||{}; const td='padding:8px;border-bottom:1px solid #F3EBE2;font-size:12.5px;vertical-align:middle;background:#fff';
      const tr=el('tr');
      tr.innerHTML='<td style="'+td+';white-space:nowrap;color:var(--ts)">'+String(DBR(m.data)||'').slice(0,5)+'</td>'
        +'<td style="'+td+';overflow:hidden"><span style="display:block;font-weight:700;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+_envEsc(ins.nome||'?')+'</span></td>'
        +'<td style="'+td+';text-align:right;white-space:nowrap">'+_enQ(+m.qtd||0)+' '+_envEsc(m.unidade||'')+'</td>'
        +'<td style="'+td+'"><span style="font-size:10.5px;font-weight:800;color:#9A6B1E">'+_descMotLb(m.origem_ref)+'</span></td>'
        +'<td style="'+td+';text-align:right;white-space:nowrap;font-weight:700">'+R(+m.custo_total||0)+'</td>';
      const tdAc=el('td',null,null,{style:td+';text-align:center'});
      const bx=btn('','',()=>excluirDescarte(m,()=>pgDescartes(c))); bx.innerHTML='<i class="ph-duotone ph-trash"></i>'; bx.title='Excluir (devolve ao saldo)'; bx.style.cssText='border:0;background:none;color:#B0928A;cursor:pointer;font-size:15px;padding:4px';
      tdAc.appendChild(bx); tr.appendChild(tdAc); tb.appendChild(tr);
    });
    tbl.appendChild(tb); listBox.appendChild(tbl);
  }catch(e){ c.innerHTML='<div style="padding:20px;color:red;font-weight:700">❌ Erro ao carregar.<br><small>'+_envEsc(e.message)+'</small></div>'; }
}
async function excluirDescarte(m,onDone){
  const ins=(DESC_ST&&DESC_ST.insById[m.insumo_id])||{};
  if(!confirm('Excluir o descarte de '+_enQ(+m.qtd||0)+' '+(m.unidade||'')+' de "'+(ins.nome||'?')+'"?\n\nA quantidade volta pro saldo do estoque.'))return;

}
function modalNovoDescarte(onDone){
  const insumos=(DESC_ST&&DESC_ST.insumos)||[];
  const UNS=['kg','g','L','ml','un','pct','cx','fd','dz'];
  const wrap=div(null);
  const insInp=el('input','fi',null,{placeholder:'Buscar insumo…',autocomplete:'off'}); insInp.style.cssText='width:100%;font-size:13px';
  const qtdInp=el('input','fi',null,{type:'number',step:'0.001',inputmode:'decimal',placeholder:'Qtd'});
  const unSel=el('select','fi',null,{style:'width:90px'}); UNS.forEach(u=>unSel.appendChild(el('option',null,u,{value:u})));
  const motSel=el('select','fi',null,{}); DESC_MOTIVOS.forEach(mm=>motSel.appendChild(el('option',null,mm[1],{value:mm[0]})));
  const dataInp=el('input','fi',null,{type:'date',value:TD()});
  const obsInp=el('input','fi',null,{placeholder:'Observação (opcional)'});
  const calc=el('div','tss',null,{style:'margin-top:8px'});
  let selId=null, _skip=false;
  const box=document.createElement('div'); box.style.cssText='position:fixed;z-index:900;background:#fff;border:1.5px solid var(--rb);border-radius:12px;box-shadow:0 8px 24px rgba(42,26,23,.15);max-height:240px;overflow-y:auto;display:none'; document.body.appendChild(box);
  function fechar(){ box.style.display='none'; }
  function upd(){ const ins=insumos.find(i=>i.id===selId); const q=+qtdInp.value||0; const cu=ins?(+ins.custo_por_unidade||0):0; const perda=cu*q;
    calc.innerHTML=(selId&&q>0)?('Perda estimada: <b style="color:var(--v)">'+R(perda)+'</b>'+(ins&&ins.unidade_custo&&unSel.value!==ins.unidade_custo?(' <small>(insumo cadastrado em '+_envEsc(ins.unidade_custo)+')</small>'):'')):(selId?'informe a quantidade':'escolha o insumo'); }
  function render(){
    if(_skip){_skip=false;fechar();return;}
    const q=_jnorm(insInp.value||''); if(q.length<1){ fechar(); return; }
    const hits=insumos.filter(i=>_jnorm(i.nome).includes(q)).slice(0,12);
    if(!hits.length){ fechar(); return; }
    box.innerHTML=''; hits.forEach(i=>{ const it=document.createElement('div'); it.textContent=i.nome; it.style.cssText='padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;border-bottom:1px solid #F3EBE2';
      it.onmouseenter=()=>it.style.background='var(--rf)'; it.onmouseleave=()=>it.style.background='#fff';
      it.onmousedown=(e)=>{ e.preventDefault(); _skip=true; selId=i.id; insInp.value=i.nome; if(i.unidade_custo){ let u=String(i.unidade_custo).trim(); if(u.toLowerCase()==='l')u='L'; if(UNS.includes(u))unSel.value=u; } upd(); fechar(); };
      box.appendChild(it); });
    const r=insInp.getBoundingClientRect(); box.style.left=r.left+'px'; box.style.top=(r.bottom+4)+'px'; box.style.width=Math.max(r.width,240)+'px'; box.style.display='block';
  }
  insInp.addEventListener('input',()=>{ selId=null; upd(); render(); });
  insInp.addEventListener('focus',render); insInp.addEventListener('blur',()=>setTimeout(fechar,150));
  qtdInp.oninput=upd; unSel.onchange=upd;
  const bSave=btn('btn bp','✓ Registrar descarte',async()=>{
    if(!selId){ alert('Escolha um insumo da lista.'); insInp.focus(); return; }
    const q=+qtdInp.value||0; if(!(q>0)){ alert('Quantidade inválida.'); qtdInp.focus(); return; }
    const ins=insumos.find(i=>i.id===selId)||{}; const cu=+ins.custo_por_unidade||0; const custo=+(cu*q).toFixed(2);
    const obs=obsInp.value.trim();
    if(!confirm('Dar baixa de '+_enQ(q)+' '+unSel.value+' de "'+(ins.nome||'')+'" ('+motSel.options[motSel.selectedIndex].text+')?\n\nSai do saldo do estoque'+(custo>0?(' · perda '+R(custo)):'')+'.'))return;
    bSave.disabled=true; bSave.textContent='Registrando...';
    try{
      await db('lola_ccmq_estoque_mov','POST',{insumo_id:selId,tipo:'perda',qtd:q,unidade:unSel.value,custo_unit:(cu||null),custo_total:(custo||null),origem_tipo:'descarte',origem_ref:motSel.value+(obs?' · '+obs:''),data:(dataInp.value||TD()),criado_por:ME||null});
      fechar(); box.remove(); document.querySelectorAll('.ov').forEach(o=>o.remove());
      if(onDone)onDone();
    }catch(e){ alert('Erro: '+e.message); bSave.disabled=false; bSave.textContent='✓ Registrar descarte'; }
  });
  bSave.style.cssText='width:100%;margin-top:12px;padding:13px;font-weight:800;font-size:14px';
  wrap.appendChild(fgrp('Insumo',insInp));
  wrap.appendChild(el('div',null,null,{style:'height:10px'}));
  wrap.appendChild(div('fg2',[fgrp('Quantidade',div(null,[qtdInp,unSel],{style:'display:flex;gap:8px;align-items:center'})),fgrp('Motivo',motSel)]));
  wrap.appendChild(el('div',null,null,{style:'height:10px'}));
  wrap.appendChild(div('fg2',[fgrp('Data',dataInp),fgrp('Observação',obsInp)]));
  wrap.appendChild(calc);
  wrap.appendChild(bSave);
  mkModal('🗑️ Novo descarte — estoque CCMQ',[wrap],null,'mo mol');
  upd();
}

async function modalNovaSaida(onSave){
  // 26/08 (Bianca): a Saída puxava só de lola_estoque_itens — insumos novos (ex.: vinhos
  // recém-cadastrados) ficavam de fora. Agora une os itens de estoque + TODOS os insumos
  // (dedup por nome), pra tudo que existe em insumos aparecer aqui. estoque_item_id fica null
  // pra item que só existe em insumos (a saída grava pelo nome_item).
  const _snorm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
  const _estItens=await db('lola_estoque_itens','GET',null,'?ativo=eq.true&order=categoria.asc,nome.asc');
  let _insAll=[]; try{ _insAll=await db('lola_insumos','GET',null,'?ativo=eq.true&select=id,nome,categoria,unidade_custo,unidade_compra&order=nome.asc'); }catch(e){}
  const _haveNomes=new Set((_estItens||[]).map(i=>_snorm(i.nome)));
  const _insExtra=(_insAll||[]).filter(i=>i.nome && !_haveNomes.has(_snorm(i.nome)))
    .map(i=>({id:null, nome:i.nome, categoria:i.categoria, unidade:(i.unidade_custo||i.unidade_compra||'')}));
  const todosItens=(_estItens||[]).concat(_insExtra);

  const f={responsavel:'',destino:'venda',data:new Date().toISOString().split('T')[0],observacoes:''};
  const itensSaida=[]; // {estoque_item_id, nome_item, quantidade, unidade, observacoes, setor}
  let _lastSetor='';
  const listaWrap=div(null);

  function rebuildLista(){
    listaWrap.innerHTML='';
    if(!itensSaida.length){
      listaWrap.appendChild(div('tss mt2','Nenhum item adicionado ainda.'));
      return;
    }
    const tbl=document.createElement('table');
    tbl.style.cssText='width:100%;border-collapse:collapse;margin-top:8px';
    const thead=document.createElement('thead');
    const hRow=document.createElement('tr');
    ['Item','Qtd','Un','Setor','Obs',''].forEach((h,i)=>{
      const th=document.createElement('th');
      th.style.cssText='padding:6px 8px;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--v);background:var(--rt);text-align:'+(i>=1&&i<=2?'right':'left');
      th.textContent=h;hRow.appendChild(th);
    });
    thead.appendChild(hRow);tbl.appendChild(thead);
    const tbody=document.createElement('tbody');
    itensSaida.forEach((it,idx)=>{
      const tr=document.createElement('tr');
      tr.style.cssText=(idx%2===0?'background:var(--rf)':'background:#fff')+';border-bottom:1px solid var(--rb)';

      const tdNome=document.createElement('td');tdNome.style.cssText='padding:6px 8px;font-size:12px;font-weight:600';
      tdNome.textContent=it.nome_item;tr.appendChild(tdNome);

      const tdQtd=document.createElement('td');tdQtd.style.cssText='padding:4px 8px;text-align:right';
      const inpQ=document.createElement('input');inpQ.type='number';inpQ.step='0.5';inpQ.min='0';
      inpQ.value=it.quantidade||'';inpQ.style.cssText='width:70px;padding:4px 6px;border:1.5px solid var(--rb);border-radius:8px;font-size:12px;text-align:right;font-family:Manrope,sans-serif';
      inpQ.addEventListener('input',e=>it.quantidade=e.target.value);
      tdQtd.appendChild(inpQ);tr.appendChild(tdQtd);

      const tdUn=document.createElement('td');tdUn.style.cssText='padding:6px 8px;font-size:12px;color:var(--ts);text-align:right';
      tdUn.textContent=it.unidade||'';tr.appendChild(tdUn);

      const tdSetor=document.createElement('td');tdSetor.style.cssText='padding:4px 8px';
      const selSet=document.createElement('select');
      selSet.style.cssText='width:100%;padding:4px 6px;border:1.5px solid var(--rb);border-radius:8px;font-size:11px;font-family:Manrope,sans-serif;background:#fff;color:var(--tx)';
      [{v:'',t:'— setor —'}].concat(SAIDA_SETORES.map(x=>({v:x,t:setorLabel(x)}))).forEach(o=>{const op=document.createElement('option');op.value=o.v;op.textContent=o.t;if((it.setor||'')===o.v)op.selected=true;selSet.appendChild(op);});
      selSet.addEventListener('change',e=>{it.setor=e.target.value;if(e.target.value)_lastSetor=e.target.value;});
      tdSetor.appendChild(selSet);tr.appendChild(tdSetor);

      const tdObs=document.createElement('td');tdObs.style.cssText='padding:4px 8px';
      const inpObs=document.createElement('input');inpObs.type='text';inpObs.placeholder='Obs...';
      inpObs.value=it.observacoes||'';inpObs.style.cssText='width:100%;padding:4px 6px;border:1.5px solid var(--rb);border-radius:8px;font-size:11px;font-family:Manrope,sans-serif';
      inpObs.addEventListener('input',e=>it.observacoes=e.target.value);
      tdObs.appendChild(inpObs);tr.appendChild(tdObs);

      const tdRm=document.createElement('td');tdRm.style.cssText='padding:4px 8px';
      const rmBtn=btn('btn bd bxs','✕',()=>{itensSaida.splice(idx,1);rebuildLista();});
      tdRm.appendChild(rmBtn);tr.appendChild(tdRm);

      tbody.appendChild(tr);
    });
    tbl.appendChild(tbody);
    listaWrap.appendChild(tbl);
  }

  // Seletor de item
  const selWrap=div('fg2 mt3');
  function _saidaNorm(s){return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');}
  const buscaItem=el('input','fi',null,{type:'text',placeholder:'🔍 Digite o insumo (ex: vinho, água)...'});
  const resultsWrap=div(null); resultsWrap.style.cssText='margin-top:8px;max-height:300px;overflow-y:auto';
  function renderResultados(q){
    resultsWrap.innerHTML='';
    q=_saidaNorm(q).trim();
    if(!q){ resultsWrap.appendChild(div('tss','Digite acima para buscar um insumo.')); return; }
    const toks=q.split(/\s+/).filter(Boolean);
    const scored=[];
    todosItens.forEach(it=>{ const nn=_saidaNorm(it.nome); if(!toks.every(tk=>nn.indexOf(tk)>=0))return; let sc=2; if(nn.indexOf(q)===0)sc=0; else if(nn.indexOf(' '+q)>=0)sc=1; scored.push({it,sc,nn}); });
    scored.sort((a,b)=> a.sc-b.sc || a.nn.localeCompare(b.nn));
    if(!scored.length){ resultsWrap.appendChild(div('tss','Nenhum insumo encontrado.')); return; }
    scored.slice(0,15).forEach(o=>{ const it=o.it;
      const ja=itensSaida.find(i=> it.id ? (i.estoque_item_id===it.id) : (i.estoque_item_id==null && _saidaNorm(i.nome_item)===_saidaNorm(it.nome)) );
      const row=document.createElement('button'); row.type='button';
      row.style.cssText='display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;gap:10px;padding:10px 13px;border:1.5px solid var(--rb);border-radius:10px;background:'+(ja?'#f1f1f1':'#fff')+';margin-bottom:6px;cursor:'+(ja?'default':'pointer')+';font-family:Manrope,sans-serif;font-size:13px';
      const cat=(typeof CONT_CATS!=='undefined'&&CONT_CATS[it.categoria])||it.categoria||'';
      row.innerHTML='<span style=\"font-weight:700\">'+it.nome+'</span><span style=\"color:var(--ts);font-size:11px;white-space:nowrap\">'+(ja?'✓ já na lista':((it.unidade||'')+(cat?' · '+cat:'')))+'</span>';
      if(!ja) row.addEventListener('click',()=>{ itensSaida.push({estoque_item_id:it.id,nome_item:it.nome,quantidade:'',unidade:it.unidade,observacoes:'',setor:_lastSetor}); rebuildLista(); buscaItem.value=''; renderResultados(''); buscaItem.focus(); });
      resultsWrap.appendChild(row);
    });
  }
  buscaItem.addEventListener('input',e=>renderResultados(e.target.value));
  selWrap.appendChild(fgrp('🔍 Buscar e adicionar insumo',buscaItem));
  selWrap.appendChild(resultsWrap);
  renderResultados('');
  const btnMais=btn('btn bo bsm','\u2795 Adicionar mais itens',()=>{ try{buscaItem.scrollIntoView({behavior:'smooth',block:'center'});}catch(e){} buscaItem.focus(); });

  const inpResp=finp('',f.responsavel,v=>f.responsavel=v);inpResp.placeholder='Seu nome...';
  const inpData=el('input','fi',null,{type:'date',value:f.data});
  inpData.addEventListener('change',e=>f.data=e.target.value);
  const selDestino=fsel('',['venda','evento','descarte','outro'],f.destino,v=>f.destino=v);
  const inpObs=finp('',f.observacoes,v=>f.observacoes=v);inpObs.placeholder='Motivo, observações...';

  mkModal('📤 Nova Saída de Estoque',[
    div('fg3',[
      fgrp('✍️ Responsável',inpResp),
      fgrp('Data',inpData),
      fgrp('Destino',selDestino),
    ]),
    fgrp('Observações',inpObs),
    el('hr','dv'),
    el('strong',null,'Itens retirados',{style:'font-size:13px'}),
    selWrap,
    listaWrap,
    div('mt3 no-print',btnMais),
  ],async()=>{
    if(!f.responsavel.trim()){alert('Informe o responsável.');return;}
    const itensValidos=itensSaida.filter(it=>parseFloat(it.quantidade)>0);
    if(!itensValidos.length){alert('Adicione pelo menos um item com quantidade.');return;}
    const[saida]=await db('lola_saidas','POST',{
      data_saida:f.data,
      responsavel:f.responsavel,
      destino:f.destino,
      observacoes:f.observacoes||null,
    });
    await Promise.all(itensValidos.map(it=>db('lola_saidas_itens','POST',{
      saida_id:saida.id,
      estoque_item_id:it.estoque_item_id,
      nome_item:it.nome_item,
      quantidade:parseFloat(it.quantidade),
      unidade:it.unidade||null,
      setor:it.setor||null,
      observacoes:it.observacoes||null,
    })));
    onSave&&onSave();
  },'mo mol');
  rebuildLista();
}

function modalFornecedor(item, onSave){
  const ed=!!item;
  const f={nome:item?.nome||'',contato:item?.contato||'',whatsapp:item?.whatsapp||item?.telefone||'',telefone:item?.telefone||'',email:item?.email||'',categorias:item?.categorias||[],observacoes:item?.observacoes||''};

  // Seleção múltipla de categorias
  const catWrap=div(null);catWrap.style.cssText='display:flex;flex-wrap:wrap;gap:6px;margin-top:4px';
  Object.entries(CONT_CATS).forEach(([k,v])=>{
    const pill=document.createElement('div');
    pill.style.cssText='padding:5px 12px;border-radius:50px;font-size:11px;font-weight:700;cursor:pointer;border:1.5px solid var(--rb);transition:all .15s';
    const isSelected=()=>f.categorias.includes(k);
    function updatePill(){
      pill.style.background=isSelected()?'var(--v)':'#fff';
      pill.style.color=isSelected()?'#fff':'var(--ts)';
    }
    pill.textContent=v;
    updatePill();
    pill.addEventListener('click',()=>{
      if(isSelected())f.categorias=f.categorias.filter(c=>c!==k);
      else f.categorias=[...f.categorias,k];
      updatePill();
    });
    catWrap.appendChild(pill);
  });

  mkModal((ed?'Editar':'Novo')+' fornecedor',[
    div('fg2',[
      fgrp('Nome *',finp('',f.nome,v=>f.nome=v)),
      fgrp('Contato (nome)',finp('',f.contato,v=>f.contato=v)),
    ]),
    div('fg2',[
      fgrp('📱 WhatsApp (só números, ex: 5551999990000)',finp('',f.whatsapp,v=>f.whatsapp=v.replace(/\D/g,''))),
      fgrp('Email',finp('',f.email,v=>f.email=v)),
    ]),
    fgrp('Categorias que fornece',catWrap),
    fgrp('Observações',finp('',f.observacoes,v=>f.observacoes=v)),
  ],async()=>{
    if(!f.nome.trim()){alert('Digite o nome do fornecedor.');return;}
    const p={nome:f.nome,contato:f.contato||null,whatsapp:f.whatsapp||null,telefone:f.whatsapp||f.telefone||null,email:f.email||null,categorias:f.categorias,observacoes:f.observacoes||null,ativo:true};
    if(ed)await db('lola_fornecedores','PATCH',p,'?id=eq.'+item.id);
    else await db('lola_fornecedores','POST',p);
    onSave&&onSave();
  });
}

async function renderContArea(){
  const area=$('#cont-area');
  if(!area)return;
  area.innerHTML='';
  area.appendChild(ld());
  try{
    const _insRows=await db('lola_insumos','GET',null,'?categoria=eq.'+encodeURIComponent(_contCat)+'&ativo=eq.true&order=ordem.asc.nullslast,nome.asc');
    const itens=(_insRows||[]).map(i=>({...i, unidade:(i.unidade_custo||i.unidade_compra||''), fornecedor:(i.fornecedor_padrao||'')}));
    const contagens=await db('lola_contagens','GET',null,'?order=data_contagem.desc&limit=5');
    area.innerHTML='';
    if(!itens.length){area.appendChild(em('📦','Nenhum item cadastrado para esta categoria'));return;}

    // Cards últimas contagens
    if(contagens.length){
      const hist=div('g3 mb3');

        const dataFmt=new Date(ct.data_contagem+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'});

    let ultimosItens={};

          const data=it.lola_contagens?.data_contagem;
          ultimosItens[it.insumo_id]={

      else if(qtd<=min*1.5){stDot='#C9A227';stLab='Atenção';stCol='#9A6B1E';}
      else{stDot='#2C7A4B';stLab='OK';stCol='#2C7A4B';}

      card.appendChild(top);

      meta.appendChild(contCell('Última qtd',uq));

      wrapIt.appendChild(card);
    });
    area.appendChild(wrapIt);
  }catch(e){area.innerHTML='<p style="color:red">'+e.message+'</p>';}
}

function pedFiltrados(){
  let f=_peds;
  if(_pedMes) f=f.filter(p=>p.data_pedido?.startsWith(_pedMes));
  if(_pedTab!=='todos') f=f.filter(p=>p.unidade===_pedTab||p.status===_pedTab||(_pedTab==='rascunho'&&p.status==='rascunho'));
  return f;
}

// Nova função registrarRecebimento
async function registrarRecebimento(p){
  const ov=div('ov');const mo=div('mo mol');
  mo.style.cssText+='display:flex;flex-direction:column;overflow:hidden';
  mo.addEventListener('click',e=>e.stopPropagation());
  ov.addEventListener('click',e=>{if(e.target===ov)ov.remove();});
  mo.appendChild(div('mh',[
    (mo.classList.add('recv-modal'),el('h3',null,'\u{1F4E6} Registrar Recebimento — Pedido #'+p.numero_pedido)),
    btn('xb','\u{2715}',()=>ov.remove())
  ]));
  const mb=div('mb');mb.appendChild(ld());
  mo.appendChild(mb);ov.appendChild(mo);document.body.appendChild(ov);
  try{
    const itens=await db('lola_pedidos_itens','GET',null,'?select=*&pedido_id=eq.'+p.id);
    mb.innerHTML='';
    // Campos do recebedor
    const _resp={v:''};
    const inpResp=finp('',_resp.v,v=>_resp.v=v);inpResp.placeholder='Seu nome (obrigatório)';
    mb.appendChild(div('fg2 mb3',[
      fgrp('Recebido por',inpResp),
      fgrp('Data',el('input','fi',null,{type:'date',value:new Date().toISOString().split('T')[0],id:'inp-data-receb'}))
    ]));
    // Instrução
    const dica=document.createElement('div');
    dica.style.cssText='background:var(--rt);border:1.5px solid var(--rb);border-radius:10px;padding:10px 14px;font-size:12px;font-weight:600;color:var(--v);margin-bottom:14px';
    dica.textContent='Confira cada item e informe a quantidade recebida. Deixe igual ao solicitado se foi recebido completo.';
    mb.appendChild(dica);
    // Tabela de itens com input de qtd recebida
    const recvMap={};
    itens.forEach(it=>{recvMap[it.id]={item:it,qtdRecebida:parseFloat(it.quantidade)||0};});
    const tblWrap=document.createElement('div');tblWrap.style.cssText='overflow-x:auto';
    const tbl=document.createElement('table');tbl.style.cssText='width:100%;border-collapse:collapse';
    const thead=document.createElement('thead');
    const htr=document.createElement('tr');
    ['Item','Un','Qtd\u00a0solicitada','Qtd\u00a0recebida','Difer.'].forEach((h,i)=>{
      const th=document.createElement('th');
      th.style.cssText='padding:7px 10px;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--v);background:var(--rt);text-align:'+(i>=2?'right':'left');
      th.textContent=h;htr.appendChild(th);
    });
    thead.appendChild(htr);tbl.appendChild(thead);
    const tbody=document.createElement('tbody');
    itens.forEach((it,idx)=>{
      const tr=document.createElement('tr');
      tr.style.cssText=(idx%2===0?'background:var(--rf)':'background:#fff')+';border-bottom:1px solid var(--rb)';
      function mkTd(content,align,style){
        const td=document.createElement('td');
        td.style.cssText='padding:8px 10px;font-size:12px;text-align:'+(align||'left')+(style?';'+style:'');
        if(typeof content==='string'||typeof content==='number')td.textContent=String(content);
        else td.appendChild(content);return td;
      }
      tr.appendChild(mkTd(it.nome_item,'left','font-weight:600'));
      tr.appendChild(mkTd(it.unidade||''));
      tr.appendChild(mkTd(N(it.quantidade,1),'right','font-weight:700'));
      // Input qtd recebida
      const tdRecv=document.createElement('td');tdRecv.style.cssText='padding:4px 10px;text-align:right';
      const inpR=document.createElement('input');inpR.type='number';inpR.min='0';inpR.step='0.5';
      inpR.value=N(it.quantidade,1);
      inpR.style.cssText='width:80px;padding:5px 7px;border:2px solid var(--rb);border-radius:8px;font-size:13px;text-align:right;font-family:Manrope,sans-serif;font-weight:700';
      inpR.setAttribute('inputmode','decimal');
      const difTd=document.createElement('td');difTd.style.cssText='padding:8px 10px;font-size:12px;text-align:right;font-weight:700';
      function updateDif(){
        const sol=parseFloat(it.quantidade)||0;const recv=parseFloat(inpR.value)||0;
        recvMap[it.id].qtdRecebida=recv;
        const dif=recv-sol;
        difTd.textContent=(dif>0?'+':'')+N(dif,1);
        difTd.style.color=dif===0?'var(--vd)':dif<0?'#dc2626':'#c47700';
        inpR.style.borderColor=dif===0?'var(--vd)':dif<0?'#dc2626':'#c47700';
      }
      inpR.addEventListener('input',updateDif);updateDif();
      tdRecv.appendChild(inpR);tr.appendChild(tdRecv);tr.appendChild(difTd);
      tbody.appendChild(tr);
    });
    tbl.appendChild(tbody);tblWrap.appendChild(tbl);mb.appendChild(tblWrap);
    // Footer
    mo.appendChild(div('mf',[
      btn('btn bg','Cancelar',()=>ov.remove()),
      btn('btn bp','\u{1F4BE} Salvar recebimento',async()=>{
        const respVal=_resp.v.trim();
        if(!respVal){inpResp.style.borderColor='#dc2626';inpResp.focus();alert('Informe quem recebeu.');return;}
        const dataReceb=document.getElementById('inp-data-receb')?.value||new Date().toISOString().split('T')[0];
        // Verificar divergências
        const divergencias=Object.values(recvMap).filter(v=>parseFloat(v.qtdRecebida)!==parseFloat(v.item.quantidade));
        const statusReceb=divergencias.length>0?'recebido_divergencia':'recebido_completo';
        // Salvar recebimento
        const[receb]=await db('lola_pedidos_recebimentos','POST',{
          pedido_id:p.id,recebido_por:respVal,data_recebimento:dataReceb,status:statusReceb
        });
        // Salvar itens do recebimento
        for(const v of Object.values(recvMap)){
          await db('lola_pedidos_recebimentos_itens','POST',{
            recebimento_id:receb.id,pedido_item_id:v.item.id,
            nome_item:v.item.nome_item,qtd_solicitada:parseFloat(v.item.quantidade)||0,
            qtd_recebida:parseFloat(v.qtdRecebida)||0,unidade:v.item.unidade
          });
        }
        // Calcular novo valor total pela qtd recebida
        const itensParaValor=await db('lola_pedidos_itens','GET',null,'?pedido_id=eq.'+p.id);
        let novoTotal=0;
        for(const v of Object.values(recvMap)){
          const itemPed=itensParaValor.find(x=>x.id===v.item.id);
          const preco=parseFloat(itemPed?.preco_unitario)||0;
          novoTotal+=parseFloat(v.qtdRecebida)*preco;
          // Atualizar quantidade do item pelo recebido
          await db('lola_pedidos_itens','PATCH',{quantidade:parseFloat(v.qtdRecebida)},'?id=eq.'+v.item.id);
        }
        // Atualizar status e valor total do pedido
        await db('lola_pedidos','PATCH',{status:statusReceb,valor_total:novoTotal},'?id=eq.'+p.id);
        p.status=statusReceb;
        _peds=await db('lola_pedidos','GET',null,'?select=*&order=created_at.desc');
        drawPed($('#ped-t'));
        ov.remove();
        // Se tiver divergência, abrir modal de relatório
        if(divergencias.length>0){
          setTimeout(()=>verDivergencias(p,divergencias,dataReceb,respVal),300);
        }else{
          alert('\u{2705} Recebimento registrado! Pedido recebido completo.');
        }
      })
    ]));
  }catch(e){mb.innerHTML='<p style="color:red;padding:20px">'+e.message+'</p>';}
}

async function verDivergencias(p,divs,data,resp){
  // Buscar divergências do banco se não foram passadas direto
  let divergencias=divs;
  if(!divergencias){
    const receb=await db('lola_pedidos_recebimentos','GET',null,'?pedido_id=eq.'+p.id+'&order=created_at.desc&limit=1');
    if(!receb.length){registrarRecebimento(p);return;}
    const itens=await db('lola_pedidos_recebimentos_itens','GET',null,'?recebimento_id=eq.'+receb[0].id+'&select=*');
    divergencias=itens.filter(it=>parseFloat(it.qtd_recebida)!==parseFloat(it.qtd_solicitada)).map(it=>({item:{nome_item:it.nome_item,quantidade:it.qtd_solicitada,unidade:it.unidade},qtdRecebida:it.qtd_recebida}));
    data=receb[0].data_recebimento;resp=receb[0].recebido_por;
  }
  if(!divergencias||!divergencias.length){alert('Nenhuma divergência registrada.');return;}
  const dataFmt=new Date((data||new Date().toISOString().split('T')[0])+'T12:00:00').toLocaleDateString('pt-BR');
  const ov=div('ov');const mo=div('mo mol');
  mo.addEventListener('click',e=>e.stopPropagation());
  ov.addEventListener('click',e=>{if(e.target===ov)ov.remove();});
  mo.appendChild(div('mh',[
    el('h3',null,'\u{26A0}\u{FE0F} Divergências — Pedido #'+p.numero_pedido),

  ]));

      const w2=window.open('','_blank');

/* ── Preço/unidade da pré-produção no pedido — REGRA ÚNICA ──────────────
   (movida pra cá em 19/07: morava dentro do modal de NOVO pedido e o modal de
   EDITAR também usa — fora do escopo, o Editar quebrava com "ppUnidade is not
   defined". Histórico da regra: Lasanha 38,53×89,90, Risotinho R$ 2.573.)
   • Vende por PORÇÃO só quando o rendimento é a granel (g/ml/kg/L) e existe
     porção declarada — senão a conta divide un por g e estoura.
   • Margem: custo/(m/100), a MESMA fórmula do editor da pré-produção. */
function _ppBulk(x){ return ['g','ml','kg','L'].includes(x.rendimento_un||'un'); }
function _ppPorcao(x){
  /* 20/07: modelo novo "Vendido em → Por unidade" grava porcao_un IGUAL ao rendimento,
     e dados antigos vêm com porcao_un null — a regra velha (exigia unidade DIFERENTE)
     escondia o preço por unidade desses PPs. Agora: rendimento a granel + porção > 0
     = vende por unidade. Porção em g/ml com rendimento em kg/L é convertida; porção
     MAIOR que o rendimento = dado inválido, cai pro preço a granel. */
  const rq=parseFloat(x.rendimento_qtd)||0, ru=x.rendimento_un||'un';
  let pq=parseFloat(x.porcao_qtd)||0; const pu=x.porcao_un||'';
  if(!_ppBulk(x)||pq<=0) return 0;
  if((ru==='kg'||ru==='L')&&(pu==='g'||pu==='ml'||(!pu&&rq>0&&pq>rq))) pq=pq/1000;
  if((ru==='g'||ru==='ml')&&(pu==='kg'||pu==='L')) pq=pq*1000;
  if(rq>0&&pq>rq) return 0;
  return pq;
}
function ppPreco(x){
  const pq=_ppPorcao(x);
  if(pq>0){
    const numP=(parseFloat(x.rendimento_qtd)||1)/pq;
    if(numP>0) return (parseFloat(x.custo_total||0)/numP)/((parseFloat(x.margem_venda)||70)/100);
  }
  /* 23/07: preço central AO VIVO a partir do custo atual (= custo/(margem/100)),
     igual ao que o editor grava. Antes lia valor_venda_central, que congelava e
     ficava defasado quando o custo mudava por cascata (ex.: Schnitzel 13,88 → 7,28).
     Só cai no campo gravado se por algum motivo não der pra calcular. */
  const cpu=parseFloat(x.custo_por_unidade)||0;
  const mg=(parseFloat(x.margem_venda)||70)/100;
  if(cpu>0&&mg>0) return cpu/mg;
  return parseFloat(x.valor_venda_central)||0;
}
function ppUnidade(x){
  const ru=x.rendimento_un||'un';
  if(_ppPorcao(x)>0){
    const pu=x.porcao_un||'';
    if(!pu||pu===ru) return 'un';            // modelo novo: vendido por unidade
    return (pu==='un')?'porção':pu;          // legado: porção com unidade própria
  }
  return ru==='g'?'kg':ru==='ml'?'L':ru;
}
function ppInfo(x){
  const pq=_ppPorcao(x);
  if(!pq) return '';
  const numP=(parseFloat(x.rendimento_qtd)||1)/pq;
  return '(porção de '+pq+' '+(x.rendimento_un||'')+' — '+numP.toFixed(1)+' porções)';
}

    } else {
      btns.appendChild(pab('ph-printer','Imprimir','',()=>imprimirPed(p)));
    }
    card.appendChild(btns);
    wrap.appendChild(card);
  });
  w.appendChild(wrap);
}
