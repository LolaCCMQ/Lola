const _envEsc=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function _envQtd(q){return N(q,3).replace(/,?0+$/,'')||'0';}
/* conversão de unidade — espelha a função central_conv_qtd do banco. null = não dá pra converter */
const _ENV_UN_SIN={l:'l',lt:'l',litro:'l',litros:'l',un:'un',und:'un',unid:'un',unidade:'un',pc:'un',pct:'un',pacote:'un','maco':'un','maço':'un',cx:'un',caixa:'un',bdj:'un',bandeja:'un'};
function _envUn(u){const s=String(u==null?'':u).trim().toLowerCase();return _ENV_UN_SIN[s]||s;}
function _envConv(q,unO,unD,pesoG){
  q=Number(q); if(!isFinite(q))return null;
  const a=_envUn(unO), b=_envUn(unD);
  if(!a||!b)return null;
  if(a===b)return q;
  if(a==='g'&&b==='kg')return q/1000;
  if(a==='kg'&&b==='g')return q*1000;
  if(a==='ml'&&b==='l')return q/1000;
  if(a==='l'&&b==='ml')return q*1000;
  if(a==='l'&&b==='kg')return q;
  if(a==='kg'&&b==='l')return q;
  if(a==='ml'&&b==='kg')return q/1000;
  if(a==='g'&&b==='l')return q/1000;
  if(a==='ml'&&b==='g')return q;
  if(a==='g'&&b==='ml')return q;
  const p=Number(pesoG);
  if(a==='un'&&isFinite(p)&&p>0){
    if(b==='kg')return q*p/1000;
    if(b==='g')return q*p;
    if(b==='l')return q*p/1000;
    if(b==='ml')return q*p;
  }
  if(b==='un'&&isFinite(p)&&p>0){
    if(a==='kg')return q*1000/p;
    if(a==='g')return q/p;
  }
  return null;
}
/* {ok:false} = falta o peso pra converter — não mostra custo nem deixa lançar no Financeiro */
function _envCusto(e,ci){
  if(e.custo_total!=null)return{ok:true,v:Number(e.custo_total)};
  if(!ci||e.quantidade==null)return{ok:true,v:0};
  const cu=Number(ci.custo_por_unidade||0), unC=ci.unidade_custo;
  if(!unC||!cu)return{ok:true,v:0};
  const q=_envConv(e.quantidade,(e.unidade&&String(e.unidade).trim())||unC,unC,ci.peso_un_g);
  if(q==null)return{ok:false,v:0};
  return{ok:true,v:q*cu,qtd:q};
}
async function _envPedirPeso(e,ci){
  const unE=(e.unidade&&String(e.unidade).trim())||'un';
  const unC=(ci&&ci.unidade_custo)||'kg';
  const nome=(ci&&ci.nome)||e.descricao;
  const atual=(ci&&ci.peso_un_g!=null)?String(ci.peso_un_g):'';

  if(v==null)return;

}

async function receberEnvio(e,custoInfo){
  /* 19/07: envio entre unidades que NÃO vem da Central só muda o status — não tem
     baixa nem Financeiro (só a Central tem estoque por movimento). O fluxo da
     Central continua idêntico (RPC envio_ccmq_receber). */
  if(!_ehEnvioDaCentral(e)){
    if(!confirm('Confirmar recebimento de "'+e.descricao+'" (enviado por '+(_ENV_DEST_LBL[e.origem]||e.origem)+')?'))return;
    try{ await db('lola_central_envio_ccmq','PATCH',{atendido:true,recebido_por:ME||null,recebido_em:new Date().toISOString()},'?id=eq.'+e.id);
      updEnviosBadge(); renderPage();
    }catch(err){ alert('Erro ao receber: '+err.message); }
    return;
  }
  const _cst=_envCusto(e,custoInfo);
  if(!_cst.ok){ return _envPedirPeso(e,custoInfo); }
  const custoTot=_cst.v;
  if(!confirm('Confirmar recebimento de "'+e.descricao+'"'+(custoTot>0?' (custo '+R(custoTot)+')':'')+'?\n\nIsso dá baixa no estoque da Central e lança a transferência no Financeiro das duas contas.'))return;
  try{
    await db('rpc/envio_ccmq_receber','POST',{p_envio_id:e.id,p_quem:ME||null});
    updEnviosBadge();
    renderPage();
  }catch(err){ if(String((err&&err.message)||'').indexOf('CONV_FALTA_PESO')>=0){ _envPedirPeso(e,custoInfo); return; } alert('Erro ao receber: '+err.message);}
}

/* ══════════════════════════════════
   ENTRADA DE NOTAS — estoque CCMQ a partir das notas do Financeiro
   (item da nota -> insumo existente ou novo; guarda qtd+preço; fator; atualiza preço)
══════════════════════════════════ */
const EN_CATS=["Insumos Alimentos","Hortifruti","Carnes e Pescados","Não Alcoólicos","Bebidas Alcoólicas","Vinhos","Cervejas","Cafés","Pães","Lojinha","Material de Limpeza","Descartáveis/Embalagens","Material de Expediente e Gráfico","Utensílios e Equipamentos","Gás"];
const _jnorm=s=>(s==null?'':String(s)).trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ');
/* ── SUGESTÃO de insumo pra descrição da nota ─────────────────────────────
   A nota vem escrita do jeito do fornecedor ("BROWNIE", "BATATA BRANCA BICA _ KG")
   e ninguém sabe qual insumo é. Isto propõe; a pessoa confirma; o de-para fica
   gravado pra sempre. Mesmo padrão do peso_un_g: propõe, confirma, lembra.
   NÃO chuta sozinho — só pré-preenche marcado como sugestão.               */
const _EN_STOP={'de':1,'da':1,'do':1,'com':1,'sem':1,'kg':1,'un':1,'cx':1,'pct':1,'gr':1,'ml':1,'lt':1,'und':1,'para':1,'tipo':1};
function _enToks(s){
  return _jnorm(s).split(/[^a-z0-9]+/).filter(t=>t.length>=3 && !_EN_STOP[t] && !/^\d+$/.test(t));
}
function _enSugere(desc){
  const d=' '+_jnorm(desc)+' ';
  if(!EN||!EN.insumos||d.trim().length<3) return null;
  let best=null,bestN=0,bestCov=0;
  EN.insumos.forEach(function(i){
    const nt=_enToks(i.nome);
    if(!nt.length) return;
    let hit=0;
    nt.forEach(function(t){ if(d.indexOf(' '+t)>=0 || d.indexOf(t+' ')>=0 || d.indexOf(t)>=0) hit++; });
    if(!hit) return;
    const cov=hit/nt.length;
    /* mais tokens casados ganha (mais específico): "Ovo de codorna" > "Ovo"
       para a descrição "OVO DE CODORNA". Empate: maior cobertura do nome.   */
    if(hit>bestN || (hit===bestN && cov>bestCov)){ bestN=hit; bestCov=cov; best=i; }
  });
  if(!best) return null;
  return {ins:best, n:bestN, cov:bestCov, forte:(bestN>=2 || bestCov>=0.99)};
}
/* 05/08 (Bianca): "preciso escolher entre as opções parecidas" — devolve os N insumos
   mais parecidos com a descrição da nota (mesmo score do _enSugere), pra virar chips. */
function _enSugereTop(desc, k){
  const d=' '+_jnorm(desc)+' ';
  if(!EN||!EN.insumos||d.trim().length<3) return [];
  const scored=[];
  EN.insumos.forEach(function(i){
    const nt=_enToks(i.nome); if(!nt.length) return;
    let hit=0; nt.forEach(function(t){ if(d.indexOf(t)>=0) hit++; });
    if(!hit) return;
    scored.push({ins:i, n:hit, cov:hit/nt.length});
  });
  scored.sort(function(a,b){ return b.n-a.n || b.cov-a.cov || a.ins.nome.localeCompare(b.ins.nome,'pt'); });
  return scored.slice(0, k||6);
}

function _cmvLastDay(m){const p=m.split('-').map(Number);return new Date(p[0],p[1],0).getDate();}

/* ══ Gerar rascunho de pedido pra Central a partir da Sugestão de Pedido (30/08) ══
   Pega os insumos com sugestao>0 (respeitando o filtro de categoria da tela, se
   algum estiver selecionado) e cria um pedido em lola_pedidos com status='rascunho',
   igual ao que "Novo Pedido" cria — o chefe da cozinha revisa e edita normalmente
   pela tela de Pedidos antes de encaminhar pra Central. ══ */
function _pedGerarRascunho(rows){
  const DEST_COR={ccmq:'#AA2B2B',mac:'#166534',eventos:'#c47700'};
  const DEST_LBL={ccmq:'CCMQ',mac:'MAC',eventos:'Evento'};
  const DEST_KEYS=['ccmq','mac','eventos'];
  let destino='ccmq', resp='', obs='';

  // Só os itens fornecidos pela Central podem virar rascunho em "Pedidos à Central" —
  // a Sugestão de Pedido cobre TODO o cardápio de insumos (mercado, fornecedores diretos,
  // etc.), mas esse botão é especificamente pro pedido que vai pra Central.
  const somenteFalta=_ped.somenteFalta!==false;
  const itens=rows.filter(function(r){
    if(r.fornecedor_padrao!=='Central') return false;
    return somenteFalta ? (+r.sugestao||0)>0 : true;
  });
  if(!itens.length){ alert('Nenhum item fornecido pela Central com sugestão de pedido no momento.'); return; }

  const ov=div('ov');
  const mo=div('mo');
  mo.addEventListener('click',e=>e.stopPropagation());
  ov.addEventListener('click',e=>{if(e.target===ov)ov.remove();});
  mo.appendChild(div('mh',[el('h3',null,'📝 Gerar rascunho pra Central'),btn('xb','✕',()=>ov.remove())]));
  const mb=div('mb');mo.appendChild(mb);

  const note=div(null,null,{style:'background:var(--rf);border:1px solid var(--rb);border-radius:12px;padding:10px 13px;margin-bottom:12px;font-size:12.5px;color:var(--ts);line-height:1.5'});
  note.innerHTML=somenteFalta
    ? ('Cria um rascunho em <b>Pedidos → Pedidos à Central</b> com '+itens.length+' ite'+(itens.length>1?'ns':'m')+' fornecido'+(itens.length>1?'s':'')+' pela Central (o que falta pedir). O chefe da cozinha revisa e ajusta as quantidades por lá antes de encaminhar.')
    : ('Cria um rascunho com <b>todos os '+itens.length+' itens</b> fornecidos pela Central, pra conferência — os que não precisam ser pedidos agora entram com quantidade <b>0</b>. Revise e ajuste antes de enviar; ao enviar, os itens com quantidade 0 são removidos automaticamente.');
  mb.appendChild(note);

  const destTabsWrap=div('tabs mb3');
  function buildDestTabs(){
    destTabsWrap.innerHTML='';
    DEST_KEYS.forEach(function(k){
      const p=span('tp'+(destino===k?' active':''),DEST_LBL[k]);
      p.style.cssText+=(';font-weight:800;border:2px solid '+DEST_COR[k]);
      if(destino===k) p.style.background=DEST_COR[k]+';color:#fff';
      p.addEventListener('click',function(){destino=k;buildDestTabs();});
      destTabsWrap.appendChild(p);
    });
  }
  buildDestTabs();
  mb.appendChild(fgrp('Destino',destTabsWrap));

  const inpResp=el('input','fi',null,{type:'text',placeholder:'Seu nome (obrigatório)'});
  inpResp.addEventListener('input',function(e){resp=e.target.value;inpResp.style.borderColor=e.target.value.trim()?'var(--vd)':'var(--rb)';});
  const inpObs=el('input','fi',null,{type:'text',placeholder:'Observações...'});
  inpObs.addEventListener('input',function(e){obs=e.target.value;});
  mb.appendChild(div('fg2 mt2',[fgrp('✍️ Responsável',inpResp),fgrp('Observações',inpObs)]));

  const total=itens.reduce(function(t,r){return t+((+r.sugestao||0)*(parseFloat(r.custo_por_unidade)||0));},0);
  const resumo=div(null,null,{style:'margin-top:12px;font-size:12.5px;color:var(--ts)'});
  resumo.innerHTML=itens.length+' ite'+(itens.length>1?'ns':'m')+' · valor estimado <b style="color:var(--tp)">'+R(total)+'</b>';
  mb.appendChild(resumo);

  const mf=div('mf');
  mf.appendChild(btn('btn bg','Cancelar',()=>ov.remove()));
  const saveBtn=btn('btn bp','Gerar rascunho',async function(){
    if(!resp.trim()){inpResp.style.borderColor='#dc2626';inpResp.focus();return;}
    saveBtn.textContent='Gerando...';saveBtn.disabled=true;
    try{
      const[ped]=await db('lola_pedidos','POST',{
        unidade:destino,status:'rascunho',data_pedido:TD(),
        valor_total:total,observacoes:obs||null,responsavel:resp,
      });
      for(const r of itens){
        await db('lola_pedidos_itens','POST',{
          pedido_id:ped.id,nome_item:r.nome,quantidade:+r.sugestao,
          unidade:r.unidade_compra,preco_unitario:parseFloat(r.custo_por_unidade)||0,
          estoque_atual:(r.ultima_contagem_qtd!=null&&r.ultima_contagem_qtd!=='')?+r.ultima_contagem_qtd:null,
          estoque_ideal:(r.qtd_minima!=null&&r.qtd_minima!=='')?+r.qtd_minima:null,
          embalagem_nome:r.embalagem_nome||null,
          embalagem_retornavel:r.embalagem_retornavel==null?null:!!r.embalagem_retornavel,
        });
      }
      ov.remove();
      if(confirm('Rascunho #'+(ped.numero_pedido||ped.id)+' criado com '+itens.length+' itens. Abrir Pedidos à Central agora?')){ nav('pedidos'); }
    }catch(e){alert('Erro: '+e.message);saveBtn.textContent='Gerar rascunho';saveBtn.disabled=false;}
  });
  mf.appendChild(saveBtn);
  mo.appendChild(mf);
  ov.appendChild(mo);
  document.body.appendChild(ov);
}

function _cmvBuildSub(){

    inp.onchange=()=>{ _cmv.sub=inp.value; _cmvLoad(); }; w.appendChild(inp);

async function _cmvLoad(){
  const res=document.getElementById('cmvRes'); if(!res)return;
  res.innerHTML='<div class="spin"></div>';
  try{ await _cmvMetaLoad(); }catch(e){ _cmv.meta={cats:[],fat:null,fatFonte:''}; }
  if(_cmv.gran==='semanas'){ return _cmvLoadSemanas(res); }
  const r=_cmvRange();
  let rows=[];
  try{ rows=await db('rpc/compras_cmv','POST',{p_unit:'ccmq',p_desde:r[0],p_ate:r[1]}); }
  catch(e){ res.innerHTML='<div class="note">Erro ao carregar: '+_enEsc(e.message)+'</div>'; return; }

/* ══ CMC — orçamento por categoria a partir da meta de faturamento (13/08 Bianca) ══
   Incorpora a planilha "Controle CMC Semanal": cada categoria (plano de contas do
   grupo CMV) tem um % da meta de faturamento -> orçamento do mês. Mostra gasto x meta
   x restante. Metas em lola_cmc_categoria (% por plano) e lola_cmc_config (faturamento
   por mês; se vazio, usa a meta de vendas de lola_vendas_metas). ══ */
async function _cmvMetaLoad(){
  const mes=_cmv.mes, y=+mes.split('-')[0], mo=+mes.split('-')[1];
  let cats=[]; try{ cats=await db('lola_cmc_categoria','GET',null,'?select=plano_id,categoria,pct,ordem&ativo=eq.true&order=ordem'); }catch(e){ cats=[]; }
  let fat=null, fonte='';
  try{ const cfg=await db('lola_cmc_config','GET',null,'?select=faturamento_meta&ano=eq.'+y+'&mes=eq.'+mo);
       if(cfg&&cfg.length&&cfg[0].faturamento_meta!=null){ fat=+cfg[0].faturamento_meta; fonte='ajustado'; } }catch(e){}
  if(fat==null){ try{ const vm=await db('lola_vendas_metas','GET',null,'?select=meta_mensal&mes=eq.'+mes+'&unidade=eq.CCMQ');
       if(vm&&vm.length&&vm[0].meta_mensal!=null){ fat=+vm[0].meta_mensal; fonte='meta de vendas'; } }catch(e){} }
  _cmv.meta={cats:cats||[], fat:fat, fatFonte:fonte, y:y, mo:mo};
}
function _cmvBar(frac){
  const p=Math.max(0,frac||0), col=p>1.001?'#B5302E':(p>0.85?'#9A6B1E':'#2C7A4B'), w=Math.min(100,p*100);
  return '<div style="height:7px;background:#EFE6DC;border-radius:5px;overflow:hidden;margin-top:7px"><div style="height:100%;width:'+w.toFixed(1)+'%;background:'+col+';border-radius:5px"></div></div>';
}
function _cmvPct(frac,dec){ return (100*(frac||0)).toFixed(dec==null?0:dec).replace('.',',')+'%'; }

/* monta a tabela expansível de insumos de um grupo (reaproveitada nas 2 seções) */
function _cmvGrpTable(g,res,desde,ate,semPlano){
  const tbl=el('table',null,null,{style:'width:100%;border-collapse:collapse;font-size:12.5px'});
  tbl.innerHTML='<thead><tr style="text-align:left;color:var(--ts);opacity:.7;font-size:10px;text-transform:uppercase;letter-spacing:.03em"><th style="padding:7px 15px">Insumo</th><th style="padding:7px 8px;text-align:right">Qtd</th><th style="padding:7px 8px;text-align:right">Compras</th><th style="padding:7px 8px;text-align:right">Preço médio</th><th style="padding:7px 15px;text-align:right">Total</th></tr></thead>';
  const tb=el('tbody');
  g.rows.forEach(function(x,i){
    const nome=x.mapeado?x.insumo_nome:(x.item_desc||'—');
    const qtd=(+x.qtd||0), val=(+x.valor||0), pm=qtd?val/qtd:0;
    const tr=el('tr',null,null,{style:'border-top:1px solid var(--fio,#eee);cursor:pointer'});
    tr.innerHTML='<td style="padding:8px 15px"><span style="font-weight:600;color:var(--tp)">'+_enEsc(nome)+'</span>'+((x.mapeado&&x.unidade)?' <span style="font-size:10px;color:#5A463E;background:#EFEAE3;border-radius:5px;padding:1px 6px;margin-left:3px" title="Unidade de medida que usamos neste insumo">'+_enEsc(x.unidade)+'</span>':'')+(x.mapeado?'':' <span style="font-size:10px;color:#9A6B1E;background:#FBF0DD;border-radius:6px;padding:1px 5px">só na nota</span>')+(x.insumo_categoria?' <span style="font-size:10px;color:var(--ts);opacity:.6">· '+_enEsc(x.insumo_categoria)+'</span>':'')+' <button class="cmv-cat" data-ci="'+i+'" title="Classificar plano de contas" style="border:0;background:none;cursor:pointer;padding:0 2px;vertical-align:middle">'+(semPlano?'<span style="font-size:10px;background:#9A6B1E;color:#fff;border-radius:6px;padding:2px 8px;font-weight:700;white-space:nowrap">+ classificar</span>':'<i class="ph-duotone ph-folder-simple" style="color:var(--ts);opacity:.5;font-size:13px" title="Reclassificar"></i>')+'</button>'+'</td>'+
      '<td style="padding:8px 8px;text-align:right;white-space:nowrap">'+N(qtd,qtd%1===0?0:2)+' '+_enEsc(x.unidade||'')+'</td>'+
      '<td style="padding:8px 8px;text-align:right">'+x.n_compras+'</td>'+
      '<td style="padding:8px 8px;text-align:right;white-space:nowrap;color:var(--ts)">'+R(pm)+'</td>'+
      '<td style="padding:8px 15px;text-align:right;white-space:nowrap;font-weight:700;color:var(--v)">'+R(val)+'</td>';
    tr.onclick=()=>_cmvDetalhe(tr,x,desde,ate);
    tb.appendChild(tr);
  });
  tbl.appendChild(tb);
  tbl.querySelectorAll('.cmv-cat').forEach(function(b){ b.addEventListener('click',function(ev){ ev.stopPropagation(); _cmvClassify(g.rows[+b.getAttribute('data-ci')]); }); });
  return tbl;
}

function _cmvRender(res,rows,desde,ate){
  res.innerHTML='';
  rows=rows||[];
  const meta=_cmv.meta||{cats:[],fat:null,fatFonte:''};
  const cmcCats=meta.cats||[];
  const cmcSet={}; cmcCats.forEach(function(c){ cmcSet[c.plano_id]=c; });

  const byPlano={}; const semPlano={label:'Sem plano de contas',plano_id:null,rows:[],total:0};
  rows.forEach(function(x){
    if(x.plano_id){ const k=x.plano_id; if(!byPlano[k])byPlano[k]={label:x.plano_label||k,plano_id:k,rows:[],total:0}; byPlano[k].rows.push(x); byPlano[k].total+=(+x.valor||0); }
    else { semPlano.rows.push(x); semPlano.total+=(+x.valor||0); }
  });
  const totalGeral=rows.reduce(function(s,x){return s+(+x.valor||0);},0);
  const nContas=Object.keys(byPlano).length+(semPlano.rows.length?1:0);

  const ld=_cmvLastDay(_cmv.mes);
  const diasPer=Math.round((new Date(ate+'T12:00:00')-new Date(desde+'T12:00:00'))/86400000)+1;
  const fator=Math.max(0,Math.min(1,diasPer/ld));
  const fat=(meta.fat!=null)?meta.fat*fator:null;
  const pctTot=cmcCats.reduce(function(s,c){return s+(+c.pct||0);},0);
  let gastoCMC=0; cmcCats.forEach(function(c){ gastoCMC+=((byPlano[c.plano_id]&&byPlano[c.plano_id].total)||0); });
  const orcadoCMC=(fat!=null)?fat*pctTot:null;

  const head=div(null,null,{style:'background:#fff;border:1px solid var(--rb);border-radius:14px;padding:14px 16px;margin-bottom:12px'});
  head.innerHTML='<div style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ts);opacity:.7;font-weight:700">Total comprado no período</div><div style="font-family:Georgia,serif;font-size:26px;color:var(--v);font-weight:700">'+R(totalGeral)+'</div><div style="font-size:11.5px;color:var(--ts);opacity:.75">'+DBR(desde)+(desde!==ate?' a '+DBR(ate):'')+' · '+rows.length+' itens · '+nContas+' contas</div>';
  res.appendChild(head);

  const cmcHead=div(null,null,{style:'background:#fff;border:1px solid var(--rb);border-radius:14px;padding:14px 16px;margin-bottom:14px'});
  if(!_SOCIO){
    cmcHead.innerHTML='<div style="font-weight:800;color:var(--v);font-size:15px">Controle de CMC · '+_cmvMesLabel(_cmv.mes)+'</div><div style="font-size:11.5px;color:var(--ts);margin-top:6px">Gasto CMC: <b>'+R(gastoCMC)+'</b></div>';
  } else if(fat==null){
    cmcHead.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div style="font-weight:800;color:var(--v);font-size:15px">Controle de CMC</div><button id="cmcGear" class="btn bo bsm" style="font-weight:700"><i class="ph-duotone ph-gear"></i> Metas</button></div><div style="font-size:12.5px;color:#9A6B1E;background:#FBF0DD;border-radius:9px;padding:9px 11px;margin-top:10px">Defina a <b>meta de faturamento</b> deste mês pra ver quanto pode gastar por categoria. Toque em <b>Metas</b>.</div>';
  } else {
    const restCMC=orcadoCMC-gastoCMC;
    const cmcPctReal=fat>0?gastoCMC/fat:0;
    cmcHead.innerHTML=''
      +'<div style="display:flex;justify-content:space-between;align-items:center;gap:10px">'
      +'<div style="font-weight:800;color:var(--v);font-size:15px">Controle de CMC · '+_cmvMesLabel(_cmv.mes)+'</div>'
      +'<button id="cmcGear" class="btn bo bsm" style="font-weight:700"><i class="ph-duotone ph-gear"></i> Metas</button></div>'
      +'<div style="font-size:11.5px;color:var(--ts);margin-top:6px">Faturamento meta: <b>'+R(meta.fat)+'</b> <span style="opacity:.6">('+_enEsc(meta.fatFonte||'')+(fator<1?' · período '+_cmvPct(fator)+' do mês':'')+')</span></div>'
      +'<div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:9px">'
        +'<div><div style="font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--ts);opacity:.7;font-weight:700">Orçado ('+_cmvPct(pctTot)+')</div><div style="font-family:Georgia,serif;font-size:17px;font-weight:700;color:var(--tp)">'+R(orcadoCMC)+'</div></div>'
        +'<div><div style="font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--ts);opacity:.7;font-weight:700">Gasto CMC</div><div style="font-family:Georgia,serif;font-size:17px;font-weight:700;color:var(--v)">'+R(gastoCMC)+'</div></div>'
        +'<div><div style="font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--ts);opacity:.7;font-weight:700">Restante</div><div style="font-family:Georgia,serif;font-size:17px;font-weight:700;color:'+(restCMC<0?'#B5302E':'#2C7A4B')+'">'+R(restCMC)+'</div></div>'
      +'</div>'
      +'<div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:11px;font-size:11.5px;color:var(--ts)"><span>CMC realizado <b style="color:'+(cmcPctReal>pctTot?'#B5302E':'var(--tp)')+'">'+_cmvPct(cmcPctReal,1)+'</b> <span style="opacity:.6">sobre a meta de faturamento</span></span><span style="opacity:.75">meta '+_cmvPct(pctTot)+'</span></div>'
      +_cmvBar(pctTot>0?cmcPctReal/pctTot:0);
  }
  res.appendChild(cmcHead);
  const gear=cmcHead.querySelector('#cmcGear'); if(gear) gear.onclick=_cmvEditMetas;

  if(cmcCats.length){
    const secLbl=div(null,null,{style:'font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ts);opacity:.7;font-weight:700;margin:2px 2px 8px'}); secLbl.textContent='Categorias do CMC'; res.appendChild(secLbl);
    cmcCats.forEach(function(c){
      const g=byPlano[c.plano_id];
      const gasto=g?g.total:0;
      const metaRs=(_SOCIO&&fat!=null)?fat*(+c.pct||0):null;
      const rest=(metaRs!=null)?metaRs-gasto:null;
      const uso=(metaRs&&metaRs>0)?gasto/metaRs:0;
      const key='cmc:'+c.plano_id;
      const open=g?(_cmv.open[key]!==false):false;
      const card=div(null,null,{style:'background:#fff;border:1px solid var(--rb);border-radius:14px;margin-bottom:12px;overflow:hidden'});
      const hd=div(null,null,{style:'padding:12px 15px;background:#FBF7F1'+(g?';cursor:pointer':'')});
      hd.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;gap:10px">'
        +'<span style="display:flex;align-items:center;gap:9px;flex-wrap:wrap">'+(g?'<i class="ph-duotone '+(open?'ph-caret-down':'ph-caret-right')+'" style="color:var(--v)"></i>':'<i class="ph-duotone ph-circle-dashed" style="color:var(--ts);opacity:.45;font-size:14px"></i>')+'<b style="font-size:14px;color:var(--tp)">'+_enEsc(c.categoria)+'</b>'+(g?'<span style="font-size:11px;color:var(--ts);opacity:.7">'+g.rows.length+' insumos</span>':'<span style="font-size:11px;color:var(--ts);opacity:.55">sem compras</span>')+'</span>'
        +'<b style="font-family:Georgia,serif;font-size:16px;color:var(--v)">'+R(gasto)+'</b></div>'
        +(metaRs!=null?('<div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:7px;font-size:11.5px;color:var(--ts)"><span>meta '+R(metaRs)+' <span style="opacity:.55">('+_cmvPct(c.pct)+')</span></span><span style="font-weight:700;color:'+(rest<0?'#B5302E':'#2C7A4B')+'">'+(rest<0?'estourou '+R(-rest):'resta '+R(rest))+'</span></div>'+_cmvBar(uso)):'');
      if(g){ hd.onclick=function(){ _cmv.open[key]=(open?false:true); _cmvRender(res,rows,desde,ate); }; }
      card.appendChild(hd);
      if(g&&open){ card.appendChild(_cmvGrpTable(g,res,desde,ate,false)); }
      res.appendChild(card);
    });
  }

  const outros=[];
  Object.keys(byPlano).forEach(function(k){ if(!cmcSet[k]) outros.push(byPlano[k]); });
  if(semPlano.rows.length) outros.push(semPlano);
  outros.sort(function(a,b){return b.total-a.total;});
  if(outros.length){
    const secLbl=div(null,null,{style:'font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ts);opacity:.7;font-weight:700;margin:16px 2px 8px'}); secLbl.textContent='Outros gastos (fora do CMC)'; res.appendChild(secLbl);
    outros.forEach(function(g){
      const isSem=(g.plano_id===null);
      const key='out:'+(g.plano_id||'sem');
      const open=_cmv.open[key]===true;
      const card=div(null,null,{style:'background:#fff;border:1px solid var(--rb);border-radius:14px;margin-bottom:12px;overflow:hidden'+(isSem?';border-color:#F1DFB8':'')});
      const hd=div(null,null,{style:'display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 15px;cursor:pointer;background:'+(isSem?'#FBF0DD':'#FBF7F1')});
      const pct=totalGeral?Math.round(g.total/totalGeral*100):0;
      hd.innerHTML='<span style="display:flex;align-items:center;gap:9px;flex-wrap:wrap"><i class="ph-duotone '+(open?'ph-caret-down':'ph-caret-right')+'" style="color:var(--v)"></i><b style="font-size:14px;color:'+(isSem?'#9A6B1E':'var(--tp)')+'">'+_enEsc(g.label)+'</b><span style="font-size:11px;color:var(--ts);opacity:.7">'+g.rows.length+' insumos · '+pct+'%</span></span><b style="font-family:Georgia,serif;font-size:16px;color:'+(isSem?'#9A6B1E':'var(--v)')+'">'+R(g.total)+'</b>';
      hd.onclick=function(){ _cmv.open[key]=!open; _cmvRender(res,rows,desde,ate); };
      card.appendChild(hd);
      if(open){ card.appendChild(_cmvGrpTable(g,res,desde,ate,isSem)); }
      res.appendChild(card);
    });
  }
}

/* Editor das metas de CMC: faturamento do mês (lola_cmc_config) + % por categoria
   (lola_cmc_categoria). O % é global (vale pros próximos meses); o faturamento é por mês. */
function _cmvEditMetas(){
  if(!_SOCIO){ return; }                            // defesa extra: só sócia edita metas de faturamento.
  const meta=_cmv.meta||{cats:[],fat:null}; const cats=(meta.cats||[]).slice();
  const ov=div(null,null,{style:'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:99999;display:flex;align-items:center;justify-content:center;padding:16px'});
  const card=div(null,null,{style:'background:#fff;border-radius:16px;max-width:480px;width:100%;max-height:88vh;display:flex;flex-direction:column;padding:18px;box-shadow:0 22px 55px -12px rgba(0,0,0,.45)'});
  const rowsHtml=cats.map(function(c){ return '<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--fio,#eee)"><span style="flex:1;font-size:13px;color:var(--tp)">'+_enEsc(c.categoria)+'</span><input class="cmcPct" data-id="'+_enEsc(c.plano_id)+'" type="number" step="0.1" min="0" value="'+(100*(+c.pct||0)).toFixed(2).replace(/\.?0+$/,'')+'" style="width:76px;text-align:right;border:1px solid var(--rb);border-radius:8px;padding:7px 9px;font-size:14px;font-weight:700"><span style="font-size:12px;color:var(--ts)">%</span></div>'; }).join('');
  card.innerHTML=''
    +'<div style="font-family:Georgia,serif;color:var(--v);font-size:19px">Metas de CMC · '+_cmvMesLabel(_cmv.mes)+'</div>'
    +'<div style="font-size:12px;color:var(--ts);margin:2px 0 12px">O orçamento de cada categoria é esse % aplicado sobre a meta de faturamento do mês.</div>'
    +'<label style="font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ts);font-weight:700">Faturamento meta do mês</label>'
    +'<div style="display:flex;align-items:center;gap:8px;margin:5px 0 4px"><span style="font-weight:700">R$</span><input id="cmcFat" type="number" step="1000" min="0" value="'+(meta.fat!=null?meta.fat:'')+'" placeholder="ex.: 500000" style="flex:1;border:1px solid var(--rb);border-radius:9px;padding:10px 12px;font-size:16px;font-weight:700"></div>'
    +'<div style="font-size:11px;color:var(--ts);opacity:.7;margin-bottom:14px">Deixe em branco pra usar a meta de vendas do mês automaticamente.</div>'
    +'<div style="display:flex;justify-content:space-between;align-items:baseline"><label style="font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ts);font-weight:700">% por categoria</label><span id="cmcSoma" style="font-size:12px;font-weight:700"></span></div>'
    +'<div style="overflow:auto;flex:1;min-height:80px;margin-top:2px">'+rowsHtml+'</div>'
    +'<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button id="cmcCancel" class="btn bo bsm">Cancelar</button><button id="cmcSave" class="btn bp bsm" style="font-weight:700">Salvar</button></div>';
  ov.appendChild(card); document.body.appendChild(ov);
  ov.addEventListener('click',function(e){ if(e.target===ov) ov.remove(); });
  function soma(){ let t=0; card.querySelectorAll('.cmcPct').forEach(function(i){ t+=parseFloat(i.value)||0; }); const s=card.querySelector('#cmcSoma'); s.textContent='soma '+t.toFixed(1).replace('.',',')+'%'; s.style.color=(Math.abs(t-30)<0.05)?'#2C7A4B':'#9A6B1E'; }
  card.querySelectorAll('.cmcPct').forEach(function(i){ i.addEventListener('input',soma); }); soma();
  card.querySelector('#cmcCancel').onclick=function(){ ov.remove(); };
  card.querySelector('#cmcSave').onclick=async function(){
    const bt=card.querySelector('#cmcSave'); bt.disabled=true; bt.textContent='Salvando…';
    const s=(typeof _sessaoDoPortal==='function'?_sessaoDoPortal():null); const quem=(s&&s.nome)||null;
    const y=+_cmv.mes.split('-')[0], mo=+_cmv.mes.split('-')[1];
    try{
      const fv=(card.querySelector('#cmcFat').value||'').trim();
      const body={faturamento_meta:(fv===''?null:(+fv)),atualizado_por:quem,atualizado_em:new Date().toISOString()};
      const upd=await db('lola_cmc_config','PATCH',body,'?ano=eq.'+y+'&mes=eq.'+mo);
      if(!upd||!upd.length){ await db('lola_cmc_config','POST',Object.assign({ano:y,mes:mo},body)); }
      const proms=[];
      card.querySelectorAll('.cmcPct').forEach(function(i){ const id=i.getAttribute('data-id'); const pv=parseFloat(i.value); if(!isNaN(pv)){ proms.push(db('lola_cmc_categoria','PATCH',{pct:pv/100,atualizado_por:quem,atualizado_em:new Date().toISOString()},'?plano_id=eq.'+encodeURIComponent(id))); } });
      await Promise.all(proms);
    }catch(e){ alert('Erro ao salvar metas: '+e.message); bt.disabled=false; bt.textContent='Salvar'; return; }
    ov.remove(); _cmvLoad();
  };
}

/* ══ CMC por SEMANA (13/08 Bianca) — colunas da planilha: 1–9, 10–16, 17–23, 24–fim.
   Reaproveita a própria compras_cmv (4 chamadas + o mês), então os totais semanais
   sempre batem com o mensal. Meta por semana = meta da categoria ÷ 4. ══ */
function _cmvKbrl(v){ v=+v||0; if(v>=1000){ return 'R$ '+(v/1000).toFixed(1).replace('.',',')+'k'; } return 'R$ '+Math.round(v); }
function _cmvByPlano(rows){ const o={}; (rows||[]).forEach(function(x){ if(x.plano_id) o[x.plano_id]=(o[x.plano_id]||0)+(+x.valor||0); }); return o; }

async function _cmvLoadSemanas(res){
  const m=_cmv.mes, ld=_cmvLastDay(m), pad=n=>String(n).padStart(2,'0');
  const ranges=[
    ['Mês', m+'-01', m+'-'+pad(ld)],
    ['1–9', m+'-01', m+'-09'],
    ['10–16', m+'-10', m+'-16'],
    ['17–23', m+'-17', m+'-23'],
    ['24–'+ld, m+'-24', m+'-'+pad(ld)]
  ];
  let results;
  try{ results=await Promise.all(ranges.map(function(rg){ return db('rpc/compras_cmv','POST',{p_unit:'ccmq',p_desde:rg[1],p_ate:rg[2]}); })); }
  catch(e){ res.innerHTML='<div class="note">Erro ao carregar: '+_enEsc(e.message)+'</div>'; return; }
  _cmv.data=results[0];
  _cmv.sem={
    monthByPlano:_cmvByPlano(results[0]),
    monthRows:results[0],
    weeks:ranges.slice(1).map(function(rg,i){ return {lbl:rg[0], de:rg[1], ate:rg[2], byPlano:_cmvByPlano(results[i+1])}; })
  };
  _cmvRenderSemanas(res);
}

function _cmvRenderSemanas(res){
  res.innerHTML='';
  const S=_cmv.sem, meta=_cmv.meta||{cats:[],fat:null,fatFonte:''};
  const cats=meta.cats||[], fat=meta.fat;
  const pctTot=cats.reduce(function(s,c){return s+(+c.pct||0);},0);
  let gastoCMC=0; cats.forEach(function(c){ gastoCMC+=(S.monthByPlano[c.plano_id]||0); });
  const totalGeral=(S.monthRows||[]).reduce(function(s,x){return s+(+x.valor||0);},0);
  const orcadoCMC=(fat!=null)?fat*pctTot:null;

  const head=div(null,null,{style:'background:#fff;border:1px solid var(--rb);border-radius:14px;padding:14px 16px;margin-bottom:12px'});
  head.innerHTML='<div style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ts);opacity:.7;font-weight:700">Total comprado no mês</div><div style="font-family:Georgia,serif;font-size:26px;color:var(--v);font-weight:700">'+R(totalGeral)+'</div><div style="font-size:11.5px;color:var(--ts);opacity:.75">'+_cmvMesLabel(_cmv.mes)+' · '+(S.monthRows?S.monthRows.length:0)+' itens</div>';
  res.appendChild(head);

  const cmcHead=div(null,null,{style:'background:#fff;border:1px solid var(--rb);border-radius:14px;padding:14px 16px;margin-bottom:14px'});
  if(!_SOCIO){
    cmcHead.innerHTML='<div style="font-weight:800;color:var(--v);font-size:15px">Controle de CMC · '+_cmvMesLabel(_cmv.mes)+'</div><div style="font-size:11.5px;color:var(--ts);margin-top:6px">Gasto CMC: <b>'+R(gastoCMC)+'</b></div>';
  } else if(fat==null){
    cmcHead.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div style="font-weight:800;color:var(--v);font-size:15px">Controle de CMC</div><button id="cmcGear" class="btn bo bsm" style="font-weight:700"><i class="ph-duotone ph-gear"></i> Metas</button></div><div style="font-size:12.5px;color:#9A6B1E;background:#FBF0DD;border-radius:9px;padding:9px 11px;margin-top:10px">Defina a <b>meta de faturamento</b> deste mês (botão <b>Metas</b>) pra ver o orçamento por semana.</div>';
  } else {
    const restCMC=orcadoCMC-gastoCMC, cmcPctReal=fat>0?gastoCMC/fat:0;
    cmcHead.innerHTML=''
      +'<div style="display:flex;justify-content:space-between;align-items:center;gap:10px">'
      +'<div style="font-weight:800;color:var(--v);font-size:15px">Controle de CMC · '+_cmvMesLabel(_cmv.mes)+'</div>'
      +'<button id="cmcGear" class="btn bo bsm" style="font-weight:700"><i class="ph-duotone ph-gear"></i> Metas</button></div>'
      +'<div style="font-size:11.5px;color:var(--ts);margin-top:6px">Faturamento meta: <b>'+R(meta.fat)+'</b> <span style="opacity:.6">('+_enEsc(meta.fatFonte||'')+')</span></div>'
      +'<div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:9px">'
        +'<div><div style="font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--ts);opacity:.7;font-weight:700">Orçado ('+_cmvPct(pctTot)+')</div><div style="font-family:Georgia,serif;font-size:17px;font-weight:700;color:var(--tp)">'+R(orcadoCMC)+'</div></div>'
        +'<div><div style="font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--ts);opacity:.7;font-weight:700">Gasto CMC</div><div style="font-family:Georgia,serif;font-size:17px;font-weight:700;color:var(--v)">'+R(gastoCMC)+'</div></div>'
        +'<div><div style="font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--ts);opacity:.7;font-weight:700">Restante</div><div style="font-family:Georgia,serif;font-size:17px;font-weight:700;color:'+(restCMC<0?'#B5302E':'#2C7A4B')+'">'+R(restCMC)+'</div></div>'
      +'</div>'
      +'<div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:11px;font-size:11.5px;color:var(--ts)"><span>CMC realizado <b style="color:'+(cmcPctReal>pctTot?'#B5302E':'var(--tp)')+'">'+_cmvPct(cmcPctReal,1)+'</b> <span style="opacity:.6">sobre a meta de faturamento</span></span><span style="opacity:.75">meta '+_cmvPct(pctTot)+'</span></div>'
      +_cmvBar(pctTot>0?cmcPctReal/pctTot:0);
  }
  res.appendChild(cmcHead);
  const gear=cmcHead.querySelector('#cmcGear'); if(gear) gear.onclick=_cmvEditMetas;

  const wl=S.weeks.map(function(w){return w.lbl;});
  const note=div(null,null,{style:'font-size:11px;color:var(--ts);opacity:.75;margin:2px 2px 8px'});
  note.innerHTML='<b style="text-transform:uppercase;letter-spacing:.05em;opacity:.9">Por semana</b> — colunas: '+wl.join(' · ')+((_SOCIO&&fat!=null)?'. Meta por semana = meta da categoria ÷ 4.':'.');
  res.appendChild(note);

  cats.forEach(function(c){
    const mesGasto=S.monthByPlano[c.plano_id]||0;
    const metaMes=(_SOCIO&&fat!=null)?fat*(+c.pct||0):null;
    const metaSem=(metaMes!=null)?metaMes/4:null;
    const card=div(null,null,{style:'background:#fff;border:1px solid var(--rb);border-radius:14px;margin-bottom:12px;overflow:hidden'});
    let cells='';
    S.weeks.forEach(function(w){
      const g=w.byPlano[c.plano_id]||0;
      let bg='#FAF6F0', col='var(--ts)';
      if(metaSem!=null && g>0){ const u=g/metaSem; if(u>1.001){bg='#FBEAE7';col='#B5302E';} else if(u>0.85){bg='#FBF0DD';col='#9A6B1E';} else {bg='#E6F3EA';col='#2C7A4B';} }
      else if(g>0){ col='var(--tp)'; }
      cells+='<div style="background:'+bg+';border-radius:9px;padding:7px 5px;text-align:center;min-width:0"><div style="font-size:9px;color:var(--ts);opacity:.7;font-weight:700;white-space:nowrap">'+_enEsc(w.lbl)+'</div><div style="font-family:Georgia,serif;font-weight:700;font-size:12.5px;color:'+col+';white-space:nowrap">'+(g>0?_cmvKbrl(g):'—')+'</div></div>';
    });
    card.innerHTML='<div style="padding:12px 15px;background:#FBF7F1">'
      +'<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><b style="font-size:14px;color:var(--tp)">'+_enEsc(c.categoria)+'</b><b style="font-family:Georgia,serif;font-size:15px;color:var(--v)">'+R(mesGasto)+'</b></div>'
      +(metaMes!=null?'<div style="font-size:11px;color:var(--ts);margin-top:4px">meta/semana <b>'+R(metaSem)+'</b> · mês '+R(metaMes)+' <span style="opacity:.55">('+_cmvPct(c.pct)+')</span></div>':'')
      +'<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:9px">'+cells+'</div>'
      +'</div>';
    res.appendChild(card);
  });
}

async function _cmvDetalhe(tr,x,desde,ate){
  if(tr._det && tr._det.parentNode){ tr._det.remove(); tr._det=null; return; }
  const det=el('tr'); const td=el('td',null,null,{colspan:5,style:'padding:0 15px 10px'});
  td.innerHTML='<div style="font-size:12px;color:var(--ts);padding:6px 0">Carregando compras…</div>';
  det.appendChild(td); tr.parentNode.insertBefore(det,tr.nextSibling); tr._det=det;
  let rows=[];
  try{ rows=await db('rpc/compras_cmv_detalhe','POST',{p_unit:'ccmq',p_desde:desde,p_ate:ate,p_insumo:(x.mapeado?x.insumo_id:null),p_desc:(x.mapeado?null:(x.item_desc||''))}); }
  catch(e){ td.innerHTML='<div style="color:#b5302e;font-size:12px">Erro: '+_enEsc(e.message)+'</div>'; return; }
  if(!rows.length){ td.innerHTML='<div style="font-size:12px;color:var(--ts)">Sem detalhes.</div>'; return; }
  const baseUn = x.mapeado ? (x.unidade||'un') : '';
  var modaF=null;
  if(x.mapeado){ var cnt={}; rows.forEach(function(r){var f=String(+r.fator||1); cnt[f]=(cnt[f]||0)+1;}); modaF=Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a];})[0]; }
  let h='';
  if(x.mapeado){ h+='<div style="font-size:11px;color:var(--ts);padding:4px 2px 7px">Unidade do insumo: <b>'+_enEsc(baseUn)+'</b>. A coluna <b>Convertido</b> mostra cada compra já em '+_enEsc(baseUn)+' (qtd × fator). Fatores que destoam ficam <span style="color:#B5302E;font-weight:700">em vermelho</span> — ali a conversão pode estar errada.</div>'; }
  h+='<div style="background:#FAF6F0;border:1px solid var(--fio,#eee);border-radius:10px;overflow:hidden;margin:2px 0 4px"><table style="width:100%;border-collapse:collapse;font-size:11.5px">'+
    '<thead><tr style="text-align:left;color:var(--ts);opacity:.7;font-size:9.5px;text-transform:uppercase"><th style="padding:6px 10px">Data</th><th style="padding:6px 10px">Fornecedor</th><th style="padding:6px 8px;text-align:right">Qtd nota</th>'+(x.mapeado?'<th style="padding:6px 8px;text-align:right">Convertido</th>':'')+'<th style="padding:6px 8px;text-align:right">Unit.</th><th style="padding:6px 10px;text-align:right">Total</th></tr></thead><tbody>';
  rows.forEach(function(r,ri){
    var q=(+r.qtd||0), f=(+r.fator||1), conv=q*f;
    var destoa = x.mapeado && modaF!=null && String(f)!==String(+modaF);
    var convCell='';
    if(x.mapeado){ convCell='<td style="padding:6px 8px;text-align:right;white-space:nowrap'+(destoa?';color:#B5302E;font-weight:700':'')+'">'+N(conv,(conv%1===0?0:2))+' '+_enEsc(baseUn)+' <span style="font-size:9px;opacity:.7">×'+N(f,(f%1===0?0:2))+(destoa?' ⚠':'')+'</span> <button class="cmv-fx" data-i="'+ri+'" title="Corrigir fator de conversão" style="border:0;background:none;cursor:pointer;color:var(--v);font-size:12px;padding:0 2px;vertical-align:middle">✎</button></td>'; }
    h+='<tr style="border-top:1px solid #eee"><td style="padding:6px 10px;white-space:nowrap">'+DBR(r.data_emissao)+'</td><td style="padding:6px 10px">'+_enEsc(r.emitente||'—')+(r.numero?' <span style="opacity:.5">nº '+_enEsc(r.numero)+'</span>':'')+'</td><td style="padding:6px 8px;text-align:right;white-space:nowrap">'+N(q,(q%1===0?0:2))+' '+_enEsc(r.unidade||'')+'</td>'+convCell+'<td style="padding:6px 8px;text-align:right;white-space:nowrap">'+R(+r.vunit||0)+'</td><td style="padding:6px 10px;text-align:right;white-space:nowrap;font-weight:600">'+R(+r.vtotal||0)+'</td></tr>';
  });
  h+='</tbody></table></div>';
  td.innerHTML=h;
  td.querySelectorAll('.cmv-fx').forEach(function(b){ b.addEventListener('click',function(ev){ ev.stopPropagation(); _cmvEditFator(x, rows[+b.getAttribute('data-i')]); }); });
}

/* Editor de fator de conversão (11/08 Bianca): corrige o fator de uma descrição direto do CMV.
   Afeta todas as compras com a mesma descrição (mesmo fornecedor/embalagem) — não as outras. */
function _cmvEditFator(x, r){
  if(!r) return;
  const baseUn = x.unidade||'un';
  const un = r.unidade||'un';
  const ov=div(null,null,{style:'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:99999;display:flex;align-items:center;justify-content:center;padding:16px'});
  const card=div(null,null,{style:'background:#fff;border-radius:16px;max-width:430px;width:100%;padding:18px;box-shadow:0 22px 55px -12px rgba(0,0,0,.45)'});
  card.innerHTML=''
    +'<div style="font-family:Georgia,serif;color:var(--v);font-size:19px">Corrigir conversão</div>'
    +'<div style="font-size:12px;color:var(--ts);margin:2px 0 12px">'+_enEsc(x.insumo_nome||'')+' · unidade que usamos: <b>'+_enEsc(baseUn)+'</b></div>'
    +'<div style="background:#FAF6F0;border-radius:10px;padding:10px 12px;font-size:12.5px;margin-bottom:12px">Como veio na nota: <b>'+_enEsc(r.item_desc||'')+'</b><br><span style="color:var(--ts)">exemplo desta compra: '+N((+r.qtd||0),((+r.qtd)%1===0?0:2))+' '+_enEsc(un)+'</span></div>'
    +'<label style="font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ts);font-weight:700">1 '+_enEsc(un)+' equivale a</label>'
    +'<div style="display:flex;align-items:center;gap:8px;margin:5px 0 8px"><input id="cmvFatorInp" type="number" step="any" min="0" value="'+(+r.fator||1)+'" style="flex:1;border:1px solid var(--rb);border-radius:9px;padding:10px 12px;font-size:16px;font-weight:700"><span style="font-weight:700;font-size:14px">'+_enEsc(baseUn)+'</span></div>'
    +'<div id="cmvFatorPrev" style="font-size:12px;color:var(--ts);margin-bottom:6px"></div>'
    +'<div style="font-size:11px;color:#9A6B1E;background:#FBF0DD;border-radius:8px;padding:7px 10px;margin-bottom:14px">Isto vale para <b>todas</b> as compras com a descrição "'+_enEsc(r.item_desc||'')+'" (mesmo fornecedor/embalagem). Não mexe nas outras descrições.</div>'
    +'<div style="display:flex;gap:8px;justify-content:flex-end"><button id="cmvFatorCancel" class="btn bo bsm">Cancelar</button><button id="cmvFatorSave" class="btn bp bsm" style="font-weight:700">Salvar</button></div>';
  ov.appendChild(card); document.body.appendChild(ov);
  ov.addEventListener('click',function(e){ if(e.target===ov) ov.remove(); });
  const inp=card.querySelector('#cmvFatorInp'), prev=card.querySelector('#cmvFatorPrev');
  function upd(){ const f=parseFloat(inp.value)||0; const q=(+r.qtd||0); prev.innerHTML='→ '+N(q,(q%1===0?0:2))+' '+_enEsc(un)+' = <b>'+N(q*f,((q*f)%1===0?0:2))+' '+_enEsc(baseUn)+'</b>'; }
  inp.addEventListener('input',upd); upd(); setTimeout(function(){ inp.focus(); inp.select(); },50);
  card.querySelector('#cmvFatorCancel').onclick=function(){ ov.remove(); };
  card.querySelector('#cmvFatorSave').onclick=async function(){
    const f=parseFloat(inp.value);
    if(!(f>0)){ alert('Coloque um fator maior que zero.'); return; }
    const btn=card.querySelector('#cmvFatorSave'); btn.disabled=true; btn.textContent='Salvando…';
    try{ await db('rpc/compras_cmv_set_fator','POST',{p_desc_norm:r.desc_norm,p_fator:f}); }
    catch(e){ alert('Erro ao salvar: '+e.message); btn.disabled=false; btn.textContent='Salvar'; return; }
    ov.remove(); try{ _cmvLoad(); }catch(e){}
  };
}

/* Classificar plano de contas (11/08 Bianca): "precisamos poder cadastrar plano
   de contas para estes tambem". Insumo mapeado → grava plano_padrao (vale p/ todas
   as compras do insumo). Item só na nota → grava override por descrição (item_plano). */
function _cmvClassify(x){
  if(!x) return;
  const nrm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const mapeado=!!x.mapeado;
  const nome = mapeado ? (x.insumo_nome||'') : (x.item_desc||'—');
  const ov=div(null,null,{style:'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:99999;display:flex;align-items:center;justify-content:center;padding:16px'});
  const card=div(null,null,{style:'background:#fff;border-radius:16px;max-width:460px;width:100%;max-height:86vh;display:flex;flex-direction:column;padding:18px;box-shadow:0 22px 55px -12px rgba(0,0,0,.45)'});
  card.innerHTML=''
    +'<div style="font-family:Georgia,serif;color:var(--v);font-size:19px">Classificar plano de contas</div>'
    +'<div style="font-size:12px;color:var(--ts);margin:2px 0 4px">'+(mapeado?'Insumo: ':'Item da nota: ')+'<b>'+_enEsc(nome)+'</b></div>'
    +'<div style="font-size:11px;color:#9A6B1E;background:#FBF0DD;border-radius:8px;padding:7px 10px;margin:4px 0 10px">'+(mapeado
        ?'Vale para <b>todas</b> as compras deste insumo.'
        :'Vale para todas as compras com a descrição "<b>'+_enEsc(nome)+'</b>".')+'</div>'
    +'<input id="cmvCatBusca" placeholder="Buscar conta…" style="border:1px solid var(--rb);border-radius:9px;padding:9px 12px;font-size:13px;margin-bottom:8px">'
    +'<div id="cmvCatLista" style="overflow:auto;flex:1;min-height:130px;border:1px solid var(--fio,#eee);border-radius:10px"><div style="padding:14px;color:var(--ts);font-size:12px">Carregando contas…</div></div>'

/* 22/07 (Bianca): "quando eu estou digitando já deveria aparecer os itens parecidos,
   mas ele está mostrando todos os insumos" — o datalist nativo abre a lista inteira.
   Autocomplete de verdade: filtra por pedaço do nome (sem acento), até 12 opções.
   19/08 (Bianca): "dá as opções de buscar pelo dropdown, sugerindo os parecidos" — os
   parecidos e o "cadastrar novo" saíram dos chips na tela e entraram AQUI no dropdown:
   ao focar (campo vazio) ele já sugere os parecidos da descrição da nota; ao digitar,
   filtra; e a última opção é sempre "cadastrar novo insumo". Tela mais limpa. */
function _enAutoComplete(inp,opts){
  opts=opts||{};
  const desc=opts.desc||'';
  const onNovo=opts.onNovo||function(v){ inp.value=v; inp.dispatchEvent(new Event('input',{bubbles:false})); inp.focus(); };
  inp.removeAttribute('list');
  inp.setAttribute('autocomplete','off');
  const box=document.createElement('div');
  box.style.cssText='position:fixed;z-index:900;background:#fff;border:1.5px solid var(--rb);border-radius:12px;box-shadow:0 8px 24px rgba(42,26,23,.15);max-height:280px;overflow-y:auto;display:none';
  document.body.appendChild(box);
  let _skip=false;
  function fechar(){ box.style.display='none'; }
  function _novoLabel(){
    const t=(inp.value&&inp.value.trim())?inp.value.trim():String(desc||'').replace(/\s+/g,' ').trim().slice(0,60);
    return t;
  }
  function _mkOpt(label,onPick,extra){
    extra=extra||{};
    const it=document.createElement('div');
    it.style.cssText='padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;border-bottom:1px solid #F3EBE2;'+(extra.css||'');
    it.innerHTML=label;
    it.onmouseenter=()=>{it.style.background=extra.hover||'var(--rf)';};
    it.onmouseleave=()=>{it.style.background=extra.bg||'#fff';};
    it.onmousedown=(e)=>{ e.preventDefault(); _skip=true; onPick(); fechar(); };
    return it;
  }
  function _hdr(txt){
    const h=document.createElement('div');
    h.textContent=txt;
    h.style.cssText='padding:7px 14px 5px;font-size:10px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--ts)';
    return h;
  }
  function render(){
    if(_skip){ _skip=false; fechar(); return; }
    if(!EN||!EN.insumos){ fechar(); return; }
    const q=_jnorm(inp.value||'');
    box.innerHTML='';
    if(q.length<2){
      const cands=desc?_enSugereTop(desc,6).filter(o=>o.ins):[];
      if(cands.length){
        box.appendChild(_hdr('parecidos com a nota'));
        cands.forEach(o=>{ box.appendChild(_mkOpt(_envEsc(o.ins.nome),()=>{ inp.value=o.ins.nome; inp.dispatchEvent(new Event('input',{bubbles:false})); })); });
      }else{
        const h=document.createElement('div'); h.textContent='digite pra buscar um insumo';
        h.style.cssText='padding:9px 14px;font-size:12px;color:var(--ts)'; box.appendChild(h);
      }
    }else{
      const hits=EN.insumos.filter(i=>_jnorm(i.nome).includes(q)).slice(0,12);
      if(hits.length){ hits.forEach(i=>{ box.appendChild(_mkOpt(_envEsc(i.nome),()=>{ inp.value=i.nome; inp.dispatchEvent(new Event('input',{bubbles:false})); })); }); }
      else{ const h=document.createElement('div'); h.textContent='nenhum insumo com esse nome'; h.style.cssText='padding:9px 14px;font-size:12px;color:var(--ts)'; box.appendChild(h); }
    }
    const nl=_novoLabel();
    box.appendChild(_mkOpt('🆕 cadastrar novo insumo'+(nl?' <span style="color:var(--ts);font-weight:600">— “'+_envEsc(nl)+'”</span>':''),()=>{ onNovo(_novoLabel()); },{css:'border-bottom:0;color:#7A4FA3;font-weight:700;background:#FBF8FE',bg:'#FBF8FE',hover:'#F3EAFB'}));
    const r=inp.getBoundingClientRect();
    box.style.left=r.left+'px'; box.style.top=(r.bottom+4)+'px'; box.style.width=Math.max(r.width,240)+'px';
    box.style.display='block';
  }
  inp.addEventListener('input',render);
  inp.addEventListener('focus',render);
  inp.addEventListener('blur',()=>setTimeout(fechar,150));
}
function abrirNotaEN(n){

    const _sl='font-size:9px;font-weight:800;padding:1px 6px;border-radius:5px;text-transform:uppercase;letter-spacing:.4px';
    const selo = _ign ? '<span style="background:#FBEAE7;color:#B5302E;'+_sl+'">não entra no estoque</span>'
              : mp ? '<span style="background:#DCFCE7;color:#166534;'+_sl+'">já conhecido</span>'

    const insInp=el('input','fi',null,{placeholder:'Insumo (busque ou crie novo)',value:insNome,autocomplete:'off'});insInp.style.cssText='width:100%;margin-bottom:6px;font-size:13px';
    _enAutoComplete(insInp,{desc:desc,onNovo:function(v){ insInp.value=v; insInp.dispatchEvent(new Event('input')); insInp.focus(); }});
    /* 05/08→19/08 (Bianca): os PARECIDOS e o "cadastrar novo" saíram destes chips e foram

    if(_sug && !_sug.forte){   // palpite fraco: dica, não preenchimento

        ins.unidade_custo=r.unSelEN.value;

      await fetch(SB+'/rest/v1/lola_nota_insumo_map?on_conflict=desc_norm',{method:'POST',headers:H,body:JSON.stringify({desc_norm:_jnorm(r.desc),desc_orig:r.desc,insumo_id:ins.id,fator:f,ignorar:false,origem:'ccmq',criado_por:ME||null,updated_at:new Date().toISOString()})});

/* 22/07 (Bianca): FECHAMENTO MENSAL DE PREÇOS — "todo dia 1º me dá um aviso; pega a
   média do preço de cada insumo no mês, e daí sim a gente atualiza nas receitas e
   nos pedidos". Média PONDERADA (Σ gasto ÷ Σ qtd) das ENTRADAS do mês nas duas
   pontas (CCMQ + Central — o cadastro lola_insumos é um só). Aplicação com REVISÃO
   (checkboxes; variação ≥50% destacada). Grava lola_insumos_historico (origem
   'fechamento') e marca o mês em lola_precos_fechamento (alimenta o aviso do dia 1º). */
async function modalFecharPrecosEN(mes){
  const _hj=new Date();
  const mesDef=(function(){ const d=new Date(_hj.getFullYear(),_hj.getMonth()-1,1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); })();
  let MES=mes||mesDef;
  const wrap=div(null); const body=div(null);
  const mesInp=el('input','fi',null,{type:'month',value:MES,style:'max-width:200px'});
  mesInp.onchange=()=>{ MES=mesInp.value; carrega(); };
  let LINHAS=[];
  const bAplicar=btn('btn bp','✓ Aplicar preços marcados',aplicar);
  bAplicar.style.cssText='width:100%;margin-top:12px;padding:13px;font-weight:800;font-size:14px';
  async function carrega(){
    body.innerHTML=''; body.appendChild(ld()); LINHAS=[];
    try{
      const ini=MES+'-01';
      const fimD=new Date(+MES.slice(0,4), +MES.slice(5,7), 0).getDate();
      const fim=MES+'-'+String(fimD).padStart(2,'0');
      const [mc,mm,jaFechado]=await Promise.all([
        db('lola_ccmq_estoque_mov','GET',null,'?tipo=eq.entrada&data=gte.'+ini+'&data=lte.'+fim+'&select=insumo_id,qtd,custo_total&limit=10000'),
        db('lola_central_estoque_mov','GET',null,'?tipo=eq.entrada&data=gte.'+ini+'&data=lte.'+fim+'&select=insumo_id,qtd,custo_total&limit=10000'),
        db('lola_precos_fechamento','GET',null,'?mes=eq.'+MES).catch(()=>[])
      ]);
      const agg={};
      [].concat(mc,mm).forEach(m=>{ const q=+m.qtd||0, v=+m.custo_total||0; if(!(q>0&&v>0)||!m.insumo_id) return; const a=(agg[m.insumo_id]=agg[m.insumo_id]||{q:0,v:0,n:0}); a.q+=q; a.v+=v; a.n++; });
      body.innerHTML='';
      if(jaFechado.length){ body.appendChild(div('al alw mb3',['✓ Este mês já foi aplicado em '+new Date(jaFechado[0].aplicado_em).toLocaleDateString('pt-BR')+' por '+(jaFechado[0].aplicado_por||'—')+'. Aplicar de novo recalcula a mesma média.'])); }
      const ids=Object.keys(agg);
      if(!ids.length){ body.appendChild(em('📅','Nenhuma compra com valor nesse mês')); return; }
      const insumos=(typeof _ins!=='undefined'&&_ins&&_ins.length)?_ins:await db('lola_insumos','GET',null,'?select=id,nome,unidade_custo,custo_por_unidade&ativo=eq.true&limit=4000');
      const byId={}; insumos.forEach(i=>{ byId[i.id]=i; });
      const tbl=div(null);
      ids.map(id=>{ const i=byId[id]; if(!i) return null; const media=agg[id].v/agg[id].q; const atual=+i.custo_por_unidade||0; const dif=atual>0?((media-atual)/atual*100):null; return {id,i,media,atual,dif,n:agg[id].n}; })
        .filter(Boolean)
        .sort((a,b)=>Math.abs(b.dif==null?999:b.dif)-Math.abs(a.dif==null?999:a.dif))
        .forEach(l=>{
          const suspeito=l.dif!=null&&Math.abs(l.dif)>=50;
          const row=div(null,null,{style:'display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--rb);border-radius:10px;margin-bottom:6px;background:'+(suspeito?'#FDF0E0':'#fff')});
          const ck=el('input',null,null,{type:'checkbox'}); ck.checked=true; ck.style.cssText='width:17px;height:17px;flex-shrink:0;accent-color:var(--v)';
          const info=div(null,null,{style:'flex:1;min-width:0'});
          info.innerHTML='<div style="font-weight:700;font-size:13px">'+_envEsc(l.i.nome)+'</div><div style="font-size:11px;color:var(--ts)">'+l.n+' compra'+(l.n>1?'s':'')+' no mês</div>';
          const nums=div(null,null,{style:'text-align:right;flex-shrink:0'});
          nums.innerHTML='<div style="font-size:12.5px"><span style="color:var(--ts)">'+R(l.atual)+'</span> → <b style="color:var(--v)">'+R(l.media)+'</b> <small>/'+_envEsc(l.i.unidade_custo||'un')+'</small></div>'
            +'<div style="font-size:11px;font-weight:700;color:'+(l.dif==null?'#8A7A72':(l.dif>0?'#c47700':'#166534'))+'">'+(l.dif==null?'sem preço atual':((l.dif>0?'+':'')+l.dif.toFixed(1)+'%'))+(suspeito?' ⚠️ confira':'')+'</div>';
          row.appendChild(ck); row.appendChild(info); row.appendChild(nums);
          tbl.appendChild(row);
          LINHAS.push({ck,dado:l});
        });
      body.appendChild(tbl);
    }catch(e){ body.innerHTML='<p style="color:#B5302E;padding:10px">Erro: '+_envEsc(e.message)+'</p>'; }
  }
  async function aplicar(){
    const sel=LINHAS.filter(x=>x.ck.checked);
    if(!sel.length){ alert('Nenhum insumo marcado.'); return; }
    if(!confirm('Aplicar o preço médio de '+_enMesLbl(MES)+' em '+sel.length+' insumo'+(sel.length>1?'s':'')+'?\n\nIsso atualiza o cadastro — receitas e pedidos passam a usar os preços novos daqui pra frente.'))return;
    bAplicar.disabled=true; bAplicar.textContent='Aplicando…';
    try{
      for(const x of sel){
        const l=x.dado;
        await db('lola_insumos_historico','POST',{insumo_id:l.id,custo_anterior:l.atual,custo_novo:l.media,alterado_por:ME||null,origem:'fechamento',observacao:'média ponderada de '+MES});
        await db('lola_insumos','PATCH',{custo_por_unidade:l.media,preco_atualizado_em:new Date().toISOString(),preco_atualizado_por:ME||null},'?id=eq.'+l.id);
        if(typeof _ins!=='undefined'&&_ins){ const li=_ins.find(i=>i.id===l.id); if(li) li.custo_por_unidade=l.media; }
      }
      await fetch(SB+'/rest/v1/lola_precos_fechamento?on_conflict=mes',{method:'POST',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({mes:MES,aplicado_em:new Date().toISOString(),aplicado_por:ME||null,n_itens:sel.length})});
      document.querySelectorAll('.ov').forEach(o=>o.remove());
      alert('✓ Preços de '+sel.length+' insumos atualizados pela média de '+_enMesLbl(MES)+'.\n\nLembrete: as RECEITAS recalculam na Conferência de Preços.');
      renderPage();
    }catch(e){ alert('Erro: '+e.message); bAplicar.disabled=false; bAplicar.textContent='✓ Aplicar preços marcados'; }
  }
  wrap.appendChild(fgrp('Mês (média das compras dele)',mesInp));
  wrap.appendChild(el('div',null,null,{style:'height:10px'}));
  wrap.appendChild(body);
  wrap.appendChild(bAplicar);
  mkModal('📅 Fechamento de preços do mês',[wrap],null,'mo mol');
  carrega();
}

/* 31/08: embalagens retornáveis (potes/GN) já confirmadas como enviadas ("bipadas")
   e ainda não devolvidas, cruzando todos os pedidos — visão única pro Lola saber o
   que precisa separar pra devolver à Central. */
async function drawEmbRetPendentes(wrap){
  wrap.innerHTML='';
  let rows;
  try{
    rows=await db('lola_pedido_embalagens','GET',null,'?select=id,nome,quantidade,pedido:pedido_id(numero_pedido,unidade,status)&enviado=eq.true&devolvido=eq.false&pedido_item_id=not.is.null&order=nome.asc');
  }catch(e){ return; }
  if(!rows||!rows.length) return;
  const box=div(null,null,{style:'background:#fff;border:1px solid var(--rb);border-radius:16px;padding:16px 18px;margin-top:14px'});
  box.appendChild(el('div',null,null,{html:'<i class="ph-duotone ph-recycle"></i> Embalagens retornáveis aguardando devolução',style:'font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--v);margin-bottom:10px'}));
  const porNome={};
  rows.forEach(r=>{ (porNome[r.nome]=porNome[r.nome]||[]).push(r); });
  Object.keys(porNome).sort().forEach(nome=>{
    const lista=porNome[nome];
    const total=lista.reduce((s,r)=>s+(parseFloat(r.quantidade)||0),0);
    const grp=div(null,null,{style:'margin-bottom:10px'});
    grp.appendChild(el('div',null,nome+' — '+N(total,0)+' un pendente'+(total!==1?'s':''),{style:'font-size:13px;font-weight:700;margin-bottom:4px'}));
    lista.forEach(r=>{
      const pu=r.pedido&&r.pedido.unidade;
      const destLabel=pu==='ccmq'?'CCMQ':pu==='mac'?'Mac':(pu||'—');
      const row=div(null,null,{style:'display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:9px;background:var(--rf);border:1px solid var(--rb);margin-bottom:4px'});
      row.appendChild(el('span',null,'Pedido #'+(r.pedido?r.pedido.numero_pedido:'?')+' · '+destLabel+' · '+N(r.quantidade,0)+' un',{style:'flex:1;font-size:12.5px'}));
      const dBtn=btn('btn bp bxs','Devolvido',async()=>{
        dBtn.disabled=true;
        try{
          await db('lola_pedido_embalagens','PATCH',{devolvido:true,devolvido_em:new Date().toISOString(),devolvido_por:(typeof ME!=='undefined'&&ME)||null},'?id=eq.'+r.id);
          const destUnidade=INV_UNIDADE_DESTINO[pu]||null;
          if(destUnidade) await moverEstoqueEmbalagem(r.nome,parseFloat(r.quantidade)||0,destUnidade,'Cozinha Central');
          drawEmbRetPendentes(wrap);
        }catch(err){ alert('Erro: '+err.message); dBtn.disabled=false; }
      });
      row.appendChild(dBtn);
      grp.appendChild(row);
    });
    box.appendChild(grp);
  });
  wrap.appendChild(box);
}

async function verResumoCategorias(label, pedidos){
  const ov=div('ov');const mo=div('mo mol');
  mo.appendChild(div('mh',[el('h3',null,'🔎 Compras por categoria — '+label),btn('xb','✕',()=>ov.remove())]));
  const mb=div('mb');mb.appendChild(ld());mo.appendChild(mb);
  ov.appendChild(mo);
  ov.addEventListener('click',e=>{if(e.target===ov)ov.remove();});
  document.body.appendChild(ov);
  try{
    const ids=(pedidos||[]).map(p=>p.id);
    if(!ids.length){mb.innerHTML='';mb.appendChild(div('tss','Nenhum pedido recebido neste período.'));mo.appendChild(div('mf',[btn('btn bg','Fechar',()=>ov.remove())]));return;}
    const norm=x=>(x||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
    const [itens,pps,inss]=await Promise.all([
      db('lola_pedidos_itens','GET',null,'?pedido_id=in.('+ids.join(',')+')&select=nome_item,quantidade,preco_unitario'),
      db('lola_preproducoes','GET',null,'?select=nome,cat_custo'),
      db('lola_insumos','GET',null,'?select=nome,categoria'),
    ]);
    const ppMap={};pps.forEach(x=>{ppMap[norm(x.nome)]=x.cat_custo||'';});
    const insMap={};inss.forEach(x=>{insMap[norm(x.nome)]=x.categoria||'';});
    const acc={};const exemplos={};let total=0;
    itens.forEach(it=>{
      const v=(parseFloat(it.quantidade)||0)*(parseFloat(it.preco_unitario)||0);
      const nn=norm(it.nome_item);
      let cat=ppMap[nn];
      if(!cat){ if(insMap[nn]!==undefined) cat=INS_TO_COST[insMap[nn]]||'Temperos e Outros'; }
      if(!cat)cat='Sem categoria';
      acc[cat]=(acc[cat]||0)+v;total+=v;
      if(!exemplos[cat])exemplos[cat]=new Set();
      if(exemplos[cat].size<5)exemplos[cat].add((it.nome_item||'').replace(/^PP /i,''));
    });
    const linhas=Object.entries(acc).sort((a,b)=>b[1]-a[1]);
    mb.innerHTML='';
    mb.appendChild(div('card mb3 fl_ jb aic',[el('strong',null,'Total recebido no período'),el('span','bold tv',R(total),{style:'font-size:20px;font-family:Fraunces,serif'})]));
    linhas.forEach(([cat,val])=>{
      const pct=total>0?(val/total*100):0;
      const wrap=div('card',null,{style:'margin-bottom:8px'});
      wrap.appendChild(div('fl_ jb aic',[
        el('strong',null,(COST_EMOJI[cat]||'')+' '+cat,{style:'font-size:13px'}),
        el('span','bold tv',R(val)+'  ·  '+pct.toFixed(0)+'%',{style:'font-size:13px'}),
      ]));
      const barOuter=div(null,null,{style:'height:7px;background:var(--rf);border-radius:5px;margin-top:6px;overflow:hidden'});
      barOuter.appendChild(div(null,null,{style:'height:100%;width:'+pct.toFixed(1)+'%;background:var(--v);border-radius:5px'}));
      wrap.appendChild(barOuter);
      const ex=[...(exemplos[cat]||[])].join(', ');
      if(ex)wrap.appendChild(div('tss',ex,{style:'margin-top:6px;font-size:11px'}));
      mb.appendChild(wrap);
    });
  }catch(e){mb.innerHTML='<p style="color:red">'+e.message+'</p>';}
  mo.appendChild(div('mf',[btn('btn bg','Fechar',()=>ov.remove())]));
}

  // Campo de busca

  mb.appendChild(buscaInp);

  // Área de itens
  const itensArea=div(null);
  mb.appendChild(itensArea);

  let _buscaNovoPed='';

  /* 19/07: as funções ppPreco/ppUnidade/ppInfo SUBIRAM pro nível de cima (antes de
     drawPed). Elas moravam AQUI DENTRO do modal de novo pedido, e o modal de EDITAR
     também as usa — "ppUnidade is not defined" quebrava o Editar desde a unificação
     de 15/07. Regra única, agora num escopo que as duas telas enxergam. */

  /* 19/07 (Bianca): "estamos com 2 barras de rolagem — deixar as listas pro dropdown".
     A lista gigante de TODOS os itens (fichas+PPs+insumos, cada um com input) SAIU.
     Agora: busca com DROPDOWN de sugestões → toca pra adicionar → só os adicionados
     ficam na tela, com qtd editável e ✕. Os FILTROS são os mesmos de 17/07
     ("o catálogo do pedido é quem a Central faz"; com busca, qualquer insumo entra). */
  function _pedCatalogo(){
    const q=_buscaNovoPed;
    const ppDest=_pp.filter(x=>(x.cozinha ? x.cozinha==='central'
                                          : (x.e_preparo||(x.destinos||[]).includes('central')))&&
      (!q||x.nome.toLowerCase().includes(q)));
    const ftDest=ftPre.filter(x=>(!q||x.nome.toLowerCase().includes(q)));
    const insDest=_ins.filter(x=>{
      if(q) return x.nome.toLowerCase().includes(q);
      return (x.destinos||[]).includes(_destPed)||(x.destinos||[]).includes('central');
    });
    const out=[];
    ftDest.forEach(x=>out.push({id:'ft_'+x.id, nome:x.nome, grupo:'Ficha', preco:parseFloat(x.custo_por_porcao)||0, unidade:x.rendimento_un||'porção', item:x}));
    ppDest.forEach(x=>out.push({id:'pp_'+x.id, nome:x.nome, grupo:'Pré-prod.', preco:ppPreco(x), unidade:ppUnidade(x), info:ppInfo(x), item:x}));
    insDest.forEach(x=>{
      const uc=x.unidade_custo||'kg', uCompra=x.unidade_compra||uc;
      let pr=parseFloat(x.custo_por_unidade)||0;
      if(uCompra==='g'&&uc==='kg') pr=x.custo_por_unidade/1000;
      else if(uCompra==='ml'&&uc==='L') pr=x.custo_por_unidade/1000;
      out.push({id:'ins_'+x.id, nome:x.nome, grupo:'Insumo', preco:pr, unidade:uCompra, item:x});
    });
    return out;
  }
  function buildItens(){
    itensArea.innerHTML='';
    /* itens JÁ adicionados — qtd editável + ✕ */
    const sels=Object.entries(qtdMap).filter(function(par){return par[1].quantidade>0;});
    if(sels.length){
      const g=div(null); g.style.cssText='margin-bottom:10px';
      sels.forEach(function(par){ const v=par[1];
        const row=document.createElement('div');
        row.style.cssText='display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;margin-bottom:4px;background:var(--rf);border:1px solid var(--rb)';
        const info=document.createElement('div');info.style.cssText='flex:1;min-width:0';
        info.innerHTML='<div style="font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+_envEsc(v.nome)+'</div><div style="font-size:11px;color:var(--ts)">'+R(v.preco)+'/'+_envEsc(v.unidade)+'</div>';
        const inp=document.createElement('input');
        inp.type='number';inp.min='0';inp.step='0.5';inp.value=v.quantidade;inp.setAttribute('inputmode','decimal');
        inp.style.cssText='width:80px;padding:8px;border:2px solid var(--v);border-radius:10px;font-size:15px;text-align:center;font-family:Manrope,sans-serif;font-weight:700;-webkit-appearance:none';
        inp.addEventListener('input',function(e){ v.quantidade=parseFloat(e.target.value)||0; calcTotal(); });
        inp.addEventListener('change',function(){ if(!(v.quantidade>0)) buildItens(); });
        const un=document.createElement('div');un.style.cssText='font-size:11px;color:var(--ts);width:30px;font-weight:600';un.textContent=v.unidade;
        const rm=document.createElement('button');rm.type='button';rm.title='Tirar do pedido';
        rm.style.cssText='background:none;border:none;color:#B5302E;font-size:16px;cursor:pointer;padding:4px;flex-shrink:0';
        rm.textContent='✕';
        rm.onclick=function(){ v.quantidade=0; buildItens(); };
        row.appendChild(info);row.appendChild(inp);row.appendChild(un);row.appendChild(rm);
        g.appendChild(row);
      });
      itensArea.appendChild(g);
    } else if(!_buscaNovoPed){
      itensArea.appendChild(div('tss mt2 mb2','Busque acima e toque no item pra adicionar — só o que você adicionar aparece aqui.'));
    }
    /* dropdown de sugestões */
    if(_buscaNovoPed && _buscaNovoPed.length>=2){
      const op=_pedCatalogo().filter(function(o){return !(qtdMap[o.id]&&qtdMap[o.id].quantidade>0);}).slice(0,12);
      const dd=div(null);
      dd.style.cssText='background:#fff;border:1.5px solid var(--rb);border-radius:12px;overflow:hidden;margin-bottom:10px;box-shadow:0 8px 24px rgba(170,43,43,.10)';
      if(!op.length) dd.appendChild(div('tss',null,{style:'padding:10px 12px',html:'Nada encontrado com esse nome.'}));

        const b=document.createElement('button'); b.type='button';

          +'<span style="font-size:10px;font-weight:800;color:var(--rm);flex-shrink:0">'+o.grupo+'</span>'
          +'<span style="font-size:11px;font-weight:700;color:var(--v);white-space:nowrap;flex-shrink:0">'+R(o.preco)+'/'+_envEsc(o.unidade)+'</span>';

  // Total

  function calcTotal(){
    const total=Object.values(qtdMap).reduce((t,v)=>t+(v.quantidade||0)*v.preco,0);

    const itensComQtd=Object.values(qtdMap).filter(v=>v.quantidade>0);

    const un=document.createElement('div');un.style.cssText='font-size:11px;color:var(--ts);width:30px;font-weight:600';un.textContent=item.unidade||'un';

  function buildEmb(){
    embArea.innerHTML='';

    if(sel.length){const g=div(null);g.style.cssText='margin-bottom:8px';sel.forEach(it=>g.appendChild(embRow(it)));embArea.appendChild(g);}
    if(_buscaEmb){
      const matches=_invAll.filter(x=>!selIds.has(x.id)&&x.nome.toLowerCase().includes(_buscaEmb)).slice(0,20);
      if(matches.length){const g=div(null);matches.forEach(it=>g.appendChild(embRow(it)));embArea.appendChild(g);}
      else embArea.appendChild(div('tss',null,{style:'padding:8px',html:'Nada encontrado no inventário.'}));
