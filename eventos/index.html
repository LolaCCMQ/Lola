<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eventos Lola</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
  :root{
    --vinho:#A8272A; --vinho-deep:#7C1A1C; --vinho-pale:#F9ECEC; --vinho-light:#C94040; --vinho-muted:#DDB8B8;
    --cream:#FDFAF7; --warm:#F2EDE8; --border:#e8d5d5; --ink:#1E0A0A; --muted:#8a7d7d;
    --green:#2D6A4F; --green-pale:#e7f1ec; --white:#ffffff;
    --amber:#b9791b; --amber-pale:#fbf0dc; --blue:#3d6e94; --blue-pale:#eaf1f7;
    --shadow:0 2px 16px rgba(168,39,42,.10);
    --serif:'Playfair Display',Georgia,serif;
    --sans:'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--sans);background:var(--cream);color:var(--ink);font-size:15px;line-height:1.5}
  h1,h2,h3{margin:0;font-weight:700}
  h2{font-family:var(--serif)}
  button{font-family:var(--sans);cursor:pointer;border:none;border-radius:10px;font-size:14px;font-weight:700}
  input,select,textarea{font-family:var(--sans);font-size:14px;width:100%;padding:9px 11px;border:1px solid var(--border);
    border-radius:9px;background:var(--white);color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--vinho)}
  textarea{resize:vertical;min-height:42px}
  a{color:var(--vinho)}
  header{background:var(--white);border-top:4px solid var(--vinho);padding:16px 26px;
    display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow);position:sticky;top:0;z-index:50}
  .brand{display:flex;align-items:center;gap:13px}
  .logo-text{font-family:var(--serif);font-style:italic;font-weight:800;font-size:30px;color:var(--vinho);line-height:1}
  .brand .titles h1{font-size:16px;color:var(--ink);font-weight:800}
  .brand .titles small{display:block;font-weight:600;color:var(--muted);font-size:11px;letter-spacing:2px;text-transform:uppercase}
  .top-actions{display:flex;gap:8px;align-items:center}
  .top-actions button{background:var(--vinho-pale);color:var(--vinho);padding:9px 14px}
  .top-actions button:hover{background:var(--vinho-muted)}
  .top-actions a.home{color:var(--muted);font-weight:700;text-decoration:none;font-size:13px;padding:9px 6px}
  .wrap{max-width:1180px;margin:0 auto;padding:26px}
  .toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:20px}
  .toolbar .search{flex:1;min-width:200px}
  .btn-primary{background:var(--vinho);color:#fff;padding:11px 18px}
  .btn-primary:hover{background:var(--vinho-deep)}
  .btn-ghost{background:var(--white);color:var(--vinho);border:1px solid var(--border);padding:10px 15px}
  .btn-ghost:hover{border-color:var(--vinho);background:var(--vinho-pale)}
  .btn-sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
  .filters{display:flex;gap:6px;flex-wrap:wrap}
  .chip{padding:7px 13px;border-radius:20px;background:var(--white);border:1px solid var(--border);font-size:13px;color:var(--muted);font-weight:600}
  .chip.active{background:var(--vinho);color:#fff;border-color:var(--vinho)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
  .card{background:var(--white);border-radius:14px;box-shadow:var(--shadow);padding:18px;border:1px solid var(--border);
    transition:transform .12s,box-shadow .12s;cursor:pointer;position:relative;overflow:hidden}
  .card:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(168,39,42,.16)}
  .card .ev-type{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--vinho);font-weight:800;margin-bottom:5px}
  .card h3{font-family:var(--serif);font-size:18px;margin-bottom:8px;line-height:1.25;color:var(--ink)}
  .card .meta{font-size:13px;color:var(--muted);margin-bottom:3px;display:flex;gap:7px;align-items:center;font-weight:600}
  .loc-pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:800;letter-spacing:.3px}
  .loc-central{background:#eef2f7;color:#3a5a82}
  .loc-ccmq{background:#f1ecf7;color:#6a4b9c}
  .loc-mac{background:#fbeee6;color:#b56a2e}
  .loc-catering{background:#fbe6f0;color:#b5366e}
  .card.ev-done{opacity:.5}
  .card.ev-done:hover{opacity:.85}
  .card.loc-card-ccmq{border-left:6px solid #c0392b;background:#fdeceb}
  .card.loc-card-mac{border-left:6px solid #2D6A4F;background:#eaf5ef}
  .card.loc-card-central{border-left:6px solid #d4a017;background:#fdf7e6}
  .card.loc-card-catering{border-left:6px solid #d6478f;background:#fdeaf3}
  .badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:800;letter-spacing:.4px}
  .b-pre{background:var(--blue-pale);color:var(--blue)}
  .b-orc{background:var(--amber-pale);color:var(--amber)}
  .b-apr{background:var(--green-pale);color:var(--green)}
  .b-real{background:var(--vinho-pale);color:var(--vinho)}
  .b-canc{background:#f3e3e3;color:var(--vinho-deep)}
  .progress{height:8px;background:var(--warm);border-radius:6px;margin-top:13px;overflow:hidden}
  .progress > div{height:100%;background:linear-gradient(90deg,var(--vinho),var(--vinho-light));border-radius:6px;transition:width .3s}
  .card .pct{font-size:12px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between;font-weight:700}
  .empty{text-align:center;padding:70px 20px;color:var(--muted)}
  .empty .big{font-size:54px;margin-bottom:10px}
  .empty h3{font-family:var(--serif);color:var(--vinho);font-size:22px}
  .back{background:none;color:var(--muted);font-weight:700;padding:6px 0;margin-bottom:10px;display:flex;align-items:center;gap:6px}
  .detail-head{background:var(--white);border-radius:14px;box-shadow:var(--shadow);padding:22px;margin-bottom:18px;border:1px solid var(--border)}
  .detail-head .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
  .detail-head h2{font-size:25px;color:var(--vinho)}
  .detail-head .sub{color:var(--muted);font-size:14px;margin-top:4px;font-weight:600}
  .summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:16px}
  .summary .box{background:var(--cream);border-radius:10px;padding:11px 13px;border:1px solid var(--border)}
  .summary .box span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:3px;font-weight:700}
  .summary .box b{font-size:15px;font-weight:800}
  .tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px;border-bottom:2px solid var(--border)}
  .tabs button{background:none;color:var(--muted);padding:11px 14px;font-weight:700;border-radius:8px 8px 0 0;border-bottom:3px solid transparent;margin-bottom:-2px;font-size:13.5px}
  .tabs button:hover{color:var(--vinho)}
  .tabs button.active{color:var(--vinho);border-bottom-color:var(--vinho)}
  .tabs button .count{font-size:11px;background:var(--warm);padding:1px 7px;border-radius:10px;margin-left:5px}
  .panel{background:var(--white);border-radius:14px;box-shadow:var(--shadow);padding:24px;border:1px solid var(--border)}
  .section-title{font-size:13px;text-transform:uppercase;letter-spacing:1.2px;color:var(--vinho);font-weight:800;
    margin:22px 0 12px;padding-bottom:7px;border-bottom:1px solid var(--border)}
  .section-title:first-child{margin-top:0}
  .intro{color:var(--muted);font-size:13.5px;margin:-4px 0 16px;font-weight:600}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--ink);margin-bottom:5px}
  .field .hint{font-weight:500;color:var(--muted);font-size:11px}
  .full{grid-column:1/-1}
  .ck-item{display:flex;gap:12px;padding:12px;border-radius:10px;border:1px solid var(--border);margin-bottom:9px;background:var(--white)}
  .ck-item.done{background:var(--green-pale);border-color:#bfe0d0}
  .ck-cb{flex-shrink:0;width:22px;height:22px;border:2px solid var(--vinho);border-radius:6px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;margin-top:1px;background:var(--white);transition:all .12s;font-weight:800}
  .ck-cb.on{background:var(--green);border-color:var(--green);color:#fff}
  .ck-body{flex:1}
  .ck-body .txt{font-weight:700;font-size:14px}
  .ck-item.done .txt{text-decoration:line-through;color:var(--muted)}
  .ck-body .desc{font-size:12.5px;color:var(--muted);margin-top:2px;font-weight:600}
  .ck-note{margin-top:8px;font-size:13px;min-height:34px;background:var(--cream)}
  .ck-link{display:flex;gap:7px;align-items:center;margin-top:7px}
  .ck-link input{font-size:12.5px;background:var(--cream)}
  .phase-bar{height:7px;background:var(--warm);border-radius:6px;margin:4px 0 18px;overflow:hidden}
  .phase-bar>div{height:100%;background:var(--green);transition:width .3s}
  .orc-add{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px;background:var(--cream);padding:14px;border-radius:11px;border:1px solid var(--border)}
  .orc-add .field{flex:1;min-width:140px}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;padding:9px 8px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid var(--border);font-weight:800}
  td{padding:8px;border-bottom:1px solid var(--border);vertical-align:middle}
  td input{padding:6px 8px}
  td input.num,td input[type=number]{text-align:right}
  td.name{font-weight:700}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .del-row{background:none;color:var(--vinho);font-size:18px;padding:0 6px}
  .totals{margin-top:18px;display:flex;flex-direction:column;gap:7px;max-width:380px;margin-left:auto}
  .totals .line{display:flex;justify-content:space-between;padding:5px 0;font-size:14px;font-weight:600}
  .totals .grand{border-top:2px solid var(--vinho);padding-top:10px;font-size:19px;font-weight:800;color:var(--vinho);font-family:var(--serif)}
  .mini-input{max-width:90px;display:inline-block}
  .ficha-link{color:var(--vinho);font-weight:700;font-size:12.5px;text-decoration:none}
  .ficha-link:hover{text-decoration:underline}
  .step-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:28px;padding-top:18px;border-top:1px solid var(--border);flex-wrap:wrap}
  .step-dots{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--vinho-muted);cursor:pointer;transition:.15s;border:none;padding:0}
  .dot.on{background:var(--vinho);transform:scale(1.35)}
  .dot:hover{background:var(--vinho-light)}
  .btn-skip{background:none;color:var(--muted);padding:10px 12px;text-decoration:underline}
  .btn-skip:hover{color:var(--vinho)}
  .nav-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .save-flash{position:fixed;bottom:24px;right:24px;background:var(--green);color:#fff;padding:12px 20px;border-radius:10px;
    box-shadow:var(--shadow);opacity:0;transform:translateY(10px);transition:all .25s;z-index:100;font-weight:700}
  .save-flash.show{opacity:1;transform:translateY(0)}
  .save-flash.err{background:var(--vinho)}
  .hidden{display:none!important}
  .danger{color:var(--vinho);background:none;font-weight:700;padding:8px 12px;border:1px solid var(--border);border-radius:9px}
  .danger:hover{border-color:var(--vinho);background:var(--vinho-pale)}
  .row-actions{display:flex;gap:8px;flex-wrap:wrap}
  .toolrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .loading{text-align:center;padding:60px;color:var(--muted);font-weight:700}
  .conn{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--green-pale);color:var(--green)}
  .conn.off{background:#f3e3e3;color:var(--vinho)}
  #printArea{display:none}
  .pm-overlay{display:none;position:fixed;inset:0;background:rgba(30,10,10,.45);z-index:9999;align-items:center;justify-content:center;padding:16px}
  .pm-box{background:#fff;border-radius:16px;padding:24px;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  @media print{
    header,.tabs,.top-actions,.toolbar,.back,.row-actions,.orc-add,.del-row,.step-nav,.no-print,.wrap,.pm-overlay{display:none!important}
    body{background:#fff}
    #printArea{display:block!important}
  }
  @media(max-width:600px){.wrap{padding:14px}header{padding:14px}}

  /* ===== Padrão V3 Lola (overlay) ===== */
  :root{--vinho:#A82A2A;--vinho-deep:#7E1E1F;--vinho-pale:#FBE4E0;--vinho-light:#C0392B;--vinho-muted:#E8CFC7;--cream:#FBF7F1;--warm:#F7EFE6;--border:#ECE3D9;--ink:#2A1A17;--muted:#8A7A72;--green:#2C7A4B;--green-pale:#E6F3EA;--amber:#9A6B1E;--amber-pale:#FBF0DD;--blue:#2C5AA0;--blue-pale:#E6EEF8;--shadow:0 1px 2px rgba(42,26,23,.05),0 12px 26px -16px rgba(42,26,23,.22);--serif:'Fraunces',Georgia,serif;--sans:'Hanken Grotesk',-apple-system,'Segoe UI',sans-serif}
  header{background:var(--cream);border-top:none;box-shadow:none;border-bottom:1px solid #EFE6DC}
  h1,h2,h3{font-weight:600}
  .logo-text{font-style:normal}
  .card{box-shadow:none;border-radius:16px}
  .card:hover{transform:none;box-shadow:var(--shadow)}
  .card.loc-card-ccmq{border-left:4px solid #C0392B;background:#fff}
  .card.loc-card-mac{border-left:4px solid #2C7A4B;background:#fff}
  .card.loc-card-central{border-left:4px solid #2C5AA0;background:#fff}
  .card.loc-card-catering{border-left:4px solid #B23A6B;background:#fff}
  .progress>div{background:var(--vinho)}
  .btn-primary,.btn-ghost{border-radius:13px}
  .btn-primary{min-height:44px}
  .chip{min-height:38px}
  .detail-head{box-shadow:none;border-radius:16px}
  .panel{box-shadow:none;border-radius:16px}
  .hyb-prog{display:flex;gap:4px;margin-top:14px}
  .hyb-prog i{flex:1;height:5px;border-radius:3px;background:#EFE6DC}
  .hyb-prog i.d{background:var(--green)}
  .hyb-prog i.c{background:var(--amber)}
  .hyb-etapa{font-size:12px;color:var(--muted);margin-top:5px;font-weight:600}
  .hyb-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .hyb-stat{background:var(--cream);border:1px solid var(--border);border-radius:12px;padding:9px 12px}
  .hyb-stat span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:#B79A8E;font-weight:700}
  .hyb-stat b{font-family:var(--serif);font-weight:600;font-size:17px}
  .hyb-stat b.warn{color:#B5302E}
  .hyb-alert{background:#FBEAE7;border:1px solid #F0C8C0;border-radius:13px;padding:10px 14px;margin-top:12px}
  .hyb-atit{font-size:11px;font-weight:800;color:#B5302E;text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
  .hyb-arow{font-size:13px;color:#5A463E;padding:2px 0;font-weight:600}
  .hyb-bloco{background:#fff;border:1px solid var(--border);border-radius:16px;margin-bottom:10px;overflow:hidden}
  .hyb-bloco.on{border-color:var(--vinho)}
  .hyb-bhead{display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer;min-height:44px}
  .hyb-bico{font-size:19px}
  .hyb-btit{font-weight:800;font-size:14.5px}
  .hyb-bsub{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:1px}
  .hyb-bstate{font-size:12px;font-weight:800;color:var(--green);background:var(--green-pale);padding:3px 9px;border-radius:9px;flex-shrink:0}
  .hyb-bstate.zero{color:var(--muted);background:var(--warm)}
  .hyb-chev{color:#B79A8E;font-size:12px}
  .hyb-sec{display:flex;align-items:center;gap:10px;padding:11px 16px;border-top:1px solid #EFE6DC;cursor:pointer;min-height:44px}
  .hyb-sec:hover{background:var(--cream)}
  .hyb-sec.on{background:var(--cream);cursor:default}
  .hyb-ck{width:24px;height:24px;border-radius:50%;border:1.5px solid #D8C8BD;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;color:var(--muted);flex-shrink:0;background:#fff}
  .hyb-ck.ok{background:var(--green);border-color:var(--green);color:#fff}
  .hyb-slabel{flex:1;font-weight:700;font-size:13.5px;min-width:0}
  .hyb-scount{font-size:11.5px;color:var(--muted);font-weight:700;flex-shrink:0}
  .hyb-scount.warn{color:#B5302E}
  .hyb-panel{border:none;border-top:1px solid #EFE6DC;border-radius:0;padding:18px 16px;cursor:default}
  .panel .section-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  /* ===== Barra de etapas (Rodada 1 · 08/07/2026) ===== */
  .stepbar-wrap{position:sticky;top:73px;z-index:20;background:var(--cream);padding:8px 0 6px;margin-bottom:12px;border-bottom:1px solid var(--border)}
  .stepbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
  .stepbar::-webkit-scrollbar{height:4px}
  .stepbar::-webkit-scrollbar-thumb{background:var(--vinho-muted);border-radius:4px}
  .step{flex:0 0 auto;display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--border);border-radius:20px;padding:7px 13px 7px 8px;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap;min-height:40px;cursor:pointer;font-family:var(--sans)}
  .step:hover{border-color:var(--vinho);color:var(--vinho)}
  .step .n{width:21px;height:21px;border-radius:50%;background:var(--warm);color:var(--muted);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .step.done{color:#4E6B58}
  .step.done .n{background:var(--green);color:#fff}
  .step.on{background:var(--vinho);border-color:var(--vinho);color:#fff}
  .step.on .n{background:rgba(255,255,255,.28);color:#fff}
  .step.warn .n{background:var(--amber);color:#fff}
  .stepgrp{flex:0 0 auto;display:flex;align-items:center;color:#C6B4A8;font-size:10px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;padding:0 4px;white-space:nowrap}
  .sk-title{margin-left:auto;font-weight:600}
  .menu-cat{display:inline-flex;gap:3px}
  .menu-cat button{width:30px;height:30px;border-radius:9px;border:1px solid var(--border);background:#fff;color:var(--muted);font-size:13px;font-weight:800;padding:0;cursor:pointer}
  .menu-cat button.on.C{background:#B5302E;border-color:#B5302E;color:#fff}
  .menu-cat button.on.B{background:#2C5AA0;border-color:#2C5AA0;color:#fff}
  .menu-cat button.on.M{background:#9A6B1E;border-color:#9A6B1E;color:#fff}
  .mtag{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;border-radius:7px;font-size:11px;font-weight:800}
  .mtag.C{background:#FBE4E0;color:#B5302E}
  .mtag.B{background:#E6EEF8;color:#2C5AA0}
  .mtag.M{background:#FBF0DD;color:#9A6B1E}
  .lista-sep{border:1px solid var(--border);border-radius:13px;padding:14px;margin-bottom:12px;background:var(--cream)}
  .lista-sep h4{margin:0 0 8px;font-family:var(--serif);font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .lista-sep .cnt{font-size:11px;font-weight:800;color:var(--muted);background:#fff;border:1px solid var(--border);padding:2px 8px;border-radius:20px}
  .lista-sep table{background:#fff;border-radius:9px}
  .pill-ok{background:var(--green-pale);color:var(--green);font-size:11px;font-weight:800;padding:4px 10px;border-radius:20px}
  .viewtoggle{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#fff}
  .viewtoggle button{background:none;border:none;padding:8px 12px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:5px}

/* ===== Mapeamento banco <-> app ===== */
function intOrNull(v){const n=parseInt(v);return isNaN(n)?null:n;}
function numOr(v,d){const n=Number(v);return isNaN(n)?d:n;}
/* Migração automática: itens de categoria M no menu viram materiais (Operacional). */
function migraMenuM(menu,materiais){
  const m=(menu||[]).slice(), mat=(materiais||[]).slice();
  const alvo=m.filter(function(x){return x&&x.cat==='M';});
  if(!alvo.length) return {menu:m,materiais:mat,mudou:false};
  alvo.forEach(function(x){
    const preco=Number(x.preco)||0;
    mat.push({item:x.nome||'',origem:'',qtdSaida:(x.qtd==null?1:x.qtd),saiu:false,qtdVolta:'',voltou:false,
      obs:'migrado do Menu (categoria M)',destino:'',comprar:preco>0,custo:preco});
  });
  return {menu:m.filter(function(x){return !x||x.cat!=='M';}),materiais:mat,mudou:true};
}
function fromRow(r){
  const mig=migraMenuM(r.menu,r.materiais);
  return {
    _precisaMigrar:mig.mudou,
    id:r.id, nome:r.nome||"", responsavel:r.responsavel||"", cliente:r.cliente||"", contato:r.contato||"",

    checks:r.checks||{}, menu:mig.menu, cozbar:r.cozbar||[], materiais:mig.materiais, equipe:r.equipe||[],

/* ===== Carregamento ===== */
async function init(){
  try{
    const [ev,fic,pp]=await Promise.all([
      sb.from('lola_eventos').select('*').eq('arquivado',false).order('data',{ascending:true,nullsFirst:false}),
      sb.from('lola_fichas_tecnicas').select('nome,preco_venda,categoria,cardapio,rendimento_un').eq('ativo',true).gt('preco_venda',0).order('nome'),
      sb.from('lola_preproducoes').select('nome,valor_venda_central,categoria,rendimento_un').eq('ativo',true).order('nome')
    ]);
    if(ev.error)throw ev.error;
    DB.events=(ev.data||[]).map(fromRow);
    FICHAS=(fic.data||[]).map(f=>({n:f.nome,p:Math.round(Number(f.preco_venda)*100)/100,cat:f.categoria,card:f.cardapio,un:f.rendimento_un||''}))
      .concat((pp.data||[]).map(f=>({n:f.nome,p:Math.round((Number(f.valor_venda_central)||0)*100)/100,cat:'pré-produção',card:null,un:(f.rendimento_un==='g'?'kg':f.rendimento_un==='ml'?'L':(f.rendimento_un||''))})))
      .sort((a,b)=>String(a.n||'').localeCompare(String(b.n||'')));
    setConn(true);
    const migrar=DB.events.filter(function(e){return e._precisaMigrar;});
    if(migrar.length){
      console.log('Migrando '+migrar.length+' evento(s): menu categoria M -> materiais');
      for(const e of migrar){ delete e._precisaMigrar; await sb.from('lola_eventos').update({menu:e.menu,materiais:e.materiais}).eq('id',e.id); }
    }
  }catch(e){
    console.error(e);setConn(false);
    document.getElementById('list').innerHTML=`<div class="empty full" style="grid-column:1/-1"><div class="big">⚠️</div><h3>Não consegui conectar ao banco</h3><p>Verifique a conexão e clique em ↻ Atualizar.</p></div>`;
    return;
  }
  renderFilters();renderList();
}

const fmt = n => "R$ "+(Number(n)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
function esc(s){return (s==null?'':s.toString()).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
function currentUserName(){try{var pp=window.parent;if(pp&&pp!==window&&pp.__portalUser&&pp.__portalUser.name)return pp.__portalUser.name;}catch(e){}return 'portal';}
function blankEvent(){
  const checks={};

  return {
    id:null, nome:"", responsavel:"", contato:"", tipo:"personalizado", local:"", status:"pre",

  };
}
function getEvent(id){return DB.events.find(e=>e.id===id);}
function relevantSections(ev){return SECTIONS.filter(s=>s.tipos.includes(ev.tipo));}
function relevantFases(ev){return FASES.filter(f=>f.tipos.includes(ev.tipo));}
function progress(ev){let tot=0,done=0;relevantFases(ev).forEach(f=>f.itens.forEach((it,i)=>{tot++;if(ev.checks[f.id+"_"+i]&&ev.checks[f.id+"_"+i].done)done++;}));return tot?Math.round(done/tot*100):0;}
function faseProgress(ev,f){let tot=f.itens.length,done=0;f.itens.forEach((it,i)=>{if(ev.checks[f.id+"_"+i]&&ev.checks[f.id+"_"+i].done)done++;});return {done,tot,pct:tot?Math.round(done/tot*100):0};}
function locPill(v){const l=LOCAIS.find(x=>x.v===v);if(!l||!v)return '';return `<span class="loc-pill ${l.c}">📍 ${l.l.replace('Lola ','')}</span>`;}

function payStatus(ev){
  const pg=ev.pag||{};
  const total=orcTotal(ev);
  const temValor=total>0||Number(pg.sinalValor)>0;
  const pago = pg.pago==='Pago' || (pg.sinalPago&&pg.saldoPago);
  const parcial = !pago && (pg.pago==='Parcial' || pg.sinalPago || (Number(pg.sinalValor)>0&&pg.sinalPago));
  if(pago) return {cls:'pay-pago', txt:'Pago', ico:'✓'};
  if(parcial) return {cls:'pay-parcial', txt:'Parcial', ico:'◐'};
  if(!temValor) return {cls:'pay-sem', txt:'—', ico:''};
  return {cls:'pay-pend', txt:'Pendente', ico:'○'};
}
function setModo(m){view.modo=m;try{localStorage.setItem('evtModo',m);}catch(e){}renderViewToggle();renderListFilters();renderList();}
function setLocFilter(v){view.locFilter=v;renderListFilters();renderList();}
function setMes(v){view.mesFilter=v;renderListFilters();renderList();}
function clearListFilters(){view.locFilter="";view.mesFilter="";renderListFilters();renderList();}
function renderListFilters(){
  const w=document.getElementById('listFilters');if(!w)return;
  if(view.modo!=='lista'){w.className='list-filters';w.innerHTML='';return;}
  w.className='list-filters on';
  const locOpts=[{v:'',l:'Todos os locais'}].concat(LOCAIS.filter(function(l){return l.v;}).map(function(l){return {v:l.v,l:l.l};}));
  const MESNOME=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const meses=Array.from(new Set(DB.events.filter(function(e){return e.data;}).map(function(e){return e.data.slice(0,7);}))).sort();
  const mesOpts=[{v:'',l:'Todos os meses'}].concat(meses.map(function(ym){var p=ym.split('-');return {v:ym,l:MESNOME[Number(p[1])-1]+'/'+p[0]};}));
  w.innerHTML=''
    +'<div class="lf"><label>Local</label><select onchange="setLocFilter(this.value)">'+locOpts.map(function(o){return '<option value="'+o.v+'"'+(view.locFilter===o.v?' selected':'')+'>'+o.l+'</option>';}).join('')+'</select></div>'
    +'<div class="lf"><label>Mês de competência</label><select onchange="setMes(this.value)">'+mesOpts.map(function(o){return '<option value="'+o.v+'"'+(view.mesFilter===o.v?' selected':'')+'>'+o.l+'</option>';}).join('')+'</select></div>'
    +((view.locFilter||view.mesFilter)?'<button class="lf-clear" onclick="clearListFilters()">✕ Limpar</button>':'');
}

function renderList(){
  const q=(document.getElementById('search').value||"").toLowerCase();
  let evs=DB.events.slice().sort((a,b)=>{var ca=(a.status==='realizado'||a.status==='cancelado')?1:0,cb=(b.status==='realizado'||b.status==='cancelado')?1:0;if(ca!==cb)return ca-cb;return (a.data||"9999").localeCompare(b.data||"9999");});
  if(view.filter!=="todos")evs=evs.filter(e=>e.status===view.filter);
  if(q)evs=evs.filter(e=>[e.nome,e.responsavel,e.ocasiao,e.contato].join(' ').toLowerCase().includes(q));
  if(view.modo==='lista'){
    if(view.locFilter)evs=evs.filter(e=>(e.local||'')===view.locFilter);

  }
  const list=document.getElementById('list');
  if(!evs.length){
    list.innerHTML=`<div class="empty full" style="grid-column:1/-1"><div class="big">🥂</div>

    list.innerHTML='<table class="list-tbl"><thead><tr>'
      +'<th>Evento</th><th>Data</th><th>Pax</th><th>Status</th><th>Pagamento</th><th style="text-align:right">Orçamento</th>'
      +'</tr></thead><tbody>'
      +evs.map(function(e){
        const st=STATUS.find(function(s){return s.v===e.status;})||STATUS[0];
        const pax=[e.paxIn,e.paxOut].filter(function(x){return x!=='';}).join(' + ');
        const dt=e.data?(function(){var _d=new Date(e.data+'T00:00');return _d.toLocaleDateString('pt-BR')+' · '+_d.toLocaleDateString('pt-BR',{weekday:'short'}).toUpperCase().replace('.','');})():'A definir';
        const loc=e.local?((LOCAIS.find(function(l){return l.v===e.local;})||{}).l||'').replace('Lola ',''):'';
        const pay=payStatus(e);
        const done=(e.status==='realizado'||e.status==='cancelado');
        return '<tr class="row'+(done?' done':'')+'" onclick="open_(\''+e.id+'\')">'
          +'<td class="lt-nomewrap"><span class="lt-nome"><span class="lt-locdot" style="background:'+(locColor[e.local]||'#ccc')+'"></span>'+(esc(e.nome)||'(sem nome)')+'</span>'+(loc?' <span class="meta" style="font-size:11px;color:var(--muted)">'+esc(loc)+'</span>':'')+'</td>'
          +'<td data-l="Data">'+dt+(e.horario?' '+esc(e.horario):'')+'</td>'
          +'<td data-l="Pax">'+(pax||'—')+'</td>'
          +'<td data-l="Status"><span class="badge '+st.c+'">'+st.l+'</span></td>'
          +'<td data-l="Pagamento"><span class="pay '+pay.cls+'">'+(pay.ico?pay.ico+' ':'')+pay.txt+'</span></td>'
          +'<td class="lt-num" data-l="Orçamento">'+fmt(orcTotal(e))+'</td>'
          +'</tr>';
      }).join('')
      +'</tbody></table>';
    return;
  }
  list.className='grid';
  list.innerHTML=evs.map(e=>{
    const st=STATUS.find(s=>s.v===e.status)||STATUS[0];
    const tp=TIPOS.find(t=>t.v===e.tipo);
    const pct=progress(e);
    const pax=[e.paxIn,e.paxOut].filter(x=>x!=='').join(' + ');
    const dt=e.data?(()=>{const _d=new Date(e.data+'T00:00');return _d.toLocaleDateString('pt-BR')+' · '+_d.toLocaleDateString('pt-BR',{weekday:'long'}).toUpperCase();})():'Data a definir';
    return `<div class="card loc-card-${e.local||'none'}${(e.status==='realizado'||e.status==='cancelado')?' ev-done':''}" onclick="open_('${e.id}')">
      <div class="ev-type">${tp?tp.l.split('(')[0]:''}</div>
      <h3>${esc(e.nome)||'(sem nome)'}</h3>
      <div class="meta">📅 ${dt}${e.horario?' · '+e.horario:''} ${locPill(e.local)}</div>
      <div class="meta">👤 ${esc(e.responsavel)||'—'}${pax?' · 👥 '+pax+' pax':''}</div>
      ${e.editadoEm?`<div class="meta" style="font-size:11px;color:var(--muted)">✏️ ${new Date(e.editadoEm).toLocaleDateString('pt-BR')} ${new Date(e.editadoEm).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}${e.editadoPor&&e.editadoPor!=='portal'?' · '+esc(e.editadoPor):''}</div>`:''}
      <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center"><span class="badge ${st.c}">${st.l}</span>${(()=>{const pay=payStatus(e);return pay.txt==='—'?'':'<span class="pay '+pay.cls+'">'+(pay.ico?pay.ico+' ':'')+pay.txt+'</span>';})()}</div>
      <div class="progress"><div style="width:${pct}%"></div></div>
      <div class="pct"><span>Checklist</span><span>${pct}%</span></div>
    </div>`;

}
async function newEvent(){
  const ev=blankEvent();
  const {data,error}=await sb.from('lola_eventos').insert(toRow(ev)).select().single();
  if(error){alert("Não consegui criar o evento. Tente novamente.");console.error(error);return;}
  const e=fromRow(data);DB.events.push(e);open_(e.id);
}
function open_(id){view.screen="detail";view.id=id;view.bloco=null;view.tab="info";const _ev=getEvent(id);if(_ev){const _o=tabOrder(_ev);const _f=_o.find(t=>!secInfo(_ev,SECTIONS.find(x=>x.id===t)).done);view.tab=_f||_o[0]||"info";view.bloco=blocoOf(view.tab);}document.getElementById('dashboard').classList.add('hidden');document.getElementById('detail').classList.remove('hidden');renderDetail();window.scrollTo(0,0);}
function backToDash(){view.screen="dash";document.getElementById('detail').classList.add('hidden');document.getElementById('dashboard').classList.remove('hidden');renderFilters();renderList();window.scrollTo(0,0);}
function tabOrder(ev){const rel=relevantSections(ev).map(s=>s.id);const seq=[];BLOCOS.forEach(b=>b.secs.forEach(id=>{if(rel.indexOf(id)>=0)seq.push(id);}));rel.forEach(id=>{if(seq.indexOf(id)<0)seq.push(id);});return seq;}
function secLabel(ev,id){const s=SECTIONS.find(x=>x.id===id);if(!s)return id;if(s.label)return s.label;if(s.kind==='fase'){const f=FASES.find(x=>x.id===id);return f?f.nome.replace(/^\d+ · /,''):id;}return s.label;}
/* ===== Blocos híbridos (Padrão V3): resumo + sanfona ===== */
const BLOCOS=[
  {id:'plan', icon:'📋', label:'Planejamento', secs:['triagem','info']},
  {id:'oper', icon:'🍳', label:'Operação', secs:['menu','os','show','equipe']},
  {id:'fin', icon:'💰', label:'Financeiro', secs:['orc','negociacao']},
  {id:'diad', icon:'🥂', label:'Dia D', secs:['layout','convidados','dia','despro']}
];
function blocoOf(secId){const b=BLOCOS.find(x=>x.secs.includes(secId));return b?b.id:'plan';}
function secInfo(ev,s){
  if(!s)return {c:'',done:false,warn:false};
  if(s.kind==='fase'){const f=FASES.find(x=>x.id===s.id);const fp=faseProgress(ev,f);return {c:fp.done+'/'+fp.tot,done:fp.tot>0&&fp.done===fp.tot,warn:false};}
  if(s.kind==='triagemfull'){const a=faseProgress(ev,FASES.find(x=>x.id==='triagem'));const b=faseProgress(ev,FASES.find(x=>x.id==='negociacao'));const d=a.done+b.done,t=a.tot+b.tot;return {c:d+'/'+t,done:t>0&&d===t,warn:false};}
  if(s.kind==='equipe'){const g=ev.equipe||[];const v=g.filter(r=>!String(r.nome||'').trim()).length;return {c:g.length?(v?(v+' vaga'+(v>1?'s':'')+' em aberto'):(g.length+' escalado'+(g.length>1?'s':''))):'montar',done:g.length>0&&v===0,warn:v>0};}
  if(s.kind==='menu'){const m=ev.menu||[];const pg=ev.pag||{};return {c:m.length?(pg.menuAprovado?(pg.menuEnviado?'enviado ✓':'aprovado'):(m.length+' iten'+(m.length>1?'s':''))):'montar',done:m.length>0&&!!pg.menuAprovado,warn:false};}
  if(s.kind==='orc'){const pg=ev.pag||{};return {c:pg.pedidoNum?('pedido #'+pg.pedidoNum+' ✓'):(pg.orcAutorizado?'autorizado':fmt(orcTotal(ev))),done:!!pg.orcAutorizado,warn:false};}
  if(s.kind==='convidados'){const n=(ev.convidados||[]).length;return {c:n?(n+' convidado'+(n>1?'s':'')):'—',done:n>0,warn:false};}
  if(s.kind==='form'){const ok=!!(ev.nome&&ev.data&&ev.local);return {c:ok?'ok':'completar',done:ok,warn:false};}
  return {c:'',done:false,warn:false};
}
function resolverAgora(ev){
  const out=[];const pg=ev.pag||{};
  const vg=(ev.equipe||[]).filter(r=>!String(r.nome||'').trim()).length;
  if(vg)out.push(vg+' vaga'+(vg>1?'s':'')+' de equipe em aberto');
  if(Number(pg.sinalValor)>0&&!pg.sinalPago)out.push('Sinal de '+fmt(pg.sinalValor)+' não recebido');
  if(ev.status==='orcamento'&&!pg.orcAutorizado)out.push('Orçamento aguardando aprovação do cliente');
  if(ev.data&&ev.status!=='realizado'&&ev.status!=='cancelado'){
    const d=Math.ceil((new Date(ev.data+'T00:00').getTime()-new Date(new Date().setHours(0,0,0,0)).getTime())/86400000);
    const pc=progress(ev);
    if(d>=0&&d<=7&&pc<100)out.push(d===0?('É HOJE · checklist em '+pc+'%'):('Faltam '+d+' dia'+(d>1?'s':'')+' · checklist em '+pc+'%'));
  }
  return out.slice(0,4);
}
function toggleBloco(id){
  const ev=getEvent(view.id);if(!ev)return;
  if(view.bloco===id){view.bloco=null;renderDetail();return;}
  view.bloco=id;
  const order=tabOrder(ev);const b=BLOCOS.find(x=>x.id===id);
  const secs=b?b.secs.filter(sid=>order.includes(sid)):[];
  if(secs.length&&!secs.includes(view.tab)){
    view.tab=secs.find(sid=>!secInfo(ev,SECTIONS.find(x=>x.id===sid)).done)||secs[0];
  }
  renderDetail();
}
function renderDetail(){
  const ev=getEvent(view.id);if(!ev){backToDash();return;}
  const order=tabOrder(ev);
  if(!order.includes(view.tab))view.tab=order[0]||'info';
  if(!view.bloco)view.bloco=blocoOf(view.tab);
  const tp=TIPOS.find(t=>t.v===ev.tipo);
  const pax=[ev.paxIn,ev.paxOut].filter(x=>x!=='').join(' + ');
  const dt=ev.data?new Date(ev.data+'T00:00').toLocaleDateString('pt-BR'):'A definir';
  const total=orcTotal(ev);
  const pg=ev.pag||{};
  const sinalTxt=Number(pg.sinalValor)>0?(pg.sinalPago?'pago ✓':'pendente'):'—';
  const estados={};order.forEach(id=>{estados[id]=secInfo(ev,SECTIONS.find(x=>x.id===id));});
  let curIdx=order.findIndex(id=>!estados[id].done);if(curIdx<0)curIdx=order.length-1;
  const alerts=resolverAgora(ev);
  const segs=order.map((id,i)=>'<i class="'+(estados[id].done?'d':(i===curIdx?'c':''))+'"></i>').join('');
  const grpOf={};BLOCOS.forEach(b=>b.secs.forEach(id=>grpOf[id]=b.label));
  let lastG=null;
  const stepbarHtml=order.map((id,i)=>{
    const st=estados[id];const g=grpOf[id]||'';
    let out='';
    if(g!==lastG){out+='<span class="stepgrp">'+g+'</span>';lastG=g;}
    const cls='step'+(st.done?' done':'')+(id===view.tab?' on':'')+(st.warn?' warn':'');
    out+='<button class="'+cls+'" id="step_'+id+'" onclick="gotoTab(\''+id+'\')"><span class="n">'+(st.done?'✓':(i+1))+'</span>'+secLabel(ev,id)+'</button>';
    return out;
  }).join('');
  document.getElementById('detail').innerHTML=`
    <button class="back" onclick="backToDash()">← Voltar aos eventos</button>
    <div class="detail-head">
      <div class="row1">
        <div>
          <div class="ev-type" style="color:var(--vinho);font-size:11px;text-transform:uppercase;letter-spacing:1px;font-weight:800">${tp?tp.l:''} ${locPill(ev.local)}</div>
          <h2>${esc(ev.nome)||'(novo evento)'}</h2>
          <div class="sub">${esc(ev.responsavel)||'sem responsável'} · <span id="subDateTime">📅 ${dt}${ev.horario?' '+ev.horario:''}</span>${pax?' · 👥 '+pax+' pax':''}</div>
        </div>
        <div class="row-actions">
          <select onchange="setField('status',this.value)" style="width:auto;font-weight:700">
            ${STATUS.map(s=>`<option value="${s.v}" ${ev.status===s.v?'selected':''}>${s.l}</option>`).join('')}
          </select>
          <button class="btn-ghost no-print" onclick="openPrintDialog()">🖨</button>
          <button class="danger no-print" onclick="delEvent('${ev.id}')">🗑</button>
        </div>
      </div>
      <div class="hyb-prog">${segs}</div>
      <div class="hyb-etapa">etapa ${curIdx+1} de ${order.length} · ${secLabel(ev,order[curIdx])}</div>
      <div class="hyb-stats">
        <div class="hyb-stat"><span>Pax</span><b>${pax||'—'}</b></div>
        <div class="hyb-stat"><span>Orçamento</span><b>${fmt(total)}</b></div>
        <div class="hyb-stat"><span>Sinal</span><b class="${sinalTxt==='pendente'?'warn':''}">${sinalTxt}</b></div>
      </div>
      ${alerts.length?('<div class="hyb-alert"><div class="hyb-atit">Resolver agora · '+alerts.length+'</div>'+alerts.map(a=>'<div class="hyb-arow">'+a+'</div>').join('')+'</div>'):''}
    </div>
    <div class="stepbar-wrap no-print"><div class="stepbar" id="stepbar">${stepbarHtml}</div></div>
    <div class="panel" id="tabContent"></div>`;
  renderTab();
  try{const el=document.getElementById('step_'+view.tab);if(el)el.scrollIntoView({inline:'center',block:'nearest'});}catch(e){}
}
function gotoTab(id){view.tab=id;view.bloco=blocoOf(id);renderDetail();window.scrollTo({top:0,behavior:'smooth'});}
function stepNav(ev){
  const order=tabOrder(ev);const idx=order.indexOf(view.tab);
  const prev=idx>0?order[idx-1]:null;const next=idx<order.length-1?order[idx+1]:null;
  const dots=order.map(id=>`<button class="dot ${id===view.tab?'on':''}" title="${secLabel(ev,id)}" onclick="gotoTab('${id}')"></button>`).join('');
  return `<div class="step-nav">
    <div>${prev?`<button class="btn-ghost" onclick="gotoTab('${prev}')">← ${secLabel(ev,prev)}</button>`:''}</div>
    <div class="step-dots">${dots}</div>
    <div class="nav-right">
      ${next?`<button class="btn-skip" onclick="gotoTab('${next}')">pular etapa</button>
              <button class="btn-primary" onclick="gotoTab('${next}')">Próxima: ${secLabel(ev,next)} →</button>`
            :`<button class="btn-primary" onclick="backToDash()">✓ Concluir</button>`}
    </div>
  </div>`;
}
function renderTab(){
  const ev=getEvent(view.id);const c=document.getElementById('tabContent');
  const s=SECTIONS.find(x=>x.id===view.tab)||SECTIONS[0];
  let html='';
  if(s.kind==='form')html=formHTML(ev);
  else if(s.kind==='menu')html=menuHTML(ev);
  else if(s.kind==='triagemfull'){const f1=FASES.find(x=>x.id==='triagem');const f2=FASES.find(x=>x.id==='negociacao');html=(f1?faseHTML(ev,f1):'')+'<div style="height:16px"></div>'+(f2?faseHTML(ev,f2):'');}
  else if(s.kind==='orc')html=orcHTML(ev);
  else if(s.kind==='equipe')html=equipeHTML(ev);
  else if(s.kind==='cozbar')html=cozbarHTML(ev);
  else if(s.kind==='materiais')html=materiaisHTML(ev);
  else if(s.kind==='layout')html=layoutHTML(ev);
  else if(s.kind==='convidados')html=convidadosHTML(ev);
  else {const f=FASES.find(x=>x.id===view.tab);if(f)html=faseHTML(ev,f);}
  c.innerHTML=html+stepNav(ev);
}
function field(label,key,ev,type="text",hint=""){
  return `<div class="field"><label>${label} ${hint?`<span class="hint">${hint}</span>`:''}</label>
    <input type="${type}" value="${esc(ev[key])}" onchange="setField('${key}',this.value)"></div>`;
}
function selField(label,key,ev,opts){
  return `<div class="field"><label>${label}</label><select onchange="setField('${key}',this.value)">
    ${opts.map(o=>`<option value="${o.v}" ${ev[key]===o.v?'selected':''}>${o.l}</option>`).join('')}</select></div>`;
}

  <div class="form-grid">

    ${field("Horário","horario",ev,"time")}
    ${field("Tempo de duração","duracao",ev,"text","ex: 4h")}
    ${field("Nº de pessoas (dentro)","paxIn",ev,"number")}
    ${field("Nº de pessoas (fora)","paxOut",ev,"number")}
    ${field("Ocasião","ocasiao",ev,"text","aniversário, casamento, corporativo...")}

/* ===== Impressao / PDF do evento ===== */
const SERVICO_LBL={volante:"Volante",ilhas:"Ilhas",jantar:"Jantar",miniporcoes:"Mini porções",brunch:"Brunch",coquetel:"Coquetel",buffet_quente:"Buffet (quente)",outro:"Outro"};
const EXCL_LBL={exclusivo:"Exclusivo do espaço",compartilhado:"Compartilhado"};
const LOCALESP_LBL={cupula_ccmq:"Cúpula CCMQ",interno_ccmq:"Interno CCMQ",todo_ccmq:"Todo CCMQ",jardim_mac:"Jardim MAC",plataforma_mac:"Plataforma MAC",frente_cafe_mac:"Frente ao Café MAC",todo_mac:"Todo MAC",externo:"Evento Externo"};
function unitLogo(local){return local==='mac'?'lola-mac.png.png':'lola-ccmq.png.png';}
function unitColor(local){return local==='mac'?'#2D6A4F':'#A8272A';}
function openPrintDialog(){
  const ev=getEvent(view.id);if(!ev)return;

  if(!m){m=document.createElement('div');m.id='printModal';m.className='pm-overlay';document.body.appendChild(m);}
  m.innerHTML='<div class="pm-box"><h3 style="font-family:var(--serif);color:var(--vinho);margin-bottom:6px">Imprimir / Salvar PDF</h3>'
   +'<p style="color:var(--muted);margin:0 0 16px;font-size:14px">Como você quer gerar o PDF deste evento?</p>'
   +'<div style="display:flex;flex-direction:column;gap:10px">'
   +'<button class="btn-primary" style="padding:12px" onclick="choosePrintSections(true)">💰 Com valores do orçamento</button>'
   +'<button class="btn-ghost" style="padding:12px" onclick="choosePrintSections(false)">📄 Sem valores</button>'
   +'</div><button style="background:none;color:var(--muted);margin-top:12px;width:100%;padding:8px" onclick="closePrintDialog()">Cancelar</button></div>';
  m.style.display='flex';
}
function closePrintDialog(){const m=document.getElementById('printModal');if(m)m.style.display='none';}
async function printEvent(withValues,sel){
  closePrintDialog();
  const ev=getEvent(view.id);if(!ev)return;
  if(sel&&sel.layout){ try{ const r=await sb.from('lola_eventos').select('layout_png').eq('id',ev.id).single(); if(r&&r.data) ev.layoutPng=r.data.layout_png||""; }catch(e){} }
  document.getElementById('printArea').innerHTML=buildPrintHTML(ev,withValues,sel);
  setTimeout(function(){window.print();},400);
}
function choosePrintSections(withValues){
  const ev=getEvent(view.id);if(!ev)return;
  let m=document.getElementById('printModal');
  if(!m){m=document.createElement('div');m.id='printModal';m.className='pm-overlay';document.body.appendChild(m);}
  const secs=relevantSections(ev).filter(function(s){return s.id!=='info'&&!(s.id==='orc'&&!withValues);});
  const rows=secs.map(function(s){return '<label style="display:flex;align-items:center;gap:8px;padding:6px 4px;font-size:14px;cursor:pointer"><input type="checkbox" class="pm-sec" value="'+s.id+'" checked style="width:auto"> '+secLabel(ev,s.id)+'</label>';}).join('');
  m.innerHTML='<div class="pm-box" style="max-width:380px"><h3 style="font-family:var(--serif);color:var(--vinho);margin-bottom:4px">O que incluir no PDF?</h3>'
   +'<p style="color:var(--muted);margin:0 0 10px;font-size:13px">Os dados principais do evento entram sempre. Marque as partes extras:</p>'
   +'<div style="text-align:left;max-height:46vh;overflow:auto;border:1px solid var(--border);border-radius:10px;padding:6px 10px">'+(rows||'<div style="color:#8a7d7d;font-size:13px;padding:6px">Sem partes extras para este evento.</div>')+'</div>'
   +'<div style="display:flex;gap:8px;margin-top:14px"><button class="btn-ghost" style="flex:1;padding:10px" onclick="closePrintDialog()">Cancelar</button><button class="btn-primary" style="flex:1;padding:10px" onclick="doPrintEvent('+withValues+')">Gerar PDF</button></div></div>';
  m.style.display='flex';
}
function doPrintEvent(withValues){
  const sel={}; document.querySelectorAll('.pm-sec:checked').forEach(function(c){sel[c.value]=true;});
  printEvent(withValues,sel);
}
function _pr(label,val){return (val==null||val===''||val==='—')?'':'<div style="display:flex;gap:8px;padding:3px 0;font-size:13px"><span style="min-width:150px;color:#8a7d7d;font-weight:700">'+label+'</span><span style="color:#1E0A0A">'+val+'</span></div>';}
function _pt(t,color){return '<div style="font-family:var(--serif);font-weight:700;color:'+color+';font-size:15px;margin:18px 0 6px;border-bottom:2px solid '+color+';padding-bottom:3px">'+t+'</div>';}
function buildPrintHTML(ev,withValues,sel){
  function inc(id){ return !sel || !!sel[id]; }
  const color=unitColor(ev.local);
  const tp=(TIPOS.find(t=>t.v===ev.tipo)||{}).l||'';
  const loc=ev.local?((LOCAIS.find(l=>l.v===ev.local)||{}).l||''):'';
  const st=(STATUS.find(s=>s.v===ev.status)||{}).l||'';
  let dt='';
  if(ev.data){const d=new Date(ev.data+'T00:00');dt=d.toLocaleDateString('pt-BR')+' · '+d.toLocaleDateString('pt-BR',{weekday:'long'}).toUpperCase();}
  const pax=[ev.paxIn,ev.paxOut].filter(x=>x!=='').join(' + ');
  let h='<div style="-webkit-print-color-adjust:exact;print-color-adjust:exact;font-family:var(--sans);color:#1E0A0A;max-width:760px;margin:0 auto;padding:24px">';
  h+='<div style="height:8px;background:'+color+';border-radius:4px;margin-bottom:16px"></div>';
  h+='<div style="display:flex;align-items:center;gap:18px;margin-bottom:6px"><img src="'+unitLogo(ev.local)+'" alt="Lola" style="height:60px;width:auto" onerror="this.style.display=\'none\'">'
   +'<div><div style="font-size:11px;letter-spacing:1px;text-transform:uppercase;color:'+color+';font-weight:800">'+esc(tp)+(loc?' · '+esc(loc):'')+'</div>'
   +'<div style="font-family:var(--serif);font-size:26px;font-weight:800">'+(esc(ev.nome)||'(evento sem nome)')+'</div>'
   +(st?'<div style="font-size:12px;color:#8a7d7d;font-weight:700">'+esc(st)+'</div>':'')+'</div></div>';
  h+=_pt('Informações gerais',color);
  h+=_pr('Data',dt)+_pr('Horário',esc(ev.horario))+_pr('Duração',esc(ev.duracao))+_pr('Nº de pessoas',pax?(esc(pax)+' pax'):'')+_pr('Ocasião',esc(ev.ocasiao))+_pr('Responsável',esc(ev.responsavel))+_pr('Contato',esc(ev.contato))+_pr('Estilo de serviço',SERVICO_LBL[ev.servico]||'')+_pr('Espaço',EXCL_LBL[ev.exclusividade]||'')+_pr('Local específico',LOCALESP_LBL[ev.cupula]||'')+_pr('Precisa nota/Danfe?',ev.nota==='sim'?'Sim':'');
  if(ev.obs&&ev.obs.trim()){h+=_pt('Observações',color)+'<div style="font-size:13px;white-space:pre-wrap">'+esc(ev.obs)+'</div>';}
  let ckHtml='';
  relevantFases(ev).filter(function(f){return inc(f.id);}).forEach(function(f){
    let items='';
    f.itens.forEach(function(it,i){const ck=ev.checks[f.id+'_'+i]||{};const note=(ck.note||'').trim();
      if(ck.done||note){items+='<div style="font-size:12px;padding:2px 0">'+(ck.done?'✓ ':'• ')+esc(it.t)+(note?(' <span style="color:#8a7d7d">— '+esc(note)+'</span>'):'')+'</div>';}});
    if(items){const fp=faseProgress(ev,f);ckHtml+='<div style="margin:8px 0 4px;font-weight:700;font-size:13px">'+esc(f.nome)+' ('+fp.done+'/'+fp.tot+')</div>'+items;}
  });
  if(ckHtml){h+=_pt('Checklist',color)+ckHtml;}
  const coz=(ev.cozbar||[]).filter(function(r){return r.hora||r.atividade||r.obs;});
  if(coz.length&&inc('cozbar')){h+=_pt('Operacional Cozinha & Bar',color)+'<table style="width:100%;border-collapse:collapse;font-size:12px"><tr style="text-align:left;color:#8a7d7d"><th style="padding:3px">Setor</th><th>Atividade / informações</th></tr>'
    +coz.sort(function(a,b){return (a.setor||'').localeCompare(b.setor||'');}).map(function(r){return '<tr style="border-top:1px solid #eee"><td style="padding:3px;white-space:nowrap;vertical-align:top">'+esc(r.setor||'')+'</td><td style="white-space:pre-wrap">'+esc(r.atividade||'')+'</td></tr>';}).join('')+'</table>';}
  const mat=(ev.materiais||[]).filter(function(r){return r.item;});
  if(mat.length&&inc('materiais')){h+=_pt('Materiais',color)+'<table style="width:100%;border-collapse:collapse;font-size:12px"><tr style="text-align:left;color:#8a7d7d"><th style="width:42px"></th><th style="padding:3px">Material</th><th>Saída</th><th>Qtd saída</th><th>Saiu</th><th>Qtd volta</th><th>Voltou</th><th>Destino</th><th>Obs</th></tr>'
    +mat.map(function(r){return '<tr style="border-top:1px solid #eee"><td>'+(r.foto?('<img src="'+esc(r.foto)+'" style="width:34px;height:34px;object-fit:cover;border-radius:4px">'):'')+'</td><td style="padding:3px">'+esc(r.item)+'</td><td>'+esc(r.origem||'')+'</td><td>'+esc(r.qtdSaida||'')+'</td><td>'+(r.saiu?'✓':'')+'</td><td>'+esc(r.qtdVolta||'')+'</td><td>'+(r.voltou?'✓':'')+'</td><td>'+esc(r.destino||'')+'</td><td>'+esc(r.obs||'')+'</td></tr>';}).join('')+'</table>';}
  if(withValues&&inc('orc')){
    const pax2=Number(ev.pax)||0;let sub=0;(ev.menu||[]).forEach(function(m){sub+=lineTotal(m,pax2);});
    const moV=Number(ev.moValor)||0,moQ=Number(ev.moQtd)||0;const mo=(moV*moQ)||(Number(ev.maoObra)||0);const gpct=Number(ev.gorjeta)||0;const gorj=sub*gpct/100;const ipct=Number(ev.imposto)||0;const imp=(sub+mo+gorj)*ipct/100;const total=sub+mo+gorj+imp;
    if((ev.menu||[]).length){
      h+=_pt('Orçamento',color)+'<table style="width:100%;border-collapse:collapse;font-size:12px"><tr style="text-align:left;color:#8a7d7d"><th style="padding:3px">Item</th><th>Qtd/pax</th><th style="text-align:right">Total</th></tr>'
       +ev.menu.map(function(m){return '<tr style="border-top:1px solid #eee"><td style="padding:3px">'+esc(m.nome)+'</td><td>'+esc(m.qtd)+(m.un?' '+esc(m.un):'')+(m.perPax?'/pax':'')+((m.perPax&&pax2)?(' = '+fmtQty((Number(m.qtd)||0)*pax2)+(m.un?' '+esc(m.un):'')):'')+'</td><td style="text-align:right">'+fmt(lineTotal(m,pax2))+'</td></tr>';}).join('')
       +'</table><div style="margin-top:8px;font-size:13px">'
       +'<div style="display:flex;justify-content:space-between;padding:2px 0"><span>Subtotal cardápio</span><b>'+fmt(sub)+'</b></div>'
       +(mo?('<div style="display:flex;justify-content:space-between;padding:2px 0"><span>Mão de obra'+(moQ?(' ('+moQ+'\u00d7 R$ '+fmt(moV).replace('R$ ','')+')'):'')+'</span><b>'+fmt(mo)+'</b></div>'):'')
       +(gorj?('<div style="display:flex;justify-content:space-between;padding:2px 0"><span>Gorjeta ('+gpct+'%)</span><b>'+fmt(gorj)+'</b></div>'):'')+(imp?('<div style="display:flex;justify-content:space-between;padding:2px 0"><span>Imposto ('+ipct+'%)</span><b>'+fmt(imp)+'</b></div>'):'')
       +'<div style="display:flex;justify-content:space-between;padding:6px 0;border-top:2px solid '+color+';font-weight:800;font-size:15px;color:'+color+'"><span>TOTAL</span><span>'+fmt(total)+'</span></div>'
       +(pax2?('<div style="display:flex;justify-content:space-between;color:#8a7d7d"><span>Por pessoa</span><span>'+fmt(total/pax2)+'</span></div>'):'')+'</div>';
    }
    const pg=ev.pag||{};
    if(pg.forma||pg.sinalValor||pg.obs||(pg.pago&&pg.pago!=='Não')||pg.precisaDanfe==='Sim'){
      h+=_pt('Pagamento',color)+_pr('Forma',esc(pg.forma))+_pr('Pago?',(pg.pago&&pg.pago!=='Não')?pg.pago:'')+_pr('Danfe/Nota?',pg.precisaDanfe==='Sim'?'Sim':'')+_pr('Antecipado?',pg.antecipado?'Sim':'')+_pr('Sinal/entrada',pg.sinalValor?(fmt(pg.sinalValor)+(pg.sinalPago?' (pago)':'')):'')+_pr('Data do sinal',esc(pg.sinalData))+_pr('Data do saldo',esc(pg.saldoData))+(pg.obs?('<div style="font-size:12px;margin-top:4px;white-space:pre-wrap">'+esc(pg.obs)+'</div>'):'');
    }
  }
  const now=new Date().toLocaleString('pt-BR');
  let edinfo='';

function operOrcTotal(ev){var t=0;var f=FASES.find(x=>x.id==='os');if(!f)return 0;f.itens.forEach(function(it,i){if(it.orc){var c=ev.checks['os_'+i];if(c)t+=Number(c.orc)||0;}});return t;}
function extrasTotal(ev){return (ev.orcExtras||[]).reduce(function(t,e){return t+(Number(e.valor)||0);},0);}
function matComprarTotal(ev){return (ev.materiais||[]).reduce(function(t,r){ if(!r.comprar)return t; const q=Number(r.qtdSaida)||1; return t+(Number(r.custo)||0)*q; },0);}
function orcCalc(ev){
  const pax=Number(ev.pax)||0;let sub=0;(ev.menu||[]).forEach(m=>{sub+=lineTotal(m,pax);});
  const gpct=Number(ev.gorjeta)||0;const serv=sub*gpct/100;
  const moV=Number(ev.moValor)||0,moQ=Number(ev.moQtd)||0;const mo=(moV*moQ)||(Number(ev.maoObra)||0);
  const oper=operOrcTotal(ev);const extras=extrasTotal(ev);const mat=matComprarTotal(ev);
  const base=sub+serv+mo+oper+mat+extras;
  const ipct=Number(ev.imposto)||0;const imp=base*ipct/100;
  return {pax,sub,gpct,serv,mo,oper,mat,extras,base,ipct,imp,total:base+imp};
}
function orcTotal(ev){return orcCalc(ev).total;}
function lineTotal(m,pax){const preco=Number(m.preco)||0;return m.perPax?(Number(m.qtd)||0)*pax*preco:(Number(m.qtd)||0)*preco;}

function propMesAno(ev){
  if(!ev.data) return '';

  const d=new Date(ev.data+'T00:00');
  return M[d.getMonth()]+'/'+d.getFullYear();
}
function propPorcoes(ev){
  const pax=Number(ev.pax)||0;let t=0;
  (ev.menu||[]).forEach(function(m){ if(mcat(m)==='C') t+=(m.perPax?(Number(m.qtd)||0)*pax:(Number(m.qtd)||0)); });
  return Math.round(t);
}
function propSecoes(ev,lado){
  const out=[];
  (ev.menu||[]).forEach(function(m){
    if(mcat(m)==='M')return;
    const sec=m.secao||'Outros';
    const naDir=PROP_DIR.indexOf(sec)>=0;
    if((lado==='dir')!==naDir)return;
    let g=out.find(function(x){return x.t===sec;});
    if(!g){g={t:sec,itens:[]};out.push(g);}
    g.itens.push(m);
  });
  return out;
}

async function enviarPedidoCentral(){
  var ev=getEvent(view.id);ev.pag=ev.pag||{};

  var total=orcTotal(ev);var pax=Number(ev.pax)||0;

    var last=await sb.from('lola_pedidos').select('numero_pedido').order('numero_pedido',{ascending:false}).limit(1);
    if(last.data&&last.data[0]&&last.data[0].numero_pedido)num=Number(last.data[0].numero_pedido)+1;

async function uploadPagFile(inputEl,field){
  const f=inputEl&&inputEl.files&&inputEl.files[0]; if(!f) return;
  const ev=getEvent(view.id); ev.pag=ev.pag||{};
  showFlash('Enviando '+f.name+'…');
  try{
    const safe=f.name.replace(/[^\w.\-]+/g,'_');
    const path='eventos/'+ev.id+'/'+field+'/'+Date.now()+'_'+safe;
    const up=await sb.storage.from('anexos').upload(path,f,{upsert:true,contentType:f.type||'application/octet-stream'});
    if(up.error) throw up.error;
    const url=sb.storage.from('anexos').getPublicUrl(path).data.publicUrl;
    if(field==='comprovante'){ ev.pag.comprovantes=ev.pag.comprovantes||[]; ev.pag.comprovantes.push({url:url,name:f.name}); }
    else { ev.pag[field]={url:url,name:f.name}; }
    save(); renderTab(); showFlash(f.name+' anexado ✓');

  h+='<div style="height:8px;background:#A8272A;border-radius:4px;margin-bottom:14px"></div>';
  h+='<div style="font-family:var(--serif);font-size:24px;font-weight:800;color:#A8272A">Eventos Lola — Lista geral</div>';
  h+='<div style="font-size:12px;color:#8a7d7d;margin-bottom:14px">'+evs.length+' evento(s) · gerado em '+new Date().toLocaleString('pt-BR')+'</div>';
  h+='<table style="width:100%;border-collapse:collapse;font-size:12px"><tr style="text-align:left;color:#8a7d7d;border-bottom:2px solid #A8272A"><th style="padding:5px 4px">Evento</th><th>Unidade</th><th>Data</th><th>Horário</th><th>Pax</th><th>Status</th><th>Responsável</th><th style="text-align:right">Orçamento</th></tr>';
  evs.forEach(function(e){var st=(STATUS.find(function(s){return s.v===e.status;})||{}).l||'';var loc=e.local?((LOCAIS.find(function(l){return l.v===e.local;})||{}).l||''):'';var pax=[e.paxIn,e.paxOut].filter(function(x){return x!=='';}).join('+');h+='<tr style="border-bottom:1px solid #eee"><td style="padding:5px 4px;font-weight:700">'+esc(e.nome||'(sem nome)')+'</td><td>'+esc(loc)+'</td><td>'+fmtData(e.data)+'</td><td>'+esc(e.horario||'')+'</td><td>'+esc(pax)+'</td><td>'+esc(st)+'</td><td>'+esc(e.responsavel||'')+'</td><td style="text-align:right">'+fmt(orcTotal(e))+'</td></tr>';});
  h+='</table><div style="margin-top:16px;font-size:10px;color:#8a7d7d">equipelola.net · Eventos</div></div>';
  document.getElementById('printArea').innerHTML=h;
  setTimeout(function(){window.print();},250);
}
init();
</script>
<div id="printArea"></div>
</body>
