<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estoque — Lola Bar</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/duotone/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--v:#A82A2A;--ve:#7E1E1F;--rf:#FBF7F1;--rb:#ECE3D9;--rt:#F5E9E6;--rm:#B79A8E;--tx:#2A1A17;--ts:#5A463E;--vd:#2C7A4B;--am:#9A6B1E;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Manrope',sans-serif;background:var(--rf);color:var(--tx);min-height:100vh;}
/* TOPBAR */
.topbar{background:#fff;border-bottom:2px solid var(--rb);padding:0 24px;height:72px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:0 2px 12px rgba(170,43,43,.09);}
.logo-area{display:flex;align-items:center;gap:14px;}
.logo-svg-wrap{height:52px;display:flex;align-items:center;}
.logo-svg-wrap svg{height:52px;width:auto;}
.logo-div{width:1.5px;height:34px;background:var(--rb);}
.logo-app{font-size:11px;font-weight:800;color:var(--ts);letter-spacing:2px;text-transform:uppercase;}
.topbar-date{font-size:12px;font-weight:600;color:var(--ts);}
/* LAYOUT */
.app-body{display:flex;min-height:calc(100vh - 72px);}
.sidebar{width:210px;background:#fff;border-right:1.5px solid var(--rb);position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto;flex-shrink:0;padding:10px 0 20px;}
.ns{padding:12px 16px 4px;font-size:9px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--rm);}
.ni{display:flex;align-items:center;gap:9px;padding:9px 16px;cursor:pointer;color:var(--ts);font-size:13px;font-weight:600;border-left:3px solid transparent;transition:all .15s;}
.ni:hover{background:var(--rf);color:var(--v);}
.ni.active{background:var(--rt);color:var(--v);border-left-color:var(--v);font-weight:700;}
.ni i{font-size:18px;flex-shrink:0;}
.ni-badge{margin-left:auto;background:var(--v);color:#fff;font-size:11px;font-weight:800;min-width:20px;height:20px;padding:0 6px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.main{flex:1;padding:22px 22px;overflow-x:hidden;width:100%;max-width:980px;margin:0 auto;}
.ph{margin-bottom:18px;}
.ph h2{font-family:'Fraunces',serif;font-size:23px;font-weight:700;color:var(--v);}
.ph p{font-size:12px;color:var(--ts);margin-top:2px;}
/* Cabeçalho padrão Lola v2 (transparente sobre o creme) */
.bhead{background:transparent;color:var(--tx);padding:12px 15px 12px;border-radius:0;margin:-22px -22px 16px;border-bottom:1px solid #EFE6DC;}
.bhead-row{display:flex;align-items:center;gap:10px;}
.bhead-menu,.bhead-ic{width:40px;height:40px;flex-shrink:0;background:#fff;border:1px solid var(--rb);border-radius:13px;color:var(--v);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:19px;padding:0;position:relative;}
.bhead-menu i{font-size:20px;}
.bhead-mid{flex:1;min-width:0;}
.bhead-title{font-family:'Fraunces',serif;font-weight:600;font-size:20px;color:var(--v);line-height:1.05;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bhead-sub{color:#8A7A72;font-size:12px;font-weight:600;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
/* CARDS */
.card{background:#fff;border:1.5px solid var(--rb);border-radius:14px;padding:18px;}
.sc{background:#fff;border:1.5px solid var(--rb);border-radius:14px;padding:18px 20px;}
.sci{font-size:26px;margin-bottom:5px;color:var(--v);line-height:1;}
.scl{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:var(--ts);}
.scv{font-family:'Fraunces',serif;font-size:30px;font-weight:700;color:var(--v);margin-top:3px;}
.scs{font-size:11px;color:var(--ts);margin-top:1px;}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px;}
/* INSUMO CARD (v2) */
.ins-card{background:#fff;border:1px solid var(--rb);border-radius:16px;padding:13px 14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(42,26,23,.05);}
.ins-top{display:flex;align-items:flex-start;gap:10px;}
.ins-info{flex:1;min-width:0;}
.ins-nome{font-size:15px;font-weight:700;color:var(--tx);}
.ins-meta{display:flex;gap:8px;align-items:center;margin-top:4px;flex-wrap:wrap;}
.ins-un{font-size:11px;color:#8A7A72;}
.ins-custo{text-align:right;flex-shrink:0;}
.ins-custo-lb{font-size:10px;color:#8A7A72;text-transform:uppercase;letter-spacing:1px;}
.ins-custo-v{font-family:'Fraunces',serif;font-size:18px;font-weight:600;color:var(--v);}
.ins-upd{display:flex;align-items:center;gap:5px;margin-top:9px;padding-top:9px;border-top:1px solid #F3EBE2;font-size:11px;color:#8A7A72;}
.ins-upd b{color:var(--ts);font-weight:700;}
.ins-upd i{font-size:14px;flex-shrink:0;}
.ins-upd-none{color:#B79A8E;}
.ins-btns{display:flex;gap:6px;margin-top:10px;justify-content:flex-end;}
.ins-ab{flex:0 0 auto;width:46px;height:36px;background:#F7F1EA;border:1px solid var(--rb);border-radius:11px;color:var(--v);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.ins-ab.del{background:#FBEAE7;border-color:#F3D3CE;color:#B5302E;}
.ins-ab.warn{background:#FBF0DD;border-color:#F1DFB8;color:#9A6B1E;}
/* INSUMO PLANILHA (v4) */
.ins-sech{display:flex;align-items:center;gap:8px;margin:16px 0 6px;}
.ins-sech .sq{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
.ins-sech .nm{font-family:'Fraunces',serif;font-size:14px;font-weight:600;}
.ins-sech .ct{font-size:11px;color:#A08B7F;}
.ins-tbl{background:#fff;border:1px solid var(--rb);border-radius:12px;overflow:hidden;box-shadow:0 1px 2px rgba(42,26,23,.05);}
/* 17/07: handoff "Tabela enxuta 1a" — dot de categoria, meta sob o nome, preço Fraunces, menu ⋯ */
.ins-hd,.ins-row{display:grid;grid-template-columns:minmax(0,1fr) 132px 44px;align-items:center;gap:12px;padding:9px 20px;}
.ins-hd{background:#F1E8DF;border-bottom:1px solid var(--rb);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#B79A8E;font-weight:700;}
.ins-row{border-top:1px solid #F2EAE0;transition:background .12s ease;padding:13px 20px;}
.ins-row:first-child{border-top:0;}
.ins-row:hover{background:#FAF9F5;}
.ins-row:hover .ins-more{opacity:1;}
.ins-rnome{min-width:0;display:flex;align-items:center;gap:11px;}
.ins-dot{width:11px;height:11px;border-radius:4px;flex-shrink:0;}
.ins-rnw{min-width:0;flex:1;}
.ins-rnl{display:flex;align-items:center;gap:7px;min-width:0;}
.ins-rnome-t{font-size:15px;font-weight:800;letter-spacing:-.01em;line-height:1.2;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
.ins-rmeta{font-size:12px;font-weight:600;color:#8A7A72;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ins-rmeta.none{color:#B79A8E;}
.ins-alert{width:20px;height:20px;border:0;border-radius:999px;background:#F6ECD9;color:#9A6B1E;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;padding:0;}
.ins-more{width:34px;height:34px;border-radius:10px;border:1px solid var(--rb);background:#fff;color:#5A463E;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;opacity:.35;transition:opacity .12s ease;justify-self:end;}
.ins-more.on{opacity:1;border-color:#F0D9CF;background:#FBEAE7;color:var(--v);}
.ins-menu{position:absolute;top:46px;right:0;z-index:20;width:184px;background:#fff;border:1px solid var(--rb);border-radius:13px;box-shadow:0 20px 44px rgba(42,26,23,.18);padding:6px;}
.ins-menu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;font:inherit;font-size:13px;font-weight:700;color:var(--tx);padding:9px 10px;border-radius:9px;cursor:pointer;text-align:left;}
.ins-menu button:hover{background:#FAF9F5;}
.ins-menu button.del{color:#B5302E;}
.ins-run{font-size:11px;color:#A08B7F;font-weight:500;}
.ins-rupd{font-size:11px;color:#7C6A60;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ins-rupd b{color:#5F4E46;font-weight:700;}
.ins-rupd.none{color:#B79A8E;}
.ins-rcusto{text-align:right;white-space:nowrap;}
.ins-rcusto-v{font-family:'Fraunces',serif;font-size:21px;font-weight:600;color:#7E1E1F;line-height:1;font-variant-numeric:tabular-nums;}
.ins-rcusto-u{font-size:10px;font-weight:700;color:#B79A8E;text-transform:uppercase;letter-spacing:.1em;margin-top:4px;line-height:1.2;}
/* onde é usado — expande na própria linha */
.ins-rnome{cursor:pointer;}
.ins-semrec{flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;margin-left:7px;background:#FBF0DD;border:1px solid #F1DFB8;color:#9A6B1E;border-radius:50px;padding:1px 8px;font-size:10px;font-weight:700;white-space:nowrap;}
.ins-caret{flex:0 0 auto;}
.ins-usos{grid-column:1/-1;background:#FAF4EC;border:1px solid #EFE3D4;border-radius:10px;padding:9px 12px;margin-top:8px;font-size:12px;color:#5F4E46;line-height:1.6;}
.ins-usos b{color:var(--v);}
.ins-usos .ug+.ug{margin-top:4px;}
.ins-usos .uinfo{color:#8A7A72;}
.ins-caret{font-size:12px;color:#B79A8E;margin-left:5px;transition:transform .15s;display:inline-block;}
.ins-row.open .ins-caret{transform:rotate(90deg);}
/* ===== FICHAS TÉCNICAS — lista (v4) ===== */
.ft-hd,.ft-row{display:grid;grid-template-columns:minmax(0,1fr) 92px 92px 62px 118px 132px;align-items:center;gap:10px;padding:9px 14px;}
.ft-hd{background:#FAF4EC;border-bottom:1px solid var(--rb);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#A08B7F;font-weight:700;}
.ft-row{border-top:1px solid #F3EBE2;}
/* 18/07: ficha INATIVA (fora do menu) fica com cor mais fraquinha — pedido da Bianca */
.ft-row.inat{opacity:.5}
.ft-row:first-child{border-top:0;}
.ft-row:hover{background:#FCF8F2;}
.ft-row.alerta{background:#FFF7F6;}
.ft-row.alerta:hover{background:#FDEFED;}
.ft-nome{font-size:14px;font-weight:700;color:var(--tx);min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:5px;}
.ft-nome-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
.ft-sel{flex:0 0 auto;font-size:10px;font-weight:800;padding:1px 7px;border-radius:50px;color:#fff;}
.ft-rev{flex:0 0 auto;display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;padding:1px 7px;border-radius:50px;background:#FBF0DD;color:#9A6B1E;border:1px solid #F1DFB8;cursor:pointer;}
.ft-cmvalto{flex:0 0 auto;display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;padding:1px 7px;border-radius:50px;background:#FBEAE7;color:#B5302E;border:1px solid #F3D3CE;white-space:nowrap;}
.ft-pronto{flex:0 0 auto;display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;padding:1px 7px;border-radius:50px;background:#EAF1F7;color:#2C5AA0;border:1px solid #CFDFEE;white-space:nowrap;}
/* ── SEPARAÇÃO DAS COZINHAS: faixa + aviso "escondidas" ── */
/* Saíram em 17/07 as classes .coz-faixa (a faixa azul "Você está na Cozinha Central")
   e .coz-outras (a "X são feitas em outra cozinha — Ver assim mesmo"): eram o andaime
   da separação das cozinhas. Separadas de verdade, viraram ruído. */
/* ── RECÁLCULO DE PREÇOS (cascata) ── */
.csc-res{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
.csc-c{flex:1 1 110px;background:#fff;border:1px solid var(--rb);border-radius:12px;padding:10px 13px;}
.csc-c b{display:block;font-family:'Fraunces',serif;font-size:26px;font-weight:600;line-height:1.05;}
.csc-c i{display:block;font-style:normal;font-size:10px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:#A08B7F;margin-top:2px;}
.csc-exp{font-size:12px;line-height:1.55;color:#7C6A60;margin:0 0 14px;}
.csc-sec{font-family:'Fraunces',serif;font-size:15px;font-weight:600;color:var(--v);margin:20px 0 8px;display:flex;align-items:center;gap:7px;}
.csc-sec u{font-family:'Manrope',sans-serif;text-decoration:none;font-size:10px;font-weight:800;background:var(--rf);color:#7C6A60;border-radius:50px;padding:2px 8px;}
.csc-sec.trava{color:#B5302E;}
.csc-tbl{border:1px solid var(--rb);border-radius:12px;overflow:hidden;background:#fff;}
.csc-hd,.csc-row{display:grid;grid-template-columns:1fr 86px 86px 112px;gap:8px;align-items:center;padding:8px 12px;}
.csc-hd{background:var(--rf);font-size:9px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#A08B7F;}
.csc-hd>*+*,.csc-row>*+*{text-align:right;}
.csc-row{border-top:1px solid var(--rb);font-size:13px;}
.csc-nome{font-weight:600;color:var(--tx);}
.csc-tag{font-size:9px;font-weight:800;text-transform:uppercase;background:#FBF0DD;color:#9A6B1E;border-radius:5px;padding:1px 5px;margin-left:5px;}
.csc-v{font-variant-numeric:tabular-nums;color:#8A7A72;white-space:nowrap;}
.csc-v.novo{font-weight:700;font-family:'Fraunces',serif;font-size:14px;}
.csc-v.novo.sobe{color:#B5302E;}
.csc-v.novo.desce{color:#2C7A4B;}
.csc-u{font-size:12px;color:#8A7A72;white-space:nowrap;}
.csc-d{font-weight:800;font-size:11px;}
.csc-d.sobe{color:#B5302E;}
.csc-d.desce{color:#2C7A4B;}
.csc-cmv{font-weight:700;font-variant-numeric:tabular-nums;}
.csc-cmv.alto{color:#B5302E;}
.csc-trv{display:flex;flex-direction:column;gap:8px;}
.csc-trvi{background:#FDF3F2;border:1px solid #F0D5D3;border-left:3px solid #B5302E;border-radius:10px;padding:10px 12px;}
.csc-trvn{font-weight:700;font-size:13px;color:var(--tx);}
.csc-tp{font-size:9px;font-weight:800;text-transform:uppercase;color:#A08B7F;margin-left:4px;}
.csc-trvm{font-size:12px;line-height:1.5;color:#8A5A56;margin-top:3px;}
.csc-trvv{font-size:11px;color:#8A7A72;margin-top:4px;}
.csc-ok{text-align:center;padding:24px 12px;}
.csc-ok>i{font-size:52px;color:#2C7A4B;}
.csc-okt{font-family:'Fraunces',serif;font-size:22px;font-weight:600;color:var(--v);margin-top:4px;}
.csc-okd{font-size:13px;line-height:1.6;color:#7C6A60;margin-top:6px;}
.csc-okn{font-size:11px;color:#A08B7F;margin-top:14px;}
@media(max-width:640px){
  .csc-hd{display:none;}
  .csc-row{display:block;padding:11px 12px;}
  .csc-row>*+*{text-align:left;}
  .csc-nome{margin-bottom:5px;}
  .csc-v,.csc-u{display:inline-block;margin:0 14px 0 0;}
  .csc-v::before{content:'hoje ';font-size:9px;font-weight:800;text-transform:uppercase;color:#A08B7F;}
  .csc-v.novo::before{content:'vira ';}
}
.ft-num{text-align:right;font-family:'Fraunces',serif;font-size:15px;font-weight:600;color:var(--v);white-space:nowrap;}
.ft-num.pv{color:var(--tx);}
.ft-num.vazio{font-family:'Manrope',sans-serif;font-size:11px;font-weight:400;color:#B79A8E;}
.ft-ed{font-size:11px;color:#7C6A60;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ft-cmvcel{display:flex;justify-content:flex-end;}
.ft-acts{display:flex;gap:5px;justify-content:flex-end;}
/* no desktop o agrupador é invisível pro grid; no celular vira flex (ver @media) */
.ft-mob{display:contents;}
.ft-sort{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 10px;}
.ft-sort-lb{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#A08B7F;}
.ft-sb{background:#fff;border:1px solid var(--rb);border-radius:50px;padding:5px 12px;font-size:12px;font-weight:600;color:#6B5A52;cursor:pointer;font-family:'Manrope',sans-serif;display:inline-flex;align-items:center;gap:4px;}
.ft-sb.on{background:var(--v);border-color:var(--v);color:#fff;}
/* CELULAR: a linha vira CARD (regra Lola: nada de tabela espremida).
   Antes o nome dividia espaço com as etiquetas num grid apertado e era esmagado a zero
   — a tela mostrava só a etiqueta e o preço, sem o nome do prato. */
@media(max-width:900px){
  .ft-hd{display:none;}
  .ft-row{display:block;padding:12px 14px;}
  .ft-nome{display:block;font-size:15px;margin-bottom:8px;}
  .ft-nome-t{display:block;white-space:normal;overflow:visible;margin-bottom:5px;}
  .ft-sel,.ft-rev,.ft-cmvalto,.ft-pronto{display:inline-flex;margin:0 4px 0 0;}
  .ft-mob{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;margin-bottom:10px;}
  .ft-mob>*{text-align:left!important;}
  .ft-mob>*::before{display:block;font-size:9px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#A08B7F;font-family:'Manrope',sans-serif;margin-bottom:1px;}
  .ft-mob>.ft-num:first-child::before{content:'Custo/porção';}
  .ft-pv::before{content:'Preço venda';}
  .ft-cmvcel{display:block;}
  .ft-cmvcel::before{content:'CMV';}
  .ft-cmvcel>div{justify-content:flex-start;}
  .ft-ed{display:block;font-size:11px;color:#7C6A60;}
  .ft-ed::before{content:'Editado';}
  .ft-acts{justify-content:stretch;gap:6px;}
  .ft-acts .ins-sb{flex:1 1 0;height:38px;}
}
.ins-racts{display:flex;gap:5px;justify-content:flex-end;}
.ins-sb{width:28px;height:28px;border-radius:8px;background:#F7F1EA;border:1px solid var(--rb);color:var(--v);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ins-sb.del{background:#FBEAE7;border-color:#F3D3CE;color:#B5302E;}
@media(max-width:640px){
  .ins-hd,.ins-row{grid-template-columns:minmax(0,1fr) auto auto;gap:8px;padding:11px 14px;}
  .ins-hd-upd,.ins-rupd{display:none;}
  .ins-more{opacity:1;}
  .ins-sb{width:32px;height:32px;font-size:15px;}
}
/* CONTAGEM item card (v2) */
.cont-card{background:#fff;border:1px solid var(--rb);border-radius:16px;padding:12px 14px;margin-bottom:9px;box-shadow:0 1px 2px rgba(42,26,23,.05);}
.cont-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.cont-nome{font-size:14px;font-weight:700;color:var(--tx);}
.cont-st{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;white-space:nowrap;}
.cont-dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0;}
.cont-meta{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:8px;}
.cont-cl{font-size:9px;color:#8A7A72;text-transform:uppercase;letter-spacing:.5px;}
.cont-cv{font-size:13px;font-weight:700;color:var(--tx);}
.cont-edit{margin-left:auto;width:40px;height:34px;background:#F7F1EA;border:1px solid var(--rb);border-radius:10px;color:var(--v);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
@media(max-width:768px){
  .ins-btns{justify-content:stretch;}
  .ins-ab{flex:1 1 0;width:auto;height:38px;}
}
/* PEDIDO CARD (v2) */
.ped-card{background:#fff;border:1px solid var(--rb);border-radius:16px;padding:13px 14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(42,26,23,.05);}
.ped-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}

  // Overlay mobile
  const mobOv=div('mob-overlay');
  app.appendChild(mobOv);
  function openSidebar(){sb.classList.add('open');mobOv.classList.add('open');}

        const statuses={em_producao:'Em produção',pronto_entrega:'Pronto para entrega',recebido_completo:'Recebido completo',recebido_divergencia:'Recebido c/ diverg.',cancelado:'Cancelado'};
        Object.entries(statuses).forEach(([v,l])=>{const o=document.createElement('option');o.value=v;o.textContent=l;if(v===p.status)o.selected=true;sel.appendChild(o);});

function mkStat(ic,lb,val,sub,col){

async function pgIns(c){
  c.appendChild(ld());
  try{
    _ins=await db('lola_insumos','GET',null,'?select=*&ativo=eq.true&order=categoria.asc,nome.asc');
    // quais insumos entram em alguma pré-produção ou ficha (mesma função que a Central usa)
    try{ const uu=await db('rpc/central_insumos_usados','POST',{});
         _insUsados=new Set((uu||[]).map(x=>(x&&typeof x==='object')?Object.values(x)[0]:x)); }
    catch(e){ _insUsados=null; }
    c.innerHTML='';
    // filtros de categoria
    const CATS_ORDER=['Bebidas Alcoólicas','Bebidas Não Alcoólicas','Cervejas','Vinhos','Carnes e Pescados','Hortifruti','Insumos Alimentos','Limpeza','Pães'];
    const CAT_COR={'Bebidas Alcoólicas':'#534AB7','Bebidas Não Alcoólicas':'#185FA5','Cervejas':'#9A6B1E','Vinhos':'#993556','Carnes e Pescados':'#A32D2D','Hortifruti':'#3B6D11','Insumos Alimentos':'#854F0B','Limpeza':'#0F6E56','Pães':'#993C1D'};
    function mkSecH(cat,n){const cor=CAT_COR[cat]||'#A82A2A';const sh=div('ins-sech');sh.innerHTML='<span class="sq" style="background:'+cor+'"></span><span class="nm" style="color:'+cor+'">'+cat+'</span><span class="ct">'+n+' '+(n===1?'item':'itens')+'</span>';return sh;}
    const cats=CATS_ORDER.filter(c=>_ins.some(i=>i.categoria===c));
    let filtCat='Todos';let filtBusca='';
    const tabW=div('tabs');
    function mkCatTabs(){
      tabW.innerHTML='';
      ['Todos',...cats].forEach(cat=>{
        const LABELS={'Bebidas Alcoólicas':'Alcoólicas','Bebidas Não Alcoólicas':'Não Alcoólicas','Cervejas':'Cervejas','Vinhos':'Vinhos','Carnes e Pescados':'Carnes','Hortifruti':'Hortifruti','Insumos Alimentos':'Alimentos','Limpeza':'Limpeza','Pães':'Pães'};
        const p=span('tp'+(cat===filtCat?' active':''),cat==='Todos'?'Todos':(LABELS[cat]||cat));
        p.addEventListener('click',()=>{filtCat=cat;mkCatTabs();drawIns($('#ins-t'));});
        tabW.appendChild(p);
      });
    }
    mkCatTabs();
    c.appendChild(tabW);
    c.appendChild(div('abar no-print',[
      mkSearch(q=>{filtBusca=q;drawIns($('#ins-t'));},'Buscar insumo...'),
      div('fl_ gap2',[
        el('button','btn bo bsm',null,{html:'<i class="ph-duotone ph-download-simple"></i> Baixar planilha',onclick:()=>exportInsumosXlsx()}),
        el('button','btn bo bsm',null,{html:'<i class="ph-duotone ph-upload-simple"></i> Conferir preços',onclick:()=>nav('conferencia')}),
        el('button','btn bo bsm',null,{html:'<i class="ph-duotone ph-currency-dollar"></i> Atualizar preços',onclick:()=>modalPrecos()}),
        el('button','btn bo bsm',null,{html:'<i class="ph-duotone ph-arrows-clockwise"></i> Recalcular receitas',title:'Leva o preço dos insumos até as pré-produções e as fichas. Mostra tudo antes de gravar.',onclick:()=>abrirRecalculo()}),
        el('button','btn bp bsm',null,{html:'<i class="ph-duotone ph-plus"></i> Novo insumo',onclick:()=>modalIns()}),
      ],{style:'flex-wrap:wrap'})
    ]));
    const w=div(null,null,{id:'ins-t'});c.appendChild(w);
    function drawIns(w){
      w.innerHTML='';
      let f=_ins;
      if(filtCat!=='Todos')f=f.filter(i=>i.categoria===filtCat);
      if(filtBusca)f=f.filter(i=>i.nome.toLowerCase().includes(filtBusca.toLowerCase()));
      if(!f.length){w.appendChild(em('🧂','Nenhum insumo encontrado'));return;}
      // agrupar por categoria se estiver em "Todos"
      if(filtCat==='Todos'){
        const grupos={};f.forEach(i=>{if(!grupos[i.categoria])grupos[i.categoria]=[];grupos[i.categoria].push(i);});
        Object.entries(grupos).forEach(([cat,itens])=>{
          w.appendChild(mkSecH(cat,itens.length));
          w.appendChild(mkInsTable(itens));
        });
      }else{
        w.appendChild(mkSecH(filtCat,f.length));
        w.appendChild(mkInsTable(f));
      }
    }
    window._drawIns=drawIns;
    drawIns(w);
  }catch(e){c.innerHTML='<p style="color:red;padding:20px">'+e.message+'</p>';}
}

/* onde é usado: só marcamos "fora de receita" nas categorias que DEVERIAM estar numa */
var _insUsados=null;
const INS_CATS_RECEITA=new Set(['Insumos Alimentos','Carnes e Pescados','Hortifruti','Pães']);
function insForaDeReceita(i){
  if(!_insUsados) return false;                       // não carregou → não acusa
  if(!INS_CATS_RECEITA.has(i.categoria)) return false; // bebida/limpeza/descartável: normal não estar
  return !_insUsados.has(i.id);
}
async function toggleUsosIns(row,i){
  let box=row.querySelector('.ins-usos');
  if(box){ box.remove(); row.classList.remove('open'); return; }
  row.classList.add('open');
  box=div('ins-usos'); box.innerHTML='<span class="uinfo">buscando…</span>'; row.appendChild(box);
  try{
    const r=await db('rpc/central_insumo_usos','POST',{iid:i.id});
    const d=Array.isArray(r)?r[0]:r;
    const pp=(d&&d.preproducoes)||[], pr=(d&&d.pratos)||[];
    if(!pp.length&&!pr.length){ box.innerHTML='<span class="uinfo">Não entra em nenhuma receita cadastrada.</span>'; return; }
    let h='';
    if(pp.length) h+='<div class="ug"><b>Pré-produções ('+pp.length+'):</b> '+pp.map(x=>_uEsc(x)).join(' · ')+'</div>';
    if(pr.length) h+='<div class="ug"><b>Pratos ('+pr.length+'):</b> '+pr.map(x=>_uEsc(x)).join(' · ')+'</div>';
    box.innerHTML=h;
  }catch(e){ box.innerHTML='<span class="uinfo">Erro ao buscar: '+_uEsc(e.message)+'</span>'; }
}
function _uEsc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
/* unidade de custo por extenso — aparece embaixo do preço */
const INS_UN_EXT={kg:'por quilo',g:'por grama',L:'por litro',l:'por litro',ml:'por ml',un:'por unidade',cx:'por caixa',pct:'por pacote',molho:'por molho'};
function insUnExt(u){const s=String(u==null?'':u).trim();return INS_UN_EXT[s]||INS_UN_EXT[s.toLowerCase()]||('por '+(s||'unidade'));}
/* dot de categoria (handoff): cor s\u00F3lida + halo da mesma fam\u00EDlia */
function insDotCor(cat){
  const c=String(cat||'').toLowerCase();
  if(/hortifruti/.test(c)) return ['#2C7A4B','#E6F3EA'];
  if(/carne|pescad/.test(c)) return ['#B5302E','#FBEAE7'];
  if(/aliment|p[a\u00E3]es|p[a\u00E3]o/.test(c)) return ['#C99A33','#FBF1DD'];
  if(/limpeza|expediente|descart/.test(c)) return ['#7E5BA6','#EFE7F6'];
  return ['#1F7A6B','#E2F0EC'];
}
function fecharInsMenu(){ document.querySelectorAll('.ins-menu').forEach(m=>m.remove()); document.querySelectorAll('.ins-more.on').forEach(b=>b.classList.remove('on')); }
document.addEventListener('click',e=>{ if(!e.target.closest('.ins-menu')&&!e.target.closest('.ins-more')) fecharInsMenu(); });

function modalIns(item){
  const ed=!!item;
  // Compatibilidade: converter unidade_compra antiga 'g/ml' para unidade real
  const _unCompraReal=(()=>{
    const uc=item?.unidade_compra;
    if(!uc||uc==='g/ml') return (item?.unidade_custo==='L'?'ml':'g');
    if(uc==='un') return 'un';
    return uc; // já é valor real (g, ml, kg, L, etc)
  })();
  let f={
    categoria:item?.categoria||'Hortifruti',
    nome:item?.nome||'',
    unidade_compra:_unCompraReal,
    unidade_custo:item?.unidade_custo||'kg',
    qtd_comprada:item?.qtd_comprada||1000,
    valor_pago:item?.valor_pago||'',
    custo_por_unidade:item?.custo_por_unidade||0
  };

  // Unidades disponíveis para compra (a que aparece na embalagem)
  const UNS_COMPRA_GM=['g','ml']; // peso/volume pequeno
  const UNS_COMPRA_BIG=['kg','L']; // peso/volume grande
  const UNS_ESPECIAIS=['un','cx','pct','maço','dz'];
  const todasUns=[...UNS_COMPRA_GM,...UNS_COMPRA_BIG,...UNS_ESPECIAIS];

  // Unidade de custo depende do tipo
  function unsCusto(){
    if(f.unidade_compra==='g') return ['g','kg'];
    if(f.unidade_compra==='ml') return ['ml','L'];
    if(f.unidade_compra==='kg') return ['kg','g'];
    if(f.unidade_compra==='L') return ['L','ml'];
    if(['g/ml'].includes(f.unidade_compra)) return ['kg','L','g','ml'];
    return ['un','cx','pct','maço','dz','kg','g','ml','L'];
  }

  function calcCusto(){
    const vp=parseFloat(f.valor_pago)||0;
    const qc=parseFloat(f.qtd_comprada)||1;
    const uc=f.unidade_custo||'kg';
    const ucompra=f.unidade_compra||'g';
    // compra em g ou ml → custo em kg/L: multiplica por 1000
    if(['g','ml'].includes(ucompra)){
      if(['kg','L'].includes(uc)) return (vp/qc)*1000;
      return vp/qc;
    }
    // compra em kg → custo em kg: direto
    if(ucompra==='kg') return vp/qc;
    // compra em L → custo em L: direto
    if(ucompra==='L') return vp/qc;
    // un, cx, pct, maço, dz → direto
    return vp/qc;
  }

  const custoEl=div('custo-box mt2');
  // Campo de conversão: aparece quando unidade de compra ≠ unidade de uso
  // Ex: compra em "maço" mas usa em "g" → precisa saber quantas gramas tem 1 maço
  let f_conversao=parseFloat(item?.conversao_qtd)||0; // qtd da unidade de uso por 1 unidade de compra
  const conversaoWrap=div(null);
  conversaoWrap.style.marginBottom='8px';

  function precisaConversao(){
    const compra=f.unidade_compra||'';
    const uso=f.unidade_custo||'';
    // Se são unidades do mesmo sistema (g↔kg, ml↔L) não precisa conversão manual
    const mesmoPeso=['g','kg'].includes(compra)&&['g','kg'].includes(uso);
    const mesmoVol=['ml','L'].includes(compra)&&['ml','L'].includes(uso);
    const mesmoUn=compra===uso;
    return !mesmoPeso&&!mesmoVol&&!mesmoUn;
  }

  function atualizaConversaoWrap(){
    // Usar display em vez de innerHTML para não quebrar event listeners
    if(!precisaConversao()){conversaoWrap.style.display='none';return;}
    conversaoWrap.style.display='';
    if(conversaoWrap.querySelector('input'))return; // já foi renderizado
    conversaoWrap.style.display='';
    const compra=f.unidade_compra||'un';
    const uso=f.unidade_custo||'g';
    const inpConv=el('input','fi',null,{type:'number',step:'0.1',min:'0',
      value:f_conversao||'',placeholder:'Ex: 150'});
    inpConv.addEventListener('input',e=>{f_conversao=parseFloat(e.target.value)||0;atualizaCusto();});
    const msg=div('al ali');
    msg.style.cssText='margin-top:6px;font-size:12px';
    msg.textContent='Quantos '+uso+' tem em 1 '+compra+'? (necessário para calcular o custo por '+uso+')';
    conversaoWrap.appendChild(fgrp('📐 Conversão: '+uso+' por 1 '+compra,inpConv));
    conversaoWrap.appendChild(msg);
  }

  function calcCustoComConversao(){
    const vp=parseFloat(f.valor_pago)||0;
    const qc=parseFloat(f.qtd_comprada)||1;
    const uc=f.unidade_custo||'kg';
    const ucompra=f.unidade_compra||'g';
    // Mesmo sistema: g↔kg
    if(['g','kg'].includes(ucompra)&&['g','kg'].includes(uc)){
      if(ucompra==='g'&&uc==='kg') return (vp/qc)*1000;
      if(ucompra==='kg'&&uc==='g') return (vp/qc)/1000;
      return vp/qc;
    }
    // Mesmo sistema: ml↔L
    if(['ml','L'].includes(ucompra)&&['ml','L'].includes(uc)){
      if(ucompra==='ml'&&uc==='L') return (vp/qc)*1000;
      if(ucompra==='L'&&uc==='ml') return (vp/qc)/1000;
      return vp/qc;
    }
    // Conversão manual: ex maço → g, un → ml
    if(precisaConversao()&&f_conversao>0){
      // 1 maço = f_conversao g → custo por g = valor_por_maço / f_conversao
      const custoPorEmbalagem=vp/qc;
      return custoPorEmbalagem/f_conversao;
    }
    // Mesmo (un, cx, etc)
    return vp/qc;
  }

  function atualizaCusto(){
    const c=calcCustoComConversao();
    f.custo_por_unidade=c;
    custoEl.innerHTML='';
    const temConversao=precisaConversao();
    const valido=!temConversao||(temConversao&&f_conversao>0);
    if(temConversao&&!f_conversao){
      custoEl.appendChild(div('al alw','⚠️ Informe a conversão acima para calcular o custo corretamente.'));
    } else {
      custoEl.appendChild(div('fl_ jb aic',[
        span('tss','Custo por '+f.unidade_custo+' (unidade que usamos):'),
        el('span','bold tv',R(c)+' / '+f.unidade_custo),
      ]));
    }
    // Atualizar opções de unidade de custo
    selCusto.innerHTML='';
    unsCusto().forEach(u=>{
      const o=el('option',null,u,{value:u});
      if(u===f.unidade_custo)o.selected=true;
      selCusto.appendChild(o);
    });
    atualizaConversaoWrap();
  }

  const cats=['Bebidas Alcoólicas','Bebidas Não Alcoólicas','Cervejas','Vinhos','Carnes e Pescados','Hortifruti','Insumos Alimentos','Limpeza','Pães'];

  const UNS_USO=['kg','g','L','ml','un','cx','pct','maço','dz'];
  const selCustoU=fsel('',UNS_USO,f.unidade_custo,v=>{f.unidade_custo=v;refLbl();});
  const inpCustoD=finp('',(f.custo_por_unidade!=null&&f.custo_por_unidade!==0)?f.custo_por_unidade:'',v=>{f.custo_por_unidade=v;},'number');
  const lblCustoU=document.createElement('div');lblCustoU.style.cssText='font-size:12px;color:var(--ts);margin-top:2px';
  function refLbl(){lblCustoU.textContent='Custo por '+(f.unidade_custo||'un')+' — a unidade que usamos nas receitas.';}
  refLbl();

  mkModal(ed?'Editar insumo':'Novo insumo',[
    div('fg2',[
      fgrp('Categoria',fsel('',cats,f.categoria,v=>f.categoria=v)),
      fgrp('Nome do insumo',finp('',f.nome,v=>f.nome=v)),
    ]),
    div('fg2',[
      fgrp('Unidade que usamos',selCustoU),
      fgrp('Custo por unidade (R$)',inpCustoD),
    ]),
    lblCustoU,
  ],async()=>{
    const _custo=parseFloat(String(f.custo_por_unidade).replace(',','.'))||0;
    const p={
      categoria:f.categoria,nome:f.nome,
      unidade_compra:f.unidade_custo,
      unidade_custo:f.unidade_custo,
      qtd_comprada:1,
      valor_pago:_custo,
      custo_por_unidade:_custo
    };
    const _precoMudou=!ed || Math.abs(_custo-(parseFloat(item&&item.custo_por_unidade)||0))>0.0001;
    if(_precoMudou){p.preco_atualizado_em=new Date().toISOString();p.preco_atualizado_por=ME||null;}
    if(ed){
      if(_precoMudou)await db('lola_insumos_historico','POST',{insumo_id:item.id,custo_anterior:item.custo_por_unidade,custo_novo:_custo,alterado_por:ME||null});
      await db('lola_insumos','PATCH',p,'?id=eq.'+item.id);
    }
    else await db('lola_insumos','POST',p);
    _ins=await db('lola_insumos','GET',null,'?select=*&ativo=eq.true&order=categoria.asc,nome.asc');
    window._drawIns&&window._drawIns($('#ins-t'));
  });
}


async function verHistoricoPreco(ins){
  const ov=div('ov');const mo=div('mo mol');
  mo.appendChild(div('mh',[
    el('h3',null,'📈 Histórico de preços — '+ins.nome),
    btn('xb','✕',()=>ov.remove())
  ]));
  const mb=div('mb');mb.appendChild(ld());
  mo.appendChild(mb);
  ov.appendChild(mo);
  mo.addEventListener('click',e=>e.stopPropagation());
  ov.addEventListener('click',e=>{if(e.target===ov)ov.remove();});
  document.body.appendChild(ov);

  try{
    const hist=await db('lola_insumos_historico','GET',null,
      '?insumo_id=eq.'+ins.id+'&order=alterado_em.asc&select=*');

    mb.innerHTML='';

    const unCusto=ins.unidade_custo||'kg';

    // Card resumo atual
    mb.appendChild(div('g3 mb3',[
      div('custo-box',[span('scl','Preço atual'),div('bold tv mt2',R(ins.custo_por_unidade)+'/'+unCusto)]),
      div('custo-box',[span('scl','Atualizações'),div('bold mt2',hist.length+' registro'+(hist.length!==1?'s':''))]),
      div('custo-box',[span('scl','Primeira vez'),div('bold mt2',hist.length?new Date(hist[0].alterado_em).toLocaleDateString('pt-BR',{month:'short',year:'2-digit'}):'—')]),
    ]));

    if(!hist.length){
      mb.appendChild(div('tss mt3 tc','Nenhum histórico de alteração registrado ainda. Os preços serão registrados automaticamente a cada atualização mensal.'));
      mo.appendChild(div('mf',[btn('btn bg','Fechar',()=>ov.remove())]));
      return;
    }

    // Montar dados com ponto atual
    const dados=[...hist.map(h=>({
      data:new Date(h.alterado_em),
      preco:parseFloat(h.custo_por_unidade_novo||h.custo_novo||0),
      editor:h.alterado_por||'',
    })),{data:new Date(),preco:parseFloat(ins.custo_por_unidade),editor:'atual'}];

    // Calcular variação
    if(dados.length>=2){
      const primeiro=dados[0].preco;
      const ultimo=dados[dados.length-1].preco;
      const var_pct=((ultimo-primeiro)/primeiro*100).toFixed(1);
      const cor=var_pct>0?'#dc2626':var_pct<0?'#166534':'var(--ts)';
      const seta=var_pct>0?'↑':var_pct<0?'↓':'→';
      const varEl=div('al ali mb3');
      varEl.style.cssText='padding:10px 16px;border-radius:10px;background:'+(var_pct>0?'#fee2e2':var_pct<0?'#dcfce7':'var(--rf)');
      varEl.innerHTML='<span style="font-weight:700;color:'+cor+'">'+seta+' '+Math.abs(var_pct)+'% desde o início</span> <span style="font-size:12px;color:var(--ts)">· de '+R(primeiro)+' para '+R(ultimo)+'/'+unCusto+'</span>';
      mb.appendChild(varEl);
    }

    // Gráfico SVG simples
    const precos=dados.map(d=>d.preco);
    const minP=Math.min(...precos)*0.9;
    const maxP=Math.max(...precos)*1.1||1;
    const W=480,H=160,PAD=40;
    const iW=W-PAD*2,iH=H-PAD;

    const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('viewBox','0 0 '+W+' '+H);
    svg.style.cssText='width:100%;height:auto;display:block;margin-bottom:16px';

    // Linhas de grade
    [0,0.25,0.5,0.75,1].forEach(p=>{
      const y=PAD/2+iH*(1-p);
      const line=document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1',PAD);line.setAttribute('x2',W-PAD);
      line.setAttribute('y1',y);line.setAttribute('y2',y);
      line.setAttribute('stroke','#f0e0e0');line.setAttribute('stroke-width','1');
      svg.appendChild(line);
      const val=minP+(maxP-minP)*p;
      const txt=document.createElementNS('http://www.w3.org/2000/svg','text');
      txt.setAttribute('x',PAD-4);txt.setAttribute('y',y+4);
      txt.setAttribute('text-anchor','end');txt.setAttribute('font-size','9');
      txt.setAttribute('fill','#999');txt.textContent='R$'+val.toFixed(0);
      svg.appendChild(txt);
    });

    // Pontos e linha
    const pts=dados.map((d,i)=>{
      const x=PAD+iW*(i/(dados.length-1||1));
      const y=PAD/2+iH*(1-(d.preco-minP)/(maxP-minP||1));
      return {x,y,d};
    });

    // Linha
    if(pts.length>1){
      const path=document.createElementNS('http://www.w3.org/2000/svg','polyline');
      path.setAttribute('points',pts.map(p=>p.x+','+p.y).join(' '));
      path.setAttribute('fill','none');path.setAttribute('stroke','#AA2B2B');
      path.setAttribute('stroke-width','2.5');path.setAttribute('stroke-linejoin','round');
      svg.appendChild(path);
      // Área
      const area=document.createElementNS('http://www.w3.org/2000/svg','polygon');
      const areaPoints=[...pts.map(p=>p.x+','+p.y),
        (W-PAD)+','+(PAD/2+iH), PAD+','+(PAD/2+iH)].join(' ');
      area.setAttribute('points',areaPoints);
      area.setAttribute('fill','rgba(170,43,43,0.08)');
      svg.appendChild(area);
    }

    // Pontos e labels
    pts.forEach((pt,i)=>{
      const circle=document.createElementNS('http://www.w3.org/2000/svg','circle');
      circle.setAttribute('cx',pt.x);circle.setAttribute('cy',pt.y);
      circle.setAttribute('r','4');circle.setAttribute('fill','#AA2B2B');
      svg.appendChild(circle);
      // Label de preço
      const txt=document.createElementNS('http://www.w3.org/2000/svg','text');
      txt.setAttribute('x',pt.x);txt.setAttribute('y',pt.y-8);
      txt.setAttribute('text-anchor','middle');txt.setAttribute('font-size','9');
      txt.setAttribute('fill','#AA2B2B');txt.setAttribute('font-weight','bold');
      txt.textContent='R$'+pt.d.preco.toFixed(2);
      svg.appendChild(txt);
      // Label de data
      if(i===0||i===pts.length-1||pts.length<=6){
        const dtxt=document.createElementNS('http://www.w3.org/2000/svg','text');
        dtxt.setAttribute('x',pt.x);dtxt.setAttribute('y',H-4);
        dtxt.setAttribute('text-anchor','middle');dtxt.setAttribute('font-size','8');
        dtxt.setAttribute('fill','#999');

/* ══════════════════════════════════
   PRÉ-PRODUÇÕES — ficha técnica completa
══════════════════════════════════ */
let _ppTab='todos',_ppBusca='';
/* ══ SEPARAÇÃO DAS COZINHAS (17/07) ══════════════════════════════════════
   Este app é o do LOLA: mostra CCMQ e MAC. O da Central (adm/central-estoque)
   mostra as dela. `cozinha` = QUEM FAZ (um valor); `destinos` = QUEM USA (vários).
   ⚠️ O filtro vale SÓ NA LISTA. O `_pp` global continua completo, senão o editor
   de ficha não acha o PP Requeijão (da Central) pra botar no Brie, e a ficha quebra.
   Some quando o pedido virar insumo do Lola (passo 4).                        */
/* Qual cozinha este app está servindo. Vem da URL (?unidade=central), porque o
   MESMO arquivo serve os dois: o portal abre sem parâmetro (= Lola: ccmq+mac) e
   o app da Central abre esta tela por iframe com ?unidade=central.
   Um app, dois modos — sem copiar o editor de ficha (450 linhas) pra lugar nenhum. */
/* Três cozinhas de verdade: CCMQ · MAC · Central (Bianca, 17/07).
   Como o portal abre o Estoque sem dizer quem é a pessoa, a cozinha vem da URL
   e fica trocável pelo selo do topo. Guarda a escolha, então cada um abre na sua
   sem precisar do link. Quando o login amarrar a unidade, isto vira só o padrão. */
const COZ_NOME={ccmq:'Cozinha CCMQ',mac:'Cozinha MAC',central:'Cozinha Central'};
const APP_COZ_ID=(function(){
  var ok=function(x){ return x==='ccmq'||x==='mac'||x==='central'; };
  /* 1º) a URL manda. NÃO grava na memória — senão o iframe da Central (que abre com
     ?unidade=central) contaminava o app do Lola: a Bianca entrava pelo link do Lola
     e caía na Cozinha Central (17/07). Só a escolha CONSCIENTE no seletor gruda. */
  var u='';
  try{ u=(new URLSearchParams(location.search).get('unidade')||'').trim().toLowerCase(); }catch(_){}
  if(ok(u)) return u;
  /* 2º) a escolha da pessoa no seletor.
     Chave v2: a v1 ficou envenenada com 'central' nos navegadores que abriram o app
     da Central antes do conserto. Trocar a chave zera todo mundo sem pedir nada. */
  try{ localStorage.removeItem('lola_cozinha'); }catch(_){}
  try{ var s=(localStorage.getItem('lola_cozinha_v2')||'').trim().toLowerCase(); if(ok(s)) return s; }catch(_){}
  // 3º) padrão: a maior (77 fichas, 543 das 779 notas)
  return 'ccmq';
})();
const APP_COZ=[APP_COZ_ID];
const APP_EH_CENTRAL = APP_COZ_ID==='central';
function trocarCozinha(id){
  try{ localStorage.setItem('lola_cozinha_v2',id); }catch(_){}   // só o seletor grava
  var q=new URLSearchParams(location.search); q.set('unidade',id);
  location.search=q.toString();          // recarrega inteiro: mais seguro que remendar o estado
}

/* ══ A ARRUMAÇÃO DOS SELOS (17/07, tarde) ═══════════════════════════════════
   A Bianca, depois de separar as cozinhas: "pode tirar essas etiquetas roxa, azul e
   laranja de preparo, central e evento (…) só uma etiqueta de pra onde vende" e
   "não precisa mais aquele aviso de você estar na central também".
   E: "No Lola a gente não precisa ver as fichas técnicas da central".

   O que saiu e por quê:
   · FAIXA "Você está na Cozinha Central" — o selo da cozinha no cabeçalho já diz. Era
     andaime da separação, quando dava pra abrir a tela errada sem perceber.
   · Selo "Preparo" (roxo) — 74 das 86 PPs da Central e 28 das 32 do Lola são preparo.
     Um selo que aparece em ~90% dos cards não separa nada, só ocupa a linha.
   · Selo da PRÓPRIA cozinha — no app da Central, "Central" era o app dizendo o nome
     dele mesmo. Foi esse selo, colado no selo de QUEM FAZ, que fez ela achar que as
     receitas estavam duplicadas e quase apagar as da Central hoje de manhã.
   · "X são feitas em outra cozinha — Ver assim mesmo" — as cozinhas estão separadas;
     mostrar as das outras era o andaime da migração. Sem isso, some também o selo de
     QUEM FAZ: se só entra o que é seu, não há o que marcar.

   O que ficou: SÓ o destino que NÃO é você = pra quem você vende.
   ⚠️ Isto é tudo de LISTA. `_pp`/`_ft` globais continuam completos — o editor precisa
   do PP Requeijão (Central) pra montar o Brie, e o catálogo de Pedidos precisa do que
   a Central faz. Filtrar global quebra a ficha (é a regra #6). */
/* COZ_COR pinta o selo da cozinha no CABEÇALHO (buildShell) e os cards do seletor de
   cozinha. NÃO é dos selos dos cards de receita. Apaguei junto com os selos e o app
   abriu EM BRANCO — "COZ_COR is not defined". Um nome pode servir a dois donos. */
const COZ_COR={ccmq:'#C0392B',mac:'#2C7A4B',central:'#2C5AA0'};
function _daMinhaCozinha(x){ return !x.cozinha || APP_COZ.indexOf(x.cozinha)>=0; }
/* "Pra onde vende": os destinos tirando a própria cozinha (esse é uso interno, não
   venda). Eventos nunca sai — não é cozinha, é a Central produzindo pra evento. */
function _destinosDeVenda(x){ return (x.destinos||[]).filter(d=>d!==APP_COZ_ID); }
/* ⚠️ NÃO USE N(v,0) PRA INTEIRO: `N=(v,d)=>...toFixed(d||2)` — com d=0, `0||2` dá 2, então
   N(1890,0) devolve "1890,00". Era ESSE o "Rende 1890,00 g" que a Bianca reclamou. O `||`
   engole o zero. Aqui eu formato sem ele. */
function _nbr(v,max){ return Number(v||0).toLocaleString('pt-BR',{maximumFractionDigits:(max==null?2:max)}); }
/* Rendimento em linguagem de gente: 1890 g vira 1,89 kg; 2500 ml vira 2,5 L.
   SÓ MUDA O QUE SE LÊ — o banco continua em g/ml, que é como a receita é escrita e como a
   conta de custo funciona (ver lola_custo_item). Não usar isto pra calcular nada. */
function _rendLegivel(qtd,un){
  const q=parseFloat(qtd)||0;
  if(un==='g'  && q>=1000) return _nbr(q/1000,2)+' kg';
  if(un==='ml' && q>=1000) return _nbr(q/1000,2)+' L';
  return _nbr(q,2)+(un?' '+un:'');
}
/* Botão que some sem explicação vira chamado de "quebrou". Este selo ocupa o lugar do
   "+ Nova" e diz o motivo em uma linha.
   NÃO cita nomes de propósito: a permissão mora em portal_users.unidades e a Bianca muda
   quando quiser. Texto com nome dentro vira mentira no dia seguinte à primeira mudança. */

  s.style.cssText='display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--ts);background:#F4EDE4;border:1px solid var(--rb);border-radius:50px;padding:5px 12px;line-height:1.3';
  s.title='Se você precisa alterar uma ficha, fale com a Bianca.';
  return s;
}

function drawPP(w){
  /* 17/07: chamada da página unificada Receitas (sem #pp-t) → redesenha ela. Era o
     "Cannot set properties of null" ao salvar uma PP editada a partir do embed. */
  if(!w){ const rc=document.getElementById('rec-t'); if(rc) return drawREC(rc); return; }
  w.innerHTML='';
  /* Abas agora por COZINHA, não por `categoria`. A categoria tinha 2 furos:
     as 26 de 'todos'/'bebida' não caíam em aba nenhuma (só em Tudo), e a aba
     Eventos vivia vazia (nenhuma PP tinha essa categoria). */
  let f=_ppTab==='todos'?[..._pp]
       :_ppTab==='pre'?_pp.filter(p=>p.e_preparo)
       :_pp.filter(p=>p.cozinha===_ppTab);
  /* A lista é SÓ da sua cozinha. Sem "ver as outras": estão separadas de verdade agora.
     Todas as 118 PPs têm `cozinha` preenchida (conferido no banco), então nada some
     por acidente — não existe PP órfã que dependia do `!x.cozinha` pra aparecer. */
  f=f.filter(_daMinhaCozinha);
  if(_ppBusca) f=f.filter(p=>p.nome.toLowerCase().includes(_ppBusca.toLowerCase()));
  if(!f.length){w.appendChild(em('pp',_ppBusca?'Nenhuma pre-producao encontrada':'Nenhuma para esta aba'));return;}

  const DEST_COR={ccmq:'#AA2B2B',mac:'#166534',central:'#1d4ed8',eventos:'#c47700'};
  const DEST_LBL={ccmq:'CCMQ',mac:'MAC',central:'Central',eventos:'Evento'};

  f.forEach(p=>{
    const dataEd=p.editado_em?new Date(p.editado_em).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}):null;
    const numPorcoes=parseFloat(p.rendimento_qtd)&&parseFloat(p.porcao_qtd)?
      _nbr(parseFloat(p.rendimento_qtd)/parseFloat(p.porcao_qtd),1):'—';   /* era .toFixed(1) → "10.0", ponto de inglês. Agora dá "10" e "8,7". */

    const card=document.createElement('div');
    card.style.cssText='background:#fff;border:1.5px solid var(--rb);border-radius:14px;padding:12px 14px;margin-bottom:10px';

    // Linha 1: nome + badge revisar
    const nomeWrap=document.createElement('div');nomeWrap.style.cssText='margin-bottom:6px';
    const nomeStrong=document.createElement('strong');nomeStrong.style.cssText='font-size:14px';nomeStrong.textContent=p.nome;
    nomeWrap.appendChild(nomeStrong);
    if(p.revisar){
      const rv2=document.createElement('span');rv2.style.cssText='margin-left:6px;font-size:10px;font-weight:700;padding:2px 7px;border-radius:50px;background:#fef3c7;color:#92400e;border:1px solid #fcd34d;cursor:pointer';
      rv2.textContent='\u26A0\uFE0F revisar';rv2.title=p.revisar_motivo||'';
      rv2.addEventListener('click',e=>{e.stopPropagation();modalRevisarFicha('pp',p);});
      nomeWrap.appendChild(rv2);
    }
    // Selo: PRA ONDE VENDE (só isso — ver o bloco da separação dos selos lá em cima)
    const _dv=_destinosDeVenda(p);
    if(_dv.length){
      const selosRow=document.createElement('div');selosRow.style.cssText='display:flex;gap:4px;flex-wrap:wrap;margin-top:4px';
      _dv.forEach(d=>{
        const s=document.createElement('span');
        s.style.cssText='font-size:10px;font-weight:800;padding:2px 8px;border-radius:50px;color:#fff;background:'+(DEST_COR[d]||'#888');
        s.textContent=DEST_LBL[d]||d;s.title='Vendida para '+(DEST_LBL[d]||d);selosRow.appendChild(s);
      });
      nomeWrap.appendChild(selosRow);
    }
    card.appendChild(nomeWrap);

    // Linha 2: dados principais
    const l2=document.createElement('div');l2.style.cssText='display:flex;gap:16px;flex-wrap:wrap;margin-bottom:8px';
    function mkInfo(lbl,val,cor){
      const d=document.createElement('div');
      const lt=document.createElement('div');lt.style.cssText='font-size:10px;color:var(--ts);text-transform:uppercase;letter-spacing:1px';lt.textContent=lbl;
      const vt=document.createElement('div');vt.style.cssText='font-size:13px;font-weight:700'+(cor?';color:'+cor:'');vt.textContent=val;
      d.appendChild(lt);d.appendChild(vt);return d;
    }
    /* "Rende 1890,00 g" → "Rende 1,89 kg". A Bianca reclamou, com razão: ninguém pensa em
       1890 gramas. Muda só a APRESENTAÇÃO — o dado no banco segue em g/ml, que é como a
       receita é escrita. Abaixo de 1000 fica como está (170 g é 170 g mesmo). */
    const rendStr=_rendLegivel(p.rendimento_qtd,p.rendimento_un)+(numPorcoes!=='—'?' ('+numPorcoes+' por\u00E7\u00F5es)':'');
    /* \u2550\u2550 O R\u00D3TULO QUE MENTIA (consertado 17/07) \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550
       A Bianca: "os PP das bebidas ficaram errados \u2014 o que ser\u00E1 que desconfigurou?"
       NADA desconfigurou. Conferi no backup de antes da cascata: o PP Chocolate valia
       22,21820000 antes e vale 22,21820000 hoje. Errada estava a PALAVRA.

       `custo_por_unidade` \u00E9 por kg / por L (g\u2192kg, ml\u2192L \u2014 a conta est\u00E1 no editor, umas
       100 linhas abaixo). A lista chamava isso de "Custo/por\u00E7\u00E3o". No PP Chocolate,
       R$ 22,22 \u00E9 o custo de UM LITRO; a por\u00E7\u00E3o \u00E9 150 ml e custa R$ 3,33. Erro de 6,7\u00D7.

       Salta nas bebidas porque rendem muito (1,5 L) e servem pouco (150 ml). Nas outras
       o erro \u00E9 o mesmo, s\u00F3 disfar\u00E7ado (Alho assado: R$ 44,71 era o quilo do alho).

       O editor SEMPRE mostrou os dois certos e separados. S\u00F3 a lista errava.
       \u26A0\uFE0F `lola_preproducoes` N\u00C3O tem coluna de custo por por\u00E7\u00E3o \u2014 a por\u00E7\u00E3o se CALCULA.
       N\u00E3o confundir com `lola_fichas_tecnicas`, que TEM `custo_por_porcao` de verdade. */
    const unBase=p.rendimento_un==='g'?'kg':p.rendimento_un==='ml'?'L':p.rendimento_un;
    const _nPor=(parseFloat(p.rendimento_qtd)>0&&parseFloat(p.porcao_qtd)>0)
                ? parseFloat(p.rendimento_qtd)/parseFloat(p.porcao_qtd) : null;
    const _custoPorcao=_nPor?(parseFloat(p.custo_total)||0)/_nPor:null;
    l2.appendChild(mkInfo('Rende',rendStr));
    l2.appendChild(mkInfo('Custo total',R(p.custo_total)));
    l2.appendChild(mkInfo('Custo/'+(unBase||'un'),R(p.custo_por_unidade),'var(--v)'));
    if(_custoPorcao) l2.appendChild(mkInfo('Custo/por\u00E7\u00E3o',R(_custoPorcao),'var(--v)'));
    if(p.valor_venda_central&&parseFloat(p.valor_venda_central)>0)l2.appendChild(mkInfo('Venda central/'+(unBase||'un'),R(p.valor_venda_central)));
    if(dataEd)l2.appendChild(mkInfo('Editado',(p.editado_por||'\u2014')+' \u00B7 '+dataEd));
    card.appendChild(l2);

    // Linha 3: botões
    const btns=document.createElement('div');btns.style.cssText='display:flex;gap:6px;flex-wrap:wrap;align-items:center';
    const bMk2=btn('btn bg bsm',p.revisar?'\u26A0\uFE0F Revisar':'\u26A0\uFE0F',()=>modalRevisarFicha('pp',p));
    if(p.revisar){bMk2.style.cssText='padding:3px 8px;border-radius:50px;background:#fef3c7;color:#92400e;font-size:11px;font-weight:700;border:1.5px solid #fcd34d;white-space:nowrap;cursor:pointer';}
    bMk2.title=p.revisar?p.revisar_motivo||'':'Marcar para revisar';
    btns.appendChild(bMk2);   // "revisar" fica pra todo mundo: quem cozinha \u00E9 quem v\u00EA o erro
    btns.appendChild(btn('btn bg bsm','\u{1F4CB}',()=>verFichaPrep(p)));   // ver: sempre
    if(podeMexerAqui()){
      btns.appendChild(btn('btn bg bsm','\u270F\uFE0F',()=>modalPrep(p)));
      btns.appendChild(btn('btn bd bsm','\u{1F5D1}',async()=>{
        if(!confirm('Excluir "'+p.nome+'"?'))return;
        await db('lola_preproducoes','PATCH',{ativo:false},'?id=eq.'+p.id);
        _pp=await db('lola_preproducoes','GET',null,'?select=*&ativo=eq.true&order=nome.asc');
        drawPP($('#pp-t'));
      }));
    }
    card.appendChild(btns);
    w.appendChild(card);
  });
}

async function modalPrep(item){
  /* Trava também aqui, não só no botão: o botão é a porta da frente, mas há outros
     caminhos até este modal. Editar receita de OUTRA cozinha usa a cozinha DELA. */
  if(!podeMexer(item?item.cozinha:APP_COZ_ID)){ alert('Você vê esta receita, mas não altera as receitas desta cozinha.\nSe precisa mudar, fale com a Bianca.'); return; }
  const ed=!!item;
  let margInp;
  let f={nome:item?.nome||'',categoria:item?.categoria||_ppTab,cat_custo:item?.cat_custo||'',rendimento_qtd:item?.rendimento_qtd||1000,rendimento_un:item?.rendimento_un||'g',custo_total:item?.custo_total||0,custo_por_unidade:item?.custo_por_unidade||0,valor_venda_central:item?.valor_venda_central||0,margem_venda:item?.margem_venda||70,porcao_qtd:item?.porcao_qtd||null,porcao_un:item?.porcao_un||null,modo_preparo:item?.modo_preparo||'',observacoes:item?.observacoes||''};
  const ings=[];
  const iw=div(null);
  let rendInp; f._rendManual=!!(ed&&item&&item.rendimento_qtd);
  function ingSumBase(){var dim=_dimUn(f.rendimento_un);var s=0;ings.forEach(function(ig){var q=parseFloat(ig.qtd_bruta||ig.qtd_liquida||0)||0;var u=ig.unidade||'g';if(_dimUn(u)!==dim)return;s+=(dim==='outro')?q:_baseUn(q,u);});return s;}
  function sumInRendUn(){var b=ingSumBase();var u=f.rendimento_un;return (u==='kg'||u==='L')?b/1000:b;}

  // Carregar ingredientes existentes se editando
  if(ed && item?.id){
    try{
      const existentes=await db('lola_preproducoes_itens','GET',null,
        '?select=*,lola_insumos(id,nome,custo_por_unidade,unidade_custo,unidade_compra),lola_preproducoes_sub:sub_preproducao_id(id,nome,custo_por_unidade,rendimento_un)&preproducao_id=eq.'+item.id);
      existentes.forEach(it=>{
        const isIns=!!it.lola_insumos;
        const src=isIns?it.lola_insumos:it.lola_preproducoes_sub;
        if(!src)return;
        ings.push({
          tipo:isIns?'insumo':'prep',
          id:src.id,
          unidade:it.unidade||'g',
          qtd_bruta:it.qtd_bruta,
          qtd_liquida:it.qtd_liquida,
          fc:it.fc||1,
          custo_unitario:it.custo_unitario,
          custo_total:it.custo_total,
        });
      });
    }catch(e){console.error('Erro ao carregar itens PP:',e);}
  }

  function calcTotais(){
    const ct=ings.reduce((t,ig)=>{
      if(!ig.id&&!ig.nome_manual)return t;
      return t+parseFloat(ig.custo_total||0);
    },0);
    f.custo_total=ct;
    if(!f._rendManual){var _s=sumInRendUn();if(_s>0){f.rendimento_qtd=Math.round(_s*1000)/1000;if(rendInp)rendInp.value=f.rendimento_qtd;}}
    const qtd=parseFloat(f.rendimento_qtd)||1;
    // Calcular custo na unidade base correta
    // g → custo por kg (×1000/qtd), ml → custo por L (×1000/qtd)
    // kg, L, un, porção → custo direto (÷qtd)
    const unBase=f.rendimento_un==='g'?'kg':f.rendimento_un==='ml'?'L':f.rendimento_un;
    f.custo_por_unidade=(['g','ml'].includes(f.rendimento_un))?(ct/qtd)*1000:ct/qtd;
    const m=parseFloat(f.margem_venda)||70;
    f.valor_venda_central=f.custo_por_unidade/(m/100);
    const numPorcoes2=parseFloat(f.porcao_qtd)>0?(parseFloat(f.rendimento_qtd)/parseFloat(f.porcao_qtd)):null;
    const custoPorcao2=numPorcoes2?ct/numPorcoes2:null;
    /* 19/07 (Bianca): "deveria ter o custo da produção, quantas unidades renderam e
       qual o preço por unidade — e depois o preço + margem". Mesmas CONTAS, nova
       apresentação: os técnicos (custo/kg, venda por kg) ficam discretos no fim. */
    custoResEl.innerHTML=somaIngredientesHTML(ings)
      +'<div class="fl_ jb mb3"><span>Custo da produção</span><strong class="tv">'+R(ct)+'</strong></div>'
      +(numPorcoes2
        ?'<div class="fl_ jb mb3"><span>Rendeu</span><strong>'+numPorcoes2.toFixed(1)+' unidade'+(numPorcoes2>=2?'s':'')+' de '+N(f.porcao_qtd,0)+' '+f.porcao_un+' <small style="font-weight:600;color:var(--ts)">('+N(qtd,0)+' '+f.rendimento_un+' no total)</small></strong></div>'
         +'<div class="fl_ jb mb3"><span>Custo por unidade</span><strong class="tv">'+R(custoPorcao2)+'</strong></div>'
         +'<div class="fl_ jb mb3"><span>Preço por unidade com margem ('+m+'% CMV)</span><strong>'+R(custoPorcao2/(m/100))+'</strong></div>'
        :'<div class="fl_ jb mb3"><span>Rendeu</span><strong>'+N(qtd,0)+' '+f.rendimento_un+'</strong></div>')
      +'<div class="fl_ jb mb3" style="font-size:12px;color:var(--ts)"><span>Custo/'+unBase+'</span><strong>'+R(f.custo_por_unidade)+'</strong></div>'
      +'<div class="fl_ jb" style="font-size:12px;color:var(--ts)"><span>Valor venda central ('+m+'% CMV) — por '+unBase+'</span><strong>'+R(f.valor_venda_central)+'</strong></div>';
  }

  // Lista unificada: insumos + sub-pré-prods em ordem alfabética
  function mkOptsUnificadaPP(){
    const ins=_ins.map(i=>{
      const uc=i.unidade_custo||'kg';
      let unUso;
      if(i.unidade_compra==='g/ml') unUso=uc==='L'?'ml':'g';
      else if(['g','ml'].includes(i.unidade_compra)) unUso=i.unidade_compra;
      else if(i.unidade_compra==='kg') unUso='g';
      else if(i.unidade_compra==='L') unUso='ml';
      else unUso=i.unidade_compra||'un';
      return {v:'ins:'+i.id,l:i.nome,custo:i.custo_por_unidade,un:unUso,tipo:'insumo',srcId:i.id};
    });
    // pré-prods exceto a própria (evitar referência circular)
    const pps=_pp.filter(p=>p.id!==item?.id).map(p=>({v:'pp:'+p.id,l:'[PP] '+p.nome,custo:p.custo_por_unidade,un:p.rendimento_un,tipo:'prep',srcId:p.id}));
    return [...ins,...pps].sort((a,b)=>a.l.localeCompare(b.l,'pt'));
  }

  function rebuildI(){
    iw.innerHTML='';
    const optsAll=mkOptsUnificadaPP();
    ings.forEach((ig,idx)=>{
      const tipoBadge=span('bq '+(ig.tipo==='prep'?'bce':'bc'),ig.tipo==='prep'?'PP':'Ins');
      tipoBadge.style.cssText='font-size:10px;padding:2px 8px;border-radius:50px;font-weight:700;white-space:nowrap;flex-shrink:0';

      const sel=el('select','fi',null,{style:'flex:2;min-width:0'});
      sel.appendChild(el('option',null,'— selecione —',{value:''}));
      optsAll.forEach(o=>{
        const opt=el('option',null,o.l,{value:o.v});
        const curVal=(ig.tipo==='insumo'?'ins:':'pp:')+ig.id;
        if(o.v===curVal)opt.selected=true;
        sel.appendChild(opt);
      });
      const unOpts2=_ingUnits(ig);
      const unSel2=el('select','fi',null,{style:'width:74px;flex-shrink:0;padding:6px 2px;font-size:12px'});
      unOpts2.forEach(u=>{const o=el('option',null,u,{value:u});if(u===ig.unidade)o.selected=true;unSel2.appendChild(o);});
      unSel2.addEventListener('change',e=>{ig.unidade=e.target.value;calcItem(idx);});

      sel.addEventListener('change',e=>{
        const val=e.target.value;
        if(!val){ig.id='';ig.custo_unitario=0;ig.custo_total=0;ig.unidade='g';ig.tipo='insumo';rebuildI();return;}
        const opt=optsAll.find(o=>o.v===val);
        if(!opt)return;
        ig.tipo=opt.tipo;ig.id=opt.srcId;ig.custo_unitario=opt.custo;ig.unidade=opt.un;
        tipoBadge.textContent=ig.tipo==='prep'?'PP':'Ins';
        tipoBadge.className='bq '+(ig.tipo==='prep'?'bce':'bc');
        tipoBadge.style.cssText='font-size:10px;padding:2px 8px;border-radius:50px;font-weight:700;white-space:nowrap;flex-shrink:0';
        unSel2.innerHTML='';
        _ingUnits(ig).forEach(u=>{const o=el('option',null,u,{value:u});if(u===ig.unidade)o.selected=true;unSel2.appendChild(o);});
        calcItem(idx);
      });

      const qbI=finp('',ig.qtd_bruta!=null&&ig.qtd_bruta!==''?String(ig.qtd_bruta).replace('.',','):'',v=>{ig.qtd_bruta=(v||'').replace(',','.');calcItem(idx);},'text');qbI.setAttribute('inputmode','decimal');
      qbI.style.cssText='width:62px;flex-shrink:0;text-align:center;padding:6px 4px';qbI.placeholder='Qtd';
      const fcI=finp('',ig.fc!=null?String(ig.fc).replace('.',','):1,v=>{ig.fc=(v||'').replace(',','.');calcItem(idx);},'text');fcI.setAttribute('inputmode','decimal');
      fcI.style.cssText='width:54px;flex-shrink:0;text-align:center;padding:6px 4px';fcI.placeholder='FC';fcI.title='Fator de correção';
      sel.style.cssText='flex:1 1 120px;min-width:100px';
      const ctEl=span('bold tv',R(ig.custo_total||0));
      ctEl.style.cssText='white-space:nowrap;text-align:right;font-weight:800;color:var(--v);min-width:64px;flex-shrink:0;font-size:14px';

      function calcItem(i){
        const src=ings[i];
        const ql=(parseFloat(src.qtd_bruta)||0)/(parseFloat(src.fc)||1);
        src.qtd_liquida=ql;
        const srcObj=src.tipo==='insumo'?_ins.find(x=>x.id===src.id):_pp.find(x=>x.id===src.id);
        let unCusto;
        if(src.tipo==='insumo'){
          unCusto=srcObj?.unidade_custo||'kg';
        } else {
          const rendUn=srcObj?.rendimento_un||'g';
          unCusto=rendUn==='g'?'kg':rendUn==='ml'?'L':rendUn;
        }
        src.custo_total=calcCustoItem(src.qtd_bruta,src.fc,src.unidade||'g',src.custo_unitario,unCusto);
        ctEl.textContent=R(src.custo_total);
        calcTotais();
      }

      const rm=btn('btn bd bxs','✕',()=>{ings.splice(idx,1);rebuildI();calcTotais();});
      iw.appendChild(div('ir',[tipoBadge,sel,qbI,unSel2,fcI,ctEl,rm]));
    });
  }
  rebuildI();

  const custoResEl=div('custo-box');
  calcTotais();

  // Autoria: vem do LOGIN do portal (?u=). Só digitável se abrir o app fora do portal.
  const _autorPP={v:ME||item?.editado_por||''};
  let nomeEdit;
  if(ME){
    nomeEdit=div(null,null,{style:'display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--rt);border:1.5px solid var(--rb);border-radius:9px'});
    nomeEdit.innerHTML='<b style="font-size:13px;color:var(--tx)">'+_uEsc(ME)+'</b>'
      +'<span style="margin-left:auto;font-size:11px;color:#8A7A72"><i class="ph-duotone ph-lock-simple"></i> vem do seu login</span>';
  }else{
    nomeEdit=finp('',_autorPP.v,v=>{_autorPP.v=v;});
    nomeEdit.placeholder='Seu nome...';
  }
  // Seletor de destinos PP
  const DESTS_PP_OPT=[
    {k:'ccmq',label:'CCMQ',cor:'#AA2B2B'},
    {k:'mac',label:'MAC',cor:'#166634'},
    {k:'central',label:'Central',cor:'#1d4ed8'},
    {k:'eventos',label:'Eventos',cor:'#c47700'},
  ];
  const _selDestsPP=new Set(item?.destinos||[]);
  const destBtnsWrap=div(null,null,{style:'display:flex;gap:8px;flex-wrap:wrap;margin-top:4px'});
  DESTS_PP_OPT.forEach(d=>{
    const b=document.createElement('button');b.type='button';
    function renderB(){
      const sel=_selDestsPP.has(d.k);
      b.style.cssText='padding:6px 14px;border-radius:50px;border:2px solid '+d.cor+';cursor:pointer;font-family:Manrope,sans-serif;font-size:12px;font-weight:700;'+(sel?'background:'+d.cor+';color:#fff':'background:#fff;color:'+d.cor);
      b.textContent=(sel?'✓ ':'')+d.label;
    }
    renderB();
    b.addEventListener('click',()=>{_selDestsPP.has(d.k)?_selDestsPP.delete(d.k):_selDestsPP.add(d.k);renderB();});
    destBtnsWrap.appendChild(b);
  });

  /* 17/07: o Pré-preparo virou etiqueta na linha do "Onde é utilizado" (a Bianca:
     "podia ter uma etiqueta de pré-preparo do lado do CCMQ MAC Central e Eventos").
     A Categoria de custo saiu da tela — o valor gravado continua intacto. */
  let _isPre=!!(item?.e_preparo);
  const preBtn=document.createElement('button'); preBtn.type='button';
  preBtn.title='Ingrediente usado dentro de outras produções';
  const paintPre=()=>{ preBtn.style.cssText='padding:7px 16px;border-radius:50px;font-size:12.5px;font-weight:800;cursor:pointer;border:1.5px solid #7A4FA3;background:'+(_isPre?'#7A4FA3':'#fff')+';color:'+(_isPre?'#fff':'#7A4FA3'); preBtn.textContent=(_isPre?'✓ ':'')+'Pré-preparo'; };
  preBtn.onclick=()=>{ _isPre=!_isPre; paintPre(); };
  paintPre();
  destBtnsWrap.appendChild(preBtn);

  mkModal((ed?'Editar':'Nova')+' pré-produção',[
    div('fg3',[
      fgrp('Nome',finp('',f.nome,v=>f.nome=v)),
      fgrp('Categoria',fsel('',['central','mac','ccmq'],f.categoria,v=>f.categoria=v)),
      fgrp('✍️ Editado por',nomeEdit),
    ]),
    fgrp('🏷️ Onde é utilizado',destBtnsWrap),
    div('fg2',[
      fgrp('Rendimento total',el('div',null,[(rendInp=finp('',f.rendimento_qtd,v=>{f.rendimento_qtd=v;f._rendManual=true;calcTotais();},'number')),el('button','btn bg bsm','= soma dos ingredientes',{type:'button',style:'margin-top:6px;display:block',onclick:()=>{f._rendManual=false;f.rendimento_qtd=Math.round(sumInRendUn()*1000)/1000;rendInp.value=f.rendimento_qtd;calcTotais();}})])),
      fgrp('Unidade',fsel('',['g','ml','kg','L','un','porção'],f.rendimento_un,v=>{f.rendimento_un=v;calcTotais();})),
    ]),
    div('fg3',[
      fgrp('Qtd por porção',finp('',f.porcao_qtd||'',v=>{f.porcao_qtd=v;calcTotais();},'number')),
      fgrp('Unidade porção',fsel('',['g','ml','kg','L','un','porção'],f.porcao_un||f.rendimento_un,v=>f.porcao_un=v)),
      fgrp('Margem venda central',el('div',null,[
        fsel('',['30','40','50','60','70','personalizado'],String(f.margem_venda),v=>{
          if(v==='personalizado'){margInp.style.display='block';}
          else{margInp.style.display='none';f.margem_venda=parseFloat(v);calcTotais();}
        }),
        (()=>{margInp=finp('',f.margem_venda,v=>{f.margem_venda=parseFloat(v)||70;calcTotais();},'number');margInp.placeholder='% personalizado';margInp.style.display=['30','40','50','60','70'].includes(String(f.margem_venda))?'none':'block';margInp.style.marginTop='6px';return margInp;})()
      ])),
    ]),
    el('hr','dv'),
    div('fl_ jb aic mb3',[
      el('strong',null,'Ingredientes',{style:'font-size:13px'}),

    else{const[nv]=await db('lola_preproducoes','POST',p);pid=nv.id;}
    for(const ig of ings){

let _ftTab='todos',_ftBusca='';


function editarDestinos(ficha, onSave){
  if(!podeMexer(ficha.cozinha)) return;   // idem PP: mudar destino é mudar a ficha
  const DESTS=[
    {k:'ccmq',label:'CCMQ',cor:'#AA2B2B'},
    {k:'mac',label:'MAC',cor:'#166534'},
    {k:'eventos',label:'Eventos',cor:'#c47700'},
  ];
  const selecionados=new Set(ficha.destinos||[]);
  const btns=div('fl_ gap2 mt2');
  DESTS.forEach(d=>{
    const b=document.createElement('button');
    b.type='button';
    function render(){
      const sel=selecionados.has(d.k);
      b.style.cssText='padding:8px 16px;border-radius:50px;border:2px solid '+d.cor+';cursor:pointer;font-family:Manrope,sans-serif;font-size:13px;font-weight:700;transition:all .15s;'+(sel?'background:'+d.cor+';color:#fff':'background:#fff;color:'+d.cor);
      b.textContent=(sel?'✓ ':'')+d.label;
    }
    render();
    b.addEventListener('click',()=>{
      selecionados.has(d.k)?selecionados.delete(d.k):selecionados.add(d.k);
      render();
    });
    btns.appendChild(b);
  });
  mkModal('🏷️ Destinos de '+ficha.nome,[
    div('tss mb2','Selecione onde esta ficha é utilizada:'),
    btns,
  ],async()=>{
    await db('lola_fichas_tecnicas','PATCH',{destinos:[...selecionados]},'?id=eq.'+ficha.id);
    ficha.destinos=[...selecionados];
    onSave&&onSave();
  });
}

function modalRevisarFicha(tipo,item){
  const tabela=tipo==='ft'?'lola_fichas_tecnicas':'lola_preproducoes';
  const reload=tipo==='ft'?
    ()=>db(tabela,'GET',null,'?select=*&ativo=eq.true&order=nome.asc').then(d=>{_ft=d;drawFT($('#ft-t'));}) :
    ()=>db(tabela,'GET',null,'?select=*&ativo=eq.true&order=nome.asc').then(d=>{_pp=d;drawPP($('#pp-t'));});
  if(item.revisar){
    const ov=div('ov');const mo=div('mo');
    mo.addEventListener('click',e=>e.stopPropagation());
    ov.addEventListener('click',e=>{if(e.target===ov)ov.remove();});
    mo.appendChild(div('mh',[el('h3',null,'\u26A0\uFE0F Pendente de revis\u00E3o \u2014 '+item.nome),btn('xb','\u2715',()=>ov.remove())]));
    const mb=div('mb');
    const motEl=document.createElement('div');
    motEl.style.cssText='background:#fef3c7;border:1.5px solid #fcd34d;border-radius:10px;padding:12px 14px;font-size:13px;color:#92400e;margin-bottom:16px';
    motEl.innerHTML='<strong>Motivo:</strong> '+(item.revisar_motivo||'N\u00E3o informado');
    mb.appendChild(motEl);
    mo.appendChild(mb);
    mo.appendChild(div('mf',[
      btn('btn bg','Fechar',()=>ov.remove()),
      btn('btn bv','Marcar como revisado',async()=>{
        await db(tabela,'PATCH',{revisar:false,revisar_motivo:null},'?id=eq.'+item.id);
        item.revisar=false;item.revisar_motivo=null;
        ov.remove();reload();
      }),
    ]));
    ov.appendChild(mo);document.body.appendChild(ov);
  } else {
    const motivo={v:''};
    const inpMot=document.createElement('textarea');
    inpMot.className='fi';inpMot.rows=3;
    inpMot.placeholder='Descreva o motivo da revis\u00E3o (obrigat\u00F3rio)...';
    inpMot.style.cssText='width:100%;resize:vertical;min-height:80px';
    inpMot.addEventListener('input',e=>motivo.v=e.target.value);
    mkModal('\u26A0\uFE0F Marcar para revis\u00E3o \u2014 '+item.nome,[
      div('al ali mb3','Explique o motivo. Isso ficar\u00E1 vis\u00EDvel para toda a equipe.'),
      fgrp('Motivo da revis\u00E3o',inpMot),
    ],async()=>{
      if(!motivo.v.trim()){alert('O motivo \u00E9 obrigat\u00F3rio.');throw new Error('vazio');}
      await db(tabela,'PATCH',{revisar:true,revisar_motivo:motivo.v.trim()},'?id=eq.'+item.id);
      item.revisar=true;item.revisar_motivo=motivo.v.trim();
      reload();
    });
  }
}

/* ordenação das fichas */
var _ftSort='nome';
const FT_SORTS=[
  {k:'nome',   l:'Nome'},
  {k:'cmv',    l:'CMV'},
  {k:'preco',  l:'Preço'},
  {k:'custo',  l:'Custo'},
  {k:'editado',l:'Editado'}
];
function _ftCmv(x){ return (!x.preco_venda||x.preco_venda<=0)?null:(x.custo_por_porcao/x.preco_venda*100); }
/* Limite de CMV — regra da Bianca (16/07): 50% só pra PRODUTO PRONTO (comprado
   feito, sem nenhuma manipulação, tipo torta fatiada). Preparo da casa: 30%.
   Antes o app usava 30% pra tudo e acusava as tortas à toa. */
function _ftLim(x){ return (x&&x.produto_pronto)?50:30; }
/* CMV compacto da lista: só bolinha + %. O aviso "revisar ficha" vira etiqueta ao lado do nome. */
function mkCMVCompacto(preco_venda,custo,lim){
  if(!preco_venda||preco_venda<=0) return span('ft-num vazio','—');
  const cmv=custo/preco_venda*100, alto=cmv>(lim||30);
  return div('fl_ aic gap2',[
    el('span',null,null,{style:'width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0;background:'+(alto?'#B5302E':'#2C7A4B')}),
    el('span','bold',cmv.toFixed(0)+'%',{style:'color:'+(alto?'#B5302E':'var(--vd)')})
  ]);
}
function _ftOrdena(f){
  const s=_ftSort;
  if(s==='nome') return f.sort((a,b)=>(a.nome||'').localeCompare(b.nome||'','pt'));
  if(s==='cmv')  return f.sort((a,b)=>{const A=_ftCmv(a),B=_ftCmv(b); if(A==null&&B==null)return 0; if(A==null)return 1; if(B==null)return -1; return B-A;}); // maior CMV primeiro
  if(s==='preco')return f.sort((a,b)=>(+b.preco_venda||0)-(+a.preco_venda||0));
  if(s==='custo')return f.sort((a,b)=>(+b.custo_por_porcao||0)-(+a.custo_por_porcao||0));
  if(s==='editado')return f.sort((a,b)=>String(b.editado_em||'').localeCompare(String(a.editado_em||'')));
  return f;
}
function drawFT(w){
  if(!w){ const rc=document.getElementById('rec-t'); if(rc) return drawREC(rc); return; }
  w.innerHTML='';
  let f=_ftTab==='todos'?[..._ft]:
    _ftTab==='pre'?_ft.filter(x=>x.categoria==='pre'||x.categoria==='pre-producao'):
    _ftTab.indexOf('beb_')===0?_ft.filter(x=>x.cardapio===_ftTab.slice(4)&&x.categoria==='bebida'):
    _ft.filter(x=>x.cardapio===_ftTab&&x.categoria!=='bebida');
  /* "No Lola a gente não precisa ver as fichas técnicas da central" (Bianca, 17/07).
     Sem escape: a lista é só da sua cozinha. Filtro SÓ na lista — o `_ft` global segue
     inteiro pra não quebrar nada que dependa dele (regra #6). */
  f=f.filter(_daMinhaCozinha);
  if(_ftBusca) f=f.filter(x=>x.nome.toLowerCase().includes(_ftBusca.toLowerCase()));
  f=_ftOrdena(f.slice());
  // barra de ordenação
  const sortBar=div('ft-sort no-print');
  sortBar.appendChild(span('ft-sort-lb','Ordenar por'));
  FT_SORTS.forEach(s=>{
    const b=el('button','ft-sb'+(_ftSort===s.k?' on':''),null,{html:s.l+(_ftSort===s.k&&s.k!=='nome'?' <i class="ph-duotone ph-arrow-down"></i>':''),
      onclick:()=>{_ftSort=s.k;drawFT(w);}});
    sortBar.appendChild(b);
  });
  w.appendChild(sortBar);

  const alertas=f.filter(x=>{
    if(!x.preco_venda||x.preco_venda<=0)return false;
    return x.custo_por_porcao/x.preco_venda*100>_ftLim(x);
  });
  if(alertas.length&&!_ftBusca){
    const alertBox=div('al',null,{style:'background:#FBEAE7;border:1px solid #F3D3CE;color:#B5302E;border-radius:14px;padding:12px 16px;margin-bottom:14px'});
    alertBox.appendChild(el('div','bold','Revisar ficha técnica — CMV acima do limite:',{style:'margin-bottom:2px;font-size:13px'}));
    alertBox.appendChild(el('div',null,'Preparo da casa: 30%. Produto pronto (comprado feito): 50%.',{style:'margin-bottom:8px;font-size:11px;opacity:.75'}));
    alertas.forEach(x=>{
      const cmv=(x.custo_por_porcao/x.preco_venda*100).toFixed(0);
      alertBox.appendChild(div('fl_ jb aic',[
        span(null,x.nome+(x.produto_pronto?' (produto pronto)':''),{style:'font-size:12px;font-weight:600'}),
        span(null,'custo '+R(x.custo_por_porcao)+' venda '+R(x.preco_venda)+' CMV '+cmv+'% · limite '+_ftLim(x)+'%',{style:'font-size:11px;opacity:.8'})
      ],{style:'padding:4px 0;border-bottom:1px solid #fca5a580'}));
    });
    w.appendChild(alertBox);
  }
  if(!f.length){w.appendChild(em('ficha',_ftBusca?'Nenhuma ficha encontrada':'Nenhuma ficha aqui'));return;}

  const DEST_COR={ccmq:'#C0392B',mac:'#2C7A4B',central:'#2C5AA0',eventos:'#9A6B1E'};
  const DEST_LBL={ccmq:'CCMQ',mac:'MAC',central:'Central',eventos:'Evento'};

  const tbl=div('ins-tbl');
  const hd=div('ft-hd');
  hd.innerHTML='<div>Ficha</div><div style="text-align:right">Custo/porção</div><div style="text-align:right" class="ft-hd-pv">Preço venda</div><div style="text-align:right">CMV</div><div class="ft-hd-ed">Editado</div><div style="text-align:right">Ações</div>';
  tbl.appendChild(hd);

  f.forEach(x=>{
    const semPreco=!x.preco_venda||x.preco_venda<=0;
    const cmv=semPreco?null:(x.custo_por_porcao/x.preco_venda*100);
    const dataEd=x.editado_em?new Date(x.editado_em).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}):null;

    const lim=_ftLim(x);
    /* 18/07: selo de destino saiu (a aba de cardápio já diz onde). Entrou ATIVO/INATIVO
       no menu: inativa fica esmaecida (.inat) + etiqueta cinza. */
    const row=div('ft-row'+((!semPreco&&cmv>lim)?' alerta':'')+(x.no_menu===false?' inat':''));

    // ficha: nome + selos + revisar
    const nome=div('ft-nome');
    nome.appendChild(span('ft-nome-t',x.nome));
    /* 19/07 (Bianca): clicar no nome abre a EDIÇÃO (quem não pode editar cai na
       visualização) — e o botão VER saiu, o editar mostra a mesma coisa. */
    nome.style.cursor='pointer'; nome.title='Abrir a ficha';
    nome.addEventListener('click',()=>{ podeMexerAqui()?modalFicha(x):verFichaFT(x); });
    if(x.no_menu===false){ const s=span('ft-sel','INATIVO'); s.style.background='#8A7A72';
      s.title='Fora do menu atual — edite a ficha pra reativar'; nome.appendChild(s); }
    if(x.revisar){
      const rv=span('ft-rev'); rv.innerHTML='<i class="ph-duotone ph-warning"></i> revisar';
      rv.title=x.revisar_motivo||''; rv.addEventListener('click',()=>modalRevisarFicha('ft',x));
      nome.appendChild(rv);
    }
    if(x.produto_pronto){
      const pp=span('ft-pronto'); pp.innerHTML='<i class="ph-duotone ph-package"></i> produto pronto';
      pp.title='Comprado feito, sem manipulação — o limite de CMV dele é 50%';
      nome.appendChild(pp);
    }
    if(!semPreco&&cmv>lim){
      const rc=span('ft-cmvalto'); rc.innerHTML='<i class="ph-duotone ph-warning-circle"></i> revisar ficha';
      rc.title='CMV de '+cmv.toFixed(0)+'% — acima do limite de '+lim+'%'+(x.produto_pronto?' (produto pronto)':' (preparo da casa)');
      nome.appendChild(rc);
    }
    row.appendChild(nome);

    /* No desktop estes 4 são colunas do grid (o .ft-mob é display:contents).
       No celular viram uma linha de valores com rótulo. */
    const mob=div('ft-mob');
    mob.appendChild(div('ft-num',[R(x.custo_por_porcao)]));                 // custo/porção
    const pv=div('ft-num pv ft-pv'+(semPreco?' vazio':''));
    pv.textContent=semPreco?'sem preço':R(x.preco_venda);
    mob.appendChild(pv);                                                     // preço venda
    const cmvCel=div('ft-cmvcel'); cmvCel.appendChild(mkCMVCompacto(x.preco_venda,x.custo_por_porcao,lim));
    mob.appendChild(cmvCel);                                                 // CMV
    mob.appendChild(div('ft-ed',[dataEd?((x.editado_por||'—')+' · '+dataEd):'—']));
    row.appendChild(mob);
    // ações
    const acts=div('ft-acts');
    acts.appendChild(el('button','ins-sb'+(x.revisar?' warn':''),null,{html:'<i class="ph-duotone ph-warning"></i>',title:x.revisar?(x.revisar_motivo||'Revisar'):'Marcar para revisar',onclick:()=>modalRevisarFicha('ft',x)}));
    /* 19/07: botão VER (olhinho) removido — o clique no nome abre editar/ver. */
    if(podeMexerAqui()){
      acts.appendChild(el('button','ins-sb',null,{html:'<i class="ph-duotone ph-pencil-simple"></i>',title:'Editar',onclick:()=>modalFicha(x)}));
      acts.appendChild(el('button','ins-sb del',null,{html:'<i class="ph-duotone ph-trash"></i>',title:'Excluir',onclick:async()=>{
        if(!confirm('Excluir '+x.nome+'?'))return;
        await db('lola_fichas_tecnicas','PATCH',{ativo:false},'?id=eq.'+x.id);
        _ft=await db('lola_fichas_tecnicas','GET',null,'?select=*&ativo=eq.true&order=nome.asc');
        drawFT($('#ft-t'));
      }}));
    }
    row.appendChild(acts);
    tbl.appendChild(row);
  });
  w.appendChild(tbl);
}

function _resizeImg(file, cb){
  try{
    var r=new FileReader();
    r.onload=function(){
      var img=new Image();
      img.onload=function(){
        var w=img.width,h=img.height,max=1100;
        if(w>max||h>max){ if(w>h){h=Math.round(h*max/w);w=max;} else {w=Math.round(w*max/h);h=max;} }
        var c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        cb(c.toDataURL('image/jpeg',0.72));
      };
      img.src=r.result;
    };
    r.readAsDataURL(file);
  }catch(e){console.error('resize',e);}
}
function _thumbFromDataUrl(dataUrl, max, cb){
  try{
    var img=new Image();
    img.onload=function(){
      var w=img.width,h=img.height;
      if(w>max||h>max){ if(w>h){h=Math.round(h*max/w);w=max;} else {w=Math.round(w*max/h);h=max;} }
      var c=document.createElement('canvas'); c.width=w;c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
      cb(c.toDataURL('image/jpeg',0.6));
    };
    img.onerror=function(){cb('');};
    img.src=dataUrl;
  }catch(e){cb('');}
}
function _thumbP(dataUrl,max){ return new Promise(function(res){ _thumbFromDataUrl(dataUrl,max,res); }); }

async function modalFicha(item){
  if(!podeMexer(item?item.cozinha:APP_COZ_ID)){ alert('Você vê esta ficha, mas não altera as fichas desta cozinha.\nSe precisa mudar, fale com a Bianca.'); return; }
  try{
