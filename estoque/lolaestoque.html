  const mb=div('mb');mo.appendChild(mb);

  // Linha 1: Destino + Data
  const inpData=el('input','fi',null,{type:'date',value:_dataPed});
  inpData.addEventListener('change',e=>_dataPed=e.target.value);

  // Abas de destino
  const destTabsWrap=div('tabs mb3');
  function buildDestTabs(){
    destTabsWrap.innerHTML='';
    DEST_KEYS.forEach(k=>{
      const p=span('tp'+(_destPed===k?' active':''),DEST_LBL[k]);
      p.style.cssText+=(';font-weight:800;border:2px solid '+DEST_COR[k]);
      if(_destPed===k) p.style.background=DEST_COR[k]+';color:#fff';
      p.addEventListener('click',()=>{_destPed=k;buildDestTabs();buildItens();});
      destTabsWrap.appendChild(p);
    });
  }
  buildDestTabs();

  mb.appendChild(div('fg2 mb3',[
    fgrp('Destino',destTabsWrap),
    fgrp('Data',inpData),
  ]));

  mb.appendChild(el('hr','dv'));

  // Campo de busca
  const buscaInp=el('input','fi',null,{placeholder:'🔍 Buscar item ou insumo avulso (ex.: queijo, salame, banana)…',autocomplete:'off'});
  buscaInp.style.cssText='width:100%;margin-bottom:8px';
  buscaInp.addEventListener('input',e=>{_buscaNovoPed=e.target.value.toLowerCase();buildItens();});
  mb.appendChild(buscaInp);

  // Área de itens
  const itensArea=div(null);
  mb.appendChild(itensArea);

  let _buscaNovoPed='';

  /* 19/07: as funções ppPreco/ppUnidade/ppInfo SUBIRAM pro nível de cima (antes de
     drawPed). Elas moravam AQUI DENTRO do modal de novo pedido, e o modal de EDITAR
     também as usa — "ppUnidade is not defined" quebrava o Editar desde a unificação
     de 15/07. Regra única, agora num escopo que as duas telas enxergam. */

  /* 19/07 (Bianca): "estamos com 2 barras de rolagem — deixar as listas pro dropdown".
     A lista gigante de TODOS os itens (fichas+PPs+insumos, cada um com input) SAIU.
     Agora: busca com DROPDOWN de sugestões → toca pra adicionar → só os adicionados
     ficam na tela, com qtd editável e ✕. Os FILTROS são os mesmos de 17/07
     ("o catálogo do pedido é quem a Central faz"; com busca, qualquer insumo entra). */
  function _pedCatalogo(){
    const q=_buscaNovoPed;
    const ppDest=_pp.filter(x=>(x.cozinha ? x.cozinha==='central'
                                          : (x.e_preparo||(x.destinos||[]).includes('central')))&&
      (!q||x.nome.toLowerCase().includes(q)));
    const ftDest=ftPre.filter(x=>(!q||x.nome.toLowerCase().includes(q)));
    const insDest=_ins.filter(x=>{
      if(q) return x.nome.toLowerCase().includes(q);
      return (x.destinos||[]).includes(_destPed)||(x.destinos||[]).includes('central');
    });
    const out=[];
    ftDest.forEach(x=>out.push({id:'ft_'+x.id, nome:x.nome, grupo:'Ficha', preco:parseFloat(x.custo_por_porcao)||0, unidade:x.rendimento_un||'porção', item:x}));
    ppDest.forEach(x=>out.push({id:'pp_'+x.id, nome:x.nome, grupo:'Pré-prod.', preco:ppPreco(x), unidade:ppUnidade(x), info:ppInfo(x), item:x}));
    insDest.forEach(x=>{
      const uc=x.unidade_custo||'kg', uCompra=x.unidade_compra||uc;
      let pr=parseFloat(x.custo_por_unidade)||0;
      if(uCompra==='g'&&uc==='kg') pr=x.custo_por_unidade/1000;
      else if(uCompra==='ml'&&uc==='L') pr=x.custo_por_unidade/1000;
      out.push({id:'ins_'+x.id, nome:x.nome, grupo:'Insumo', preco:pr, unidade:uCompra, item:x});
    });
    return out;
  }
  function buildItens(){
    itensArea.innerHTML='';
    /* itens JÁ adicionados — qtd editável + ✕ */
    const sels=Object.entries(qtdMap).filter(function(par){return par[1].quantidade>0;});
    if(sels.length){
      const g=div(null); g.style.cssText='margin-bottom:10px';
      sels.forEach(function(par){ const v=par[1];
        const row=document.createElement('div');
        row.style.cssText='display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;margin-bottom:4px;background:var(--rf);border:1px solid var(--rb)';
        const info=document.createElement('div');info.style.cssText='flex:1;min-width:0';
        info.innerHTML='<div style="font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+_envEsc(v.nome)+'</div><div style="font-size:11px;color:var(--ts)">'+R(v.preco)+'/'+_envEsc(v.unidade)+'</div>';
        const inp=document.createElement('input');
        inp.type='number';inp.min='0';inp.step='0.5';inp.value=v.quantidade;inp.setAttribute('inputmode','decimal');
        inp.style.cssText='width:80px;padding:8px;border:2px solid var(--v);border-radius:10px;font-size:15px;text-align:center;font-family:Manrope,sans-serif;font-weight:700;-webkit-appearance:none';
        inp.addEventListener('input',function(e){ v.quantidade=parseFloat(e.target.value)||0; calcTotal(); });
        inp.addEventListener('change',function(){ if(!(v.quantidade>0)) buildItens(); });
        const un=document.createElement('div');un.style.cssText='font-size:11px;color:var(--ts);width:30px;font-weight:600';un.textContent=v.unidade;
        const rm=document.createElement('button');rm.type='button';rm.title='Tirar do pedido';
        rm.style.cssText='background:none;border:none;color:#B5302E;font-size:16px;cursor:pointer;padding:4px;flex-shrink:0';
        rm.textContent='✕';
        rm.onclick=function(){ v.quantidade=0; buildItens(); };
        row.appendChild(info);row.appendChild(inp);row.appendChild(un);row.appendChild(rm);
        g.appendChild(row);
      });
      itensArea.appendChild(g);
    } else if(!_buscaNovoPed){
      itensArea.appendChild(div('tss mt2 mb2','Busque acima e toque no item pra adicionar — só o que você adicionar aparece aqui.'));
    }
    /* dropdown de sugestões */
    if(_buscaNovoPed && _buscaNovoPed.length>=2){
      const op=_pedCatalogo().filter(function(o){return !(qtdMap[o.id]&&qtdMap[o.id].quantidade>0);}).slice(0,12);
      const dd=div(null);
      dd.style.cssText='background:#fff;border:1.5px solid var(--rb);border-radius:12px;overflow:hidden;margin-bottom:10px;box-shadow:0 8px 24px rgba(170,43,43,.10)';
      if(!op.length) dd.appendChild(div('tss',null,{style:'padding:10px 12px',html:'Nada encontrado com esse nome.'}));
      op.forEach(function(o){
        const b=document.createElement('button'); b.type='button';
        b.style.cssText='display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:none;border-bottom:1px solid var(--rf);padding:9px 12px;font-family:Manrope,sans-serif;cursor:pointer';
        b.innerHTML='<span style="flex:1;min-width:0;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+_envEsc(o.nome)+(o.info?' <span style="font-weight:600;color:var(--ts);font-size:11px">'+_envEsc(o.info)+'</span>':'')+'</span>'
          +'<span style="font-size:10px;font-weight:800;color:var(--rm);flex-shrink:0">'+o.grupo+'</span>'
          +'<span style="font-size:11px;font-weight:700;color:var(--v);white-space:nowrap;flex-shrink:0">'+R(o.preco)+'/'+_envEsc(o.unidade)+'</span>';
        b.onclick=function(){
          qtdMap[o.id]={item:o.item,quantidade:1,preco:o.preco,unidade:o.unidade,nome:o.nome};
          _buscaNovoPed=''; buscaInp.value=''; buildItens(); buscaInp.focus();
        };
        dd.appendChild(b);
      });
      itensArea.appendChild(dd);
    }
    calcTotal();
  }

  // Total
  const totalEl=div('custo-box mt3 mb3');
  mb.appendChild(totalEl);

  function calcTotal(){
    const total=Object.values(qtdMap).reduce((t,v)=>t+(v.quantidade||0)*v.preco,0);
    totalEl.innerHTML='';
    const itensComQtd=Object.values(qtdMap).filter(v=>v.quantidade>0);
    if(itensComQtd.length){
      itensComQtd.forEach(v=>{
        const sub=(v.quantidade||0)*v.preco;
        const row=div('fl_ jb aic',null,{style:'font-size:12px;padding:3px 0;border-bottom:1px solid var(--rf)'});
        const nl=document.createElement('span');nl.textContent=v.nome+' × '+v.quantidade+' '+v.unidade;
        const sl=document.createElement('span');sl.style.cssText='font-weight:700;color:var(--v)';sl.textContent=R(sub);
        row.appendChild(nl);row.appendChild(sl);
        totalEl.appendChild(row);
      });
    }
    const totRow=div('fl_ jb aic mt2');
    const tl=document.createElement('strong');tl.textContent='TOTAL';
    const tv=document.createElement('span');tv.style.cssText='font-size:20px;font-weight:800;color:var(--v)';tv.textContent=R(total);
    totRow.appendChild(tl);totRow.appendChild(tv);
    totalEl.appendChild(totRow);
  }

  // ── Embalagens / utensílios do inventário (voltam pra Central) ──
  mb.appendChild(el('hr','dv'));
  const embTit=div(null);embTit.style.cssText='font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:var(--v);margin-bottom:3px';
  embTit.innerHTML='<i class="ph-duotone ph-package"></i> Embalagens / utensílios (voltam)';
  mb.appendChild(embTit);
  mb.appendChild(div('tss',null,{style:'margin-bottom:8px',html:'Caixas, potes e utensílios do inventário que vão junto e depois precisam voltar.'}));
  const embBusca=el('input','fi',null,{placeholder:'🔍 Buscar no inventário...',autocomplete:'off'});
  embBusca.style.cssText='width:100%;margin-bottom:8px';
  let _buscaEmb='';
  embBusca.addEventListener('input',e=>{_buscaEmb=e.target.value.toLowerCase();buildEmb();});
  mb.appendChild(embBusca);
  const embArea=div(null);mb.appendChild(embArea);
  function embRow(item){
    const id=item.id;
    if(!embMap[id])embMap[id]={item,quantidade:''};
    const row=document.createElement('div');
    row.style.cssText='display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;margin-bottom:4px;background:var(--rf);border:1px solid var(--rb)';
    const info=document.createElement('div');info.style.cssText='flex:1;min-width:0';
    info.innerHTML='<div style="font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+_envEsc(item.nome)+'</div>'+(item.categoria?'<div style="font-size:11px;color:var(--ts)">'+_envEsc(item.categoria)+'</div>':'');
    const inp=document.createElement('input');inp.type='number';inp.min='0';inp.step='1';inp.placeholder='0';inp.value=embMap[id].quantidade||'';inp.setAttribute('inputmode','numeric');
    inp.style.cssText='width:80px;padding:8px;border:2px solid var(--rb);border-radius:10px;font-size:15px;text-align:center;font-weight:700;-webkit-appearance:none';
    if(embMap[id].quantidade>0)inp.style.borderColor='var(--v)';
    inp.addEventListener('input',e=>{embMap[id].quantidade=parseFloat(e.target.value)||0;inp.style.borderColor=embMap[id].quantidade>0?'var(--v)':'var(--rb)';});
    const un=document.createElement('div');un.style.cssText='font-size:11px;color:var(--ts);width:30px;font-weight:600';un.textContent=item.unidade||'un';
    row.appendChild(info);row.appendChild(inp);row.appendChild(un);
    return row;
  }
  function buildEmb(){
    embArea.innerHTML='';
    const sel=_invAll.filter(x=>embMap[x.id]&&embMap[x.id].quantidade>0);
    const selIds=new Set(sel.map(x=>x.id));
    if(sel.length){const g=div(null);g.style.cssText='margin-bottom:8px';sel.forEach(it=>g.appendChild(embRow(it)));embArea.appendChild(g);}
    if(_buscaEmb){
      const matches=_invAll.filter(x=>!selIds.has(x.id)&&x.nome.toLowerCase().includes(_buscaEmb)).slice(0,20);
      if(matches.length){const g=div(null);matches.forEach(it=>g.appendChild(embRow(it)));embArea.appendChild(g);}
      else embArea.appendChild(div('tss',null,{style:'padding:8px',html:'Nada encontrado no inventário.'}));
    }
  }
  buildEmb();

  // Rodapé: responsável + obs
  mb.appendChild(el('hr','dv'));
  const inpResp=el('input','fi',null,{type:'text',placeholder:'Seu nome (obrigatório)'});
  inpResp.addEventListener('input',e=>{_respPed=e.target.value;inpResp.style.borderColor=e.target.value.trim()?'var(--vd)':'var(--rb)';});
  const inpObs=el('input','fi',null,{type:'text',placeholder:'Observações...'});
  inpObs.addEventListener('input',e=>_obsPed=e.target.value);
  mb.appendChild(div('fg2 mt2',[fgrp('✍️ Responsável',inpResp),fgrp('Observações',inpObs)]));

  // Footer
  const mf=div('mf');
  mf.appendChild(btn('btn bg','Cancelar',()=>ov.remove()));
  const saveBtn=btn('btn bp','Salvar rascunho',async()=>{
    if(!_respPed.trim()){inpResp.style.borderColor='#dc2626';inpResp.focus();return;}
    const itensValidos=Object.values(qtdMap).filter(v=>v.quantidade>0);
    if(!itensValidos.length){alert('Adicione pelo menos um item com quantidade.');return;}
    saveBtn.textContent='Salvando...';saveBtn.disabled=true;
    try{
      const total=itensValidos.reduce((t,v)=>t+(v.quantidade||0)*v.preco,0);
      const[ped]=await db('lola_pedidos','POST',{
        unidade:_destPed,status:'rascunho',
        data_pedido:_dataPed||TD(),
        valor_total:total,
        observacoes:_obsPed||null,
        responsavel:_respPed,
      });
      for(const v of itensValidos){
        await db('lola_pedidos_itens','POST',{
          pedido_id:ped.id,
          nome_item:v.nome,
          quantidade:v.quantidade,
          unidade:v.unidade,
          preco_unitario:v.preco,
        });
      }
      const embs=Object.values(embMap).filter(v=>v.quantidade>0);
      if(embs.length){
        await db('lola_pedido_embalagens','POST',embs.map(v=>({pedido_id:ped.id,inv_item_id:v.item.id,nome:v.item.nome,unidade:v.item.unidade||'un',quantidade:v.quantidade})));
      }
      _peds=await db('lola_pedidos','GET',null,'?select=*&order=created_at.desc');
      drawPed($('#ped-t'));
      ov.remove();
    }catch(e){alert('Erro: '+e.message);saveBtn.textContent='Salvar rascunho';saveBtn.disabled=false;}
  });
  mf.appendChild(saveBtn);
  mo.appendChild(mf);
  ov.appendChild(mo);
  document.body.appendChild(ov);
  buildItens();
}

async function editarPedido(ped){
  try{
    if(!_pp.length)_pp=await db('lola_preproducoes','GET',null,'?select=*&ativo=eq.true&order=nome.asc');
    if(!_ins.length)_ins=await db('lola_insumos','GET',null,'?select=*&ativo=eq.true&order=nome.asc');
    /* 19/07 (Bianca): "precisamos poder acrescentar insumos e também os itens que estão
       na CENTRAL do inventário" — 3ª aba no Adicionar item: utensílios/equipamentos do
       inventário que estão na Cozinha Central (vão junto e voltam; sem preço). */
    const _invCen=await db('lola_inv_itens','GET',null,'?select=id,nome,categoria&ativo=neq.false&unidade=eq.'+encodeURIComponent('Cozinha Central')+'&order=nome.asc').catch(function(){return [];});
    const embExist=await db('lola_pedido_embalagens','GET',null,'?select=*&pedido_id=eq.'+ped.id).catch(function(){return [];});
    const embs=embExist.map(function(e){return {inv_item_id:e.inv_item_id,nome:e.nome,unidade:e.unidade||'un',quantidade:parseFloat(e.quantidade)||0};});

    const existentes=await db('lola_pedidos_itens','GET',null,'?select=*&pedido_id=eq.'+ped.id);
    // Construir lista de itens editáveis
    const itens=existentes.map(it=>({
      nome:it.nome_item||'',
      unidade:it.unidade||'',
      preco:parseFloat(it.preco_unitario)||0,
      quantidade:parseFloat(it.quantidade)||0,
    }));

    let destino=ped.unidade||'ccmq';
    const ov=div('ov');
    const mo=div('mo moxl');
    mo.appendChild(div('mh',[
      el('h3',null,'✏️ Editar Pedido #'+ped.numero_pedido),
      btn('xb','✕',()=>ov.remove())
    ]));
    const mb=div('mb');
    mo.appendChild(mb);

    // Cabeçalho
    const destSel=fsel('',['ccmq','mac','terceiro'],destino,v=>{destino=v;});
    let dataPedido=ped.data_pedido||TD();
    const inpData=el('input','fi',null,{type:'date',value:dataPedido});
    inpData.addEventListener('change',e=>dataPedido=e.target.value);
    mb.appendChild(div('fg2 mb3',[
      fgrp('Destino',destSel),
      fgrp('Data',inpData),
    ]));

    mb.appendChild(el('hr','dv'));
    mb.appendChild(el('strong',null,'Itens do pedido',{style:'font-size:13px;display:block;margin:10px 0'}));

    // Tabela de itens
    const tblWrap=div('tw mb3');
    mb.appendChild(tblWrap);

    function rebuildTabela(){
      tblWrap.innerHTML='';
      if(!itens.length){
        tblWrap.appendChild(div('tss mt2','Nenhum item. Adicione abaixo.'));
        calcTotal();return;
      }
      const tbl=document.createElement('table');
      tbl.style.width='100%';tbl.style.borderCollapse='collapse';
      // thead
      const thead=document.createElement('thead');
      const htr=document.createElement('tr');
      ['Item','Un','Preço','Qtd','Subtotal',''].forEach((h,i)=>{
        const th=document.createElement('th');
        th.style.cssText='padding:7px 10px;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--v);background:var(--rt);text-align:'+(i>=2&&i<=4?'right':'left');
        th.textContent=h;htr.appendChild(th);
      });
      thead.appendChild(htr);tbl.appendChild(thead);
      // tbody
      const tbody=document.createElement('tbody');
      itens.forEach((it,idx)=>{
        const tr=document.createElement('tr');
        tr.style.cssText=(idx%2===0?'background:var(--rf)':'background:#fff')+';border-bottom:1px solid var(--rb)';

        function mkTd(txt,align,bold){
          const td=document.createElement('td');
          td.style.cssText='padding:7px 10px;font-size:12px;text-align:'+(align||'left')+(bold?';font-weight:700':'');
          td.textContent=txt||'';return td;
        }
        tr.appendChild(mkTd(it.nome,'left',true));
        tr.appendChild(mkTd(it.unidade));
        tr.appendChild(mkTd(R(it.preco),'right'));

        // Input quantidade
        const tdQtd=document.createElement('td');tdQtd.style.cssText='padding:4px 10px';
        const inpQ=document.createElement('input');inpQ.type='number';inpQ.min='0';inpQ.step='0.01';
        inpQ.value=it.quantidade;
        inpQ.style.cssText='width:75px;padding:5px 7px;border:1.5px solid var(--rb);border-radius:8px;font-size:12px;text-align:right;font-family:Manrope,sans-serif';
        inpQ.addEventListener('input',e=>{it.quantidade=parseFloat(e.target.value)||0;calcTotal();
          subTd.textContent=R(it.quantidade*it.preco);
          subTd.style.color=it.quantidade>0?'var(--v)':'var(--ts)';
        });
        tdQtd.appendChild(inpQ);tr.appendChild(tdQtd);

        // Subtotal
        const subTd=document.createElement('td');
        subTd.style.cssText='padding:7px 10px;font-size:12px;text-align:right;font-weight:700;color:'+(it.quantidade>0?'var(--v)':'var(--ts)');
        subTd.textContent=R(it.quantidade*it.preco);tr.appendChild(subTd);

        // Remover
        const tdRm=document.createElement('td');tdRm.style.cssText='padding:4px 10px;text-align:right';
        const rmBtn=btn('btn bd bxs','✕',()=>{itens.splice(idx,1);rebuildTabela();});
        tdRm.appendChild(rmBtn);tr.appendChild(tdRm);

        tbody.appendChild(tr);
      });
      tbl.appendChild(tbody);tblWrap.appendChild(tbl);
      calcTotal();
    }

    // Total
    const totalEl=div('custo-box mb3');
    mb.appendChild(totalEl);
    function calcTotal(){
      const total=itens.reduce((t,i)=>t+(i.quantidade*i.preco),0);
      totalEl.innerHTML='<div class="fl_ jb aic"><strong>TOTAL</strong><span class="bold tv" style="font-size:18px">'+R(total)+'</span></div>';
    }

    // Adicionar novo item
    mb.appendChild(el('strong',null,'+ Adicionar item',{style:'font-size:12px;color:var(--ts);display:block;margin-bottom:8px'}));
    let tipoAdd='preprods';
    const tabsAdd=div('tabs mb2');
    const optsWrap=div(null);

    function buildOpts(){
      optsWrap.innerHTML='';
      // Montar lista completa de itens para autocomplete
      let listaTotal=[];
      if(tipoAdd==='preprods'){
         /* MESMA regra da lista de grupos (ppPreco/ppUnidade) — antes daqui saía outro preço:
            usava custo/(1-m) em vez de custo/m (o editor usa /m) e não tinha a trava do "granel",
            então dividia 8 un por 200 g e o Risotinho ia a R$ 2.573. Uma regra só. — 15/07 */
         listaTotal=_pp.map(x=>{
           return {nome:x.nome,unidade:ppUnidade(x),preco:ppPreco(x),cat:x.categoria,info:ppInfo(x)};
         }).sort((a,b)=>a.nome.localeCompare(b.nome,'pt'));
      } else if(tipoAdd==='inv'){
        listaTotal=_invCen.map(function(x){return {nome:x.nome,unidade:'un',preco:0,cat:x.categoria||'',inv:x.id};})
          .sort(function(a,b){return a.nome.localeCompare(b.nome,'pt');});
      } else {
        listaTotal=_ins.map(x=>{
          const uc=x.unidade_custo||'kg';
          const uCompra=x.unidade_compra||uc;
          let precoPedido;
          if(uCompra==='g'&&uc==='kg') precoPedido=x.custo_por_unidade/1000;
          else if(uCompra==='ml'&&uc==='L') precoPedido=x.custo_por_unidade/1000;
          else precoPedido=x.custo_por_unidade;
          return {nome:x.nome,unidade:uCompra,preco:precoPedido,cat:x.categoria||''};
        }).sort((a,b)=>a.nome.localeCompare(b.nome,'pt'));
      }

      // Input de busca
      const searchWrap=div(null);searchWrap.style.cssText='position:relative';
      const inp=el('input','fi',null,{placeholder:'Digite para buscar...',autocomplete:'off'});
      inp.style.cssText='width:100%';
      const dropdown=div(null);
      dropdown.style.cssText='position:absolute;top:100%;left:0;right:0;background:#fff;border:1.5px solid var(--rb);border-radius:10px;max-height:220px;overflow-y:auto;z-index:999;display:none;box-shadow:0 8px 24px rgba(170,43,43,.12)';
      let selectedItem=null;

      function renderDropdown(q){
        dropdown.innerHTML='';
        const filtrado=q?listaTotal.filter(x=>x.nome.toLowerCase().includes(q.toLowerCase())):listaTotal.slice(0,20);
        if(!filtrado.length){dropdown.style.display='none';return;}
        filtrado.forEach(x=>{
          const row=document.createElement('div');
          row.style.cssText='padding:9px 14px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--rf);display:flex;justify-content:space-between;align-items:center';
          row.innerHTML='<span style="font-weight:600">'+x.nome+'</span><span style="font-size:11px;color:var(--ts)">'+(x.inv?'inventário · vai e volta':R(x.preco)+'/'+x.unidade)+'</span>';
          row.addEventListener('mousedown',e=>{
            e.preventDefault();
            selectedItem=x;
            inp.value=x.nome+(x.inv?' — inventário':' — '+R(x.preco)+'/'+x.unidade);
            dropdown.style.display='none';
          });
          row.addEventListener('mouseover',()=>row.style.background='var(--rf)');
          row.addEventListener('mouseout',()=>row.style.background='');
          dropdown.appendChild(row);
        });
        dropdown.style.display='block';
      }

      inp.addEventListener('input',e=>renderDropdown(e.target.value));
      inp.addEventListener('focus',()=>renderDropdown(inp.value));
      inp.addEventListener('blur',()=>setTimeout(()=>dropdown.style.display='none',150));
      searchWrap.appendChild(inp);searchWrap.appendChild(dropdown);

      const addBtn=btn('btn bp','+ Adicionar',()=>{
        if(!selectedItem){alert('Selecione um item da lista.');return;}
        if(selectedItem.inv){
          embs.push({inv_item_id:selectedItem.inv,nome:selectedItem.nome,unidade:'un',quantidade:1});
          rebuildEmb();
        } else {
          itens.push({...selectedItem,quantidade:0});
          rebuildTabela();
        }
        inp.value='';selectedItem=null;dropdown.style.display='none';
      });
      addBtn.style.cssText='white-space:nowrap;flex-shrink:0';

      const row=div('fl_ gap2 mt2 aic');
      row.style.alignItems='flex-start';
      row.appendChild(searchWrap);row.appendChild(addBtn);
      optsWrap.appendChild(row);
    }

    ['Pré-produções','Insumos','Inventário (Central)'].forEach((lb,i)=>{
      const k=['preprods','insumos','inv'][i];
      const p=span('tp'+(tipoAdd===k?' active':''),lb);
      p.addEventListener('click',()=>{tipoAdd=k;tabsAdd.querySelectorAll('.tp').forEach(x=>x.classList.remove('active'));p.classList.add('active');buildOpts();});
      tabsAdd.appendChild(p);
    });
    mb.appendChild(tabsAdd);mb.appendChild(optsWrap);
    buildOpts();

    /* embalagens/utensílios do inventário (voltam) — editável aqui também (19/07) */
    const embWrap=div(null); mb.appendChild(embWrap);
    function rebuildEmb(){
      embWrap.innerHTML='';
      const ativos=embs.filter(function(v){return v.quantidade>0;});
      if(!ativos.length) return;
      const t=div(null); t.style.cssText='font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:var(--v);margin:14px 0 6px';
      t.innerHTML='<i class="ph-duotone ph-package"></i> Embalagens / utensílios (voltam)';
      embWrap.appendChild(t);
      ativos.forEach(function(v){
        const row=document.createElement('div');
        row.style.cssText='display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:10px;margin-bottom:4px;background:var(--rf);border:1px solid var(--rb)';
        const nm=document.createElement('div'); nm.style.cssText='flex:1;min-width:0;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis';
        nm.textContent=v.nome;
        const inpQ=document.createElement('input'); inpQ.type='number'; inpQ.min='0'; inpQ.step='1'; inpQ.value=v.quantidade; inpQ.setAttribute('inputmode','numeric');
        inpQ.style.cssText='width:70px;padding:6px;border:1.5px solid var(--rb);border-radius:8px;font-size:13px;text-align:center;font-family:Manrope,sans-serif;font-weight:700';
        inpQ.addEventListener('input',function(e){ v.quantidade=parseFloat(e.target.value)||0; });
        inpQ.addEventListener('change',function(){ if(!(v.quantidade>0)) rebuildEmb(); });
        const un=document.createElement('span'); un.style.cssText='font-size:11px;color:var(--ts);width:24px;font-weight:600'; un.textContent='un';
        const rm=document.createElement('button'); rm.type='button'; rm.title='Tirar';
        rm.style.cssText='background:none;border:none;color:#B5302E;font-size:15px;cursor:pointer;padding:4px;flex-shrink:0'; rm.textContent='✕';
        rm.onclick=function(){ v.quantidade=0; rebuildEmb(); };
        row.appendChild(nm); row.appendChild(inpQ); row.appendChild(un); row.appendChild(rm);
        embWrap.appendChild(row);
      });
    }
    rebuildEmb();

    // Footer
    const obsInp=finp('',ped.observacoes||'',v=>ped.observacoes=v);
    mb.appendChild(div('mt3',[fgrp('Observações',obsInp)]));

    const mf=div('mf');
    mf.appendChild(btn('btn bg','Cancelar',()=>ov.remove()));
    const saveBtn=btn('btn bp','Salvar',async()=>{
      const itensValidos=itens.filter(i=>i.quantidade>0);
      if(!itensValidos.length){alert('Adicione pelo menos um item com quantidade.');return;}
      saveBtn.textContent='Salvando...';saveBtn.disabled=true;
      try{
        const total=itensValidos.reduce((t,i)=>t+(i.quantidade*i.preco),0);
        await db('lola_pedidos','PATCH',{unidade:destino,data_pedido:dataPedido,valor_total:total,observacoes:ped.observacoes||null},'?id=eq.'+ped.id);
        // Inserir novos itens primeiro, só apagar os antigos se tudo der certo
        const novosItens=[];
        for(const it of itensValidos){
          const[novo]=await db('lola_pedidos_itens','POST',{pedido_id:ped.id,nome_item:it.nome,quantidade:it.quantidade,unidade:it.unidade,preco_unitario:it.preco});
          novosItens.push(novo);
        }
        // Só apagar os antigos se todos os novos foram inseridos com sucesso
        if(novosItens.length===itensValidos.length){
          // Apagar apenas os itens antigos (não os recém inseridos)
          const novosIds=novosItens.map(n=>n.id);
          const antigosItens=existentes.filter(e=>!novosIds.includes(e.id));
          for(const antigo of antigosItens){
            await db('lola_pedidos_itens','DELETE',null,'?id=eq.'+antigo.id);
          }
        }
        /* embalagens do inventário: regrava o conjunto (19/07) */
        try{
          await db('lola_pedido_embalagens','DELETE',null,'?pedido_id=eq.'+ped.id);
          const embV=embs.filter(function(v){return v.quantidade>0;});
          if(embV.length) await db('lola_pedido_embalagens','POST',embV.map(function(v){return {pedido_id:ped.id,inv_item_id:v.inv_item_id,nome:v.nome,unidade:v.unidade||'un',quantidade:v.quantidade};}));
        }catch(eEmb){ alert('Itens salvos, mas as embalagens falharam: '+eEmb.message); }
        _peds=await db('lola_pedidos','GET',null,'?select=*&order=created_at.desc');
        // Reconstruir tabs de meses com os dados atualizados
        const mesesNovos=[...new Set(_peds.map(p=>p.data_pedido?.substring(0,7)).filter(Boolean))].sort().reverse();
        const mesTabs=$('#mes-tabs-ped');
        if(mesTabs){
          mesTabs.innerHTML='';
          const all=span('tp'+(!_pedMes?' active':''),'Todos os meses');
          all.addEventListener('click',()=>{_pedMes='';buildMesTabs();atualizaResumo();drawPed($('#ped-t'));});
          mesTabs.appendChild(all);
          mesesNovos.forEach(m=>{
            const[ano,mes]=m.split('-');
            const label=new Date(ano,parseInt(mes)-1,1).toLocaleDateString('pt-BR',{month:'short',year:'2-digit'});
            const p=span('tp'+(_pedMes===m?' active':''),label.charAt(0).toUpperCase()+label.slice(1));
            p.addEventListener('click',()=>{_pedMes=m;buildMesTabs();atualizaResumo();drawPed($('#ped-t'));});
            mesTabs.appendChild(p);
          });
        }
        drawPed($('#ped-t'));
        ov.remove();
      }catch(e){alert('Erro ao salvar: '+e.message);saveBtn.textContent='Salvar';saveBtn.disabled=false;}
    });
    mf.appendChild(saveBtn);
    mo.appendChild(mf);

    ov.appendChild(mo);
    ov.addEventListener('click',e=>{if(e.target===ov&&!mo.contains(e.target))ov.remove();});
    document.body.appendChild(ov);

    rebuildTabela();

  }catch(e){alert('Erro ao abrir pedido: '+e.message);}
}


async function verPedido(ped){
  const itens=await db('lola_pedidos_itens','GET',null,'?select=*&pedido_id=eq.'+ped.id);
  const embs=await db('lola_pedido_embalagens','GET',null,'?select=*&pedido_id=eq.'+ped.id+'&order=nome.asc').catch(()=>[]);
  const destLabel=ped.unidade==='ccmq'?'CCMQ':ped.unidade==='mac'?'Mac':(ped.destinatario||ped.unidade);
  let embSection=null;
  if((embs||[]).length){
    embSection=div(null);embSection.style.cssText='margin-top:16px';
    const pend=embs.filter(e=>!e.devolvido).length;
    embSection.appendChild(div(null,null,{style:'font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:var(--v);margin-bottom:8px',html:'<i class="ph-duotone ph-package"></i> Embalagens / utensílios (voltam)'+(pend?' <span style="background:#FBF0DD;color:#9A6B1E;padding:1px 8px;border-radius:50px;font-size:10px">'+pend+' a voltar</span>':' <span style="background:#dcfce7;color:#166534;padding:1px 8px;border-radius:50px;font-size:10px">tudo devolvido</span>')}));
    embs.forEach(em=>{
      const row=div(null);row.style.cssText='display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;margin-bottom:6px;background:var(--rf);border:1px solid var(--rb)';
      const info=div(null);info.style.cssText='flex:1;min-width:0';
      const b=btn('','',()=>{});
      function paint(){
        info.innerHTML='<div style="font-weight:700;font-size:13px">'+_envEsc(em.nome)+' <span style="color:var(--v)">· '+N(em.quantidade,0)+' '+_envEsc(em.unidade||'un')+'</span></div>'+(em.devolvido?'<div style="font-size:11px;color:#166534">✓ devolvido'+(em.devolvido_em?' '+new Date(em.devolvido_em).toLocaleDateString('pt-BR'):'')+(em.devolvido_por?' · '+_envEsc(em.devolvido_por):'')+'</div>':'<div style="font-size:11px;color:#9A6B1E">aguardando devolução</div>');
        b.textContent=em.devolvido?'Reabrir':'Devolvido';
        b.className='btn '+(em.devolvido?'bo':'bp')+' bsm';
        b.style.cssText='flex-shrink:0;font-size:12px;font-weight:800';
      }
      b.onclick=async()=>{
        const novo=!em.devolvido;b.disabled=true;
        try{
          await db('lola_pedido_embalagens','PATCH',{devolvido:novo,devolvido_em:novo?new Date().toISOString():null,devolvido_por:novo?(ME||null):null},'?id=eq.'+em.id);
          em.devolvido=novo;em.devolvido_em=novo?new Date().toISOString():null;em.devolvido_por=novo?(ME||null):null;paint();
        }catch(e){alert('Erro: '+e.message);}
        b.disabled=false;
      };
      paint();
      row.appendChild(info);row.appendChild(b);embSection.appendChild(row);
    });
  }
  mkModal('📋 Pedido #'+ped.numero_pedido+' — '+destLabel,[
    div('g3 mb3',[
      div('custo-box',[span('scl','Destino'),div('bold mt2',destLabel)]),
      div('custo-box',[span('scl','Data'),div('bold mt2',DBR(ped.data_pedido))]),
      div('custo-box',[span('scl','Status'),div('bold tv mt2',ped.status)]),
    ]),
    ...(ped.observacoes?[div('al ali mb3',ped.observacoes)]:[]),
    div('tw',mkTable(
      ['Item','UN','Qtd','Preço Unit.','Subtotal'],
      itens.map(it=>[
        el('strong',null,it.nome_item||'—'),
        it.unidade||'',
        N(it.quantidade,2),
        R(it.preco_unitario),
        el('span','bold tv',R(it.subtotal)),
      ]),
      [null,null,'tr','tr','tr']
    )),
    div('fl_ jb aic mt3',[
      el('strong',null,'TOTAL'),
      el('strong','tv',R(ped.valor_total),{style:'font-size:20px'}),
    ]),
    ...(embSection?[embSection]:[]),
  ],null,'mo mol');
}

async function imprimirPed(ped){

      <div><strong>Pedido Nº:</strong> #${ped.numero_pedido}</div>
      <div><strong>Data:</strong> ${DBR(ped.data_pedido)}</div>
      <div><strong>Destino:</strong> ${destLabel}</div>
      <div><strong>Status:</strong> ${ped.status}</div>
      ${ped.observacoes?`<div colspan="2"><strong>Obs:</strong> ${ped.observacoes}</div>`:''}
    </div>
    <table style="width:100%;border-collapse:collapse;margin-bottom:18px">
      <thead><tr style="background:#AA2B2B;color:#fff">
        <th style="padding:10px 11px;text-align:left;font-size:11px;letter-spacing:1px">PRODUTO</th>

        <th style="padding:10px 11px;text-align:right;font-size:11px">PREÇO UN.</th>
        <th style="padding:10px 11px;text-align:right;font-size:11px">SUBTOTAL</th>

      <tbody>${rows}</tbody>
      <tfoot>
        <tr style="border-top:2px solid #AA2B2B">
          <td colspan="4" style="padding:12px;text-align:right;font-weight:800;font-size:15px">TOTAL</td>
          <td style="padding:12px;text-align:right;font-weight:900;font-size:20px;color:#AA2B2B">${R(itens.reduce((s,x)=>s+(parseFloat(x.quantidade)||0)*(parseFloat(x.preco_unitario)||0),0))}</td>
        </tr>

    </table>
    ${embHtml}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:50px;margin-top:36px">

   FICHA DO INSUMO — painel com TUDO: preço, de qual nota veio,
   fornecedor, saldo, FC, onde é usado e histórico.
   Puxa da função insumo_ficha(uuid) do banco. — 16/07
   ══════════════════════════════════════════════════════════════ */
const _IFE=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function _ifData(d){ if(!d)return'—'; const p=String(d).slice(0,10).split('-'); return p.length===3?(p[2]+'/'+p[1]+'/'+p[0]):d; }
function _ifNum(v,c){ return (+v||0).toLocaleString('pt-BR',{maximumFractionDigits:c==null?3:c}); }

async function abrirFichaInsumo(insumoId, nomeFallback){
  const ov=div('ov'); const mo=div('mo mol');
  mo.addEventListener('click',e=>e.stopPropagation());
  ov.addEventListener('click',e=>{ if(e.target===ov) ov.remove(); });
  mo.appendChild(div('mh',[el('h3',null,nomeFallback||'Insumo'),
    btn('btn bg bsm','✎ Editar',()=>{ ov.remove(); const _it=_ins.find(x=>x.id===insumoId); if(_it) modalIns(_it); }),
    btn('xb','✕',()=>ov.remove())]));
  const mb=div('mb'); mb.appendChild(div('ld',[div('sp'),document.createTextNode('Buscando...')]));
  mo.appendChild(mb); ov.appendChild(mo); document.body.appendChild(ov);
  try{
    const r=await db('rpc/insumo_ficha','POST',{iid:insumoId});
    const d=Array.isArray(r)?r[0]:r;
    if(!d||!d.cadastro){ mb.innerHTML='<p class="tss">Não encontrei os dados deste insumo.</p>'; return; }
    _renderFichaInsumo(mb, d, ov);
    const h3=mo.querySelector('h3'); if(h3) h3.textContent=d.cadastro.nome||nomeFallback||'Insumo';
  }catch(e){ mb.innerHTML='<p style="color:#B5302E;padding:10px">Erro: '+_IFE(e.message)+'</p>'; }
}

function _renderFichaInsumo(mb, d, ov){
  const c=d.cadastro||{}, uc=c.unidade_custo||'kg';
  const compra=d.ultima_compra, fc=d.fc, saldo=d.saldo||{};
  const cad=+c.custo_por_unidade||0, ult=compra?(+compra.preco_unit||0):0;
  const dif=(cad>0&&ult>0)?((ult-cad)/cad*100):0;
  const desatualizado = compra && Math.abs(dif)>=1;

  let h='';
  /* topo: cadastrado × última compra */
  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">';
  h+= '<div style="background:#fff;border:1px solid var(--rb);border-radius:12px;padding:11px 13px">'
    +   '<div style="font-size:9px;font-weight:800;letter-spacing:1px;color:#A08B7F;text-transform:uppercase">Custo cadastrado</div>'
    +   '<div style="font-family:Fraunces,serif;font-size:22px;font-weight:600;color:var(--v);line-height:1.1;margin-top:2px">'+R(cad)+'</div>'
    +   '<div style="font-size:11px;font-weight:700;color:#7C6A60;text-transform:uppercase;letter-spacing:.5px">'+_IFE(insUnExt(uc))+'</div>'
    +   '<div style="font-size:10px;color:#B79A8E;margin-top:4px"><i class="ph-duotone ph-clock-counter-clockwise"></i> '
    +     (c.preco_atualizado_em?('atualizado '+_ifData(c.preco_atualizado_em)+(c.preco_atualizado_por?(' por '+_IFE(c.preco_atualizado_por)):'')):'sem atualização registrada')
    +   '</div></div>';
  if(compra){
    const alerta=desatualizado;
    h+= '<div style="background:'+(alerta?'#FBF0DD':'#fff')+';border:1px solid '+(alerta?'#F1DFB8':'var(--rb)')+';border-radius:12px;padding:11px 13px">'
      +   '<div style="font-size:9px;font-weight:800;letter-spacing:1px;color:'+(alerta?'#9A6B1E':'#A08B7F')+';text-transform:uppercase">Última compra</div>'
      +   '<div style="font-family:Fraunces,serif;font-size:22px;font-weight:600;color:'+(alerta?'#9A6B1E':'var(--v)')+';line-height:1.1;margin-top:2px">'+R(ult)+'</div>'
      +   '<div style="font-size:11px;font-weight:700;color:'+(alerta?'#9A6B1E':'#7C6A60')+';text-transform:uppercase;letter-spacing:.5px">por '+_IFE(compra.unidade||uc)+' · '+_ifData(compra.data)+'</div>'
      +   (alerta?('<div style="font-size:10px;color:#9A6B1E;margin-top:4px;font-weight:700"><i class="ph-duotone ph-warning-circle"></i> '+(dif>0?'+':'')+_ifNum(dif,1)+'% em relação ao cadastro</div>'):'')
      + '</div>';
  } else {
    h+='<div style="background:#fff;border:1px solid var(--rb);border-radius:12px;padding:11px 13px">'
      +'<div style="font-size:9px;font-weight:800;letter-spacing:1px;color:#A08B7F;text-transform:uppercase">Última compra</div>'
      +'<div style="font-size:12px;color:#B79A8E;margin-top:6px">Nenhuma entrada por nota registrada.</div></div>';
  }
  h+='</div>';

  /* de onde veio */
  if(compra){
    h+='<div style="font-size:10px;font-weight:800;letter-spacing:1px;color:#A08B7F;text-transform:uppercase;margin:0 2px 6px">De onde veio esse preço</div>';
    h+='<div style="background:#fff;border:1px solid var(--rb);border-radius:12px;padding:12px 14px;margin-bottom:14px">';
    h+= '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">'
      +  '<span style="width:26px;height:26px;border-radius:8px;background:#E6F3EA;color:#2C7A4B;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0"><i class="ph-duotone ph-'+(compra.origem_tipo==='manual'?'pencil-simple':'receipt')+'"></i></span>'
      +  '<div style="flex:1;min-width:0">'
      +    '<div style="font-size:13px;font-weight:700;color:var(--tx)">'+_IFE(compra.fornecedor||'(entrada manual — sem nota)')+'</div>'
      +    '<div style="font-size:11px;color:#8A7A72">'+(compra.nota_numero?('Nota '+_IFE(compra.nota_numero)+' · '):'')+_ifData(compra.data)+(compra.lancado_por?(' · lançada por '+_IFE(compra.lancado_por)):'')+'</div>'
      +  '</div></div>';
    h+= '<div style="border-top:1px solid #F3EBE2;padding-top:8px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">'
      +  '<div><div style="font-size:9px;color:#A08B7F;text-transform:uppercase;letter-spacing:.5px">Quantidade</div><div style="font-size:13px;font-weight:700">'+_ifNum(compra.qtd)+' '+_IFE(compra.unidade||'')+'</div></div>'
      +  '<div><div style="font-size:9px;color:#A08B7F;text-transform:uppercase;letter-spacing:.5px">Preço unit.</div><div style="font-size:13px;font-weight:700">'+R(compra.preco_unit)+'</div></div>'
      +  '<div><div style="font-size:9px;color:#A08B7F;text-transform:uppercase;letter-spacing:.5px">Total</div><div style="font-size:13px;font-weight:700">'+R(compra.total)+'</div></div>'
      + '</div>';
    if(compra.descricao_na_nota){
      h+='<div style="border-top:1px solid #F3EBE2;padding-top:8px;margin-top:8px">'
        +'<div style="font-size:9px;color:#A08B7F;text-transform:uppercase;letter-spacing:.5px">Como veio escrito na nota</div>'
        +'<div style="font-size:12px;color:#5F4E46;font-style:italic">"'+_IFE(compra.descricao_na_nota)+'"</div></div>';
    }
    if(desatualizado){
      h+='<button id="ifUsarPreco" style="width:100%;margin-top:10px;background:var(--v);color:#fff;border:0;border-radius:9px;padding:9px;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer">Usar '+R(ult)+' como custo atual</button>';
    }
    h+='</div>';
  }

  /* saldo + FC */
  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">';
  h+= '<div style="background:#fff;border:1px solid var(--rb);border-radius:12px;padding:11px 13px">'
    +  '<div style="font-size:9px;font-weight:800;letter-spacing:1px;color:#A08B7F;text-transform:uppercase">Saldo em estoque</div>'
    +  '<div style="font-size:16px;font-weight:700;margin-top:2px">'+_ifNum(saldo.qtd)+' '+_IFE(uc)+'</div>'
    +  '<div style="font-size:11px;color:#8A7A72">'+R(saldo.valor)+'</div></div>';
  h+= '<div style="background:#fff;border:1px solid var(--rb);border-radius:12px;padding:11px 13px">'
    +  '<div style="font-size:9px;font-weight:800;letter-spacing:1px;color:#A08B7F;text-transform:uppercase">Peso / fator</div>'
    +  '<div style="font-size:16px;font-weight:700;margin-top:2px">'+((fc&&fc.fc)?('FC '+_ifNum(fc.fc,2)):(c.peso_un_g?(_ifNum(c.peso_un_g,0)+' g/un'):'—'))+'</div>'
    +  '<div style="font-size:11px;color:#8A7A72">'+((fc&&fc.peso_medio_g)?('1 un ≈ '+_ifNum(fc.peso_medio_g,0)+' g'):(c.peso_un_g?'peso da embalagem':'sem fator cadastrado'))+'</div></div>';
  h+='</div>';

  /* onde é usado */
  const usos=d.usado_em||[];
  h+='<div style="font-size:10px;font-weight:800;letter-spacing:1px;color:#A08B7F;text-transform:uppercase;margin:0 2px 6px">Onde é usado ('+usos.length+')</div>';
  if(!usos.length){ h+='<div style="background:#fff;border:1px solid var(--rb);border-radius:12px;padding:12px;font-size:11px;color:#B79A8E;margin-bottom:14px">Não entra em nenhuma receita.</div>'; }
  else{
    h+='<div style="background:#fff;border:1px solid var(--rb);border-radius:12px;overflow:hidden;margin-bottom:14px">';
    usos.forEach((u,i)=>{
      h+='<div style="display:flex;align-items:center;gap:8px;padding:9px 13px'+(i?';border-top:1px solid #F3EBE2':'')+'">'
        +'<span style="font-size:9px;font-weight:800;padding:2px 7px;border-radius:50px;background:'+(u.tipo==='preparo'?'#7A4FA3':'#C0392B')+';color:#fff;flex-shrink:0">'+(u.tipo==='preparo'?'PREPARO':'PRATO')+'</span>'
        +'<div style="flex:1;min-width:0;font-size:12.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+_IFE(u.nome)+'</div>'
        +'<div style="text-align:right;flex-shrink:0"><div style="font-size:12px;font-weight:700">'+_ifNum(u.qtd)+' '+_IFE(u.unidade||'')+'</div>'
        +'<div style="font-size:10px;color:#8A7A72">'+R(u.custo)+(u.fc&&+u.fc!==1?(' · FC '+_ifNum(u.fc,2)):'')+'</div></div></div>';
    });
    h+='</div>';
  }

  /* histórico */
  const hist=d.historico_preco||[];
  h+='<div style="font-size:10px;font-weight:800;letter-spacing:1px;color:#A08B7F;text-transform:uppercase;margin:0 2px 6px">Histórico de preço</div>';
  if(!hist.length){
    h+='<div style="background:#fff;border:1px solid var(--rb);border-radius:12px;padding:14px;text-align:center;font-size:11px;color:#B79A8E;line-height:1.5">Nenhuma alteração registrada ainda.<br>A partir de agora, toda mudança grava <b style="color:#7C6A60">de onde veio</b> — nota, planilha do mês ou manual.</div>';
  }else{
    h+='<div style="background:#fff;border:1px solid var(--rb);border-radius:12px;overflow:hidden">';
    hist.forEach((x,i)=>{
      const de=+x.de||0, para=+x.para||0;
      const sobe=para>de, v=de>0?((para-de)/de*100):0;
      const ORI={nota:'da nota',planilha:'da planilha do mês',manual:'na mão',correcao:'correção de cadastro'};
      h+='<div style="display:flex;align-items:center;gap:8px;padding:9px 13px'+(i?';border-top:1px solid #F3EBE2':'')+'">'
        +'<div style="flex:1;min-width:0"><div style="font-size:12px;font-weight:700">'+R(de)+' → '+R(para)+'</div>'
        +'<div style="font-size:10px;color:#8A7A72">'+_ifData(x.quando)+(x.quem?(' · '+_IFE(x.quem)):'')
        + (x.origem?(' · <b style="color:#7C6A60">'+_IFE(ORI[x.origem]||x.origem)+'</b>'):'') +'</div></div>'
        +(de>0?('<span style="font-size:11px;font-weight:800;color:'+(sobe?'#B5302E':'#2C7A4B')+';flex-shrink:0">'+(sobe?'▲':'▼')+' '+_ifNum(Math.abs(v),0)+'%</span>'):'')
        +'</div>';
    });
    h+='</div>';
  }

  mb.innerHTML=h;

  /* botão: adotar o preço da nota */
  const bt=mb.querySelector('#ifUsarPreco');
  if(bt) bt.onclick=async()=>{
    bt.disabled=true; bt.textContent='Salvando...';
    try{
      await db('lola_insumos_historico','POST',{insumo_id:c.id,custo_anterior:cad,custo_novo:ult,
        alterado_por:ME||null,origem:'nota',origem_ref:compra.nota_chave||null,
        observacao:'Adotado da nota '+(compra.nota_numero||'')+' — '+(compra.fornecedor||'')});
      await db('lola_insumos','PATCH',{custo_por_unidade:ult,preco_atualizado_em:new Date().toISOString(),preco_atualizado_por:ME||null},'?id=eq.'+c.id);
      _ins=await db('lola_insumos','GET',null,'?select=*&ativo=eq.true&order=categoria.asc,nome.asc');
      ov.remove();
      alert('✅ Custo atualizado para '+R(ult)+'.\n\nRegistrado que veio da nota '+(compra.nota_numero||'')+'.\n\n⚠️ As receitas que usam este insumo ainda NÃO recalculam sozinhas — abra e salve cada uma, ou espere a cascata.');
      try{ if(PAGE==='insumos'&&window._drawIns) window._drawIns(document.getElementById('ins-t')); }catch(_){}
    }catch(e){ alert('Erro: '+e.message); bt.disabled=false; bt.textContent='Usar '+R(ult)+' como custo atual'; }
  };
}

function fichaTable(itens,rendQtd,rendUn,custoTotal,custoPorcao,titulo,historico,fotos,modoPreparo){
  // Construção imperativa para evitar bugs com null/string em children
  function td(txt,style,children){
    const t=document.createElement('td');
    t.style.cssText=style||'padding:8px 10px;font-size:12px';
    if(children){children.forEach(c=>t.appendChild(c));}
    else if(txt!=null)t.appendChild(document.createTextNode(String(txt)));
    return t;
  }
  function th(txt,align){
    const t=document.createElement('th');
    t.style.cssText='padding:8px 10px;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--v);background:var(--rt);white-space:nowrap;text-align:'+(align||'left');
    t.appendChild(document.createTextNode(txt));
    return t;
  }

  const tbl=document.createElement('table');
  tbl.style.cssText='width:100%;border-collapse:collapse;';

  // THEAD
  const thead=document.createElement('thead');
  const hRow=document.createElement('tr');
  [['Insumo','left'],['Obs','left'],['UN','center'],['Qtd Líq.','right'],['Qtd Bruta','right'],
   ['Perda','right'],['FC','right'],['% Perda','right'],['Preço kg·L·un','right'],['Custo','right']]
  .forEach(([h,a])=>hRow.appendChild(th(h,a)));
  thead.appendChild(hRow);
  tbl.appendChild(thead);

  // TBODY
  const tbody=document.createElement('tbody');
  (itens||[]).forEach((it,idx)=>{
    const nome=it.lola_insumos?.nome||it.lola_preproducoes?.nome||it.lola_preproducoes_sub?.nome||it.nome_manual||'—';
    const isPP=!it.lola_insumos?.nome;
    const preco=parseFloat(it.custo_unitario)||0;
    const qb=parseFloat(it.qtd_bruta)||0;
    const bruto=(qb)*(parseFloat(it.fc)||1);
    const perda=Math.max(0,bruto-qb);
    const pct=bruto>0?Math.round((perda/bruto)*100):0;
    const fc=parseFloat(it.fc)||1;
    const tr=document.createElement('tr');
    tr.style.cssText=(idx%2===0?'background:var(--rf)':'background:#fff')+';border-bottom:1px solid var(--rb)';
    // Coluna nome com badge
    const tdNome=document.createElement('td');
    tdNome.style.cssText='padding:8px 10px;font-size:12px';
    const badge=document.createElement('span');
    badge.className='bq '+(isPP?'bce':'bc');
    badge.textContent=isPP?'PP':'Ins';
    tdNome.appendChild(badge);
    if(!isPP && it.insumo_id){
      // insumo: clicar abre a ficha completa (preço, de qual nota veio, fornecedor, saldo, usos)
      const lk=document.createElement('span');
      lk.textContent=' '+nome;
      lk.style.cssText='cursor:pointer;border-bottom:1px dashed var(--v);color:var(--v);font-weight:600';
      lk.title='Ver a ficha deste insumo — preço, nota, fornecedor';
      lk.addEventListener('click',()=>abrirFichaInsumo(it.insumo_id,nome));
      tdNome.appendChild(lk);
    } else {
      tdNome.appendChild(document.createTextNode(' '+nome));
    }
    tr.appendChild(tdNome);
    tr.appendChild(td(it.nome_manual||'','padding:8px 10px;font-size:11px;color:var(--ts)'));
    tr.appendChild(td(it.unidade||'g','padding:8px 10px;font-size:12px;text-align:center'));
    tr.appendChild(td(N(qb,2),'padding:8px 10px;font-size:12px;text-align:right'));
    tr.appendChild(td(N(bruto,2),'padding:8px 10px;font-size:12px;text-align:right'));
    tr.appendChild(td(N(perda,2),'padding:8px 10px;font-size:12px;text-align:right;color:var(--ts)'));
    tr.appendChild(td(N(fc,2),'padding:8px 10px;font-size:12px;text-align:right'));
    tr.appendChild(td(pct+'%','padding:8px 10px;font-size:12px;text-align:right;color:'+(pct>20?'var(--v)':'var(--ts)')));
    tr.appendChild(td(R(preco),'padding:8px 10px;font-size:12px;text-align:right'));
    const tdCusto=document.createElement('td');
    tdCusto.style.cssText='padding:8px 10px;font-size:12px;text-align:right;color:var(--v)';
    const strong=document.createElement('strong');
    strong.textContent=R(it.custo_total);
    tdCusto.appendChild(strong);
    tr.appendChild(tdCusto);
    tbody.appendChild(tr);
  });
  tbl.appendChild(tbody);

  // TFOOT
  const tfoot=document.createElement('tfoot');
  const r1=document.createElement('tr');
  /* 19/07 (Bianca): "deixar mais minimalista essas duas faixas coloridas" — os dois
     rodapés cheios de cor viraram linhas discretas: fundo claro, texto na cor. */
  const t1a=document.createElement('td');t1a.colSpan=9;t1a.style.cssText='padding:9px 10px;font-weight:700;font-size:10.5px;background:none;border-top:2px solid #2a6645;color:#2a6645;text-transform:uppercase;letter-spacing:1px';t1a.textContent='Custo total da receita';
  const t1b=document.createElement('td');t1b.style.cssText='padding:9px 10px;font-weight:800;font-size:13px;background:none;border-top:2px solid #2a6645;color:#2a6645;text-align:right';t1b.textContent=R(custoTotal);
  r1.appendChild(t1a);r1.appendChild(t1b);
  const r2=document.createElement('tr');
  const t2a=document.createElement('td');t2a.colSpan=9;t2a.style.cssText='padding:9px 10px;font-weight:700;font-size:10.5px;background:none;border-top:1px solid var(--rb);color:var(--v);text-transform:uppercase;letter-spacing:1px';const _unBaseRod=rendUn==='g'?'KG':rendUn==='ml'?'L':rendUn.toUpperCase();t2a.textContent='Custo por porção / '+_unBaseRod;
  const t2b=document.createElement('td');t2b.style.cssText='padding:9px 10px;font-weight:800;font-size:14px;background:none;border-top:1px solid var(--rb);color:var(--v);text-align:right';t2b.textContent=R(custoPorcao);
  r2.appendChild(t2a);r2.appendChild(t2b);
  tfoot.appendChild(r1);tfoot.appendChild(r2);
  tbl.appendChild(tfoot);

  // Resumo cards
  const resumo=div('g3 mb3',[
    div('custo-box',[span('scl','Rendimento'),div('bold tv mt2',N(rendQtd,0)+' '+rendUn)]),
    div('custo-box',[span('scl','Custo total'),div('bold tv mt2',R(custoTotal))]),
    div('custo-box',[span('scl','Custo/'+(rendUn==='g'?'kg':rendUn==='ml'?'L':rendUn)),div('bold tv mt2',R(custoPorcao))]),
  ]);

  const scrollWrap=document.createElement('div');
  scrollWrap.style.overflowX='auto';
  if(!itens||!itens.length){
    const vazio=document.createElement('p');
    vazio.className='tss mt3';
    vazio.textContent='(Nenhum ingrediente vinculado ainda — use ✏️ para adicionar)';
    scrollWrap.appendChild(vazio);
  } else {
    scrollWrap.appendChild(tbl);
  }
  // Seção de histórico
  let histEl=null;
  if(historico&&historico.length){
    histEl=document.createElement('div');
    histEl.style.cssText='margin-top:18px';
    const hTitle=document.createElement('div');
    hTitle.style.cssText='font-size:13px;font-weight:700;color:var(--ts);margin-bottom:10px;display:flex;align-items:center;gap:6px';
    hTitle.textContent='🕒 Histórico de alterações';
    histEl.appendChild(hTitle);
    historico.forEach(h=>{
      const row=document.createElement('div');
      row.style.cssText='padding:10px 14px;background:var(--rf);border-radius:9px;margin-bottom:7px;border-left:3px solid var(--v)';
      const data=new Date(h.editado_em).toLocaleString('pt-BR');
      const quem=document.createElement('div');
      quem.style.cssText='font-size:12px;font-weight:700;color:var(--v)';
      quem.textContent=(h.editado_por||'Não informado')+' · '+data;
      const desc=document.createElement('div');
      desc.style.cssText='font-size:12px;color:var(--tx);margin-top:3px';
      desc.textContent=h.descricao||'Ficha editada';
      row.appendChild(quem);
      row.appendChild(desc);
      histEl.appendChild(row);
    });
  }
  let fotosEl=null;
  if(fotos&&fotos.length){

// Converte quantidade na unidade informada para a unidade base do insumo (g ou ml → kg/L)
function calcCustoItem(qtdBruta, fc, unQtd, custo_por_unidade, unCusto){
  const ql=(parseFloat(qtdBruta)||0)*(parseFloat(fc)||1);
  const cu=parseFloat(custo_por_unidade)||0;
  // Se a quantidade está em g/ml e o custo é por kg/L → divide por 1000
  if(['g','ml'].includes(unQtd) && ['kg','L'].includes(unCusto)) return (ql/1000)*cu;
  // Se a quantidade está em kg/L e o custo é por kg/L → direto
  if(['kg','L'].includes(unQtd) && ['kg','L'].includes(unCusto)) return ql*cu;
  // un, cx, pct → direto
  return ql*cu;
}

function mkTable(headers,rows,aligns,useRowStyle){
  const thead=el('thead',null,el('tr',null,headers.map((h,hi)=>el('th',aligns&&aligns[hi]||null,h))));
  const tbody=el('tbody',null,rows.map(rowData=>{
    // Suporta tanto array simples quanto {cells,style}
    const cells=useRowStyle&&rowData.cells?rowData.cells:rowData;
    const rowStyle=useRowStyle&&rowData.style?rowData.style:'';
    const tr=el('tr',null,cells.map((c,ci)=>{
      const td=el('td',aligns&&aligns[ci]||null);
      if(headers&&headers[ci]!=null)td.setAttribute('data-label',String(headers[ci]));
      if(c==null)return td;
      if(typeof c==='string'||typeof c==='number')td.appendChild(document.createTextNode(String(c)));
      else td.appendChild(c);
      return td;
    }));
    if(rowStyle)tr.style.cssText=rowStyle;
    return tr;
  }));
  return el('table',null,[thead,tbody]);
}

/* ═══════════ RECÁLCULO DE PREÇOS — a cascata insumo → pré-produção → ficha ═══════════
   O motor mora no BANCO, não aqui:
     lola_cascata_calc(limite)      → só lê, devolve o que MUDARIA
     lola_cascata_aplicar(limite,por) → grava, com backup de tudo
     lola_cascata_desfazer(exec,por)  → volta ao que era
   As duas travas moram lá dentro e são aplicadas DURANTE o cálculo, então um
   preparo reprovado fica congelado e quem usa ele NÃO herda o número podre:
     1) mudança >= 150%  → não grava (não existe preço que faça isso)
     2) CMV acima de 100% → não grava (o prato custaria mais do que vende)
   Passar do limite de 30%/50% NÃO trava: grava e a etiqueta vermelha acusa.  */
const _CASC_LIM=150;
let _cascRows=null, _cascExec=null;
function _cscN(v){const n=parseFloat(v);return isFinite(n)?n:0;}
function _cscPct(a,b){a=_cscN(a);if(!a)return null;return (_cscN(b)-a)/Math.abs(a)*100;}
function _cscE(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function _cscPctTxt(p){ if(p==null) return '—'; return (p>0?'+':'')+Math.round(p)+'%'; }

async function abrirRecalculo(){
  const ov=div('ov'); const mo=div('mo mol');
  mo.addEventListener('click',e=>e.stopPropagation());
  ov.addEventListener('click',e=>{ if(e.target===ov) ov.remove(); });
  mo.appendChild(div('mh',[el('h3',null,'Recalcular receitas'),btn('xb','✕',()=>ov.remove())]));
  const mb=div('mb');

  mo.appendChild(mb); ov.appendChild(mo); document.body.appendChild(ov);
  try{
    const rows=await db('rpc/lola_cascata_calc','POST',{p_limite_pct:_CASC_LIM});
    _cascRows=rows||[]; _cascExec=null;
    _cscPrevia(mb,mo,ov);
  }catch(e){ mb.innerHTML='<p style="color:#B5302E;padding:10px">Não consegui calcular: '+_cscE(e.message)+'</p>'; }
}

function _cscCard(n,lb,cor){ return '<div class="csc-c"><b style="color:'+cor+'">'+n+'</b><i>'+lb+'</i></div>'; }

function _cscPrevia(mb,mo,ov){
  const rows=_cascRows||[];
  const apl=rows.filter(r=>String(r.decisao||'').indexOf('aplicar')===0);
  const trv=rows.filter(r=>r.decisao==='suspeito'||r.decisao==='bloqueado');
  const eq =rows.filter(r=>r.decisao==='sem mudanca');
  const ord=(a,b)=>Math.abs(_cscPct(b.custo_hoje,b.custo_novo)||0)-Math.abs(_cscPct(a.custo_hoje,a.custo_novo)||0);
  const fA=apl.filter(r=>r.tipo==='ficha').sort(ord);
  const pA=apl.filter(r=>r.tipo==='pp').sort(ord);

  let h='<div class="csc-res">'
    + _cscCard(apl.length,'vão ser atualizados','#2C7A4B')
    + _cscCard(trv.length,'travados pra revisão','#B5302E')
    + _cscCard(eq.length,'já estão certos','#8A7A72')
    + '</div>';

  h+='<p class="csc-exp">Refiz a conta de cada receita com o preço de hoje de cada insumo — '
   + 'inclusive preparo dentro de preparo. Quando o resultado é grande demais pra ser preço '
   + '(mudança acima de '+_CASC_LIM+'%) '
   + 'ou faria o prato custar mais do que vende, eu <b>não gravo</b>: o valor fica congelado e a ficha '
   + 'é etiquetada pra revisão. <b>Nada é aplicado até você clicar no botão lá embaixo.</b></p>';

  if(fA.length) h+=_cscBloco('Pratos',fA,true);
  if(pA.length) h+=_cscBloco('Pré-produções',pA,false);
  if(trv.length) h+=_cscTrava(trv);
  if(eq.length) h+='<p class="csc-exp" style="margin:16px 0 0">E '+eq.length+' receita'+(eq.length>1?'s já estão':' já está')+' com o custo em dia — nessas não mexo.</p>';

  mb.innerHTML=h;
  _cscFooter(mo,mb,ov,apl.length);
}

function _cscBloco(tit,list,ehFicha){
  let h='<div class="csc-sec">'+tit+' <u>'+list.length+'</u></div><div class="csc-tbl">'
   + '<div class="csc-hd"><div>Nome</div><div>Hoje</div><div>Vira</div><div>'+(ehFicha?'CMV':'Diferença')+'</div></div>';
  list.forEach(function(r){
    const sobe=_cscN(r.custo_novo)>_cscN(r.custo_hoje);
    const dir=sobe?'sobe':'desce';
    let ult;
    if(ehFicha && _cscN(r.preco_venda)>0){
      const lim=_cscN(r.limite_cmv)||30;
      ult='<span class="csc-cmv">'+Math.round(_cscN(r.cmv_hoje))+'%</span> → '
        + '<span class="csc-cmv'+(_cscN(r.cmv_novo)>lim?' alto':'')+'">'+Math.round(_cscN(r.cmv_novo))+'%</span>';
    } else {
      ult='<span class="csc-d '+dir+'">'+_cscPctTxt(_cscPct(r.custo_hoje,r.custo_novo))+'</span>';
    }
    h+='<div class="csc-row">'
      + '<div class="csc-nome">'+_cscE(r.nome)
      +   (r.decisao==='aplicar_parcial'?'<span class="csc-tag" title="'+_cscE(r.motivo||'')+'">parcial</span>':'')
      + '</div>'
      + '<div class="csc-v">'+R(_cscN(r.unit_hoje))+'</div>'
      + '<div class="csc-v novo '+dir+'">'+R(_cscN(r.unit_novo))+'</div>'
      + '<div class="csc-u">'+ult+'</div>'
      + '</div>';
  });
  return h+'</div>';
}

function _cscTrava(list){
  let h='<div class="csc-sec trava">Não vou mexer nestes <u>'+list.length+'</u></div>'
   + '<p class="csc-exp">A conta daria um número que não faz sentido — isso é cadastro errado, não preço. '
   + 'Ficam com o custo de hoje e etiquetados como <b>REVISAR</b>, com o motivo escrito na ficha. '
   + 'Quem usa eles também não herda o número ruim.</p><div class="csc-trv">';
  list.forEach(function(r){
    h+='<div class="csc-trvi">'
      + '<div class="csc-trvn">'+_cscE(r.nome)+'<span class="csc-tp">'+(r.tipo==='ficha'?'prato':'preparo')+'</span></div>'
      + '<div class="csc-trvm">'+_cscE(r.motivo||'')+'</div>'
      + '<div class="csc-trvv">fica em <b>'+R(_cscN(r.unit_hoje))+'</b>'
      +   (r.unit_novo!=null?' · a conta daria '+R(_cscN(r.unit_novo)):'')+'</div>'
      + '</div>';
  });
  return h+'</div>';
}

function _cscFooter(mo,mb,ov,n){
  const old=mo.querySelector('.mf'); if(old) old.remove();
  const mf=div('mf',[btn('btn bg','Fechar',()=>ov.remove())]);

function _cscFeito(mb,mo,ov,d){
  const nf=d.fichas||0, np=d.preparos||0, nq=(d.suspeitos||0)+(d.bloqueados||0);
  mb.innerHTML='<div class="csc-ok">'

    + '<div class="csc-okd">'+nf+' prato'+(nf===1?'':'s')+' e '+np+' pré-produç'+(np===1?'ão':'ões')+' com o custo em dia.'
    +   (nq?'<br>'+nq+' ficaram etiquetados como <b>REVISAR</b> — o custo deles não mudou.':'')
    + '</div>'
    + '<div class="csc-okn">Se algum número parecer errado, dá pra voltar tudo como estava.</div>'
    + '</div>';
  const old=mo.querySelector('.mf'); if(old) old.remove();
  const mf=div('mf');

      }catch(e){ alert('Erro ao desfazer: '+e.message); ub.textContent='Desfazer tudo'; ub.disabled=false; }
    });
    mf.appendChild(ub);
  }
  mf.appendChild(btn('btn bp','Fechar',()=>{ov.remove();nav('insumos');}));
  mo.appendChild(mf);

/* ── BAIXAR / IMPORTAR PLANILHA DE PREÇOS (1x/mês) ── */
function _mesAtual(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
async function _getInsumos(){
  if(_ins&&_ins.length)return _ins;
  _ins=await db('lola_insumos','GET',null,'?select=*&ativo=eq.true&order=categoria.asc,nome.asc');
  return _ins;
}
function _parseNum(v){
  if(v===null||v===undefined||v==='')return null;
  if(typeof v==='number')return isNaN(v)?null:v;
  var s=String(v).replace(/[R$\s]/g,'');
  if(s.indexOf(',')>-1&&s.indexOf('.')>-1){s=s.replace(/\./g,'').replace(',','.');}
  else if(s.indexOf(',')>-1){s=s.replace(',','.');}
  var n=parseFloat(s);return isNaN(n)?null:n;
}
async function exportInsumosXlsx(){

    if(typeof XLSX==='undefined'){alert('A planilha ainda está carregando. Tente de novo em alguns segundos.');return;}
    var ins=await _getInsumos();
    if(!ins.length){alert('Nenhum insumo para exportar.');return;}
    var rows=ins.map(function(i){return {
      ID:i.id,

function importInsumosXlsx(){
  if(typeof XLSX==='undefined'){alert('A planilha ainda está carregando. Tente de novo em alguns segundos.');return;}
  var inp=document.createElement('input');
  inp.type='file';inp.accept='.xlsx,.xls';
  inp.addEventListener('change',function(){
    var file=inp.files&&inp.files[0];if(!file)return;
    var rd=new FileReader();
    rd.onload=async function(ev){
      try{
        var wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});
        var ws=wb.Sheets[wb.SheetNames[0]];
        var rows=XLSX.utils.sheet_to_json(ws,{defval:''});
        await _getInsumos();
        var byId={};_ins.forEach(function(i){byId[String(i.id)]=i;});
        var byNome={};_ins.forEach(function(i){byNome[(i.nome||'').trim().toLowerCase()]=i;});
        var changes=[];
        rows.forEach(function(r){
          var custoRaw=r['Custo por unidade (R$)'];
          if(custoRaw===undefined||custoRaw===''){for(var k in r){if(/custo/i.test(k)){custoRaw=r[k];break;}}}
          var novo=_parseNum(custoRaw);
          if(novo===null)return;
          var ins=(r.ID!==undefined&&r.ID!=='')?byId[String(r.ID).trim()]:null;
          if(!ins&&r.Nome)ins=byNome[String(r.Nome).trim().toLowerCase()];
          if(!ins)return;
          var atual=Number(ins.custo_por_unidade||0);
          if(Math.abs(novo-atual)>0.0001)changes.push({ins:ins,old:atual,novo:novo});
        });
        if(!changes.length){alert('Nenhuma mudança de preço encontrada na planilha.');return;}
        _confirmImport(changes);
      }catch(e){alert('Não consegui ler a planilha: '+e.message);}
    };
    rd.readAsArrayBuffer(file);
  });
  inp.click();
}
function _confirmImport(changes){

    div('al ali','Confira as alterações. Ao salvar, o custo desses insumos é atualizado e o histórico registrado.'),

  ],async function(){

      var novoValorPago=un==='g/ml'?c.novo*(qtd/1000):c.novo*qtd;
      await db('lola_insumos_historico','POST',{insumo_id:i.id,custo_anterior:i.custo_por_unidade,custo_novo:c.novo,alterado_por:ME||null});
      await db('lola_insumos','PATCH',{custo_por_unidade:c.novo,valor_pago:novoValorPago,preco_atualizado_em:new Date().toISOString(),preco_atualizado_por:ME||null},'?id=eq.'+i.id);
    }

/* ── CONFERÊNCIA DE PREÇOS ── */
var _CONF=null,_confF='all';
function _cesc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch];});}
function _confNorm(s){
  s=String(s||'').toLowerCase();
  try{s=s.normalize('NFD').replace(/[̀-ͯ]/g,'');}catch(e){}
  s=s.replace(/_/g,' ').replace(/[^a-z0-9 ]/g,' ');
  var stop={kg:1,kgs:1,g:1,gr:1,grs:1,grama:1,gramas:1,un:1,und:1,unid:1,unidade:1,unidades:1,l:1,lt:1,litro:1,litros:1,ml:1,molho:1,maco:1,caixa:1,cx:1,pacote:1,pct:1,pc:1,dz:1,duzia:1};
  var toks=s.split(/\s+/).filter(function(t){return t && !stop[t] && !/^\d+$/.test(t);});
  return toks.join(' ').trim();
}
function _confUn(u){
  u=String(u||'').toLowerCase().trim();
  if(/kg|kilo|quilo/.test(u))return 'kg';
  if(/litro|^l$|^lt$/.test(u))return 'L';
  if(/ml|mililit/.test(u))return 'ml';
  if(/^g$|grama|^gr/.test(u))return 'g';
  if(/unid|^un$|^und|^un\.?$/.test(u))return 'un';
  if(/caixa|^cx/.test(u))return 'cx';
  if(/pacote|^pct/.test(u))return 'pct';
  if(/maco|maço|molho/.test(u))return 'un';
  if(/duzia|d[uú]zia|^dz/.test(u))return 'dz';
  return u||'';
}
function _confParse(wb){
  var best={items:[]};
  wb.SheetNames.forEach(function(sn){
    var ws=wb.Sheets[sn]; if(!ws)return;
    var aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
    var nameCol=-1,priceCol=-1,unitCol=-1,hdr=-1;
    for(var r=0;r<Math.min(aoa.length,20);r++){
      var row=aoa[r]||[],nc=-1,pc=-1,uc=-1,ci;
      for(ci=0;ci<row.length;ci++){if(nc<0 && /(descri|nome|insumo|produto|item)/.test(String(row[ci]||'').toLowerCase()))nc=ci;}
      for(ci=0;ci<row.length;ci++){if(pc<0 && ci!==nc && /(custo|pre[çc]o|valor)/.test(String(row[ci]||'').toLowerCase()))pc=ci;}
      for(ci=0;ci<row.length;ci++){if(uc<0 && ci!==nc && ci!==pc && /(unid|un\.|medida|base)/.test(String(row[ci]||'').toLowerCase()))uc=ci;}
      if(pc>=0 && nc>=0 && pc!==nc){nameCol=nc;priceCol=pc;unitCol=uc;hdr=r;break;}
    }
    var items=[];
    if(hdr>=0){
      for(var r2=hdr+1;r2<aoa.length;r2++){
        var row2=aoa[r2]||[];
        var price=_parseNum(row2[priceCol]);
        var nome=String(row2[nameCol]||'').trim();
        if(price===null||!nome)continue;
        if(/descri|nome do insumo|produto/i.test(nome))continue;
        items.push({nome:nome,custo:price,un:unitCol>=0?String(row2[unitCol]||'').trim():''});
      }
    }
    if(items.length>best.items.length)best={items:items,sheet:sn};
  });
  return best;
}
function _confBuild(items){
  var byKey={};
  items.forEach(function(it){var k=_confNorm(it.nome);if(k && !(k in byKey))byKey[k]=it;});
  var rows=(_ins||[]).map(function(i){
    var atual=Number(i.custo_por_unidade||0),atualUn=_confUn(i.unidade_custo||'');
    var it=byKey[_confNorm(i.nome)];if(it)it._used=true;
    var status,sheetPrice=null,sheetUn='',newPrice='',newUn=atualUn;
    if(it){
      sheetPrice=it.custo;sheetUn=_confUn(it.un);
      if(sheetUn && atualUn && sheetUn!==atualUn){status='unit';newPrice='';}
      else{newPrice=sheetPrice;status=(sheetPrice>atual+0.005)?'up':(sheetPrice<atual-0.005)?'down':'eq';}
    }else{status='none';}
    return {id:i.id,nome:i.nome,cat:i.categoria||'',atual:atual,atualUn:atualUn,sheetPrice:sheetPrice,sheetUn:sheetUn,status:status,newPrice:newPrice,newUn:newUn,apply:(status==='up'||status==='down')};
  });
  var unmatched=items.filter(function(it){return !it._used;}).map(function(it){return it.nome;});
  return {when:new Date().toISOString(),rows:rows,unmatched:unmatched};
}
function _confUpload(c){
  if(typeof XLSX==='undefined'){alert('A planilha ainda está carregando. Tente de novo em alguns segundos.');return;}
  var inp=document.createElement('input');inp.type='file';inp.accept='.xlsx,.xls';
  inp.addEventListener('change',function(){
    var file=inp.files&&inp.files[0];if(!file)return;
    var rd=new FileReader();
    rd.onload=async function(ev){
      try{
        var wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});
        var parsed=_confParse(wb);
        if(!parsed.items.length){alert('Não encontrei colunas de descrição e custo na planilha. Confira se há uma coluna com o nome do insumo e outra com o custo/preço.');return;}
        await _getInsumos();
        _CONF=_confBuild(parsed.items);_confF='all';
        try{localStorage.setItem('lola_conf_precos',JSON.stringify(_CONF));}catch(e){}
        pgConferencia(c);
      }catch(e){alert('Não consegui ler a planilha: '+e.message);}
    };
    rd.readAsArrayBuffer(file);
  });
  inp.click();
}

  root.querySelectorAll('.cf-ap').forEach(function(e){var g=+e.dataset.gi;if(_CONF.rows[g])_CONF.rows[g].apply=e.checked;});

  root.querySelectorAll('.cf-un').forEach(function(e){var g=+e.dataset.gi;if(_CONF.rows[g])_CONF.rows[g].newUn=e.value;});
  try{localStorage.setItem('lola_conf_precos',JSON.stringify(_CONF));}catch(e){}
}

          '<div style="display:flex;align-items:center"><input class="cf-pr" data-gi="'+gi+'" inputmode="decimal" value="'+((r.newPrice===''||r.newPrice==null)?'':r.newPrice)+'" placeholder="'+(r.status==='none'?'—':'')+'" style="width:58%;border:0;background:transparent;font-weight:700;font-size:.92rem;color:var(--v);padding:0"><input class="cf-un" data-gi="'+gi+'" value="'+_cesc(r.newUn||'')+'" style="width:42%;border:0;border-left:1px solid var(--rb);background:transparent;font-weight:600;font-size:.78rem;color:var(--tx);padding:2px 0 2px 6px"></div>'+

function _confRender(c){
  var rows=_CONF.rows,cnt={up:0,down:0,eq:0,unit:0,none:0};
  rows.forEach(function(r){cnt[r.status]=(cnt[r.status]||0)+1;});

  c.appendChild(res);

  defs.forEach(function(d){var b=document.createElement('button');b.type='button';var on=_confF===d[0];b.style.cssText='flex:0 0 auto;background:'+(on?'var(--v)':'#fff')+';color:'+(on?'#fff':'var(--tx)')+';border:1.5px solid '+(on?'var(--v)':'var(--rb)')+';border-radius:50px;padding:7px 13px;font-weight:700;font-size:.78rem;white-space:nowrap;cursor:pointer';b.textContent=d[1]+' '+d[2];b.addEventListener('click',function(){_confSync(c);_confF=d[0];pgConferencia(c);});chips.appendChild(b);});

  var apBtn=el('button','btn bp',null,{html:'<i class="ph-duotone ph-check"></i> Aplicar selecionados',onclick:function(){_confApply(c);}});apBtn.style.cssText='width:100%;padding:13px;font-weight:800';
  ab.appendChild(apBtn);c.appendChild(ab);
}
async function _confApply(c){
  _confSync(c);
  var valid=[];
  _CONF.rows.forEach(function(r){if(r.apply){var n=_parseNum(r.newPrice);if(n!=null&&n>=0)valid.push({r:r,novo:n});}});
  if(!valid.length){alert('Marque ao menos um item com preço novo válido.');return;}
  if(!confirm('Aplicar '+valid.length+' preço(s)? O custo será atualizado e o histórico registrado.'))return;
  var ok=0;
  for(var i=0;i<valid.length;i++){
    var r=valid[i].r,novo=valid[i].novo;
    try{
      await db('lola_insumos_historico','POST',{insumo_id:r.id,custo_anterior:r.atual,custo_novo:novo,alterado_por:ME||null});
      var patch={custo_por_unidade:novo,valor_pago:novo,preco_atualizado_em:new Date().toISOString(),preco_atualizado_por:ME||null};
      var nu=_confUn(r.newUn);
      if(nu && nu!==r.atualUn){patch.unidade_custo=nu;patch.unidade_compra=nu;}
      await db('lola_insumos','PATCH',patch,'?id=eq.'+r.id);
      r.atual=novo;if(nu&&nu!==r.atualUn)r.atualUn=nu;r.status='eq';r.apply=false;ok++;
    }catch(e){}
  }
  _ins=await db('lola_insumos','GET',null,'?select=*&ativo=eq.true&order=categoria.asc,nome.asc');
  try{localStorage.setItem('lola_conf_precos',JSON.stringify(_CONF));}catch(e){}
  alert('✅ '+ok+' preço(s) atualizados!');
  pgConferencia(c);
}
function pgConferencia(c){
  c.innerHTML='';
  if(!_CONF){try{var s=localStorage.getItem('lola_conf_precos');if(s)_CONF=JSON.parse(s);}catch(e){}}
  var bar=div('no-print');bar.style.cssText='display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:6px 0 14px';
  bar.appendChild(el('button','btn bp',null,{html:'<i class="ph-duotone ph-upload-simple"></i> '+(_CONF?'Subir outra planilha':'Subir planilha de preços'),onclick:function(){_confUpload(c);}}));
  if(_CONF){
    bar.appendChild(el('button','btn bo bsm',null,{html:'<i class="ph-duotone ph-trash"></i> Limpar',onclick:function(){if(!confirm('Limpar a conferência atual?'))return;_CONF=null;try{localStorage.removeItem('lola_conf_precos');}catch(e){}pgConferencia(c);}}));
    var inf=span('tss','Conferência de '+(_CONF.when?new Date(_CONF.when).toLocaleString('pt-BR'):''));bar.appendChild(inf);
  }
  c.appendChild(bar);
  if(!_CONF){
    var hint=div(null);hint.style.cssText='background:#fff;border:1.5px dashed var(--v);border-radius:14px;padding:18px;color:var(--ts);font-size:13px;line-height:1.6';
    hint.innerHTML='Suba a planilha de preços do mês (.xlsx). O sistema casa por <b>nome do insumo</b>, mostra <b>preço atual × preço novo</b> e a <b>unidade</b>, indica se <b>subiu/baixou</b> e deixa você conferir e editar item a item antes de aplicar. As colunas (Descrição / Custo / Unidade) são detectadas automaticamente.';
    c.appendChild(hint);return;
  }
  _confRender(c);
}

async function _entrar(){

  else{

      /* Sem sessão no domínio certo = não entrou. Dentro de iframe não redireciono:
         jogaria o portal inteiro dentro da moldura. */
      if(q.get('embed')==='1'){ document.body.innerHTML='<div style="padding:40px;text-align:center;font:600 14px system-ui;color:#6b5a52">Sua sessão expirou. Recarregue o portal e entre de novo.</div>'; return false; }
      location.replace('https://equipelola.net/'); return false;
    }
    try{ ME=(q.get('u')||'').trim(); }catch(_){}   // casa velha: como sempre foi
  }
  if(ME){
    try{
      const r=await db('rpc/portal_cozinhas_edit','POST',{p_nome:ME});
      _PODE=Array.isArray(r)?r:(r||[]);            // sem cadastro → [] → só vê
    }catch(e){ _PODE=[]; }                          // deu erro? não libera. Falha pro lado seguro.
  }
  return true;
}

(function(){
  var q=new URLSearchParams(location.search);
  if(q.get('embed')!=='1') return;
  var st=document.createElement('style');
  st.textContent='.topbar,.sidebar,.mob-overlay{display:none!important}.app-body{min-height:100vh!important}.main{width:100%!important;max-width:980px!important;margin:0 auto!important}'
    /* 17/07: editor grande em embed vira página inteira (a Bianca: "a tela deveria entrar inteira e nao com esse fundo estranho escuro") */
    +'body.embed .ov:has(.mol),body.embed .ov:has(.moxl){background:#FBF7F1!important;backdrop-filter:none!important}'
    +'body.embed .ov .mo.mol,body.embed .ov .mo.moxl{width:100%!important;max-width:100%!important;height:100%!important;max-height:100%!important;border-radius:0!important;border:0!important;box-shadow:none!important}'
    /* regra real: mesmo em tela cheia, o CONTEÚDO respeita 980px centralizado */
    +'body.embed .ov .mo.mol .mh,body.embed .ov .mo.moxl .mh,body.embed .ov .mo.mol .mb,body.embed .ov .mo.moxl .mb{max-width:980px;margin-left:auto!important;margin-right:auto!important;width:100%}';
  document.head.appendChild(st);
  document.body.classList.add('embed');
  /* avisa o pai (Central) da altura do conteúdo (mata a rolagem dupla) e de modal aberto (pai expande o iframe) */
  var _embH=0; setInterval(function(){ var h=document.documentElement.scrollHeight; if(Math.abs(h-_embH)>2){ _embH=h; try{ parent.postMessage({type:'lola-embed-h',h:h},'*'); }catch(_){} } },350);
  var _embOv=false; setInterval(function(){ var on=!!document.querySelector('.ov'); if(on!==_embOv){ _embOv=on; try{ parent.postMessage({type:'lola-embed-modal',on:on},'*'); }catch(_){} } },250);
  window.addEventListener('message',function(e){var d=(e&&e.data)||{};if(d.type==='lola-nav'&&d.page&&typeof nav==='function'){nav(d.page);}});
})();
/* Agora sim: primeiro descobre QUEM é (e o que pode), só então desenha. Se renderizasse
   antes, os botões de editar apareceriam pra todo mundo por um instante — e um instante
   é suficiente pra clicar. */
_entrar().then(function(ok){
  if(!ok) return;                      // portão barrou: já redirecionou ou avisou
  renderPage();
  var q=new URLSearchParams(location.search);
  var pg=q.get('page'); if(pg&&typeof nav==='function'){ nav(pg); }
  try{ if(window.parent&&window.parent!==window) window.parent.postMessage({type:'lola-ready'},'*'); }catch(_){}
});
</script>
</body>
</html>
