  const _tabBeb=(_ftTab||'').indexOf('beb_')===0;
  const _tabCard=_tabBeb?_ftTab.slice(4):(['ccmq','mac','eventos','central'].includes(_ftTab)?_ftTab:'ccmq');
  const _defCat=item?.categoria||(_tabBeb?'bebida':'prato');
  let f={nome:item?.nome||'',cardapio:item?.cardapio||_tabCard,categoria:_defCat,rendimento_qtd:item?.rendimento_qtd||1,rendimento_un:item?.rendimento_un||'porção',preco_venda:item?.preco_venda||'',meta_cmv:item?.meta_cmv||30,modo_preparo:item?.modo_preparo||'',observacoes:item?.observacoes||'',e_preparo:!!item?.e_preparo,produto_pronto:!!item?.produto_pronto,no_menu:item?(item.no_menu!==false):true};
  // Custo fixo do banco — não zera ao editar preço de venda
  let custoTotalFixo=parseFloat(item?.custo_total||0);
  let custoPorcaoFixo=parseFloat(item?.custo_por_porcao||0);
  const ings=[];
  const iw=div(null);
  const custoResEl=div('custo-box');
  let precoInp=null,metaCmvInp=null,_precoSug=0;

  // Carregar ingredientes existentes se estiver editando
  if(ed && item?.id){
    try{
      const existentes=await db('lola_fichas_tecnicas_itens','GET',null,
        '?select=*,lola_insumos(id,nome,custo_por_unidade,unidade_compra),lola_preproducoes(id,nome,custo_por_unidade,rendimento_un)&ficha_id=eq.'+item.id);
      existentes.forEach(it=>{
        const isIns=!!it.lola_insumos;
        ings.push({
          tipo:isIns?'insumo':'prep',
          id:isIns?it.lola_insumos.id:it.lola_preproducoes?.id,
          qtd_bruta:it.qtd_bruta,
          qtd_liquida:it.qtd_liquida,
          fc:it.fc,
          custo_unitario:it.custo_unitario,
          custo_total:it.custo_total,
          unidade:it.unidade,
        });
      });
    }catch(e){console.error('Erro ao carregar itens da ficha:',e);}
  }

  function calcTotais(){
    const ct=ings.length>0?ings.reduce((t,ig)=>t+parseFloat(ig.custo_total||0),0):custoTotalFixo;
    const qtd=parseFloat(f.rendimento_qtd||1);
    const cpp=ings.length>0?ct/qtd:custoPorcaoFixo;
    const pv=parseFloat(f.preco_venda)||0;
    const cmv=pv>0?(cpp/pv*100):null;
    const meta=parseFloat(f.meta_cmv)||33;
    _precoSug=meta>0?cpp/(meta/100):0;
    const _lim=f.produto_pronto?50:30;
    const cmvCor=cmv==null?'':(cmv<=_lim?'var(--vd)':'#dc2626');
    custoResEl.innerHTML=somaIngredientesHTML(ings)+'<div class="fl_ jb mb3"><span>Custo total</span><strong>'+R(ct)+'</strong></div>'+
      '<div class="fl_ jb mb3"><span>Custo/porção</span><strong class="tv">'+R(cpp)+'</strong></div>'+
      (cmv!=null?'<div class="fl_ jb mb3"><span>CMV atual <span style="font-size:10px;opacity:.6">(limite '+_lim+'%)</span></span><strong style="color:'+cmvCor+'">'+cmv.toFixed(0)+'%</strong></div>':'')+
      '<div class="fl_ jb"><span>Preço sugerido (CMV '+meta+'%)</span><strong class="tv">'+R(_precoSug)+'</strong></div>';
  }

  // Lista unificada: insumos + pré-prods em ordem alfabética com prefixo
  function mkOptsUnificada(){
    const ins=_ins.map(i=>{
      // Determinar unidade de uso baseada na unidade_compra e unidade_custo
      const uc=i.unidade_custo||'kg';
      let unUso;
      if(i.unidade_compra==='g/ml') unUso=uc==='L'?'ml':'g';
      else if(['g','ml'].includes(i.unidade_compra)) unUso=i.unidade_compra;
      else if(i.unidade_compra==='kg') unUso='g';   // compra em kg → usa em g nas receitas
      else if(i.unidade_compra==='L') unUso='ml';   // compra em L → usa em ml nas receitas
      else unUso=i.unidade_compra||'un';             // un, cx, etc
      return {v:'ins:'+i.id,l:i.nome,custo:i.custo_por_unidade,un:unUso,tipo:'insumo',srcId:i.id};
    });
    const pps=_pp.map(p=>({v:'pp:'+p.id,l:'[PP] '+p.nome,custo:p.custo_por_unidade,un:p.rendimento_un,tipo:'prep',srcId:p.id}));
    return [...ins,...pps].sort((a,b)=>a.l.localeCompare(b.l,'pt'));
  }

  function rebuildI(){
    iw.innerHTML='';
    const optsAll=mkOptsUnificada();
    ings.forEach((ig,idx)=>{
      // Badge fixo (insumo ou prep, baseado na seleção)
      const tipoBadge=span('bq '+(ig.tipo==='prep'?'bce':'bc'),ig.tipo==='prep'?'PP':'Ins');
      tipoBadge.style.cssText='font-size:10px;padding:2px 8px;border-radius:50px;font-weight:700;white-space:nowrap;flex-shrink:0';

      // Select unificado com opção em branco no início
      const sel=el('select','fi',null,{style:'flex:2;min-width:0'});
      sel.appendChild(el('option',null,'— selecione —',{value:''}));
      optsAll.forEach(o=>{
        const opt=el('option',null,o.l,{value:o.v});
        // Marcar selecionado: comparar tipo+id
        const curVal=(ig.tipo==='insumo'?'ins:':'pp:')+ig.id;
        if(o.v===curVal)opt.selected=true;
        sel.appendChild(opt);
      });
      sel.addEventListener('change',e=>{
        const val=e.target.value;
        if(!val){ig.id='';ig.custo_unitario=0;ig.custo_total=0;ig.unidade='g';ig.tipo='insumo';rebuildI();return;}
        const opt=optsAll.find(o=>o.v===val);
        if(!opt)return;
        ig.tipo=opt.tipo;
        ig.id=opt.srcId;
        ig.custo_unitario=opt.custo;
        ig.unidade=opt.un;
        // Atualizar badge
        tipoBadge.textContent=ig.tipo==='prep'?'PP':'Ins';
        tipoBadge.className='bq '+(ig.tipo==='prep'?'bce':'bc');
        tipoBadge.style.cssText='font-size:10px;padding:2px 8px;border-radius:50px;font-weight:700;white-space:nowrap;flex-shrink:0';
        calcItem(idx);
        // Atualizar label de unidade
        unEl.textContent=ig.unidade||'g';
      });

      // Unidade selecionável — SEMPRE todas (g/kg/ml/L/un...) + a atual
      const unSel=el('select','fi',null,{style:'width:74px;flex-shrink:0;padding:6px 2px;font-size:12px'});
      _ingUnits(ig).forEach(u=>{const o=el('option',null,u,{value:u});if(u===ig.unidade)o.selected=true;unSel.appendChild(o);});
      unSel.addEventListener('change',e=>{ig.unidade=e.target.value;calcItem(idx);});

      const qbI=finp('',ig.qtd_bruta!=null&&ig.qtd_bruta!==''?String(ig.qtd_bruta).replace('.',','):'',v=>{ig.qtd_bruta=(v||'').replace(',','.');calcItem(idx);},'text');qbI.setAttribute('inputmode','decimal');
      qbI.style.cssText='width:62px;flex-shrink:0;text-align:center;padding:6px 4px';
      qbI.placeholder='Qtd';

      const fcI=finp('',ig.fc!=null?String(ig.fc).replace('.',','):1,v=>{ig.fc=(v||'').replace(',','.');calcItem(idx);},'text');fcI.setAttribute('inputmode','decimal');
      fcI.style.cssText='width:54px;flex-shrink:0;text-align:center;padding:6px 4px';fcI.placeholder='FC';fcI.title='Fator de correção';
      sel.style.cssText='flex:1 1 120px;min-width:100px';

      const ctEl=span('bold tv',R(ig.custo_total||0));
      ctEl.style.cssText='white-space:nowrap;text-align:right;font-weight:800;color:var(--v);min-width:64px;flex-shrink:0;font-size:14px';

      // Atualizar também o unSel quando seleciona um ingrediente
      sel.addEventListener('change',()=>{
        unSel.innerHTML='';
        _ingUnits(ig).forEach(u=>{const o=el('option',null,u,{value:u});if(u===ig.unidade)o.selected=true;unSel.appendChild(o);});
      });

      function calcItem(i){
        const src=ings[i];
        const ql=(parseFloat(src.qtd_bruta)||0)/(parseFloat(src.fc)||1);
        src.qtd_liquida=ql;
        // Buscar unidade de custo do insumo/prep para converter corretamente
        const srcObj=src.tipo==='insumo'?_ins.find(x=>x.id===src.id):_pp.find(x=>x.id===src.id);
        let unCusto;
        if(src.tipo==='insumo'){unCusto=srcObj?.unidade_custo||'kg';}
        else{const ru=srcObj?.rendimento_un||'g';unCusto=ru==='g'?'kg':ru==='ml'?'L':ru;}
        src.custo_total=calcCustoItem(src.qtd_bruta,src.fc,src.unidade||'g',src.custo_unitario,unCusto);
        ctEl.textContent=R(src.custo_total);
        calcTotais();
      }

      const rm=btn('btn bd bxs','✕',()=>{ings.splice(idx,1);rebuildI();calcTotais();});
      iw.appendChild(div('ir',[tipoBadge,sel,qbI,unSel,fcI,ctEl,rm]));
    });
  }
  rebuildI();calcTotais();

  const _autorFt={v:ME||item?.editado_por||''};
  const nomeEditFt=finp('',_autorFt.v,v=>{_autorFt.v=v;});
  nomeEditFt.placeholder='Seu nome...';
  const descEd=el('input','fi',null,{type:'text',id:'ft-descricao-edicao',placeholder:ed?'Ex: ajustei gramatura do croissant de 80g para 110g':'Nova ficha'});
  /* 18/07 (Bianca): "aqui não precisa mais a etiqueta de onde é servido e sim se o
     preparo está ou não no menu". O mkDestinosSelector SAIU do modal — a tela já é
     separada por aba de cardápio. `destinos` fica intacto no banco (PP/insumo usam
     os deles nos Pedidos); só não se edita mais por aqui. Entra a pílula ATIVO/INATIVO
     (coluna nova lola_fichas_tecnicas.no_menu, default true). */
  const destSelectorFT=document.createElement('div');
  destSelectorFT.style.cssText='display:flex;gap:8px;flex-wrap:wrap;align-items:center';
  const _mkFlagPill=(get,set,label,cor,title,extra)=>{ const b=document.createElement('button'); b.type='button'; b.title=title;
    const paint=()=>{ b.style.cssText='padding:7px 16px;border-radius:50px;font-size:12.5px;font-weight:800;cursor:pointer;border:1.5px solid '+cor+';background:'+(get()?cor:'#fff')+';color:'+(get()?'#fff':cor); b.textContent=(get()?'✓ ':'')+label; };
    b.onclick=()=>{ set(!get()); paint(); if(extra)extra(); }; paint(); return b; };
  (()=>{ const b=document.createElement('button'); b.type='button';
    b.title='Está no cardápio atual? INATIVA fica esmaecida na lista, mas continua com custo, receita e histórico.';
    const paint=()=>{ const on=f.no_menu!==false;
      b.style.cssText='padding:7px 16px;border-radius:50px;font-size:12.5px;font-weight:800;cursor:pointer;border:1.5px solid '+(on?'#2C7A4B':'#8A7A72')+';background:'+(on?'#2C7A4B':'#fff')+';color:'+(on?'#fff':'#8A7A72');
      b.textContent=on?'✓ ATIVO no menu':'INATIVO — fora do menu'; };
    b.onclick=()=>{ f.no_menu=!(f.no_menu!==false); paint(); }; paint(); destSelectorFT.appendChild(b); })();
  destSelectorFT.appendChild(_mkFlagPill(()=>f.e_preparo,v=>f.e_preparo=v,'Pré-preparo','#7A4FA3','Entra no Pedido à Central em todas as unidades'));
  destSelectorFT.appendChild(_mkFlagPill(()=>f.produto_pronto,v=>f.produto_pronto=v,'Produto pronto','#9A6B1E','Comprado feito, sem manipulação (ex.: torta fatiada) — limite de CMV vira 50%',()=>calcTotais()));

  let fotos=[]; if(ed && item?.id){ try{ const _fr=await db('lola_fichas_fotos','GET',null,'?ficha_id=eq.'+item.id+'&order=created_at.asc'); fotos=(_fr||[]).map(function(x){return x.foto;}); }catch(e){} }
  const fotosWidget=buildFotosWidget(fotos);
  precoInp=finp('',f.preco_venda,v=>{f.preco_venda=v;calcTotais();},'number');
  metaCmvInp=finp('',f.meta_cmv,v=>{f.meta_cmv=v;calcTotais();},'number');
  mkModal(ed?'Editar ficha':'Nova ficha técnica',[
    div('fg2',[
      fgrp('Nome do prato',finp('',f.nome,v=>f.nome=v)),
      ...(ed?[fgrp('📝 O que foi alterado',descEd)]:[]),
    ]),
    /* 18/07 (Bianca): o campo Cardápio SAIU do modal — "tudo ali é do Lola CCMQ";
       a ficha nova continua gravando o cardápio da cozinha/aba do app (f.cardapio
       via _tabCard), só não se escolhe mais na mão. E "tentar ocupar uma ou duas
       linhas somente" — o miolo virou 2 linhas (fg4 + fg3). */
    div('fg4',[
      fgrp('Categoria',fsel('',['prato','sobremesa','bebida','produto_evento'],f.categoria,v=>{f.categoria=v;})),
      fgrp('Preço de venda (R$)',precoInp),
      fgrp('🎯 Meta de CMV (%)',metaCmvInp),
      fgrp('\u00A0',btn('btn bg bsm','↧ Usar preço sugerido',()=>{if(_precoSug>0){f.preco_venda=_precoSug.toFixed(2);if(precoInp)precoInp.value=f.preco_venda;calcTotais();}})),
    ]),
    div('fg3',[
      fgrp('Rendimento (qtd)',finp('',f.rendimento_qtd,v=>f.rendimento_qtd=v,'number')),
      fgrp('Unidade rendimento',fsel('',['porção','un','kg','L','pessoa'],f.rendimento_un,v=>f.rendimento_un=v)),
      fgrp('🏷️ Situação no menu',destSelectorFT),
    ]),
    fgrp('📷 Fotos do prato',fotosWidget),
    el('hr','dv'),
    div('fl_ jb aic mb3',[
      el('strong',null,'Composição do prato',{style:'font-size:13px'}),
      btn('btn bg bsm','+ Ingrediente',()=>{ings.push({tipo:'insumo',id:'',qtd_bruta:'',qtd_liquida:0,fc:1,custo_unitario:0,custo_total:0,unidade:'g'});rebuildI();})
    ]),
    iw,custoResEl,
    el('hr','dv'),
    fgrp('📝 Modo de preparo',el('textarea','fi',f.modo_preparo||'',{oninput:e=>{f.modo_preparo=e.target.value;},rows:'4',placeholder:'Passo a passo do preparo...',style:'width:100%;resize:vertical;min-height:70px;font-family:inherit'})),
    fgrp('🗒️ Observações',el('textarea','fi',f.observacoes||'',{oninput:e=>{f.observacoes=e.target.value;},rows:'3',placeholder:'Observações sobre a receita...',style:'width:100%;resize:vertical;min-height:55px;font-family:inherit'})),
    el('hr','dv'),
    (()=>{
      const autorWrap=div('fl_ aic gap2');
      autorWrap.style.cssText='margin-top:4px;padding:10px 14px;background:var(--rt);border-radius:10px;border:1.5px solid var(--rb)';
      // Quem edita vem do LOGIN do portal (?u=). Só vira campo digitável se abrir fora do portal.
      if(ME){
        _autorFt.v=ME;
        autorWrap.innerHTML='<span style="white-space:nowrap;font-size:12px;font-weight:700;color:var(--v);flex-shrink:0">✍️ Alterando como:</span>'
          +'<b style="font-size:13px;color:var(--tx)">'+_uEsc(ME)+'</b>'
          +'<span class="tss" style="margin-left:auto;font-size:11px;color:#8A7A72"><i class="ph-duotone ph-lock-simple"></i> vem do seu login</span>';
        return autorWrap;
      }
      const lbl=el('span',null,'✍️ Quem está alterando:',{style:'white-space:nowrap;font-size:12px;font-weight:700;color:var(--v);flex-shrink:0'});
      const inpA=el('input','fi',null,{type:'text',placeholder:'Seu nome (obrigatório para salvar)','data-autor-ft':'',style:'flex:1;border:1.5px solid var(--rb)'});
      if(_autorFt.v)inpA.value=_autorFt.v;
      inpA.addEventListener('input',e=>{
        _autorFt.v=e.target.value;
        inpA.style.borderColor=e.target.value.trim()?'var(--vd)':'var(--rb)';
      });
      autorWrap.appendChild(lbl);autorWrap.appendChild(inpA);
      return autorWrap;
    })(),
  ],async()=>{
    // Validar autoria obrigatória
    if(!_autorFt.v.trim()){
      const inpA=document.querySelector('[data-autor-ft]');
      if(inpA){inpA.style.borderColor='#dc2626';inpA.focus();inpA.placeholder='⚠️ Obrigatório!';}
      throw new Error('Informe seu nome antes de salvar.');
    }
    const ct=ings.reduce((t,ig)=>t+parseFloat(ig.custo_total||0),0);
    const ct2=ings.length>0?ings.reduce((t,ig)=>t+parseFloat(ig.custo_total||0),0):custoTotalFixo;
    const cpp2=ings.length>0?ct2/parseFloat(f.rendimento_qtd||1):custoPorcaoFixo;
    const descricaoEd=document.getElementById('ft-descricao-edicao')?.value||'';
    const p={nome:f.nome,cardapio:f.cardapio,categoria:f.categoria,no_menu:f.no_menu!==false,e_preparo:!!f.e_preparo,produto_pronto:!!f.produto_pronto,rendimento_qtd:parseFloat(f.rendimento_qtd),rendimento_un:f.rendimento_un,preco_venda:parseFloat(f.preco_venda)||null,custo_total:ct2,custo_por_porcao:cpp2,modo_preparo:f.modo_preparo||null,observacoes:f.observacoes||null,editado_por:_autorFt.v||null,editado_em:new Date().toISOString()};
    /* QUEM FAZ — mesma regra da pré-produção. Nova nasce na cozinha do app;
       editando, mantém a de quem já era dona. */
    p.cozinha = (ed && item && item.cozinha) ? item.cozinha : APP_COZ[0];
    let _capa=''; if(typeof fotos!=='undefined' && fotos && fotos.length){ try{ _capa=await _thumbP(fotos[0],320); }catch(e){} } p.capa=_capa;
    let fid;
    if(ed){
      await db('lola_fichas_tecnicas','PATCH',p,'?id=eq.'+item.id);
      await db('lola_fichas_tecnicas_itens','DELETE',null,'?ficha_id=eq.'+item.id);
      fid=item.id;
      // Salvar histórico
      await db('lola_fichas_historico','POST',{
        ficha_id:item.id,
        editado_por:_autorFt.v||'Não informado',
        editado_em:new Date().toISOString(),
        descricao:descricaoEd||'Ficha editada',
        snapshot:{nome:f.nome,custo_total:ct2,custo_por_porcao:cpp2,preco_venda:parseFloat(f.preco_venda)||null,ingredientes:ings.length}
      });
    }else{const[nv]=await db('lola_fichas_tecnicas','POST',p);fid=nv.id;}
    for(const ig of ings){
      if(!ig.id)continue;
      await db('lola_fichas_tecnicas_itens','POST',{ficha_id:fid,insumo_id:ig.tipo==='insumo'?ig.id:null,preproducao_id:ig.tipo==='prep'?ig.id:null,unidade:ig.unidade||'g',qtd_bruta:parseFloat(ig.qtd_bruta)||0,qtd_liquida:parseFloat(ig.qtd_liquida)||0,fc:parseFloat(ig.fc)||1,custo_unitario:parseFloat(ig.custo_unitario)||0,custo_total:parseFloat(ig.custo_total)||0});
    }
    try{ await db('lola_fichas_fotos','DELETE',null,'?ficha_id=eq.'+fid); for(const _fo of fotos){ await db('lola_fichas_fotos','POST',{ficha_id:fid,foto:_fo}); } }catch(e){console.error('fotos',e);}
    _ft=await db('lola_fichas_tecnicas','GET',null,'?select=*&ativo=eq.true&order=nome.asc');
    drawFT($('#ft-t'));
  },'mo moxl');
  }catch(e){alert('Erro ao abrir ficha: '+e.message);console.error(e);}
}

    c.innerHTML='';
    c.appendChild(div('abar no-print',[

function drawCat(w){
  w.innerHTML='';

  w.appendChild(div('tw',mkTable(
    ['Produto','Unidade','Categoria','Preço CCMQ','Preço Mac',''],
    _cat.map(i=>[
      el('strong',null,i.nome),i.unidade,bq(i.categoria,'bct'),
      el('span','bold tv',R(i.preco_ccmq)),el('span','bold tvd',R(i.preco_mac)),
      btn('btn bg bsm','✏️',()=>modalCat(i)),
    ]),
    [null,null,null,'tr','tr',null]
  )));
}
function modalCat(item){
  const ed=!!item;
  let f={nome:item?.nome||'',unidade:item?.unidade||'kg',preco_ccmq:item?.preco_ccmq||'',preco_mac:item?.preco_mac||'',categoria:item?.categoria||'preparo'};
  mkModal(ed?'Editar produto':'Novo produto no catálogo',[
    fgrp('Nome',finp('',f.nome,v=>f.nome=v)),
    div('fg2',[fgrp('Unidade',fsel('',['kg','L','un','porção','cx','pct'],f.unidade,v=>f.unidade=v)),fgrp('Categoria',fsel('',['preparo','produto','insumo_revendido'],f.categoria,v=>f.categoria=v))]),
    div('fg2',[fgrp('Preço CCMQ (R$)',finp('',f.preco_ccmq,v=>f.preco_ccmq=v,'number')),fgrp('Preço Mac (R$)',finp('',f.preco_mac,v=>f.preco_mac=v,'number'))]),
  ],async()=>{
    const p={nome:f.nome,unidade:f.unidade,preco_ccmq:parseFloat(f.preco_ccmq),preco_mac:parseFloat(f.preco_mac),categoria:f.categoria};

let _conUN='ccmq';
async function pgCont(c){
  c.appendChild(ld());
  try{
    _cat=await db('lola_catalogo_central','GET',null,'?select=*,lola_estoque_minimo(*)&ativo=eq.true&order=nome.asc');
    const hist=await db('lola_contagens','GET',null,'?select=*&order=created_at.desc&limit=6');
    c.innerHTML='';
    c.appendChild(div('abar no-print',[
      mkTabs(['ccmq','mac'],_conUN,t=>_conUN=t),
      btn('btn bp bsm','▶ Iniciar contagem',()=>iniciarCont(c)),
    ]));
    if(hist.length){
      c.appendChild(el('strong',null,'Histórico de contagens',{style:'font-size:13px;color:var(--ts);display:block;margin-bottom:10px'}));
      c.appendChild(div('tw',mkTable(
        ['Data','Unidade','Status'],
        hist.map(h=>[DBR(h.data_contagem),bq(UL[h.unidade]||h.unidade,UB[h.unidade]||''),bq(h.status,h.status==='finalizado'?'ben':'bpd')]),
        [null,null,null]
      )));
    }else{
      c.appendChild(em('📦','Clique em Iniciar contagem para registrar o estoque'));
    }
  }catch(e){c.innerHTML='<p style="color:red;padding:20px">'+e.message+'</p>';}
}

async function iniciarCont(c){
  const[nv]=await db('lola_contagens','POST',{unidade:_conUN,data_contagem:TD(),status:'rascunho'});
  const qtds={};_cat.forEach(x=>qtds[x.id]=0);
  c.innerHTML='';
  c.appendChild(div('al alw mb3',['Contagem em andamento — '+DBR(TD())+' — '+UL[_conUN]+'. Preencha as quantidades encontradas.']));
  const tbody=el('tbody');
  _cat.forEach(item=>{
    const min=item.lola_estoque_minimo?.find(e=>e.unidade===_conUN)?.quantidade_minima||0;
    const inp=el('input','fi',null,{type:'number',step:'0.01',min:'0',value:'0',style:'width:100px'});
    const stEl=el('td','eok','OK');
    const pdEl=el('td','tss','—');
    inp.addEventListener('input',()=>{
      const q=parseFloat(inp.value)||0;qtds[item.id]=q;
      if(q>=min){stEl.textContent='OK';stEl.className='td eok';}
      else if(q>=min*.5){stEl.textContent='Baixo';stEl.className='td ebx';}
      else{stEl.textContent='Crítico';stEl.className='td ecr';}
      const p=Math.max(0,min-q);
      pdEl.textContent=p>0?'+'+p+' '+item.unidade:'—';
      pdEl.style.color=p>0?'var(--v)':'var(--ts)';
    });
    const tr=el('tr');
    [el('td',null,[el('strong',null,item.nome)]),el('td',null,item.unidade),el('td',null,String(min)),el('td',null,[inp]),stEl,pdEl].forEach(td=>tr.appendChild(td));
    tbody.appendChild(tr);
  });
  c.appendChild(div('tw mb3',el('table',null,[
    el('thead',null,el('tr',null,[['Produto','Un.','Mínimo','Encontrado','Status','Pedir'].map(t=>el('th',null,t))])),
    tbody
  ])));
  c.appendChild(div('fl_ jb aic no-print',[
    btn('btn bg','Cancelar',()=>nav('contagem')),
    btn('btn bv','✓ Finalizar e gerar pedido',()=>finCont(nv.id,qtds,c)),
  ]));
}

async function finCont(cid,qtds,c){
  const iP=_cat.map(item=>{
    const min=item.lola_estoque_minimo?.find(e=>e.unidade===_conUN)?.quantidade_minima||0;
    return{catId:item.id,qtd:Math.max(0,min-(parseFloat(qtds[item.id])||0)),item};
  }).filter(i=>i.qtd>0);
  for(const[catId,qtd]of Object.entries(qtds)){
    const ci=_cat.find(x=>x.id===catId);
    const min=ci?.lola_estoque_minimo?.find(e=>e.unidade===_conUN)?.quantidade_minima||0;
    await db('lola_contagem_itens','POST',{contagem_id:cid,catalogo_id:catId,quantidade_encontrada:parseFloat(qtd)||0,quantidade_minima:min});
  }
  await db('lola_contagens','PATCH',{status:'finalizado'},'?id=eq.'+cid);
  if(iP.length>0){
    const vt=iP.reduce((t,i)=>{const pr=_conUN==='ccmq'?i.item.preco_ccmq:i.item.preco_mac;return t+(i.qtd*pr);},0);
    const[ped]=await db('lola_pedidos','POST',{unidade:_conUN,status:'solicitado',data_pedido:TD(),valor_total:vt});
    for(const i of iP){const pr=_conUN==='ccmq'?i.item.preco_ccmq:i.item.preco_mac;await db('lola_pedidos_itens','POST',{pedido_id:ped.id,catalogo_id:i.catId,nome_item:i.item.nome,quantidade:i.qtd,unidade:i.item.unidade,preco_unitario:pr});}
    alert('✅ Contagem finalizada!\nPedido gerado com '+iP.length+' itens.\nTotal: '+R(vt));
  }else{alert('✅ Estoque OK — nenhum pedido gerado.');}
  nav('pedidos');
}

async function gerarPedidoDeContagem(contagemId){

      ['Produto','Un','Qtd pedido','Fornecedor'],
      gItens.map(it=>[
        el('strong',null,it.lola_estoque_itens?.nome||'—'),
        it.lola_estoque_itens?.unidade||'—',
        el('span','bold tv',N(it.pedido,1)),
        el('span','tss',it.lola_estoque_itens?.fornecedor||'—'),

      const w=window.open('','_blank');

    // Só fecha se clicar exatamente no overlay, nunca em filhos (selects, dropdowns)
    if(e.target===ov&&!mo.contains(e.target))ov.remove();
  });
  document.body.appendChild(ov);
}

async function _uploadFotoProd(dataUrl){
  var res=await fetch(dataUrl);var blob=await res.blob();
  var path='prod-'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.jpg';
  var r=await fetch(SB+'/storage/v1/object/producao/'+path,{method:'POST',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'image/jpeg'},body:blob});

async function modalNovaSaida(onSave){
  // Buscar todos os itens de estoque
  const todosItens=await db('lola_estoque_itens','GET',null,'?ativo=eq.true&order=categoria.asc,nome.asc');

  const f={responsavel:'',destino:'venda',data:new Date().toISOString().split('T')[0],observacoes:''};

  let _lastSetor='';
  const listaWrap=div(null);

  function rebuildLista(){
    listaWrap.innerHTML='';
    if(!itensSaida.length){
      listaWrap.appendChild(div('tss mt2','Nenhum item adicionado ainda.'));
      return;
    }
    const tbl=document.createElement('table');
    tbl.style.cssText='width:100%;border-collapse:collapse;margin-top:8px';
    const thead=document.createElement('thead');
    const hRow=document.createElement('tr');
    ['Item','Qtd','Un','Setor','Obs',''].forEach((h,i)=>{
      const th=document.createElement('th');
      th.style.cssText='padding:6px 8px;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--v);background:var(--rt);text-align:'+(i>=1&&i<=2?'right':'left');
      th.textContent=h;hRow.appendChild(th);
    });
    thead.appendChild(hRow);tbl.appendChild(thead);
    const tbody=document.createElement('tbody');
    itensSaida.forEach((it,idx)=>{
      const tr=document.createElement('tr');
      tr.style.cssText=(idx%2===0?'background:var(--rf)':'background:#fff')+';border-bottom:1px solid var(--rb)';

      const tdNome=document.createElement('td');tdNome.style.cssText='padding:6px 8px;font-size:12px;font-weight:600';
      tdNome.textContent=it.nome_item;tr.appendChild(tdNome);

      const tdQtd=document.createElement('td');tdQtd.style.cssText='padding:4px 8px;text-align:right';
      const inpQ=document.createElement('input');inpQ.type='number';inpQ.step='0.5';inpQ.min='0';
      inpQ.value=it.quantidade||'';inpQ.style.cssText='width:70px;padding:4px 6px;border:1.5px solid var(--rb);border-radius:8px;font-size:12px;text-align:right;font-family:Manrope,sans-serif';
      inpQ.addEventListener('input',e=>it.quantidade=e.target.value);
      tdQtd.appendChild(inpQ);tr.appendChild(tdQtd);

      const tdUn=document.createElement('td');tdUn.style.cssText='padding:6px 8px;font-size:12px;color:var(--ts);text-align:right';
      tdUn.textContent=it.unidade||'';tr.appendChild(tdUn);

      const tdSetor=document.createElement('td');tdSetor.style.cssText='padding:4px 8px';
      const selSet=document.createElement('select');
      selSet.style.cssText='width:100%;padding:4px 6px;border:1.5px solid var(--rb);border-radius:8px;font-size:11px;font-family:Manrope,sans-serif;background:#fff;color:var(--tx)';
      [{v:'',t:'— setor —'}].concat(SAIDA_SETORES.map(x=>({v:x,t:setorLabel(x)}))).forEach(o=>{const op=document.createElement('option');op.value=o.v;op.textContent=o.t;if((it.setor||'')===o.v)op.selected=true;selSet.appendChild(op);});
      selSet.addEventListener('change',e=>{it.setor=e.target.value;if(e.target.value)_lastSetor=e.target.value;});
      tdSetor.appendChild(selSet);tr.appendChild(tdSetor);

      const tdObs=document.createElement('td');tdObs.style.cssText='padding:4px 8px';
      const inpObs=document.createElement('input');inpObs.type='text';inpObs.placeholder='Obs...';
      inpObs.value=it.observacoes||'';inpObs.style.cssText='width:100%;padding:4px 6px;border:1.5px solid var(--rb);border-radius:8px;font-size:11px;font-family:Manrope,sans-serif';
      inpObs.addEventListener('input',e=>it.observacoes=e.target.value);
      tdObs.appendChild(inpObs);tr.appendChild(tdObs);

      const tdRm=document.createElement('td');tdRm.style.cssText='padding:4px 8px';
      const rmBtn=btn('btn bd bxs','✕',()=>{itensSaida.splice(idx,1);rebuildLista();});
      tdRm.appendChild(rmBtn);tr.appendChild(tdRm);

      tbody.appendChild(tr);
    });
    tbl.appendChild(tbody);
    listaWrap.appendChild(tbl);
  }

  // Seletor de item
  const selWrap=div('fg2 mt3');
  function _saidaNorm(s){return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');}
  const buscaItem=el('input','fi',null,{type:'text',placeholder:'🔍 Digite o insumo (ex: vinho, água)...'});
  const resultsWrap=div(null); resultsWrap.style.cssText='margin-top:8px;max-height:300px;overflow-y:auto';
  function renderResultados(q){
    resultsWrap.innerHTML='';
    q=_saidaNorm(q).trim();
    if(!q){ resultsWrap.appendChild(div('tss','Digite acima para buscar um insumo.')); return; }
    const toks=q.split(/\s+/).filter(Boolean);
    const scored=[];
    todosItens.forEach(it=>{ const nn=_saidaNorm(it.nome); if(!toks.every(tk=>nn.indexOf(tk)>=0))return; let sc=2; if(nn.indexOf(q)===0)sc=0; else if(nn.indexOf(' '+q)>=0)sc=1; scored.push({it,sc,nn}); });
    scored.sort((a,b)=> a.sc-b.sc || a.nn.localeCompare(b.nn));
    if(!scored.length){ resultsWrap.appendChild(div('tss','Nenhum insumo encontrado.')); return; }
    scored.slice(0,15).forEach(o=>{ const it=o.it;
      const ja=itensSaida.find(i=>i.estoque_item_id===it.id);
      const row=document.createElement('button'); row.type='button';
      row.style.cssText='display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;gap:10px;padding:10px 13px;border:1.5px solid var(--rb);border-radius:10px;background:'+(ja?'#f1f1f1':'#fff')+';margin-bottom:6px;cursor:'+(ja?'default':'pointer')+';font-family:Manrope,sans-serif;font-size:13px';
      const cat=(typeof CONT_CATS!=='undefined'&&CONT_CATS[it.categoria])||it.categoria||'';
      row.innerHTML='<span style=\"font-weight:700\">'+it.nome+'</span><span style=\"color:var(--ts);font-size:11px;white-space:nowrap\">'+(ja?'✓ já na lista':((it.unidade||'')+(cat?' · '+cat:'')))+'</span>';
      if(!ja) row.addEventListener('click',()=>{ itensSaida.push({estoque_item_id:it.id,nome_item:it.nome,quantidade:'',unidade:it.unidade,observacoes:'',setor:_lastSetor}); rebuildLista(); buscaItem.value=''; renderResultados(''); buscaItem.focus(); });
      resultsWrap.appendChild(row);
    });
  }
  buscaItem.addEventListener('input',e=>renderResultados(e.target.value));
  selWrap.appendChild(fgrp('🔍 Buscar e adicionar insumo',buscaItem));
  selWrap.appendChild(resultsWrap);
  renderResultados('');
  const btnMais=btn('btn bo bsm','\u2795 Adicionar mais itens',()=>{ try{buscaItem.scrollIntoView({behavior:'smooth',block:'center'});}catch(e){} buscaItem.focus(); });

  const inpResp=finp('',f.responsavel,v=>f.responsavel=v);inpResp.placeholder='Seu nome...';
  const inpData=el('input','fi',null,{type:'date',value:f.data});
  inpData.addEventListener('change',e=>f.data=e.target.value);
  const selDestino=fsel('',['venda','evento','descarte','outro'],f.destino,v=>f.destino=v);
  const inpObs=finp('',f.observacoes,v=>f.observacoes=v);inpObs.placeholder='Motivo, observações...';

  mkModal('📤 Nova Saída de Estoque',[
    div('fg3',[
      fgrp('✍️ Responsável',inpResp),
      fgrp('Data',inpData),
      fgrp('Destino',selDestino),
    ]),
    fgrp('Observações',inpObs),
    el('hr','dv'),
    el('strong',null,'Itens retirados',{style:'font-size:13px'}),
    selWrap,
    listaWrap,
    div('mt3 no-print',btnMais),
  ],async()=>{
    if(!f.responsavel.trim()){alert('Informe o responsável.');return;}
    const itensValidos=itensSaida.filter(it=>parseFloat(it.quantidade)>0);
    if(!itensValidos.length){alert('Adicione pelo menos um item com quantidade.');return;}
    const[saida]=await db('lola_saidas','POST',{
      data_saida:f.data,
      responsavel:f.responsavel,
      destino:f.destino,
      observacoes:f.observacoes||null,
    });
    await Promise.all(itensValidos.map(it=>db('lola_saidas_itens','POST',{
      saida_id:saida.id,
      estoque_item_id:it.estoque_item_id,
      nome_item:it.nome_item,
      quantidade:parseFloat(it.quantidade),
      unidade:it.unidade||null,
      setor:it.setor||null,
      observacoes:it.observacoes||null,
    })));
    onSave&&onSave();
  },'mo mol');
  rebuildLista();
}

function modalFornecedor(item, onSave){
  const ed=!!item;
  const f={nome:item?.nome||'',contato:item?.contato||'',whatsapp:item?.whatsapp||item?.telefone||'',telefone:item?.telefone||'',email:item?.email||'',categorias:item?.categorias||[],observacoes:item?.observacoes||''};

  // Seleção múltipla de categorias
  const catWrap=div(null);catWrap.style.cssText='display:flex;flex-wrap:wrap;gap:6px;margin-top:4px';
  Object.entries(CONT_CATS).forEach(([k,v])=>{
    const pill=document.createElement('div');
    pill.style.cssText='padding:5px 12px;border-radius:50px;font-size:11px;font-weight:700;cursor:pointer;border:1.5px solid var(--rb);transition:all .15s';
    const isSelected=()=>f.categorias.includes(k);
    function updatePill(){
      pill.style.background=isSelected()?'var(--v)':'#fff';
      pill.style.color=isSelected()?'#fff':'var(--ts)';
    }
    pill.textContent=v;
    updatePill();
    pill.addEventListener('click',()=>{
      if(isSelected())f.categorias=f.categorias.filter(c=>c!==k);
      else f.categorias=[...f.categorias,k];
      updatePill();
    });
    catWrap.appendChild(pill);
  });

  mkModal((ed?'Editar':'Novo')+' fornecedor',[
    div('fg2',[
      fgrp('Nome *',finp('',f.nome,v=>f.nome=v)),
      fgrp('Contato (nome)',finp('',f.contato,v=>f.contato=v)),
    ]),
    div('fg2',[
      fgrp('📱 WhatsApp (só números, ex: 5551999990000)',finp('',f.whatsapp,v=>f.whatsapp=v.replace(/\D/g,''))),
      fgrp('Email',finp('',f.email,v=>f.email=v)),
    ]),
    fgrp('Categorias que fornece',catWrap),
    fgrp('Observações',finp('',f.observacoes,v=>f.observacoes=v)),
  ],async()=>{
    if(!f.nome.trim()){alert('Digite o nome do fornecedor.');return;}
    const p={nome:f.nome,contato:f.contato||null,whatsapp:f.whatsapp||null,telefone:f.whatsapp||f.telefone||null,email:f.email||null,categorias:f.categorias,observacoes:f.observacoes||null,ativo:true};
    if(ed)await db('lola_fornecedores','PATCH',p,'?id=eq.'+item.id);
    else await db('lola_fornecedores','POST',p);
    onSave&&onSave();
  });
}

async function renderContArea(){
  const area=$('#cont-area');
  if(!area)return;
  area.innerHTML='';
  area.appendChild(ld());
  try{
    const itens=await db('lola_estoque_itens','GET',null,'?categoria=eq.'+_contCat+'&ativo=eq.true&order=ordem.asc');
    const contagens=await db('lola_contagens','GET',null,'?order=data_contagem.desc&limit=5');
    area.innerHTML='';
    if(!itens.length){area.appendChild(em('📦','Nenhum item cadastrado para esta categoria'));return;}

    // Cards últimas contagens
    if(contagens.length){
      const hist=div('g3 mb3');
      contagens.slice(0,3).forEach(ct=>{
        const dataFmt=new Date(ct.data_contagem+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'});
        const card=div('sc');card.style.cursor='pointer';card.style.position='relative';
        const bDel=document.createElement('button');bDel.type='button';
        bDel.style.cssText='position:absolute;top:8px;right:8px;padding:4px 8px;border-radius:9px;border:1px solid #F3D3CE;background:#FBEAE7;color:#B5302E;font-size:13px;font-weight:700;cursor:pointer;z-index:2';
        bDel.innerHTML='<i class="ph-duotone ph-trash"></i>';
        bDel.addEventListener('click',async e=>{
          e.stopPropagation();
          const resp=ct.responsavel||'';
          const cn=window.prompt('Para excluir a contagem de '+dataFmt+', digite o nome do responsável ("'+resp+'"): ');
          if(cn===null)return;
          if(cn.trim().toLowerCase()!==resp.toLowerCase()){alert('Nome incorreto.');return;}
          bDel.textContent='...';bDel.disabled=true;
          await db('lola_contagem_itens','DELETE',null,'?contagem_id=eq.'+ct.id);
          await db('lola_contagens','DELETE',null,'?id=eq.'+ct.id);
          await renderContArea();
        });
        card.appendChild(bDel);
        card.onclick=()=>verContagem(ct);
        card.appendChild(span('scl',dataFmt));
        const v=document.createElement('div');v.className='scv';v.style.fontSize='16px';v.textContent=ct.responsavel||'—';
        card.appendChild(v);
        card.appendChild(span('scs','Ver contagem →'));
        hist.appendChild(card);
      });
      area.appendChild(hist);
    }

    // Buscar TODAS as contagens recentes e pegar o último valor de cada item
    // (a contagem mais recente pode não ter todos os itens)
    let ultimosItens={};
    if(contagens.length){
      // Pegar os últimas 10 contagens e para cada item, usar o valor mais recente
      const todasContIds=contagens.map(c=>c.id);
      const uItens=await db('lola_contagem_itens','GET',null,
        '?contagem_id=in.('+todasContIds.join(',')+')'
        +'&select=*,lola_contagens!contagem_id(data_contagem)'
        +'&order=lola_contagens(data_contagem).desc');
      // Para cada item, guardar só o valor mais recente (primeiro da lista)
      uItens.forEach(it=>{
        if(!ultimosItens[it.estoque_item_id]){
          const data=it.lola_contagens?.data_contagem;
          ultimosItens[it.estoque_item_id]={
            qtd:it.qtd_contada,
            pedido:it.pedido,
            data:data?new Date(data+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}):null
          };
        }
      });
    }

    // Alertas
    const abaixo=itens.filter(it=>{const u=ultimosItens[it.id];return u&&parseFloat(u.qtd)<=parseFloat(it.qtd_minima);});
    if(abaixo.length){
      const alertBox=document.createElement('div');
      alertBox.style.cssText='background:#FBEAE7;border:1px solid #F3D3CE;color:#B5302E;border-radius:14px;padding:12px 16px;margin-bottom:14px';
      const t=document.createElement('div');t.style.cssText='font-weight:700;font-size:13px;margin-bottom:8px;display:flex;align-items:center;gap:6px';t.innerHTML='<i class="ph-duotone ph-warning"></i> Abaixo do mínimo na última contagem:';alertBox.appendChild(t);
      abaixo.forEach(it=>{
        const u=ultimosItens[it.id];
        const r=document.createElement('div');r.style.cssText='display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #F3D3CE;font-size:12px';
        r.innerHTML='<span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#B5302E;margin-right:6px"></span>'+it.nome+'</span><span>'+N(u?.qtd||0,1)+' '+it.unidade+' (mín: '+N(it.qtd_minima,0)+')</span>';
        alertBox.appendChild(r);
      });
      area.appendChild(alertBox);
    }

    // Cartões de item (1 item = 1 card, sem rolagem lateral)
    const contCell=(l,v)=>div('cont-cell',[el('div','cont-cl',[l]),el('div','cont-cv',[String(v)])]);
    const wrapIt=document.createElement('div');
    itens.forEach(it=>{
      const u=ultimosItens[it.id];
      const qtd=u?parseFloat(u.qtd):null;
      const min=parseFloat(it.qtd_minima)||0;
      let stDot,stLab,stCol;
      if(qtd===null){stDot='#B79A8E';stLab='Não contado';stCol='#8A7A72';}
      else if(qtd<=0){stDot='#B5302E';stLab='Zerado';stCol='#B5302E';}
      else if(qtd<=min){stDot='#E8A32B';stLab='Abaixo';stCol='#9A6B1E';}
      else if(qtd<=min*1.5){stDot='#C9A227';stLab='Atenção';stCol='#9A6B1E';}
      else{stDot='#2C7A4B';stLab='OK';stCol='#2C7A4B';}
      const card=div('cont-card');
      const top=div('cont-top');
      top.appendChild(el('span','cont-nome',[it.nome]));
      top.appendChild(el('span','cont-st',null,{html:'<span class="cont-dot" style="background:'+stDot+'"></span> '+stLab,style:'color:'+stCol}));
      card.appendChild(top);
      const meta=div('cont-meta');
      const uq = qtd===null ? '—' : (N(qtd,1)+' '+it.unidade + (u&&u.data?(' · '+u.data):''));
      meta.appendChild(contCell('Última qtd',uq));
      meta.appendChild(contCell('Mínimo',N(min,0)));
      meta.appendChild(contCell('Fornecedor',it.fornecedor||'—'));
      meta.appendChild(el('button','cont-edit',null,{html:'<i class="ph-duotone ph-pencil-simple"></i>',title:'Editar',onclick:()=>modalEditarItemEstoque(it,()=>renderContArea())}));
      card.appendChild(meta);
      wrapIt.appendChild(card);
    });
    area.appendChild(wrapIt);
  }catch(e){area.innerHTML='<p style="color:red">'+e.message+'</p>';}
}

function pedFiltrados(){

}

// Nova função registrarRecebimento
async function registrarRecebimento(p){
  const ov=div('ov');const mo=div('mo mol');
  mo.style.cssText+='display:flex;flex-direction:column;overflow:hidden';
  mo.addEventListener('click',e=>e.stopPropagation());
  ov.addEventListener('click',e=>{if(e.target===ov)ov.remove();});
  mo.appendChild(div('mh',[
    (mo.classList.add('recv-modal'),el('h3',null,'\u{1F4E6} Registrar Recebimento — Pedido #'+p.numero_pedido)),
    btn('xb','\u{2715}',()=>ov.remove())
  ]));
  const mb=div('mb');mb.appendChild(ld());
  mo.appendChild(mb);ov.appendChild(mo);document.body.appendChild(ov);
  try{
    const itens=await db('lola_pedidos_itens','GET',null,'?select=*&pedido_id=eq.'+p.id);
    mb.innerHTML='';
    // Campos do recebedor
    const _resp={v:''};
    const inpResp=finp('',_resp.v,v=>_resp.v=v);inpResp.placeholder='Seu nome (obrigatório)';
    mb.appendChild(div('fg2 mb3',[
      fgrp('Recebido por',inpResp),
      fgrp('Data',el('input','fi',null,{type:'date',value:new Date().toISOString().split('T')[0],id:'inp-data-receb'}))
    ]));
    // Instrução
    const dica=document.createElement('div');
    dica.style.cssText='background:var(--rt);border:1.5px solid var(--rb);border-radius:10px;padding:10px 14px;font-size:12px;font-weight:600;color:var(--v);margin-bottom:14px';
    dica.textContent='Confira cada item e informe a quantidade recebida. Deixe igual ao solicitado se foi recebido completo.';
    mb.appendChild(dica);
    // Tabela de itens com input de qtd recebida
    const recvMap={};
    itens.forEach(it=>{recvMap[it.id]={item:it,qtdRecebida:parseFloat(it.quantidade)||0};});
    const tblWrap=document.createElement('div');tblWrap.style.cssText='overflow-x:auto';
    const tbl=document.createElement('table');tbl.style.cssText='width:100%;border-collapse:collapse';
    const thead=document.createElement('thead');
    const htr=document.createElement('tr');
    ['Item','Un','Qtd\u00a0solicitada','Qtd\u00a0recebida','Difer.'].forEach((h,i)=>{
      const th=document.createElement('th');
      th.style.cssText='padding:7px 10px;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--v);background:var(--rt);text-align:'+(i>=2?'right':'left');
      th.textContent=h;htr.appendChild(th);
    });
    thead.appendChild(htr);tbl.appendChild(thead);
    const tbody=document.createElement('tbody');
    itens.forEach((it,idx)=>{
      const tr=document.createElement('tr');
      tr.style.cssText=(idx%2===0?'background:var(--rf)':'background:#fff')+';border-bottom:1px solid var(--rb)';
      function mkTd(content,align,style){
        const td=document.createElement('td');
        td.style.cssText='padding:8px 10px;font-size:12px;text-align:'+(align||'left')+(style?';'+style:'');
        if(typeof content==='string'||typeof content==='number')td.textContent=String(content);
        else td.appendChild(content);return td;
      }
      tr.appendChild(mkTd(it.nome_item,'left','font-weight:600'));
      tr.appendChild(mkTd(it.unidade||''));
      tr.appendChild(mkTd(N(it.quantidade,1),'right','font-weight:700'));
      // Input qtd recebida
      const tdRecv=document.createElement('td');tdRecv.style.cssText='padding:4px 10px;text-align:right';
      const inpR=document.createElement('input');inpR.type='number';inpR.min='0';inpR.step='0.5';
      inpR.value=N(it.quantidade,1);
      inpR.style.cssText='width:80px;padding:5px 7px;border:2px solid var(--rb);border-radius:8px;font-size:13px;text-align:right;font-family:Manrope,sans-serif;font-weight:700';
      inpR.setAttribute('inputmode','decimal');
      const difTd=document.createElement('td');difTd.style.cssText='padding:8px 10px;font-size:12px;text-align:right;font-weight:700';
      function updateDif(){
        const sol=parseFloat(it.quantidade)||0;const recv=parseFloat(inpR.value)||0;
        recvMap[it.id].qtdRecebida=recv;
        const dif=recv-sol;
        difTd.textContent=(dif>0?'+':'')+N(dif,1);
        difTd.style.color=dif===0?'var(--vd)':dif<0?'#dc2626':'#c47700';
        inpR.style.borderColor=dif===0?'var(--vd)':dif<0?'#dc2626':'#c47700';
      }
      inpR.addEventListener('input',updateDif);updateDif();
      tdRecv.appendChild(inpR);tr.appendChild(tdRecv);tr.appendChild(difTd);
      tbody.appendChild(tr);
    });
    tbl.appendChild(tbody);tblWrap.appendChild(tbl);mb.appendChild(tblWrap);
    // Footer
    mo.appendChild(div('mf',[
      btn('btn bg','Cancelar',()=>ov.remove()),
      btn('btn bp','\u{1F4BE} Salvar recebimento',async()=>{
        const respVal=_resp.v.trim();
        if(!respVal){inpResp.style.borderColor='#dc2626';inpResp.focus();alert('Informe quem recebeu.');return;}
        const dataReceb=document.getElementById('inp-data-receb')?.value||new Date().toISOString().split('T')[0];
        // Verificar divergências
        const divergencias=Object.values(recvMap).filter(v=>parseFloat(v.qtdRecebida)!==parseFloat(v.item.quantidade));
        const statusReceb=divergencias.length>0?'recebido_divergencia':'recebido_completo';
        // Salvar recebimento
        const[receb]=await db('lola_pedidos_recebimentos','POST',{
          pedido_id:p.id,recebido_por:respVal,data_recebimento:dataReceb,status:statusReceb
        });
        // Salvar itens do recebimento
        for(const v of Object.values(recvMap)){
          await db('lola_pedidos_recebimentos_itens','POST',{
            recebimento_id:receb.id,pedido_item_id:v.item.id,
            nome_item:v.item.nome_item,qtd_solicitada:parseFloat(v.item.quantidade)||0,
            qtd_recebida:parseFloat(v.qtdRecebida)||0,unidade:v.item.unidade
          });
        }
        // Calcular novo valor total pela qtd recebida
        const itensParaValor=await db('lola_pedidos_itens','GET',null,'?pedido_id=eq.'+p.id);
        let novoTotal=0;
        for(const v of Object.values(recvMap)){
          const itemPed=itensParaValor.find(x=>x.id===v.item.id);
          const preco=parseFloat(itemPed?.preco_unitario)||0;
          novoTotal+=parseFloat(v.qtdRecebida)*preco;
          // Atualizar quantidade do item pelo recebido
          await db('lola_pedidos_itens','PATCH',{quantidade:parseFloat(v.qtdRecebida)},'?id=eq.'+v.item.id);
        }
        // Atualizar status e valor total do pedido
        await db('lola_pedidos','PATCH',{status:statusReceb,valor_total:novoTotal},'?id=eq.'+p.id);
        p.status=statusReceb;
        _peds=await db('lola_pedidos','GET',null,'?select=*&order=created_at.desc');
        drawPed($('#ped-t'));
        ov.remove();
        // Se tiver divergência, abrir modal de relatório
        if(divergencias.length>0){
          setTimeout(()=>verDivergencias(p,divergencias,dataReceb,respVal),300);
        }else{
          alert('\u{2705} Recebimento registrado! Pedido recebido completo.');
        }
      })
    ]));
  }catch(e){mb.innerHTML='<p style="color:red;padding:20px">'+e.message+'</p>';}
}

async function verDivergencias(p,divs,data,resp){
  // Buscar divergências do banco se não foram passadas direto

/* ── Preço/unidade da pré-produção no pedido — REGRA ÚNICA ──────────────
   (movida pra cá em 19/07: morava dentro do modal de NOVO pedido e o modal de
   EDITAR também usa — fora do escopo, o Editar quebrava com "ppUnidade is not
   defined". Histórico da regra: Lasanha 38,53×89,90, Risotinho R$ 2.573.)
   • Vende por PORÇÃO só quando o rendimento é a granel (g/ml/kg/L) e existe
     porção declarada — senão a conta divide un por g e estoura.
   • Margem: custo/(m/100), a MESMA fórmula do editor da pré-produção. */
function _ppBulk(x){ return ['g','ml','kg','L'].includes(x.rendimento_un||'un'); }
function _ppPorcao(x){
  const pq=parseFloat(x.porcao_qtd)||0, pu=x.porcao_un||'';
  return (_ppBulk(x) && pq>0 && pu && pu!==(x.rendimento_un||'un')) ? pq : 0;
}
function ppPreco(x){
  const pq=_ppPorcao(x);
  if(pq>0){
    const numP=(parseFloat(x.rendimento_qtd)||1)/pq;
    if(numP>0) return (parseFloat(x.custo_total||0)/numP)/((parseFloat(x.margem_venda)||70)/100);
  }
  return parseFloat(x.valor_venda_central)||0;
}
function ppUnidade(x){
  const ru=x.rendimento_un||'un';
  if(_ppPorcao(x)>0) return (x.porcao_un==='un')?'porção':x.porcao_un;
  return ru==='g'?'kg':ru==='ml'?'L':ru;
}
function ppInfo(x){
  const pq=_ppPorcao(x);
  if(!pq) return '';
  const numP=(parseFloat(x.rendimento_qtd)||1)/pq;
  return '(porção de '+pq+' '+(x.rendimento_un||'')+' — '+numP.toFixed(1)+' porções)';
}

const _envEsc=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function _envQtd(q){return N(q,3).replace(/,?0+$/,'')||'0';}
/* conversão de unidade — espelha a função central_conv_qtd do banco. null = não dá pra converter */
const _ENV_UN_SIN={l:'l',lt:'l',litro:'l',litros:'l',un:'un',und:'un',unid:'un',unidade:'un',pc:'un',pct:'un',pacote:'un','maco':'un','maço':'un',cx:'un',caixa:'un',bdj:'un',bandeja:'un'};
function _envUn(u){const s=String(u==null?'':u).trim().toLowerCase();return _ENV_UN_SIN[s]||s;}
function _envConv(q,unO,unD,pesoG){
  q=Number(q); if(!isFinite(q))return null;
  const a=_envUn(unO), b=_envUn(unD);
  if(!a||!b)return null;
  if(a===b)return q;
  if(a==='g'&&b==='kg')return q/1000;
  if(a==='kg'&&b==='g')return q*1000;
  if(a==='ml'&&b==='l')return q/1000;
  if(a==='l'&&b==='ml')return q*1000;
  if(a==='l'&&b==='kg')return q;
  if(a==='kg'&&b==='l')return q;
  if(a==='ml'&&b==='kg')return q/1000;
  if(a==='g'&&b==='l')return q/1000;
  if(a==='ml'&&b==='g')return q;
  if(a==='g'&&b==='ml')return q;
  const p=Number(pesoG);
  if(a==='un'&&isFinite(p)&&p>0){
    if(b==='kg')return q*p/1000;
    if(b==='g')return q*p;
    if(b==='l')return q*p/1000;
    if(b==='ml')return q*p;
  }
  if(b==='un'&&isFinite(p)&&p>0){
    if(a==='kg')return q*1000/p;
    if(a==='g')return q/p;
  }
  return null;
}
/* {ok:false} = falta o peso pra converter — não mostra custo nem deixa lançar no Financeiro */
function _envCusto(e,ci){
  if(e.custo_total!=null)return{ok:true,v:Number(e.custo_total)};
  if(!ci||e.quantidade==null)return{ok:true,v:0};
  const cu=Number(ci.custo_por_unidade||0), unC=ci.unidade_custo;
  if(!unC||!cu)return{ok:true,v:0};
  const q=_envConv(e.quantidade,(e.unidade&&String(e.unidade).trim())||unC,unC,ci.peso_un_g);
  if(q==null)return{ok:false,v:0};
  return{ok:true,v:q*cu,qtd:q};
}
async function _envPedirPeso(e,ci){
  const unE=(e.unidade&&String(e.unidade).trim())||'un';
  const unC=(ci&&ci.unidade_custo)||'kg';
  const nome=(ci&&ci.nome)||e.descricao;
  const atual=(ci&&ci.peso_un_g!=null)?String(ci.peso_un_g):'';
  const v=prompt('Quanto pesa 1 '+unE+' de "'+nome+'" em gramas?\n\nO custo deste insumo está cadastrado por '+unC+', então preciso do peso pra converter e calcular o valor certo.\n\nEx.: 110',atual);
  if(v==null)return;
  const p=parseFloat(String(v).replace(',','.'));
  if(!isFinite(p)||p<=0){alert('Peso inválido. Informe um número em gramas, ex.: 110');return;}
  try{
    await db('lola_insumos','PATCH',{peso_un_g:p},'?id=eq.'+((ci&&ci.id)||e.insumo_id));
    alert('Peso salvo: 1 '+unE+' = '+_envQtd(p)+' g.\n\nO custo já é calculado com isso. Confira o valor e clique em Recebido.');
    renderPage();
  }catch(err){alert('Erro ao salvar o peso: '+err.message);}
}

async function receberEnvio(e,custoInfo){

  if(!confirm('Confirmar recebimento de "'+e.descricao+'"'+(custoTot>0?' (custo '+R(custoTot)+')':'')+'?\n\nIsso dá baixa no estoque da Central e lança a transferência no Financeiro das duas contas.'))return;

    renderPage();
  }catch(err){ if(String((err&&err.message)||'').indexOf('CONV_FALTA_PESO')>=0){ _envPedirPeso(e,custoInfo); return; } alert('Erro ao receber: '+err.message);}

/* ══════════════════════════════════
   ENTRADA DE NOTAS — estoque CCMQ a partir das notas do Financeiro
   (item da nota -> insumo existente ou novo; guarda qtd+preço; fator; atualiza preço)
══════════════════════════════════ */
const EN_CATS=["Insumos Alimentos","Hortifruti","Carnes e Pescados","Não Alcoólicos","Bebidas Alcoólicas","Vinhos","Cervejas","Cafés","Pães","Lojinha","Material de Limpeza","Descartáveis/Embalagens","Material de Expediente e Gráfico","Utensílios e Equipamentos","Gás"];
const _jnorm=s=>(s==null?'':String(s)).trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ');
/* ── SUGESTÃO de insumo pra descrição da nota ─────────────────────────────
   A nota vem escrita do jeito do fornecedor ("BROWNIE", "BATATA BRANCA BICA _ KG")
   e ninguém sabe qual insumo é. Isto propõe; a pessoa confirma; o de-para fica
   gravado pra sempre. Mesmo padrão do peso_un_g: propõe, confirma, lembra.
   NÃO chuta sozinho — só pré-preenche marcado como sugestão.               */
const _EN_STOP={'de':1,'da':1,'do':1,'com':1,'sem':1,'kg':1,'un':1,'cx':1,'pct':1,'gr':1,'ml':1,'lt':1,'und':1,'para':1,'tipo':1};
function _enToks(s){
  return _jnorm(s).split(/[^a-z0-9]+/).filter(t=>t.length>=3 && !_EN_STOP[t] && !/^\d+$/.test(t));
}
function _enSugere(desc){
  const d=' '+_jnorm(desc)+' ';
  if(!EN||!EN.insumos||d.trim().length<3) return null;
  let best=null,bestN=0,bestCov=0;
  EN.insumos.forEach(function(i){
    const nt=_enToks(i.nome);
    if(!nt.length) return;
    let hit=0;
    nt.forEach(function(t){ if(d.indexOf(' '+t)>=0 || d.indexOf(t+' ')>=0 || d.indexOf(t)>=0) hit++; });
    if(!hit) return;
    const cov=hit/nt.length;
    /* mais tokens casados ganha (mais específico): "Ovo de codorna" > "Ovo"
       para a descrição "OVO DE CODORNA". Empate: maior cobertura do nome.   */
    if(hit>bestN || (hit===bestN && cov>bestCov)){ bestN=hit; bestCov=cov; best=i; }
  });
  if(!best) return null;
  return {ins:best, n:bestN, cov:bestCov, forte:(bestN>=2 || bestCov>=0.99)};
}

      db('lola_insumos','GET',null,'?select=nome,categoria'),
    ]);
    const ppMap={};pps.forEach(x=>{ppMap[norm(x.nome)]=x.cat_custo||'';});
    const insMap={};inss.forEach(x=>{insMap[norm(x.nome)]=x.categoria||'';});
    const acc={};const exemplos={};let total=0;
    itens.forEach(it=>{
      const v=(parseFloat(it.quantidade)||0)*(parseFloat(it.preco_unitario)||0);
      const nn=norm(it.nome_item);
      let cat=ppMap[nn];
      if(!cat){ if(insMap[nn]!==undefined) cat=INS_TO_COST[insMap[nn]]||'Temperos e Outros'; }
      if(!cat)cat='Sem categoria';
      acc[cat]=(acc[cat]||0)+v;total+=v;
      if(!exemplos[cat])exemplos[cat]=new Set();
      if(exemplos[cat].size<5)exemplos[cat].add((it.nome_item||'').replace(/^PP /i,''));
    });
    const linhas=Object.entries(acc).sort((a,b)=>b[1]-a[1]);
    mb.innerHTML='';
    mb.appendChild(div('card mb3 fl_ jb aic',[el('strong',null,'Total recebido no período'),el('span','bold tv',R(total),{style:'font-size:20px;font-family:Fraunces,serif'})]));
    linhas.forEach(([cat,val])=>{
      const pct=total>0?(val/total*100):0;
      const wrap=div('card',null,{style:'margin-bottom:8px'});
      wrap.appendChild(div('fl_ jb aic',[
        el('strong',null,(COST_EMOJI[cat]||'')+' '+cat,{style:'font-size:13px'}),
        el('span','bold tv',R(val)+'  ·  '+pct.toFixed(0)+'%',{style:'font-size:13px'}),
      ]));
      const barOuter=div(null,null,{style:'height:7px;background:var(--rf);border-radius:5px;margin-top:6px;overflow:hidden'});
      barOuter.appendChild(div(null,null,{style:'height:100%;width:'+pct.toFixed(1)+'%;background:var(--v);border-radius:5px'}));
      wrap.appendChild(barOuter);
      const ex=[...(exemplos[cat]||[])].join(', ');
      if(ex)wrap.appendChild(div('tss',ex,{style:'margin-top:6px;font-size:11px'}));
      mb.appendChild(wrap);
    });
  }catch(e){mb.innerHTML='<p style="color:red">'+e.message+'</p>';}
  mo.appendChild(div('mf',[btn('btn bg','Fechar',()=>ov.remove())]));
}

  let _dataPed=TD();
  let _respPed='';
  let _obsPed='';

  // Mapa de quantidades: id -> {item, quantidade}
  const qtdMap={};
  // Mapa de embalagens/utensílios do inventário: inv_id -> {item, quantidade}
  const embMap={};

  const ov=div('ov');
  const mo=div('mo moxl');

  ov.addEventListener('click',e=>{if(e.target===ov)ov.remove();});

  mo.appendChild(div('mh',[

    btn('xb','✕',()=>ov.remove())
