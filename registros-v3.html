<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Registros · Lola</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/duotone/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--vinho:#A82A2A;--vinho-deep:#7E1E1F;--vinho-pale:#F6E7E5;--vinho-muted:#E4C8C0;
--cream:#FBF7F1;--border:#ECE3D9;--ink:#2A1A17;--muted:#92837B;--radius:16px;
--grad:linear-gradient(135deg,#B5302E,#7E1E1F);--label:#B79A8E;--body:#5A463E;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Hanken Grotesk',sans-serif;background:var(--cream);color:var(--ink);font-size:15px}
header{background:transparent;padding:12px 15px;position:static;z-index:30;color:var(--ink);border-radius:0;border-bottom:1px solid #EFE6DC;margin:0}
.hdr-row{display:flex;align-items:center;gap:10px}
.hdr-menu{width:40px;height:40px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--border);color:var(--vinho);border-radius:13px;cursor:pointer;padding:0}
.hdr-menu i{font-size:1.25rem}
.hdr-mid{flex:1;min-width:0}
.hdr-actions{display:flex;gap:8px}
.hdr-ic{position:relative;width:40px;height:40px;flex-shrink:0;border-radius:13px;background:#fff;border:1px solid var(--border);color:var(--vinho);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.2rem}
.hdr-badge{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;border-radius:9px;background:var(--vinho);color:#fff;font-size:.6rem;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}
.hdr-title{font-family:'Fraunces',serif;font-weight:600;font-size:1.25rem;line-height:1.05;color:var(--vinho);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-count{color:#8A7A72;font-size:.78rem;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrap{max-width:none;margin:0;padding:18px 18px 80px}
.btn{border:0;border-radius:11px;padding:11px 15px;font-size:.9rem;font-weight:600;cursor:pointer;font-family:inherit;min-height:44px}
.btn-primary{background:var(--grad);color:#fff;width:100%}
.btn-primary:active{background:var(--vinho-deep)}
.btn-ghost{background:var(--vinho-pale);color:var(--vinho);border:1.5px solid var(--vinho-muted)}
.btn-sm{padding:7px 11px;font-size:.8rem;min-height:0;border-radius:9px}
.btn i{font-size:1rem;vertical-align:-2px;margin-right:3px}
/* NOVO REGISTRO */
.quick{background:#fff;border:1.5px solid var(--vinho-muted);border-radius:var(--radius);padding:12px 13px;margin-bottom:16px;box-shadow:0 2px 10px rgba(168,39,42,.06)}
.quick .lab{font-size:.68rem;font-weight:700;text-transform:uppercase;color:var(--muted);margin:9px 0 5px}
.quick .lab:first-of-type{margin-top:8px}
.dropfield{margin-top:9px;border:1.5px solid var(--border);border-radius:10px;padding:8px 11px;background:var(--cream)}
.dropfield>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px;margin:0}
.dropfield>summary::-webkit-details-marker{display:none}
.dropfield>summary::after{content:'▾';margin-left:auto;color:var(--muted)}
.dropfield[open]>summary::after{content:'▴'}
.quick textarea,.quick input[type=text]{width:100%;font-family:inherit;font-size:.9rem;padding:9px 11px;border:1.5px solid var(--border);border-radius:10px;background:var(--cream);color:var(--ink)}
.quick textarea{min-height:48px;resize:vertical}
.quick input[type=date]{font-family:inherit;font-size:.9rem;padding:8px 10px;border:1.5px solid var(--border);border-radius:10px;background:var(--cream);color:var(--ink)}
.quick .btn{min-height:0;padding:9px 16px;font-size:.9rem}
.quickhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.quickhead b{color:var(--vinho-deep);font-size:.96rem}
.quickhead .dt{font-size:.72rem;color:var(--muted)}
.ligada{display:none;align-items:center;gap:8px;background:#eef4ff;border:1px solid #cdddf7;color:#27508f;border-radius:10px;padding:8px 11px;font-size:.82rem;margin:8px 0 2px}
.ligada b{color:#1c3d6b}
.ligada .x{margin-left:auto;cursor:pointer;font-weight:700;color:#27508f;padding:0 4px}
.pick{display:flex;flex-wrap:wrap;gap:7px}
.opt{font-size:.8rem;padding:6px 11px;border-radius:22px;border:1.5px solid var(--border);background:var(--cream);cursor:pointer;user-select:none}
.opt.on{background:var(--vinho);border-color:var(--vinho);color:#fff;font-weight:600}
.seg{display:flex;gap:8px}
.segbtn{flex:1;text-align:center;font-size:.82rem;font-weight:600;padding:8px 8px;border-radius:11px;border:1.5px solid var(--border);background:var(--cream);cursor:pointer;user-select:none}
.segbtn.on{background:var(--vinho);border-color:var(--vinho);color:#fff}
.vincbtn{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;font-weight:600;padding:9px 13px;border-radius:11px;border:1.5px solid var(--vinho-muted);background:var(--vinho-pale);color:var(--vinho);cursor:pointer;user-select:none}
.vincbtn.on{background:var(--vinho);border-color:var(--vinho);color:#fff}
.vinchint{font-size:.78rem;color:#27508f;background:#eef4ff;border:1px solid #cdddf7;border-radius:9px;padding:8px 11px;margin-top:8px}
.viewtoggle{display:flex;gap:6px;margin:11px 0 0}
.viewtoggle .vt{flex:1;text-align:center;font-size:.8rem;font-weight:600;padding:8px 4px;border-radius:11px;border:0;background:#fff;color:var(--vinho);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;box-shadow:inset 0 0 0 1px #E9DDD0}
.viewtoggle .vt i{font-size:1.02rem}
.viewtoggle .vt.on{background:var(--vinho);color:#fff;box-shadow:none}
.viewtoggle .vt .vt-star{display:none;font-size:.92rem;opacity:.5;cursor:pointer;margin-left:2px}
.viewtoggle .vt.on .vt-star{display:inline-block;color:#fff}
.viewtoggle .vt .vt-star.fav{display:inline-block;color:#E0A81E;opacity:1}
.mapgroup{background:#fff;border:1.5px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.mtopic{background:var(--vinho);color:#fff;border-radius:12px;padding:9px 14px;font-size:.96rem;font-weight:600;display:inline-block;cursor:pointer;max-width:100%}
.mvl{width:2px;height:14px;background:var(--vinho-muted);margin:6px auto}
.mnote{font-size:.84rem;color:#5a4444;white-space:pre-wrap;background:var(--cream);border:1px solid var(--border);border-radius:10px;padding:9px 11px;max-width:430px;margin:0 auto;text-align:left}
.mbranch{display:flex;flex-direction:column;gap:9px;max-width:560px;margin:6px auto 0}
.mgrouptag{font-size:.8rem;font-weight:700;color:var(--vinho-deep);margin-bottom:9px}
/* SECAO LISTA */
.seclabel{font-family:'Fraunces',serif;font-style:normal;color:var(--vinho-deep);font-size:1.1rem;margin:6px 0 10px}
.filters{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:8px}
.filters input,.filters select{font-family:inherit;font-size:.83rem;padding:9px 10px;border:1.5px solid var(--border);border-radius:9px;background:#fff;color:var(--ink)}
.filters input[type=search]{flex:1;min-width:0}
.count{font-size:.76rem;color:var(--muted);margin:2px 0 12px}
.unibar{display:flex;gap:6px;flex-wrap:nowrap;margin:4px 0 12px}
.unibar .ub{flex:1;min-width:0;text-align:center;font-size:.82rem;font-weight:700;padding:9px 4px;border-radius:11px;border:1.5px solid var(--vinho-muted);background:#fff;color:var(--vinho-deep);cursor:pointer;white-space:nowrap}
.unibar .ub.on{background:var(--vinho);color:#fff;border-color:var(--vinho)}
.feed{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin:0}
.searchrow{display:flex;gap:7px;align-items:center;flex:1 0 100%}
.searchrow input{flex:1;min-width:0}
.searchrow .btn{flex:0 0 auto;width:auto;min-width:0}
.mapwrap{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media(min-width:720px){
.feed{grid-template-columns:repeat(auto-fill,minmax(330px,1fr));align-items:start}
.mapwrap{grid-template-columns:repeat(auto-fill,minmax(330px,1fr));align-items:start}
}
@media(max-width:560px){
.filters{display:grid;grid-template-columns:1fr 1fr}
.filters .searchrow{grid-column:1/-1;min-width:0}
.filters select{width:100%;min-width:0;font-size:.8rem;padding:8px 8px}
.filters>.btn{width:100%}
}
/* CARDS */
.card{background:#fff;border:1.5px solid var(--border);border-radius:20px;padding:14px 15px;display:flex;flex-direction:column;gap:7px;box-shadow:0 10px 28px rgba(168,42,42,.12);min-width:0;overflow-wrap:anywhere}
.card.flash{border-color:var(--vinho);box-shadow:0 0 0 3px var(--vinho-pale)}
.card.destaque{border-color:#EAD08A;animation:lolaGold 1.8s ease-in-out infinite}
.kcard.destaque{border-color:#EAD08A;animation:lolaGold 1.8s ease-in-out infinite}
@keyframes lolaGold{0%,100%{box-shadow:0 10px 28px rgba(168,42,42,.10),0 0 0 0 rgba(224,168,30,0)}50%{box-shadow:0 10px 28px rgba(168,42,42,.10),0 0 16px 2px rgba(224,168,30,.55)}}
.btnfx.on{color:#B8862B;background:#FBF0DD;border-color:#EAD08A}
.card.done{opacity:.5}
.card.done h3{text-decoration:line-through}
.chk{width:20px;height:20px;cursor:pointer;accent-color:var(--vinho);flex-shrink:0;vertical-align:middle}
.prazo{font-size:.74rem;color:var(--muted)}
.prazo.atras{color:#c0392b;font-weight:700}
.cardtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.badge{font-size:.68rem;font-weight:700;padding:3px 9px;border-radius:7px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.card h3{font-family:'Fraunces',serif;font-style:normal;font-weight:600;font-size:1.04rem;color:var(--ink);line-height:1.3}
.card .dt{font-size:.7rem;color:var(--muted);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:.69rem;padding:3px 9px;border-radius:18px;border:1px solid var(--border);background:var(--cream);cursor:pointer;white-space:nowrap}
.chip.uni{background:#F6E7E5;border-color:#E4C8C0;color:#7E1E1F;font-weight:600}
.chip.u-ccmq{background:#FBE4E0;border-color:#F1C7C0;color:#C0392B}
.chip.u-mac{background:#E6F3EA;border-color:#C9E6D4;color:#2C7A4B}
.chip.u-central{background:#E6EEF8;border-color:#CBD9EE;color:#2C5AA0}
.chip.cat{background:#fff;border:1.4px solid currentColor;font-weight:600}
.chip.tag{background:#fff9db;border-color:#eedf9b;color:#7a6500}
.resp{font-size:.72rem;color:var(--muted)}
.oklabel{font-size:.68rem;font-weight:700;text-transform:uppercase;color:var(--muted);margin-top:2px}
.okrow{display:flex;flex-wrap:wrap;gap:6px}
.okchip{font-size:.74rem;padding:5px 10px;border-radius:18px;border:1.5px solid #cfe6cf;background:#f4faf4;color:#2d6a4f;cursor:pointer;font-weight:600;user-select:none}
.okchip.on{background:#2d6a4f;border-color:#2d6a4f;color:#fff}
.okchip .x{margin-left:4px;font-weight:700}
.okone{font-size:.8rem;color:#2d6a4f;font-weight:600;display:inline-flex;align-items:center;gap:7px;cursor:pointer}
.conteudo{font-size:.84rem;color:#5a4444;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;max-height:4.4em;overflow:hidden}
.conteudo.open{max-height:none}
.vermais{font-size:.72rem;color:var(--vinho);cursor:pointer;font-weight:600}
.rel{font-size:.74rem;color:var(--muted)}
.rel a{color:var(--vinho);cursor:pointer;font-weight:600}
.cardfoot{display:flex;flex-wrap:wrap;justify-content:flex-start;gap:6px;margin-top:2px}
.cardfoot .btn{padding:7px 10px;font-size:.74rem;min-height:0;border-radius:9px}
.cardfoot .btn i{font-size:.9rem;margin-right:3px}
.btnconcluir{background:var(--vinho);color:#fff;border:1.5px solid var(--vinho)}
.btnconcluir.reaberto{background:var(--vinho-pale);color:var(--vinho);border:1.5px solid var(--vinho-muted)}
.grouphdr{font-size:.95rem;color:var(--vinho-deep);font-weight:700;border-bottom:2px solid var(--vinho-pale);padding:10px 0 5px;margin:18px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
.grouphdr span{font-size:.72rem;color:var(--muted);font-weight:400}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
/* QUADRO (kanban) */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start}
.kcol{background:#F3EBE1;border-radius:16px;padding:10px;min-height:120px}
.kcol.dragover{outline:2px dashed var(--vinho);outline-offset:-4px;background:#efe2d6}
.kcol-h{display:flex;align-items:center;gap:8px;padding:4px 6px 10px;font-weight:700;font-size:.86rem;color:var(--body)}
.kcol-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.kcol-count{margin-left:auto;font-size:.7rem;font-weight:700;color:var(--muted);background:#fff;border:1px solid var(--border);border-radius:20px;padding:1px 9px}
.kcard{background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 6px 16px -10px rgba(42,26,23,.3);overflow:hidden;margin-bottom:11px;cursor:grab}
.kcard:active{cursor:grabbing}
.kbar{padding:6px 12px;color:#fff;font-size:.66rem;font-weight:700;letter-spacing:.04em;display:flex;align-items:center;justify-content:space-between;gap:6px}
.kbar .kmove{display:flex;gap:6px}
.kbar .kmove i{cursor:pointer;font-size:1rem;opacity:.9}
.kbody{padding:10px 12px 12px}
.ktag{display:inline-flex;align-items:center;gap:4px;font-size:.66rem;font-weight:700;padding:2px 8px;border-radius:8px;margin-bottom:6px}
.kcard h4{font-family:'Fraunces',serif;font-weight:600;font-size:.95rem;color:var(--ink);line-height:1.2;margin-bottom:7px}
.kcard.done h4{text-decoration:line-through;color:var(--muted)}
.kdesc{font-size:.76rem;color:var(--body);line-height:1.45;margin:6px 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kok{font-size:.68rem;color:var(--muted);font-weight:600;margin-bottom:8px}
.kok b{color:#1f7a4d}
.kbtns{display:flex;gap:6px;flex-wrap:wrap}
@media(max-width:720px){
header{position:static}
.board{display:flex;grid-template-columns:none;overflow-x:auto;gap:12px;padding-bottom:8px;scroll-snap-type:x mandatory}
.kcol{flex:0 0 84%;scroll-snap-align:start}
}
/* PAINEL DA FICHA */
.fp-ov{position:fixed;inset:0;background:rgba(30,10,10,.5);display:none;z-index:70}
.fp-ov.show{display:block}
.fp{position:absolute;top:0;right:0;height:100%;width:440px;max-width:92vw;background:#fff;box-shadow:-12px 0 44px rgba(0,0,0,.28);overflow-y:auto;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s}
.fp-ov.show .fp{transform:translateX(0)}
@media(max-width:560px){.fp{width:100%;max-width:100%}}
.fp-head{position:sticky;top:0;background:var(--grad);color:#fff;padding:15px 16px;display:flex;align-items:flex-start;gap:10px;z-index:2}
.fp-x{margin-left:auto;background:rgba(255,255,255,.2);border:0;color:#fff;width:32px;height:32px;border-radius:9px;font-size:15px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.fp-body{padding:14px 16px;flex:1}
.fp-sec{margin-bottom:16px}
.fp-sec h4{font-size:.7rem;font-weight:700;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.fp-meta{font-size:.84rem;color:var(--body)}
.fp-obs{border:1px solid var(--border);border-radius:11px;padding:9px 11px;margin-bottom:8px;background:var(--cream)}
.fp-obs .who{font-size:.72rem;color:var(--muted);font-weight:600;margin-bottom:3px}
.fp-obs .txt{font-size:.86rem;color:var(--ink);white-space:pre-wrap}
.fp-foot{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--border);padding:12px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mov-ov{position:fixed;inset:0;background:rgba(30,10,10,.5);display:none;z-index:75}
.mov-ov.show{display:block}
.mov-panel{position:absolute;top:0;right:0;height:100%;width:min(420px,92vw);background:var(--cream);display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.2)}
.mov-head{position:sticky;top:0;background:var(--grad);color:#fff;padding:15px 16px;display:flex;align-items:center;gap:10px}
.mov-head h3{font-family:'Fraunces',serif;font-weight:600;font-size:1.1rem}
.mov-x{margin-left:auto;background:rgba(255,255,255,.2);border:0;color:#fff;width:32px;height:32px;border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.mov-body{padding:12px 14px;overflow:auto;flex:1}
.mov-empty{font-size:.85rem;color:var(--muted);text-align:center;padding:30px 10px}
.mov-row{background:#fff;border:1px solid var(--border);border-radius:14px;padding:11px 12px;margin-bottom:10px;cursor:pointer}
.mov-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:5px}
.mov-dt{font-size:.7rem;color:var(--muted);white-space:nowrap}
.mov-title{font-family:'Fraunces',serif;font-weight:600;font-size:.98rem;color:var(--ink);line-height:1.25}
.mov-sub{font-size:.76rem;color:var(--body);margin-top:4px;display:flex;gap:5px;align-items:flex-start}
.mov-sub i{color:var(--vinho);font-size:.9rem;flex-shrink:0;margin-top:1px}
.ata-card h3{cursor:default}
/* MODAL */
.ov{position:fixed;inset:0;background:rgba(30,10,10,.5);display:none;align-items:flex-start;justify-content:center;z-index:60;overflow-y:auto;padding:20px 12px}
.ov.show{display:flex}
.modal{background:#fff;border-radius:16px;max-width:600px;width:100%;padding:18px 18px 22px}
.modal h2{font-family:'Fraunces',serif;font-style:normal;color:var(--vinho-deep);font-size:1.2rem;margin-bottom:12px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:.7rem;font-weight:700;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.fld input[type=text],.fld input[type=date],.fld textarea{width:100%;font-family:inherit;font-size:.9rem;padding:10px;border:1.5px solid var(--border);border-radius:9px;background:#fff;color:var(--ink)}
.fld textarea{min-height:70px;resize:vertical}
#mRelBox{display:flex;flex-wrap:wrap;gap:6px}
.modalfoot{display:flex;justify-content:space-between;gap:8px;margin-top:6px;align-items:center}
.hint{font-size:.7rem;color:var(--muted);margin-top:4px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(90px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:10px;font-size:.85rem;z-index:9999;transition:transform .3s;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0)}
</style>
<style id="lolaV3">
  .card{border:1px solid #ECE3D9;border-radius:13px;box-shadow:none;position:relative;overflow:hidden;padding-left:18px}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--cor,#7E1E1F)}
  .card.done{opacity:.55}
  .card.done:hover{opacity:1}
  .card.destaque{border-color:#EAD08A}
  .viewtoggle .vt{border-radius:10px;box-shadow:inset 0 0 0 1px #ECE3D9;background:#fff;color:#5A463E}
  .viewtoggle .vt.on{background:var(--vinho);color:#fff;box-shadow:none}
  .vt-badge{background:#A82A2A;color:#fff;border-radius:9px;font-size:.62rem;font-weight:700;padding:1px 6px;margin-left:4px;line-height:1.4}
  .vt.on .vt-badge{background:#fff;color:#A82A2A}
  .grouphdr{background:none;border:none;box-shadow:none;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:#B79A8E;font-weight:600;padding:14px 4px 4px}
  .grouphdr span{background:none;color:#B79A8E;font-weight:600}
  .badge{border-radius:8px}
  .chip{border-radius:8px}
  .btn{border-radius:13px}

var _qp=document.getElementById('qPrazo');if(_qp)_qp.value='';
initQuick();
}
var _ddId=null;
function desdobrar(id,ev){
_ddId=id;
var pop=document.getElementById('ddpop');
if(!pop){pop=document.createElement('div');pop.id='ddpop';pop.className='ddpop';document.body.appendChild(pop);document.addEventListener('click',function(x){var p=document.getElementById('ddpop');if(p&&p.classList.contains('show')&&!p.contains(x.target))p.classList.remove('show');});}
pop.innerHTML='<button onclick="ddObs(event)"><i class="ph-duotone ph-note-pencil"></i> Adicionar observação</button><button onclick="ddTarefa(event)"><i class="ph-duotone ph-plus" style="color:var(--vinho)"></i> Criar tarefa ligada</button><button onclick="ddPessoa(event)"><i class="ph-duotone ph-user-plus"></i> Atribuir pessoa</button>';
var e=ev||window.event, r=null;
try{var btn=e&&e.target?e.target.closest('button'):null;r=btn?btn.getBoundingClientRect():null;}catch(x){}
if(!r)r={left:40,bottom:180};
pop.style.left=Math.max(10,Math.min(r.left,window.innerWidth-230))+'px';
pop.style.top=Math.min(r.bottom+6,window.innerHeight-150)+'px';
if(e&&e.stopPropagation)e.stopPropagation();
setTimeout(function(){pop.classList.add('show');},0);
}
function _ddClose(){var p=document.getElementById('ddpop');if(p)p.classList.remove('show');}
function ddObs(ev){if(ev)ev.stopPropagation();var id=_ddId;_ddClose();abrirFicha(id);setTimeout(function(){var t=document.getElementById('fpObs');if(t){try{t.scrollIntoView({behavior:'smooth',block:'center'});}catch(e){}t.focus();}},280);}
function ddTarefa(ev){if(ev)ev.stopPropagation();var id=_ddId;_ddClose();desdobrarTarefa(id);}
function ddPessoa(ev){if(ev)ev.stopPropagation();var id=_ddId;_ddClose();editar(id);setTimeout(function(){var p=document.getElementById('mResp');if(p){try{p.scrollIntoView({behavior:'smooth',block:'center'});}catch(e){}}},250);}
function desdobrarTarefa(id){
var f=REG.find(function(x){return x.id==id;});if(!f)return;
_q={uni:arr(f.unidades).slice(),cat:arr(f.categorias).slice(),resp:arr(f.responsaveis).slice(),tarefa:true,parent:f.id,vincular:false,chain:[]};
document.getElementById('qTitulo').value='';document.getElementById('qDesc').value='';

initQuick();
openNovo();
setDesdobraMode(true);

toast('Nova ficha ligada — preencha o título');

async function quickSave(){
var titulo=document.getElementById('qTitulo').value.trim();
if(!titulo){toast('Dê um título ao registro.');return;}
var ehT=_q.tarefa, par=_q.parent;
var liga=[]; if(par)liga.push(par); _q.chain.forEach(function(id){if(liga.indexOf(id)<0)liga.push(id);});
var p={titulo:titulo,criado_por:meuNome()||null,tipo:ehT?'Tarefa':'Aviso',eh_tarefa:ehT,
unidades:_q.uni.slice(),categorias:_q.cat.slice(),pessoas:[],
responsaveis:_q.resp.slice(),conteudo:document.getElementById('qDesc').value.trim()||null,
prazo:document.getElementById('qPrazo').value||null,tags:[],oks:{},concluido:false,
relacionados:liga.slice(),data:new Date().toISOString().slice(0,10),updated_at:new Date().toISOString()};
try{
var i=await sb.from('lola_assuntos').insert(p).select('id').single();if(i.error)throw i.error;
var novo=i.data.id;
logAtv('criou',{id:novo,titulo:titulo,eh_tarefa:ehT},_q.resp.length?('para '+_q.resp.join(', ')):null);
for(var li=0;li<liga.length;li++){
var pf=REG.find(function(x){return x.id==liga[li];});
var rel=pf?arr(pf.relacionados).slice():[];
if(rel.indexOf(novo)<0){rel.push(novo);await sb.from('lola_assuntos').update({relacionados:rel,updated_at:new Date().toISOString()}).eq('id',liga[li]);}
}
if(_q.vincular){_q.chain.push(novo);_q.parent=null;document.getElementById('qDesc').value='';await load();renderVinc();toast('✓ Vinculado ('+_q.chain.length+') — escreva a próxima');window.scrollTo({top:0,behavior:'smooth'});}
else{clearQuick();closeNovo();await load();toast('✓ Registrado');window.scrollTo({top:0,behavior:'smooth'});}
}catch(e){toast('Erro: '+(e.message||e));}
}

/* ===== Visualização favorita (por login) ===== */
var FAV_VIEW=null;
function meuId(){try{var pp=window.parent;if(pp&&pp!==window&&pp.__portalUser&&pp.__portalUser.id)return pp.__portalUser.id;}catch(e){}return null;}
function viewLabel(v){return {lista:'Lista',quadro:'Quadro',mapa:'Mapa',atas:'Atas'}[v]||v;}
function updateViewStars(){Array.prototype.forEach.call(document.querySelectorAll('.viewtoggle .vt'),function(b){var v=b.getAttribute('data-v');var st=b.querySelector('.vt-star');if(st)st.classList.toggle('fav',FAV_VIEW===v);});}
async function initViewFav(){var uid=meuId();if(!uid){updateViewStars();return;}try{var r=await sb.rpc('portal_pref_get',{p_user_id:uid,p_key:'reg_view_fav'});var v=r&&r.data;if(v&&['lista','quadro','mapa','atas'].indexOf(v)>=0){FAV_VIEW=v;setView(v);}}catch(e){}updateViewStars();}
async function toggleViewFav(v){var uid=meuId();if(!uid){toast('Faça login no portal para favoritar');return;}FAV_VIEW=(FAV_VIEW===v)?null:v;updateViewStars();try{await sb.rpc('portal_pref_set',{p_user_id:uid,p_key:'reg_view_fav',p_val:FAV_VIEW||''});}catch(e){}toast(FAV_VIEW?('★ '+viewLabel(v)+' será sua visualização padrão'):'Visualização padrão removida');}

/* ===== Sino: movimentações recentes ===== */
function movStateTag(f){
  if(f.concluido) return {t:'Concluída',c:'#1f7a4d',bg:'#E6F3EA',ic:'check-circle'};
  if(!f.eh_tarefa) return {t:'Aviso',c:'#6b5d5d',bg:'#efe9e6',ic:'megaphone'};
  var oks=oksOf(f),resp=arr(f.responsaveis),n=resp.filter(function(r){return oks[r];}).length;
  if(n>0) return {t:'Em andamento',c:'#9A6B1E',bg:'#FBF0DD',ic:'clock'};
  return {t:'A fazer',c:'#B5302E',bg:'#FBEAE7',ic:'circle-dashed'};
}
function movRowHTML(f){
  var st=movStateTag(f);
  var resp=arr(f.responsaveis),oks=oksOf(f),okNames=resp.filter(function(r){return oks[r];});
  var okline=resp.length?('<div class="mov-sub"><i class="ph-duotone ph-check"></i> OK '+okNames.length+'/'+resp.length+(okNames.length?': '+okNames.map(esc).join(', '):'')+'</div>'):'';
  var obs=arr(f.observacoes),last=obs.length?obs[obs.length-1]:null;
  var obsline=last?('<div class="mov-sub"><i class="ph-duotone ph-chat-text"></i> '+esc(last.autor||'—')+': '+esc(String(last.texto||'').slice(0,70))+'</div>'):'';
  var when=fmtDate(String(f.updated_at||f.data||'').slice(0,10));
  return '<div class="mov-row" onclick="fecharMov();abrirFicha('+f.id+')">'
    +'<div class="mov-top"><span class="badge" style="background:'+st.bg+';color:'+st.c+'"><i class="ph-duotone ph-'+st.ic+'"></i> '+st.t+'</span><span class="mov-dt">'+when+'</span></div>'
    +'<div class="mov-title">'+esc(f.titulo||'(sem título)')+'</div>'+okline+obsline+'</div>';
}
function atvWhen(iso){try{var d=new Date(iso);var p=function(n){return String(n).padStart(2,'0');};return fmtDate(String(iso).slice(0,10))+' '+p(d.getHours())+':'+p(d.getMinutes());}catch(e){return '';}}
async function abrirMovimentacoes(){
  var box=document.getElementById('movbody');if(!box)return;
  box.innerHTML='<div class="mov-empty">Carregando…</div>';
  var o=document.getElementById('movov');if(o)o.classList.add('show');
  try{
    var r=await sb.from('lola_atividades').select('quem,acao,alvo_id,alvo_titulo,detalhe,created_at').order('created_at',{ascending:false}).limit(30);
    if(r.error)throw r.error;
    var rows=r.data||[];
    box.innerHTML=rows.length?rows.map(function(a){
      var quem=a.quem?esc(a.quem):'Alguém';
      var click=a.alvo_id?(' onclick="fecharMov();abrirFicha('+a.alvo_id+')" style="cursor:pointer"'):'';
      var det=a.detalhe?('<div class="mov-sub">'+esc(a.detalhe)+'</div>'):'';
      return '<div class="mov-row"'+click+'><div class="mov-top"><span style="font-size:.8rem"><b>'+quem+'</b> '+esc(a.acao)+'</span><span class="mov-dt">'+esc(atvWhen(a.created_at))+'</span></div><div class="mov-title" style="font-weight:500">'+esc(String(a.alvo_titulo||'').split('\n')[0].slice(0,90))+'</div>'+det+'</div>';
    }).join(''):'<div class="mov-empty">Nenhuma movimentação ainda.</div>';
  }catch(e){ box.innerHTML='<div class="mov-empty">Não deu pra carregar agora.</div>'; }
  try{localStorage.setItem('reg_mov_seen',new Date().toISOString());}catch(e){}
  updateMovBadge();
}
function fecharMov(){var o=document.getElementById('movov');if(o)o.classList.remove('show');}
function updateMovBadge(){
  var bd=document.getElementById('hdrBadge');if(!bd)return;
  var seen=null;try{seen=localStorage.getItem('reg_mov_seen');}catch(e){}
  var since=seen?new Date(seen).getTime():(Date.now()-24*3600*1000);
  var n=REG.filter(function(f){var t=new Date(f.updated_at||f.data||0).getTime();return t>since;}).length;
  if(n>0){bd.style.display='';bd.textContent=n>99?'99+':n;}else{bd.style.display='none';}
}
function _refreshFp(){ if(_fpId!=null){ var f=REG.find(function(x){return x.id==_fpId;}); if(f) abrirFicha(_fpId); else fecharFicha(); } }
function abrirFicha(id){
var f=REG.find(function(x){return x.id==id;});if(!f)return;
_fpId=id;
var uni=arr(f.unidades).map(function(u){return '<span class="chip uni '+uniCls(u)+'">'+esc(u)+'</span>';}).join('');
var cat=arr(f.categorias).map(function(c){return '<span class="chip cat" style="color:'+catColor(c)+'">'+esc(c)+'</span>';}).join('');
var badge=f.eh_tarefa?'<span class="badge" style="background:rgba(255,255,255,.2);color:#fff"><i class="ph-duotone ph-check-square"></i> Tarefa</span>':'<span class="badge" style="background:rgba(255,255,255,.2);color:#fff"><i class="ph-duotone ph-megaphone"></i> Aviso</span>';
var resp=arr(f.responsaveis), oks=oksOf(f), nok=resp.filter(function(r){return oks[r];}).length;
var okhtml=resp.length?('<div class="oklabel">OK dos responsáveis ('+nok+'/'+resp.length+')</div><div class="okrow">'+resp.map(function(r){var on=!!oks[r];return '<span class="okchip'+(on?' on':'')+'" onclick="toggleOk('+f.id+',\''+esc(r).replace(/'/g,"\\'")+'\')">'+(on?'✓ ':'○ ')+esc(r)+'</span>';}).join('')+'</div>'):'<div class="fp-meta" style="color:var(--muted)">Sem responsáveis definidos.</div>';
var obs=Array.isArray(f.observacoes)?f.observacoes:[];
var obshtml=obs.length?obs.slice().reverse().map(function(o){return '<div class="fp-obs"><div class="who">'+esc(o.autor||'—')+' · '+fmtDate(String(o.data||'').slice(0,10))+'</div><div class="txt">'+esc(o.texto||'')+'</div></div>';}).join(''):'<div class="fp-meta" style="color:var(--muted)">Nenhuma observação ainda.</div>';
var quem=(f.criado_por?esc(f.criado_por):'Alguém')+' &rarr; '+(resp.length?resp.map(esc).join(', '):'(sem responsáveis)');
var hojeStr=new Date().toISOString().slice(0,10);
var prazoTxt=f.prazo?((!f.concluido&&String(f.prazo).slice(0,10)<hojeStr?'⚠️ Atrasado: ':'Prazo: ')+fmtDate(f.prazo)):'Sem prazo';
var statusTxt=f.concluido?'Concluída':(kStatus(f)==='andamento'?'Em andamento':'A fazer');
var html='<div class="fp-head"><div><div class="chips" style="margin-bottom:7px">'+badge+'</div><div style="font-family:\'Fraunces\',serif;font-weight:600;font-size:1.18rem;line-height:1.2">'+esc(f.titulo||'(sem título)')+'</div></div><button class="fp-x" onclick="fecharFicha()"><i class="ph-duotone ph-x"></i></button></div>'
+'<div class="fp-body">'
+((uni||cat)?'<div class="fp-sec"><div class="chips">'+uni+cat+'</div></div>':'')
+'<div class="fp-sec"><h4>Quem abriu pra quem</h4><div class="fp-meta">'+quem+'</div><div class="fp-meta" style="color:var(--muted);margin-top:3px">Criado em '+fmtDate(f.data)+'</div></div>'
+(f.conteudo?('<div class="fp-sec"><h4>Descrição</h4><div class="fp-meta" style="white-space:pre-wrap">'+esc(f.conteudo)+'</div></div>'):'')
+(f.eh_tarefa?('<div class="fp-sec">'+okhtml+'</div>'):'')
+'<div class="fp-sec"><h4>Observações</h4>'+obshtml+'<textarea id="fpObs" placeholder="Escrever uma observação…" style="width:100%;margin-top:8px;min-height:54px;font-family:inherit;font-size:.88rem;padding:9px 11px;border:1.5px solid var(--border);border-radius:10px;background:var(--cream);color:var(--ink)"></textarea><button class="btn btn-ghost btn-sm" style="margin-top:7px" onclick="addObs('+f.id+')"><i class="ph-duotone ph-chat-text"></i> Adicionar observação</button></div>'
+'<div class="fp-sec"><h4>Desdobrar</h4><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-ghost btn-sm" onclick="fecharFicha();desdobrarTarefa('+f.id+')"><i class="ph-duotone ph-arrows-split"></i> Nova tarefa ligada</button><button class="btn btn-ghost btn-sm" onclick="var t=document.getElementById(\'fpObs\');if(t)t.focus()"><i class="ph-duotone ph-chat-text"></i> Observação</button></div></div>'
+'</div>'
+'<div class="fp-foot"><div class="fp-meta"><b>'+statusTxt+'</b> · '+prazoTxt+'</div><div style="margin-left:auto;display:flex;gap:8px">'+(f.eh_tarefa?('<button class="btn btn-sm btnconcluir'+(f.concluido?' reaberto':'')+'" onclick="toggleDone('+f.id+','+(f.concluido?'false':'true')+')">'+(f.concluido?'<i class="ph-duotone ph-arrow-u-up-left"></i> Reabrir':'<i class="ph-duotone ph-check"></i> Concluir')+'</button>'):'')+'<button class="btn btn-ghost btn-sm" onclick="fecharFicha();editar('+f.id+')"><i class="ph-duotone ph-pencil-simple"></i> Editar</button></div></div>';
document.getElementById('fp').innerHTML=html;
document.getElementById('fpov').classList.add('show');
}
async function addObs(id){
var ta=document.getElementById('fpObs');if(!ta)return;var txt=ta.value.trim();if(!txt){toast('Escreva a observação.');return;}
var f=REG.find(function(x){return x.id==id;});if(!f)return;
var obs=Array.isArray(f.observacoes)?f.observacoes.slice():[];
obs.push({autor:meuNome()||'—',data:new Date().toISOString(),texto:txt});
f.observacoes=obs;
try{var u=await sb.from('lola_assuntos').update({observacoes:obs,updated_at:new Date().toISOString()}).eq('id',id);if(u.error)throw u.error;toast('Observação adicionada');logAtv('comentou em',f);}
catch(e){toast('Erro ao salvar observação');}
abrirFicha(id);
}

// ---- edit modal ----
function setMTipo(t){_m.tarefa=t;renderSeg('mTipoSeg',_m);}
function renderMRel(){
var box=document.getElementById('mRelBox');
if(!_m.rel.length){box.innerHTML='<span class="hint">nenhuma</span>';return;}
box.innerHTML=_m.rel.map(function(rid){var r=REG.find(function(x){return x.id==rid;});return '<span class="okchip" style="cursor:default">'+esc(r?r.titulo:('#'+rid))+' <span class="x" style="cursor:pointer" onclick="unlinkRel('+rid+')">✕</span></span>';}).join('');
}
function unlinkRel(rid){_m.rel=_m.rel.filter(function(x){return x!=rid;});renderMRel();}
function editar(id){
var f=REG.find(function(x){return x.id==id;});if(!f)return;
EDIT=f.id;_m={uni:arr(f.unidades).slice(),cat:arr(f.categorias).slice(),resp:arr(f.responsaveis).slice(),tarefa:!!f.eh_tarefa,rel:arr(f.relacionados).slice()};
document.getElementById('mTit').textContent='Editar registro';
document.getElementById('mNome').value=f.titulo||'';
document.getElementById('mDesc').value=f.conteudo||'';
document.getElementById('mData').value=(f.data||'').slice(0,10);
document.getElementById('mPrazo').value=(f.prazo||'').slice(0,10);
document.getElementById('mTags').value=arr(f.tags).join(' ');
pickInto('mUni',UNIDADES,_m.uni);pickInto('mCat',CATS,_m.cat);pickInto('mResp',TEAM,_m.resp);
renderSeg('mTipoSeg',_m);renderMRel();
document.getElementById('ov').classList.add('show');
}
function fechar(){document.getElementById('ov').classList.remove('show');}
function parseTags(s){return (s||'').split(/[\s,]+/).map(function(t){return t.replace(/^#/,'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');}).filter(function(t){return t.length>0;}).filter(function(t,i,a){return a.indexOf(t)===i;});}
async function salvar(){
var titulo=document.getElementById('mNome').value.trim();if(!titulo){toast('Dê um título.');return;}
var ex=REG.find(function(x){return x.id==EDIT;})||{};
var newResp=_m.resp.slice();
var oldOks=oksOf(ex), oks={}; newResp.forEach(function(r){if(oldOks[r])oks[r]=oldOks[r];});
var done=_m.tarefa?(newResp.length>0?newResp.every(function(r){return oks[r];}):!!ex.concluido):false;
var p={titulo:titulo,tipo:_m.tarefa?'Tarefa':'Aviso',eh_tarefa:_m.tarefa,
data:document.getElementById('mData').value||null,prazo:document.getElementById('mPrazo').value||null,
unidades:_m.uni.slice(),categorias:_m.cat.slice(),responsaveis:newResp,
conteudo:document.getElementById('mDesc').value.trim()||null,tags:parseTags(document.getElementById('mTags').value),
pessoas:arr(ex.pessoas),relacionados:_m.rel.slice(),oks:oks,concluido:done,concluido_em:done?(ex.concluido_em||new Date().toISOString()):null,
updated_at:new Date().toISOString()};
try{
var u=await sb.from('lola_assuntos').update(p).eq('id',EDIT);if(u.error)throw u.error;
var _oldR=arr(ex.responsaveis),_addR=newResp.filter(function(r){return _oldR.indexOf(r)<0;}),_remR=_oldR.filter(function(r){return newResp.indexOf(r)<0;});
if(_addR.length||_remR.length){logAtv('reatribuiu',{id:EDIT,titulo:titulo,eh_tarefa:_m.tarefa},(_remR.length?('saiu: '+_remR.join(', ')):'')+(_remR.length&&_addR.length?' · ':'')+(_addR.length?('entrou: '+_addR.join(', ')):''));}
else{logAtv('editou',{id:EDIT,titulo:titulo,eh_tarefa:_m.tarefa});}
// desvincular dos dois lados
var oldRel=arr(ex.relacionados).map(String), newRel=_m.rel.map(String);
var removed=oldRel.filter(function(x){return newRel.indexOf(x)<0;});
for(var ri=0;ri<removed.length;ri++){
var o=REG.find(function(x){return String(x.id)===removed[ri];});
if(o){var rr=arr(o.relacionados).filter(function(z){return String(z)!==String(EDIT);});
await sb.from('lola_assuntos').update({relacionados:rr,updated_at:new Date().toISOString()}).eq('id',o.id);}
}
fechar();await load();toast('✓ Salvo');
}catch(e){toast('Erro: '+(e.message||e));}
}
async function delAtual(){
if(!EDIT)return;if(!confirm('Excluir este registro?'))return;
var _fx=REG.find(function(x){return x.id==EDIT;});
try{var d=await sb.from('lola_assuntos').delete().eq('id',EDIT);if(d.error)throw d.error;if(_fx)logAtv('excluiu',_fx);fechar();await load();toast('Excluído');}
catch(e){toast('Erro ao excluir');}
}
document.getElementById('ov').addEventListener('click',function(e){if(e.target===this)fechar();});

initQuick(); carregarBlocoCounts(); load().then(function(){try{applyUrlFilters();}catch(e){} try{initViewFav();}catch(e){} try{updateMovBadge();}catch(e){}});
