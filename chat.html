<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat da Equipe · Lola</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--vinho:#A8272A;--vinho-deep:#7C1A1C;--vinho-pale:#F9ECEC;--cream:#FDFAF7;--border:#E8D8D8;--ink:#1E0A0A;--muted:#9A7070}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Inter',sans-serif;background:var(--cream);color:var(--ink);display:flex;flex-direction:column;height:100vh}
header{background:#fff;border-bottom:3px solid var(--vinho);padding:12px 16px;flex:0 0 auto}
header h1{font-family:'Playfair Display',serif;font-style:italic;color:var(--vinho-deep);font-size:1.3rem;line-height:1}
header .sub{color:var(--muted);font-size:.72rem;margin-top:3px}
#feed{flex:1 1 auto;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:9px}
.wrapf{max-width:820px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:9px}
.daysep{align-self:center;font-size:.66rem;font-weight:700;color:var(--muted);background:#fff;border:1px solid var(--border);border-radius:20px;padding:3px 12px;margin:4px 0}
.msg{max-width:78%;padding:8px 12px;border-radius:14px;background:#fff;border:1px solid var(--border);align-self:flex-start}
.msg.me{align-self:flex-end;background:var(--vinho);color:#fff;border-color:var(--vinho)}
.msg .who{font-size:.7rem;font-weight:700;color:var(--vinho-deep);margin-bottom:2px}
.msg.me .who{display:none}
.msg .txt{font-size:.9rem;line-height:1.35;white-space:pre-wrap;word-break:break-word}
.msg .tm{font-size:.62rem;color:var(--muted);margin-top:3px;text-align:right}
.msg.me .tm{color:#f3d9d9}
.empty{align-self:center;color:var(--muted);font-size:.85rem;margin-top:30px;text-align:center;line-height:1.5}
.composer{flex:0 0 auto;display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--border);background:#fff}
.composer .cwrap{max-width:820px;width:100%;margin:0 auto;display:flex;gap:8px}
.composer textarea{flex:1;resize:none;font-family:inherit;font-size:.92rem;padding:10px 12px;border:1.5px solid var(--border);border-radius:12px;background:var(--cream);color:var(--ink);max-height:120px;height:44px}
.composer button{flex:0 0 auto;background:var(--vinho);color:#fff;border:none;border-radius:12px;padding:0 18px;font-weight:700;font-size:.92rem;cursor:pointer}
.composer button:active{background:var(--vinho-deep)}
</style></head>
<body>
<header><h1>💬 Chat da Equipe</h1><div class="sub">Mural da equipe Lola — todo mundo vê as mensagens</div></header>
<div id="feed"><div class="empty">Carregando…</div></div>
<div class="composer"><div class="cwrap"><textarea id="inp" rows="1" placeholder="Escreva uma mensagem para a equipe…"></textarea><button onclick="enviar()">Enviar</button></div></div>
<script>
var SB_URL="https://mvjbsdpfjhywhaonvpfl.supabase.co";
var SB_KEY="sb_publishable_VMJzYe1AwL9zEoFs-ljUIw_OOkDpqhy";
var sb=window.supabase.createClient(SB_URL,SB_KEY);
function meuNome(){try{var p=window.parent;if(p&&p!==window&&p.__portalUser&&p.__portalUser.name)return p.__portalUser.name;}catch(e){}try{var s=JSON.parse(localStorage.getItem('lola_session')||'null');if(s&&s.name)return s.name;}catch(e){}return 'Equipe';}
var EU=meuNome();
function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function pad(n){return String(n).padStart(2,'0');}
function hhmm(d){return pad(d.getHours())+':'+pad(d.getMinutes());}
function diaLabel(d){var now=new Date();var y=new Date(now);y.setDate(now.getDate()-1);if(d.toDateString()===now.toDateString())return 'Hoje';if(d.toDateString()===y.toDateString())return 'Ontem';return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear();}
var MSGS=[];
function marcarVisto(){try{localStorage.setItem('lola_chat_seen_'+EU.toLowerCase(), new Date().toISOString());}catch(e){}}
function render(scroll){
  var feed=document.getElementById('feed');
  if(!MSGS.length){feed.innerHTML='<div class="empty">Nenhuma mensagem ainda.<br>Seja a primeira a escrever pra equipe! 👋</div>';return;}
  var wasBottom=feed.scrollHeight-feed.scrollTop-feed.clientHeight<90;
  var html='<div class="wrapf">', lastDay='';
  MSGS.forEach(function(m){
    var d=new Date(m.created_at); var dl=diaLabel(d);
    if(dl!==lastDay){html+='<div class="daysep">'+esc(dl)+'</div>';lastDay=dl;}
    var me=(String(m.autor||'').toLowerCase()===EU.toLowerCase());
    html+='<div class="msg'+(me?' me':'')+'"><div class="who">'+esc(m.autor||'?')+'</div><div class="txt">'+esc(m.texto)+'</div><div class="tm">'+hhmm(d)+'</div></div>';
  });
  html+='</div>';
  feed.innerHTML=html;
  if(scroll||wasBottom) feed.scrollTop=feed.scrollHeight;
}
async function carregar(scroll){
  try{
    var r=await sb.from('lola_chat_msgs').select('*').order('created_at',{ascending:true}).limit(400);
    if(r.error)throw r.error;
    MSGS=r.data||[];
    render(scroll);
    marcarVisto();
  }catch(e){}
}
async function enviar(){
  var inp=document.getElementById('inp'); var t=(inp.value||'').trim(); if(!t)return;
  inp.value=''; inp.style.height='44px';
  try{ var r=await sb.from('lola_chat_msgs').insert({autor:EU,texto:t}); if(r.error)throw r.error; await carregar(true); }
  catch(e){ inp.value=t; alert('Erro ao enviar. Tente de novo.'); }
}
var inp=document.getElementById('inp');
inp.addEventListener('keydown',function(e){ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();enviar();} });
inp.addEventListener('input',function(){ this.style.height='44px'; this.style.height=Math.min(this.scrollHeight,120)+'px'; });
carregar(true);
setInterval(function(){carregar(false);},5000);
window.addEventListener('focus',marcarVisto);
</script>
</body></html>
