<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lola · Notas & Divergências</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Hanken+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/duotone/style.css">
<style>
:root{
  --creme:#FBF7F1; --card:#FFFFFF; --border:#ECE3D9; --fio:#EFE6DC; --cremeDark:#F7EFE6;
  --vinho:#A82A2A; --vinhoH:#7E1E1F;
  --ink:#2A1A17; --sec:#5A463E; --mut:#8A7A72; --lbl:#B79A8E;
  --okBg:#E6F3EA; --okFg:#2C7A4B; --pendBg:#FBF0DD; --pendFg:#9A6B1E; --urgBg:#FBEAE7; --urgFg:#B5302E;
  --r-pill:9px; --r-btn:13px; --r-card:15px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden}
body{background:var(--creme);color:var(--ink);font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 96px}

/* cabeçalho */
header{display:flex;align-items:center;gap:12px;padding:14px 0 12px;border-bottom:1px solid var(--fio);margin-bottom:8px}
header .back{background:none;border:0;color:var(--vinho);font-size:22px;display:flex;align-items:center;cursor:pointer;padding:4px}
header h1{font-family:Fraunces,serif;font-weight:600;font-size:19px;color:var(--vinho);line-height:1.15}
header .sub{font-size:11px;font-weight:600;color:var(--mut);letter-spacing:.02em}
header .spacer{flex:1}
header .act{background:none;border:0;color:var(--sec);font-size:21px;cursor:pointer;padding:4px}

/* abas */
nav.tabs{display:flex;gap:20px;padding:10px 0 0;border-bottom:1px solid var(--fio);margin-bottom:20px}
nav.tabs button{background:none;border:0;font:inherit;font-weight:600;font-size:14px;color:var(--mut);padding:8px 0 10px;cursor:pointer}
nav.tabs button.on{color:var(--vinho);box-shadow:inset 0 -2px 0 var(--vinho)}

/* filtros pills */
.pills{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:20px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{background:var(--card);border:1px solid var(--border);border-radius:var(--r-pill);padding:8px 14px;font-size:12.5px;font-weight:600;color:var(--sec);white-space:nowrap;cursor:pointer}
.pill.on{background:var(--vinho);border-color:var(--vinho);color:#fff}

.lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--lbl);font-weight:600;margin:24px 0 10px}

/* cartão */
.item{background:var(--card);border:1px solid var(--border);border-radius:var(--r-card);padding:14px;margin-bottom:10px}
.item.done{opacity:.62}
.item .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.item .forn{font-weight:700;font-size:14px;overflow-wrap:anywhere}
.item .val{font-family:Fraunces,serif;font-weight:600;font-size:15px;color:var(--urgFg);white-space:nowrap}
.item .meta{font-size:11.5px;color:var(--mut);margin-top:3px}
.item .desc{font-size:13px;color:var(--sec);margin-top:8px;background:var(--cremeDark);border-radius:10px;padding:9px 11px;overflow-wrap:anywhere}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:var(--r-pill);padding:3px 9px;font-size:10.5px;font-weight:700;margin-top:8px}
.tag.pend{background:var(--pendBg);color:var(--pendFg)}
.tag.ok{background:var(--okBg);color:var(--okFg)}
.tag.tipo{background:var(--cremeDark);color:var(--sec)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* botões */
.btn{border:0;border-radius:var(--r-btn);min-height:44px;padding:0 16px;font:inherit;font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer}
.btn.p{background:var(--vinho);color:#fff}
.btn.p:active{background:var(--vinhoH)}
.btn.g{background:var(--card);color:var(--sec);border:1px solid var(--border)}
.btn.full{width:100%}
.btn.sm{min-height:38px;font-size:12.5px;padding:0 12px}

/* campos */
.fld{margin-bottom:14px}
.fld label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--lbl);font-weight:600;margin-bottom:6px}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;background:var(--card);border:1px solid var(--border);border-radius:var(--r-btn);
  padding:12px;font:inherit;font-size:14px;color:var(--ink);min-height:44px}
textarea{min-height:88px;resize:vertical}
input[type=file]{width:100%;font:inherit;font-size:13px;padding:10px 0}

.note{background:var(--cremeDark);border-radius:12px;padding:12px 14px;font-size:12.5px;color:var(--sec);margin-bottom:18px;overflow-wrap:anywhere}
.empty{text-align:center;color:var(--mut);padding:48px 16px;font-size:13.5px}
.empty i{font-size:34px;display:block;margin-bottom:12px;color:var(--lbl)}
a.file{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--vinho);text-decoration:none;margin-top:8px}

/* toast */
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,140%);background:#2A1A17;color:#fff;
  padding:12px 18px;border-radius:12px;font-size:13px;font-weight:600;z-index:300;transition:.25s;max-width:92vw;text-align:center}
#toast.on{transform:translate(-50%,0)}
.spin{width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--vinho);border-radius:50%;animation:sp .8s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.hidden{display:none!important}
@media(min-width:900px){ .wrap{padding-left:24px;padding-right:24px} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="back" id="btnBack" title="Voltar ao menu"><i class="ph-duotone ph-caret-left"></i></button>
    <div>
      <h1>Notas &amp; Divergências</h1>
      <div class="sub" id="hSub">Pendências e baixa de notas</div>
    </div>
    <div class="spacer"></div>
    <button class="act" id="btnReload" title="Atualizar"><i class="ph-duotone ph-arrows-clockwise"></i></button>
  </header>

  <nav class="tabs">
    <button class="on" data-v="pend">A encontrar</button>
    <button data-v="import">Importar notas</button>
  </nav>

  <!-- PENDÊNCIAS -->
  <section id="v-pend">
    <div class="pills" id="fPills">
      <button class="pill on" data-f="aberto">Abertas</button>
      <button class="pill" data-f="resolvido">Resolvidas</button>
      <button class="pill" data-f="todas">Todas</button>
    </div>
    <div id="listaPend"><div class="spin"></div></div>
  </section>

  <!-- IMPORTAR -->
  <section id="v-import" class="hidden">
    <div class="note"><b>Baixa de notas.</b> Selecione os arquivos <b>XML</b> das notas fiscais. O sistema lê fornecedor, valor, produtos e as parcelas do boleto. Notas já cadastradas são ignoradas (não duplica).</div>
    <div class="fld">
      <label>Empresa</label>
      <select id="impUnit">
        <option value="ccmq">Lola CCMQ</option>
        <option value="mac">Lola MAC</option>
        <option value="central">Cozinha Central</option>
        <option value="eventos">Eventos</option>
      </select>
    </div>
    <div class="fld">
      <label>Arquivos XML (pode selecionar vários)</label>
      <input type="file" id="impFiles" accept=".xml,text/xml" multiple>
    </div>
    <button class="btn p full" id="impGo"><i class="ph-duotone ph-upload-simple"></i> Importar notas</button>
    <div id="impMsg" style="margin-top:16px"></div>
  </section>
</div>
<div id="toast"></div>

<script>
const SB_URL='https://mvjbsdpfjhywhaonvpfl.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im12amJzZHBmamh5d2hhb252cGZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDgyODcxNTgsImV4cCI6MjA2Mzg2MzE1OH0.i_3sqgQa6umsIYBmAwWz_NP6nYuT3GfIZid24zHXSEI';
const H={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const ST={itens:[], filtro:'aberto'};

const UNIT_NOME={ccmq:'Lola CCMQ',mac:'Lola MAC',central:'Cozinha Central',eventos:'Eventos'};
const TIPO_NOME={nota_nao_encontrada:'Nota não encontrada',valor_divergente:'Valor divergente',fornecedor_desconhecido:'Fornecedor desconhecido',outro:'Outro'};

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2600);}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function brl(v){return (v==null||isNaN(v))?'—':(+v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
function fmtDate(d){if(!d)return'—';const[y,m,dd]=String(d).slice(0,10).split('-');return `${dd}/${m}/${y}`;}
async function api(path,opt={}){
  const r=await fetch(SB_URL+'/rest/v1/'+path,{headers:H,...opt});
  if(!r.ok) throw new Error(await r.text()||('HTTP '+r.status));
  return r.status===204?null:r.json().catch(()=>null);
}
function meuNome(){ return localStorage.getItem('divNome')||''; }

/* ============ PENDÊNCIAS ============ */
async function carregar(){
  try{ ST.itens=await api('lola_divergencias?select=*&order=created_at.desc'); render(); }
  catch(e){ $('#listaPend').innerHTML=`<div class="empty"><i class="ph-duotone ph-warning"></i>Erro ao carregar: ${esc(e.message)}</div>`; }
}
function render(){
  const el=$('#listaPend');
  let l=ST.itens;
  if(ST.filtro!=='todas') l=l.filter(x=>x.status===ST.filtro);
  if(!l.length){ el.innerHTML=`<div class="empty"><i class="ph-duotone ph-check-circle"></i>${ST.filtro==='aberto'?'Nenhuma pendência aberta. Tudo em dia!':'Nada aqui.'}</div>`; return; }
  const abertas=l.filter(x=>x.status==='aberto'), feitas=l.filter(x=>x.status!=='aberto');
  let h='';
  if(abertas.length && ST.filtro==='todas') h+=`<div class="lbl">Abertas · ${abertas.length}</div>`;
  h+=abertas.map(card).join('');
  if(feitas.length && ST.filtro==='todas') h+=`<div class="lbl">Resolvidas · ${feitas.length}</div>`;
  h+=feitas.map(card).join('');
  el.innerHTML=h;
  wire();
}
function card(d){
  const aberto=d.status==='aberto';
  return `<div class="item ${aberto?'':'done'}" data-id="${d.id}">
    <div class="top">
      <div style="flex:1;min-width:0">
        <div class="forn">${esc(d.fornecedor||'(sem fornecedor)')}</div>
        <div class="meta">${fmtDate(d.data_pagamento)} · ${esc(UNIT_NOME[d.unit]||d.unit)}${d.criado_por?' · pedido por '+esc(d.criado_por):''}</div>
      </div>
      <div class="val">${brl(d.valor)}</div>
    </div>
    <span class="tag tipo"><i class="ph-duotone ph-tag"></i>${esc(TIPO_NOME[d.tipo]||d.tipo)}</span>
    <span class="tag ${aberto?'pend':'ok'}">${aberto?'<i class="ph-duotone ph-clock"></i>A encontrar':'<i class="ph-duotone ph-check"></i>Resolvido'}</span>
    ${d.descricao?`<div class="desc">${esc(d.descricao)}</div>`:''}
    ${d.obs?`<div class="desc"><b>Resposta:</b> ${esc(d.obs)}${d.resolvido_por?' — '+esc(d.resolvido_por):''}</div>`:''}
    ${d.arquivo_url?`<a class="file" href="${esc(d.arquivo_url)}" target="_blank" rel="noopener"><i class="ph-duotone ph-paperclip"></i>${esc(d.arquivo_nome||'arquivo anexado')}</a>`:''}
    <div class="row">
      ${aberto
        ? `<button class="btn p sm" data-res="${d.id}"><i class="ph-duotone ph-check-circle"></i> Resolver</button>`
        : `<button class="btn g sm" data-reabrir="${d.id}"><i class="ph-duotone ph-arrow-counter-clockwise"></i> Reabrir</button>`}
    </div>
    <div class="resolver hidden" data-form="${d.id}" style="margin-top:14px;border-top:1px solid var(--fio);padding-top:14px">
      <div class="fld"><label>Seu nome</label><input type="text" class="fNome" value="${esc(meuNome())}" placeholder="Ex.: Ingrid"></div>
      <div class="fld"><label>O que você encontrou?</label><textarea class="fObs" placeholder="Ex.: nota veio por e-mail do fornecedor, importei o XML"></textarea></div>
      <div class="fld"><label>Anexar a nota (XML ou PDF) — opcional</label><input type="file" class="fArq" accept=".xml,.pdf,image/*"></div>
      <button class="btn p full" data-salvar="${d.id}"><i class="ph-duotone ph-check"></i> Marcar como resolvido</button>
    </div>
  </div>`;
}
function wire(){
  $$('[data-res]').forEach(b=>b.onclick=()=>{ const f=$(`[data-form="${b.dataset.res}"]`); f.classList.toggle('hidden'); });
  $$('[data-reabrir]').forEach(b=>b.onclick=()=>reabrir(b.dataset.reabrir));
  $$('[data-salvar]').forEach(b=>b.onclick=()=>salvar(b.dataset.salvar,b));
}
async function salvar(id,btn){
  const box=$(`[data-form="${id}"]`);
  const nome=box.querySelector('.fNome').value.trim();
  const obs=box.querySelector('.fObs').value.trim();
  const arq=box.querySelector('.fArq').files[0];
  if(!nome){ toast('Coloque seu nome'); return; }
  localStorage.setItem('divNome',nome);
  btn.disabled=true; const old=btn.innerHTML; btn.innerHTML='<i class="ph-duotone ph-spinner"></i> Salvando…';
  try{
    let url=null,nomeArq=null;
    if(arq){
      const path=`${id}/${Date.now()}_${arq.name.replace(/[^\w.\-]/g,'_')}`;
      const up=await fetch(`${SB_URL}/storage/v1/object/divergencias/${path}`,{method:'POST',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY},body:arq});
      if(!up.ok) throw new Error('falha ao subir o arquivo');
      url=`${SB_URL}/storage/v1/object/public/divergencias/${path}`; nomeArq=arq.name;
    }
    await api(`lola_divergencias?id=eq.${id}`,{method:'PATCH',headers:{...H,'Prefer':'return=minimal'},
      body:JSON.stringify({status:'resolvido',obs:obs||null,resolvido_por:nome,resolved_at:new Date().toISOString(),
        ...(url?{arquivo_url:url,arquivo_nome:nomeArq}:{})})});
    toast('Resolvido!'); await carregar();
  }catch(e){ toast('Erro: '+e.message); btn.disabled=false; btn.innerHTML=old; }
}
async function reabrir(id){
  try{ await api(`lola_divergencias?id=eq.${id}`,{method:'PATCH',headers:{...H,'Prefer':'return=minimal'},
    body:JSON.stringify({status:'aberto',resolved_at:null})});
    toast('Reaberta'); await carregar(); }catch(e){ toast('Erro: '+e.message); }
}

/* ============ IMPORTAR NOTAS (XML) ============ */
function parseNFeXML(xmlText){
  const doc=new DOMParser().parseFromString(xmlText,'text/xml');
  const infs=[...doc.getElementsByTagName('infNFe')];
  const g=(p,t)=>{if(!p)return'';const el=p.getElementsByTagName(t)[0];return el?el.textContent.trim():'';};
  return infs.map(inf=>{
    const id=(inf.getAttribute('Id')||'').replace(/^NFe/,'');
    const emit=inf.getElementsByTagName('emit')[0], ide=inf.getElementsByTagName('ide')[0], tot=inf.getElementsByTagName('ICMSTot')[0];
    const dh=g(ide,'dhEmi')||g(ide,'dEmi');
    const itens=[...inf.getElementsByTagName('det')].map(det=>{
      const prod=det.getElementsByTagName('prod')[0];
      return {desc:g(prod,'xProd'), qtd:parseFloat(g(prod,'qCom')||'0')||0, un:g(prod,'uCom'),
        vunit:parseFloat(g(prod,'vUnCom')||'0')||0, vtotal:parseFloat(g(prod,'vProd')||'0')||0};
    }).filter(i=>i.desc);
    // parcelas do boleto (duplicatas)
    const parcelas=[...inf.getElementsByTagName('dup')].map(d=>({
      num:g(d,'nDup'), venc:g(d,'dVenc'), valor:parseFloat(g(d,'vDup')||'0')||0
    })).filter(p=>p.valor>0);
    return {chave:id, emitente:g(emit,'xNome'), cnpj:g(emit,'CNPJ'), numero:g(ide,'nNF'),
      data_emissao:dh?dh.slice(0,10):null, valor_total:parseFloat(g(tot,'vNF')||'0')||0, itens,
      parcelas:parcelas.length?parcelas:null};
  }).filter(n=>n.chave);
}
async function importar(){
  const fs=[...$('#impFiles').files];
  if(!fs.length){ toast('Escolha os arquivos XML'); return; }
  const unit=$('#impUnit').value;
  const btn=$('#impGo'); btn.disabled=true; const old=btn.innerHTML; btn.innerHTML='<i class="ph-duotone ph-spinner"></i> Importando…';
  try{
    let todas=[];
    for(const f of fs){ const txt=await f.text(); todas=todas.concat(parseNFeXML(txt)); }
    if(!todas.length){ toast('Nenhuma NF-e válida nos arquivos'); return; }
    const rows=todas.map(n=>({...n,unit}));
    const ins=await api('financeiro_notas?on_conflict=chave',{method:'POST',
      headers:{...H,'Prefer':'return=representation,resolution=ignore-duplicates'},body:JSON.stringify(rows)});
    const novas=(ins||[]).length, jaTinha=rows.length-novas;
    const comParc=(ins||[]).filter(n=>n.parcelas&&n.parcelas.length).length;
    $('#impMsg').innerHTML=`<div class="note" style="background:var(--okBg);color:var(--okFg)">
      <b>${novas} nota(s) importada(s)</b>${jaTinha?` · ${jaTinha} já estavam cadastradas`:''}${comParc?` · ${comParc} com boleto parcelado`:''}.
      Pronto — já aparecem no Financeiro.</div>`;
    $('#impFiles').value='';
    toast(novas+' nota(s) importada(s)');
  }catch(e){ $('#impMsg').innerHTML=`<div class="note" style="background:var(--urgBg);color:var(--urgFg)">Erro: ${esc(e.message)}</div>`; }
  finally{ btn.disabled=false; btn.innerHTML=old; }
}

/* ============ NAV ============ */
$$('nav.tabs button').forEach(b=>b.onclick=()=>{
  $$('nav.tabs button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
  $('#v-pend').classList.toggle('hidden',b.dataset.v!=='pend');
  $('#v-import').classList.toggle('hidden',b.dataset.v!=='import');
});
$$('#fPills .pill').forEach(p=>p.onclick=()=>{
  $$('#fPills .pill').forEach(x=>x.classList.remove('on')); p.classList.add('on'); ST.filtro=p.dataset.f; render();
});
$('#btnReload').onclick=()=>{ $('#listaPend').innerHTML='<div class="spin"></div>'; carregar(); };
$('#impGo').onclick=importar;
$('#btnBack').onclick=()=>{ if(window.parent!==window){ window.parent.postMessage({lola:'voltarMenu'},'*'); } else { history.length>1?history.back():location.href='/'; } };

carregar();
</script>
</body>
</html>
