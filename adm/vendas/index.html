<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lola · Vendas CCMQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/duotone/style.css">
<style>
:root{
  --creme:#FBF7F1; --card:#FFFFFF; --border:#ECE3D9; --fio:#EFE6DC; --cremeDark:#F7EFE6;
  --vinho:#A82A2A; --vinhoH:#7E1E1F;
  --ink:#2A1A17; --sec:#5A463E; --mut:#8A7A72; --lbl:#B79A8E;
  --ok:#2C7A4B; --ruim:#B5302E;
  --r-btn:13px; --r-card:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden}
body{background:var(--creme);color:var(--ink);font-family:'Manrope',system-ui,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:920px;margin:0 auto;padding:0 16px 64px}

.apphead{display:flex;align-items:center;gap:10px;padding:16px 0 14px;border-bottom:1px solid var(--fio)}
.apphead .back{font-size:20px;color:var(--sec);text-decoration:none;display:flex}
.apphead h1{font-family:Fraunces,serif;font-weight:600;font-size:19px;color:var(--vinho)}
.pill-un{margin-left:auto;font-size:11px;font-weight:700;background:#FBE4E0;color:#C0392B;border-radius:9px;padding:3px 10px}

.abas{display:flex;gap:8px;margin:14px 0 4px}
.aba{flex:1;text-align:center;padding:10px 0;border-radius:10px;font-size:13px;font-weight:600;color:var(--sec);background:#fff;border:1px solid var(--border);cursor:pointer;font-family:inherit}
.aba.on{background:var(--vinho);color:#fff;border-color:var(--vinho);font-weight:700}
@media(min-width:900px){ .abas{max-width:420px} }

.lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--lbl);font-weight:600;margin:32px 0 10px}

.nav-linha{display:flex;align-items:center;justify-content:space-between;margin:20px 0 4px;color:var(--sec);font-size:13.5px}
.nav-linha b{font-weight:700;color:var(--ink)}
.nav-linha button{background:none;border:0;color:var(--mut);font-size:18px;padding:8px 14px;cursor:pointer;font-family:inherit}
.nav-linha button:disabled{opacity:.25;cursor:default}
.nav-linha .gear{font-size:16px;color:var(--mut)}

.centro{text-align:center}
.big{font-family:Fraunces,serif;font-weight:600;font-size:44px;color:var(--ink);letter-spacing:-.01em;margin-top:6px}
.big small{font-size:19px;color:var(--mut);font-family:'Manrope',sans-serif;font-weight:400}
.big-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--lbl);font-weight:600;margin-top:2px}
.meta-dia{margin-top:8px;font-size:12.5px;color:var(--sec)}
.meta-dia b.ok{color:var(--ok)} .meta-dia b.ruim{color:var(--ruim)}

.linha-kpis{display:flex;margin:20px auto 0;border-top:1px solid var(--fio);max-width:560px}
.kpi{flex:1;padding:12px 4px 0;text-align:center}
.kpi + .kpi{border-left:1px solid var(--fio)}
.kpi .v{font-family:Fraunces,serif;font-weight:600;font-size:19px}
.kpi .l{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--lbl);font-weight:600;margin-top:1px}
.kpi.editavel{cursor:pointer}
.kpi.editavel .v{color:var(--vinho)}
.kpi .lapis{font-size:11px;color:var(--lbl)}
.kpi .ref{display:block;font-size:9.5px;color:var(--mut);margin-top:2px}
.meta-linha{margin-top:16px;font-size:12.5px;color:var(--mut);text-align:center}

.mes-list{border-top:1px solid var(--fio)}
.dia-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--fio);font-size:12.5px;cursor:pointer}
.dia-row .d{width:64px;color:var(--sec);white-space:nowrap}
.dia-row .bar{flex:1;height:7px;border-radius:4px;background:var(--cremeDark);position:relative;overflow:hidden}
.dia-row .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:#D9B8AE}
.dia-row.sel .bar i{background:var(--vinho)}
.dia-row.sel .d,.dia-row.sel .v{font-weight:700;color:var(--ink)}
.dia-row .v{width:58px;text-align:right;color:var(--sec)}

.prod{display:flex;align-items:baseline;gap:10px;padding:10px 0;border-bottom:1px solid var(--fio)}
.prod .n{font-weight:600;font-size:13.5px;flex:1;min-width:0}
.prod .q{font-size:11.5px;color:var(--mut);white-space:nowrap}
.prod .val{font-family:Fraunces,serif;font-weight:600;font-size:14.5px;white-space:nowrap}

.canc-head{display:flex;align-items:baseline;gap:8px}
.canc-chip{font-size:11px;font-weight:600;background:#FBEAE7;color:var(--ruim);border-radius:9px;padding:3px 10px}
.canc{display:flex;align-items:baseline;gap:10px;padding:9px 0;border-bottom:1px solid var(--fio);font-size:13px}
.canc .n{flex:1;min-width:0}
.canc .m{font-size:11.5px;color:var(--mut);font-style:italic}
.canc .q{font-weight:700;color:var(--ruim);white-space:nowrap}
.sem-msg{padding:14px 0;font-size:12.5px;color:var(--mut)}

.cta{display:block;width:100%;max-width:560px;margin:36px auto 0;background:var(--vinho);color:#fff;border:none;border-radius:var(--r-btn);min-height:44px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer}
.cta:active{background:var(--vinhoH)}

.grupo-lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--lbl);font-weight:600;margin:22px 0 4px}

/* aba MÊS */
.prog{height:9px;border-radius:5px;background:var(--cremeDark);margin:16px 0 6px;position:relative;overflow:hidden}
.prog i{position:absolute;left:0;top:0;bottom:0;background:var(--vinho);border-radius:5px}
.prog-leg{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut)}
.ritmo{margin-top:14px;font-size:12.5px;color:var(--sec);text-align:center}
.ritmo b.ok{color:var(--ok)} .ritmo b.ruim{color:var(--ruim)}
.sem-bloco{margin-top:20px}
.sem-h{display:flex;align-items:baseline;gap:8px;padding:8px 0 4px;border-bottom:1px solid var(--fio);cursor:pointer}
.sem-h .t{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--lbl);font-weight:700;flex:1}
.sem-h .pct{font-size:12px;font-weight:700}
.pct.ok{color:var(--ok)}.pct.ruim{color:var(--ruim)}.pct.neutro{color:var(--lbl)}
.dl{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--fio);font-size:12.5px}
.dl .d{width:52px;color:var(--sec);white-space:nowrap}
.dl .bar{flex:1;height:7px;border-radius:4px;background:var(--cremeDark);position:relative;overflow:hidden}
.dl .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:#D9B8AE}
.dl.acima .bar i{background:#7FAE93}
.dl .bar .mk{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--sec);opacity:.55}
.dl .v{width:56px;text-align:right;color:var(--ink);font-weight:600}
.dl .dif{width:60px;text-align:right;font-size:11px;font-weight:700}
.dif.ok{color:var(--ok)}.dif.ruim{color:var(--ruim)}.dif.neutro{color:var(--lbl)}
.dl.futuro{opacity:.55}
.dl.futuro .v{font-weight:400;color:var(--mut)}
.sem-tot{display:flex;justify-content:space-between;padding:7px 0;font-size:12px;color:var(--sec)}
.sem-tot b{color:var(--ink)}
.legenda{margin-top:16px;font-size:11px;color:var(--mut);text-align:center}

/* aba PRODUTOS */
.filtro-linha{display:flex;gap:8px;margin:16px 0 0;flex-wrap:wrap}
.fpill{padding:8px 18px;border-radius:9px;font-size:12.5px;font-weight:600;background:#fff;border:1px solid var(--border);color:var(--sec);cursor:pointer;font-family:inherit}
.fpill.on{background:var(--vinho);color:#fff;border-color:var(--vinho)}
.busca{flex:1;min-width:140px;border:1px solid var(--border);border-radius:9px;background:#fff;padding:8px 12px;font-size:13px;font-family:inherit;color:var(--ink)}
.busca::placeholder{color:var(--lbl)}
@media(min-width:900px){ .duas-col{column-count:2;column-gap:48px} .duas-col .grupo-lbl{break-after:avoid} .duas-col .prod{break-inside:avoid} }

/* folhas */
.sheet-bg{position:fixed;inset:0;background:rgba(42,26,23,.35);display:none;z-index:50}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:16px 16px 0 0;padding:20px 16px 28px;max-width:560px;margin:0 auto;display:none;z-index:51}
.sheet h3{font-family:Fraunces,serif;font-weight:600;font-size:17px;color:var(--vinho);margin-bottom:4px}
.sheet p{font-size:12.5px;color:var(--sec);margin-bottom:14px}
.sheet input{width:100%;border:1px solid var(--border);border-radius:var(--r-btn);min-height:48px;padding:0 14px;font-size:19px;font-family:Fraunces,serif;font-weight:600;color:var(--ink);background:var(--creme)}
.sheet .acts{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.sheet .acts button{flex:1;min-height:44px;border-radius:var(--r-btn);font-size:14px;font-weight:600;font-family:inherit;border:1px solid var(--border);background:#fff;color:var(--sec);cursor:pointer}
.sheet .acts button.ok{background:var(--vinho);color:#fff;border:none;font-weight:700}
.sheet .usar-bitbar{display:block;margin:12px auto 0;background:none;border:0;color:var(--mut);font:inherit;font-size:12.5px;font-weight:600;text-decoration:underline;cursor:pointer}
.sheet .who{font-size:11px;color:var(--lbl);margin-top:12px;text-align:center}
.pcts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.pcts label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--lbl);font-weight:600}
.pcts input{min-height:40px;font-size:15px;text-align:center;padding:0 6px}
.pct-soma{font-size:11px;color:var(--mut);margin-top:8px;text-align:center}

.carregando{padding:60px 0;text-align:center;color:var(--mut);font-size:13px}
.erro{padding:40px 16px;text-align:center;color:var(--ruim);font-size:13px;font-weight:600}
</style>
</head>
<body>

<div class="wrap">
  <div class="apphead">
    <a class="back" href="/adm/"><i class="ph-duotone ph-caret-left"></i></a>
    <h1>Vendas</h1>
    <span class="pill-un">CCMQ</span>
  </div>
  <div class="abas">
    <button class="aba on" id="abaDia" onclick="trocarAba('dia')">Dia</button>
    <button class="aba" id="abaMes" onclick="trocarAba('mes')">Mês</button>
    <button class="aba" id="abaProd" onclick="trocarAba('prod')">Produtos</button>
  </div>

  <div id="conteudo"><div class="carregando">Carregando as vendas…</div></div>
</div>

<!-- folha PAX -->
<div class="sheet-bg" id="sheetBg" onclick="fecharSheets()"></div>
<div class="sheet" id="sheetPax">
  <h3>Ajustar PAX do dia</h3>
  <p id="paxTexto"></p>
  <input type="number" id="paxInput" inputmode="numeric" min="1">
  <div class="acts">
    <button type="button" onclick="fecharSheets()">Cancelar</button>
    <button type="button" class="ok" onclick="salvarPax()">Salvar</button>
  </div>
  <button type="button" class="usar-bitbar" id="btnUsarBitbar" onclick="salvarPax(true)">Voltar a usar a contagem do Bitbar</button>
  <div class="who" id="paxWho"></div>
</div>

<!-- folha META -->
<div class="sheet" id="sheetMeta">
  <h3 id="metaTitulo">Meta do mês</h3>
  <p>Meta mensal em R$. O app reparte pelos dias: semana (ter–dom) = mensal ÷ 4,5, e cada dia recebe o seu percentual.</p>
  <input type="number" id="metaInput" inputmode="numeric" min="0" placeholder="490000">
  <div class="pcts" id="pctsBox"></div>
  <div class="pct-soma" id="pctSoma"></div>
  <div class="acts">
    <button type="button" onclick="fecharSheets()">Cancelar</button>
    <button type="button" class="ok" onclick="salvarMeta()">Salvar</button>
  </div>
  <div class="who" id="metaWho"></div>
</div>

<script src="/adm/auth.js"></script>
<script>
const $=s=>document.querySelector(s);
const REST=SB_URL+'/rest/v1';
const UN='CCMQ';

let SESS=null, DIAS=[], DMAP={}, METAS={}, ABA='dia';
let IDX=0, VER_TODOS=false, PRODS_CACHE={}, MESPROD_CACHE={};
let MES_VIS=null, SEM_ABERTAS={}, PROD_MODO='dia', PROD_IDX=0, PROD_MES=null, BUSCA='';

const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const SEMANA=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const SEM3=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const PCT_KEY={2:'ter',3:'qua',4:'qui',5:'sex',6:'sab',0:'dom'};

function dt(iso){ return new Date(iso+'T12:00:00'); }
function hojeIso(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function real(v){ return Math.round(Number(v)||0).toLocaleString('pt-BR'); }
function dec(v,c){ return Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:c==null?2:c,maximumFractionDigits:c==null?2:c}); }
function paxOficial(d){ return d.pax_ajustado!=null ? Number(d.pax_ajustado) : Number(d.pax)||0; }
function nomeMes(mes){ const m=Number(mes.slice(5,7))-1; return MESES[m].charAt(0).toUpperCase()+MESES[m].slice(1)+' · '+mes.slice(0,4); }
function mesAnt(mes,n){ const d=new Date(mes+'-15T12:00:00'); d.setMonth(d.getMonth()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }

function metaDoDia(iso){
  const cfg=METAS[iso.slice(0,7)]; if(!cfg) return 0;
  const k=PCT_KEY[dt(iso).getDay()]; if(!k) return 0;
  const p=Number((cfg.pct||{})[k])||0;
  return (Number(cfg.meta_mensal)/4.5)*(p/100);
}

async function api(path,opt){
  const r=await fetch(REST+path, Object.assign({headers:lolaHeaders(opt&&opt.body?{Prefer:'return=representation,resolution=merge-duplicates'}:{})},opt||{}));
  if(!r.ok) throw new Error('Banco respondeu '+r.status);
  return r.status===204?null:r.json();
}

/* 20/07 (Bianca): "temos que ter um calendario para ver o faturamento e os produtos
   vendidos em uma data especifica" — clicar na data (📅) abre o seletor nativo e pula
   direto pro dia. Dia sem venda registrada = aviso. */
function wireCalendario(idTitulo, aoEscolher, isoAtual){
  const el=document.getElementById(idTitulo); if(!el) return;
  const inp=document.createElement('input');
  inp.type='date'; inp.value=isoAtual||'';
  if(DIAS.length){ inp.min=DIAS[DIAS.length-1].data; inp.max=DIAS[0].data; }
  inp.style.cssText='position:absolute;opacity:0;pointer-events:none;width:0;height:0;border:0;padding:0';
  el.parentNode.insertBefore(inp, el.nextSibling);
  el.onclick=()=>{ try{ inp.showPicker(); }catch(e){ inp.click(); } };
  inp.onchange=()=>{ if(inp.value) aoEscolher(inp.value); };
}

async function carregar(){
  const [dias, metas]=await Promise.all([
    api(`/lola_bitbar_dias?unidade=eq.${UN}&select=*&order=data.desc&limit=800`),
    api(`/lola_vendas_metas?unidade=eq.${UN}&select=*`)
  ]);
  DIAS=dias; DMAP={}; DIAS.forEach(d=>DMAP[d.data]=d);
  METAS={}; metas.forEach(m=>METAS[m.mes]=m);
  if(!DIAS.length){ $('#conteudo').innerHTML='<div class="sem-msg" style="text-align:center;padding:60px 0">Ainda não tem nenhum dia importado do Bitbar.</div>'; return; }
  IDX=0; MES_VIS=DIAS[0].data.slice(0,7); PROD_MES=MES_VIS; PROD_IDX=0;
  render();
}

function trocarAba(a){ ABA=a; VER_TODOS=false; render(); }
function marcarAbas(){
  $('#abaDia').className='aba'+(ABA==='dia'?' on':'');
  $('#abaMes').className='aba'+(ABA==='mes'?' on':'');
  $('#abaProd').className='aba'+(ABA==='prod'?' on':'');
}

function render(){
  marcarAbas();
  if(ABA==='dia') renderDia();
  else if(ABA==='mes') renderMes();
  else renderProd();
}

/* ================= ABA DIA ================= */
async function renderDia(){
  const d=DIAS[IDX], dj=dt(d.data);
  const pax=paxOficial(d), perc=pax>0?Number(d.venda_produtos)/pax:0, ajustado=d.pax_ajustado!=null;
  const meta=metaDoDia(d.data), dif=Number(d.venda_produtos)-meta;
  const mesSel=d.data.slice(0,7);
  const doMes=DIAS.filter(x=>x.data.slice(0,7)===mesSel).slice().reverse();
  const maxV=Math.max(...doMes.map(x=>Number(x.venda_produtos)||0),1);
  const somaMes=doMes.reduce((s,x)=>s+(Number(x.venda_produtos)||0),0);

  let html=`
    <div class="nav-linha">
      <button id="btAnt" ${IDX>=DIAS.length-1?'disabled':''}>‹</button>
      <b id="diaTitulo" style="cursor:pointer" title="Escolher uma data no calendário">${SEMANA[dj.getDay()]} · ${dj.getDate()} de ${MESES[dj.getMonth()]} <span style="font-size:15px">📅</span></b>
      <button id="btProx" ${IDX<=0?'disabled':''}>›</button>
    </div>
    <div class="centro">
      <div class="big"><small>R$</small> ${real(d.venda_produtos)}</div>
      <div class="big-label">Venda de produtos · sem serviço</div>
      ${meta?`<div class="meta-dia">meta do dia R$ ${real(meta)} · <b class="${dif>=0?'ok':'ruim'}">${dif>=0?'+':'−'} R$ ${real(Math.abs(dif))}</b></div>`:''}
    </div>
    <div class="linha-kpis">
      <div class="kpi editavel" onclick="abrirPax()">
        <div class="v">${pax||'—'} <span class="lapis"><i class="ph-duotone ph-pencil-simple"></i></span></div>
        <div class="l">pax</div>
        <span class="ref">${ajustado?('ajustado · bitbar: '+(d.pax??'—')):('bitbar: '+(d.pax??'—'))}</span>
      </div>
      <div class="kpi"><div class="v">${perc?dec(perc):'—'}</div><div class="l">percapta</div></div>
      <div class="kpi"><div class="v">${d.qtde_itens_liquida!=null?dec(d.qtde_itens_liquida,0):'—'}</div><div class="l">itens líquidos</div></div>
    </div>
    <div class="meta-linha">${[d.clima, d.servico!=null?('serviço R$ '+real(d.servico)):null, d.cort_promo!=null?('cortesias/promo R$ '+real(d.cort_promo)):null].filter(Boolean).join(' · ')||'&nbsp;'}</div>

    <div class="lbl">${nomeMes(mesSel).split(' · ')[0]} até agora</div>
    <div class="mes-list">
      ${doMes.map(x=>{ const xd=dt(x.data), w=Math.round((Number(x.venda_produtos)||0)/maxV*100);
        return `<div class="dia-row ${x.data===d.data?'sel':''}" data-dia="${x.data}">
          <span class="d">${SEM3[xd.getDay()]} ${String(xd.getDate()).padStart(2,'0')}</span>
          <span class="bar"><i style="width:${w}%"></i></span>
          <span class="v">${real(x.venda_produtos)}</span></div>`; }).join('')}
    </div>
    <div class="sem-tot"><span>${doMes.length} dias · média ${real(somaMes/doMes.length)}</span><b>R$ ${real(somaMes)}</b></div>

    <div id="blocoProdutos"><div class="carregando">Carregando os produtos…</div></div>`;

  $('#conteudo').innerHTML=html;
  $('#btAnt').onclick=()=>{ if(IDX<DIAS.length-1){ IDX++; renderDia(); } };
  $('#btProx').onclick=()=>{ if(IDX>0){ IDX--; renderDia(); } };
  wireCalendario('diaTitulo', iso=>{ const i=DIAS.findIndex(x=>x.data===iso); if(i>=0){ IDX=i; renderDia(); } else alert('Sem venda registrada nesse dia.'); }, d.data);
  document.querySelectorAll('.dia-row').forEach(r=>r.onclick=()=>{ const i=DIAS.findIndex(x=>x.data===r.dataset.dia); if(i>=0){ IDX=i; renderDia(); } });

  try{ renderProdutosDia(d, await prodsDoDia(d.data)); }
  catch(e){ const b=$('#blocoProdutos'); if(b) b.innerHTML='<div class="erro">Não consegui carregar os produtos: '+e.message+'</div>'; }
}

async function prodsDoDia(data){
  if(PRODS_CACHE[data]) return PRODS_CACHE[data];
  const p=await api(`/lola_bitbar_produtos?unidade=eq.${UN}&data=eq.${data}&select=cod,produto,grupo,qtde,valor,qtde_cortesia,qtde_cancelada,motivo_cancel,qtde_liquida&order=valor.desc`);
  PRODS_CACHE[data]=p; return p;
}

function renderProdutosDia(d, prods){
  const b=$('#blocoProdutos'); if(!b) return;
  if(!prods.length){
    b.innerHTML='<div class="sem-msg">Esse dia veio da planilha de metas — o Bitbar não mandou o detalhe por produto.</div>';
    return;
  }
  const canc=prods.filter(p=>Number(p.qtde_cancelada)>0);
  const totCanc=d.qtde_cancelados!=null?Number(d.qtde_cancelados):canc.reduce((s,p)=>s+Number(p.qtde_cancelada),0);
  let html='<div class="lbl">Mais vendidos do dia</div><div>'+
    prods.slice(0,6).map(linhaProd).join('')+'</div>';
  html+='<div class="lbl canc-head">Cancelados do dia '+(totCanc?`<span class="canc-chip">${dec(totCanc,Number.isInteger(totCanc)?0:1)} itens</span>`:'')+'</div>';
  html+= canc.length
    ? '<div>'+canc.map(p=>`<div class="canc"><span class="n">${p.produto}${p.motivo_cancel?` <span class="m">— ${p.motivo_cancel}</span>`:''}</span><span class="q">${dec(p.qtde_cancelada,Number.isInteger(Number(p.qtde_cancelada))?0:1)}</span></div>`).join('')+'</div>'
    : '<div class="sem-msg">Nenhum cancelamento nesse dia.</div>';
  html+=`<button class="cta" onclick="irProdutosDoDia()">Ver todos os produtos do dia</button>`;
  b.innerHTML=html;
}
function linhaProd(p){
  const q=Number(p.qtde!=null?p.qtde:p.qt);
  return `<div class="prod"><span class="n">${p.produto}</span><span class="q">${dec(q,Number.isInteger(q)?0:2)} un</span><span class="val">R$ ${real(p.valor!=null?p.valor:p.vl)}</span></div>`;
}
function irProdutosDoDia(){ PROD_MODO='dia'; PROD_IDX=IDX; ABA='prod'; render(); }

/* ================= ABA MÊS ================= */
function semanasDoMes(mes){
  const ini=dt(mes+'-01'), fim=new Date(ini); fim.setMonth(fim.getMonth()+1); fim.setDate(0);
  const semanas=[]; let atual=[];
  for(let d=new Date(ini); d<=fim; d.setDate(d.getDate()+1)){
    const iso=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const wd=d.getDay();
    if(wd===2 && atual.length){ semanas.push(atual); atual=[]; }
    if(wd===1 && !DMAP[iso]) continue; /* segunda fechada, só entra se tiver venda */
    atual.push(iso);
  }
  if(atual.length) semanas.push(atual);
  return semanas;
}

function renderMes(){
  const mes=MES_VIS, cfg=METAS[mes], hoje=hojeIso();
  const doMes=DIAS.filter(x=>x.data.slice(0,7)===mes);
  const vendido=doMes.reduce((s,x)=>s+(Number(x.venda_produtos)||0),0);
  const metaMensal=cfg?Number(cfg.meta_mensal):0;
  const semanas=semanasDoMes(mes);
  let metaAcum=0;
  semanas.flat().forEach(iso=>{ if(iso<=hoje && DMAP[iso]) metaAcum+=metaDoDia(iso); });
  const ritmo=metaAcum>0?vendido/metaAcum:null;
  const pctMes=metaMensal>0?vendido/metaMensal:0;

  const mesesDisp=[...new Set([...DIAS.map(d=>d.data.slice(0,7)),...Object.keys(METAS)])].sort();
  const iMes=mesesDisp.indexOf(mes);

  let html=`
    <div class="nav-linha">
      <button id="btMesAnt" ${iMes<=0?'disabled':''}>‹</button>
      <b>${nomeMes(mes)}</b>
      <span style="display:flex;align-items:center">
        <button id="btMesProx" ${iMes>=mesesDisp.length-1?'disabled':''}>›</button>
        <button class="gear" onclick="abrirMeta()" title="Meta do mês"><i class="ph-duotone ph-gear"></i></button>
      </span>
    </div>
    <div class="centro">
      <div class="big"><small>R$</small> ${real(vendido)}</div>
      <div class="big-label">Vendido no mês${metaMensal?` · meta R$ ${real(metaMensal)}`:''}</div>
    </div>`;

  if(metaMensal){
    html+=`<div class="prog"><i style="width:${Math.min(100,Math.round(pctMes*100))}%"></i></div>
    <div class="prog-leg"><span>${Math.round(pctMes*100)}% da meta do mês</span><span>${vendido<metaMensal?('faltam R$ '+real(metaMensal-vendido)):('passou R$ '+real(vendido-metaMensal))}</span></div>`;
    if(ritmo!=null) html+=`<div class="ritmo">No ritmo certo? <b class="${ritmo>=1?'ok':'ruim'}">${Math.round(ritmo*100)}% da meta até agora</b> (meta acumulada: R$ ${real(metaAcum)})</div>`;
  }else{
    html+=`<div class="ritmo">Sem meta cadastrada pra esse mês — toque na engrenagem ⚙️ pra cadastrar.</div>`;
  }

  semanas.forEach((sem,i)=>{
    const nums=sem.filter(iso=>DMAP[iso]);
    const execS=nums.reduce((s,iso)=>s+Number(DMAP[iso].venda_produtos||0),0);
    const metaS_real=nums.reduce((s,iso)=>s+metaDoDia(iso),0);
    const metaS_toda=sem.reduce((s,iso)=>s+metaDoDia(iso),0);
    const pctS=metaS_real>0?execS/metaS_real:null;
    const d1=dt(sem[0]).getDate(), d2=dt(sem[sem.length-1]).getDate();
    const futura=!nums.length;
    const aberta=SEM_ABERTAS[mes+'-'+i] ?? (sem.some(iso=>DMAP[iso]) && sem.some(iso=>iso>=hoje) ) ?? false;
    const chave=mes+'-'+i;

    html+=`<div class="sem-bloco">
      <div class="sem-h" onclick="toggleSem('${chave}')">
        <span class="t">Semana ${i+1} · ${d1} a ${d2}</span>
        ${pctS!=null?`<span class="pct ${pctS>=1?'ok':'ruim'}">${Math.round(pctS*100)}%${pctS>=1?' ✓':''}</span>`:(futura?`<span class="pct neutro">meta ${real(metaS_toda)}</span>`:'')}
      </div>`;
    if(aberta){
      const maxRef=Math.max(...sem.map(iso=>Math.max(Number((DMAP[iso]||{}).venda_produtos)||0, metaDoDia(iso))),1);
      sem.forEach(iso=>{
        const dj=dt(iso), reg=DMAP[iso], meta=metaDoDia(iso);
        const v=reg?Number(reg.venda_produtos):null;
        const w=v!=null?Math.round(v/maxRef*100):0;
        const mk=meta?Math.round(meta/maxRef*100):null;
        const dif=(v!=null&&meta)?v-meta:null;
        if(v==null && iso<hoje && !meta) return;
        html+=`<div class="dl ${v!=null&&meta&&v>=meta?'acima':''} ${v==null?'futuro':''}">
          <span class="d">${SEM3[dj.getDay()]} ${String(dj.getDate()).padStart(2,'0')}</span>
          <span class="bar">${v!=null?`<i style="width:${w}%"></i>`:''}${mk!=null?`<span class="mk" style="left:${Math.min(mk,99)}%"></span>`:''}</span>
          <span class="v">${v!=null?real(v):(meta?real(meta):'—')}</span>
          <span class="dif ${dif==null?'neutro':(dif>=0?'ok':'ruim')}">${dif!=null?((dif>=0?'+':'−')+real(Math.abs(dif))):(v==null&&meta?'meta':'')}</span>
        </div>`;
      });
      if(nums.length) html+=`<div class="sem-tot"><span>Total da semana</span><b>${real(execS)} de ${real(metaS_toda)}</b></div>`;
    }else if(nums.length){
      html+=`<div class="sem-tot"><span>Total da semana</span><b>${real(execS)} de ${real(metaS_toda)}</b></div>`;
    }
    html+=`</div>`;
  });

  html+=`<div class="legenda">A barra é o vendido; o tracinho escuro é a meta do dia (verde = passou). Toque no título da semana pra abrir ou fechar.</div>`;
  $('#conteudo').innerHTML=html;
  const btA=$('#btMesAnt'), btP=$('#btMesProx');
  if(btA) btA.onclick=()=>{ if(iMes>0){ MES_VIS=mesesDisp[iMes-1]; renderMes(); } };
  if(btP) btP.onclick=()=>{ if(iMes<mesesDisp.length-1){ MES_VIS=mesesDisp[iMes+1]; renderMes(); } };
}
function toggleSem(chave){
  const mes=MES_VIS, i=Number(chave.split('-').pop());
  const sem=semanasDoMes(mes)[i], hoje=hojeIso();
  const abertaHoje=SEM_ABERTAS[chave] ?? (sem.some(iso=>DMAP[iso]) && sem.some(iso=>iso>=hoje));
  SEM_ABERTAS[chave]=!abertaHoje;
  renderMes();
}

/* ================= ABA PRODUTOS ================= */
async function prodsDoMes(mes){
  if(MESPROD_CACHE[mes]) return MESPROD_CACHE[mes];
  const fim=mesAnt(mes,1)+'-01';
  const rows=await api(`/lola_bitbar_produtos?unidade=eq.${UN}&data=gte.${mes}-01&data=lt.${fim}&select=cod,produto,grupo,qtde,valor&limit=20000`);
  const ag={};
  rows.forEach(r=>{ const a=ag[r.cod]=ag[r.cod]||{cod:r.cod,produto:r.produto,grupo:r.grupo,qtde:0,valor:0}; a.qtde+=Number(r.qtde)||0; a.valor+=Number(r.valor)||0; });
  const lista=Object.values(ag).sort((a,b)=>b.valor-a.valor);
  MESPROD_CACHE[mes]=lista; return lista;
}

async function renderProd(){
  const mesesDisp=[...new Set(DIAS.map(d=>d.data.slice(0,7)))].sort();
  let navHtml, tituloPeriodo;
  if(PROD_MODO==='dia'){
    const d=DIAS[PROD_IDX], dj=dt(d.data);
    navHtml=`<button id="bpAnt" ${PROD_IDX>=DIAS.length-1?'disabled':''}>‹</button><b id="prodTitulo" style="cursor:pointer" title="Escolher uma data no calendário">${SEMANA[dj.getDay()]} · ${dj.getDate()} de ${MESES[dj.getMonth()]} <span style="font-size:15px">📅</span></b><button id="bpProx" ${PROD_IDX<=0?'disabled':''}>›</button>`;
    tituloPeriodo='do dia';
  }else{
    const i=mesesDisp.indexOf(PROD_MES);
    navHtml=`<button id="bpAnt" ${i<=0?'disabled':''}>‹</button><b>${nomeMes(PROD_MES)}</b><button id="bpProx" ${i>=mesesDisp.length-1?'disabled':''}>›</button>`;
    tituloPeriodo='do mês';
  }

  $('#conteudo').innerHTML=`
    <div class="filtro-linha">
      <button class="fpill ${PROD_MODO==='dia'?'on':''}" onclick="PROD_MODO='dia';renderProd()">Dia</button>
      <button class="fpill ${PROD_MODO==='mes'?'on':''}" onclick="PROD_MODO='mes';renderProd()">Mês</button>
      <input class="busca" id="buscaInp" placeholder="🔍 buscar produto…" value="${BUSCA.replace(/"/g,'&quot;')}">
    </div>
    <div class="nav-linha">${navHtml}</div>
    <div id="blocoLista"><div class="carregando">Carregando…</div></div>`;

  const inp=$('#buscaInp');
  inp.oninput=()=>{ BUSCA=inp.value; desenharLista(); };
  const bA=$('#bpAnt'), bP=$('#bpProx');
  if(PROD_MODO==='dia'){
    if(bA) bA.onclick=()=>{ if(PROD_IDX<DIAS.length-1){ PROD_IDX++; renderProd(); } };
    if(bP) bP.onclick=()=>{ if(PROD_IDX>0){ PROD_IDX--; renderProd(); } };
    wireCalendario('prodTitulo', iso=>{ const i=DIAS.findIndex(x=>x.data===iso); if(i>=0){ PROD_IDX=i; renderProd(); } else alert('Sem venda registrada nesse dia.'); }, DIAS[PROD_IDX].data);
  }else{
    const i=mesesDisp.indexOf(PROD_MES);
    if(bA) bA.onclick=()=>{ if(i>0){ PROD_MES=mesesDisp[i-1]; renderProd(); } };
    if(bP) bP.onclick=()=>{ if(i<mesesDisp.length-1){ PROD_MES=mesesDisp[i+1]; renderProd(); } };
  }

  window._prodLista=null;
  try{
    window._prodLista = PROD_MODO==='dia' ? await prodsDoDia(DIAS[PROD_IDX].data) : await prodsDoMes(PROD_MES);
    window._tituloPeriodo=tituloPeriodo;
    desenharLista();
  }catch(e){ const b=$('#blocoLista'); if(b) b.innerHTML='<div class="erro">Não consegui carregar: '+e.message+'</div>'; }
}

function desenharLista(){
  const b=$('#blocoLista'); if(!b||!window._prodLista) return;
  let lista=window._prodLista;
  const termo=BUSCA.trim().toLowerCase();
  if(termo) lista=lista.filter(p=>(p.produto||'').toLowerCase().includes(termo)||(p.grupo||'').toLowerCase().includes(termo));
  if(!lista.length){
    b.innerHTML=`<div class="sem-msg">${window._prodLista.length?'Nada com esse nome no período.':'Sem detalhe por produto nesse período (dias importados da planilha não têm produto a produto).'}</div>`;
    return;
  }
  const totV=lista.reduce((s,p)=>s+Number(p.valor||0),0);
  let html=`<div class="grupo-lbl">Mais vendidos ${window._tituloPeriodo} · ${lista.length} produtos · R$ ${real(totV)}</div>`;
  html+='<div>'+lista.slice(0,10).map(linhaProd).join('')+'</div>';

  const grupos={};
  lista.forEach(p=>{ (grupos[p.grupo]=grupos[p.grupo]||[]).push(p); });
  html+='<div class="duas-col">';
  Object.keys(grupos).sort((a,b)=>{ const sv=g=>grupos[g].reduce((s,p)=>s+Number(p.valor||0),0); return sv(b)-sv(a); })
    .forEach(g=>{
      const soma=grupos[g].reduce((s,p)=>s+Number(p.valor||0),0);
      html+=`<div class="grupo-lbl">${(g||'').replace(/^\d+\s*-\s*/,'')} · R$ ${real(soma)}</div>`+grupos[g].map(linhaProd).join('');
    });
  html+='</div>';
  b.innerHTML=html;
}

/* ================= FOLHAS ================= */
function fecharSheets(){ $('#sheetBg').style.display='none'; $('#sheetPax').style.display='none'; $('#sheetMeta').style.display='none'; }

function abrirPax(){
  const d=DIAS[IDX];
  $('#paxTexto').innerHTML=`O Bitbar contou <b>${d.pax??'—'}</b>. Informe a contagem oficial da equipe — a percapta recalcula sozinha e o valor do Bitbar fica guardado como referência.`;
  $('#paxInput').value=paxOficial(d)||'';
  $('#btnUsarBitbar').style.display = d.pax_ajustado!=null && d.pax!=null ? 'block' : 'none';
  $('#paxWho').textContent = d.pax_ajustado!=null && d.pax_ajustado_por ? `Último ajuste: ${d.pax_ajustado_por}` : '';
  $('#sheetBg').style.display='block'; $('#sheetPax').style.display='block';
  $('#paxInput').focus();
}
async function salvarPax(limpar){
  const d=DIAS[IDX];
  let body;
  if(limpar){ body={pax_ajustado:null, pax_ajustado_por:null, pax_ajustado_em:null}; }
  else{
    const p=parseInt($('#paxInput').value,10);
    if(!p||p<1){ fecharSheets(); return; }
    if(d.pax!=null && p===Number(d.pax)){ body={pax_ajustado:null, pax_ajustado_por:null, pax_ajustado_em:null}; }
    else body={pax_ajustado:p, pax_ajustado_por:(SESS&&(SESS.nome||SESS.email))||'', pax_ajustado_em:new Date().toISOString()};
  }
  try{
    const r=await api(`/lola_bitbar_dias?data=eq.${d.data}&unidade=eq.${UN}`,{method:'PATCH',body:JSON.stringify(body)});
    if(r&&r[0]) DIAS[IDX]=r[0]; else Object.assign(DIAS[IDX],body);
    DMAP[d.data]=DIAS[IDX];
  }catch(e){ alert('Não consegui salvar o PAX: '+e.message); }
  fecharSheets(); render();
}

const PCT_ORD=[['ter','Ter'],['qua','Qua'],['qui','Qui'],['sex','Sex'],['sab','Sáb'],['dom','Dom']];
function abrirMeta(){
  const cfg=METAS[MES_VIS]||{meta_mensal:'',pct:{ter:12,qua:10,qui:15,sex:18,sab:23,dom:22}};
  $('#metaTitulo').textContent='Meta de '+nomeMes(MES_VIS).split(' · ')[0].toLowerCase()+' '+MES_VIS.slice(0,4);
  $('#metaInput').value=cfg.meta_mensal||'';
  $('#pctsBox').innerHTML=PCT_ORD.map(([k,n])=>`<div><label>${n} %</label><input type="number" step="0.5" id="pct_${k}" value="${(cfg.pct||{})[k]??''}"></div>`).join('');
  $('#metaWho').textContent = cfg.atualizado_por?`Última alteração: ${cfg.atualizado_por}`:'';
  const atualizaSoma=()=>{ const s=PCT_ORD.reduce((t,[k])=>t+(Number($('#pct_'+k).value)||0),0); $('#pctSoma').innerHTML=s===100?'Os percentuais somam <b>100%</b> ✓':`Os percentuais somam <b>${dec(s,1)}%</b> — o certo é 100%`; };
  PCT_ORD.forEach(([k])=>$('#pct_'+k).oninput=atualizaSoma); atualizaSoma();
  $('#sheetBg').style.display='block'; $('#sheetMeta').style.display='block';
}
async function salvarMeta(){
  const meta=Number($('#metaInput').value)||0;
  const pct={}; PCT_ORD.forEach(([k])=>pct[k]=Number($('#pct_'+k).value)||0);
  const body={mes:MES_VIS, unidade:UN, meta_mensal:meta, pct, atualizado_por:(SESS&&(SESS.nome||SESS.email))||'', atualizado_em:new Date().toISOString()};
  try{
    const r=await api(`/lola_vendas_metas?on_conflict=mes,unidade`,{method:'POST',body:JSON.stringify(body)});
    METAS[MES_VIS]=(r&&r[0])||body;
  }catch(e){ alert('Não consegui salvar a meta: '+e.message); }
  fecharSheets(); render();
}

/* ================= boot ================= */
(async()=>{
  SESS=await lolaGate({papeis:['admin','financeiro'], titulo:'Vendas · CCMQ'});
  try{ await carregar(); }
  catch(e){ $('#conteudo').innerHTML='<div class="erro">Não consegui falar com o banco: '+e.message+'</div>'; }
})();
</script>
