<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lola · Estoque da Central</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Hanken+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/duotone/style.css">
<style>
:root{
  --creme:#FBF7F1; --card:#FFFFFF; --border:#ECE3D9; --fio:#EFE6DC; --cremeDark:#F7EFE6;
  --vinho:#A82A2A; --vinhoH:#7E1E1F;
  --ink:#2A1A17; --sec:#5A463E; --mut:#8A7A72; --lbl:#B79A8E;
  --okBg:#E6F3EA; --okFg:#2C7A4B; --pendBg:#FBF0DD; --pendFg:#9A6B1E; --urgBg:#FBEAE7; --urgFg:#B5302E;
  --r-pill:9px; --r-btn:13px; --r-card:15px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden}
body{background:var(--creme);color:var(--ink);font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 96px}
header{display:flex;align-items:center;gap:12px;padding:14px 0 12px;border-bottom:1px solid var(--fio);margin-bottom:14px}
header .back{background:none;border:0;color:var(--vinho);font-size:22px;display:flex;align-items:center;cursor:pointer;padding:4px}
header h1{font-family:Fraunces,serif;font-weight:600;font-size:19px;color:var(--vinho);line-height:1.15}
header .sub{font-size:11px;font-weight:600;color:var(--mut);letter-spacing:.02em}
header .spacer{flex:1}
header .act{background:none;border:0;color:var(--sec);font-size:21px;cursor:pointer;padding:4px}

.tabs{display:flex;gap:7px;margin-bottom:16px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.tabs button{flex:1 0 auto;min-height:44px;white-space:nowrap;background:var(--card);border:1px solid var(--border);border-radius:var(--r-btn);
  font:inherit;font-weight:700;font-size:12.5px;color:var(--sec);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 10px}
.tabs button.on{background:var(--vinho);color:#fff;border-color:var(--vinho)}
.tabs button i{font-size:18px}
.tabs button .cnt{font-size:11px;background:var(--urgBg);color:var(--urgFg);border-radius:999px;padding:1px 7px;font-weight:800}
.tabs button.on .cnt{background:rgba(255,255,255,.24);color:#fff}

.note{background:var(--cremeDark);border-radius:12px;padding:12px 14px;font-size:12.5px;color:var(--sec);margin-bottom:16px;overflow-wrap:anywhere}
.monthsel{display:flex;align-items:center;gap:10px;margin:2px 0 12px}
.monthsel span{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--lbl);font-weight:700;flex-shrink:0}
.monthsel select{flex:1;min-width:0;background:var(--card);border:1px solid var(--border);border-radius:var(--r-btn);padding:11px 12px;font:inherit;font-size:14px;color:var(--ink);min-height:44px}
.lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--lbl);font-weight:600;margin:20px 0 10px;display:flex;align-items:center;gap:8px}
.lbl .spacer{flex:1}
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:nowrap}
.toolbar input[type=search]{flex:1;min-width:0;background:var(--card);border:1px solid var(--border);border-radius:var(--r-btn);padding:11px 12px;font:inherit;font-size:14px;min-height:44px}
.chip{background:var(--card);border:1px solid var(--border);border-radius:var(--r-btn);padding:0 14px;min-height:44px;font:inherit;font-weight:700;font-size:12.5px;color:var(--sec);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px}
.chip.on{background:var(--vinho);color:#fff;border-color:var(--vinho)}

/* cartão de nota */
.ncard{background:var(--card);border:1px solid var(--border);border-radius:var(--r-card);padding:14px;margin-bottom:10px;cursor:pointer;display:flex;align-items:center;gap:12px}
.ncard:active{background:var(--cremeDark)}
.ncard .ic{font-size:26px;color:var(--vinho);flex-shrink:0}
.ncard .t{flex:1;min-width:0}
.ncard .t b{display:block;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ncard .t span{display:block;font-size:12px;color:var(--mut);margin-top:2px}
.ncard .r{text-align:right;flex-shrink:0}
.ncard .r .v{font-family:Fraunces,serif;font-weight:600;font-size:15px}
.ncard .r .n{font-size:11px;color:var(--mut);margin-top:2px}
.ncard.done .ic{color:var(--okFg)}

/* saldo */
.tot{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:14px;text-align:center}
.tot .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--lbl);font-weight:700}
.tot .big{font-family:Fraunces,serif;font-weight:600;font-size:38px;line-height:1;margin:6px 0 2px}
.tot .s{font-size:12px;color:var(--mut);font-weight:600}
.catrow{margin:18px 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--lbl);font-weight:700;display:flex;justify-content:space-between}
.srow{background:var(--card);border:1px solid var(--border);border-radius:var(--r-card);padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
.srow .t{flex:1;min-width:0}
.srow .t b{display:block;font-size:13.5px;font-weight:700}
.srow .t span{display:block;font-size:11.5px;color:var(--mut);margin-top:1px}
.srow .r{text-align:right;flex-shrink:0}
.srow .r .q{font-family:Fraunces,serif;font-weight:600;font-size:15px}
.srow .r .v{font-size:11.5px;color:var(--mut);margin-top:1px}
.srow .resolv{flex-shrink:0;min-height:38px;padding:0 14px;font-size:12px}
.prodq{display:flex;align-items:center;gap:8px;flex-shrink:0}
.prodq .psaldo{width:76px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px;font:inherit;font-size:14px;text-align:right;min-height:40px;color:var(--ink)}
.prodq .pu{font-size:12px;color:var(--mut);font-weight:700;min-width:24px}
.prodq .pdel{background:none;border:0;color:var(--lbl);font-size:17px;cursor:pointer;padding:2px}
.pcard{background:var(--card);border:1px solid var(--border);border-radius:var(--r-card);padding:12px 14px;margin-bottom:8px}
.pcard .prow{display:flex;align-items:center;gap:12px}
.pcard .prow .t{flex:1;min-width:0}
.pcard .prow .t b{display:block;font-size:13.5px;font-weight:700}
.pcard .prow .t span{display:block;font-size:11.5px;color:var(--mut)}
.pacts{display:flex;gap:6px;margin-top:8px;align-items:stretch}
.prodbtn{flex:0 0 auto;background:var(--okBg);color:var(--okFg);border:0;border-radius:10px;min-height:38px;padding:0 13px;font:inherit;font-weight:700;font-size:12.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.pacts .pdel{background:none;border:1px solid var(--border);border-radius:10px;color:var(--lbl);font-size:16px;cursor:pointer;padding:0 11px}
.pplink{width:100%;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:11px;font:inherit;font-size:14px;min-height:44px;color:var(--ink)}
.pcard .plink{flex:1;min-width:0;background:var(--card);border:1px dashed var(--border);border-radius:10px;padding:0 11px;min-height:38px;font:inherit;font-size:12px;font-weight:700;color:var(--mut);cursor:pointer;display:flex;align-items:center;gap:6px;overflow:hidden}
.pcard .plink span{white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.pcard .plink i{font-size:15px;color:var(--lbl);flex-shrink:0}
.pcard .plink.on{border-style:solid;border-color:var(--okFg);color:var(--okFg);background:var(--okBg)}
.pcard .plink.on i{color:var(--okFg)}
.pcard .prow .t.ptog{cursor:pointer}
.pstock{flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;min-width:64px;min-height:46px;background:var(--creme);border:1px solid var(--border);border-radius:12px;cursor:pointer;padding:4px 8px}
.pstock b{font-family:Fraunces,serif;font-weight:600;font-size:17px;color:var(--ink);line-height:1}
.pstock span{font-size:12px;color:var(--vinho);font-weight:800;text-transform:uppercase;letter-spacing:.03em;margin-top:3px}
.pstock.on{background:var(--okBg);border-color:var(--okFg)}
.pstock.on b{color:var(--okFg)}
.nrow{display:flex;gap:6px;margin-bottom:7px;align-items:center}
.nrow .nrn{flex:1;min-width:0;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px;font:inherit;font-size:14px;min-height:42px}
.nrow .nrq{width:64px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px;font:inherit;font-size:14px;text-align:right;min-height:42px}
.nrow .nru{width:52px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px;font:inherit;font-size:14px;min-height:42px}
.nrow .nrx{flex-shrink:0;background:none;border:1px solid var(--border);border-radius:10px;color:var(--lbl);font-size:15px;cursor:pointer;padding:0 10px;min-height:42px}
#shBody textarea{width:100%;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px;font:inherit;font-size:15px;resize:vertical}
.ring.iedit{align-items:center}
.ring.iedit span{flex:1;min-width:0}
.ring.iedit .riq{width:92px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 8px;font:inherit;font-size:13.5px;text-align:right;min-height:34px;color:var(--ink)}
.ring.iedit b{min-width:32px;text-align:right;color:var(--sec)}
.chist{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;font:inherit;cursor:pointer;text-align:left}
.chist .t b{display:block;font-size:14px;font-weight:700;color:var(--ink)}
.chist .t span{display:block;font-size:12px;color:var(--mut)}
.chist i{color:var(--lbl);font-size:18px}
.cdet{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 13px;margin-bottom:7px}
.cdet .t{flex:1;min-width:0}
.cdet .t b{display:block;font-size:13.5px;font-weight:700}
.cdet .t span{display:block;font-size:11.5px;color:var(--mut)}
.cdet .cdif{flex-shrink:0;font-family:Fraunces,serif;font-weight:600;font-size:15px;color:var(--mut)}
.cdet .cdif.pos{color:#2C5AA0}
.cdet .cdif.neg{color:var(--urgFg)}
.imwarn{background:var(--urgBg);border:1px solid #E9A8A2;border-radius:12px;padding:10px 12px;margin:8px 0 4px}
.imwarn .imwt{font-size:12px;font-weight:700;color:var(--urgFg);margin-bottom:7px;display:flex;align-items:center;gap:6px}
.imwarn .imwuse{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 11px;margin-bottom:6px;font:inherit;font-size:13px;font-weight:600;color:var(--vinho);cursor:pointer}
.imwarn .imwuse:last-child{margin-bottom:0}
.imwarn .imwuse:active{background:var(--cremeDark)}
.sitem .srow{position:relative}
.sitem .iedt{flex-shrink:0;background:none;border:1px solid var(--border);border-radius:9px;color:var(--vinho);font-size:15px;cursor:pointer;padding:0 10px;min-height:34px;align-self:center}
.sitem .iedt:active{background:var(--cremeDark)}
.ecard{background:var(--card);border:1px solid var(--border);border-radius:var(--r-card);padding:12px 14px;margin-bottom:8px}
.ecard.done{opacity:.55}
.ecard .fh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.ecard .fh b{font-size:14px;font-weight:700}
.ecard .frow{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--sec);padding:2px 0}
.ecard .frow span{color:var(--mut)}
.ecard .pacts{margin-top:10px}
.fcard{background:var(--card);border:1px solid var(--border);border-radius:var(--r-card);padding:12px 14px;margin-bottom:8px;border-left:4px solid var(--border)}
.fcard.ok{border-left-color:var(--okFg)}
.fcard.pos{border-left-color:#2C5AA0}
.fcard.neg{border-left-color:var(--urgFg)}
.fcard .fh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.fcard .fh b{font-size:14px;font-weight:700}
.fcard .frow{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--sec);padding:3px 0}
.fcard .frow span{color:var(--mut)}
.fcard .frow.furo{border-top:1px solid var(--fio);margin-top:3px;padding-top:6px}
.fcard .frow.furo b{color:var(--ink)}
.stpill{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.03em;padding:3px 8px;border-radius:999px;white-space:nowrap}
.stpill.ok{background:var(--okBg);color:var(--okFg)}
.stpill.pend{background:var(--pendBg,#FBF0DD);color:var(--pendFg,#9A6B1E)}
.rendrow{display:flex;gap:8px}
.rendrow input[type=number]{flex:1;min-width:0}
.rendrow input[type=text]{width:88px;flex-shrink:0}
.etck{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--sec);font-weight:600;margin-top:4px;cursor:pointer}
.etck input{width:20px;height:20px;accent-color:var(--vinho)}
#shBody select{width:100%;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px;font:inherit;font-size:15px;min-height:46px;color:var(--ink)}
.vsearch{width:100%;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;font:inherit;font-size:16px;min-height:46px;margin-bottom:10px}
.vrow{display:flex;align-items:center;gap:10px;width:100%;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:7px;font:inherit;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;text-align:left}
.vrow.on{border-color:var(--okFg);background:var(--okBg);color:var(--okFg)}
.vrow i{font-size:17px;color:var(--lbl)}
.vrow.on i{color:var(--okFg)}
.sitem{margin-bottom:8px}
.sitem .srow{margin-bottom:0}
.srow-c{cursor:pointer}
.srow-c .t span i{color:var(--vinho);font-size:12px}
.usos{display:none}
.usos.on{display:block;background:var(--cremeDark);border-radius:12px;padding:10px 13px;margin:6px 0 0}
.ugrp{font-size:12px;color:var(--sec);line-height:1.5;margin:3px 0;overflow-wrap:anywhere}
.ugrp b{color:var(--ink);font-weight:700}
.uinfo{font-size:12px;color:var(--mut)}
.norec{display:inline-flex;align-items:center;gap:5px;margin-top:5px;font-size:11.5px;font-weight:700;color:var(--urgFg);background:var(--urgBg);border-radius:8px;padding:3px 9px}
.norec i{font-size:13px}
.btn2{display:flex;gap:8px;margin-bottom:12px}
.btn2 .btn{margin-bottom:0}
.citem{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.citem .ct{flex:1;min-width:0}
.citem .ct b{display:block;font-size:13.5px;font-weight:700}
.citem .ct span{display:block;font-size:11.5px;color:var(--mut)}
.citem .ccont{width:92px;background:var(--creme);border:1px solid var(--border);border-radius:10px;padding:8px 10px;font:inherit;font-size:14px;text-align:right;min-height:40px;color:var(--ink)}
.citem .cu{font-size:12px;color:var(--mut);font-weight:700;min-width:22px}
.ritem{margin-bottom:8px}
.ritem .srow{margin-bottom:0}
.ring{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--sec);padding:4px 0;border-bottom:1px solid var(--fio)}
.ring:last-child{border-bottom:0}
.ring b{color:var(--ink);font-weight:700;white-space:nowrap}

/* janela centralizada */
#sheetBg{position:fixed;inset:0;background:rgba(42,26,23,.42);z-index:200;opacity:0;pointer-events:none;transition:.2s}
#sheetBg.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:50%;top:50%;z-index:201;background:var(--creme);border-radius:18px;overflow:hidden;
  width:calc(100% - 28px);max-width:640px;max-height:86vh;display:flex;flex-direction:column;
  transform:translate(-50%,-46%);opacity:0;pointer-events:none;transition:.22s}
#sheet.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
.sh-head{display:flex;align-items:center;gap:10px;padding:16px 16px 10px;border-bottom:1px solid var(--fio)}
.sh-head h2{font-family:Fraunces,serif;font-weight:600;font-size:17px;color:var(--vinho);flex:1;line-height:1.15}
.sh-head .x{background:none;border:0;font-size:24px;color:var(--sec);cursor:pointer;padding:2px}
.sh-body{padding:14px 16px 6px;overflow-y:auto}
.sh-foot{padding:12px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--fio);background:var(--creme)}
.btn{width:100%;min-height:50px;background:var(--vinho);color:#fff;border:0;border-radius:var(--r-btn);font:inherit;font-weight:700;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:active{background:var(--vinhoH)}
.btn.sec{background:var(--card);color:var(--sec);border:1px solid var(--border)}
.btn[disabled]{opacity:.5;pointer-events:none}

/* modal criar insumo */
#insBg{position:fixed;inset:0;background:rgba(42,26,23,.5);z-index:210;opacity:0;pointer-events:none;transition:.2s}
#insBg.on{opacity:1;pointer-events:auto}
#insModal,#resModal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%);z-index:211;width:calc(100% - 32px);max-width:420px;
  background:var(--creme);border-radius:18px;opacity:0;pointer-events:none;transition:.2s;max-height:90vh;display:flex;flex-direction:column}
#insModal.on,#resModal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
#resBg{position:fixed;inset:0;background:rgba(42,26,23,.5);z-index:210;opacity:0;pointer-events:none;transition:.2s}
#resBg.on{opacity:1;pointer-events:auto}
.im-body textarea{width:100%;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:11px;font:inherit;font-size:14px;color:var(--ink);resize:vertical}
.im-head{display:flex;align-items:center;gap:10px;padding:16px 16px 10px;border-bottom:1px solid var(--fio)}
.im-head h3{flex:1;font-family:Fraunces,serif;font-weight:600;font-size:17px;color:var(--vinho)}
.im-head .x{background:none;border:0;font-size:22px;color:var(--sec);cursor:pointer}
.im-body{padding:10px 16px 4px;overflow-y:auto}
.iml{display:block;font-size:11px;color:var(--mut);font-weight:700;margin:11px 0 4px}
.im-body input,.im-body select{width:100%;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:11px;font:inherit;font-size:14px;min-height:44px;color:var(--ink)}
.unrow{display:flex;gap:6px}
.unrow button{flex:1;background:var(--card);border:1px solid var(--border);border-radius:10px;min-height:44px;font:inherit;font-weight:700;font-size:13px;color:var(--sec);cursor:pointer}
.unrow button.on{background:var(--vinho);color:#fff;border-color:var(--vinho)}
.imnote{background:var(--cremeDark);border-radius:10px;padding:9px 11px;font-size:11.5px;color:var(--sec);margin:12px 0 2px}
.im-foot{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--fio)}

.item{background:var(--card);border:1px solid var(--border);border-radius:var(--r-card);padding:12px;margin-bottom:10px}
.item.ign{opacity:.55}
.item .top{display:flex;justify-content:space-between;gap:10px;margin-bottom:9px}
.item .top b{font-size:13px;font-weight:700;line-height:1.25}
.item .top .q{font-size:12px;color:var(--mut);white-space:nowrap;flex-shrink:0;text-align:right}
.item select{width:100%;background:var(--creme);border:1px solid var(--border);border-radius:10px;padding:10px;font:inherit;font-size:13.5px;color:var(--ink);min-height:44px}
.item .l2{display:flex;gap:8px;margin-top:8px;align-items:center}
.item .l2 label{font-size:11px;color:var(--mut);font-weight:600}
.item .l2 input{width:64px;background:var(--creme);border:1px solid var(--border);border-radius:10px;padding:8px;font:inherit;font-size:13px;text-align:center;min-height:40px}
.item .l2 .ignbtn{margin-left:auto;background:none;border:1px solid var(--border);border-radius:10px;padding:8px 11px;font:inherit;font-size:12px;font-weight:700;color:var(--sec);cursor:pointer;min-height:40px}
.item .l2 .ignbtn.on{background:var(--urgBg);color:var(--urgFg);border-color:var(--urgBg)}
.item .auto{font-size:11px;color:var(--okFg);font-weight:700;margin-top:6px;display:none}
.item .auto.on{display:block}
.item.alerta{border-color:#EFD9AE;background:#FDF7EC}
.item .fchint{display:none;font-size:11.5px;color:var(--okFg);font-weight:600;margin-top:7px;line-height:1.35}
.item .fchint.on{display:block}
.item .fchint.warn{color:var(--pendFg)}
.item .entra{display:none;font-size:12px;color:var(--sec);margin-top:7px;background:var(--cremeDark);border-radius:9px;padding:7px 10px}
.item .entra.on{display:block}
.item .entra b{color:var(--ink);font-weight:700}
.item.falta{border-color:#E9A8A2;box-shadow:0 0 0 2px #FBEAE7}
.falta-banner{background:var(--urgBg);color:var(--urgFg);border:1px solid #E9A8A2;border-radius:12px;padding:11px 13px;font-size:12.5px;line-height:1.4;margin-bottom:12px}
.falta-banner b{font-weight:700}
.movbtn{min-height:40px;font-size:12.5px;margin-bottom:12px}
.movsel{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--cremeDark);border-radius:12px;padding:11px 12px;margin-bottom:12px}
.movsel span{font-size:12.5px;color:var(--sec);font-weight:600;flex-basis:100%}
.movsel button{flex:1;background:var(--vinho);color:#fff;border:0;border-radius:10px;min-height:42px;font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.movsel button.cancel{background:var(--card);color:var(--sec);border:1px solid var(--border)}
.item .l2 .unit{font-size:12px;color:var(--mut);font-weight:700}
.item .l3{display:flex;gap:8px;margin-top:8px}
.item .l3 button{flex:1;background:none;border:1px solid var(--border);border-radius:10px;padding:9px 6px;font:inherit;font-size:12px;font-weight:700;color:var(--sec);cursor:pointer;min-height:42px;display:flex;align-items:center;justify-content:center;gap:5px}
.item .l3 .usbtn.on{background:var(--pendBg);color:var(--pendFg);border-color:#EFD9AE}
.item .l3 .ignbtn.on{background:var(--urgBg);color:var(--urgFg);border-color:var(--urgBg)}

/* entrada manual */
.mf{margin-bottom:10px}
.mf label{display:block;font-size:11px;color:var(--mut);font-weight:600;margin-bottom:4px}
.mf input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:11px;font:inherit;font-size:14px;min-height:44px;color:var(--ink)}
.mline{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:10px;margin-bottom:8px}
.mline .mi{width:100%;background:var(--creme);border:1px solid var(--border);border-radius:10px;padding:10px;font:inherit;font-size:13.5px;min-height:44px;color:var(--ink)}
.mrow{display:flex;gap:8px;margin-top:8px}
.mrow .mq,.mrow .mc{flex:1;min-width:0;background:var(--creme);border:1px solid var(--border);border-radius:10px;padding:10px;font:inherit;font-size:13.5px;min-height:44px;text-align:center;color:var(--ink)}
.mrow .mdel{background:var(--urgBg);color:var(--urgFg);border:0;border-radius:10px;padding:0 12px;min-height:44px;cursor:pointer;font-size:16px;flex-shrink:0}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,140%);background:#2A1A17;color:#fff;padding:12px 18px;border-radius:12px;font-size:13px;font-weight:600;z-index:300;transition:.25s;max-width:88vw;text-align:center;box-shadow:0 8px 24px -8px rgba(0,0,0,.5)}
#toast.on{transform:translate(-50%,0)}
.spin{width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--vinho);border-radius:50%;animation:sp .8s linear infinite;margin:50px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;color:var(--mut);font-size:13px;padding:38px 10px}
.empty i{font-size:40px;color:var(--lbl);display:block;margin-bottom:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="back" id="btnBack" title="Voltar ao menu"><i class="ph-duotone ph-caret-left"></i></button>
    <div>
      <h1>Estoque da Central</h1>
      <div class="sub">Entrada das notas e saldo dos insumos</div>
    </div>
    <div class="spacer"></div>
    <button class="act" id="btnReload" title="Atualizar"><i class="ph-duotone ph-arrows-clockwise"></i></button>
  </header>

  <div class="tabs">
    <button id="tabEnt" class="on"><i class="ph-duotone ph-file-arrow-down"></i> Notas <span class="cnt" id="cntPend" style="display:none">0</span></button>
    <button id="tabSal"><i class="ph-duotone ph-stack"></i> Insumos</button>
    <button id="tabProd"><i class="ph-duotone ph-cooking-pot"></i> Produções</button>
    <button id="tabRec"><i class="ph-duotone ph-notebook"></i> Receitas</button>
    <button id="tabFech"><i class="ph-duotone ph-calculator"></i> Fechar mês</button>
    <button id="tabEnv"><i class="ph-duotone ph-paper-plane-tilt"></i> Pro CCMQ <span class="cnt" id="cntEnv" style="display:none">0</span></button>
    <button id="tabAl"><i class="ph-duotone ph-warning-circle"></i> Alertas <span class="cnt" id="cntAl" style="display:none">0</span></button>
  </div>

  <div id="app"><div class="spin"></div></div>
</div>

<div id="sheetBg"></div>
<div id="sheet">
  <div class="sh-head"><h2 id="shTitle">Nota</h2><button class="x" id="shX"><i class="ph-duotone ph-x"></i></button></div>
  <div class="sh-body" id="shBody"></div>
  <div class="sh-foot"><button class="btn" id="shSave"><i class="ph-duotone ph-check"></i> Dar entrada no estoque</button></div>
</div>
<div id="insBg"></div>
<div id="insModal">
  <div class="im-head"><h3>Novo insumo</h3><button class="x" id="imX"><i class="ph-duotone ph-x"></i></button></div>
  <div class="im-body">
    <label class="iml">Nome do insumo</label><input id="imNome" placeholder="ex.: Ervilha torta">
    <div id="imWarn"></div>
    <label class="iml">Categoria</label><select id="imCat"></select>
    <label class="iml">Unidade do estoque</label>
    <div class="unrow" id="imUn"></div>
    <label class="iml">Destino (de qual unidade é)</label>
    <div class="unrow" id="imDest"></div>
    <label class="iml">Custo por unidade (R$) — já puxado da nota</label><input id="imCusto" type="number" step="0.01" placeholder="0">
    <div id="imHort" style="display:none">
      <div class="imnote">Hortifruti que vem em maço/unidade: preencha pra o app converter e aplicar o FC sozinho nas próximas notas.</div>
      <label class="iml">Peso médio de 1 maço/unidade (g) — opcional</label><input id="imPeso" type="number" step="1" placeholder="ex.: 122">
      <label class="iml">Fator de correção FC (bruto ÷ líquido) — opcional</label><input id="imFC" type="number" step="0.01" placeholder="ex.: 2,34">
    </div>
  </div>
  <div class="im-foot"><button class="btn" id="imSave"><i class="ph-duotone ph-check"></i> Criar e usar</button></div>
</div>
<div id="resBg"></div>
<div id="resModal">
  <div class="im-head"><h3 id="resTitle">Alerta</h3><button class="x" id="resX"><i class="ph-duotone ph-x"></i></button></div>
  <div class="im-body">
    <div class="imnote">Por que esse item foi comprado se a gente não usa? (ex.: refeição do funcionário, teste de prato novo)</div>
    <label class="iml">Justificativa (obrigatória) *</label>
    <textarea id="resJust" rows="3" placeholder="escreva o motivo…"></textarea>
    <label class="iml" style="margin-top:14px">O que fazer com o item?</label>
  </div>
  <div class="im-foot">
    <button class="btn" id="resCentral" style="margin-bottom:8px"><i class="ph-duotone ph-stack"></i> Adicionar ao estoque da Central</button>
    <button class="btn sec" id="resCcmq"><i class="ph-duotone ph-arrow-right"></i> Enviar para o CCMQ (uso)</button>
  </div>
</div>
<div id="toast"></div>

<script src="../auth.js"></script>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const ST={notas:[], imp:new Set(), insumos:[], byId:{}, map:{}, movs:[], fc:{}, alertas:[], tab:'ent',
  busca:'', soComSaldo:false, verImport:false, comp:'all', nota:null, itens:[]};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2800);}
function brl(v){return (v==null||isNaN(v))?'—':(+v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
function num(v){return (+v||0).toLocaleString('pt-BR',{maximumFractionDigits:3});}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function norm(t){return (t||'').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();}
function fmtData(d){if(!d)return'';const[y,m,dd]=d.split('-');return `${dd}/${m}/${y}`;}
function mesDe(n){return (n.data_emissao||'').slice(0,7);}
function compLabel(c){if(!c)return'';const[y,m]=c.split('-');const M=['','Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];return `${M[+m]||m} ${y}`;}

async function api(path){ await lolaEnsure(); const r=await fetch(SB_URL+'/rest/v1/'+path,{headers:lolaHeaders()}); if(!r.ok)throw new Error(await r.text()); return r.json(); }
async function post(path, body, prefer){ await lolaEnsure(); const h=lolaHeaders(); h['Content-Type']='application/json'; if(prefer)h['Prefer']=prefer;
  const r=await fetch(SB_URL+'/rest/v1/'+path,{method:'POST',headers:h,body:JSON.stringify(body)}); if(!r.ok)throw new Error(await r.text());
  return r.status===204?null:r.json().catch(()=>null); }

async function carregar(){
  try{
    const [notas, imp, insumos, mapa, movs, fc, alertas, prod, receitas, saldo] = await Promise.all([
      api('financeiro_notas?unit=eq.central&select=chave,emitente,data_emissao,itens&order=data_emissao.desc'),
      api('lola_central_estoque_nota?select=nota_chave'),
      api('lola_insumos?ativo=neq.false&select=id,nome,categoria,unidade_custo,custo_por_unidade&order=categoria,nome'),
      api('lola_central_estoque_map?select=desc_norm,insumo_id,fator,ignorar'),
      api('lola_central_estoque_mov?select=insumo_id,qtd,custo_total'),
      api('lola_central_fc?select=insumo_norm,peso_medio_g,fc'),
      api('lola_central_alertas?motivo=eq.nao_usamos&select=id,nota_chave,desc_item,obs,justificativa,resolvido,criado_por,criado_em&order=criado_em.desc').catch(()=>[]),
      api('lola_central_prod?ativo=neq.false&select=id,nome,categoria,unidade,saldo,obs,preproducao_id&order=categoria,nome').catch(()=>[]),
      api('lola_preproducoes?ativo=neq.false&categoria=eq.central&select=id,nome,rendimento_qtd,rendimento_un,porcao_qtd,porcao_un&order=nome').catch(()=>null),
      api('lola_central_saldo?select=preproducao_id,saldo,unidade,saldo_data,atualizado_por,validade_dias').catch(()=>[])
    ]);
    ST.alertas=alertas||[];
    ST.prod=prod||[];
    if(receitas) ST.receitas=receitas;
    ST.saldo={}; (saldo||[]).forEach(s=>ST.saldo[s.preproducao_id]=s);
    try{ const uu=await api('rpc/central_insumos_usados'); ST.usados=new Set((uu||[]).map(x=>(x&&typeof x==='object')?Object.values(x)[0]:x)); }catch(e){ ST.usados=new Set(); }
    ST.notas=notas||[]; ST.imp=new Set((imp||[]).map(r=>r.nota_chave));
    ST.insumos=insumos||[]; ST.byId={}; ST.insumos.forEach(i=>ST.byId[i.id]=i);
    ST.map={}; (mapa||[]).forEach(m=>ST.map[m.desc_norm]={insumo_id:m.insumo_id,fator:+m.fator||1,ignorar:m.ignorar});
    ST.fc={}; (fc||[]).forEach(f=>ST.fc[f.insumo_norm]={peso_medio_g:f.peso_medio_g!=null?+f.peso_medio_g:null, fc:f.fc!=null?+f.fc:null});
    ST.movs=movs||[];
    buildInsumoOptions();
    render();
    carregarEnvios();
  }catch(e){ $('#app').innerHTML=`<div class="note" style="background:var(--urgBg);color:var(--urgFg)">Erro ao carregar: ${esc(e.message)}</div>`; }
}

const FOOD_CATS=new Set(['Insumos Alimentos','Hortifruti','Carnes e Pescados','Pães']);
const isFood=i=>i&&FOOD_CATS.has(i.categoria);
let OPTS_ALL='';
function buildInsumoOptions(){
  let cat='', h='';
  ST.insumos.filter(isFood).forEach(i=>{ if(i.categoria!==cat){ if(cat)h+='</optgroup>'; cat=i.categoria; h+=`<optgroup label="${esc(cat||'Sem categoria')}">`; }
    h+=`<option value="${i.id}">${esc(i.nome)}${i.unidade_custo?' ('+esc(i.unidade_custo)+')':''}</option>`; });
  if(cat)h+='</optgroup>'; OPTS_ALL=h;
}
// fator automático: converte a unidade da nota p/ a unidade do insumo e aplica o FC (fator de correção)
const CONT=new Set(['un','und','unid','unidade','maço','maco','pç','pc','peça','peca','pct','pacote','cx','caixa','mç','mc']);
function computeFator(it){
  const ins=ST.byId[it.insumo_id]; if(!ins) return {fator:it.fator||1, hint:''};
  const iu=(ins.unidade_custo||'').toLowerCase().trim();
  const nu=(it.un||'').toLowerCase().trim();
  const rec=ST.fc[norm(ins.nome)]||{}; const F=rec.fc||1; const peso=rec.peso_medio_g||null;
  const nf=n=>(+n).toLocaleString('pt-BR',{maximumFractionDigits:3});
  const cont=CONT.has(nu); let fator=null, hint='', warn=false;
  if(iu==='kg'){
    if(nu==='kg'){ fator=1/F; hint = F!==1 ? `Fator ${nf(1/F)}: FC ${nf(F)} — cada 1 kg comprado rende ${nf(1/F)} kg limpo` : `Fator 1: entra igual à nota (${nf(it.qtd)} kg), sem correção`; }
    else if(nu==='g'){ fator=(1/1000)/F; hint=`Fator ${nf(fator)}: ${nf(it.qtd)} g = ${nf(it.qtd/1000)} kg`+(F!==1?` · FC ${nf(F)}`:''); }
    else if(peso){ fator=(peso/1000)/F; hint=`Fator ${nf(fator)}: 1 ${it.un||'un'} pesa ~${peso} g`+(F!==1?` bruto → ${Math.round(peso/F)} g limpo (FC ${nf(F)})`:'')+` = ${nf(fator)} kg cada`; }
    else if(cont){ if(it.fator && it.fator!==1){ fator=it.fator; hint=`Fator ${nf(fator)}: 1 ${it.un} = ${nf(fator)} kg (peso que você informou)`; } else { fator=1; warn=true; hint=`Quanto pesa 1 "${it.un}"? Ponha esse peso no fator. Ex.: embalagem de 1,5 kg → ponha 1,5 (aí ${nf(it.qtd)} × 1,5 = ${nf(it.qtd*1.5)} kg).`; } }
  } else if(iu==='un'||iu==='und'){ if(cont){ fator=1; hint=`Fator 1: ${nf(it.qtd)} unidade(s), entra igual à nota`; } }
  else if(iu==='l'||iu==='ml'){
    if(nu==='l'||nu==='lt'){ fator=1; hint=`Fator 1: entra ${nf(it.qtd)} L igual à nota`; }
    else if(nu==='ml'){ fator=1/1000; hint=`Fator ${nf(1/1000)}: ${nf(it.qtd)} ml = ${nf(it.qtd/1000)} L`; }
    else if(cont){ if(it.fator && it.fator!==1){ fator=it.fator; hint=`Fator ${nf(fator)}: 1 ${it.un} = ${nf(fator)} L`; } else { fator=1; warn=true; hint=`Quantos litros tem 1 "${it.un}"? Ponha esse valor no fator. Ex.: 1 caixa de 1 L → ponha 1.`; } }
  } else if(iu==='g'){ if(nu==='g'){fator=1/F;hint=F!==1?`Fator ${nf(1/F)}: FC ${nf(F)}`:`Fator 1: entra igual à nota`;} else if(nu==='kg'){fator=1000/F;hint=`Fator ${nf(1000/F)}: ${nf(it.qtd)} kg = ${nf(it.qtd*1000)} g`;} }
  if(fator==null){ warn=true; return {fator: it.fator||1, hint:`Nota em "${it.un||'?'}", insumo em ${iu||'?'} — confira se precisa converter o fator.`, warn:true}; }
  return {fator: Math.round(fator*100000)/100000, hint, warn};
}

/* ============ RENDER ============ */
function render(){
  $('#tabEnt').classList.toggle('on',ST.tab==='ent');
  $('#tabSal').classList.toggle('on',ST.tab==='sal');
  $('#tabProd').classList.toggle('on',ST.tab==='prod');
  $('#tabRec').classList.toggle('on',ST.tab==='rec');
  $('#tabFech').classList.toggle('on',ST.tab==='fech');
  $('#tabEnv').classList.toggle('on',ST.tab==='env');
  $('#tabAl').classList.toggle('on',ST.tab==='al');
  const ne=(ST.envios&&ST.envios!=='loading')?ST.envios.filter(x=>!x.atendido).length:0; const ce=$('#cntEnv'); if(ne){ce.style.display='';ce.textContent=ne;}else ce.style.display='none';
  const pend=ST.notas.filter(n=>!ST.imp.has(n.chave)).length;
  const c=$('#cntPend'); if(pend){c.style.display='';c.textContent=pend;}else c.style.display='none';
  const na=(ST.alertas||[]).filter(x=>!x.resolvido).length; const ca=$('#cntAl'); if(na){ca.style.display='';ca.textContent=na;}else ca.style.display='none';
  const V={ent:viewEntrada, sal:viewSaldo, prod:viewProd, rec:viewReceitas, fech:viewFechar, env:viewEnvio, al:viewAlertas};
  const W={ent:wireEntrada, sal:wireSaldo, prod:wireProd, rec:wireReceitas, fech:wireFechar, env:wireEnvio, al:wireAlertas};
  $('#app').innerHTML = (V[ST.tab]||viewEntrada)();
  (W[ST.tab]||wireEntrada)();
}
function viewAlertas(){
  const all=ST.alertas||[]; const abertos=all.filter(x=>!x.resolvido), resolvidos=all.filter(x=>x.resolvido);
  const list=ST.verResolv?resolvidos:abertos;
  let h=`<div class="note">Itens marcados como <b>"não usamos / por que foi pedido?"</b> ao dar baixa nas notas — sinal de compra que talvez não devesse ter acontecido.</div>`;
  h+=`<div class="lbl">${ST.verResolv?'Resolvidos':'Não usamos'} (${list.length}) <span class="spacer"></span>
      <button class="chip ${ST.verResolv?'on':''}" id="chResolv">${ST.verResolv?'ver abertos':'ver resolvidos'}</button></div>`;
  if(!list.length){ h+=`<div class="empty"><i class="ph-duotone ph-check-circle"></i>${ST.verResolv?'Nenhum resolvido ainda.':'Nenhum alerta aberto.'}</div>`; return h; }
  list.forEach(x=>{ h+=`<div class="srow"><div class="t"><b>${esc(x.desc_item)}</b><span>${esc(x.obs||'')}${x.criado_por?' · '+esc(x.criado_por):''} · ${fmtData((x.criado_em||'').slice(0,10))}${x.justificativa?' · <i>“'+esc(x.justificativa)+'”</i>':''}</span></div>
    ${x.resolvido?'<span class="chip" style="opacity:.55">resolvido</span>':`<button class="chip resolv" data-id="${x.id}">resolver</button>`}</div>`; });
  return h;
}
function wireAlertas(){
  $('#chResolv')&&($('#chResolv').onclick=()=>{ST.verResolv=!ST.verResolv;render();});
  $$('.resolv').forEach(b=>b.onclick=()=>openResolver(b.dataset.id));
}
/* ===== PRODUÇÕES (estoque de produções prontas) ===== */
// converte g→kg e ml→L (só exibição; o banco fica em g/ml)
function conv(q, u){ q=+q||0; const uu=(u||'').toLowerCase().trim();
  if(uu==='g'||uu==='grama'||uu==='gramas') return {q:q/1000, u:'kg'};
  if(uu==='mg') return {q:q/1e6, u:'kg'};
  if(uu==='ml'||uu==='mililitro'||uu==='mililitros') return {q:q/1000, u:'L'};
  if(uu==='l'||uu==='litro'||uu==='litros') return {q:q, u:'L'};
  return {q:q, u:u||''}; }
function convUn(u){ return conv(1,u).u; }
function rendInfo(r){ // interpreta o rendimento da receita (já em kg/L)
  const rq=+r.rendimento_qtd||0, run=r.rendimento_un||'', pq=+r.porcao_qtd||0;
  if(pq>0 && rq>0){ const ps=conv(pq,run); return {ehPorcao:true, base:rq/pq, un:'porções', porcaoQtd:ps.q, totalRend:rq, rendUn:ps.u}; }
  const c=conv(rq,run); return {ehPorcao:false, base:c.q, un:c.u||'un', totalRend:c.q, rendUn:c.u};
}
function prodUn(r){ const s=(ST.saldo||{})[r.id]; if(s&&s.unidade) return s.unidade; const ri=rendInfo(r); return ri.ehPorcao?'un':convUn(r.rendimento_un||r.porcao_un||'un'); }
function viewProd(){
  const R=ST.receitas;
  let h=`<div class="note">Estoque das <b>produções da Central</b> — é a mesma lista das receitas. Diga quanto tem de cada uma (com data) e toque em <b>Produzir</b> quando fizer mais. Toque no nome pra ver os ingredientes.</div>`;
  h+=`<button class="btn" id="btnNovaProd" style="margin-bottom:10px"><i class="ph-duotone ph-plus-circle"></i> Adicionar nova produção</button>`;

async function salvarContagem(){
  const data=$('#contData').value||new Date().toISOString().slice(0,10);

    itens.push({ref_id:it.ref_id, nome:it.nome, unidade:it.unidade, qtd_sistema:it.sistema, qtd_contada:+v||0}); });
  if(!itens.length){ toast('Preencha ao menos um item contado.'); return; }
  $('#shSave').setAttribute('disabled','');
  try{ const _s=lolaSession()||{}; const quem=_s.nome||_s.email||'portal';
    const rows=await post('lola_central_contagem',[{tipo:CONT_TIPO, data, criado_por:quem}],'return=representation');

      ST.saldo=ST.saldo||{}; itens.forEach(i=>{ ST.saldo[i.ref_id]={preproducao_id:i.ref_id, saldo:i.qtd_contada, unidade:i.unidade, saldo_data:data, atualizado_por:quem}; });
    }
    toast('Contagem salva ✓ ('+itens.length+' itens, '+fmtData(data)+')'); closeSheet(); render();

function viewFechar(){
  const uni=ST.fechUni||'todas';

     <button class="chip ${uni==='todas'?'on':''}" data-u="todas">Todas</button>

  const d=ST.fechData;
  if(d==='loading'||!d){ h+=`<div class="spin"></div>`; return h; }

  const totMand=d.reduce((s,x)=>s+(+x.valor||0),0);
  let totFuroV=0, comProd=0;
  const cards=d.map(x=>{
    const mand=+x.qtd_mandado||0, prod=+x.produzido||0, valor=+x.valor||0;
    const preco=mand>0?valor/mand:0, temProd=prod>0;
    const cm=conv(mand,x.unidade), cp=conv(prod,x.unidade);
    const furoQ=prod-mand, cf=conv(furoQ,x.unidade), furoV=furoQ*preco, furoPct=prod>0?furoQ/prod*100:0;
    if(temProd){ totFuroV+=furoV; comProd++; }
    const cls=!temProd?'':(Math.abs(furoQ)<1e-6?'ok':furoQ<0?'neg':'pos');
    return `<div class="fcard ${cls}">
      <div class="fh"><b>${esc(x.nome)}</b>${!temProd?'<span class="stpill pend">sem produção</span>':(furoQ<0?'<span class="stpill pend">mandou&nbsp;+</span>':'<span class="stpill ok">ok</span>')}</div>
      <div class="frow"><span>Mandado</span><b>${num(cm.q)} ${esc(cm.u)} · ${brl(valor)}</b></div>
      <div class="frow"><span>Produzido</span><b>${temProd?num(cp.q)+' '+esc(cp.u):'—'}</b></div>
      ${temProd?`<div class="frow furo"><span>Furo</span><b>${cf.q>0?'+':''}${num(cf.q)} ${esc(cf.u)} · ${brl(furoV)} · ${num(furoPct)}%</b></div>`:''}

  h+=`<div class="tot"><div class="k">Mandado no mês${uni!=='todas'?' · '+uni.toUpperCase():''}</div><div class="big">${brl(totMand)}</div><div class="s">${d.length} produções · ${comProd} com produção lançada</div></div>`;
  h+=cards;
  return h;
}

let CRIAR_IT=null, IM_UN='kg', IM_DEST=new Set(), IM_CONFIRM=false;
function similarInsumos(nome){
  const n=norm(nome); if(!n) return [];
  const tk=s=>new Set(norm(s).split(' ').filter(w=>w.length>2));
  const A=tk(nome), a0=[...A][0]; const out=[];
  (ST.insumos||[]).forEach(x=>{ if(x.ativo===false) return; const xn=norm(x.nome); if(xn===n) return;
    let sc=0; if(xn.includes(n)||n.includes(xn)) sc=0.85;
    const B=tk(x.nome); if(A.size&&B.size){ let inter=0; A.forEach(w=>{ if(B.has(w))inter++; }); const uni=new Set([...A,...B]).size; sc=Math.max(sc, inter/uni);
      const b0=[...B][0]; if(a0&&a0===b0) sc=Math.max(sc,0.55); }
    if(sc>=0.5) out.push({nome:x.nome,id:x.id,cat:x.categoria,sc}); });
  out.sort((a,b)=>b.sc-a.sc); return out.slice(0,5);
}
function renderImWarn(){
  const box=$('#imWarn'); if(!box) return 0;
  const sims=similarInsumos(($('#imNome').value||'').trim());
  if(!sims.length){ box.innerHTML=''; return 0; }
  box.innerHTML=`<div class="imwarn"><div class="imwt"><i class="ph-duotone ph-warning-circle"></i> Já tem parecido cadastrado — confira antes de criar:</div>${sims.map(s=>`<button class="imwuse" data-id="${s.id}">usar «${esc(s.nome)}»${s.cat?' · '+esc(s.cat):''}</button>`).join('')}</div>`;
  $$('#imWarn .imwuse').forEach(b=>b.onclick=()=>usarInsumoExistente(b.dataset.id));
  return sims.length;
}
function usarInsumoExistente(id){
  const existente=ST.byId[id]; if(!existente) return;
  const it=CRIAR_IT, el=it&&$(`#shBody .item[data-ix="${it.ix}"]`);
  if(el){ const sel=el.querySelector('.selins');
    if(![...sel.options].some(o=>o.value===existente.id)){ buildInsumoOptions(); sel.innerHTML=`<option value="">— escolher insumo —</option><option value="__novo">+ criar novo insumo…</option><optgroup label="Sugestões" class="sugg"></optgroup>${OPTS_ALL}`; }
    it.insumo_id=existente.id; sel.value=existente.id; it.auto=false; el.querySelector('.auto').classList.remove('on'); refreshFator(el,it); }
  closeIns(); toast(`Usando "${existente.nome}".`);
}
function toggleHort(){ $('#imHort').style.display = ($('#imCat').value==='Hortifruti')?'block':'none'; }
function closeIns(){ $('#insBg').classList.remove('on'); $('#insModal').classList.remove('on'); }
function openCriarInsumo(it){
  CRIAR_IT=it;
  $('#imNome').value = (it.desc||'').replace(/\s*[\d.,]+\s*(g|kg|ml|l|un|dz)\b.*$/i,'').trim() || (it.desc||'');
  $('#imCat').innerHTML=[...FOOD_CATS].map(c=>`<option>${c}</option>`).join('');
  IM_UN='kg';
  $('#imUn').innerHTML=['kg','un','L','g'].map(u=>`<button data-u="${u}" class="${u==='kg'?'on':''}">${u}</button>`).join('');
  $$('#imUn button').forEach(b=>b.onclick=()=>{ IM_UN=b.dataset.u; $$('#imUn button').forEach(x=>x.classList.toggle('on',x===b)); });
  IM_DEST=new Set(['central']);
  $('#imDest').innerHTML=[['ccmq','CCMQ'],['mac','MAC'],['central','Central']].map(([v,l])=>`<button data-d="${v}" class="${IM_DEST.has(v)?'on':''}">${l}</button>`).join('');
  $$('#imDest button').forEach(b=>b.onclick=()=>{ const v=b.dataset.d; if(IM_DEST.has(v))IM_DEST.delete(v); else IM_DEST.add(v); b.classList.toggle('on',IM_DEST.has(v)); });
  const cu = it.qtd ? it.vtotal/it.qtd : (it.vunit||0);
  $('#imCusto').value = cu ? (Math.round(cu*100)/100) : ''; $('#imPeso').value=''; $('#imFC').value='';
  $('#imCat').onchange=toggleHort; toggleHort();
  $('#imSave').removeAttribute('disabled'); $('#imSave').innerHTML='<i class="ph-duotone ph-check"></i> Criar e usar';
  IM_CONFIRM=false;
  $('#imNome').oninput=()=>{ IM_CONFIRM=false; $('#imSave').innerHTML='<i class="ph-duotone ph-check"></i> Criar e usar'; renderImWarn(); };
  renderImWarn();
  $('#insBg').classList.add('on'); $('#insModal').classList.add('on');
  setTimeout(()=>$('#imNome').focus(),60);
}
async function salvarInsumo(){
  const nome=$('#imNome').value.trim(); if(!nome){ toast('Dê um nome ao insumo.'); return; }
  // evita duplicado: se já existe um insumo com esse mesmo nome, usa o que já tem
  const nn=norm(nome);
  const existente=ST.insumos.find(x=>x.ativo!==false && norm(x.nome)===nn);
  if(existente){
    const it=CRIAR_IT, el=it&&$(`#shBody .item[data-ix="${it.ix}"]`);
    if(el){ const sel=el.querySelector('.selins');
      if(![...sel.options].some(o=>o.value===existente.id)){ buildInsumoOptions();
        sel.innerHTML=`<option value="">— escolher insumo —</option><option value="__novo">+ criar novo insumo…</option><optgroup label="Sugestões" class="sugg"></optgroup>${OPTS_ALL}`; }
      it.insumo_id=existente.id; sel.value=existente.id; it.auto=false; el.querySelector('.auto').classList.remove('on'); refreshFator(el,it); }
    closeIns(); toast(`"${existente.nome}" já existe — usei o cadastro que já tinha.`);
    return;
  }
  // aviso de PARECIDOS: bloqueia uma vez pra conferir
  const sims=similarInsumos(nome);
  if(sims.length && !IM_CONFIRM){ IM_CONFIRM=true; renderImWarn(); $('#imSave').innerHTML='<i class="ph-duotone ph-warning-circle"></i> Criar assim mesmo'; toast('Tem insumo parecido — confira ou confirme.'); return; }
  const cat=$('#imCat').value, un=IM_UN, custo=+$('#imCusto').value||0;
  $('#imSave').setAttribute('disabled','');
  try{
    const rows=await post('lola_insumos', [{nome, categoria:cat, unidade_compra:un, unidade_custo:un, custo_por_unidade:custo, ativo:true, destinos:[...IM_DEST]}], 'return=representation');
    const row=Array.isArray(rows)?rows[0]:null; if(!row) throw new Error('sem retorno do banco');
    ST.insumos.push(row); ST.byId[row.id]=row;
    const peso=+$('#imPeso').value||null, fc=+$('#imFC').value||null;
    if(cat==='Hortifruti' && (peso||fc)){
      await post('lola_central_fc?on_conflict=insumo_norm', [{insumo_norm:norm(nome), insumo_nome:nome, peso_medio_g:peso, fc:fc}], 'resolution=merge-duplicates,return=minimal');
      ST.fc[norm(nome)]={peso_medio_g:peso, fc:fc};
    }
    buildInsumoOptions();
    const it=CRIAR_IT, el=it&&$(`#shBody .item[data-ix="${it.ix}"]`);
    if(el){ const sel=el.querySelector('.selins');
      sel.innerHTML=`<option value="">— escolher insumo —</option><option value="__novo">+ criar novo insumo…</option><optgroup label="Sugestões" class="sugg"></optgroup>${OPTS_ALL}`;
      it.insumo_id=row.id; sel.value=row.id; it.auto=false; el.querySelector('.auto').classList.remove('on'); refreshFator(el,it);
    }
    $('#imSave').removeAttribute('disabled'); closeIns(); toast('Insumo criado ✓');
  }catch(e){ toast('Erro ao criar: '+e.message); $('#imSave').removeAttribute('disabled'); }
}

async function sugerir(it){
  try{ let r=await post('rpc/central_sugere_insumo',{txt:it.desc});
    if(!Array.isArray(r))return;
    r=r.filter(x=>FOOD_CATS.has(x.categoria)); if(!r.length)return;
    const el=$(`#shBody .item[data-ix="${it.ix}"]`); if(!el)return;
    const og=el.querySelector('optgroup.sugg'); if(!og)return;
    og.innerHTML=r.map(x=>`<option value="${x.id}">${esc(x.nome)}${x.unidade_custo?' ('+esc(x.unidade_custo)+')':''}</option>`).join('');
    const best=r[0];
    if(best && (best.sim||0)>=0.6 && !it.insumo_id){ it.insumo_id=best.id; el.querySelector('.selins').value=best.id; refreshFator(el,it); }
  }catch(e){}
}

async function salvarEntrada(){
  const nota=ST.nota; if(!nota)return;
  const usar=ST.itens.filter(i=>!i.ignorar && !i.naousamos);
  const alertas=ST.itens.filter(i=>i.naousamos);
  const semins=usar.filter(i=>!i.insumo_id);
  const oldB=$('#shFalta'); if(oldB) oldB.remove();
  $$('#shBody .item').forEach(el=>el.classList.remove('falta'));
  if(semins.length){
    semins.forEach(i=>{ const el=$(`#shBody .item[data-ix="${i.ix}"]`); if(el) el.classList.add('falta'); });
    const b=document.createElement('div'); b.id='shFalta'; b.className='falta-banner';
    b.innerHTML=`<b>Falta escolher o insumo de ${semins.length} ${semins.length===1?'item':'itens'}:</b> ${semins.map(i=>esc(i.desc)).join(' · ')}.<br>Escolha o insumo (ou "+ criar novo insumo"), ou marque "não é insumo" / "não usamos".`;
    $('#shBody').prepend(b); $('#shBody').scrollTop=0;
    return;
  }
  const ignorados=ST.itens.filter(i=>i.ignorar);
  if(!usar.length && !alertas.length && !ignorados.length){ toast('Diga o que fazer com os itens: escolha o insumo, ou marque "não é insumo" / "não usamos".'); return; }
  $('#shSave').setAttribute('disabled','');
  try{
    const jaImp=ST.imp.has(nota.chave);
    if(jaImp){ await lolaEnsure(); const h=lolaHeaders();
      await fetch(SB_URL+'/rest/v1/lola_central_estoque_mov?origem_tipo=eq.nota&origem_ref=eq.'+encodeURIComponent(nota.chave),{method:'DELETE',headers:h}); }
    const _s=lolaSession()||{}; const quem=_s.nome||_s.email||'portal';
    if(usar.length){
      const movs=usar.map(i=>{ const q=i.qtd*(i.fator||1); const cu=q? i.vtotal/q : i.vunit;
        return { insumo_id:i.insumo_id, tipo:'entrada', qtd:q, unidade:(ST.byId[i.insumo_id]||{}).unidade_custo||i.un,
          custo_unit:cu, custo_total:i.vtotal, origem_tipo:'nota', origem_ref:nota.chave, data:nota.data_emissao, obs:i.desc, criado_por:quem }; });
      await post('lola_central_estoque_mov', movs, 'return=minimal');
    }
    // alertas "não usamos — por que foi pedido?"
    if(alertas.length){
      const arows=alertas.map(i=>({ nota_chave:nota.chave, desc_item:i.desc, insumo_id:i.insumo_id||null,
        motivo:'nao_usamos', obs:(nota.emitente||'')+' · '+brl(i.vtotal), criado_por:quem }));
      await post('lola_central_alertas', arows, 'return=minimal');
    }
    // memoriza o mapeamento (só dos que viraram estoque ou 'não é insumo')
    const seen={}; const maprows=[];
    ST.itens.filter(i=>!i.naousamos).forEach(i=>{ if(seen[i.dn])return; seen[i.dn]=1;
      maprows.push({ desc_norm:i.dn, desc_orig:i.desc, insumo_id:i.ignorar?null:i.insumo_id, fator:i.fator||1, ignorar:i.ignorar, criado_por:quem, updated_at:new Date().toISOString() }); });
    if(maprows.length) await post('lola_central_estoque_map?on_conflict=desc_norm', maprows, 'resolution=merge-duplicates,return=minimal');
    await post('lola_central_estoque_nota?on_conflict=nota_chave',
      {nota_chave:nota.chave, itens_total:ST.itens.length, itens_ok:usar.length, importada_em:new Date().toISOString(), por:quem},
      'resolution=merge-duplicates,return=minimal');
    toast(usar.length ? (alertas.length? `Entrada lançada · ${alertas.length} alerta(s) ⚠` : 'Entrada lançada no estoque ✓')
                      : (alertas.length? `Nota concluída · ${alertas.length} alerta(s) ⚠` : 'Nota concluída (nada foi pro estoque) ✓'));
    closeSheet(); await carregar();
  }catch(e){ toast('Erro ao salvar: '+e.message); $('#shSave').removeAttribute('disabled'); }
}

/* ============ ENTRADA MANUAL (sem nota fiscal) ============ */
function abrirManual(){
  const hoje=new Date().toISOString().slice(0,10);
  $('#shTitle').textContent='Entrada manual';
  $('#shBody').innerHTML=`
    <div class="note">Pra compras <b>sem nota fiscal</b> (feira, açougue) ou ajustes de estoque. Escolha o insumo, a quantidade e quanto pagou no total.</div>
    <div class="mf"><label>Data</label><input type="date" id="mData" value="${hoje}"></div>
    <div class="mf"><label>Fornecedor / observação (opcional)</label><input type="text" id="mForn" placeholder="ex.: Feira do produtor"></div>
    <div class="lbl" style="margin:16px 0 8px">Itens</div>
    <div id="mLines"></div>
    <button class="btn sec" id="mAdd" style="margin-top:2px"><i class="ph-duotone ph-plus"></i> adicionar item</button>`;
  $('#shSave').innerHTML='<i class="ph-duotone ph-check"></i> Lançar no estoque';
  onSave=salvarManual;
  $('#mAdd').onclick=()=>addManualLine();
  addManualLine();
  openSheet();
}
function addManualLine(){
  const d=document.createElement('div'); d.className='mline';
  d.innerHTML=`<select class="mi"><option value="">— escolher insumo —</option>${OPTS_ALL}</select>
    <div class="mrow"><input type="number" class="mq" step="0.001" placeholder="qtd">
      <input type="number" class="mc" step="0.01" placeholder="R$ total">
      <button class="mdel" title="remover"><i class="ph-duotone ph-trash"></i></button></div>`;
  $('#mLines').appendChild(d);
  d.querySelector('.mdel').onclick=()=>{ d.remove(); if(!$$('#mLines .mline').length) addManualLine(); };
}
async function salvarManual(){
  const data=$('#mData').value||new Date().toISOString().slice(0,10);
  const forn=($('#mForn').value||'').trim();
  const lines=$$('#mLines .mline').map(el=>({
    insumo_id:el.querySelector('.mi').value,
    qtd:+el.querySelector('.mq').value||0,
    custo:+el.querySelector('.mc').value||0
  })).filter(l=>l.insumo_id && l.qtd>0);
  if(!lines.length){ toast('Escolha ao menos um insumo com quantidade.'); return; }
  $('#shSave').setAttribute('disabled','');
  try{
    const _s=lolaSession()||{}; const quem=_s.nome||_s.email||'portal';
    const ref='manual:'+Date.now();
    const movs=lines.map(l=>({ insumo_id:l.insumo_id, tipo:'entrada', qtd:l.qtd,
      unidade:(ST.byId[l.insumo_id]||{}).unidade_custo||'', custo_unit:l.qtd?l.custo/l.qtd:l.custo,
      custo_total:l.custo, origem_tipo:'manual', origem_ref:ref, data, obs:forn||'entrada manual', criado_por:quem }));
    await post('lola_central_estoque_mov', movs, 'return=minimal');
    toast('Entrada manual lançada ✓'); closeSheet(); await carregar();
  }catch(e){ toast('Erro ao salvar: '+e.message); $('#shSave').removeAttribute('disabled'); }
}

function openSheet(){ $('#sheetBg').classList.add('on'); $('#sheet').classList.add('on'); }
function closeSheet(){ $('#sheetBg').classList.remove('on'); $('#sheet').classList.remove('on'); const f=$('.sh-foot'); if(f) f.style.display=''; }

$('#resX').onclick=closeRes; $('#resBg').onclick=closeRes; $('#resCentral').onclick=()=>resSalvar('central'); $('#resCcmq').onclick=()=>resSalvar('ccmq');

(async()=>{ await lolaGate({papeis:['admin','financeiro','gerente','operacional'], titulo:'Estoque da Central'}); carregar(); })();
