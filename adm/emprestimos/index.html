<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lola · Empréstimos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/duotone/style.css">
<style>
:root{
  --creme:#FBF7F1; --card:#FFFFFF; --border:#ECE3D9; --fio:#EFE6DC; --cremeDark:#F7EFE6;
  --vinho:#A82A2A; --vinhoH:#7E1E1F;
  --ink:#2A1A17; --sec:#5A463E; --mut:#8A7A72; --lbl:#B79A8E;
  --ok:#2C7A4B; --okBg:#E6F3EA; --ruim:#B5302E;
  --r-btn:13px; --r-card:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden}
body{background:var(--creme);color:var(--ink);font-family:'Manrope',system-ui,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:920px;margin:0 auto;padding:0 16px 96px}

.apphead{display:flex;align-items:center;gap:10px;padding:16px 0 14px;border-bottom:1px solid var(--fio)}
.apphead .back{font-size:20px;color:var(--sec);text-decoration:none;display:flex;background:none;border:0;cursor:pointer}
.apphead h1{font-family:Fraunces,serif;font-weight:600;font-size:19px;color:var(--vinho);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.apphead .quem{margin-left:auto;font-size:11px;font-weight:600;color:var(--mut);white-space:nowrap}

.abas{display:flex;gap:8px;margin:14px 0 4px}
.aba{flex:1;text-align:center;padding:10px 0;border-radius:10px;font-size:13px;font-weight:600;color:var(--sec);background:#fff;border:1px solid var(--border);cursor:pointer;font-family:inherit}
.aba.on{background:var(--vinho);color:#fff;border-color:var(--vinho);font-weight:700}
@media(min-width:900px){ .abas{max-width:420px} }

.centro{text-align:center;margin-top:22px}
.big{font-family:Fraunces,serif;font-weight:600;font-size:40px;color:var(--ink);letter-spacing:-.01em;margin-top:4px}
.big.zero{color:var(--ok)}
.big small{font-size:18px;color:var(--mut);font-family:'Manrope',sans-serif;font-weight:400}
.big-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--lbl);font-weight:600;margin-top:4px}

.lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--lbl);font-weight:600;margin:30px 0 8px}

/* lista de pessoas */
.plist{border-top:1px solid var(--fio)}
.prow{display:flex;align-items:center;gap:12px;padding:14px 2px;border-bottom:1px solid var(--fio);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;font-family:inherit;text-align:left}
.prow:active{background:var(--cremeDark)}
.prow .av{width:38px;height:38px;border-radius:50%;background:var(--cremeDark);color:var(--vinho);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;font-family:Fraunces,serif}
.prow .t{flex:1;min-width:0}
.prow .t b{display:block;font-size:14.5px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .t span{display:block;font-size:12px;color:var(--mut);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .sal{text-align:right;flex-shrink:0}
.prow .sal .v{display:block;font-family:Fraunces,serif;font-weight:600;font-size:16px;color:var(--vinho);white-space:nowrap}
.prow.quit .sal .v{color:var(--ok);font-size:13px}
.prow.quit .av{color:var(--ok)}
.prow .sal .c{display:block;font-size:10px;color:var(--lbl);text-transform:uppercase;letter-spacing:.05em;margin-top:1px}

.sec-tot{display:flex;justify-content:space-between;align-items:baseline;padding:12px 2px;font-size:12.5px;color:var(--sec)}
.sec-tot b{color:var(--ink);font-weight:700}
.vazio{padding:40px 8px;text-align:center;color:var(--mut);font-size:13px}

/* detalhe da pessoa */
.det-resumo{display:flex;margin:18px auto 0;border-top:1px solid var(--fio);max-width:420px}
.det-kpi{flex:1;padding:12px 4px 0;text-align:center}
.det-kpi + .det-kpi{border-left:1px solid var(--fio)}
.det-kpi .v{font-family:Fraunces,serif;font-weight:600;font-size:17px}
.det-kpi .l{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--lbl);font-weight:600;margin-top:2px}

.ext{border-top:1px solid var(--fio);margin-top:6px}
.ext-row{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--fio);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;font-family:inherit;text-align:left}
.ext-row:active{background:var(--cremeDark)}
.ext-row .ic{width:30px;height:30px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px}
.ext-row .ic.emp{background:#FBEAE7;color:var(--ruim)}
.ext-row .ic.amo{background:var(--okBg);color:var(--ok)}
.ext-row .m{flex:1;min-width:0}
.ext-row .m b{font-size:13.5px;font-weight:700;color:var(--ink)}
.ext-row .m span{display:block;font-size:11.5px;color:var(--mut);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ext-row .r{text-align:right;flex-shrink:0}
.ext-row .r .v{display:block;font-family:Fraunces,serif;font-weight:600;font-size:14.5px;white-space:nowrap}
.ext-row .r .v.emp{color:var(--ruim)} .ext-row .r .v.amo{color:var(--ok)}
.ext-row .r .s{display:block;font-size:10.5px;color:var(--lbl);white-space:nowrap;margin-top:1px}

/* CTA fixo embaixo */
.cta-fix{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--creme) 72%,transparent);z-index:20}
.cta{display:block;width:100%;max-width:888px;margin:0 auto;background:var(--vinho);color:#fff;border:none;border-radius:var(--r-btn);min-height:50px;font-size:14.5px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 4px 14px rgba(168,42,42,.22)}
.cta:active{background:var(--vinhoH)}
.cta i{vertical-align:-2px;margin-right:6px}

/* folhas */
.sheet-bg{position:fixed;inset:0;background:rgba(42,26,23,.35);display:none;z-index:50}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:18px 18px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;display:none;z-index:51;max-height:92vh;overflow-y:auto}
.sheet h3{font-family:Fraunces,serif;font-weight:600;font-size:18px;color:var(--vinho);margin-bottom:4px}
.sheet p.sub{font-size:12.5px;color:var(--sec);margin-bottom:16px}
.field{margin-bottom:14px}
.field > label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--lbl);font-weight:600;margin-bottom:6px}
.field input, .field textarea{width:100%;border:1px solid var(--border);border-radius:var(--r-btn);min-height:48px;padding:12px 14px;font-size:16px;font-family:inherit;color:var(--ink);background:var(--creme)}
.field input.val{font-family:Fraunces,serif;font-weight:600;font-size:20px}
.field textarea{min-height:64px;resize:vertical}
.tipo-pills{display:flex;gap:10px}
.tipo-pills button{flex:1;min-height:48px;border-radius:var(--r-btn);border:1px solid var(--border);background:#fff;color:var(--sec);font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px}
.tipo-pills button i{font-size:17px}
.tipo-pills button.on.emp{background:#FBEAE7;border-color:var(--ruim);color:var(--ruim);font-weight:700}
.tipo-pills button.on.amo{background:var(--okBg);border-color:var(--ok);color:var(--ok);font-weight:700}
.acts{display:flex;gap:10px;margin-top:8px}
.acts button{flex:1;min-height:48px;border-radius:var(--r-btn);font-size:14.5px;font-weight:600;font-family:inherit;border:1px solid var(--border);background:#fff;color:var(--sec);cursor:pointer}
.acts button.ok{background:var(--vinho);color:#fff;border:none;font-weight:700}
.acts button.ok:disabled{opacity:.55}
.acts button.perigo{background:var(--ruim);color:#fff;border:none;font-weight:700}
.serr{color:var(--ruim);font-size:12.5px;font-weight:600;min-height:18px;margin-top:4px}

/* picker de pessoa */
.pick-list{max-height:46vh;overflow-y:auto;border:1px solid var(--border);border-radius:var(--r-btn);margin-top:4px}
.pick-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--fio);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;font-family:inherit;text-align:left}
.pick-item:last-child{border-bottom:0}
.pick-item:active{background:var(--cremeDark)}
.pick-item .t b{font-size:14px;font-weight:700;color:var(--ink)}
.pick-item .t span{display:block;font-size:11.5px;color:var(--mut)}
.pick-item.novo b{color:var(--vinho)}
.pick-sel{display:flex;align-items:center;gap:10px;background:var(--cremeDark);border:1px solid var(--border);border-radius:var(--r-btn);padding:12px 14px}
.pick-sel .t{flex:1;min-width:0}
.pick-sel .t b{font-size:14.5px;font-weight:700}
.pick-sel .t span{display:block;font-size:11.5px;color:var(--mut)}
.pick-sel button{background:none;border:0;color:var(--vinho);font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer}

.carregando{padding:70px 0;text-align:center;color:var(--mut);font-size:13px}
.erro{padding:40px 16px;text-align:center;color:var(--ruim);font-size:13px;font-weight:600}
.who{font-size:10.5px;color:var(--lbl);margin-top:10px;text-align:center}
</style>
</head>
<body>

<div class="wrap">
  <div class="apphead">
    <button class="back" id="btBack" title="Voltar"><i class="ph-duotone ph-caret-left"></i></button>
    <h1 id="titulo">Empréstimos</h1>
    <span class="quem" id="quem"></span>
  </div>
  <div id="conteudo"><div class="carregando">Carregando os empréstimos…</div></div>
</div>

<div class="cta-fix" id="ctaFix" style="display:none">
  <button class="cta" id="btNovo"><i class="ph-duotone ph-plus-circle"></i>Registrar lançamento</button>
</div>

<!-- folha: novo lançamento -->
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheetNovo">
  <h3 id="novoTit">Novo lançamento</h3>
  <p class="sub" id="novoSub">Empréstimo dado ou abatimento no salário.</p>

  <div class="field" id="fPessoa">
    <label>Funcionário</label>
    <div id="pessoaSlot"></div>
  </div>

  <div class="field">
    <label>Tipo</label>
    <div class="tipo-pills">
      <button type="button" id="tpEmp" class="emp" onclick="setTipo('emprestimo')"><i class="ph-duotone ph-arrow-up-right"></i> Empréstimo</button>
      <button type="button" id="tpAmo" class="amo" onclick="setTipo('amortizacao')"><i class="ph-duotone ph-arrow-down-left"></i> Abatimento</button>
    </div>
  </div>

  <div class="field">
    <label>Valor (R$)</label>
    <input class="val" type="number" id="fValor" inputmode="decimal" step="0.01" min="0" placeholder="0,00">
  </div>
  <div class="field">
    <label>Data</label>
    <input type="date" id="fData">
  </div>
  <div class="field">
    <label>Observação (opcional)</label>
    <textarea id="fObs" placeholder="Ex.: descontar 100 por semana"></textarea>
  </div>

  <div class="serr" id="novoErr"></div>
  <div class="acts">
    <button type="button" onclick="fecharSheets()">Cancelar</button>
    <button type="button" class="ok" id="btSalvar" onclick="salvarLanc()">Salvar</button>
  </div>
</div>

<!-- folha: lançamento (excluir) -->
<div class="sheet" id="sheetLanc">
  <h3 id="lancTit">Lançamento</h3>
  <p class="sub" id="lancSub"></p>
  <div class="serr" id="lancErr"></div>
  <div class="acts">
    <button type="button" onclick="fecharSheets()">Fechar</button>
    <button type="button" class="perigo" id="btExcluir" onclick="excluirLanc()">Excluir</button>
  </div>
  <div class="who" id="lancWho"></div>
</div>

<script src="/adm/auth.js"></script>
<script>
const $=s=>document.querySelector(s);
const REST=SB_URL+'/rest/v1';

let SESS=null, LANCS=[], PESSOAS=[], RH=[], ABA='devendo', VIEW='lista', PESSOA_SEL=null;
let novoTipo='emprestimo', novoPessoa=null, lancAlvo=null;

const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function fmt(v){ return Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function dataBR(iso){ if(!iso) return ''; const p=iso.slice(0,10).split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function dataCurta(iso){ const d=new Date(iso+'T12:00:00'); return d.getDate()+' '+MES[d.getMonth()]+' '+String(d.getFullYear()).slice(2); }
function hojeIso(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function iniciais(nome){ const p=(nome||'').trim().split(/\s+/); return ((p[0]||'')[0]||'').toUpperCase()+((p[1]||'')[0]||'').toUpperCase(); }
function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

async function api(path,opt){
  const r=await fetch(REST+path, Object.assign({headers:lolaHeaders(opt&&opt.body?{Prefer:'return=representation'}:{})},opt||{}));
  if(!r.ok){ const t=await r.text().catch(()=>''); throw new Error('Banco respondeu '+r.status+(t?' · '+t.slice(0,120):'')); }
  return r.status===204?null:r.json();
}

async function carregar(){
  const [lancs, rh]=await Promise.all([
    api('/lola_emprestimos?select=*&order=data.asc,id.asc&limit=5000'),
    api('/rh_funcionarios?select=id,nome,cargo,ativo&order=nome.asc')
  ]);
  LANCS=lancs; RH=rh;
  agrupar();
  render();
}

/* agrupa lançamentos por funcionário (chave = nome), calcula saldo corrente */
function agrupar(){
  const map={};
  LANCS.forEach(l=>{
    const k=l.funcionario_nome;
    if(!map[k]) map[k]={nome:k, funcao:null, funcionario_id:null, lancs:[], saldo:0, emprestado:0, abatido:0};
    const p=map[k];
    if(l.funcao) p.funcao=l.funcao;
    if(l.funcionario_id) p.funcionario_id=l.funcionario_id;
    const delta = l.tipo==='emprestimo' ? Number(l.valor) : -Number(l.valor);
    p.saldo += delta;
    if(l.tipo==='emprestimo') p.emprestado+=Number(l.valor); else p.abatido+=Number(l.valor);
    l._saldo = p.saldo; // saldo corrente após este lançamento (ordem asc)
    p.lancs.push(l);
  });
  PESSOAS=Object.values(map).map(p=>{ p.saldo=Math.round(p.saldo*100)/100; return p; });
}

function totalAberto(){ return PESSOAS.reduce((s,p)=>s+(p.saldo>0.001?p.saldo:0),0); }
function nDevendo(){ return PESSOAS.filter(p=>p.saldo>0.001).length; }

/* ============ RENDER ============ */
function render(){
  $('#ctaFix').style.display='block';
  if(VIEW==='pessoa') renderPessoa(); else renderLista();
}

function renderLista(){
  $('#titulo').textContent='Empréstimos';
  $('#btBack').style.visibility='hidden';
  $('#btNovo').innerHTML='<i class="ph-duotone ph-plus-circle"></i>Registrar lançamento';

  const devendo=PESSOAS.filter(p=>p.saldo>0.001).sort((a,b)=>b.saldo-a.saldo);
  const quitados=PESSOAS.filter(p=>p.saldo<=0.001).sort((a,b)=>a.nome.localeCompare(b.nome,'pt'));
  const total=totalAberto();

  let html=`
    <div class="abas">
      <button class="aba ${ABA==='devendo'?'on':''}" onclick="setAba('devendo')">Devendo</button>
      <button class="aba ${ABA==='todos'?'on':''}" onclick="setAba('todos')">Todos</button>
    </div>
    <div class="centro">
      <div class="big ${total<0.001?'zero':''}"><small>R$</small> ${fmt(total)}</div>
      <div class="big-label">A receber · ${nDevendo()} ${nDevendo()===1?'pessoa deve':'pessoas devem'}</div>
    </div>`;

  if(ABA==='devendo'){
    html+=`<div class="lbl">Em aberto</div>`;
    html+= devendo.length ? '<div class="plist">'+devendo.map(linhaPessoa).join('')+'</div>'
                          : '<div class="vazio">Ninguém devendo no momento. 🎉</div>';
  }else{
    if(devendo.length){ html+=`<div class="lbl">Em aberto · ${devendo.length}</div><div class="plist">`+devendo.map(linhaPessoa).join('')+'</div>'; }
    html+=`<div class="lbl">Quitados · ${quitados.length}</div>`;
    html+= quitados.length ? '<div class="plist">'+quitados.map(linhaPessoa).join('')+'</div>' : '<div class="vazio">—</div>';
  }
  $('#conteudo').innerHTML=html;
  document.querySelectorAll('[data-pessoa]').forEach(el=>el.onclick=()=>abrirPessoa(el.dataset.pessoa));
}

function linhaPessoa(p){
  const quit=p.saldo<=0.001;
  return `<button class="prow ${quit?'quit':''}" data-pessoa="${esc(p.nome)}">
    <span class="av">${esc(iniciais(p.nome))}</span>
    <span class="t"><b>${esc(p.nome)}</b><span>${esc(p.funcao||'')}</span></span>
    <span class="sal">${quit
      ? '<span class="v">quitado</span>'
      : '<span class="v">R$ '+fmt(p.saldo)+'</span><span class="c">em aberto</span>'}</span>
  </button>`;
}

function renderPessoa(){
  const p=PESSOAS.find(x=>x.nome===PESSOA_SEL);
  if(!p){ VIEW='lista'; renderLista(); return; }
  $('#titulo').textContent=p.nome;
  $('#btBack').style.visibility='visible';
  $('#btNovo').innerHTML='<i class="ph-duotone ph-plus-circle"></i>Novo lançamento de '+esc(p.nome.split(' ')[0]);
  const quit=p.saldo<=0.001;

  const rows=p.lancs.slice().reverse(); // mais recente primeiro
  let html=`
    <div class="centro">
      <div class="big ${quit?'zero':''}"><small>R$</small> ${fmt(quit?0:p.saldo)}</div>
      <div class="big-label">${quit?'Quitado':'Saldo em aberto'}${p.funcao?' · '+esc(p.funcao):''}</div>
    </div>
    <div class="det-resumo">
      <div class="det-kpi"><div class="v">R$ ${fmt(p.emprestado)}</div><div class="l">emprestado</div></div>
      <div class="det-kpi"><div class="v">R$ ${fmt(p.abatido)}</div><div class="l">abatido</div></div>
      <div class="det-kpi"><div class="v">${p.lancs.length}</div><div class="l">lançamentos</div></div>
    </div>
    <div class="lbl">Extrato</div>
    <div class="ext">`+rows.map(l=>{
      const emp=l.tipo==='emprestimo';
      return `<button class="ext-row" data-id="${l.id}">
        <span class="ic ${emp?'emp':'amo'}"><i class="ph-duotone ph-${emp?'arrow-up-right':'arrow-down-left'}"></i></span>
        <span class="m"><b>${emp?'Empréstimo':'Abatimento'}</b><span>${dataBR(l.data)}${l.obs?' · '+esc(l.obs):''}</span></span>
        <span class="r"><span class="v ${emp?'emp':'amo'}">${emp?'+':'−'} R$ ${fmt(l.valor)}</span><span class="s">saldo R$ ${fmt(l._saldo)}</span></span>
      </button>`;
    }).join('')+`</div>`;
  $('#conteudo').innerHTML=html;
  document.querySelectorAll('.ext-row').forEach(el=>el.onclick=()=>abrirLanc(Number(el.dataset.id)));
}

function setAba(a){ ABA=a; renderLista(); }
function abrirPessoa(nome){ PESSOA_SEL=nome; VIEW='pessoa'; window.scrollTo(0,0); render(); }
function voltar(){ if(VIEW==='pessoa'){ VIEW='lista'; PESSOA_SEL=null; window.scrollTo(0,0); render(); } }

/* ============ NOVO LANÇAMENTO ============ */
function abrirNovo(pessoa){
  novoTipo='emprestimo'; setTipo('emprestimo');
  novoPessoa = pessoa || null;
  $('#fValor').value=''; $('#fObs').value=''; $('#fData').value=hojeIso(); $('#novoErr').textContent='';
  desenharPessoaSlot();
  $('#sheetBg').style.display='block'; $('#sheetNovo').style.display='block';
  if(novoPessoa){ setTimeout(()=>$('#fValor').focus(),120); }
}
function setTipo(t){
  novoTipo=t;
  $('#tpEmp').className='emp'+(t==='emprestimo'?' on':'');
  $('#tpAmo').className='amo'+(t==='amortizacao'?' on':'');
}

/* opções de pessoa: RH ativos + nomes já no histórico (dedup por nome) */
function opcoesPessoas(){
  const map={};
  RH.filter(r=>r.ativo!==false).forEach(r=>{ map[r.nome]={nome:r.nome, funcao:r.cargo||'', id:r.id}; });
  PESSOAS.forEach(p=>{ if(!map[p.nome]) map[p.nome]={nome:p.nome, funcao:p.funcao||'', id:p.funcionario_id}; });
  return Object.values(map).sort((a,b)=>a.nome.localeCompare(b.nome,'pt'));
}
function desenharPessoaSlot(){
  const slot=$('#pessoaSlot');
  if(novoPessoa){
    slot.innerHTML=`<div class="pick-sel">
      <span class="t"><b>${esc(novoPessoa.nome)}</b><span>${esc(novoPessoa.funcao||'')}</span></span>
      <button type="button" onclick="trocarPessoa()">trocar</button></div>`;
    return;
  }
  slot.innerHTML=`<input type="text" id="pessoaBusca" placeholder="Buscar ou digitar um nome…" autocomplete="off">
    <div class="pick-list" id="pickList"></div>`;
  const inp=$('#pessoaBusca');
  inp.oninput=()=>filtraPessoas(inp.value);
  filtraPessoas('');
}
function filtraPessoas(termo){
  const t=(termo||'').trim().toLowerCase();
  let ops=opcoesPessoas();
  if(t) ops=ops.filter(o=>o.nome.toLowerCase().includes(t)||(o.funcao||'').toLowerCase().includes(t));
  let html=ops.slice(0,60).map(o=>`<button type="button" class="pick-item" data-nome="${esc(o.nome)}">
    <span class="av" style="width:30px;height:30px;font-size:12px;border-radius:50%;background:var(--cremeDark);color:var(--vinho);display:flex;align-items:center;justify-content:center;font-family:Fraunces,serif;font-weight:600">${esc(iniciais(o.nome))}</span>
    <span class="t"><b>${esc(o.nome)}</b><span>${esc(o.funcao||'')}</span></span></button>`).join('');
  const existe=ops.some(o=>o.nome.toLowerCase()===t);
  if(t && !existe){
    html=`<button type="button" class="pick-item novo" data-novo="${esc(termo.trim())}">
      <span class="av" style="width:30px;height:30px;font-size:15px;border-radius:50%;background:var(--cremeDark);color:var(--vinho);display:flex;align-items:center;justify-content:center">+</span>
      <span class="t"><b>Usar "${esc(termo.trim())}"</b><span>pessoa nova, fora do cadastro</span></span></button>`+html;
  }
  $('#pickList').innerHTML=html||'<div class="vazio" style="padding:20px">Nada encontrado.</div>';
  document.querySelectorAll('#pickList .pick-item').forEach(el=>el.onclick=()=>{
    if(el.dataset.novo!=null){ novoPessoa={nome:el.dataset.novo, funcao:'', id:null}; }
    else{ const o=opcoesPessoas().find(x=>x.nome===el.dataset.nome); novoPessoa={nome:o.nome, funcao:o.funcao, id:o.id}; }
    desenharPessoaSlot(); $('#fValor').focus();
  });
}
function trocarPessoa(){ novoPessoa=null; desenharPessoaSlot(); }

async function salvarLanc(){
  const err=$('#novoErr'); err.textContent='';
  if(!novoPessoa){ err.textContent='Escolha o funcionário.'; return; }
  const valor=Math.round((parseFloat(($('#fValor').value||'').replace(',','.'))||0)*100)/100;
  if(!valor || valor<=0){ err.textContent='Informe um valor maior que zero.'; return; }
  const data=$('#fData').value || hojeIso();
  const obs=($('#fObs').value||'').trim();
  const body={ funcionario_id:novoPessoa.id||null, funcionario_nome:novoPessoa.nome,
    funcao:novoPessoa.funcao||null, data, tipo:novoTipo, valor, obs:obs||null,
    criado_por:(SESS&&(SESS.nome||SESS.email))||'' };
  const btn=$('#btSalvar'); btn.disabled=true; const tx=btn.textContent; btn.textContent='Salvando…';
  try{
    const r=await api('/lola_emprestimos',{method:'POST',body:JSON.stringify(body)});
    const novo=(r&&r[0])||Object.assign({id:Date.now()},body);
    LANCS.push(novo);
    const nomeFoco=novoPessoa.nome;
    agrupar();
    fecharSheets();
    if(VIEW==='pessoa' && PESSOA_SEL!==nomeFoco) PESSOA_SEL=nomeFoco;
    render();
  }catch(e){ err.textContent='Não consegui salvar: '+e.message; btn.disabled=false; btn.textContent=tx; return; }
  btn.disabled=false; btn.textContent=tx;
}

/* ============ EXCLUIR ============ */
function abrirLanc(id){
  lancAlvo=LANCS.find(l=>l.id===id); if(!lancAlvo) return;
  const emp=lancAlvo.tipo==='emprestimo';
  $('#lancTit').textContent=(emp?'Empréstimo':'Abatimento')+' · R$ '+fmt(lancAlvo.valor);
  $('#lancSub').innerHTML=`${esc(lancAlvo.funcionario_nome)} · ${dataBR(lancAlvo.data)}${lancAlvo.obs?'<br>'+esc(lancAlvo.obs):''}`;
  $('#lancErr').textContent='';
  $('#lancWho').textContent=lancAlvo.criado_por?('Registrado por '+lancAlvo.criado_por):'';
  $('#btExcluir').disabled=false; $('#btExcluir').textContent='Excluir';
  $('#sheetBg').style.display='block'; $('#sheetLanc').style.display='block';
}
async function excluirLanc(){
  if(!lancAlvo) return;
  const btn=$('#btExcluir'); btn.disabled=true; btn.textContent='Excluindo…';
  try{
    await api('/lola_emprestimos?id=eq.'+lancAlvo.id,{method:'DELETE'});
    LANCS=LANCS.filter(l=>l.id!==lancAlvo.id);
    agrupar(); fecharSheets();
    const ainda=PESSOAS.find(x=>x.nome===PESSOA_SEL);
    if(VIEW==='pessoa' && !ainda){ VIEW='lista'; PESSOA_SEL=null; }
    render();
  }catch(e){ $('#lancErr').textContent='Não consegui excluir: '+e.message; btn.disabled=false; btn.textContent='Excluir'; }
}

function fecharSheets(){ $('#sheetBg').style.display='none'; $('#sheetNovo').style.display='none'; $('#sheetLanc').style.display='none'; }

/* ============ boot ============ */
$('#btBack').onclick=voltar;
$('#btNovo').onclick=()=>{ abrirNovo(VIEW==='pessoa'&&PESSOA_SEL?{nome:PESSOA_SEL,funcao:(PESSOAS.find(p=>p.nome===PESSOA_SEL)||{}).funcao,id:(PESSOAS.find(p=>p.nome===PESSOA_SEL)||{}).funcionario_id}:null); };
$('#sheetBg').onclick=fecharSheets;

(async()=>{
  SESS=await lolaGate({papeis:['admin','financeiro'], titulo:'Empréstimos'});
  $('#quem').textContent=(SESS.nome||SESS.email||'').split(' ')[0];
  try{ await carregar(); }
  catch(e){ $('#conteudo').innerHTML='<div class="erro">Não consegui falar com o banco: '+e.message+'</div>'; }
})();
</script>
