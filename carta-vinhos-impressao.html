<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carta de Vinhos — Impressão · Lola CCMQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#a3282a;--gold:#c19a5b;--ink:#2b2620;--desc:#5f574b;--cream:#fdfbf7;--line:#e7dcc9;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:#efe7d8;color:var(--ink);font-family:'Manrope',Arial,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact;}

/* Barra de ações (só na tela) */
.bar{position:sticky;top:0;z-index:50;background:#fffdf9;border-bottom:1px solid var(--line);
     display:flex;gap:12px;align-items:center;justify-content:center;padding:12px;}
.bar button{font-family:'Manrope',Arial,sans-serif;font-size:14px;font-weight:700;letter-spacing:.3px;
     background:var(--red);color:#fff;border:0;border-radius:22px;padding:10px 22px;cursor:pointer;}
.bar .hint{font-size:12px;color:#8a7c68;}

/* Folha A5 */
.sheet{background:var(--cream);width:148mm;min-height:210mm;margin:18px auto;padding:15mm 14mm 14mm;
     box-shadow:0 2px 14px rgba(0,0,0,.12);position:relative;}
.rhead{text-align:center;font-family:Georgia,serif;font-size:7.5px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:4px;}
.state{text-align:center;color:#9a8f7c;padding:60px 0;font-size:14px;}

.sec{padding-top:2px;margin-bottom:8px;}
.cat{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:6px;}
.cat .ln{height:1px;background:var(--gold);opacity:.55;flex:1;max-width:70px;}
.cat .cn{font-family:'Fraunces',Georgia,serif;font-style:italic;font-weight:600;color:var(--red);font-size:29px;font-variation-settings:"opsz" 144;white-space:nowrap;}
.sub{text-align:center;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--red);margin:9px 0 20px;font-weight:700;}
/* Capa */
.cover{min-height:180mm;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:0 6mm;}
.cover .ck{font-family:'Manrope',Arial,sans-serif;letter-spacing:5px;text-transform:uppercase;font-size:10px;color:var(--gold);font-weight:600;}
.cover h1{font-family:'Fraunces',Georgia,serif;font-style:italic;font-weight:600;color:var(--red);font-size:46px;margin:14px 0 0;font-variation-settings:"opsz" 144;line-height:1;}
.cover .crule{width:60px;height:2px;background:var(--gold);opacity:.7;margin:18px 0;}
.cover .csub{font-size:12.5px;color:var(--desc);line-height:1.6;max-width:74%;}
.cover .cglass{font-size:26px;margin-bottom:14px;filter:saturate(.9);}
.w{margin:0 0 18px;break-inside:avoid;}
.wh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;}
.wn{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:15px;color:var(--ink);line-height:1.2;font-variation-settings:"opsz" 60;}
.wp{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:14px;color:var(--red);white-space:nowrap;}
.wr{font-size:8.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--gold);font-weight:600;margin:3px 0 5px;}
.wd{font-size:10.5px;color:var(--desc);line-height:1.45;}
.taca{text-align:center;margin-top:20px;}
.taca .tp{font-family:'Fraunces',Georgia,serif;font-style:italic;font-weight:600;color:var(--red);font-size:38px;}
.taca .tw{margin:12px auto 0;font-size:12px;color:var(--desc);line-height:1.9;max-width:80%;}
.foot{text-align:center;font-family:Georgia,serif;font-size:7px;letter-spacing:.6px;color:#b0a48f;margin-top:14px;}

@media print{
  @page{size:A5 portrait;margin:14mm 13mm;}
  html,body{background:#fff;}
  .bar{display:none!important;}
  .sheet{width:auto;min-height:0;margin:0;padding:0;box-shadow:none;background:#fff;}
  .rhead{position:fixed;top:0;left:0;right:0;}
  .cover{break-after:page;min-height:175mm;}
  .sec.brk{break-before:page;}
}
</style></head><body>
<div class="bar">
  <button onclick="window.print()">🖨️ Imprimir / Salvar PDF</button>
  <span class="hint">Dica: no diálogo de impressão escolha tamanho <b>A5</b> e ative “Gráficos de plano de fundo”.</span>
</div>

<div class="sheet">
  <div class="rhead">Lola CCMQ &nbsp;·&nbsp; Carta de Vinhos</div>
  <section class="cover">
    <div class="cglass">🍷</div>
    <div class="ck">Vindima · Terraço · No alto</div>
    <h1>Carta de Vinhos</h1>
    <div class="crule"></div>
    <div class="csub">Uma seleção de rótulos gaúchos, escolhidos pra harmonizar com a nossa cozinha.</div>
  </section>
  <div id="app"><div class="state">Carregando a carta…</div></div>
  <div class="foot" id="foot"></div>
</div>

<script>
const FN="https://mvjbsdpfjhywhaonvpfl.supabase.co/functions/v1/vinhos";
// Formato Lola (julho): ordem e subtítulos de cada seção
const ORDER=[
  ["branco","Brancos","LEVES, CÍTRICOS E MINERAIS"],
  ["rose","Rosés","FRESCOS, FLORAIS E VERSÁTEIS"],
  ["espumante","Espumantes","BOLHAS, BRINDES E PÔR DO SOL"],
  ["tinto","Tintos","ENCORPADOS, INTENSOS E DE GUARDA"],
];
const TACA_WINES="Branco: Wild Trebbiano Miolo · Rosé: Aurora Merlot Rosé · Tinto: Espaço Tempo Cabernet Sauvignon";
function money(v){return "R$ "+(""+v).replace(/\.00$/,"").replace(".",",");}
function esc(s){return (s==null?"":String(s)).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}

fetch(FN).then(r=>r.json()).then(j=>{
  const it=j.items||[];
  const app=document.getElementById('app');
  let html='';let first=true;
  ORDER.forEach(([t,lbl,sub])=>{
    const ws=it.filter(x=>x.tipo===t);
    if(!ws.length)return;
    html+='<section class="sec '+(first?'':'brk')+'">';first=false;
    html+='<div class="cat"><span class="ln"></span><span class="cn">'+esc(lbl)+'</span><span class="ln"></span></div>';
    html+='<div class="sub">'+esc(sub)+'</div>';
    ws.forEach(w=>{
      const meta=[w.vinicola,w.regiao].filter(Boolean).join(' · ').toUpperCase();
      html+='<div class="w"><div class="wh"><span class="wn">'+esc(w.nome)+'</span>'
          +'<span class="wp">'+money(w.preco)+'</span></div>'
          +(meta?'<div class="wr">'+esc(meta)+'</div>':'')
          +(w.descricao?'<div class="wd">'+esc(w.descricao)+'</div>':'')+'</div>';
    });
    html+='</section>';
  });
  // Vinho em taça (última página)
  html+='<section class="sec brk"><div class="cat"><span class="ln"></span>'
      +'<span class="cn">Vinho em Taça</span><span class="ln"></span></div>'
      +'<div class="sub">150 ML · A CASA SUGERE</div>'
      +'<div class="taca"><div class="tp">R$ 29</div><div class="tw">'+esc(TACA_WINES)+'</div></div></section>';
  app.innerHTML=html;
  const d=new Date();
  document.getElementById('foot').textContent=
    'www.lolabar.com.br · Lola CCMQ · Porto Alegre – RS · atualizada em '
    +String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
}).catch(e=>{document.getElementById('app').innerHTML='<div class="state">Não consegui carregar a carta agora.</div>';});
</script>
</body></html>
