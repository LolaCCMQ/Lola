<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lola Manutencoes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/tabler-icons.min.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/duotone/style.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--red:#A82A2A;--red-light:#FBEDEC;--red-mid:#B5302E;--border:#ECE3D9;--bg:#FBF7F1;--white:#FFFFFF;--text:#2A1A17;--muted:#92837B;--grad:linear-gradient(135deg,#B5302E,#7E1E1F);--green-bg:#DFFAE8;--green:#1A6636;--yellow-bg:#FFF3CC;--yellow:#7A5500;--blue-bg:#E0EDFF;--blue:#1A3F7A;--orange-bg:#FDE8D8;--orange:#7A3000;--purple-bg:#EDE0FF;--purple:#4A1A7A;}
body{font-family:'Manrope',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.app{display:flex;flex-direction:column;height:100vh;max-width:980px;margin:0 auto;background:var(--white);box-shadow:0 0 40px rgba(0,0,0,.06)}
/* 19/07 (Bianca): visual antigo → cabeçalho CLARO do padrão atual. Só CSS. */
.topbar{background:var(--bg);padding:13px 16px 12px;display:flex;flex-direction:column;align-items:stretch;gap:0;flex-shrink:0;color:var(--text);border-bottom:1px solid var(--border)}
.topbar>img{display:none}
.ah-row{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.ah-menu{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--border);color:var(--red);font-family:'Manrope',sans-serif;font-weight:700;font-size:.85rem;padding:8px 14px 8px 10px;border-radius:22px;cursor:pointer}
.ah-menu i{font-size:1.1rem}
.ah-acts{margin-left:auto;display:flex;gap:8px;align-items:center}
.ah-ic{position:relative;width:40px;height:40px;border-radius:50%;background:#fff;border:1px solid var(--border);color:var(--red);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.2rem}
.ah-badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:.6rem;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}
.ah-title{font-family:'Fraunces',serif;font-weight:600;font-size:1.55rem;line-height:1.12;color:var(--red)}
.ah-sub{color:var(--muted);font-size:.82rem;margin-top:3px}
.topbar img{background:#fff;padding:3px 7px;border-radius:8px}
.topbar-nav{display:flex;gap:6px;margin-top:11px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.tnav{flex:0 0 auto;padding:8px 13px;border-radius:22px;font-size:.78rem;cursor:pointer;border:1px solid var(--border);background:#fff;color:#5A463E;font-family:'Manrope',sans-serif;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-weight:700}
.tnav.active{background:var(--red);border-color:var(--red);color:#fff}
.tnav i{font-size:15px}
.pill-bar{padding:12px 20px;display:flex;gap:8px;flex-wrap:wrap;background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0}
.pill{padding:5px 14px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1.5px solid var(--border);background:transparent;color:var(--muted);transition:all .15s;white-space:nowrap;font-family:'Manrope',sans-serif}
.pill.active{background:var(--red);border-color:var(--red);color:#fff}
.pill:hover:not(.active){border-color:var(--red);color:var(--red)}
.content{flex:1;overflow-y:auto;padding:20px;background:var(--bg)}
.page-title{font-family:'Fraunces',serif;font-size:24px;color:var(--text);margin-bottom:16px}
.filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filter-bar .inp{flex:1;min-width:140px;padding:8px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:'Manrope',sans-serif;background:var(--white);color:var(--text)}
.filter-bar .inp:focus{outline:none;border-color:var(--red)}
.filter-bar select.inp{cursor:pointer;min-width:130px;flex:0 0 auto}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.stat-card{background:var(--white);border:1.5px solid var(--border);border-radius:12px;padding:14px;text-align:center}
.stat-num{font-family:'Fraunces',serif;font-size:28px;color:var(--red)}
.stat-lbl{font-size:11px;color:var(--muted);margin-top:2px;font-weight:500;text-transform:uppercase;letter-spacing:.4px}
.card{background:var(--white);border:1.5px solid var(--border);border-radius:20px;padding:16px 18px;margin-bottom:12px;transition:box-shadow .15s;box-shadow:0 8px 24px rgba(168,42,42,.07)}
.card:hover{box-shadow:0 4px 16px rgba(139,26,26,.07)}
.card-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.card-title{font-family:'Fraunces',serif;font-size:18px;color:var(--text);margin-bottom:4px}
.badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.b-ok{background:var(--green-bg);color:var(--green)}
.b-warn{background:var(--yellow-bg);color:var(--yellow)}
.b-bad{background:var(--red-light);color:var(--red)}
.b-tipo{background:var(--blue-bg);color:var(--blue)}
.b-loja{background:var(--orange-bg);color:var(--orange)}
.b-gray{background:#F0ECE8;color:var(--muted)}
.b-purple{background:var(--purple-bg);color:var(--purple)}
.b-problema{background:#FFF0CC;color:#7A4F00}
.btn{padding:7px 14px;border-radius:8px;border:1.5px solid var(--border);background:var(--white);color:var(--text);font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .15s;font-family:'Manrope',sans-serif;font-weight:500}
.btn:hover{background:var(--bg)}
.btn-p{background:var(--red);border-color:var(--red);color:#fff}
.btn-p:hover{background:var(--red-mid)}
.btn-sm{padding:5px 11px;font-size:12px}
.btn-icon{padding:5px;min-width:28px;justify-content:center;border-radius:7px}
.btn-d{color:var(--red);border-color:#f7c1c1}
.btn-d:hover{background:var(--red-light)}
.btn-outline{border-color:var(--red);color:var(--red);background:transparent}
.btn-outline:hover{background:var(--red-light)}
.input{width:100%;padding:8px 12px;border:1.5px solid var(--border);border-radius:8px;background:var(--white);color:var(--text);font-size:13px;font-family:'Manrope',sans-serif}
.input:focus{outline:none;border-color:var(--red)}
textarea.input{resize:vertical}
select.input{cursor:pointer}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.fr.full{grid-template-columns:1fr}
.lbl{font-size:12px;color:var(--muted);display:block;margin-bottom:4px;font-weight:500}
.cb-row{display:flex;gap:14px;flex-wrap:wrap}
.cb-row label{display:flex;align-items:center;gap:5px;font-size:13px;cursor:pointer}
.modal-bd{position:fixed;inset:0;background:rgba(30,10,10,.5);display:flex;align-items:flex-start;justify-content:center;padding:20px;z-index:200;overflow-y:auto;backdrop-filter:blur(2px)}
.modal{background:var(--white);border-radius:16px;border:1.5px solid var(--border);width:100%;max-width:580px;padding:20px;margin:auto;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.mtitle{font-family:'Fraunces',serif;font-size:19px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.mtitle span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slbl{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:16px 0 8px;display:flex;align-items:center;gap:6px}
.slbl::after{content:'';flex:1;height:1px;background:var(--border)}
.photo-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.pthumb{width:76px;height:76px;border-radius:10px;object-fit:cover;border:1.5px solid var(--border);cursor:pointer;transition:transform .15s}
.pthumb:hover{transform:scale(1.05)}
.padd{width:76px;height:76px;border-radius:10px;border:1.5px dashed #ccc;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);font-size:10px;gap:3px;transition:all .15s;background:none;font-family:'Manrope',sans-serif}
.padd:hover{border-color:var(--red);color:var(--red)}
.padd i{font-size:22px}
.hist-item{padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
.hist-item:last-child{border-bottom:none}
.hdate{color:var(--muted);font-size:11px;margin-top:3px}
.al-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.al-item:last-child{border-bottom:none}
.adot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.dr{background:#E24B4A}.da{background:#EF9F27}.dg{background:#3A9B57}
.problema-dot{width:9px;height:9px;border-radius:50%;background:#EF9F27;flex-shrink:0;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.eq-num{min-width:40px;height:40px;border-radius:10px;background:var(--red-light);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--red);flex-shrink:0;padding:0 6px}
.eq-info{flex:1;min-width:0}
.eq-name{font-size:14px;font-weight:600}
.eq-meta{font-size:12px;color:var(--muted);margin-top:2px}
.eq-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.eq-row{display:flex;align-items:flex-start;gap:12px;padding:12px 6px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;border-radius:8px;margin:0 -6px}
.eq-row:last-child{border-bottom:none}
.eq-row:hover{background:var(--red-light)}
.cont-icon{min-width:40px;height:40px;border-radius:10px;background:var(--blue-bg);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cont-icon i{font-size:18px;color:var(--blue)}
.empty{text-align:center;padding:32px 16px;color:var(--muted);font-size:13px}
.empty i{font-size:36px;display:block;margin-bottom:8px;color:#D4C9C0}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:300;cursor:pointer}
.lightbox img{max-width:92vw;max-height:90vh;border-radius:12px}
.tag-list{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tag-chip{padding:4px 12px;border-radius:20px;font-size:12px;background:var(--bg);border:1.5px solid var(--border);display:inline-flex;align-items:center;gap:6px;font-weight:500}
.tag-chip button{background:none;border:none;cursor:pointer;color:var(--muted);padding:0;line-height:1;font-size:16px}
.tag-chip button:hover{color:var(--red)}
.info-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px;background:var(--bg);border-radius:10px;padding:12px}
.ig-two{grid-column:span 2}
.ig-item label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:3px}
.ig-item div{font-size:13px;font-weight:500}
.loading{position:fixed;inset:0;background:rgba(250,248,245,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:400;gap:12px;font-size:14px;color:var(--muted)}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:20px;right:20px;background:var(--red);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:500;z-index:500;box-shadow:0 4px 16px rgba(0,0,0,.2);animation:fadeIn .2s}
.toast.ok{background:#1A6636}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

  /* ===== Padronizacao tipografica (estilo Estoque) ===== */
  body{font-family:'Manrope',sans-serif !important;}
  .page-title,.stat-num,.card-title,.mtitle,[style*="Playfair"]{font-family:'Fraunces',serif !important;font-weight:600 !important;font-style:normal !important;}
</style>
</head>

        <button class="ah-ic" onclick="ahAvisos()" title="Avisos"><i class="ph-duotone ph-bell"></i><span class="ah-badge" id="ahBadge" style="display:none">0</span></button>
      </div>
    </div>
    <h1 class="ah-title">Manutenções</h1>
    <div class="ah-sub" id="ahSub">Gestão de equipamentos</div>
    <nav class="topbar-nav">
      <button class="tnav active" id="nav-painel" onclick="setTab('painel')"><i class="ph-duotone ph-squares-four"></i>Painel</button>
      <button class="tnav" id="nav-equip" onclick="setTab('equip')"><i class="ph-duotone ph-wrench"></i>Equipamentos</button>
      <button class="tnav" id="nav-prev"  onclick="setTab('prev')"><i class="ph-duotone ph-calendar-check"></i>Preventivas</button>
      <button class="tnav" id="nav-desc"  onclick="setTab('desc')"><i class="ph-duotone ph-trash"></i>Descartes</button>
      <button class="tnav" id="nav-cont"  onclick="setTab('cont')"><i class="ph-duotone ph-address-book"></i>Contatos</button>
    </nav>
  </div>
  <div class="pill-bar">
    <button class="pill active" id="pill-all"     onclick="setLoja('all')">Todas as lojas</button>
    <button class="pill"        id="pill-ccmq"    onclick="setLoja('ccmq')">CCMQ</button>
    <button class="pill"        id="pill-mac"     onclick="setLoja('mac')">Mac</button>
    <button class="pill"        id="pill-central" onclick="setLoja('central')">Cozinha Central</button>
  </div>
  <div class="content" id="content"></div>
</div>
<script>
const SB_URL='https://mvjbsdpfjhywhaonvpfl.supabase.co';
const SB_KEY='sb_publishable_VMJzYe1AwL9zEoFs-ljUIw_OOkDpqhy';
const LOJAS={all:'Todas',ccmq:'Lola CCMQ',mac:'Lola Mac',central:'Cozinha Central'};
const TABS=['painel','equip','prev','desc','cont'];
let S={tab:'painel',loja:'all',search:'',filterTipo:'',equipamentos:[],preventivas:[],descartes:[],contatos:[],tipos:[]};

async function sbFetch(table,opts={}){
  const{method='GET',body,query='',prefer='return=representation'}=opts;
  const url=`${SB_URL}/rest/v1/${table}${query}`;
  const headers={'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`,'Content-Type':'application/json','Prefer':prefer};
  const r=await fetch(url,{method,headers,body:body?JSON.stringify(body):undefined});
  if(!r.ok)throw new Error(await r.text());
  const txt=await r.text();
  return txt?JSON.parse(txt):[];
}
async function sbGet(t,q=''){return sbFetch(t,{query:q});}
async function sbPost(t,b){return sbFetch(t,{method:'POST',body:b});}
async function sbUpsert(t,b){return sbFetch(t,{method:'POST',body:b,query:'?on_conflict=id',prefer:'resolution=merge-duplicates,return=representation'});}
async function sbDelete(t,q){return sbFetch(t,{method:'DELETE',query:q});}

async function loadAll(){
  showLoading();
  try{
    const[eq,prev,desc,cont,tipos]=await Promise.all([
      sbGet('equipamentos','?order=num.asc'),
      sbGet('preventivas','?order=id.asc'),
      sbGet('descartes','?order=id.asc'),
      sbGet('contatos','?order=id.asc'),
      sbGet('tipos','?order=nome.asc'),
    ]);
    S.equipamentos=eq.map(mapEq);
    S.preventivas=prev.map(mapPrev);
    S.descartes=desc;
    S.contatos=cont;
    S.tipos=tipos.map(t=>t.nome);
    if(!S.tipos.length){
      const defs=['Refrigeracao','Eletrica','Cozinha','Bar','Informatica','Climatizacao','Hidraulica','Outros'];
      for(const nome of defs)await sbPost('tipos',{nome});
      S.tipos=defs;
    }
    hideLoading();render();
  }catch(e){hideLoading();showToast('Erro ao carregar: '+e.message,true);}
}

function mapEq(r){return{id:r.id,num:r.num,nome:r.nome,setor:r.setor||'',lojas:r.lojas||[],tipo:r.tipo||'',marca:r.marca||'',modelo:r.modelo||'',numSerie:r.num_serie||'',notaFiscal:r.nota_fiscal||'',obs:r.obs||'',status:r.status||'ativo',fotos:r.fotos||[],historico:r.historico||[]};}
function mapPrev(r){return{id:r.id,nome:r.nome,frequenciaDias:r.frequencia_dias,lojas:r.lojas||[],ultimaData:r.ultima_data||'',obs:r.obs||''};}

async function saveEquip(e){await sbUpsert('equipamentos',{id:e.id,num:e.num,nome:e.nome,setor:e.setor,lojas:e.lojas,tipo:e.tipo,marca:e.marca,modelo:e.modelo,num_serie:e.numSerie,nota_fiscal:e.notaFiscal,obs:e.obs,status:e.status,fotos:e.fotos,historico:e.historico});}
// PATCH parcial: nao reenvia fotos (evita payload gigante de equipamentos com fotos pesadas)
async function sbPatch(t,fields,id){return sbFetch(t,{method:'PATCH',body:fields,query:'?id=eq.'+id,prefer:'return=representation'});}
async function saveHist(e){await sbPatch('equipamentos',{historico:e.historico},e.id);}
async function saveStatusHist(e){await sbPatch('equipamentos',{status:e.status,historico:e.historico},e.id);}
async function saveFotos(e){await sbPatch('equipamentos',{fotos:e.fotos},e.id);}
async function savePrevDB(p){await sbUpsert('preventivas',{id:p.id,nome:p.nome,frequencia_dias:p.frequenciaDias,lojas:p.lojas,ultima_data:p.ultimaData,obs:p.obs});}
async function saveDescDB(d){await sbUpsert('descartes',{id:d.id,nome:d.nome,marca:d.marca,motivo:d.motivo,data:d.data,obs:d.obs});}
async function saveContDB(c){await sbUpsert('contatos',{id:c.id,nome:c.nome,especialidade:c.especialidade,tel:c.tel,obs:c.obs});}

function showLoading(){let l=document.getElementById('_ld');if(!l){l=document.createElement('div');l.id='_ld';l.className='loading';l.innerHTML='<div class="spinner"></div><span>Carregando...</span>';document.body.appendChild(l);}}
function hideLoading(){const l=document.getElementById('_ld');if(l)l.remove();}
function showToast(msg,err=false){const t=document.createElement('div');t.className='toast'+(err?'':' ok');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3000);}

function setTab(t){S.tab=t;TABS.forEach(x=>document.getElementById('nav-'+x).classList.toggle('active',x===t));render();}
function setLoja(l){S.loja=l;['all','ccmq','mac','central'].forEach(x=>document.getElementById('pill-'+x).classList.toggle('active',x===l));render();}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function nextNum(){return S.equipamentos.length?Math.max(...S.equipamentos.map(e=>e.num))+1:1;}
function diasProxima(p){if(!p.ultimaData)return null;const d=new Date(p.ultimaData);d.setDate(d.getDate()+p.frequenciaDias);return Math.round((d-new Date())/864e5);}
function freqLabel(d){return d>=365?Math.round(d/365)+' ano(s)':d>=30?Math.round(d/30)+' mes(es)':d+' dias';}
function _hoje(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtDate(s){if(!s)return'';const[y,m,d]=s.split('-');return`${d}/${m}/${y}`;}
function filteredEquip(){
  const q=(S.search||'').toLowerCase();
  return S.equipamentos.filter(e=>{
    if(e.status!=='ativo'&&e.status!=='problema')return false;
    if(S.loja!=='all'&&!e.lojas.includes(S.loja))return false;
    if(S.filterTipo&&e.tipo!==S.filterTipo)return false;
    if(q&&!`${e.num} ${e.nome} ${e.setor} ${e.marca} ${e.tipo}`.toLowerCase().includes(q))return false;
    return true;
  }).sort((a,b)=>a.num-b.num);
}

function render(){
  const c=document.getElementById('content');
  if(S.tab==='painel')c.innerHTML=renderPainel();
  if(S.tab==='equip')c.innerHTML=renderEquip();
  if(S.tab==='prev')c.innerHTML=renderPrev();
  if(S.tab==='desc')c.innerHTML=renderDesc();
  if(S.tab==='cont')c.innerHTML=renderCont();
  // Restore focus to search input if it was active
  const inp=document.getElementById('search-equip');
  if(inp){
    inp.focus();
    const v=inp.value;
    inp.value='';
    inp.value=v;
  }
}

function renderPainel(){
  const ativos=S.equipamentos.filter(e=>e.status==='ativo'&&(S.loja==='all'||e.lojas.includes(S.loja))).length;
  const comProblema=S.equipamentos.filter(e=>e.status==='problema'&&(S.loja==='all'||e.lojas.includes(S.loja)));
  const alertas=S.preventivas.filter(p=>{if(S.loja!=='all'&&!p.lojas.includes(S.loja))return false;const d=diasProxima(p);return d!==null&&d<=30;});
  const venc=alertas.filter(a=>diasProxima(a)<=0).length;
  const p14=alertas.filter(a=>{const d=diasProxima(a);return d>0&&d<=14;}).length;
  let h=`<div class="page-title">Painel de Manutencoes</div>
  <div class="stat-row">
    <div class="stat-card"><div class="stat-num">${ativos+comProblema.length}</div><div class="stat-lbl">Equipamentos</div></div>
    <div class="stat-card"><div class="stat-num" style="color:#B7770D">${comProblema.length}</div><div class="stat-lbl">Com problema</div></div>
    <div class="stat-card"><div class="stat-num" style="color:#C0392B">${venc}</div><div class="stat-lbl">Prev. vencidas</div></div>
    <div class="stat-card"><div class="stat-num" style="color:#B7770D">${p14}</div><div class="stat-lbl">Vencem em 14d</div></div>
  </div>`;
  if(comProblema.length){
    h+=`<div class="card" style="border-left:4px solid #EF9F27;margin-bottom:12px"><div style="font-size:14px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:7px;color:#7A4F00"><i class="ti ti-alert-triangle"></i>Equipamentos com problema (${comProblema.length})</div>`;
    comProblema.forEach(e=>{h+=`<div class="al-item" style="cursor:pointer" onclick="setTab('equip');setTimeout(function(){openDetail(${e.id});},150)"><div class="problema-dot"></div><div style="flex:1"><div style="font-size:13px;font-weight:600">#${e.num} ${esc(e.nome)}</div><div style="font-size:11px;color:var(--muted)">${esc(e.setor)}</div></div><i class="ti ti-chevron-right" style="color:#ccc;font-size:14px"></i></div>`;});
    h+=`</div>`;
  }
  if(alertas.length){
    h+=`<div class="card" style="border-left:4px solid var(--red)"><div style="font-size:14px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:7px;color:var(--red)"><i class="ti ti-bell-ringing"></i>Alertas de manutencao preventiva</div>`;
    alertas.forEach(a=>{const d=diasProxima(a),cor=d<=0?'dr':d<=7?'da':'dg',txt=d<0?`Vencida ha ${Math.abs(d)} dias`:d===0?'Vence hoje':`Vence em ${d} dias`;h+=`<div class="al-item" style="cursor:pointer" onclick="setTab('prev')"><div class="adot ${cor}"></div><div style="flex:1"><div style="font-size:13px;font-weight:600">${esc(a.nome)}</div><div style="font-size:12px;color:var(--muted)">${esc(a.obs)||'A cada '+freqLabel(a.frequenciaDias)}</div></div><span style="font-size:12px;font-weight:500;color:${d<=0?'var(--red)':d<=7?'#B7770D':'var(--muted)'}">${txt}</span></div>`;});
    h+=`</div>`;
  }
  const rec=[];
  S.equipamentos.forEach(e=>{if(S.loja!=='all'&&!e.lojas.includes(S.loja))return;e.historico.forEach(hh=>rec.push({...hh,equip:e.nome,eid:e.id}));});
  rec.sort((a,b)=>b.data.localeCompare(a.data));
  h+=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px"><div class="page-title" style="font-size:18px;margin-bottom:0">Ultimas manutencoes</div><button class="btn btn-sm btn-outline" onclick="setTab('equip')">Ver todos <i class="ti ti-arrow-right"></i></button></div>`;
  if(!rec.length)h+=`<div class="empty"><i class="ti ti-clock"></i>Nenhuma manutencao registrada</div>`;
  rec.slice(0,5).forEach(hh=>{h+=`<div class="card" style="cursor:pointer;padding:14px 16px" onclick="openDetail(${hh.eid})"><div class="card-top"><span class="badge b-gray">${fmtDate(hh.data)}</span>${hh.quem?`<span class="badge b-purple"><i class="ti ti-tool" style="font-size:10px"></i>${esc(hh.quem)}</span>`:''}</div><div class="card-title" style="font-size:15px">${esc(hh.equip)}</div><div style="font-size:13px;color:var(--muted);margin-top:2px">${esc(hh.desc.substring(0,90))}${hh.desc.length>90?'...':''}</div></div>`;});
  return h;
}

function renderEquip(){
  const lista=filteredEquip();
  const tops=S.tipos.map(t=>`<option value="${esc(t)}"${S.filterTipo===t?' selected':''}>${esc(t)}</option>`).join('');
  let h=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px"><div class="page-title" style="margin-bottom:0">Equipamentos</div><button class="btn btn-p" onclick="openNewEquip()"><i class="ti ti-plus"></i>Novo equipamento</button></div>
  <div class="filter-bar"><input class="inp" id="search-equip" placeholder="Nome, numero, setor, marca..." value="${esc(S.search)}" oninput="S.search=this.value;render()"><select class="inp" onchange="S.filterTipo=this.value;render()"><option value="">Todos os tipos</option>${tops}</select></div>
  <div style="font-size:12px;color:var(--muted);margin-bottom:12px;font-weight:500">${lista.length} equipamento(s)</div>
  <div class="card" style="padding:8px 12px">`;
  if(!lista.length)h+=`<div class="empty"><i class="ti ti-tool"></i>Nenhum encontrado</div>`;
  lista.forEach(e=>{
    const ult=e.historico.length?e.historico[e.historico.length-1]:null;
    h+=`<div class="eq-row" onclick="openDetail(${e.id})">
      <div class="eq-num">#${e.num}</div>
      <div class="eq-info">
        <div class="eq-name">${esc(e.nome)}</div>
        <div class="eq-meta">${esc(e.setor)}${e.marca?' - '+esc(e.marca):''}</div>
        <div class="eq-tags">
          ${e.lojas.map(l=>`<span class="badge b-loja">${LOJAS[l]}</span>`).join('')}
          ${e.tipo?`<span class="badge b-tipo">${esc(e.tipo)}</span>`:''}
          ${e.obs?`<span class="badge b-gray">${esc(e.obs)}</span>`:''}
          ${e.status==='problema'?`<span class="badge b-problema"><i class="ti ti-alert-triangle" style="font-size:10px"></i>Com problema</span>`:''}
          ${e.historico.length?`<span class="badge b-gray"><i class="ti ti-history" style="font-size:10px"></i>${e.historico.length} manut.</span>`:''}
        </div>
        ${ult?`<div style="font-size:11px;color:var(--muted);margin-top:4px">Ultima: ${fmtDate(ult.data)} - ${esc(ult.desc.substring(0,50))}${ult.desc.length>50?'...':''}</div>`:''}
      </div>
      <i class="ti ti-chevron-right" style="color:#ccc;font-size:16px;flex-shrink:0;margin-top:10px"></i>
    </div>`;
  });
  h+=`</div>`;return h;
}

function renderPrev(){
  const lista=S.preventivas.filter(p=>S.loja==='all'||p.lojas.includes(S.loja));
  let h=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px"><div class="page-title" style="margin-bottom:0">Manutencoes Preventivas</div><button class="btn btn-p" onclick="openNewPrev()"><i class="ti ti-plus"></i>Nova preventiva</button></div>`;
  if(!lista.length)h+=`<div class="empty"><i class="ti ti-calendar-check"></i>Nenhuma preventiva</div>`;
  lista.forEach(p=>{
    const d=diasProxima(p),cls=d===null?'b-ok':d<=0?'b-bad':d<=14?'b-warn':'b-ok',txt=d===null?'Sem data':d<0?`Vencida ha ${Math.abs(d)} dias`:d===0?'Vence hoje':`Proxima em ${d} dias`,icon=d===null||d>14?'ti-circle-check':d<=0?'ti-alert-circle':'ti-clock-exclamation';
    h+=`<div class="card"><div class="card-top"><span class="badge ${cls}"><i class="ti ${icon}" style="font-size:11px"></i>${txt}</span>${p.lojas.map(l=>`<span class="badge b-loja">${LOJAS[l]}</span>`).join('')}<span class="badge b-gray">A cada ${freqLabel(p.frequenciaDias)}</span></div><div class="card-title" style="font-size:16px;cursor:default">${esc(p.nome)}</div>${p.obs?`<div style="font-size:13px;color:var(--muted);margin-bottom:8px">${esc(p.obs)}</div>`:'<div style="margin-bottom:8px"></div>'}<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">${p.ultimaData?`<div style="font-size:12px;color:var(--muted)">Ultima realizacao: ${fmtDate(p.ultimaData)}</div>`:''}<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn btn-sm btn-outline" onclick="openEditPrev(${p.id})"><i class="ti ti-edit"></i>Editar</button><button class="btn btn-sm" style="background:#FEE2E2;border-color:#e0a0a0;color:#C0392B" onclick="delPrev(${p.id})"><i class="ti ti-trash"></i>Excluir</button><button class="btn btn-sm btn-p" onclick="markPrev(${p.id})"><i class="ti ti-check"></i>Marcar como realizada</button></div></div></div>`;
  });
  return h;
}

function renderDesc(){
  let h=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px"><div class="page-title" style="margin-bottom:0">Equipamentos Descartados</div><button class="btn btn-p" onclick="openNewDesc()"><i class="ti ti-plus"></i>Registrar descarte</button></div>`;
  if(!S.descartes.length)h+=`<div class="empty"><i class="ti ti-trash"></i>Nenhum descarte</div>`;
  S.descartes.forEach(d=>{h+=`<div class="card"><div class="card-top"><span class="badge b-bad"><i class="ti ti-trash" style="font-size:10px"></i>Descartado</span>${d.data?`<span class="badge b-gray">${fmtDate(d.data)}</span>`:''}</div><div class="card-title" style="font-size:16px;cursor:default">${esc(d.nome)}</div><div style="font-size:13px;color:var(--muted)">${[d.marca,d.motivo].filter(Boolean).map(esc).join(' - ')}</div>${d.obs?`<div style="font-size:12px;color:var(--muted);margin-top:4px">${esc(d.obs)}</div>`:''}</div>`;});
  return h;
}

function renderCont(){
  let h=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px"><div class="page-title" style="margin-bottom:0">Contatos de Fornecedores</div><button class="btn btn-p" onclick="openNewCont()"><i class="ti ti-plus"></i>Novo contato</button></div><div class="card" style="padding:8px 12px">`;
  S.contatos.forEach(c=>{h+=`<div class="eq-row" style="cursor:default"><div class="cont-icon"><i class="ti ti-user"></i></div><div class="eq-info"><div class="eq-name">${esc(c.nome)}</div><div class="eq-meta">${esc(c.especialidade)}</div><div style="font-size:13px;color:var(--red);font-weight:600;margin-top:3px">${esc(c.tel)}</div>${c.obs?`<div style="font-size:11px;color:var(--muted);margin-top:2px">${esc(c.obs)}</div>`:''}</div></div>`;});
  h+=`</div>`;return h;
}

function openModal(html){closeModal();const bd=document.createElement('div');bd.className='modal-bd';bd.id='modal-bd';bd.innerHTML='<div class="modal">'+html+'</div>';bd.addEventListener('click',function(e){if(e.target===bd)closeModal();});document.getElementById('app').appendChild(bd);}
function closeModal(){const m=document.getElementById('modal-bd');if(m)m.remove();}

function openDetail(id){
  const e=S.equipamentos.find(x=>x.id===id);if(!e)return;
  const fotos=e.fotos||[];
  const histHtml=[...e.historico].reverse().map(function(h,ri){
    const oi=e.historico.length-1-ri;
    return '<div class="hist-item"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><span class="badge b-gray">'+fmtDate(h.data)+'</span>'+(h.quem?'<span class="badge b-purple"><i class="ti ti-tool" style="font-size:10px"></i>'+esc(h.quem)+'</span>':'')+(h.garantia?'<span class="badge b-ok">Garantia: '+esc(h.garantia)+'</span>':'')+'</div><div style="display:flex;gap:5px;flex-shrink:0"><button class="btn btn-sm btn-outline" onclick="openEditManut('+id+','+oi+')"><i class="ti ti-edit"></i> Editar</button><button class="btn btn-sm btn-d" onclick="delManut('+id+','+oi+')"><i class="ti ti-trash"></i> Excluir</button></div></div><div style="margin:6px 0;font-size:13px;font-weight:500">'+esc(h.desc)+'</div><div class="hdate">'+[h.custo?'R$ '+h.custo:'',h.nf?'NF: '+esc(h.nf):''].filter(Boolean).join(' - ')+'</div></div>';
  }).join('');
  const btnProblema = e.status==='problema'
    ? '<button class="btn" style="background:#DFFAE8;border-color:#3A9B57;color:#1A6636" onclick="resolverProblema('+id+')"><i class="ti ti-circle-check"></i>Marcar resolvido</button>'
    : '<button class="btn" style="background:#FFF0CC;border-color:#EF9F27;color:#7A4F00" onclick="reportarProblema('+id+')"><i class="ti ti-alert-triangle"></i>Reportar problema</button>';
  openModal(
    '<div class="mtitle"><span>#'+e.num+' '+esc(e.nome)+'</span>'+
    '<div style="display:flex;gap:6px;flex-shrink:0">'+
    '<button class="btn btn-sm btn-outline" onclick="closeModal();openEditEquip('+id+')"><i class="ti ti-edit"></i>Editar</button>'+
    '<button class="btn btn-sm btn-icon" onclick="closeModal()"><i class="ti ti-x"></i></button>'+

function addPhotos(id,input){
  const e=S.equipamentos.find(x=>x.id===id);if(!e)return;if(!e.fotos)e.fotos=[];
  const files=Array.from(input.files);if(!files.length)return;
  showToast('Enviando foto(s)...');
  (async function(){
    try{
      for(const f of files){
        var ext=(f.name&&f.name.indexOf('.')>=0?f.name.split('.').pop():'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
        var path='manutencoes/'+id+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.'+ext;
        var up=await fetch(SB_URL+'/storage/v1/object/anexos/'+path,{method:'POST',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':f.type||'application/octet-stream','x-upsert':'true'},body:f});
        if(!up.ok)throw new Error(await up.text());
        e.fotos.push(SB_URL+'/storage/v1/object/public/anexos/'+path);
      }
      await saveFotos(e);showToast('Fotos salvas!');openDetail(id);
    }catch(err){showToast('Erro ao salvar fotos',true);console.error(err);}
  })();
}

  openModal(

    '<button class="btn btn-sm btn-icon" onclick="closeModal()"><i class="ti ti-x"></i></button></div>'+
    '<div style="background:#FFF8EC;border:1.5px solid #EF9F27;border-radius:10px;padding:12px;margin-bottom:14px;font-size:13px;color:#7A4F00">'+
    '<b>#'+e.num+' '+esc(e.nome)+'</b> &mdash; '+esc(e.setor)+'</div>'+
    '<div class="fr full"><label class="lbl">Descricao do problema *</label>'+
    '<textarea class="input" id="rp-desc" rows="3" placeholder="Ex: Freezer nao esta gelando, fazendo barulho..."></textarea></div>'+
    '<div class="fr">'+
    '<div><label class="lbl">Responsavel</label><input class="input" id="rp-resp" placeholder="Nome do responsavel"></div>'+
    '<div><label class="lbl">Prazo</label><input class="input" type="date" id="rp-prazo"></div>'+
    '</div>'+
    '<div style="background:var(--bg);border-radius:10px;padding:10px;font-size:12px;color:var(--muted);margin-bottom:8px">'+
    '<i class="ti ti-info-circle"></i> Vai marcar o equipamento com problema no Painel e criar uma tarefa no app Lola.</div>'+
    '<div style="margin-top:16px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--border);padding-top:14px">'+
    '<button class="btn" onclick="closeModal()">Cancelar</button>'+
    '<button class="btn" style="background:#EF9F27;border-color:#EF9F27;color:#fff" onclick="salvarProblema('+id+')">'+
    '<i class="ti ti-alert-triangle"></i>Reportar e criar tarefa</button>'+
    '</div>'
  );
}

async function salvarProblema(id){
  const desc=document.getElementById('rp-desc').value.trim();
  if(!desc){alert('Descreva o problema');return;}
  const e=S.equipamentos.find(x=>x.id===id);
  const resp=document.getElementById('rp-resp').value.trim();
  const prazo=document.getElementById('rp-prazo').value;
  e.status='problema';
  try{
    await saveStatusHist(e);
    const tarefa={
      ata_id:null,
      texto:'Manutencao necessaria: #'+e.num+' '+e.nome+' ('+e.setor+') - '+desc,
      responsavel:resp||null,
      done:false,
      obs:'Reportado via app de Manutencoes.',
      prazo:prazo||null,
      status:'pendente',
      criado_por_nome:'App Manutencoes',
      criado_por_id:'manutencoes'
    };
    await sbFetch('lola_tasks',{method:'POST',body:tarefa,prefer:'return=representation'});
    showToast('Problema reportado e tarefa criada no Lola!');
    closeModal();
    render();
  }catch(err){
    showToast('Erro: '+err.message,true);
    console.error(err);
  }
}

async function resolverProblema(id){
  const e=S.equipamentos.find(x=>x.id===id);
  if(!confirm('Marcar "'+e.nome+'" como resolvido?'))return;
  e.status='ativo';
  try{await saveStatusHist(e);showToast('Problema resolvido!');closeModal();render();}
  catch(err){showToast('Erro ao salvar',true);}
}

loadAll();

(function(){
  var q=new URLSearchParams(location.search);
  if(q.get('embed')!=='1') return;
  var st=document.createElement('style');
  st.textContent='.embed .app{max-width:100%!important;box-shadow:none!important}';
  document.head.appendChild(st);
  document.body.classList.add('embed');
  function go(pg){ if(pg&&typeof setTab==='function'){ try{ setTab(pg); }catch(e){} } }
  window.addEventListener('message',function(e){ var d=(e&&e.data)||{}; if(d.type==='lola-nav'&&d.page) go(d.page); });
  var pg=q.get('page');
  if(pg){ var n=0,iv=setInterval(function(){ n++; go(pg); if((typeof S!=='undefined'&&S.tab===pg)||n>15) clearInterval(iv); },200); }
  try{ if(window.parent&&window.parent!==window) window.parent.postMessage({type:'lola-ready'},'*'); }catch(_){}
})();
