<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fichas de Assunto · Lola (teste)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--vinho:#A8272A;--vinho-deep:#7C1A1C;--vinho-pale:#F9ECEC;--vinho-muted:#DDB8B8;
    --cream:#FDFAF7;--border:#E8D8D8;--ink:#1E0A0A;--muted:#9A7070;--radius:14px;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;background:var(--cream);color:var(--ink);}
  header{background:#fff;border-bottom:3px solid var(--vinho);padding:14px 24px;position:sticky;top:0;z-index:30;
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;box-shadow:0 2px 10px rgba(168,39,42,.08)}
  header h1{font-family:'Playfair Display',serif;font-style:italic;color:var(--vinho-deep);font-size:1.5rem}
  header .sub{color:var(--muted);font-size:.78rem;margin-top:2px}
  .wrap{max-width:1100px;margin:0 auto;padding:18px 22px 60px}
  .btn{border:0;border-radius:10px;padding:9px 14px;font-size:.85rem;font-weight:600;cursor:pointer;font-family:inherit}
  .btn-primary{background:var(--vinho);color:#fff}
  .btn-primary:hover{background:var(--vinho-deep)}
  .btn-ghost{background:var(--vinho-pale);color:var(--vinho);border:1.5px solid var(--vinho-muted)}
  .btn-ghost:hover{background:var(--vinho-muted)}
  .btn-sm{padding:5px 9px;font-size:.76rem;border-radius:8px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0 14px}
  .toolbar input,.toolbar select{font-family:inherit;font-size:.83rem;padding:8px 10px;border:1.5px solid var(--border);
    border-radius:9px;background:#fff;color:var(--ink)}
  .toolbar input[type=search]{min-width:220px;flex:1}
  .count{font-size:.78rem;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
  .card{background:#fff;border:1.5px solid var(--border);border-radius:var(--radius);padding:15px 16px;display:flex;flex-direction:column;gap:8px;transition:box-shadow .2s,border-color .2s}
  .card:hover{box-shadow:0 4px 18px rgba(168,39,42,.10)}
  .card.flash{border-color:var(--vinho);box-shadow:0 0 0 3px var(--vinho-pale)}
  .card h3{font-size:1.02rem;color:var(--vinho-deep);line-height:1.25}
  .meta{font-size:.72rem;color:var(--muted)}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chip{font-size:.7rem;padding:3px 9px;border-radius:20px;border:1px solid var(--border);background:var(--cream);cursor:pointer;white-space:nowrap}
  .chip.cat{background:var(--vinho-pale);border-color:var(--vinho-muted);color:var(--vinho-deep);font-weight:600}
  .chip.tag{background:#eef4ff;border-color:#cdddf7;color:#27508f}
  .chip.resp{background:#f0f7f0;border-color:#cfe6cf;color:#2d6a4f;cursor:default}
  .chip.active{outline:2px solid var(--vinho)}
  .conteudo{font-size:.82rem;color:#5a4444;white-space:pre-wrap;max-height:4.6em;overflow:hidden;position:relative}
  .conteudo.open{max-height:none}
  .vermais{font-size:.72rem;color:var(--vinho);cursor:pointer;font-weight:600}
  .rel{font-size:.76rem;color:var(--muted)}
  .rel a{color:var(--vinho);cursor:pointer;text-decoration:none;font-weight:600}
  .rel a:hover{text-decoration:underline}
  .cardfoot{display:flex;gap:6px;justify-content:flex-end;margin-top:2px}
  .ataGroup{margin-bottom:22px}
  .ataGroup>h2{font-size:.95rem;color:var(--vinho-deep);border-bottom:2px solid var(--vinho-pale);padding-bottom:5px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline}
  .ataGroup>h2 span{font-size:.72rem;color:var(--muted);font-weight:400}
  /* modal */
  .ov{position:fixed;inset:0;background:rgba(30,10,10,.45);display:none;align-items:flex-start;justify-content:center;z-index:60;overflow-y:auto;padding:30px 14px}
  .ov.show{display:flex}
  .modal{background:#fff;border-radius:16px;max-width:620px;width:100%;padding:20px 22px;box-shadow:0 18px 50px rgba(0,0,0,.3)}
  .modal h2{font-family:'Playfair Display',serif;font-style:italic;color:var(--vinho-deep);font-size:1.25rem;margin-bottom:12px}
  .fld{margin-bottom:12px}
  .fld label{display:block;font-size:.7rem;font-weight:700;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
  .fld input[type=text],.fld select,.fld textarea{width:100%;font-family:inherit;font-size:.86rem;padding:9px 11px;border:1.5px solid var(--border);border-radius:9px;background:#fff;color:var(--ink)}
  .fld textarea{min-height:90px;resize:vertical}
  .pick{display:flex;flex-wrap:wrap;gap:6px}
  .pick .opt{font-size:.76rem;padding:5px 11px;border-radius:20px;border:1.5px solid var(--border);background:var(--cream);cursor:pointer;user-select:none}
  .pick .opt.on{background:var(--vinho);border-color:var(--vinho);color:#fff;font-weight:600}
  .modalfoot{display:flex;justify-content:space-between;gap:8px;margin-top:8px}
  .hint{font-size:.72rem;color:var(--muted);margin-top:3px}
  .empty{text-align:center;color:var(--muted);padding:50px 10px}
  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:9px 18px;border-radius:9px;font-size:.83rem;z-index:9999;transition:transform .3s;pointer-events:none}
  #toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<header>
  <div>
    <h1>Fichas de Assunto</h1>
    <div class="sub">Protótipo de teste · cada assunto vira uma ficha classificável · dados reais do portal</div>
  </div>
  <div style="display:flex;gap:8px;align-items:center">
    <button class="btn btn-ghost" id="btnAgrupar" onclick="toggleAgrupar()">🗂️ Agrupar por ata</button>
    <button class="btn btn-primary" onclick="novaFicha()">➕ Nova ficha</button>
  </div>
</header>

<div class="wrap">
  <div class="toolbar">
    <input type="search" id="q" placeholder="🔍 Buscar por título, conteúdo, tag, responsável..." oninput="render()">
    <select id="fcat" onchange="render()"><option value="">Categoria: todas</option></select>
    <select id="ftag" onchange="render()"><option value="">#tag: todas</option></select>
    <select id="fresp" onchange="render()"><option value="">Responsável: todos</option></select>
    <button class="btn btn-ghost btn-sm" onclick="limpar()">Limpar filtros</button>
    <span class="count" id="count"></span>
  </div>
  <div id="lista"><div class="empty">Carregando fichas…</div></div>
</div>

<!-- Modal -->
<div class="ov" id="ov">
  <div class="modal">
    <h2 id="mTitulo">Nova ficha de assunto</h2>
    <div class="fld"><label>Título do assunto</label><input type="text" id="mNome" placeholder="Ex.: Solução cúpula na chuva"></div>
    <div class="fld"><label>Ata de origem</label><select id="mAta"></select></div>
    <div class="fld"><label>Categorias</label><div class="pick" id="mCats"></div></div>
    <div class="fld"><label>Responsáveis</label><div class="pick" id="mResp"></div></div>
    <div class="fld"><label>#Tags</label><input type="text" id="mTags" placeholder="Ex.: cupula chuva manutencao"><div class="hint">Separe por espaço ou vírgula. O # é opcional.</div></div>
    <div class="fld"><label>Assuntos relacionados</label><select id="mRel" multiple size="5" style="height:auto"></select><div class="hint">Segure Ctrl (ou Cmd) para escolher vários.</div></div>
    <div class="fld"><label>Conteúdo / anotações</label><textarea id="mConteudo" placeholder="Detalhes, decisões, observações..."></textarea></div>
    <div class="modalfoot">
      <button class="btn btn-ghost btn-sm" id="mDel" onclick="delAtual()" style="color:#C0392B;visibility:hidden">🗑 Excluir</button>
      <div style="display:flex;gap:8px">
        <button class="btn btn-ghost" onclick="fecharModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="salvarFicha()">💾 Salvar</button>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
var SB_URL="https://mvjbsdpfjhywhaonvpfl.supabase.co";
var SB_KEY="sb_publishable_VMJzYe1AwL9zEoFs-ljUIw_OOkDpqhy";
var sb=window.supabase.createClient(SB_URL,SB_KEY);

var CATS=["Avulsa","Cozinha","Eventos","Manutenções","Recorrente","Reunião de Liderança","RH"];
var TEAM=["Artur","Bianca","Bruna Intelecta","Bruno","Charles","Dudinha","Fernanda","Giulia","Intelecta","Juliana","Luana","Lucas","Mahara","Paola","Tatiane Intelecta"];

var ASSUNTOS=[], ATAS={}, ATAS_LIST=[], AGRUPAR=false, EDIT=null;
var _selCats=[], _selResp=[];

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function norm(s){ return String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(function(){t.classList.remove('show');},2200); }
function arr(v){ return Array.isArray(v)?v:(v?[v]:[]); }
function fmtDate(d){ if(!d)return''; var p=String(d).slice(0,10).split('-'); return p.length===3?(p[2]+'/'+p[1]+'/'+p[0]):d; }
function ataLabel(id){ var a=ATAS[id]; return a?(a.title+(a.date?(' · '+fmtDate(a.date)):'')):''; }

async function load(){
  try{
    var ats=await sb.from('lola_atas').select('id,title,date,categoria').order('date',{ascending:false,nullsFirst:false});
    ATAS_LIST=ats.data||[]; ATAS={}; ATAS_LIST.forEach(function(a){ATAS[a.id]=a;});
    var as=await sb.from('lola_assuntos').select('*').order('updated_at',{ascending:false});
    ASSUNTOS=as.data||[];
  }catch(e){ document.getElementById('lista').innerHTML='<div class="empty">Erro ao carregar: '+esc(e.message||e)+'</div>'; return; }
  popularFiltros(); render();
}

function allTags(){ var s={}; ASSUNTOS.forEach(function(f){ arr(f.tags).forEach(function(t){ if(t)s[t]=1; }); }); return Object.keys(s).sort(); }

function popularFiltros(){
  var fcat=document.getElementById('fcat'); fcat.innerHTML='<option value="">Categoria: todas</option>'+CATS.map(function(c){return '<option>'+esc(c)+'</option>';}).join('');
  var ftag=document.getElementById('ftag'); ftag.innerHTML='<option value="">#tag: todas</option>'+allTags().map(function(t){return '<option value="'+esc(t)+'">#'+esc(t)+'</option>';}).join('');
  var fresp=document.getElementById('fresp'); fresp.innerHTML='<option value="">Responsável: todos</option>'+TEAM.map(function(p){return '<option>'+esc(p)+'</option>';}).join('');
}

function filtered(){
  var q=norm(document.getElementById('q').value);
  var cat=document.getElementById('fcat').value;
  var tag=document.getElementById('ftag').value;
  var resp=document.getElementById('fresp').value;
  return ASSUNTOS.filter(function(f){
    if(cat && arr(f.categorias).indexOf(cat)<0) return false;
    if(tag && arr(f.tags).indexOf(tag)<0) return false;
    if(resp && arr(f.responsaveis).indexOf(resp)<0) return false;
    if(q){
      var blob=norm([f.titulo,f.conteudo,ataLabel(f.ata_id),arr(f.tags).join(' '),arr(f.responsaveis).join(' '),arr(f.categorias).join(' ')].join(' '));
      if(blob.indexOf(q)<0) return false;
    }
    return true;
  });
}

function cardHTML(f){
  var cats=arr(f.categorias).map(function(c){return '<span class="chip cat" onclick="setFiltro(\'cat\',\''+esc(c).replace(/'/g,"\\'")+'\')">'+esc(c)+'</span>';}).join('');
  var tags=arr(f.tags).map(function(t){return '<span class="chip tag" onclick="setFiltro(\'tag\',\''+esc(t).replace(/'/g,"\\'")+'\')">#'+esc(t)+'</span>';}).join('');
  var resp=arr(f.responsaveis).map(function(r){return '<span class="chip resp">'+esc(r)+'</span>';}).join('');
  var rel=arr(f.relacionados).map(function(id){ var r=ASSUNTOS.find(function(x){return x.id==id;}); return r?('<a onclick="focar('+r.id+')">'+esc(r.titulo)+'</a>'):''; }).filter(Boolean).join(' · ');
  var cont=f.conteudo?('<div class="conteudo" id="c'+f.id+'">'+esc(f.conteudo)+'</div><span class="vermais" onclick="document.getElementById(\'c'+f.id+'\').classList.toggle(\'open\');this.textContent=this.textContent==\'ver mais\'?\'ver menos\':\'ver mais\'">ver mais</span>'):'';
  return '<div class="card" id="f'+f.id+'">'
    +'<h3>'+esc(f.titulo||'(sem título)')+'</h3>'
    +(f.ata_id?'<div class="meta">📋 '+esc(ataLabel(f.ata_id))+'</div>':'')
    +(cats?'<div class="chips">'+cats+'</div>':'')
    +(resp?'<div class="chips">'+resp+'</div>':'')
    +(tags?'<div class="chips">'+tags+'</div>':'')
    +cont
    +(rel?'<div class="rel">🔗 Relacionados: '+rel+'</div>':'')
    +'<div class="cardfoot"><button class="btn btn-ghost btn-sm" onclick="editFicha('+f.id+')">✏️ Editar</button></div>'
    +'</div>';
}

function render(){
  var lst=filtered();
  document.getElementById('count').textContent=lst.length+' ficha(s)';
  var box=document.getElementById('lista');
  if(!lst.length){ box.innerHTML='<div class="empty">Nenhuma ficha com esse filtro.</div>'; return; }
  if(AGRUPAR){
    var groups={}, order=[];
    lst.forEach(function(f){ var k=f.ata_id||'_'; if(!groups[k]){groups[k]=[];order.push(k);} groups[k].push(f); });
    order.sort(function(a,b){ var da=(ATAS[a]&&ATAS[a].date)||''; var db=(ATAS[b]&&ATAS[b].date)||''; return db.localeCompare(da); });
    box.innerHTML=order.map(function(k){
      var titulo=k==='_'?'Sem ata de origem':esc(ataLabel(k)||('Ata '+k));
      return '<div class="ataGroup"><h2>'+titulo+'<span>'+groups[k].length+' assunto(s)</span></h2><div class="grid">'+groups[k].map(cardHTML).join('')+'</div></div>';
    }).join('');
  } else {
    box.innerHTML='<div class="grid">'+lst.map(cardHTML).join('')+'</div>';
  }
}

function setFiltro(tipo,val){
  if(tipo==='cat'){ document.getElementById('fcat').value=val; }
  if(tipo==='tag'){ document.getElementById('ftag').value=val; }
  render(); window.scrollTo({top:0,behavior:'smooth'});
}
function limpar(){ document.getElementById('q').value=''; document.getElementById('fcat').value=''; document.getElementById('ftag').value=''; document.getElementById('fresp').value=''; render(); }
function toggleAgrupar(){ AGRUPAR=!AGRUPAR; document.getElementById('btnAgrupar').classList.toggle('btn-primary',AGRUPAR); document.getElementById('btnAgrupar').classList.toggle('btn-ghost',!AGRUPAR); render(); }

function focar(id){
  AGRUPAR=false; limpar();
  setTimeout(function(){
    var el=document.getElementById('f'+id);
    if(el){ el.scrollIntoView({behavior:'smooth',block:'center'}); el.classList.add('flash'); setTimeout(function(){el.classList.remove('flash');},1800); }
  },60);
}

// ---- modal ----
function pickHTML(containerId,opts,sel){
  document.getElementById(containerId).innerHTML=opts.map(function(o){return '<span class="opt'+(sel.indexOf(o)>=0?' on':'')+'" data-v="'+esc(o)+'">'+esc(o)+'</span>';}).join('');
  Array.prototype.forEach.call(document.getElementById(containerId).querySelectorAll('.opt'),function(el){
    el.onclick=function(){ var v=el.getAttribute('data-v'); var i=sel.indexOf(v); if(i>=0)sel.splice(i,1); else sel.push(v); el.classList.toggle('on'); };
  });
}
function fillAtaSelect(val){
  document.getElementById('mAta').innerHTML='<option value="">— nenhuma —</option>'+ATAS_LIST.map(function(a){return '<option value="'+a.id+'"'+(String(val)==String(a.id)?' selected':'')+'>'+esc(a.title)+(a.date?(' ('+fmtDate(a.date)+')'):'')+'</option>';}).join('');
}
function fillRelSelect(excludeId,selIds){
  selIds=selIds||[];
  document.getElementById('mRel').innerHTML=ASSUNTOS.filter(function(f){return f.id!=excludeId;}).map(function(f){return '<option value="'+f.id+'"'+(selIds.map(String).indexOf(String(f.id))>=0?' selected':'')+'>'+esc(f.titulo)+'</option>';}).join('');
}
function novaFicha(){
  EDIT=null; _selCats=[]; _selResp=[];
  document.getElementById('mTitulo').textContent='Nova ficha de assunto';
  document.getElementById('mNome').value=''; document.getElementById('mTags').value=''; document.getElementById('mConteudo').value='';
  fillAtaSelect(''); pickHTML('mCats',CATS,_selCats); pickHTML('mResp',TEAM,_selResp); fillRelSelect(null,[]);
  document.getElementById('mDel').style.visibility='hidden';
  document.getElementById('ov').classList.add('show');
}
function editFicha(id){
  var f=ASSUNTOS.find(function(x){return x.id==id;}); if(!f)return;
  EDIT=f.id; _selCats=arr(f.categorias).slice(); _selResp=arr(f.responsaveis).slice();
  document.getElementById('mTitulo').textContent='Editar ficha';
  document.getElementById('mNome').value=f.titulo||'';
  document.getElementById('mTags').value=arr(f.tags).join(' ');
  document.getElementById('mConteudo').value=f.conteudo||'';
  fillAtaSelect(f.ata_id||''); pickHTML('mCats',CATS,_selCats); pickHTML('mResp',TEAM,_selResp); fillRelSelect(f.id,arr(f.relacionados));
  document.getElementById('mDel').style.visibility='visible';
  document.getElementById('ov').classList.add('show');
}
function fecharModal(){ document.getElementById('ov').classList.remove('show'); }
function parseTags(s){ return (s||'').split(/[\s,]+/).map(function(t){return t.replace(/^#/,'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');}).filter(function(t){return t.length>0;}).filter(function(t,i,a){return a.indexOf(t)===i;}); }
function relSelected(){ var s=document.getElementById('mRel'); return Array.prototype.map.call(s.selectedOptions,function(o){return parseInt(o.value);}); }

async function salvarFicha(){
  var titulo=document.getElementById('mNome').value.trim();
  if(!titulo){ toast('Dê um título ao assunto.'); return; }
  var atav=document.getElementById('mAta').value;
  var p={ titulo:titulo, ata_id:atav?parseInt(atav):null, categorias:_selCats.slice(), responsaveis:_selResp.slice(),
          tags:parseTags(document.getElementById('mTags').value), relacionados:relSelected(),
          conteudo:document.getElementById('mConteudo').value, updated_at:new Date().toISOString() };
  try{
    if(EDIT){ var u=await sb.from('lola_assuntos').update(p).eq('id',EDIT); if(u.error)throw u.error; }
    else{ var i=await sb.from('lola_assuntos').insert(p); if(i.error)throw i.error; }
    fecharModal(); await load(); toast('✓ Salvo');
  }catch(e){ toast('Erro ao salvar: '+(e.message||e)); }
}
async function delAtual(){
  if(!EDIT)return; if(!confirm('Excluir esta ficha de assunto?'))return;
  try{ var d=await sb.from('lola_assuntos').delete().eq('id',EDIT); if(d.error)throw d.error; fecharModal(); await load(); toast('Ficha excluída'); }
  catch(e){ toast('Erro ao excluir'); }
}
function delFicha(id){ EDIT=id; delAtual(); }

document.getElementById('ov').addEventListener('click',function(e){ if(e.target===this)fecharModal(); });
load();
</script>
</body>
</html>
