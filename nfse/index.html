<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lola · Emissão de Notas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/duotone/style.css">
<style>
  :root{
    --creme:#FBF7F1; --card:#FFFFFF; --borda:#ECE3D9; --fio:#F0E9E0;
    --vinho:#A82A2A; --vinho2:#7E1E1F; --vinhoBg:#FBEAE7;
    --t1:#2A1A17; --t2:#5A463E; --t3:#92837B; --rotulo:#B79A8E;
    --verde-bg:#E6F3EA; --verde:#2C7A4B;
    --ambar-bg:#FBF0DD; --ambar:#9A6B1E;
    --azul-bg:#E6EEF8; --azul:#2C5AA0;
    --cinza-bg:#EFEAE4; --cinza:#7a655c;
    --sombra:0 1px 2px rgba(42,26,23,.05), 0 12px 26px -16px rgba(42,26,23,.22);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--creme)}
  body{font-family:'Manrope',system-ui,sans-serif;color:var(--t1);-webkit-font-smoothing:antialiased;padding-bottom:40px}
  .fr{font-family:'Fraunces',serif;font-weight:600}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px}
  a{color:inherit;text-decoration:none}

  .head{padding:16px 0 4px}
  .head .row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;min-height:44px;gap:10px}
  .pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--borda);
    color:var(--vinho2);font-weight:600;font-size:13.5px;padding:9px 14px;border-radius:20px;cursor:pointer}
  .pill i{font-size:16px}
  .htitle{font-family:'Fraunces',serif;font-weight:600;font-size:26px;color:var(--vinho2);line-height:1.1}
  .hsub{font-size:12.5px;color:var(--t2);margin-top:4px}

  .tabs{display:flex;gap:7px;margin:14px 0 4px;flex-wrap:wrap}
  .tab{flex:1;min-width:92px;text-align:center;background:var(--card);border:1px solid var(--borda);color:var(--t2);
    font-weight:600;font-size:13.5px;padding:10px 8px;border-radius:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
  .tab i{font-size:16px}
  .tab.on{background:var(--vinho);color:#fff;border-color:var(--vinho)}

  .sec-label{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;letter-spacing:.5px;
    color:var(--rotulo);text-transform:uppercase;margin:20px 2px 10px}
  .sec-label i{font-size:14px}

  .card{background:var(--card);border:1px solid var(--borda);border-radius:18px;box-shadow:var(--sombra)}
  .nota-card{padding:13px 15px;margin-bottom:10px;cursor:pointer}
  .nota-card .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .nota-card .nome{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nota-card .meta{font-size:12.5px;color:var(--t2);margin-top:5px;display:flex;flex-wrap:wrap;gap:4px 14px}
  .nota-card .meta i{margin-right:4px;color:var(--t3)}
  .valor{font-family:'Fraunces',serif;font-weight:600;font-size:16px;white-space:nowrap}

  .stt{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
  .stt.preparar{background:var(--ambar-bg);color:var(--ambar)}
  .stt.emitida{background:var(--verde-bg);color:var(--verde)}
  .stt.cancelada{background:var(--cinza-bg);color:var(--cinza)}

  .cli-card{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:9px}
  .cli-card .av{width:38px;height:38px;border-radius:12px;background:var(--vinhoBg);color:var(--vinho);
    display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 38px}
  .cli-card b{font-weight:700;font-size:14.5px;display:block}
  .cli-card small{font-size:12px;color:var(--t3)}
  .cli-card .edit{margin-left:auto;color:var(--vinho);font-size:19px;cursor:pointer}

  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;
    background:var(--vinho);color:#fff;font-weight:700;font-size:15px;border:none;border-radius:13px;cursor:pointer;font-family:inherit}
  .btn i{font-size:19px}
  .btn.ghost{background:transparent;color:var(--t2);border:1px solid var(--borda);font-weight:600}
  .btn.o{background:#fff;color:var(--vinho2);border:1px solid var(--borda);font-weight:600}
  .btn.d{background:#fff;color:var(--vinho);border:1px solid var(--vinho)}
  .btn+.btn{margin-top:9px}

  .dashed{border:1.5px dashed #D8CBBD;border-radius:13px;padding:12px;text-align:center;
    font-size:13.5px;font-weight:600;color:var(--vinho2);cursor:pointer;background:transparent;width:100%}
  .dashed i{margin-right:4px}

  .empty{text-align:center;color:var(--t3);font-size:13.5px;padding:30px 10px}
  .empty i{font-size:34px;display:block;margin-bottom:8px;color:var(--rotulo)}

  /* form */
  .fld{margin-top:12px}
  .fld label{display:block;font-size:11.5px;font-weight:700;color:var(--rotulo);text-transform:uppercase;letter-spacing:.3px;margin-bottom:5px}
  .fld input,.fld textarea,.fld select{width:100%;font-family:inherit;font-size:15px;color:var(--t1);background:var(--creme);
    border:1px solid var(--borda);border-radius:12px;padding:12px 13px;outline:none}
  .fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--vinho)}
  .fld textarea{min-height:76px;resize:vertical}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .hint{font-size:11.5px;color:var(--t3);margin-top:5px}
  .chkrow{display:flex;align-items:center;gap:9px;margin-top:12px;font-size:14px;color:var(--t2)}
  .chkrow input{width:20px;height:20px;accent-color:var(--vinho)}

  .calc{background:var(--creme);border:1px solid var(--borda);border-radius:13px;padding:12px 14px;margin-top:14px}
  .calc .cl{display:flex;justify-content:space-between;font-size:13.5px;padding:3px 0;color:var(--t2)}
  .calc .cl b{color:var(--t1)}
  .calc .cl.tot{border-top:1px solid var(--borda);margin-top:5px;padding-top:7px;font-size:15px}
  .calc .cl.tot b{font-family:'Fraunces',serif}

  /* sheet */
  .ov{position:fixed;inset:0;background:rgba(42,26,23,.42);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
  .ov.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:var(--creme);border-radius:22px 22px 0 0;z-index:41;
    transform:translateY(100%);transition:transform .25s cubic-bezier(.3,.8,.3,1);max-height:92vh;overflow-y:auto;
    box-shadow:0 -10px 40px -12px rgba(42,26,23,.4)}
  .sheet.on{transform:translateY(0)}
  .sheet .inner{max-width:560px;margin:0 auto;padding:8px 16px 28px}
  .grab{width:40px;height:4px;border-radius:999px;background:#E0D4C7;margin:10px auto 6px}
  .sheet h3{font-family:'Fraunces',serif;font-weight:600;font-size:21px;color:var(--vinho2);margin:6px 2px 2px}
  .sheet .sub{font-size:12.5px;color:var(--t2);margin:0 2px 6px}

  .resumo{background:#fff;border:1px solid var(--borda);border-radius:13px;padding:14px;white-space:pre-wrap;
    font-size:13px;line-height:1.5;color:var(--t1);font-family:ui-monospace,Menlo,Consolas,monospace;margin-top:10px}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--t1);color:#fff;
    padding:12px 20px;border-radius:999px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;z-index:60;max-width:90%;text-align:center}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  .load{text-align:center;color:var(--t3);font-size:13.5px;padding:28px}
  .errbox{background:var(--vinhoBg);border:1px solid #E7C3BE;color:var(--vinho2);border-radius:13px;padding:13px 15px;font-size:13px;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="row">
      <a class="pill" id="voltar"><i class="ph-duotone ph-caret-left"></i> Portal</a>
      <span class="pill" id="uinfo" style="color:var(--t2)"><i class="ph-duotone ph-user"></i> <span id="uname">—</span></span>
    </div>
    <div class="htitle">Emissão de Notas</div>
    <div class="hsub">NFS-e · prepare, registre e gere o resumo pra emitir no site da prefeitura</div>
  </div>

  <div class="tabs">
    <div class="tab on" data-tab="notas"><i class="ph-duotone ph-receipt"></i> Notas</div>
    <div class="tab" data-tab="nova"><i class="ph-duotone ph-plus-circle"></i> Nova nota</div>
    <div class="tab" data-tab="clientes"><i class="ph-duotone ph-users-three"></i> Clientes</div>
  </div>

  <div id="view"></div>
</div>

<div class="ov" id="ov"></div>
<div class="sheet" id="sheet"><div class="inner"><div class="grab"></div><div id="sheetBody"></div></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ========= Supabase ========= */
const SB_URL='https://mvjbsdpfjhywhaonvpfl.supabase.co';
const SB_KEY='sb_publishable_VMJzYe1AwL9zEoFs-ljUIw_OOkDpqhy';
const H={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'};
function api(path,opts){
  opts=opts||{}; const ctrl=new AbortController(); const to=setTimeout(()=>ctrl.abort(),12000);
  return fetch(SB_URL+'/rest/v1/'+path,Object.assign({headers:H,signal:ctrl.signal},opts))
    .then(async r=>{ if(!r.ok) throw new Error('HTTP '+r.status+' — '+(await r.text()).slice(0,160)); const t=await r.text(); return t?JSON.parse(t):null; })
    .finally(()=>clearTimeout(to));
}
const qp=new URLSearchParams(location.search);
const USER=qp.get('u')||'';

/* ========= estado ========= */
const ST={tab:'notas', notas:[], clientes:[], carregou:false, erro:null, edit:null};
const CFG=(function(){ try{return JSON.parse(localStorage.getItem('lola_nfse_cfg')||'{}')}catch(e){return {}} })();
function saveCfg(){ try{localStorage.setItem('lola_nfse_cfg',JSON.stringify(CFG))}catch(e){} }

/* ========= helpers ========= */
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function brl(v){ v=+v||0; return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function num(v){ if(v==null||v==='')return 0; return parseFloat(String(v).replace(/\./g,'').replace(',','.'))||0; }
function fmtData(d){ if(!d)return''; var p=String(d).slice(0,10).split('-'); return p.length===3?(p[2]+'/'+p[1]+'/'+p[0]):d; }
function hoje(){ return new Date().toISOString().slice(0,10); }
let toT; function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toT); toT=setTimeout(()=>t.classList.remove('on'),2600); }
function openSheet(html){ $('#sheetBody').innerHTML=html; $('#ov').classList.add('on'); $('#sheet').classList.add('on'); }
function closeSheet(){ $('#ov').classList.remove('on'); $('#sheet').classList.remove('on'); }
$('#ov').onclick=closeSheet;
window.closeSheet=closeSheet;

$('#uname').textContent=USER||'—';
$('#voltar').onclick=function(){ location.href='../'+(USER?('?u='+encodeURIComponent(USER)):''); };

/* ========= cálculo ========= */
function calcNota(n){
  const valor=+n.valor||0, ded=+n.deducoes||0, aliq=+n.iss_aliquota||0;
  const base=Math.max(0,valor-ded);
  const iss=+(base*aliq/100);
  const liquido=valor-(n.iss_retido?iss:0);
  return {base:base, iss:iss, liquido:liquido};
}

/* ========= carregar ========= */
async function carregar(){
  ST.erro=null;
  try{
    const [notas,cli]=await Promise.all([
      api('lola_nfse?select=*&order=created_at.desc'),
      api('lola_nfse_tomadores?select=*&ativo=eq.true&order=nome.asc')
    ]);
    ST.notas=notas||[]; ST.clientes=cli||[]; ST.carregou=true;
  }catch(e){ ST.erro=e.message; ST.carregou=true; }
  render();
}

/* ========= render ========= */
function render(){
  $$('.tab').forEach(t=>t.classList.toggle('on',t.dataset.tab===ST.tab));
  const v=$('#view');
  if(!ST.carregou){ v.innerHTML='<div class="load"><i class="ph-duotone ph-spinner"></i> Carregando…</div>'; return; }
  if(ST.erro){
    v.innerHTML='<div class="errbox"><b>Não consegui falar com o banco.</b><br>'+esc(ST.erro)+
      '<br><br>Se o app é novo, pode ser que as tabelas ainda não foram criadas. Avise a Bianca.</div>'+
      '<button class="btn ghost" style="margin-top:12px" onclick="carregar()"><i class=\"ph-duotone ph-arrow-clockwise\"></i> Tentar de novo</button>';
    return;
  }
  if(ST.tab==='notas') viewNotas(v);
  else if(ST.tab==='nova') viewForm(v,null);
  else viewClientes(v);
}

function viewNotas(v){
  const total=ST.notas.length;
  const prep=ST.notas.filter(n=>n.status==='preparar').length;
  let h='';
  h+='<div class="sec-label"><i class="ph-duotone ph-chart-pie-slice"></i> Resumo</div>';
  h+='<div class="card" style="padding:13px 15px;display:flex;gap:18px;flex-wrap:wrap">'+
       '<div><div style="font-size:11px;font-weight:700;color:var(--rotulo);text-transform:uppercase">Notas</div><div class="fr" style="font-size:22px">'+total+'</div></div>'+
       '<div><div style="font-size:11px;font-weight:700;color:var(--rotulo);text-transform:uppercase">A preparar/emitir</div><div class="fr" style="font-size:22px;color:var(--ambar)">'+prep+'</div></div>'+
       '<div><div style="font-size:11px;font-weight:700;color:var(--rotulo);text-transform:uppercase">Clientes</div><div class="fr" style="font-size:22px">'+ST.clientes.length+'</div></div>'+
     '</div>';
  h+='<div class="sec-label"><i class="ph-duotone ph-receipt"></i> Notas</div>';
  if(!total){
    h+='<div class="empty"><i class="ph-duotone ph-receipt"></i>Nenhuma nota ainda.<br>Toque em <b>Nova nota</b> pra começar.</div>';
  }else{
    ST.notas.forEach(n=>{
      const c=calcNota(n);
      h+='<div class="card nota-card" data-nota="'+n.id+'">'+
         '<div class="top"><div class="nome">'+esc(n.tomador_nome||'(sem cliente)')+'</div><span class="stt '+(n.status||'preparar')+'">'+stLabel(n.status)+'</span></div>'+
         '<div class="meta">'+
           '<span><i class="ph-duotone ph-note-pencil"></i>'+esc((n.descricao||'—').slice(0,46))+'</span>'+
           (n.data_evento?'<span><i class="ph-duotone ph-calendar-blank"></i>'+fmtData(n.data_evento)+'</span>':'')+
           (n.nfse_numero?'<span><i class="ph-duotone ph-hash"></i>'+esc(n.nfse_numero)+'</span>':'')+
         '</div>'+
         '<div class="top" style="margin-top:8px"><span style="font-size:12px;color:var(--t3)">Valor</span><span class="valor">'+brl(n.valor)+'</span></div>'+
         '</div>';
    });
  }
  v.innerHTML=h;
  $$('[data-nota]').forEach(el=>el.onclick=()=>detalheNota(el.dataset.nota));
}
function stLabel(s){ return s==='emitida'?'Emitida':(s==='cancelada'?'Cancelada':'A preparar'); }

/* ====== formulário de nota (nova ou edição) ====== */
function viewForm(v,n){
  n=n||{};
  const cliOpts=['<option value="">— novo cliente / avulso —</option>']
    .concat(ST.clientes.map(c=>'<option value="'+c.id+'"'+(n.tomador_id===c.id?' selected':'')+'>'+esc(c.nome)+(c.doc?(' · '+esc(c.doc)):'')+'</option>')).join('');
  const aliqDef=(n.iss_aliquota!=null?n.iss_aliquota:(CFG.aliq!=null?CFG.aliq:''));
  const codDef=(n.cod_servico!=null?n.cod_servico:(CFG.cod||''));
  let h='';
  h+='<div class="sec-label"><i class="ph-duotone ph-user"></i> Cliente (tomador)</div>';
  h+='<div class="card" style="padding:14px 15px">';
  h+='<div class="fld"><label>Cliente salvo</label><select id="f_cli">'+cliOpts+'</select><div class="hint">Escolha um cliente já cadastrado, ou preencha abaixo pra um avulso.</div></div>';
  h+='<div class="fld"><label>Nome / Razão social</label><input id="f_nome" value="'+esc(n.tomador_nome||'')+'" placeholder="Nome do tomador"></div>';
  h+='<div class="row2"><div class="fld"><label>CPF / CNPJ</label><input id="f_doc" value="'+esc(n.tomador_doc||'')+'" placeholder="só números"></div>'+
     '<div class="fld"><label>E-mail</label><input id="f_email" value="'+esc(n.tomador_email||'')+'" placeholder="pra enviar a nota"></div></div>';
  h+='<div class="fld"><label>Endereço</label><input id="f_end" value="'+esc(n.tomador_endereco||'')+'" placeholder="rua, nº, bairro, cidade/UF"></div>';
  h+='</div>';

  h+='<div class="sec-label"><i class="ph-duotone ph-note-pencil"></i> Serviço</div>';
  h+='<div class="card" style="padding:14px 15px">';
  h+='<div class="fld"><label>Descrição do serviço / evento</label><textarea id="f_desc" placeholder="Ex.: Serviço de buffet para evento...">'+esc(n.descricao||'')+'</textarea></div>';
  h+='<div class="row2"><div class="fld"><label>Data do evento</label><input id="f_dataev" type="date" value="'+esc(n.data_evento||'')+'"></div>'+
     '<div class="fld"><label>Código do serviço</label><input id="f_cod" value="'+esc(codDef)+'" placeholder="item da lista / município"></div></div>';
  h+='</div>';

  h+='<div class="sec-label"><i class="ph-duotone ph-currency-circle-dollar"></i> Valores</div>';
  h+='<div class="card" style="padding:14px 15px">';
  h+='<div class="row2"><div class="fld"><label>Valor do serviço (R$)</label><input id="f_valor" inputmode="decimal" value="'+(n.valor!=null?String(n.valor).replace('.',','):'')+'" placeholder="0,00"></div>'+
     '<div class="fld"><label>Deduções (R$)</label><input id="f_ded" inputmode="decimal" value="'+(n.deducoes?String(n.deducoes).replace('.',','):'')+'" placeholder="0,00"></div></div>';
  h+='<div class="fld"><label>Alíquota ISS (%)</label><input id="f_aliq" inputmode="decimal" value="'+(aliqDef!==''?String(aliqDef).replace('.',','):'')+'" placeholder="ex.: 2,5"></div>';
  h+='<label class="chkrow"><input type="checkbox" id="f_retido"'+(n.iss_retido?' checked':'')+'> ISS retido pelo tomador</label>';
  h+='<div class="calc" id="f_calc"></div>';
  h+='</div>';

  h+='<div class="fld"><label>Observações</label><textarea id="f_obs" placeholder="qualquer detalhe pra lembrar">'+esc(n.obs||'')+'</textarea></div>';

  h+='<div style="margin-top:16px">';
  h+='<button class="btn" id="f_salvar"><i class="ph-duotone ph-check"></i> '+(n.id?'Salvar alterações':'Salvar nota')+'</button>';
  if(n.id) h+='<button class="btn o" id="f_cancelar"><i class="ph-duotone ph-x"></i> Cancelar edição</button>';
  h+='</div>';
  v.innerHTML=h;

  const recalc=()=>{
    const d={valor:num($('#f_valor').value),deducoes:num($('#f_ded').value),iss_aliquota:num($('#f_aliq').value),iss_retido:$('#f_retido').checked};
    const c=calcNota(d);
    $('#f_calc').innerHTML=
      '<div class="cl">Base de cálculo <b>'+brl(c.base)+'</b></div>'+
      '<div class="cl">ISS ('+(num($('#f_aliq').value)||0).toLocaleString('pt-BR')+'%) <b>'+brl(c.iss)+'</b>'+($('#f_retido').checked?' <span style="color:var(--ambar)">retido</span>':'')+'</div>'+
      '<div class="cl tot">Valor líquido <b>'+brl(c.liquido)+'</b></div>';
  };
  ['f_valor','f_ded','f_aliq'].forEach(id=>$('#'+id).oninput=recalc);
  $('#f_retido').onchange=recalc; recalc();

  $('#f_cli').onchange=function(){
    const c=ST.clientes.find(x=>x.id===this.value);
    if(c){ $('#f_nome').value=c.nome||''; $('#f_doc').value=c.doc||''; $('#f_email').value=c.email||''; $('#f_end').value=c.endereco||''; }
  };
  if(n.id && $('#f_cancelar')) $('#f_cancelar').onclick=()=>{ ST.edit=null; ST.tab='notas'; render(); };
  $('#f_salvar').onclick=()=>salvarNota(n);
}

async function salvarNota(n){
  const body={
    tomador_id: $('#f_cli').value||null,
    tomador_nome: $('#f_nome').value.trim(),
    tomador_doc: $('#f_doc').value.trim()||null,
    tomador_email: $('#f_email').value.trim()||null,
    tomador_endereco: $('#f_end').value.trim()||null,
    descricao: $('#f_desc').value.trim()||null,
    data_evento: $('#f_dataev').value||null,
    cod_servico: $('#f_cod').value.trim()||null,
    valor: num($('#f_valor').value),
    deducoes: num($('#f_ded').value),
    iss_aliquota: num($('#f_aliq').value),
    iss_retido: $('#f_retido').checked,
    obs: $('#f_obs').value.trim()||null
  };
  if(!body.tomador_nome){ toast('Informe o nome do cliente'); return; }
  if(!body.valor){ toast('Informe o valor do serviço'); return; }
  // guarda defaults de alíquota e código pra próxima
  CFG.aliq=body.iss_aliquota; CFG.cod=body.cod_servico||''; saveCfg();
  try{
    if(n && n.id){
      body.updated_at=new Date().toISOString();
      await api('lola_nfse?id=eq.'+n.id,{method:'PATCH',headers:Object.assign({},H,{Prefer:'return=minimal'}),body:JSON.stringify(body)});
      toast('Nota atualizada');
    }else{
      body.status='preparar'; body.criado_por=USER||null;
      await api('lola_nfse',{method:'POST',headers:Object.assign({},H,{Prefer:'return=minimal'}),body:JSON.stringify(body)});
      toast('Nota salva');
    }
    ST.edit=null; ST.tab='notas'; await carregar();
  }catch(e){ toast('Erro ao salvar: '+e.message); }
}

/* ====== detalhe da nota ====== */
function detalheNota(id){
  const n=ST.notas.find(x=>x.id===id); if(!n) return;
  const c=calcNota(n);
  let h='<h3>'+esc(n.tomador_nome||'(sem cliente)')+'</h3>';
  h+='<div class="sub">'+esc(n.descricao||'—')+'</div>';
  h+='<div class="card" style="padding:13px 15px;margin-top:8px">';
  h+=linha('Status','<span class="stt '+(n.status||'preparar')+'">'+stLabel(n.status)+'</span>');
  if(n.data_evento) h+=linha('Evento',fmtData(n.data_evento));
  if(n.tomador_doc) h+=linha('CPF/CNPJ',esc(n.tomador_doc));
  h+=linha('Valor',brl(n.valor));
  h+=linha('ISS',brl(c.iss)+' ('+(+n.iss_aliquota||0).toLocaleString('pt-BR')+'%)'+(n.iss_retido?' · retido':''));
  h+=linha('Líquido',brl(c.liquido));
  if(n.nfse_numero) h+=linha('Nº da nota',esc(n.nfse_numero)+(n.nfse_data?(' · '+fmtData(n.nfse_data)):''));
  h+='</div>';

  h+='<button class="btn" id="d_resumo" style="margin-top:14px"><i class="ph-duotone ph-clipboard-text"></i> Resumo pra emissão</button>';
  if(n.status!=='emitida') h+='<button class="btn o" id="d_emitida"><i class="ph-duotone ph-check-circle"></i> Marcar como emitida</button>';
  h+='<button class="btn o" id="d_editar"><i class="ph-duotone ph-pencil-simple"></i> Editar</button>';
  if(n.status!=='cancelada') h+='<button class="btn o" id="d_cancelar"><i class="ph-duotone ph-prohibit"></i> Marcar cancelada</button>';
  h+='<button class="btn d" id="d_excluir"><i class="ph-duotone ph-trash"></i> Excluir</button>';
  h+='<button class="btn ghost" onclick="closeSheet()">Fechar</button>';
  openSheet(h);

  $('#d_resumo').onclick=()=>resumoNota(n);
  if($('#d_emitida')) $('#d_emitida').onclick=()=>marcarEmitida(n);
  $('#d_editar').onclick=()=>{ closeSheet(); ST.tab='nova'; render(); viewForm($('#view'),n); };
  if($('#d_cancelar')) $('#d_cancelar').onclick=()=>mudarStatus(n,'cancelada');
  $('#d_excluir').onclick=()=>excluirNota(n);
}
function linha(l,v){ return '<div style="display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:13.5px;border-bottom:1px solid var(--fio)"><span style="color:var(--t3)">'+l+'</span><b style="text-align:right">'+v+'</b></div>'; }

function resumoNota(n){
  const c=calcNota(n);
  const L=[];
  L.push('NFS-e — resumo pra emissão (Lola)');
  L.push('');
  L.push('TOMADOR');
  L.push('Nome/Razão: '+(n.tomador_nome||''));
  if(n.tomador_doc) L.push('CPF/CNPJ: '+n.tomador_doc);
  if(n.tomador_endereco) L.push('Endereço: '+n.tomador_endereco);
  if(n.tomador_email) L.push('E-mail: '+n.tomador_email);
  L.push('');
  L.push('SERVIÇO');
  L.push('Discriminação: '+(n.descricao||'')+(n.data_evento?(' (evento em '+fmtData(n.data_evento)+')'):''));
  if(n.cod_servico) L.push('Código do serviço: '+n.cod_servico);
  L.push('');
  L.push('VALORES');
  L.push('Valor do serviço: '+brl(n.valor));
  if(+n.deducoes) L.push('Deduções: '+brl(n.deducoes));
  L.push('Base de cálculo: '+brl(c.base));
  L.push('Alíquota ISS: '+(+n.iss_aliquota||0).toLocaleString('pt-BR')+'%');
  L.push('Valor do ISS: '+brl(c.iss)+(n.iss_retido?' (retido pelo tomador)':' (não retido)'));
  L.push('Valor líquido: '+brl(c.liquido));
  if(n.obs){ L.push(''); L.push('OBS: '+n.obs); }
  const txt=L.join('\n');
  let h='<h3>Resumo pra emissão</h3><div class="sub">Copie e cole no site da prefeitura de Porto Alegre.</div>';
  h+='<div class="resumo" id="rz">'+esc(txt)+'</div>';
  h+='<button class="btn" id="rz_copy" style="margin-top:12px"><i class="ph-duotone ph-copy"></i> Copiar resumo</button>';
  h+='<button class="btn ghost" onclick="closeSheet()">Fechar</button>';
  openSheet(h);
  $('#rz_copy').onclick=function(){
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(()=>toast('Resumo copiado')).catch(()=>selCopy('rz')); }
    else selCopy('rz');
  };
}
function selCopy(id){ const el=document.getElementById(id); const r=document.createRange(); r.selectNodeContents(el); const s=window.getSelection(); s.removeAllRanges(); s.addRange(r); try{document.execCommand('copy');toast('Resumo copiado');}catch(e){toast('Selecione e copie manualmente');} }

function marcarEmitida(n){
  let h='<h3>Marcar como emitida</h3><div class="sub">Depois de emitir no site, anote o número da nota.</div>';
  h+='<div class="fld"><label>Número da NFS-e</label><input id="e_num" value="'+esc(n.nfse_numero||'')+'" placeholder="nº da nota emitida"></div>';
  h+='<div class="fld"><label>Data de emissão</label><input id="e_data" type="date" value="'+esc(n.nfse_data||hoje())+'"></div>';
  h+='<button class="btn" id="e_ok" style="margin-top:14px"><i class="ph-duotone ph-check"></i> Confirmar</button>';
  h+='<button class="btn ghost" onclick="closeSheet()">Cancelar</button>';
  openSheet(h);
  $('#e_ok').onclick=async()=>{
    const body={status:'emitida', nfse_numero:$('#e_num').value.trim()||null, nfse_data:$('#e_data').value||null, updated_at:new Date().toISOString()};
    try{ await api('lola_nfse?id=eq.'+n.id,{method:'PATCH',headers:Object.assign({},H,{Prefer:'return=minimal'}),body:JSON.stringify(body)}); closeSheet(); toast('Marcada como emitida'); await carregar(); }
    catch(e){ toast('Erro: '+e.message); }
  };
}
async function mudarStatus(n,st){
  try{ await api('lola_nfse?id=eq.'+n.id,{method:'PATCH',headers:Object.assign({},H,{Prefer:'return=minimal'}),body:JSON.stringify({status:st,updated_at:new Date().toISOString()})}); closeSheet(); toast('Status atualizado'); await carregar(); }
  catch(e){ toast('Erro: '+e.message); }
}
function excluirNota(n){
  let h='<h3>Excluir nota?</h3><div class="sub">Isso remove o registro desta nota do portal. Não afeta nenhuma nota já emitida na prefeitura.</div>';
  h+='<button class="btn d" id="x_ok" style="margin-top:14px"><i class="ph-duotone ph-trash"></i> Sim, excluir</button>';
  h+='<button class="btn ghost" onclick="closeSheet()">Não, voltar</button>';
  openSheet(h);
  $('#x_ok').onclick=async()=>{
    try{ await api('lola_nfse?id=eq.'+n.id,{method:'DELETE',headers:Object.assign({},H,{Prefer:'return=minimal'})}); closeSheet(); toast('Nota excluída'); await carregar(); }
    catch(e){ toast('Erro: '+e.message); }
  };
}

/* ====== clientes ====== */
function viewClientes(v){
  let h='<div class="sec-label"><i class="ph-duotone ph-users-three"></i> Clientes (tomadores)</div>';
  h+='<div class="dashed" id="cli_add" style="margin-bottom:12px"><i class="ph-duotone ph-plus"></i> Novo cliente</div>';
  if(!ST.clientes.length){ h+='<div class="empty"><i class="ph-duotone ph-users-three"></i>Nenhum cliente salvo ainda.</div>'; }
  else ST.clientes.forEach(c=>{
    h+='<div class="card cli-card" data-cli="'+c.id+'"><div class="av"><i class="ph-duotone ph-buildings"></i></div>'+
       '<div style="min-width:0"><b style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(c.nome)+'</b><small>'+esc(c.doc||'sem documento')+'</small></div>'+
       '<i class="ph-duotone ph-pencil-simple edit"></i></div>';
  });
  v.innerHTML=h;
  $('#cli_add').onclick=()=>formCliente(null);
  $$('[data-cli]').forEach(el=>el.onclick=()=>formCliente(ST.clientes.find(c=>c.id===el.dataset.cli)));
}
function formCliente(c){
  c=c||{};
  let h='<h3>'+(c.id?'Editar cliente':'Novo cliente')+'</h3>';
  h+='<div class="fld"><label>Nome / Razão social</label><input id="c_nome" value="'+esc(c.nome||'')+'"></div>';
  h+='<div class="row2"><div class="fld"><label>CPF / CNPJ</label><input id="c_doc" value="'+esc(c.doc||'')+'"></div>'+
     '<div class="fld"><label>E-mail</label><input id="c_email" value="'+esc(c.email||'')+'"></div></div>';
  h+='<div class="fld"><label>Telefone</label><input id="c_tel" value="'+esc(c.telefone||'')+'"></div>';
  h+='<div class="fld"><label>Endereço</label><input id="c_end" value="'+esc(c.endereco||'')+'" placeholder="rua, nº, bairro, cidade/UF"></div>';
  h+='<button class="btn" id="c_ok" style="margin-top:14px"><i class="ph-duotone ph-check"></i> Salvar</button>';
  if(c.id) h+='<button class="btn d" id="c_del"><i class="ph-duotone ph-trash"></i> Excluir cliente</button>';
  h+='<button class="btn ghost" onclick="closeSheet()">Fechar</button>';
  openSheet(h);
  $('#c_ok').onclick=async()=>{
    const body={nome:$('#c_nome').value.trim(),doc:$('#c_doc').value.trim()||null,email:$('#c_email').value.trim()||null,telefone:$('#c_tel').value.trim()||null,endereco:$('#c_end').value.trim()||null};
    if(!body.nome){ toast('Informe o nome'); return; }
    try{
      if(c.id) await api('lola_nfse_tomadores?id=eq.'+c.id,{method:'PATCH',headers:Object.assign({},H,{Prefer:'return=minimal'}),body:JSON.stringify(body)});
      else { body.ativo=true; body.criado_por=USER||null; await api('lola_nfse_tomadores',{method:'POST',headers:Object.assign({},H,{Prefer:'return=minimal'}),body:JSON.stringify(body)}); }
      closeSheet(); toast('Cliente salvo'); await carregar();
    }catch(e){ toast('Erro: '+e.message); }
  };
  if(c.id) $('#c_del').onclick=async()=>{
    try{ await api('lola_nfse_tomadores?id=eq.'+c.id,{method:'PATCH',headers:Object.assign({},H,{Prefer:'return=minimal'}),body:JSON.stringify({ativo:false})}); closeSheet(); toast('Cliente removido'); await carregar(); }
    catch(e){ toast('Erro: '+e.message); }
  };
}

/* ====== tabs ====== */
$$('.tab').forEach(t=>t.onclick=()=>{ ST.tab=t.dataset.tab; render(); });
window.carregar=carregar;
carregar();
</script>
</body>
</html>
